hostname PE1
!
cfm version standard
cfm
！
mpls ip
mpls l2vpn
mpls ldp router-id Loopback1 force
mpls label protocol ldp
!
mpls ldp neighbor 3.3.3.3 targeted
!
interface GigabitEthernet1/0/1
 no shutdown
!
interface GigabitEthernet1/0/1.1
 encapsulation dot1Q 10
 xconnect 3.3.3.3 100 encapsulation mpls
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.1.1 255.255.255.252
 mpls ip
!
interface Loopback1
 ip address 1.1.1.1 255.255.255.255
!
router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.1.1.0 0.0.0.3 area 0
!
cfm md md1
 mep version 0
 level 3
 mep domain ma1
  mep crosscheck mpls l2vc 100
  mep interface GigabitEthernet1/0/1.1
   mep id 31 mep crosscheck inward
   mep ais enable
   mep ais mep 31 interval 60
   mep ais mep 31 vlan 10
  remote-mep interface GigabitEthernet1/0/2
   remote-mep id 32
   remote-mep ccm-receive enable
   remote-mep ais enable
!
end