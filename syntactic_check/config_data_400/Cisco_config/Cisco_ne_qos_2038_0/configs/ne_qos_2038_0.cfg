hostname DeviceA

class-map match-any dd
 match dscp af11

policy-map ac
 class dd
  set dscp af11

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.20.1.2 255.255.255.0

interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.10.1.1 255.255.255.0
 service-policy input ac

interface Loopback0
 ip address 1.1.1.1 255.255.255.255

router bgp 100
 neighbor 2.2.2.2 remote-as 200
 neighbor 2.2.2.2 ebgp-multihop 2
 neighbor 2.2.2.2 update-source Loopback0
 neighbor 10.20.1.1 remote-as 100
 address-family ipv4
  no synchronization
  redistribute connected
  neighbor 2.2.2.2 activate
  neighbor 2.2.2.2 route-map aa in
  neighbor 10.20.1.1 activate
 exit-address-family

ip route 2.2.2.2 255.255.255.255 10.20.1.1
ip route 10.10.1.0 255.255.255.0 GigabitEthernet2/0/0
ip route 10.20.1.0 255.255.255.0 GigabitEthernet1/0/0

router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.10.1.0 0.0.0.255 area 0
 network 10.20.1.0 0.0.0.255 area 0

route-map aa permit 10
 match community 10
 set qos-group 1

ip community-list 10 permit 10:10
end