hostname PE2
!
ptp clock ordinary domain 0 profile g8275.1
 !clock-port MASTER
 ! transport ipv4
 ! clock-class 6
 ! priority1 128
 ! priority2 128
 ! clock-accuracy 0xFE
 ! utc-offset 0
 ! clock-identity 0000.00FF.FE00.0000
  !
!
interface GigabitEthernet1/0/0
 no shutdown
 ptp enable
 ptp announce interval 1
 ptp sync interval 1
 ptp delay-req interval 1
 clock source internal
!
end