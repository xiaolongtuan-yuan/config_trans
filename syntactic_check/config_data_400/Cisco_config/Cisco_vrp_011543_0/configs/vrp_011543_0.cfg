hostname CE1
!
vlan 2
!
cfm version standard
cfm
!
ethernet cfm
 mep domain md3
  mep ma ma3 vlan 2
   mep interface GigabitEthernet1/0/1 outward
   mep ccm-send enable
   remote-mep mep-id 4
   remote-mep ccm-receive enable
   test-id 1 mep 3 remote-mep 4
   test-id 2 mep 3
   delay-measure two-way receive test-id 2
!
interface GigabitEthernet1/0/1
 switchport mode trunk
 switchport trunk allowed vlan 2
 no shutdown
!
end