hostname BRAS
!
ipv6 multicast-routing
!
aaa new-model
!
ipv6 access-list name1
 permit ipv6 any host FF1E::1
 permit ipv6 any host FF1E::2
!
aaa authentication login default none
aaa authorization exec default none
aaa accounting exec default none
!
!aaa domain wdomain
 authentication login default none
 accounting exec default none
!
ipv6 dhcp pool poolname
 dns-server 2001:4860:4860::8888
 domain-name example.com
 !address prefix 2001:db8:1::/64
!
interface GigabitEthernet1/0/0
 ipv6 address 2001:db8:1::1/64
 ipv6 pim sparse-mode
!
interface GigabitEthernet1/0/1.1
 encapsulation dot1Q 133
 ipv6 address autoconfig
 ipv6 enable
 ipv6 pim sparse-mode
 ipv6 mld join-group FF1E::1
 ipv6 mld join-group FF1E::2
!
ipv6 route 2001:db8:1::/64 GigabitEthernet1/0/0
!
end