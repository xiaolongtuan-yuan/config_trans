hostname HUAWEI

aaa group server radius rd1
 server 192.168.7.249 auth-port 1645 acct-port 1646

radius-server key 7 vS%796FO7%C~pB%CR=q;j}gSCqR-X6+P!.DYI@
radius-server attribute 32 include-in-access-req format-type extensible

interface Virtual-Template1
 ppp authentication chap

interface GigabitEthernet1/0/2

interface GigabitEthernet1/0/2.1
 encapsulation dot1Q 2
 pppoe enable group global
 access-session subscriber default-domain isp1
  authentication order radius
  authentication priority radius
  accounting order radius
  qos-policy out p1
  qos-policy in p1

class-map match-all none
class-map match-all p1
 match access-group 101

interface GigabitEthernet1/0/1
