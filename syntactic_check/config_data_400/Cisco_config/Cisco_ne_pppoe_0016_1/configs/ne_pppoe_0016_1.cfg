router ospf 1
 redistribute connected subnets
 network 10.1.2.0 0.0.0.255 area 0

interface Loopback1
 ip address 10.1.2.2 255.255.255.255

ip dhcp excluded-address 10.82.0.1

ip dhcp pool pool1
