hostname CE2

vlan 2

cfm mode standard
cfm
interface GigabitEthernet1/0/1
 switchport
 no shutdown
 switchport trunk allowed vlan 2

cfm md md1
 mep ma1
  remote-mep 3
  ccm-receive mep-id 3 interval 10
  ccm-receive mep-id 3
 mep mep-id 4 crosscheck mep-id 3 interface GigabitEthernet1/0/1
  ccm-send mep-id 4 interval 10
  ccm-send mep-id 4
  loss-measurement single-ended receive test-id 2
exit
