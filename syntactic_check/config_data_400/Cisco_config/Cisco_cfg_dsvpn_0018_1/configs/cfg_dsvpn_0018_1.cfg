hostname Hub2
!
! ACL配置（使用命名ACL）
ip access-list extended ACL-NHRP-PERMIT
 permit ip 192.168.0.0 0.0.0.255 any
!
ip access-list extended ACL-SPOKE-NETS
 permit ip 192.168.1.0 0.0.0.255 any
 permit ip 192.168.2.0 0.0.0.255 any
!
! NHRP配置
interface Tunnel0
 ip nhrp network-id 100
 ip nhrp redirect
 ip nhrp multicast dynamic
!
! 物理接口配置
interface GigabitEthernet1/0/0
 ip address 10.1.254.10 255.255.255.0
!
! 隧道接口配置
interface Tunnel0
 ip address 172.16.1.254 255.255.255.0
 tunnel source GigabitEthernet1/0/0
 !tunnel mode gre multipoint
 tunnel key 100
 !tunnel protection ipsec profile IPSEC-PROFILE shared
!
! Loopback接口
interface Loopback0
 ip address 192.168.0.2 255.255.255.255
!
! OSPF配置（简化版本）
router ospf 1
 router-id 192.168.0.2
 network 172.16.1.0 0.0.0.255 area 0
 network 192.168.0.2 0.0.0.0 area 0
 area 0 authentication message-digest
 passive-interface Loopback0
!
! 路由映射（用于NHRP或其他策略）
route-map RM-NHRP-PERMIT permit 10
 match ip address ACL-NHRP-PERMIT
!
route-map RM-SPOKE-NETS permit 10
 match ip address ACL-SPOKE-NETS
!
end