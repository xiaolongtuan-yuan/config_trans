hostname DeviceA

l2tp enable

aaa new-model
aaa authentication login default1 group radius
aaa accounting exec default1 start-stop group radius
aaa accounting network default1 start-stop group radius
aaa session-id common

radius-server host 10.20.20.1 auth-port 1812 acct-port 1813 key <key>

interface Virtual-Template1
 ppp authentication chap

interface GigabitEthernet2/0/0
 no shutdown

interface GigabitEthernet2/0/0.100
 no shutdown
 encapsulation dot1Q 100
 pppoe enable group Virtual-Template1
 ip address 1.1.1.1 255.255.255.255

interface Loopback0
 ip address 3.3.3.3 255.255.255.255

ip route 3.3.3.3 255.255.255.255 11.11.11.2

interface GigabitEthernet1/0/1.1
 no shutdown
 encapsulation dot1Q 1
 ip address 11.11.11.1 255.255.255.0

radius-server host 10.20.20.1 auth-port 1812 acct-port 1813 key <key>

l2tp-class lac1
 tunnel password <password>
 tunnel name lac1
 start l2tp ip 3.3.3.3
 tunnel source Loopback0

radius-server vsa send accounting
