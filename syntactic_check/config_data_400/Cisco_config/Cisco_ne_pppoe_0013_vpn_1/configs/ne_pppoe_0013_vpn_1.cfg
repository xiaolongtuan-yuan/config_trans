hostname DeviceA
!
interface Virtual-Template1
 ppp authentication chap
!
interface GigabitEthernet0/1/1
!
interface GigabitEthernet0/1/1.1
 pppoe enable group Virtual-Template1
 bridge-group 1
 bridge-group 1 subscriber-loop-control
 bridge-group 1 spanning-disabled
!
ip vrf isp1
 rd 100:1
 route-target export 100:100
 route-target import 100:100
!
interface GigabitEthernet1/0/1
 ip address 10.1.1.1 255.255.255.0
!
radius-server host 192.168.7.249 auth-port 1645 acct-port 1646 key %^%#clY:%[]x='-RMNJus[s/VJ:3YBq3<..|.{'xgbp+%^%
radius-server source-ports 1645-1646
radius-server type extended
radius-server vsa send accounting
!
ip dhcp pool pool1
 network 10.82.0.0 255.255.255.0
 default-router 10.82.0.1
 dns-server 192.168.7.252
!
aaa new-model
aaa authentication login none none
aaa accounting none
!
ip domain-name default0
ip domain-name default1
ip domain-name default_admin
!
ip domain-name isp1
aaa authentication login none local
aaa accounting none
aaa group server radius rd1
 server-private 192.168.7.249 auth-port 1645 acct-port 1646
!
ip local pool pool1 10.82.0.2 10.82.0.200

