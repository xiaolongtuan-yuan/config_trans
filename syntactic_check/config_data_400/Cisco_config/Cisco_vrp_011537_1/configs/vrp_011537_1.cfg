hostname PE1

cfm version standard
cfm

mpls ldp router-id Loopback0 force
mpls ldp discovery targeted-hello accept
mpls ldp discovery targeted-hello send
mpls l2vpn

interface GigabitEthernet1/0/1.1
 encapsulation dot1Q 1
 xconnect vfi ldp1

interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.1.1 255.255.255.0
 mpls ip
 mpls ldp autoconfig

interface Loopback0
 ip address 2.2.2.2 255.255.255.0

router ospf 1
 router-id 2.2.2.2 area 0
 network 2.2.2.2 0.0.0.0 area 0
 network 10.1.1.0 0.0.0.255 area 0

vfi ldp1 manual
 vpn id 1
 neighbor 1.1.1.1 pw-id 1

cfm version standard
cfm enable

cfm domain md
 service ma1 level 0
  map vsi ldp1
  mep domain md ma ma1 mep-id 1
   interface GigabitEthernet1/0/1.1 inward
   cfm mep md md ma ma1 mep-id 1 ccm-send enable
   cfm mep md md ma ma1 mep-id 1 remote-mep mep-id 2
   cfm mep md md ma ma1 mep-id 1 remote-mep ccm-receive enable
   cfm mep md md ma ma1 mep-id 1 loss-measurement test-id 1 peer-mep-id 2
   cfm mep md md ma ma1 mep-id 1 loss-measurement test-id 1 dual-ended continual

cfm domain md
 service ma2 level 0
  map vsi ldp1
  mep domain md ma ma2 mep-id 4
   interface GigabitEthernet1/0/1.1 outward
   cfm mep md md ma ma2 mep-id 4 ccm-send enable
   cfm mep md md ma ma2 mep-id 4 remote-mep mep-id 3
   cfm mep md md ma ma2 mep-id 4 remote-mep ccm-receive enable
   cfm mep md md ma ma2 mep-id 4 loss-measurement test-id 2 peer-mep-id 3
   cfm mep md md ma ma2 mep-id 4 loss-measurement test-id 2 dual-ended continual

end