hostname HUAWEI

ip dhcp excluded-address 172.30.0.8
!
ip dhcp pool pool1
 network 172.30.0.0 255.255.255.0
 default-router 172.30.0.1
!

aaa new-model
aaa authentication login default local
aaa authorization network default local
aaa accounting exec default start-stop group radius
aaa authentication login local_auth local
aaa group server radius radius_group
 !server <IP_address> auth-port 1812 acct-port 1813 key 0 <shared_key>
!

aaa authentication login domain_auth group radius_group local
!

interface GigabitEthernet1/0/2
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 authentication event fail action next-method
 authentication event server dead action authorize voice
 authentication event server alive action reinitialize
 authentication host-mode multi-auth
 authentication order mab dot1x
 authentication priority mab dot1x
 authentication port-control auto
 mab
 dot1x pae authenticator
 dot1x timeout tx-period 3
 dot1x max-reauth-req 3
 dot1x max-req 3
 dot1x max-start 3
 dot1x reauthentication
 dot1x critical eapol
 dot1x timeout quiet-period 5
 dot1x timeout server-timeout 10
 dot1x timeout tx-period 3
 dot1x timeout supp-timeout 5
 dot1x max-req-retries 3
 dot1x auth-fail vlan 30
 dot1x auth-fail max-attempts 3
 dot1x auth-fail action authorize vlan 30
!

ip dhcp snooping
ip dhcp snooping vlan 10
ip arp inspection vlan 10
!

mac address-table static 00e0.fc12.3456 vlan 10 interface GigabitEthernet1/0/2
!

username printer secret 0 %^%#4*RHO=w*}.d\>j09'Z:%=:co~p\w9'G-^|-zR'N4%^%#
!

radius-server host <IP_address> auth-port 1812 acct-port 1813 key 0 <shared_key>
!
end