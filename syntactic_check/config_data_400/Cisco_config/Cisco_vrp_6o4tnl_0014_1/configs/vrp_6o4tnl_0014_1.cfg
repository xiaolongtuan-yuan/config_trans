hostname DeviceA

interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.1.1.1 255.255.255.0

interface GigabitEthernet1/0/2
 no shutdown
 ipv6 enable
 ipv6 address 2001:db8:101:101::1/64

interface Tunnel1
 ipv6 enable
 ipv6 address 2001:db8:101:100::1/56
 tunnel mode ipv6ip 6rd
 tunnel source GigabitEthernet1/0/1
 tunnel 6rd prefix 2001:db8::/32
 tunnel 6rd prefix-length 8
 tunnel 6rd border-relay 10.1.1.2

ipv6 route 2001:db8::/32 Tunnel1

end
