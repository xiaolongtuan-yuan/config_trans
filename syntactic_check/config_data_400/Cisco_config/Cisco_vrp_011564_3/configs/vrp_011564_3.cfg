hostname PE2

! EVPN配置
l2vpn evpn instance 1 vlan-based
 !rd 200:1
 !route-target import 1:1
 !route-target export 1:1
!

! Bridge Domain配置
bridge-domain 10
 !member evpn-instance 1
!

! 接口配置
interface GigabitEthernet1/0/1.1
 encapsulation dot1Q 2
 service instance 2 ethernet
  rewrite ingress tag pop 1 symmetric
  bridge-domain 10
!

! CFM配置（Cisco标准语法）
ethernet cfm
 !domain MD1 level 3
  service MA1 evc EVPN_BD10
   !continuity-check
   !mep 3 interface GigabitEthernet1/0/1.1 outward
   ! continuity-check transmission interval 30s
   ! continuity-check static remote-mep 4
!
end