hostname CE2

vlan 2

cfm version standard
cfm

interface GigabitEthernet1/0/1
 switchport mode trunk
 switchport trunk allowed vlan 2
 no shutdown

cfm
  domain md1
    ma ma1
      map vlan 2
      mep 4 interface GigabitEthernet1/0/1 direction outward
      mep 4 ccm-send enable
      remote-mep 3
      remote-mep 3 ccm-receive enable
      test-id 2 mep 4 remote-mep 3
      loss-measurement dual-ended continual test-id 2


