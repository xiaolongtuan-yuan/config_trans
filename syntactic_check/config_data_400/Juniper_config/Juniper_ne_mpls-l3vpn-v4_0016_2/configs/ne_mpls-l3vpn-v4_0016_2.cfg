set system host-name PE2

set routing-options router-id 2.2.2.9

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 200:1
set routing-instances vpn1 vrf-target target:1:1
set routing-instances vpn1 vrf-import vpn1-import
set routing-instances vpn1 vrf-export vpn1-export

set routing-instances vpn2 instance-type vrf
set routing-instances vpn2 route-distinguisher 200:2
set routing-instances vpn2 vrf-target target:2:2
set routing-instances vpn2 vrf-import vpn2-import
set routing-instances vpn2 vrf-export vpn2-export

set protocols mpls interface ge-0/0/1
set protocols mpls interface ge-0/0/2
set protocols ldp interface ge-0/0/2

set interfaces ge-0/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-0/0/0 unit 0 vlan-id 1
set routing-instances vpn2 interface ge-0/0/0.0

set interfaces ge-0/0/1 unit 0 family inet address 192.168.1.2/24
set protocols mpls interface ge-0/0/1

set interfaces ge-0/0/2 unit 0 family inet address 10.3.1.1/24
set routing-instances vpn1 interface ge-0/0/2.0

set interfaces lo0 unit 0 family inet address 2.2.2.9/32

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0

set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address 2.2.2.9
set protocols bgp group IBGP neighbor 1.1.1.9 peer-as 100
set protocols bgp group IBGP family inet unicast
set protocols bgp group IBGP family inet-vpn unicast

set routing-instances vpn1 routing-options static route 0.0.0.0/0 next-hop 10.3.1.1
set routing-instances vpn2 routing-options static route 0.0.0.0/0 next-hop 10.2.1.1
