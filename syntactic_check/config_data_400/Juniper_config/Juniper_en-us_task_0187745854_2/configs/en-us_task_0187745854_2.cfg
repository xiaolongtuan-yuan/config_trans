set system host-name ASBR1

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set interfaces ge-0/0/0 unit 0 family inet address 10.10.2.2/24
set protocols mpls interface ge-0/0/0.0

set interfaces ge-0/0/1 unit 0 family inet address 10.10.1.2/24
set protocols mpls interface ge-0/0/1.0

set protocols mpls label-switched-path lsp-to-node priority 5 5
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0
set protocols mpls ldp transport-address 2.2.2.2

set protocols bgp group EBGP-TO-AS100 type external
set protocols bgp group EBGP-TO-AS100 neighbor 1.1.1.1 peer-as 100
set protocols bgp group EBGP-TO-AS100 local-address 2.2.2.2
set protocols bgp group EBGP-TO-AS200 type external
set protocols bgp group EBGP-TO-AS200 neighbor 10.10.2.3 peer-as 200
set protocols bgp group EBGP-TO-AS200 local-address 10.10.2.2

set protocols bgp group EBGP-TO-AS100 family inet unicast
set protocols bgp group EBGP-TO-AS200 family inet unicast
set protocols bgp group EBGP-TO-AS100 family inet-vpn unicast
set protocols bgp group EBGP-TO-AS200 family inet-vpn unicast

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf traffic-engineering

set protocols bgp group EBGP-TO-AS100 family l2vpn signaling
set protocols bgp group EBGP-TO-AS200 family l2vpn signaling

set protocols mpls traffic-engineering
set protocols mpls lsp load-balance-by-flow
