set system host-name CE1
set vlans vlan-2 vlan-id 2

set protocols cfm version standard
set protocols cfm domain md3 association ma3 vlan 2 mep 3 interface ge-1/0/1 direction outward
set protocols cfm domain md3 association ma3 vlan 2 mep 3 interface ge-1/0/1 ccm send enable
set protocols cfm domain md3 association ma3 vlan 2 mep 3 interface ge-1/0/1 ccm receive enable
set protocols cfm domain md3 association ma3 vlan 2 mep 3 interface ge-1/0/1 remote-mep 4
set protocols cfm domain md3 association ma3 vlan 2 mep 3 interface ge-1/0/1 test-id 1 local-mep 3 remote-mep 4
set protocols cfm domain md3 association ma3 vlan 2 mep 3 interface ge-1/0/1 test-id 2 local-mep 3
set protocols cfm domain md3 association ma3 vlan 2 mep 3 interface ge-1/0/1 delay-measurement test-id 2 type two-way

set interfaces ge-1/0/1 unit 0 family ethernet-switching port-mode trunk
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members vlan-2
