set system host-name Device1

!set protocols ptp mode boundary
!set protocols ptp clock-mode boundary
!set protocols ptp profile g82751
!set protocols ptp domain 44
!set protocols ptp priority1 128
!set protocols ptp priority2 128

set interfaces ge-0/0/0 unit 0 family ethernet-switching
!set interfaces ge-0/0/0 unit 0 family ptp
!set protocols ptp interface ge-0/0/0.0
!set protocols ptp interface ge-0/0/0.0 clock-quality priority1 10

set interfaces ge-0/0/1 unit 0 family ethernet-switching
!set interfaces ge-0/0/1 unit 0 family ptp
!set protocols ptp interface ge-0/0/1.0

set interfaces ge-0/0/2 unit 0 family ethernet-switching
!set interfaces ge-0/0/2 unit 0 family ptp
!set protocols ptp interface ge-0/0/2.0
!set protocols ptp interface ge-0/0/2.0 clock-quality priority1 20