set interfaces ge-0/0/0 unit 0 family ethernet-switching clock-source internal
set interfaces ge-0/0/0 unit 0 family ethernet-switching ptp clock-priority 10
set interfaces ge-0/0/0 unit 0 family ethernet-switching ptp enable
!
set interfaces ge-0/0/1 unit 0 family ethernet-switching clock-source internal
set interfaces ge-0/0/1 unit 0 family ethernet-switching ptp enable
!
set interfaces ge-0/0/2 unit 0 family ethernet-switching ptp disable notslave
set interfaces ge-0/0/2 unit 0 family ethernet-switching clock-source internal
set interfaces ge-0/0/2 unit 0 family ethernet-switching ptp clock-priority 20
set interfaces ge-0/0/2 unit 0 family ethernet-switching ptp enable
!
