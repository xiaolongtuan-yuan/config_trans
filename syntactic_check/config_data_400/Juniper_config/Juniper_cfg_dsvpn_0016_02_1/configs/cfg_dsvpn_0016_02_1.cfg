set system host-name Spoke1

set interfaces ge-1/0/0 unit 0 family inet address 10.1.2.10/24
set interfaces ge-1/0/0 unit 0 tunnel source lo0.0
set interfaces ge-1/0/0 unit 0 encapsulation gre
set security ipsec vpn <IPSEC_PROFILE_NAME> bind-interface ge-1/0/0.0

set interfaces lo0 unit 0 family inet address 192.168.1.1/32

set interfaces gr-1/0/0 unit 0 family inet address 172.16.1.2/24
set interfaces gr-1/0/0 unit 0 tunnel source ge-1/0/0.0
set interfaces gr-1/0/0 unit 0 tunnel destination dynamic
set security ipsec vpn <IPSEC_PROFILE_NAME> bind-interface gr-1/0/0.0

set routing-options router-id 172.16.1.2
set protocols ospf area 0.0.0.0 interface gr-1/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0

set routing-options router-id 10.1.2.10
set protocols ospf area 0.0.0.1 interface ge-1/0/0.0
