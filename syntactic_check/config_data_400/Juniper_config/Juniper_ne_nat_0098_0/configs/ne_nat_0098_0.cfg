set system host-name CGN1

set firewall family inet filter ACL-3001 term 1 from source-address 192.168.10.0/24
set firewall family inet filter ACL-3001 term 1 then accept

set firewall family inet filter POLICY1 term 1 from filter ACL-3001
set firewall family inet filter POLICY1 term 1 then nat destination pool NAT_INSTANCE_1

set interfaces ge-2/0/0 unit 0 family inet address 192.168.10.1/24
set interfaces ge-2/0/0 unit 0 family inet filter input POLICY1
set interfaces ge-2/0/0 disable false  # 启用接口

set interfaces lo0 unit 0 family inet address 11.11.11.100/24

set security nat source rule-set NAT-RULES from zone trust
set security nat source rule-set NAT-RULES to zone untrust
set security nat source rule-set NAT-RULES rule NAT1 match source-address 192.168.10.0/24
set security nat source rule-set NAT-RULES rule NAT1 match destination-address 0.0.0.0/0
set security nat source rule-set NAT-RULES rule NAT1 then source-nat interface

set interfaces service-engine 1/0/0 unit 0 family inet address 10.1.1.1/24
set security zones security-zone untrust interfaces service-engine 1/0/0.0

set routing-options static route 0.0.0.0/0 next-hop 10.1.1.1
