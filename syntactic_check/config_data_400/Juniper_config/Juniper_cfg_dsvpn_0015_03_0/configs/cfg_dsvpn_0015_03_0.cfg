set system host-name Hub

# GRE Tunnel Configuration
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.10/24
set interfaces ge-0/0/0 unit 0 tunnel source lo0.0
set interfaces ge-0/0/0 unit 0 tunnel destination 172.16.1.2
set interfaces ge-0/0/0 unit 0 tunnel key 100
set security ipsec vpn GRE-PROF bind-interface ge-0/0/0.0

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 192.168.0.1/32

# Second GRE Tunnel Configuration
set interfaces gr-0/0/0 unit 0 family inet address 172.16.1.1/24
set interfaces gr-0/0/0 unit 0 tunnel source ge-0/0/0.0
set interfaces gr-0/0/0 unit 0 tunnel destination 172.16.1.2
set interfaces gr-0/0/0 unit 0 tunnel key 200
set security ipsec vpn GRE-PROF bind-interface gr-0/0/0.0

# BGP Configuration
set protocols bgp group EXTERNAL-PEERS type external
set protocols bgp group EXTERNAL-PEERS local-as 100
set protocols bgp group EXTERNAL-PEERS neighbor 172.16.1.2 peer-as 200
set protocols bgp group EXTERNAL-PEERS neighbor 172.16.1.3 peer-as 300
set protocols bgp group EXTERNAL-PEERS export redistribute-ospf
set protocols bgp group EXTERNAL-PEERS family inet unicast

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.1 interface ge-0/0/0.0
