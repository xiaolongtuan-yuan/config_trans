set system host-name Hub1

set firewall family inet filter ACL2000 term 1 from source-address 192.168.0.0/24
set firewall family inet filter ACL2000 term 1 then accept

set firewall family inet filter ACL2001 term 1 from source-address 192.168.1.0/24
set firewall family inet filter ACL2001 term 2 from source-address 192.168.2.0/24
set firewall family inet filter ACL2001 term 1 then accept
set firewall family inet filter ACL2001 term 2 then accept

set policy-options policy-statement ROUTE-MAP-1 term 1 from filter ACL2000
set policy-options policy-statement ROUTE-MAP-1 term 1 then accept

set policy-options policy-statement ROUTE-MAP-2 term 1 from filter ACL2001
set policy-options policy-statement ROUTE-MAP-2 term 1 then accept

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.10/24
set interfaces ge-1/0/0 tunnel-source 10.1.1.10
set interfaces ge-1/0/0 tunnel-mode gre

set interfaces lo0 unit 0 family inet address 192.168.0.1/32

set interfaces gr-0/0/0 unit 0 family inet address 172.16.1.1/24
set interfaces gr-0/0/0 unit 0 tunnel source ge-1/0/0
set interfaces gr-0/0/0 unit 0 tunnel mode gre
set interfaces gr-0/0/0 unit 0 tunnel-key 0
set security ipsec vpn <profile-name> bind-interface gr-0/0/0

set protocols ospf area 0 interface gr-0/0/0
set protocols ospf area 0 interface gr-0/0/0.0 network-type p2mp
set protocols ospf area 0 network 172.16.1.0/24
set protocols ospf area 1 network 10.1.1.0/24
set protocols ospf area 0 network 192.168.0.0/24

set protocols ospf export ROUTE-MAP-1
set protocols ospf import ROUTE-MAP-2

set routing-options static route 172.16.1.0/24 discard
set routing-options static route 10.1.1.0/24 discard
set routing-options static route 192.168.0.0/24 discard
