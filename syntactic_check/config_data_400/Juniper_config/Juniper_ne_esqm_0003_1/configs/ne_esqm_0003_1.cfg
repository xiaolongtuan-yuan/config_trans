set system host-name SPE

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target target:2:2

set protocols ldp router-id lo0 force
set protocols mpls label-switched-path ldp

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 enable

set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 enable

set interfaces lo0 unit 1 family inet address 2.2.2.2/32

set protocols isis level 2 wide-metric-only
set protocols isis interface ge-1/0/0 level 2
set protocols isis interface ge-2/0/0 level 2
set protocols isis net 49.0000.0000.0002.00

set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address lo0
set protocols bgp group IBGP peer-as 100
set protocols bgp group IBGP neighbor 1.1.1.1
set protocols bgp group IBGP neighbor 3.3.3.3

set routing-options rib inet.0 import [ vpn1-import-policy ]
set routing-options rib inet.3 import [ vpn1-import-policy ]

set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-1/0/0
