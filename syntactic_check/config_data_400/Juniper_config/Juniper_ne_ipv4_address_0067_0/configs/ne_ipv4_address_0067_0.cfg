set system host-name HUAWEI

set access address-assignment pool pool2 family inet network 10.10.10.0/24
set access address-assignment pool pool2 family inet dhcp-attributes router 10.10.10.1
set access address-assignment pool pool2 family inet dhcp-attributes name-server 10.1.1.1

set system services dhcp excluded-address 10.1.1.1

set system authentication-order password
set system login user root authentication encrypted-password "<encrypted-password>"

set access profile pool2 address-range low 10.10.10.2 high 10.10.10.10

set interfaces ge-1/0/0 unit 1 encapsulation vlan-ccc
set interfaces ge-1/0/0 unit 1 vlan-id 1
set interfaces ge-1/0/0 unit 1 family inet dhcp

set interfaces ge-1/0/0 unit 0 encapsulation vlan-ccc
set interfaces ge-1/0/0 unit 0 vlan-id 1

set interfaces ge-3/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-3/0/0 unit 0 disable