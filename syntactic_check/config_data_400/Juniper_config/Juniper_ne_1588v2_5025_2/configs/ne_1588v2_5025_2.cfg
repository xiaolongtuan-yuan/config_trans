set system host-name PE1
!
set protocols ptp clock-domain 1
set protocols ptp priority 1
set protocols ptp device-type boundary-clock
set protocols ptp clock-source bits1 priority 2
set protocols ptp clock-source bits1 type 1pps input
set protocols ptp synchronization enable
!
set interfaces ge-0/0/0 unit 0 family inet address 172.16.0.1/24
set interfaces ge-0/0/0 unit 0 family ptp clock-domain 1
set interfaces ge-0/0/0 unit 0 family ptp delay-mechanism pdelay
set interfaces ge-0/0/0 unit 0 family ptp announce-interval 8
set interfaces ge-0/0/0 unit 0 family ptp min-delay-interval 10
set interfaces ge-0/0/0 unit 0 family ptp udp-source-ip 172.16.0.1
set interfaces ge-0/0/0 unit 0 family ptp udp-destination-ip 172.16.0.2
set interfaces ge-0/0/0 unit 0 family ptp udp-destination-mac 00:e0:fc:22:11:11
!
set interfaces ge-0/0/1 unit 0 family inet address 10.0.0.1/24
set interfaces ge-0/0/1 unit 0 family ptp announce-receipt-timeout 10
set interfaces ge-0/0/1 unit 0 family ptp udp-source-ip 10.0.0.1
set interfaces ge-0/0/1 unit 0 family ptp udp-destination-ip 10.0.0.2
set interfaces ge-0/0/1 unit 0 family ptp udp-destination-mac 00:e0:fc:22:22:22
!
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
!
