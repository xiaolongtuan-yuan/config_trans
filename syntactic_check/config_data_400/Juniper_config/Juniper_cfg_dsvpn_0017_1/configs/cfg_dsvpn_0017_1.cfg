set system host-name Spoke1

set interfaces ge-1/0/0 unit 0 family inet address 10.1.2.10/24

set interfaces lo0 unit 0 family inet address 192.168.1.1/32

# GRE隧道配置修正
set interfaces gr-0/0/0 unit 0 tunnel source 10.1.2.10
set interfaces gr-0/0/0 unit 0 family inet address 172.16.1.2/24
set interfaces gr-0/0/0 unit 0 tunnel destination 0.0.0.0  # 添加动态隧道目标

# IPSec配置修正
set security ike policy POLICY_NAME mode main
set security ike policy POLICY_NAME proposal-set standard
set security ike gateway GATEWAY_NAME ike-policy POLICY_NAME
set security ipsec vpn PROFILE_NAME bind-interface gr-0/0/0.0

# OSPF配置修正
set protocols ospf area 0.0.0.0 interface gr-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

# OSPF3配置修正（原OSPF2）
set protocols ospf3 area 0.0.0.1 interface ge-1/0/0.0
