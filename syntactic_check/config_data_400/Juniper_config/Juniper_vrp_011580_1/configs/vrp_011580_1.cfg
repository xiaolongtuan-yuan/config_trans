set system host-name PE1

set protocols cfm interface all

set routing-instances evpna instance-type virtual-router
set routing-instances evpna route-distinguisher 100:1
set routing-instances evpna vrf-import [ 1:1 ]
set routing-instances evpna vrf-export [ 1:1 ]

set interfaces ethernet-switching-options instance evpna
set routing-instances evpna interface ge-0/0/1.0 vlan-id 10
set routing-instances evpna route-target import 1:1
set routing-instances evpna route-target export 1:1
set routing-instances evpna vlan-id 10
set routing-instances evpna vxlan vni 10

set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members 10
set interfaces ge-0/0/1 unit 0 encapsulation vlan-bridge
set interfaces ge-0/0/1 unit 0 rewrite pop
set interfaces ge-0/0/1 unit 0 vlan-id 2

set protocols cfm ma ma1
set protocols cfm ma ma1 map bridge-domain 10
set protocols cfm ma ma1 mep 1 interface ge-0/0/1.1 outward
set protocols cfm ma ma1 mep 1 ccm-send
set protocols cfm ma ma1 remote-mep 2
set protocols cfm ma ma1 remote-mep 2 ccm-receive
set protocols cfm ma ma1 test-id 1 mep 1 remote-mep 2
set protocols cfm ma ma1 loss-measurement dual-ended test-id 1
