set system host-name Spoke1

set interfaces ge-1/0/0 unit 0 family inet address 10.1.2.10/24
set interfaces ge-1/0/0 tunnel source ge-1/0/0

set interfaces ge-1/0/1 unit 0 family inet address 192.168.1.1/24

set interfaces gr-0/0/0 unit 0 tunnel source ge-1/0/0
set interfaces gr-0/0/0 unit 0 tunnel destination 172.16.1.1
set interfaces gr-0/0/0 unit 0 family inet address 172.16.1.2/24
set interfaces gr-0/0/0 unit 0 encapsulation gre
set security ipsec vpn IPSEC-VPN bind-interface gr-0/0/0
set security ipsec vpn IPSEC-VPN ike ipsec-policy IPSEC-PROFILE

set protocols bgp group BGP-TO-PEER type external
set protocols bgp group BGP-TO-PEER local-address 172.16.1.2
set protocols bgp group BGP-TO-PEER neighbor 172.16.1.1 peer-as 100
set protocols bgp group BGP-TO-PEER family inet unicast
set protocols bgp group BGP-TO-PEER export [ EXPORT-OSPF-ROUTES ]

set policy-options policy-statement EXPORT-OSPF-ROUTES term 1 from protocol ospf
set policy-options policy-statement EXPORT-OSPF-ROUTES term 1 then accept

set protocols ospf area 0.0.0.0 interface ge-1/0/1
set protocols ospf area 0.0.0.0 network 192.168.1.0/24
set protocols ospf area 0.0.0.1 interface ge-1/0/0
set protocols ospf area 0.0.0.1 network 10.1.2.0/24

