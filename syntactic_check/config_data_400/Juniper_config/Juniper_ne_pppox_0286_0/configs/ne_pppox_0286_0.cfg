set system host-name PE1

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols mpls interface ge-1/0/0.0

set interfaces ge-5/0/0 unit 1 encapsulation vlan-vpls
set interfaces ge-5/0/0 unit 1 vlan-id 1
set protocols l2circuit neighbor 3.3.3.9 interface ge-5/0/0.1 virtual-circuit-id 101 encapsulation-type mpls

set interfaces lo0 unit 1 family inet address 1.1.1.9/32

set protocols ospf area 0 interface ge-1/0/0.0
set protocols ospf area 0 interface lo0.1

set protocols ldp interface ge-1/0/0.0
set protocols ldp targeted-neighbor 3.3.3.9
