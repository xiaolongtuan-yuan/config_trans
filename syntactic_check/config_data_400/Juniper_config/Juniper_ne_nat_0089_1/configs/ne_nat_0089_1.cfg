set system host-name HUAWEI

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set security zones security-zone trust interfaces ge-0/0/0.0

set interfaces ge-0/0/1 unit 0 family inet address 11.11.11.101/24
set security zones security-zone untrust interfaces ge-0/0/1.0

set security nat static rule-set static-nat-subnet from zone trust
set security nat static rule-set static-nat-subnet rule subnet-translate match source-address 10.0.0.0/24
set security nat static rule-set static-nat-subnet rule subnet-translate then static-nat prefix 11.11.11.0/24

set security nat static rule-set static-nat-port256 from zone trust
set security nat static rule-set static-nat-port256 rule tcp-256 match source-address 10.0.0.0/24
set security nat static rule-set static-nat-port256 rule tcp-256 match protocol tcp
set security nat static rule-set static-nat-port256 rule tcp-256 match source-port 256
set security nat static rule-set static-nat-port256 rule tcp-256 then static-nat prefix 11.11.11.0/24
set security nat static rule-set static-nat-port256 rule tcp-256 then static-nat mapped-port 256

set security nat static rule-set static-nat-port1023 from zone trust
set security nat static rule-set static-nat-port1023 rule tcp-1023 match source-address 10.0.0.0/24
set security nat static rule-set static-nat-port1023 rule tcp-1023 match protocol tcp
set security nat static rule-set static-nat-port1023 rule tcp-1023 match source-port 1023
set security nat static rule-set static-nat-port1023 rule tcp-1023 then static-nat prefix 11.11.11.0/24
set security nat static rule-set static-nat-port1023 rule tcp-1023 then static-nat mapped-port 1023

