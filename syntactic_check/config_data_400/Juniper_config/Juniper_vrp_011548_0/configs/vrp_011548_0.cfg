set system host-name PE1
set protocols oam cfm version standard
set protocols oam cfm maintenance-domain md1 level 3
set protocols oam cfm maintenance-domain md1 maintenance-association ma1
set protocols oam cfm maintenance-domain md1 maintenance-association ma1 mep 31 interface ge-1/0/1.1 direction inward
set protocols oam cfm maintenance-domain md1 maintenance-association ma1 mep 31 ais-enable
set protocols oam cfm maintenance-domain md1 maintenance-association ma1 mep 31 ais-interval 60
set protocols oam cfm maintenance-domain md1 maintenance-association ma1 mep 31 vlan 10
set protocols oam cfm maintenance-domain md1 maintenance-association ma1 remote-mep 32
set protocols oam cfm maintenance-domain md1 maintenance-association ma1 remote-mep 32 ccm-receive-enable
set protocols oam cfm maintenance-domain md1 maintenance-association ma1 remote-mep 32 ais-enable

set interfaces lo0 unit 1 family inet address 1.1.1.1/32
set interfaces ge-1/0/1 disable
set interfaces ge-1/0/1.0 family ethernet-switching vlan-tagging
set interfaces ge-1/0/1.1 vlan-id 10
set interfaces ge-1/0/1.1 encapsulation vlan-ccc
set protocols l2circuit neighbor 3.3.3.3 interface ge-1/0/1.1 virtual-circuit-id 100
set protocols l2circuit neighbor 3.3.3.3 interface ge-1/0/1.1 encapsulation-type mpls

set interfaces ge-1/0/2 disable
set interfaces ge-1/0/2 unit 0 family inet address 10.1.1.1/30
set protocols mpls interface ge-1/0/2

set protocols mpls ldp router-id lo0.1
set protocols mpls ldp targeted-neighbor 3.3.3.3

set routing-options router-id 1.1.1.1
set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-1/0/2
