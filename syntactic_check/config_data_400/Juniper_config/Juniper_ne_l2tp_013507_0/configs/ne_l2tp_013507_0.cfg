set system host-name DeviceA

set services l2tp enable
set services l2tp tunnel secret <tunnel-password>
set services l2tp tunnel source ge-1/0/0
set services l2tp tunnel destination 10.38.160.2

set system radius-server 10.20.20.1 port 1812 secret <shared-key>
set system accounting destination radius server 10.20.20.1 port 1813 secret <shared-key>

set system authentication-order [ radius password ]
set access profile default-auth-profile authentication-order radius
set access profile default-auth-profile radius-server 10.20.20.1

set interfaces ge-1/0/0 unit 0 family inet address 10.38.160.1/24

set interfaces ge-2/0/0 unit 100 encapsulation ppp-over-ether
set interfaces ge-2/0/0 unit 100 pppoe-server service-name pppoe
set interfaces ge-2/0/0 unit 100 pppoe-server dynamic-profile ppp-profile

set access profile ppp-profile authentication-order chap
set access profile ppp-profile ppp-options chap

set interfaces lt-1/0/0 unit 1 tunnel source ge-1/0/0
set interfaces lt-1/0/0 unit 1 tunnel destination 10.38.160.2
set interfaces lt-1/0/0 unit 1 family inet address 10.38.160.1/32

set system services accounting events ppp
set system services accounting interface ge-2/0/0.100
set system services accounting radius server 10.20.20.1 port 1813 secret <shared-key>
