set system host-name DeviceA

set services l2tp disable
set services l2tp tunnel secret "<tunnel-password>"
set services l2tp tunnel source-address 10.38.160.1
set services l2tp tunnel destination 10.38.160.2

set system radius-server 10.20.20.1 secret "<shared-key>"
set system accounting destination-server 10.20.20.1 secret "<shared-key>"

set access profile default-auth-profile authentication-order radius
set access profile default-auth-profile radius authentication-server 10.20.20.1

set interfaces ge-1/0/0 unit 0 family inet address 10.38.160.1/24

set interfaces ge-2/0/0 flexible-vlan-tagging
set interfaces ge-2/0/0 encapsulation flexible-ethernet-services
set interfaces ge-2/0/0 unit 100 encapsulation ppp-over-ether

set interfaces lt-1/0/0 unit 1 tunnel source-address 10.38.160.1
set interfaces lt-1/0/0 unit 1 tunnel destination 10.38.160.2
set interfaces lt-1/0/0 unit 1 family inet
