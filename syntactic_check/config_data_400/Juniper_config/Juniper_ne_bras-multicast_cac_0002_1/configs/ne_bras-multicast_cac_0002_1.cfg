set system host-name BRAS

set routing-options multicast

set system services dhcp pool bas-local range 10.0.0.2 to 10.0.255.254
set system services dhcp default-router 10.0.0.1
set system services dhcp network 10.0.0.0/16

set system accounting disable
set system domain-name ipv4
set system services dhcp pool ipv4 range 10.0.0.2 to 10.0.255.254
set system services dhcp network 10.0.0.0/16
set system services dhcp default-router 10.0.0.1
set system services dhcp multicast-policy policy1 out bandwidth 10000 level-1 8000 interface ge-0/0/0

set interfaces ge-0/0/0 unit 0 family inet address 10.0.0.1/16

set routing-options multicast interface ge-0/0/0.0
set protocols igmp interface ge-0/0/0.0

set system services dhcp access-profile bas
set system services dhcp authentication-order none
set system services dhcp default-domain ipv4
set system services dhcp multicast-copy by-session

set policy-options policy-statement policy1 term multicast then accept

set policy-options policy-statement out term multicast-traffic then accept

set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.1/24
set protocols pim rp static address 10.1.1.1
set protocols pim interface ge-0/0/1.0 mode sparse

set interfaces ge-0/0/2 unit 0 family inet address 10.1.2.1/24
set protocols pim interface ge-0/0/2.0 mode sparse

set chassis multicast-interface ge-0/0/0