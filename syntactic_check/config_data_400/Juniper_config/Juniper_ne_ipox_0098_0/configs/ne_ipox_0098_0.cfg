set system host-name HUAWEI

set access-radius-server 10.6.55.55 secret "050A051F010F" port 1645 authentication-port 1645 accounting-port 1646

set routing-options ipv6-router-advertisements interface all
set routing-options static route6 ::/0 next-hop fe80:: link-local

set interfaces ge-0/0/1 unit 0 family inet6 address 2001:DB8:3::/64 eui-64
set interfaces ge-0/0/1 unit 0 family inet6 address fe80:: link-local
set interfaces ge-0/0/1 unit 0 family inet6 dhcpv6-client

set interfaces ge-0/0/2 unit 0 family inet6 dhcpv6-client
set interfaces ge-0/0/2 unit 0 family inet6 address fe80:: link-local

set system services dhcpv6-pd client interface ge-0/0/2 pool pre1

set system authentication-order [ radius local ]
set system login class default authentication-order radius

set access-group default authentication-order radius
set access-group default accounting-order radius
set access-group default authorization-order radius

set system services radius-server 10.6.55.55 port 1645 secret "050A051F010F" accounting-port 1646

set system local-dhcpv6-pool pool1 address-range low 2001:DB8:2::/64 low 2001:DB8:2::/64 prefix-length 64
