set system host-name P

set protocols bfd interface all

set protocols mpls lsr-id 2.2.2.2
set protocols mpls label-distribution-protocol ldp
set interfaces lo0 unit 0 family mpls

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols mpls ldp interface ge-0/0/0
set ethernet-switching-options storm-control interface ge-0/0/0 threshold 3 4 resume-threshold 2 5 trigger-section

set interfaces ge-0/0/1 unit 0 family inet address 10.1.3.1/24
set interfaces ge-0/0/1 unit 0 family mpls
set protocols mpls ldp interface ge-0/0/1
set ethernet-switching-options storm-control interface ge-0/0/1 threshold 3 4 resume-threshold 2 5 trigger-section

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
