set system host-name CE1

set routing-instances vpna instance-type vrf
set routing-instances vpna interface ge-1/0/0.0
set routing-instances vpna route-distinguisher 100:1
set routing-instances vpna vrf-import target:111:1
set routing-instances vpna vrf-export target:111:1

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/24

set system services ssh
set system services telnet
set system login user root class super-user
set system login user root authentication plain-text-password # 手动设置密码