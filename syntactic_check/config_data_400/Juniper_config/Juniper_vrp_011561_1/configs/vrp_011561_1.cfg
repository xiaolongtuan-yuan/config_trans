set system host-name PE2

set protocols cfm enable
set protocols cfm domain md1 level 3
set protocols cfm maintenance-association ma1 domain md1
set protocols cfm maintenance-association ma1 continuity-check interval 10
set protocols cfm maintenance-association ma1 continuity-check loss-threshold 3
set protocols cfm maintenance-association ma1 continuity-check send-only
set protocols cfm maintenance-association ma1 service evpna
set protocols cfm maintenance-association ma1 mep 2 interface ge-1/0/1 inward
set protocols cfm maintenance-association ma1 mep 2 continuity-check enable
set protocols cfm maintenance-association ma1 mep 2 remote-mep 1
set protocols cfm maintenance-association ma1 mep 2 remote-mep 1 ccm-receive enable
set protocols cfm maintenance-association ma1 mep 2 delay-measure test-id 1 one-way receive
set protocols cfm maintenance-association ma1 mep 2 delay-measure test-id 3 remote-mep 1 one-way interval 1000

set routing-instances evpna instance-type evpn
set routing-instances evpna route-distinguisher 200:1
set routing-instances evpna vrf-target export target:1:1
set routing-instances evpna vrf-target import target:1:1

set protocols mpls lsr-id 2.2.2.2
set protocols mpls
set protocols ldp

set interfaces ge-1/0/1 unit 0 family ethernet-switching port-mode trunk
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan-id 1
set interfaces ge-1/0/1 unit 0 encapsulation dot1q
set bridge-domains bd1 vlan-id 1
set bridge-domains bd1 split-horizon group 1

set interfaces ge-1/0/2 unit 0 family inet address 10.2.1.1/24
set interfaces ge-1/0/2 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols bgp group EBGP type external
set protocols bgp group EBGP neighbor 1.1.1.1 peer-as 100
set protocols bgp group EBGP neighbor 1.1.1.1 local-address 2.2.2.2
set protocols bgp group EBGP family inet unicast
set protocols bgp group EBGP family evpn signaling

set protocols ospf area 0 interface lo0
set protocols ospf area 0 interface ge-1/0/2
