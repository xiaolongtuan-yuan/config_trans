set system host-name PE2

# MPLS/LDP基础配置（修正空声明）
set protocols mpls interface ge-1/0/2.0
set protocols mpls interface lo0.0
set protocols ldp interface ge-1/0/2.0
set protocols ldp router-id 2.2.2.2

# L2VPN配置（保持不变）
set protocols l2vpn
set protocols l2vpn pseudowire 1001 neighbor 1.1.1.1
set protocols l2vpn pseudowire 1001 interface ge-1/0/1.1

# 接口配置（优化封装类型）
set interfaces ge-1/0/1 unit 1 vlan-id 1
set interfaces ge-1/0/1 unit 1 encapsulation vlan-ccc
set interfaces ge-1/0/1 unit 1 family ccc

set interfaces ge-1/0/2 unit 0 family inet address 192.168.1.1/24
set interfaces ge-1/0/2 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

# OSPF配置（保持不变）
set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/2.0

# CFM配置（完全重构）
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 level 2
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 continuity-check interval 1s
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 2 interface ge-1/0/1.1 direction down
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 remote-mep 1