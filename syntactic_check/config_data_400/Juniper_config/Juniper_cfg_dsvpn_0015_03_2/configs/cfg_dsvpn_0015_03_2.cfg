set system host-name Spoke2

set interfaces ge-0/0/0 unit 0 family inet address 10.1.3.10/24
set interfaces ge-0/0/1 unit 0 family inet address 192.168.2.1/24

set interfaces gr-0/0/0 unit 0 tunnel source 10.1.3.10
set interfaces gr-0/0/0 unit 0 tunnel destination 172.16.1.1
set interfaces gr-0/0/0 unit 0 family inet address 172.16.1.3/24

set security ike policy IPSEC_PROFILE_NAME mode main
set security ike policy IPSEC_PROFILE_NAME proposal-set standard
set security ipsec policy IPSEC_PROFILE_NAME proposal-set standard

set security ipsec vpn GRE-VPN bind-interface st0.0
set security ipsec vpn GRE-VPN ike gateway IKE-GATEWAY
set security ipsec vpn GRE-VPN ike ipsec-policy IPSEC_PROFILE_NAME

set routing-options autonomous-system 300

set protocols bgp group EXTERNAL type external
set protocols bgp group EXTERNAL peer-as 100
set protocols bgp group EXTERNAL neighbor 172.16.1.1
set protocols bgp group EXTERNAL neighbor 172.16.1.2 peer-as 200
set protocols bgp group EXTERNAL local-as 300
set protocols bgp group EXTERNAL export ospf-to-bgp
set protocols bgp group EXTERNAL family inet unicast

set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set protocols ospf3 area 0.0.0.1 interface ge-0/0/0.0

set policy-options policy-statement ospf-to-bgp term 1 from protocol ospf
set policy-options policy-statement ospf-to-bgp term 1 then accept