set system host-name DeviceC

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols ptp interface lo0
set protocols ptp client
set protocols ptp local-address 3.3.3.3
set protocols ptp peer 1.1.1.1
set protocols ptp peer 2.2.2.2
set protocols ptp sync-interval 4
set protocols ptp announce-interval 12
set protocols ptp delay-response-interval 6
set protocols ptp unicast-negotiate

set system time-zone UTC
set system clock priority 1
set system clock source ptp
set system clock ssm-prc
