set system host-name DeviceA

# PPPoE Client Configuration
!set interfaces pp0 unit 0 pppoe-options underlying-interface lmp-0/0/0.0
!set interfaces pp0 unit 0 pppoe-options auto-reconnect 300
!set interfaces pp0 unit 0 family inet negotiate-address

# PPP Authentication
set access profile PPP-AUTH authentication-order chap
set access profile PPP-AUTH chap default-user "rta"
set access profile PPP-AUTH chap secret "$9$EDF~DAdfFD934J3<DAF#*<!"

# Local User Account
set system login user rtb class super-user
set system login user rtb authentication encrypted-password "$9$j]v~7%f[#S'W>j9zzM)3,*!u"

# Address Pool
set access address-pool POOL1 family inet network 10.110.0.0/24
set access address-pool POOL1 family inet range RANGE1 low 10.110.0.2 high 10.110.0.254

# Firewall Filter
set firewall family inet filter DIALER-ALLOW term ALLOW-IP from protocol tcp
set firewall family inet filter DIALER-ALLOW term ALLOW-IP from protocol udp
set firewall family inet filter DIALER-ALLOW term ALLOW-IP then accept

# Physical Interface
!set interfaces lmp-0/0/0 unit 0 family inet