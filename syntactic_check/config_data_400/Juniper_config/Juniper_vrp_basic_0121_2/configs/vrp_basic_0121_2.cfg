set system host-name client002

set interfaces ge-0/0/0 unit 0 family inet address 10.1.3.3/16
# 接口默认启用，无需disable命令

set system services ssh protocol-version v2
set system services ssh root-login allow
set system services ssh connection-limit 5

set system login user root authentication ssh-rsa "ssh-rsa AAAAB3NzaC..."  # 替换为实际生成的RSA公钥
set system login class netadmin permissions all
set system login class netadmin allow-commands "ssh"
set system login class netadmin deny-commands "configure"

