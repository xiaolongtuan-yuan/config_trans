set system host-name HUAWEI

set routing-options static route 0.0.0.0/0 next-hop 10.1.99.1
set routing-options static route 0.0.0.0/0 next-hop 10.1.99.5 preference 70

set firewall family inet filter acl-3001 term t1 from source-address 10.1.40.0/24
set firewall family inet filter acl-3001 term t1 from destination-address 10.1.40.0/24
set firewall family inet filter acl-3001 term t1 then accept

set firewall family inet filter acl-3001 term t2 from source-address 10.1.40.0/24
set firewall family inet filter acl-3001 term t2 from destination-address 10.1.41.0/24
set firewall family inet filter acl-3001 term t2 then accept

set firewall family inet filter acl-3001 term t3 from source-address 10.1.40.0/24
set firewall family inet filter acl-3001 term t3 from destination-address 10.1.42.0/24
set firewall family inet filter acl-3001 term t3 then accept

set firewall family inet filter acl-3002 term t1 from source-address 10.1.40.0/24
set firewall family inet filter acl-3002 term t1 from destination-address 0.0.0.0/0
set firewall family inet filter acl-3002 term t1 then accept

set policy-options policy-statement class-c1 term t1 from filter acl-3001
set policy-options policy-statement class-c1 term t1 then next-hop 10.1.99.5

set policy-options policy-statement class-c2 term t1 from filter acl-3002
set policy-options policy-statement class-c2 term t1 then next-hop 10.1.99.5

set policy-options policy-statement policy-p1 term c1 from filter acl-3001
set policy-options policy-statement policy-p1 term c1 then precedence 1

set policy-options policy-statement policy-p1 term c2 from filter acl-3002
set policy-options policy-statement policy-p1 term c2 then precedence 1

set interfaces ge-1/0/0 unit 0 family inet service input policy-p1
set interfaces ge-1/0/0 unit 0 family inet address <appropriate-ip>

set interfaces ge-1/0/0 disable
delete interfaces ge-1/0/0 disable
