#
sysname DeviceB
#
controller E1 2/0/0
 using e1
 framing crc4
 channel-group 1 timeslots 1-31
 undo shutdown
#
controller E1 2/0/1
 using e1
 framing crc4
 channel-group 2 timeslots 1-31
 undo shutdown
#
interface Mp-group2/0/1
 ip address <IP address> <subnet mask>
 link-protocol ppp
 ppp mp Mp-group2/0/1
 ppp mp group 1
 ppp mp group 2
#
interface Serial2/0/0:0
 link-protocol ppp
 ppp mp Mp-group2/0/1
#
interface Serial2/0/1:0
 link-protocol ppp
 ppp mp Mp-group2/0/1
#
return
