sysname PE1
#
mpls lsr-id 1.1.1.1
mpls
mpls l2vpn
#
vsi a2 static 
 pwsignal ldp 
  vsi-id 2    
  peer 3.3.3.3
  peer 3.3.3.3 pw 1
  broadcast-suppression cir 1000
  multicast-suppression cir 1000
  unknown-unicast-suppression cir 1000
 suppression inbound enable
# 
mpls ldp
#
 mpls ldp remote-peer 3.3.3.3
 remote-ip 3.3.3.3
#
interface GigabitEthernet1/0/0
 undo shutdown
#
interface GigabitEthernet1/0/0.1
 undo shutdown
 vlan-type dot1q 10
 l2 binding vsi a2
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 172.16.1.1 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack1
 ip address 1.1.1.1 255.255.255.255
#
ospf 1
 area 0.0.0.0
  network 1.1.1.1 0.0.0.0
  network 172.16.1.0 0.0.0.255
#
ip route-static 3.3.3.3 255.255.255.255 GigabitEthernet2/0/0
ip route-static 172.16.1.0 255.255.255.0 Null0

#
return
