sysname CGN
#
license
 active nat session-table size 6 slot 1 engine 0
#
acl number 2001
 rule 0 permit source 10.10.10.0 0.0.0.255
#
service-location 1
 location slot 1 engine 0
#
service-instance-group group1
 service-location 1
#
nat instance nat1 id 1
 service-instance-group group1
 nat address-group address-group1 group-id 1 10.34.161.101 10.34.161.105
 nat outbound any address-group address-group1
 port-range 4096
#
traffic classifier c1
 if-match acl 2001
#
traffic behavior b1
 nat bind instance nat1
#
traffic policy p1
 classifier c1 behavior b1 precedence 1
#
interface gigabitEthernet 2/0/2
 undo shutdown
 ip address 192.168.11.2 24
 traffic-policy p1 inbound
#
return
