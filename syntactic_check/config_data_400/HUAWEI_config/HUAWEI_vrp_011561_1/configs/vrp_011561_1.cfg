sysname PE2
#
cfm enable
#
evpn vpn-instance evpna
 route-distinguisher 200:1
 vpn-target 1:1 export-extcommunity
 vpn-target 1:1 import-extcommunity
#
mpls lsr-id 2.2.2.2
mpls
mpls ldp
 ipv4-family
#
interface GigabitEthernet1/0/1
 undo shutdown
 evpn binding vpn-instance evpna
#
interface GigabitEthernet1/0/2
 undo shutdown
 ip address 10.2.1.1 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack0
 ip address 2.2.2.2 255.255.255.255
#
bgp 100
 peer 1.1.1.1 as-number 100
 peer 1.1.1.1 connect-interface LoopBack0
 #
 ipv4-family unicast
  undo synchronization
  peer 1.1.1.1 enable
 #
 l2vpn-family evpn
  peer 1.1.1.1 enable
#
ospf 1
 area 0.0.0.0
  network 2.2.2.2 0.0.0.0
  network 10.2.1.0 0.0.0.255
#
evpn source-address 2.2.2.2
#
cfm md md1
 ma ma1
  map evpn vpn-instance evpna
  mep mep-id 2 interface GigabitEthernet1/0/1 inward
  mep ccm-send mep-id 2 enable
  remote-mep mep-id 1
  remote-mep ccm-receive mep-id 1 enable
  test-id 1 mep 2
  delay-measure one-way receive test-id 1
  test-id 3 mep 2 remote-mep 1
  delay-measure one-way continual send test-id 3 interval 1000
#
return
