sysname PE2
#
cfm version standard
cfm enable
#
mpls lsr-id 3.3.3.3
mpls
mpls l2vpn
mpls ldp
#
mpls ldp remote-peer 1.1.1.1
 remote-ip 1.1.1.1
#
interface GigabitEthernet1/0/1
 undo shutdown
#
interface GigabitEthernet1/0/1.1
 vlan-type dot1q 10
 mpls l2vc 1.1.1.1 100
#
interface GigabitEthernet1/0/2
 undo shutdown
 ip address 10.2.1.2 255.255.255.252
 mpls
 mpls ldp
#
interface LoopBack1
 ip address 3.3.3.3 255.255.255.255
#
ospf 1
 area 0.0.0.0
  network 5.5.5.5 0.0.0.0
  network 10.2.1.0 0.0.0.3
#
cfm md md1 level 3
 ma ma1
  map mpls l2vc 100 tagged
  mep mep-id 32 interface GigabitEthernet1/0/1.1 inward
  mep ccm-send enable
  remote-mep mep-id 31
  remote-mep ccm-receive enable
  ais enable
  ais link-status interface gigabitEthernet1/0/2
  ais level 6
  ais interval 60
  ais vlan vid 10 mep 32
#
return
