sysname P1
#
mpls lsr-id 2.2.2.2
#
mpls
 mpls te
 mpls rsvp-te
 mpls te cspf
 lsp-trigger all
#
mpls ldp
 #
 ipv4-family
#
mpls ldp remote-peer lsrd
 remote-ip 4.4.4.4
#
interface GigabitEthernet1/0/0
 undo shutdown 
 ip address 10.1.1.2 255.255.255.0
 mpls
 mpls ldp
 trust upstream default
#
interface GigabitEthernet2/0/0
 undo shutdown 
 ip address 10.2.1.1 255.255.255.0
 mpls
 mpls te
 mpls te bandwidth max-reservable-bandwidth 20000
 mpls te bandwidth bc0 20000
 mpls rsvp-te
#
interface LoopBack1
 ip address 2.2.2.2 255.255.255.255
#
interface Tunnel1
 ip address unnumbered interface LoopBack1
 tunnel-protocol mpls te
 destination 4.4.4.4
 mpls te tunnel-id 100
 mpls te bandwidth ct0 10000
 mpls te igp shortcut
 mpls te igp metric absolute 1
 mpls te service-class af1 af2
#
interface Tunnel2
 ip address unnumbered interface LoopBack1
 tunnel-protocol mpls te
 destination 4.4.4.4
 mpls te tunnel-id 200
 mpls te bandwidth ct0 10000
 mpls te igp shortcut
 mpls te igp metric absolute 1
 mpls te service-class default
#
ospf 1
 opaque-capability enable
 enable traffic-adjustment advertise
 area 0.0.0.0
  network 2.2.2.2 0.0.0.0
  network 10.1.1.0 0.0.0.255
  network 10.2.1.0 0.0.0.255
  mpls-te enable
#
return
