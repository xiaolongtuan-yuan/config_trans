#
sysname HUAWEI
#
ip pool pool1 bas local
 gateway 172.30.0.1 255.255.255.0
 section 0 172.30.0.2 172.30.0.200
 excluded-ip-address 172.30.0.8
#
aaa
 local-user admin password cipher <password>
 local-user admin privilege level 15
 authentication-scheme default
  method local
 authorization-scheme default
  method local
 session-id common
#
interface GigabitEthernet1/0/2
 undo shutdown
 port link-type access
 port default vlan 100
#
interface GigabitEthernet1/0/2.1
 vlan-type dot1q 100
 ip address 172.30.0.2 255.255.255.0
#
interface Vlanif100
 ip address 172.30.0.1 255.255.255.0
#
aaa
 authentication-scheme default
  method radius local
 accounting-scheme default
  method radius local
#
acl 2000
 rule permit ip source 172.30.0.8 0.0.0.0
 rule deny ip
#
radius-server shared-key cipher <password>
radius-server 172.30.0.8 auth-port 1812 acct-port 1813
#
local-user 172.30.0.8 password cipher <password>
 local-user 172.30.0.8 privilege level 15
#
interface GigabitEthernet1/0/2.1
 authentication-scheme default
#
dhcp enable
ip dhcp snooping enable
ip dhcp snooping trust interface GigabitEthernet1/0/2.1
ip dhcp snooping rate-limit unicast threshold 100 burst 10
# 
interface Vlanif100
 ip address 172.30.0.1 255.255.255.0
 ip helper-address 172.30.0.1

