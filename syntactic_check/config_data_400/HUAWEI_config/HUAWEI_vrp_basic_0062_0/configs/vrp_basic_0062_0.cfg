sysname SSH Server
#
acl ipv6 number 2000
 rule 5 permit source 2001:DB8::/32 destination any
#
rsa local-key-pair create
 modulus 2048
#
aaa
 local-user huawei123 password irreversible-cipher $1c$+,JS+))\\2$KVNj(.3`_5x0FCKGv}H&.kUTI`Ff&H*eBqO.ua>)$
#
interface GigabitEthernet0/0/0
 undo shutdown
 ipv6 enable 
 ipv6 address 2001:DB8::1/32 
#
stelnet ipv6 server enable
ssh server ipv6 enable
ssh ipv6 source-interface GigabitEthernet0/0/0
#
user-interface vty 0 14
 authentication-mode local
 user privilege level 3
 protocol inbound ssh
#
return
