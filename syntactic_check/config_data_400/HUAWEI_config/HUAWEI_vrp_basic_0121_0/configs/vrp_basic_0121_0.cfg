sysname SSH_Server

rsa local-key-pair create 2048

interface LoopBack0
 ip address 10.1.1.1 255.255.255.255

stelnet server enable
ssh server version 2
ssh server-source -i LoopBack0

aaa
 local-user client001 password cipher @%@%UyQs4,KTtSwJo(4QmW#K,LC:@%@%
 local-user client001 service-type ssh
 local-user client001 level 3
#
 local-user client002 password irreversible-cipher ecckey001
 local-user client002 service-type ssh
 local-user client002 level 3
#
aaa authentication-scheme default
 authentication-mode local
aaa authorization-scheme default
 authorization-mode local

interface GigabitEthernet0/0/0
 ip address 10.1.1.2 255.255.0.0
 undo shutdown

user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh

return
