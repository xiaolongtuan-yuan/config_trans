sysname routerA
#
load-balance unequal-cost enable
#
interface Eth-Trunk1
 ip address 10.40.1.1 255.255.255.0
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.1.1.1 255.255.255.0
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 10.30.1.1 255.255.255.0
#
interface GigabitEthernet3/0/0
 undo shutdown
 eth-trunk 1
#
interface GigabitEthernet4/0/0
 undo shutdown
 eth-trunk 1
#
ip route-static 10.20.1.0 255.255.255.0 GigabitEthernet2/0/0 10.30.1.2
ip route-static 10.20.1.0 255.255.255.0 Eth-Trunk1 10.40.1.2
ip route-static 10.50.1.0 255.255.255.0 GigabitEthernet2/0/0 10.30.1.2
ip route-static 10.50.1.0 255.255.255.0 Eth-Trunk1 10.40.1.2
#
