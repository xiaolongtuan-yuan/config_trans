sysname CE1

ip domain-name example.com
rsa local-key-pair create
stelnet server enable
ssh server authentication-type default password
ssh server compatible-ssh2 enable
ssh server source-intf LoopBack0

ssh client cipher aes128-ctr aes192-ctr aes256-ctr
ssh client hmac hmac-sha1 hmac-sha1-96
ssh client key-exchange dh-group14-sha1

aaa
 local-user client001 password irreversible-cipher @%@%UyQs4,KTtSwJo(4QmW#K,LC:@%@%
 local-user client001 privilege level 15
 local-user client001 service-type ssh
 local-user client002 password irreversible-cipher @%@%UyQs4,KTtSwJo(4QmW#K,LC:@%@%
 local-user client002 privilege level 15
 local-user client002 service-type ssh

interface LoopBack0
 ip address 10.1.1.1 255.255.255.255

interface GigabitEthernet1/0/1
 undo shutdown
 ip address 10.3.3.3 255.255.255.0

bgp 65410
 router-id 10.1.1.1
 peer 10.1.1.2 as-number 100
 ipv4-family unicast
  peer 10.1.1.2 enable
  peer 10.1.1.2 next-hop-self

scp server enable
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh

