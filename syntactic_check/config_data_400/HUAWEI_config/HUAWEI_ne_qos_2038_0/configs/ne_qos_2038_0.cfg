sysname DeviceA
#
traffic behavior dd
 remark dscp af11
#
qppb local-policy ac
 qos-local-id 1 behavior dd
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.20.1.2 255.255.255.0
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 10.10.1.1 255.255.255.0
 qppb-policy ac source inbound
#
interface LoopBack0
 ip address 1.1.1.1 255.255.255.255
#
bgp 100
 peer 2.2.2.2 as-number 200
 peer 2.2.2.2 ebgp-max-hop 2
 peer 2.2.2.2 connect-interface LoopBack0
 peer 10.20.1.1 as-number 100
#
 ipv4-family unicast
  undo synchronization
  import-route direct
  peer 2.2.2.2 enable
  peer 2.2.2.2 route-policy aa import
  peer 10.20.1.1 enable     
#
ip route-static 2.2.2.2 32 10.20.1.1
ip route-static 10.10.1.0 24 GigabitEthernet2/0/0
ip route-static 10.20.1.0 24 GigabitEthernet1/0/0
#
ospf 1
 area 0.0.0.0
  network 1.1.1.1 0.0.0.0
  network 10.10.1.0 0.0.0.255
  network 10.20.1.0 0.0.0.255
#
route-policy aa permit node 10
 if-match community-filter 10
 apply qos-local-id 1
#
ip community-filter 10 index 10 permit 10:10 
return
