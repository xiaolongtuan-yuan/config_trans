sysname NATA
#
license active nat session-table size 6 slot 1 card 0  
#
service-location 1 
 location slot 1 card 0
#
service-instance-group group1      
 service-location 1      
#
nat instance nat1 id 1      
 port-range 1024
 service-instance-group group1      
 nat address-group address-group1 group-id 1 
  section 1 11.11.11.101 11.11.11.105     
 nat outbound 3001 address-group address-group1
 nat filter mode full-cone
#
acl number 3001
 rule 1 permit ip source 192.168.10.0 0.0.0.255
#
traffic classifier classifier1
 if-match acl 3001
#
traffic behavior behavior1
 nat bind instance nat1
#
traffic policy policy1
 classifier classifier1 behavior behavior1
#
interface GigabitEthernet 2/0/0
 undo shutdown
 ip address 192.168.10.1 255.255.255.0
 traffic-policy policy1 inbound
#
return
