sysname Device
#
l2tp enable
#
radius-server group radius1
 radius-server authentication 10.20.20.1 1812 
 radius-server accounting 10.20.20.1 1813 
 radius-server shared-key <key>
 radius-server source-interface LoopBack0
#
interface Virtual-Template1
 ppp authentication-mode auto 
 ip unnumbered LoopBack0
#
interface GigabitEthernet1/0/0
 undo shutdown 
 ip address 10.11.11.1
#
interface LoopBack0
 ip address 192.168.10.1 255.255.255.255
#
ospf 1
 area 0.0.0.0
  network 10.202.160.0 0.0.0.255
  network 192.168.0.1 0.0.0.0
#
l2tp-group lns1
 tunnel password cipher  <password>
 tunnel name LNS
#
lns-group group1
 bind slot 1 
 bind source LoopBack0
#
ip pool 1 bas local
 gateway 192.168.0.2 255.255.255.0
 section 0 192.168.0.10 192.168.0.100
#
aaa
 authentication-scheme default
 accounting-scheme default
 radius-server group radius1
