#
sysname DeviceB
#
controller E1 2/0/0
 using e1
 framing CRC4
 clock-source internal
 line-impedance 75-ohm
 cable-length long 0db
 undo shutdown
#
interface Serial2/0/0:0
 link-protocol ppp
 ppp mp mp-group 2/0/1
 undo shutdown
#
interface mp-group 2/0/1
 ip address 10.1.1.2 255.255.255.0
#
return
