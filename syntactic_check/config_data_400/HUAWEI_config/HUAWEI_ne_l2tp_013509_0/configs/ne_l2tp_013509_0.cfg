sysname DeviceA
#
l2tp enable
#
radius-server group radius1
 radius-server authentication 10.20.20.1 1812 
 radius-server accounting 10.20.20.1 1813 
 radius-server shared-key <key>
#
interface Virtual-Template1
 ppp authentication-mode chap
#
interface GigabitEthernet2/0/0
 undo shutdown
#
interface GigabitEthernet2/0/0.100
 vlan-type dot1q 100
 pppoe-server bind Virtual-Template 1
 undo shutdown
#
interface LoopBack0
 ip address 3.3.3.3 255.255.255.255
#
l2tp-group lac1
 tunnel password cipher <password>
 tunnel name lac1
 start l2tp ip 3.3.3.3
 tunnel source LoopBack0
#
aaa
 authentication-scheme default1
 accounting-scheme default1
 domain isp1
  authentication-scheme default1
  accounting-scheme default1
  radius-server group radius1
 domain isp2
  authentication-scheme default1
  accounting-scheme default1
  radius-server group radius1
#
interface GigabitEthernet1/0/1.1
 undo shutdown
 vlan-type dot1q 1
 ip address 11.11.11.1 255.255.255.0
#
ip route-static 3.3.3.3 255.255.255.255 11.11.11.2
#
return
