system-view
sysname SSH_Server

interface GigabitEthernet0/0/0
 undo shutdown
 ip address 10.1.1.1 255.255.0.0

rsa local-key-pair create
 2048

aaa
 local-user client001 password irreversible-cipher @%@%UyQs4,KTtSwJo(4QmW#K,LC:@%@%
 local-user client001 privilege level 3
 local-user client001 service-type ssh
 local-user client002 password irreversible-cipher <password_for_client002>
 local-user client002 privilege level 3
 local-user client002 service-type ssh

stelnet server enable
ssh user client001 authentication-type password
ssh user client002 authentication-type password

interface GigabitEthernet0/0/0
 ssh server-source -i GigabitEthernet0/0/0

user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
 user privilege level 3
