sysname PE1
#
cfm version standard
cfm enable
#
mpls lsr-id 2.2.2.2
mpls
mpls l2vpn
#
vsi ldp1 static
 pwsignal ldp
  vsi-id 1
  peer 1.1.1.1
#
mpls ldp
#
interface GigabitEthernet1/0/1.1
 vlan-type dot1q 1
 l2 binding vsi ldp1
#
interface GigabitEthernet1/0/2
 undo shutdown
 ip address 10.1.1.1 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack0
 ip address 2.2.2.2 255.255.255.0
#
ospf 1
 area 0.0.0.0
  network 2.2.2.2 0.0.0.0
  network 10.1.1.0 0.0.0.255
#
cfm md md
  ma ma1
   map vsi ldp1
   mep mep-id 1 interface GigabitEthernet1/0/1.1 inward
   mep ccm-send mep-id 1 enable
   remote-mep mep-id 2
   remote-mep ccm-receive mep-id 2 enable
   test-id 1 mep 1 peer-ip 1.1.1.1
  ma ma2
   map vsi ldp1
   mep mep-id 4 interface GigabitEthernet1/0/1.1 outward
   mep ccm-send mep-id 4 enable
   remote-mep mep-id 3
   remote-mep ccm-receive mep-id 3 enable
   test-id 2 mep 4 remote-mep 3
   loss-measure single-ended receive test-id 2
#
return
