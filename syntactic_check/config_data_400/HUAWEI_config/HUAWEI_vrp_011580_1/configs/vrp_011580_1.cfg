sysname PE1
#
cfm enable
#
evpn vpn-instance evpna bd-mode
 route-distinguisher 100:1
 vpn-target 1:1 export-extcommunity
 vpn-target 1:1 import-extcommunity
#
eth-switch
  evpn instance evpna
    vpn-instance 10
    rd 100:1
    route-target both 1:1
    vni 10
#
interface GigabitEthernet1/0/1.1 mode l2
 encapsulation dot1q vid 2
 rewrite pop single
 bridge-domain 10
#
cfm md md1
 ma ma1
  map bridge-domain 10
  mep mep-id 1 interface GigabitEthernet1/0/1.1 outward
  mep ccm-send mep-id 1 enable
  remote-mep mep-id 2
  remote-mep ccm-receive mep-id 2 enable
  test-id 1 mep 1 remote-mep 2
  loss-measure dual-ended continual test-id 1
#                                              
return
