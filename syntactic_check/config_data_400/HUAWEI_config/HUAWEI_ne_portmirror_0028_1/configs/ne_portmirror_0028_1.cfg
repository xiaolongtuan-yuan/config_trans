interface GigabitEthernet1/0/1.2 mode l2
 encapsulation dot1q vid 30
 rewrite map 1-to-1 vid 10
 bridge-domain 10
#
interface GigabitEthernet1/0/2
 undo shutdown
#
interface GigabitEthernet1/0/2.1 mode l2
 encapsulation dot1q vid 10
 bridge-domain 10
#
return
