hostname DeviceC
!
ip multicast-routing
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 192.168.2.2 255.255.255.0
 ip pim sparse-mode
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 192.168.3.1 255.255.255.0
 ip pim sparse-mode
!
interface GigabitEthernet3/0/0
 no shutdown
 ip address 192.168.4.1 255.255.255.0
 ip pim sparse-mode
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
 ip pim sparse-mode
!
ip pim rp-address 2.2.2.2
ip pim bsr-candidate Loopback0
!
router ospf 1
 redistribute bgp 200 subnets
 network 192.168.3.0 0.0.0.255 area 0
 network 192.168.4.0 0.0.0.255 area 0
 network 2.2.2.2 0.0.0.0 area 0
!
router bgp 200
 bgp router-id 2.2.2.2
 neighbor 192.168.2.1 remote-as 100
 neighbor 192.168.2.1 ebgp-multihop 255
 !
 address-family ipv4
  redistribute ospf 1
  neighbor 192.168.2.1 activate
  neighbor 192.168.2.1 advertisement-interval 0
 exit-address-family
!
ip msdp peer 192.168.2.1 connect-source GigabitEthernet1/0/0
ip msdp peer 192.168.2.1 mesh-group group1
ip msdp peer 192.168.4.2 connect-source GigabitEthernet3/0/0
ip msdp peer 192.168.4.2 mesh-group group1
!
end
