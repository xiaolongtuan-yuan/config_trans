hostname DeviceA
!
ip multicast-routing
!
ip access-list standard SSM-RANGE  ! 修正：使用标准ACL定义SSM范围
 permit 232.1.1.0 0.0.0.255
!
router isis
 net 10.0000.0000.0001.00
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 192.168.2.1 255.255.255.0
 ip pim sparse-mode
 isis network point-to-point
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.110.1.2 255.255.255.0
 ip pim sparse-mode
 isis network point-to-point
!
ip pim ssm default              ! 启用SSM默认范围（232.0.0.0/8）
ip pim ssm range SSM-RANGE      ! 修正行23：引用ACL定义自定义SSM范围
!
