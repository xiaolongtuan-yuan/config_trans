hostname DeviceD

interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:db8:9:1::2/64

interface GigabitEthernet2/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:db8:9:2::2/64

router bgp 65009
 bgp router-id 4.4.4.4
 neighbor 2001:db8:9:1::1 remote-as 65009
 neighbor 2001:db8:9:2::1 remote-as 65009

 address-family ipv4 unicast
  no synchronization
 exit-address-family

 address-family ipv6 unicast
  network 2001:db8:9:1::/64
  network 2001:db8:9:2::/64
  neighbor 2001:db8:9:1::1 activate
  neighbor 2001:db8:9:2::1 activate
 exit-address-family

end