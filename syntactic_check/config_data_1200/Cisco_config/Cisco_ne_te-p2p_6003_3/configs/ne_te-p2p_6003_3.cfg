hostname P2

! MPLS Configuration
mpls traffic-eng tunnels
no mpls ip propagate-ttl

! RSVP Configuration
ip rsvp signalling hello graceful-restart
ip rsvp signalling hello refresh interval 30

! Interface Configurations
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.3.1.2 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 ip rsvp bandwidth 20000 20000

interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.4.1.2 255.255.255.0
 mpls ip
 mpls ldp enable

interface Loopback1
 ip address 4.4.4.4 255.255.255.255

! MPLS LDP Configuration
mpls ldp router-id Loopback1 force
mpls ldp discovery hello holdtime 15
mpls ldp discovery targeted-hello holdtime 15

! TE Tunnel Configuration
interface Tunnel1
 ip unnumbered Loopback1
 tunnel destination 2.2.2.2

! OSPF Configuration with MPLS-TE
router ospf 1
 mpls traffic-eng router-id Loopback1
 mpls traffic-eng area 0
 network 4.4.4.4 0.0.0.0 area 0
 network 10.3.1.0 0.0.0.255 area 0
 network 10.4.1.0 0.0.0.255 area 0
