hostname ABR
!
mpls ldp router-id Loopback0
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.0.7.5 255.255.255.0
 mpls ip
 mpls ldp igp sync
 mpls ldp autoconfig
!
interface GigabitEthernet1/0/3
 no shutdown
 ip address 10.0.11.5 255.255.255.0
 mpls ip
 mpls ldp igp sync
 mpls ldp autoconfig
!
interface Loopback0
 ip address 1.1.1.2 255.255.255.255
!
router isis
 net 49.0001.0000.0000.000c.00
 is-type level-2-only
 metric-style wide
!
router bgp 1
 bgp router-id 1.1.1.2
 bgp log-neighbor-changes
 neighbor 1.1.1.1 remote-as 1
 neighbor 1.1.1.1 update-source Loopback0
 neighbor 1.1.1.1 route-reflector-client
 neighbor 1.1.1.1 send-label
 neighbor 1.1.1.1 next-hop-self
 neighbor 1.1.1.1 route-map POLICY1 out
 neighbor 1.1.1.3 remote-as 1
 neighbor 1.1.1.3 update-source Loopback0
 neighbor 1.1.1.3 route-reflector-client
 neighbor 1.1.1.3 send-label
 neighbor 1.1.1.3 next-hop-self
 neighbor 1.1.1.3 route-map POLICY1 out
 !
 address-family ipv4 unicast
  neighbor 1.1.1.1 activate
  neighbor 1.1.1.3 activate
 exit-address-family
!
ip route 1.1.1.1 255.255.255.255 Null0
!
router ospf 1
 router-id 1.1.1.2
 network 10.0.11.0 0.0.0.255 area 0
 network 1.1.1.2 0.0.0.0 area 0
!
route-map POLICY1 permit 10
 set mpls-label
!
end