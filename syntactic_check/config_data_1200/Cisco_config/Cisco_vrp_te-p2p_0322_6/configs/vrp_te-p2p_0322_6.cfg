hostname CE2
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.2.1.1 255.255.255.0
!
router bgp 65420
 neighbor 10.2.1.2 remote-as 100
 !
 address-family ipv4 unicast
  synchronization
  redistribute connected  ! 修正行12：使用Cisco标准命令重分发直连路由
  neighbor 10.2.1.2 activate
 exit-address-family
!
end