hostname BRAS
!
ipv6 unicast-routing
!
aaa new-model
!
multicast ipv6 routing-enable
!
ipv6 multicast-routing
!
ipv6 multicast-routing ipv6
 listname1 FF1E::1
 listname2 FF1E::2
!
ipv6 multicast-routing ipv6
 profile name1
  static
  list-index 0
  list-index 1
!
no aaa authentication enable default
no aaa accounting enable default
aaa group server radius wdomain
aaa authentication login default local
aaa authentication ppp default local
aaa authorization network default local
aaa accounting delay-start
aaa accounting ppp default stop-only
aaa accounting network default start-stop group radius
aaa session-id common
!
bba-group pppoe global
 virtual-template 100
!
interface Virtual-Template100
 ppp authentication chap
!
interface GigabitEthernet1/0/0
 ipv6 address 2001:db8:1::1/64
 ipv6 enable
 ipv6 pim sm
!
interface GigabitEthernet1/0/1.1
 ipv6 address autoconfig
 ipv6 enable
 ipv6 nd autoconfig prefix
 user-vlan 133
 pppoe enable
 pppoe server bind Virtual-Template100
 ipv6 pim sm
 ipv6 mld join-group FF1E::1
 ipv6 mld join-group FF1E::2
!
ipv6 route 2001::db8:1::/64 GigabitEthernet1/0/0
!
ipv6 dhcp pool pool-name
 prefix-delegation
!
end