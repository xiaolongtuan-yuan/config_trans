hostname LSRC

mpls label protocol ldp

interface GigabitEthernet1/0/0
 no shutdown
 ip address 3.2.1.2 255.255.255.0
 mpls ip

interface Loopback1
 ip address 3.3.3.3 255.255.255.255

interface Tunnel20
 ip unnumbered Loopback1
 tunnel mode mpls traffic-eng
 tunnel destination 1.1.1.1
 tunnel mpls traffic-eng autoroute announce
 tunnel mpls traffic-eng priority 7
 tunnel mpls traffic-eng bandwidth 1000
 tunnel mpls traffic-eng path-option 1 explicit name lsp1
 tunnel mpls traffic-eng record-route
 tunnel mpls traffic-eng path-option 1 dynamic
 tunnel mpls traffic-eng path-option 1 dynamic bandwidth 1000

ip route 1.1.1.1 255.255.255.255 3.2.1.1
ip route 2.2.2.2 255.255.255.255 3.2.1.1

mpls traffic-eng administrative-weight 100

mpls traffic-eng autoroute announce

mpls traffic-eng meg test
