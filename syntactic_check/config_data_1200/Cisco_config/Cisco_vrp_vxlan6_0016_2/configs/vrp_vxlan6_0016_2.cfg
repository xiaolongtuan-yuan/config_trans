hostname Device3
!
vrf definition evrf1
 rd 20:1
 route-target export 11:1
 route-target import 11:1
!
vrf definition vpn1
 rd 22:22
 address-family ipv4
  route-target export 11:1
  route-target import 11:1
 exit-address-family
!
l2vpn vfi context vpn1
 vpn id 100
 bridge-domain 20
!
router ospfv3 1
 router-id 3.3.3.3
 area 0.0.0.0
!
interface Vlan20
 vrf forwarding vpn1
 ip address 10.2.1.1 255.255.255.0
 ip proxy-arp
!
interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8:3::1/64
 ospfv3 1 ipv6 area 0.0.0.0
!
interface GigabitEthernet1/0/1.1
 encapsulation dot1q 20
 service instance 20 ethernet
  bridge-domain 20
!
interface Loopback0
 ipv6 enable
 ipv6 address 2001:DB8:33::3/128
 ospfv3 1 ipv6 area 0.0.0.0
!
interface nve1

!
router bgp 100
 neighbor 2001:DB8:11::1 remote-as 100
 neighbor 2001:DB8:11::1 update-source Loopback0
 !
  neighbor 2001:DB8:11::1 activate
  neighbor 2001:DB8:11::1 send-community both
  neighbor 2001:DB8:11::1 route-map SET_ENCAP out
 !
 address-family ipv4 vrf vpn1
  neighbor 2001:DB8:11::1 activate
!
route-map SET_ENCAP permit 10

!
end