hostname RSG

mpls label protocol ldp
mpls ldp router-id Loopback1 force

interface Serial2/0/0:0
 no shutdown

interface Serial2/0/0:0.1
 encapsulation dot1q 1 native
 xconnect 1.1.1.1 100 encapsulation mpls pw-class policy1

interface Serial2/0/0:0.2
 encapsulation dot1q 2
 xconnect 1.1.1.1 200 encapsulation mpls pw-class policy1

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.0.1.2 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels

interface Loopback1
 ip address 2.2.2.2 255.255.255.255

interface Tunnel11
 ip unnumbered Loopback1
 tunnel mode mpls traffic-eng
 tunnel destination 1.1.1.1
 tunnel mpls traffic-eng tunnel-id 100
 tunnel mpls traffic-eng autoroute announce
 tunnel mpls traffic-eng path-option 1 explicit name policy1

router ospf 100
 mpls traffic-eng router-id Loopback1
 mpls traffic-eng area 0
 network 2.2.2.2 0.0.0.0 area 0
 network 10.0.1.0 0.0.0.255 area 0

mpls traffic-eng tunnel destination 1.1.1.1
mpls traffic-eng tunnel mpls traffic-eng tunnel-id 100
mpls traffic-eng tunnel mpls traffic-eng autoroute announce
mpls traffic-eng tunnel mpls traffic-eng path-option 1 explicit name policy1

end