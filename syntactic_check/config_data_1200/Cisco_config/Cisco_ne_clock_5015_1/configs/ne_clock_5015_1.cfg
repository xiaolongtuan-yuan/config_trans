hostname DeviceB
!
! Global NTP configuration
ntp clock-period 3600
ntp server 10.0.0.1
ntp server 10.0.0.2
clock timezone PST -8
!
interface GigabitEthernet1/0/0
 ! Removed invalid 'ntp enable' (line 9)
 ntp broadcast client  ! Optional: Configures the interface as an NTP broadcast client
 ntp clock-period 3600
 ntp server 10.0.0.1 prefer
 clock priority 1
!
interface GigabitEthernet2/0/0
 ! Removed invalid 'ntp enable' (line 15)
 ntp broadcast client  ! Optional: Configures the interface as an NTP broadcast client
 ntp clock-period 3600
 ntp server 10.0.0.2 prefer
 clock priority 2
!
end