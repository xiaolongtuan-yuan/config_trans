hostname RouterA

interface GigabitEthernet3/0/0
 no shutdown
 ip address 172.16.3.1 255.255.255.0

interface GigabitEthernet1/0/1
 no shutdown
 ip address 172.16.2.1 255.255.255.0

interface GigabitEthernet1/0/3
 no shutdown
 ip address 172.16.1.1 255.255.255.0

router bgp 65008
 bgp router-id 1.1.1.1
 neighbor 172.16.2.2 remote-as 65008

 address-family ipv4 unicast
  neighbor 172.16.2.2 activate
  neighbor 172.16.2.2 capability add-path receive
  neighbor 172.16.2.2 route-map direct-import in
 exit-address-family

ip route 0.0.0.0 0.0.0.0 <next-hop>  (replace <next-hop> with the appropriate next-hop IP address)

