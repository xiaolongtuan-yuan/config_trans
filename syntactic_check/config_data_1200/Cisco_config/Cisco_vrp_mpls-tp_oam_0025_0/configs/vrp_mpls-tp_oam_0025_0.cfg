hostname LSRA
!
 mpls ldp router-id Loopback1 force
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 2.1.1.1 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels     ! 保留MPLS TE配置
!
interface Loopback1
 ip address 1.1.1.1 255.255.255.255
!
interface Tunnel10
 ip unnumbered Loopback1
 tunnel destination 3.3.3.3
!
ip route 2.2.2.2 255.255.255.255 2.1.1.2
ip route 3.3.3.3 255.255.255.255 2.1.1.2
!
mpls oam                      ! 修正行26：Cisco MPLS-TP OAM配置
!
end