hostname ASBR2
!
mpls ldp router-id Loopback0 force
!
interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.0.10.4 255.255.255.0
 mpls ip
!
interface GigabitEthernet1/0/3
 no shutdown
 ip address 10.0.16.2 255.255.255.0
 mpls ip
!
interface Virtual-Template0
 ppp authentication chap
!
interface Loopback0
 ip address 1.1.1.4 255.255.255.255
!
router isis
 net 49.0001.0000.0000.000b.00
 is-type level-2-only
 metric-style wide
 mpls traffic-eng router-id Loopback0
!
router bgp 65535
 bgp router-id 1.1.1.4
 neighbor 10.0.16.1 remote-as 1
 neighbor 1.1.1.5 remote-as 65535
 neighbor 1.1.1.5 update-source Loopback0
 !
 address-family ipv4 unicast
  redistribute connected
  network 1.1.1.5 mask 255.255.255.255
  neighbor 10.0.16.1 activate
  neighbor 10.0.16.1 send-label
  neighbor 10.0.16.1 route-map POLICY1 out
  neighbor 1.1.1.5 activate
  neighbor 1.1.1.5 send-label
  neighbor 1.1.1.5 route-map POLICY2 out
 exit-address-family
!
route-map POLICY1 permit 10
 set mpls-label
!
route-map POLICY2 permit 10
 set mpls-label
!
ip route 1.1.1.3 255.255.255.255 10.0.16.1
!
end