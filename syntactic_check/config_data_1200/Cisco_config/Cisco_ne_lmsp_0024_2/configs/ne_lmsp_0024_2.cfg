router isis 1
 is-type level-1
 net 49.0003.0033.0033.0033.00
 lsp-gen-interval 1 1 50
 metric-style wide
 mpls traffic-eng level-2
!
interface GigabitEthernet2/0/2
 ip router isis 1
 isis metric 10
!
interface GigabitEthernet2/0/1
 ip router isis 1
 isis metric 10
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
 ip router isis 1
!
end