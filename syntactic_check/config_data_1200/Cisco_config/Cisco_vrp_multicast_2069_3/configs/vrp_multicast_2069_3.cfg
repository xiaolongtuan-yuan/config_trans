hostname DeviceD

ip multicast-routing

access-list 2000 permit ip 232.1.1.0 0.0.0.255

router isis

is-type level-1

net 10.0000.0000.0004.00

interface GigabitEthernet1/0/0

no shutdown

ip address 10.10.4.2 255.255.255.0

isis network point-to-point

ip pim sparse-mode

ip igmp version 3

ip igmp ssm-map enable

interface GigabitEthernet2/0/0

no shutdown

ip address 192.168.3.2 255.255.255.0

ip pim sparse-mode

router isis

interface GigabitEthernet3/0/0

no shutdown

ip address 192.168.4.1 255.255.255.0

ip pim sparse-mode

router isis

ip igmp ssm-map 232.1.1.0 255.255.255.0 10.10.1.1

ip igmp ssm-map 232.1.1.0 255.255.255.0 10.10.3.1

ip pim ssm default

ip pim ssm range 2000

end