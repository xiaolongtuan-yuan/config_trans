hostname PE3
mpls ip
mpls label protocol ldp
mpls label ldp advertise-router-id loopback0
l2vpn
vsi ldp1 static
 vfi 100
  vpn id 100
  autodiscovery bgp signaling bgp
  neighbor 3.3.3.3 pw-id 100
  neighbor 4.4.4.4 pw-id 100
interface GigabitEthernet1/0/0
 no shutdown

interface GigabitEthernet1/0/0.1
 encapsulation dot1Q 10
 xconnect vfi 100

interface GigabitEthernet1/0/1
 no shutdown
 ip address 172.16.35.5 255.255.255.0
 mpls ip
 mpls ldp autoconfig
 ospf 1 area 0
  network 172.16.35.0 0.0.0.255

interface GigabitEthernet1/0/2
 no shutdown
 ip address 172.16.45.5 255.255.255.0
 mpls ip
 mpls ldp autoconfig
 ospf 1 area 0
  network 172.16.45.0 0.0.0.255

interface Loopback0
 ip address 5.5.5.5 255.255.255.255
router ospf 1
 network 5.5.5.5 0.0.0.0 area 0
 network 172.16.35.0 0.0.0.255 area 0
 network 172.16.45.0 0.0.0.255 area 0
