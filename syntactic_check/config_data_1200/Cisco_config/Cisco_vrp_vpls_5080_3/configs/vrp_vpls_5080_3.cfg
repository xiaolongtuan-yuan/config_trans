hostname PE2

mpls ldp router-id Loopback1 force
mpls ldp discovery transport-address Loopback1

ip access-list standard VPN-Labels
 permit 3.3.3.9

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.20.1.2 255.255.255.0
 mpls ip

interface GigabitEthernet2/0/0
 no shutdown

interface GigabitEthernet2/0/0.10
 encapsulation dot1Q 10
 xconnect vfi a2

interface Loopback1
 ip address 3.3.3.9 255.255.255.255

mpls traffic-eng
router ospf 1
 router-id 3.3.3.9
 network 3.3.3.9 0.0.0.0 area 0
 network 10.20.1.0 0.0.0.255 area 0
 network 172.16.1.0 0.0.0.255 area 0
 mpls traffic-eng area 0

interface Tunnel10
 ip unnumbered Loopback1
 tunnel destination 1.1.1.9

mpls traffic-eng
 logging events
end