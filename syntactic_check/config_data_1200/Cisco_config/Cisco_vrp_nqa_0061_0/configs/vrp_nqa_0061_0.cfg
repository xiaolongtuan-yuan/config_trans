hostname DeviceB
!
interface GigabitEthernet1/0/1
 no shutdown
!
interface GigabitEthernet1/0/1.1
 ip address 10.1.1.2 255.255.255.0
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.2.1 255.255.255.0
!
ip sla 1
 icmp-echo 10.1.3.2 source-interface GigabitEthernet1/0/1.1
 frequency 10
 threshold 500000
 timeout 20000
ip sla schedule 1 life forever start-time now
!
ip sla 2
 icmp-echo 2.2.2.2 source-interface GigabitEthernet1/0/1.1
 frequency 10
 threshold 500000
 timeout 20000
ip sla schedule 2 life forever start-time now
!
class-map match-all test-class
 match access-group 101
!
access-list 101 permit ip any host 10.1.3.2
access-list 101 permit ip host 10.1.1.1 any
!
policy-map test-policy
 class test-class
  police cir 500000 bc 20000 be 20000
   conform-action transmit
   exceed-action drop
!
interface GigabitEthernet1/0/1.1
 service-policy input test-policy
!
end