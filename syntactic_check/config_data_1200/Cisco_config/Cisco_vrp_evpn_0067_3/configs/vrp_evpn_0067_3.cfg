hostname CPE

bridge-domain 10
 vxlan vni 10 flood vtep
 vxlan vni 10 suppress-arp
 vxlan vni 10 ingress-replication protocol bgp
 vxlan vni 10 ingress-replication bgp router-id 4.4.4.4
 vxlan vni 10 ingress-replication bgp peer-list 3.3.3.3

bridge-domain 20
 vxlan vni 20 flood vtep
 vxlan vni 20 suppress-arp
 vxlan vni 20 ingress-replication protocol bgp
 vxlan vni 20 ingress-replication bgp router-id 4.4.4.4
 vxlan vni 20 ingress-replication bgp peer-list 3.3.3.3

router isis 1
 net 20.0000.0000.0001.00

interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.1.1.2 255.255.255.0
 isis network point-to-point

interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.2.2 255.255.255.0
 isis network point-to-point

interface GigabitEthernet1/0/3
 no shutdown
 ethernet service instance 17 ethernet
  encapsulation dot1q 100
  bridge-domain 10
  exit
 ethernet service instance 17 ethernet
  encapsulation dot1q 200
  bridge-domain 10
  exit

interface Loopback1
 ip address 4.4.4.4 255.255.255.255
 isis network point-to-point

interface nve1
 source-interface Loopback1
 member vni 10
  mcast-group 239.1.1.1
  ingress-replication protocol bgp
  ingress-replication bgp router-id 4.4.4.4
  ingress-replication bgp peer-list 3.3.3.3
  exit
 member vni 20
  mcast-group 239.1.1.1
  ingress-replication protocol bgp
  ingress-replication bgp router-id 4.4.4.4
  ingress-replication bgp peer-list 3.3.3.3
  exit

end