hostname DeviceA

router isis
 net 10.0000.0000.0001.00
 frr
  lfa level-1
  lfa level-2

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.0.1.1 255.255.255.0
 isis network point-to-point

interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.1.1.1 255.255.255.0
 isis network point-to-point
 isis metric 30
