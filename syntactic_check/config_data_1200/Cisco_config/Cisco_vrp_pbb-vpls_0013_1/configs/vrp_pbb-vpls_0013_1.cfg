hostname UPE1
!
mpls label protocol ldp
!
mpls l2vpn
!
vsi context bvsi1
  vsi-id 100
  pwsignal ldp
  peer 2.2.2.2
  peer 4.4.4.4
  protect-group bwanxixianzotect-mode pw-redundancy master
   reroute delay 60
   peer 2.2.2.2 preference 1
   peer 3.3.3.3 preference 2
 pbb backbone-source-mac 00e0.fc00.1234
 pbb mac-withdraw mac-opt-compatible
!
vsi context ivsi1
  vsi-id 10
  pwsignal ldp
 pbb i-tag 100
 pbb backbone-destination-mac 00e0.fc12.3456 static
 pbb binding vsi bvsi1
!
mpls ldp
!
interface GigabitEthernet1/0/0
 no shutdown
!
interface GigabitEthernet1/0/0.1
 encapsulation dot1q 10
 xconnect vsi ivsi1
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.1.1.1 255.255.255.0
 mpls ip
!
interface GigabitEthernet3/0/0
 no shutdown
 ip address 10.3.1.1 255.255.255.0
 mpls ip
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.1.1.0 0.0.0.255 area 0
 network 10.3.1.0 0.0.0.255 area 0
!
end
