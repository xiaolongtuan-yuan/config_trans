hostname AP1
!
bfd
!
ip access-list standard VCA_ACL
 permit host 1.1.1.1
!
ip access-list standard VCA_ACL_MASTER
 permit host 3.3.3.3
 permit host 4.4.4.4
!
interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.1.2.1 255.255.255.252
 ip router isis
 isis circuit-type level-1
 isis metric 10
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.3.1 255.255.255.252
 ip router isis
 isis circuit-type level-1
 isis metric 10
!
interface GigabitEthernet1/0/3
 shutdown
 ip address 192.168.0.1 255.255.255.0
 ip router isis
 isis circuit-type level-1
 isis metric 10
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
 ip router isis
 isis circuit-type level-1
 isis metric 10
!
router isis
 net 49.0000.0000.0000.0003.00
 is-type level-1
 metric-style wide
!
end