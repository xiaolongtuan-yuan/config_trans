hostname P2

! MPLS Label Range Configuration

! MPLS LDP Configuration
mpls ldp router-id Loopback0 force
mpls ldp discovery hello holdtime 15
mpls ldp discovery targeted-hello holdtime 15

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.3.1.2 255.255.255.0
 mpls ip
 mpls ldp enable

interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.4.1.1 255.255.255.0
 mpls ip
 mpls ldp enable

interface Loopback0
 no shutdown
 ip address 4.4.4.9 255.255.255.255

router ospf 1
 network 4.4.4.9 0.0.0.0 area 0
 network 10.3.1.0 0.0.0.255 area 0
 network 10.4.1.0 0.0.0.255 area 0