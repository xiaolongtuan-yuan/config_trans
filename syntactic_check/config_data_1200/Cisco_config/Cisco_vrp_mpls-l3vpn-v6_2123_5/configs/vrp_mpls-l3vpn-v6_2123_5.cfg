hostname CE3
!
ipv6 unicast-routing
!
interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ip address 10.3.1.1 255.255.255.0
 ipv6 address 2001:DB8:4::1/64
!
interface Loopback1
 ipv6 enable
 ip address 2.2.2.2 255.255.255.255
 ipv6 address 2001:DB8:9::1/64
!
router ospfv3 1
 router-id 22.22.22.22
 ! 移除单独的行 "area 0.0.0.0" (修正行22)
 !
 address-family ipv6 unicast  ! 显式启用IPv6地址族
  area 0.0.0.0
 exit-address-family
!
router ospf 1
 router-id 22.22.22.22
 network 2.2.2.2 0.0.0.0 area 0.0.0.0
 network 10.3.1.0 0.0.0.255 area 0.0.0.0
!
end