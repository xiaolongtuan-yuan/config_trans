hostname PE2
!
ip vrf vpn1

!
mpls ldp router-id Loopback1
!
router isis
 net 10.0000.0000.0005.00
 is-type level-2-only
 metric-style wide
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 30.1.1.2 255.255.255.0
 mpls ip
 isis network point-to-point
 isis metric 10
!
interface GigabitEthernet2/0/0
 no shutdown
 ip vrf forwarding vpn1
 ip address 21.1.1.1 255.255.255.0
!
interface Loopback1
 ip address 4.4.4.9 255.255.255.255
!
router bgp 100
 bgp log-neighbor-changes
 neighbor 3.3.3.9 remote-as 100
 neighbor 3.3.3.9 update-source Loopback1
 !
 address-family ipv4 unicast
  neighbor 3.3.3.9 activate
  no synchronization
 exit-address-family
 !
 address-family vpnv4 unicast
  neighbor 3.3.3.9 activate
  neighbor 3.3.3.9 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf vpn1
  redistribute connected
  neighbor 21.1.1.2 remote-as 300
  neighbor 21.1.1.2 route-map policy1 out
  neighbor 21.1.1.2 send-label
 exit-address-family
!
router ospf 1
 network 4.4.4.9 0.0.0.0 area 0
 network 21.1.1.0 0.0.0.255 area 0
!
route-map policy1 permit 10
 set mpls-label
!
end