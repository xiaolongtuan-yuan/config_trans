hostname DeviceD
!
ipv6 unicast-routing
!
ipv6 multicast-routing
!
ipv6 access-list MCAST-SOURCES
 permit ipv6 2001:DB8:5::5/64 any
!
ipv6 access-list MCAST-RECEIVERS
 permit ipv6 2001:DB8:3::2/64 any
!
ipv6 access-list RP-FILTER
 permit ipv6 host 2001:DB8:3::2 FF00::8/128
!
interface Loopback0
 ipv6 address 2001:DB8:3::2/128
 ipv6 pim sparse-mode
!
interface GigabitEthernet1/0/0
 no shutdown
 ipv6 address 2001:DB8:2::2/64
 ipv6 ospf 1 area 0
 ipv6 pim sparse-mode
!
interface GigabitEthernet2/0/0
 no shutdown
 ipv6 address 2001:DB8:3::2/64
 ipv6 ospf 1 area 0
 ipv6 pim sparse-mode
!
interface GigabitEthernet3/0/0
 no shutdown
 ipv6 address 2001:DB8:4::1/64
 ipv6 ospf 1 area 0
 ipv6 pim sparse-mode
!
ipv6 router ospf 1
 router-id 4.4.4.4
!
ipv6 pim rp-address 2001:DB8:3::2 RP-FILTER
ipv6 pim bsr candidate Loopback0
!
end