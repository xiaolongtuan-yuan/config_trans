hostname DeviceA
!
bfd
!
router ospfv3 1
 router-id 1.1.1.1
 area 0.0.0.0
 bfd all-interfaces
!
interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:db8:1::1/64
 ospfv3 1 ipv6 area 0.0.0.0
!
bfd-template single-hop IPv6-BFD
 interval min-tx 300 min-rx 300 multiplier 3
!
bfd session
 interface GigabitEthernet1/0/0
  destination 2001:db8:2::2

!
end