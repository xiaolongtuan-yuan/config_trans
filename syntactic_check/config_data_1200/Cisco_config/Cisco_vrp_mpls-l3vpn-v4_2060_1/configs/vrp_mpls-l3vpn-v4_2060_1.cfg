hostname PE3

! VRF Configuration
vrf definition vpn1
 rd 100:1
 address-family ipv4
  route-target export 1:1
  route-target import 1:1
 exit-address-family

! MPLS Configuration
mpls ip
mpls ldp router-id Loopback1
mpls ldp discovery hello holdtime 5
mpls ldp discovery targeted-hello holdtime 15

! Interface Configurations
interface GigabitEthernet1/0/0
 no shutdown
 vrf forwarding vpn1
 ip address 172.16.1.2 255.255.255.0

interface GigabitEthernet2/0/0
 no shutdown
 ip address 40.1.1.1 255.255.255.0
 mpls ip
 mpls ldp enable

interface Loopback1
 ip address 1.1.1.9 255.255.255.255

! BGP Configuration
router bgp 200
 bgp router-id 1.1.1.9
 neighbor 6.6.6.9 remote-as 300
 neighbor 6.6.6.9 ebgp-multihop 10
 neighbor 6.6.6.9 update-source Loopback1
 !
 address-family ipv4
  neighbor 6.6.6.9 activate
  no synchronization
 exit-address-family
 !
 address-family vpnv4
  neighbor 6.6.6.9 activate
  neighbor 6.6.6.9 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf vpn1
  redistribute connected
  neighbor 172.16.1.1 remote-as 65410
  neighbor 172.16.1.1 activate
 exit-address-family

! OSPF Configuration
router ospf 1
 network 1.1.1.9 0.0.0.0 area 0
 network 40.1.1.0 0.0.0.255 area 0
!