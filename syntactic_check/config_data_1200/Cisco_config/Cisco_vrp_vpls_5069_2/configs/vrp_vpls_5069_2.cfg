hostname PE3

mpls ldp router-id Loopback0 force

mpls label protocol ldp

mpls l2vpn

vfi vsi1 autodiscovery bgp

vfi vsi1 vpn id 1

vfi vsi1 neighbor 1.1.1.1 encapsulation mpls

vfi vsi1 rd 192.168.0.0:1

vfi vsi1 import route-target 100:1

vfi vsi1 export route-target 100:1

vfi vsi1 mac-withdraw enable

vfi vsi1 mac-withdraw propagate enable

interface GigabitEthernet1/0/0

no shutdown

ip address 192.168.5.1 255.255.255.0

mpls ip

mpls ldp autoconfig

interface GigabitEthernet1/0/1

no shutdown

ip address 192.168.2.2 255.255.255.0

mpls ip

mpls ldp autoconfig

interface GigabitEthernet1/0/2

no shutdown

ip address 192.168.3.1 255.255.255.0

mpls ip

mpls ldp autoconfig

interface Loopback0

ip address 3.3.3.3 255.255.255.255

router bgp 100

neighbor 2.2.2.2 remote-as 100

neighbor 2.2.2.2 update-source Loopback0

neighbor 4.4.4.4 remote-as 100

neighbor 4.4.4.4 update-source Loopback0

address-family ipv4

neighbor 2.2.2.2 activate

neighbor 4.4.4.4 activate

address-family l2vpn vpls

neighbor 2.2.2.2 activate

neighbor 4.4.4.4 activate

router ospf 1

router-id 3.3.3.3

network 3.3.3.3 0.0.0.0 area 0

network 192.168.2.0 0.0.0.255 area 0

network 192.168.3.0 0.0.0.255 area 0

network 192.168.4.0 0.0.0.255 area 0

network 192.168.5.0 0.0.0.255 area 0

