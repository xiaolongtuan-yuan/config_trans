sysname Device1

evpn vpn-instance evrf1 bd-mode
 route-distinguisher 10:1
 vpn-target 11:1 export-extcommunity
 vpn-target 11:1 import-extcommunity

bridge-domain 10
 vxlan vni 10 split-horizon-mode
 evpn binding vpn-instance evrf1

interface GigabitEthernet1/0/0
 no shutdown

interface GigabitEthernet1/0/0.1
 encapsulation dot1q 10
 bridge-domain 10

interface GigabitEthernet2/0/0
 no shutdown
 ip address 192.168.40.2 255.255.255.0

interface LoopBack1
 ip address 5.5.5.5 255.255.255.255

interface Nve1
 source-interface LoopBack1
 member vni 10 mcast-group 239.1.1.1

router bgp 65410
 neighbor 4.4.4.4 remote-as 65410
 neighbor 4.4.4.4 update-source LoopBack1
 neighbor 6.6.6.6 remote-as 65420
 neighbor 6.6.6.6 ebgp-multihop 255
 neighbor 6.6.6.6 update-source LoopBack1
 address-family ipv4
  neighbor 4.4.4.4 activate
  neighbor 6.6.6.6 activate
 exit-address-family
 address-family l2vpn evpn
  neighbor 6.6.6.6 activate
  neighbor 6.6.6.6 send-community extended
  neighbor 6.6.6.6 next-hop-unchanged
  neighbor 6.6.6.6 advertise encapsulation-type vxlan
 exit-address-family

router ospf 1
 network 5.5.5.5 0.0.0.0 area 0
 network 192.168.40.0 0.0.0.255 area 0

end