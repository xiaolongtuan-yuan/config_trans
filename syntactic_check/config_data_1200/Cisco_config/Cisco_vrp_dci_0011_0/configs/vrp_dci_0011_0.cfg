hostname Device1

vrf definition evrf1
 rd 10:1
 route-target export 11:1
 route-target import 11:1

!evpn instance 1 vlan-based
 rd 10:1

bridge-domain 10
 !vni 10
 !evpn
 ! evi 1

interface GigabitEthernet1/0/0
 no shutdown

interface GigabitEthernet1/0/0.1
 encapsulation dot1Q 10
 service instance 10 ethernet
  bridge-domain 10

interface GigabitEthernet2/0/0
 no shutdown
 ip address 192.168.40.2 255.255.255.0

interface Loopback1
 ip address 5.5.5.5 255.255.255.255

interface nve1
 !source-interface Loopback1
 !host-reachability protocol bgp
 !member vni 10
 ! mcast-group 239.1.1.1
 ! suppress-arp

router bgp 65410
 bgp router-id 5.5.5.5
 neighbor 4.4.4.4 remote-as 65410
 neighbor 4.4.4.4 update-source Loopback1
 neighbor 6.6.6.6 remote-as 65420
 neighbor 6.6.6.6 ebgp-multihop 255
 neighbor 6.6.6.6 update-source Loopback1
 !
 address-family ipv4 unicast
  neighbor 4.4.4.4 activate
  neighbor 6.6.6.6 activate
 exit-address-family
 !
 !address-family l2vpn evpn
  neighbor 4.4.4.4 activate
  neighbor 6.6.6.6 activate
  neighbor 6.6.6.6 send-community extended
!  advertise evpn
! exit-address-family

router ospf 1
 network 5.5.5.5 0.0.0.0 area 0
 network 192.168.40.0 0.0.0.255 area 0