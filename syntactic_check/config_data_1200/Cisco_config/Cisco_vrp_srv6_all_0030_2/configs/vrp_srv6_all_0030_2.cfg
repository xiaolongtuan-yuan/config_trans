hostname P2

bfd
  echo-interface GigabitEthernet1/0/0
  echo-interface GigabitEthernet2/0/0
  
router isis 1
 is-type level-2-only
 metric-style wide
 net 10.0000.0000.0004.00
  
ipv6 unicast-routing

interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8:3::2/96
 isis ipv6 enable
  
interface GigabitEthernet2/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8:4::1/96
 isis ipv6 enable
  
interface Loopback1
 ipv6 enable
 ipv6 address 4::4/128
 isis ipv6 enable
  
end