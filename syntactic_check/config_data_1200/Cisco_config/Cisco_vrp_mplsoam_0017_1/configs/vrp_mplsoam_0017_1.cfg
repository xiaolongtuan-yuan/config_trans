hostname LSRB

! MPLS LDP configuration (router-id must be set first)
mpls ldp router-id Loopback1 force
! mpls label range 1000 1999  ! Removed: Not recognized in this context

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.1.1.2 255.255.255.252
 mpls ip
 mpls traffic-eng tunnels

interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.2.1.1 255.255.255.252
 mpls ip
 mpls traffic-eng tunnels

interface Loopback1
 ip address 2.2.2.2 255.255.255.255

! MPLS-TE global configuration
mpls traffic-eng
 path-option 10 explicit name Tunnel10
 path-option 20 explicit name Tunnel20
 autoroute announce

! Explicit path configuration (correct syntax)

! Tunnel interfaces (simplified syntax)
interface Tunnel10
 ip unnumbered Loopback1
 tunnel destination 10.2.1.2

interface Tunnel20
 ip unnumbered Loopback1
 tunnel destination 10.1.1.1
