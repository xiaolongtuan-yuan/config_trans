hostname CGN
!
license boot level securityk9
!
ip access-list standard 2001
 permit 10.10.10.0 0.0.0.255
!
ip nat inside source list 2001 pool nat1 overload
ip nat pool nat1 10.34.161.101 10.34.161.105 netmask 255.255.255.0
!
class-map match-all c1
 match access-group name 2001
!
policy-map p1
 class c1
!
interface GigabitEthernet2/0/2
 no shutdown
 ip address 192.168.11.2 255.255.255.0
 service-policy input p1
!
end