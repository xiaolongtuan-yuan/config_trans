hostname PE2

! VRF Configuration
vrf definition vpn1
 rd 200:2
 address-family ipv4
  route-target export 1:1
  route-target import 1:1
 exit-address-family

! MPLS Configuration
mpls ip
mpls ldp router-id Loopback1
mpls ldp discovery hello holdtime 15
mpls ldp discovery targeted-hello holdtime 15

! IS-IS Configuration
router isis
 net 10.0000.0000.0005.00
 is-type level-2-only
 metric-style wide

! Interface Configuration
interface GigabitEthernet1/0/0
 no shutdown
 ip address 30.1.1.2 255.255.255.0
 mpls ip
 mpls ldp enable

interface GigabitEthernet2/0/0
 no shutdown
 vrf forwarding vpn1
 ip address 21.1.1.1 255.255.255.0

interface Loopback1
 ip address 4.4.4.9 255.255.255.255

! BGP Configuration
router bgp 100
 bgp router-id 4.4.4.9
 neighbor 3.3.3.9 remote-as 100
 neighbor 3.3.3.9 update-source Loopback1
 !
 address-family ipv4
  no synchronization
  neighbor 3.3.3.9 activate
  neighbor 3.3.3.9 next-hop-self
 exit-address-family
 !
 address-family vpnv4
  neighbor 3.3.3.9 activate
  neighbor 3.3.3.9 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf vpn1
  neighbor 21.1.1.2 remote-as 300
  neighbor 21.1.1.2 activate
  redistribute connected
 exit-address-family
!

! OSPF Configuration (for PE-CE if needed)
router ospf 1 vrf vpn1
 network 21.1.1.0 0.0.0.255 area 0
!