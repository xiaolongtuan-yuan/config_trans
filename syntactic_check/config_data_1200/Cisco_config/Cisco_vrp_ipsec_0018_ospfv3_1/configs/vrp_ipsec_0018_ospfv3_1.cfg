hostname DeviceB
!
crypto ikev2 policy 2
 encryption aes-cbc-256
 integrity sha256
 group 2
!
crypto ikev2 keyring KEYRING
 !peer <peer IP>
  !pre-shared-key 0 %#%#<}j/@XSE9JZT5]2"T#]2"T<}j/@XSE9JZT5>%#%#
!
crypto ipsec transform-set PROPOSAL2 esp-aes 256 esp-sha256-hmac
!
crypto map HUAWEI_MAP 10 ipsec-isakmp
 !set peer <peer IP>
 set transform-set PROPOSAL2
 match address HUAWEI_ACL
!
interface GigabitEthernet1/0/1
 no shutdown
 ipv6 enable
 ipv6 address 2001:db8::2/64
 crypto map HUAWEI_MAP
!
ipv6 unicast-routing
!
router ospfv3 1
 router-id 2.2.2.2
 area 1 virtual-link <neighbor router-id> <neighbor IPv6 link-local address>
!
end