hostname Router
!
vlan 10
vlan 20
!
ip access-list extended ACL_3001
 deny ip 10.1.1.0 0.0.0.255 10.1.2.0 0.0.0.255
!
ip access-list extended ACL_3002
 deny ip 10.1.2.0 0.0.0.255 10.1.1.0 0.0.0.255
!
class-map match-all cm1
 match access-group name ACL_3001
 match access-group name ACL_3002
!
policy-map pm1
 class cm1
  drop
!
interface Vlan10
 ip address 10.1.1.1 255.255.255.0
!
interface Vlan20
 ip address 10.1.2.1 255.255.255.0
!
interface GigabitEthernet1/0/0
 switchport mode trunk
 switchport trunk allowed vlan 10
 service-policy input pm1
!
interface GigabitEthernet2/0/0
 switchport mode trunk
 switchport trunk allowed vlan 20
 service-policy input pm1
!
end