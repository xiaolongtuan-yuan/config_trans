hostname PE2

mpls label protocol ldp

mpls ldp router-id Loopback1 force

mpls ldp discovery transport-address Loopback1

mpls ldp router-id 2.2.2.2

mpls ldp advertise-labels

mpls ldp advertise-labels for 10.1.2.2/32

mpls ldp advertise-labels for 10.1.5.1/32

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.1.2.2 255.255.255.0
 mpls ip

interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.1.5.1 255.255.255.0
 mpls ip

interface GigabitEthernet1/0/3.1
 encapsulation dot1q 10
 xconnect vfi vsi1

interface Loopback1
 ip address 2.2.2.2 255.255.255.255

router ospf 100
 router-id 2.2.2.2
 network 2.2.2.2 0.0.0.0 area 0
 network 10.1.2.0 0.0.0.255 area 0
 network 10.1.5.0 0.0.0.255 area 0

router bgp 100
 bgp router-id 2.2.2.2
 neighbor 1.1.1.1 remote-as 100
 neighbor 1.1.1.1 update-source Loopback1
 !
 address-family vpnv4
  neighbor 1.1.1.1 activate
  neighbor 1.1.1.1 send-community both
  neighbor 1.1.1.1 route-reflector-client
 exit-address-family

vfi vsi1
 vpn id 2
 rd 2:2
 route-target export 2:2
 route-target import 2:2

