hostname ASBR2
!
mpls ldp router-id Loopback1 force
mpls ip
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.162.1.1 255.255.255.0
 mpls ip
 mpls ldp enable
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 192.168.1.2 255.255.255.0
 mpls ip
!
interface Loopback1
 ip address 10.33.3.9 255.255.255.255
!
router bgp 200
 neighbor 192.168.1.1 remote-as 100
 neighbor 10.34.4.9 remote-as 200
 neighbor 10.34.4.9 update-source Loopback1
 !
 address-family ipv4
  no synchronization
  neighbor 192.168.1.1 activate
  neighbor 10.34.4.9 activate
 exit-address-family
 !
 address-family vpnv4
  neighbor 10.34.4.9 activate
  neighbor 192.168.1.1 activate
 exit-address-family
!
router ospf 1
 network 10.33.3.9 0.0.0.0 area 0
 network 10.162.1.0 0.0.0.255 area 0
!
end