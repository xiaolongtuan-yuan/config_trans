hostname P1

! BFD Configuration for IPv6
bfd
 interface GigabitEthernet1/0/0
  bfd interval 50 min_rx 50 multiplier 3
  no shutdown
 interface GigabitEthernet2/0/0
  bfd interval 50 min_rx 50 multiplier 3
  no shutdown

! IS-IS Configuration
router isis 1
 net 10.0000.0000.0002.00
 is-type level-2-only
 metric-style wide
 address-family ipv6
  multi-topology
 exit-address-family

interface GigabitEthernet1/0/0
 no shutdown
 ipv6 address 2001:DB8:1::2/96
 isis ipv6 metric 10
 isis network point-to-point

interface GigabitEthernet2/0/0
 no shutdown
 ipv6 address 2001:DB8:2::1/96
 isis ipv6 metric 10
 isis network point-to-point

interface Loopback1
 ipv6 address 2::2/128
 isis passive
 isis ipv6 metric 1