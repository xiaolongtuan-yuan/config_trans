hostname PE2

! IS-IS Configuration for IPv6
router isis 1
 net 49.0000.0000.0003.00
 is-type level-2-only
 address-family ipv6
  multi-topology
 exit-address-family

ipv6 unicast-routing

! Interface Configurations
interface Loopback4
 ipv6 address 2001:DB08:4::1/128
 isis ipv6 metric 1

interface GigabitEthernet2/0/1
 ipv6 address 2001:DB08:3::1/64
 isis ipv6 metric 10
 isis network point-to-point

! L2TPv3 Tunnel Configuration
interface Tunnel0
 ipv6 address 2001:DB08:1::1/128
 tunnel mode ipsec ipv4
 tunnel source Loopback4
 tunnel protection ipsec profile PROFILE_NAME

! Pseudowire Configuration
interface GigabitEthernet1/0/1.4
 encapsulation dot1Q 2
 service instance 2 ethernet
  l2protocol forward
  xconnect 2001:DB08:1::1 100 encapsulation l2tpv3 pw-class PW_NAME

! L2TPv3 Class Configuration
l2tp-class PW_NAME
 password 7 PASSWORD

! IPSec Configuration
crypto ikev2 policy 10
 encryption aes-cbc-256
 integrity sha512
 group 14
 prf sha512
 lifetime seconds 3600

crypto ikev2 keyring KEYRING
 peer ANY
  address 0.0.0.0 0.0.0.0
  pre-shared-key PRE_SHARED_KEY

crypto ipsec profile PROFILE_NAME
 set transform-set TRANSFORM_SET_NAME
 set ikev2-profile IKEV2_PROFILE

crypto ikev2 profile IKEV2_PROFILE
 match identity remote address 0.0.0.0
 authentication remote pre-share
 authentication local pre-share
 keyring local KEYRING

crypto ipsec transform-set TRANSFORM_SET_NAME esp-aes 256 esp-sha-hmac