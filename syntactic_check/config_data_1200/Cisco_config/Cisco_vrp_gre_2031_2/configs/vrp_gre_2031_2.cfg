hostname DeviceC
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 172.21.1.2 255.255.255.0
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.2.1.2 255.255.255.0
!
interface Tunnel1
 ip address 172.22.1.2 255.255.255.0
 tunnel source GigabitEthernet1/0/0
 tunnel destination 172.20.1.1
!
router ospf 1
 network 172.21.1.0 0.0.0.255 area 0
!
ip route 10.1.1.0 255.255.255.0 Tunnel1
!
end