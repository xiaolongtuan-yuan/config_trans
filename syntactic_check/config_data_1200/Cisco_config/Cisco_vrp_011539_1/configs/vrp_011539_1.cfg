hostname PE2
!
ethernet cfm global
!
mpls ip
mpls ldp router-id Loopback0
!
l2vpn vfi context ldp1
 vpn id 1
! member pseudowire neighbor 2.2.2.2 1 encapsulation mpls
!
interface GigabitEthernet1/0/1.1
 encapsulation dot1q 2
 xconnect vfi ldp1
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.1.2 255.255.255.0
 mpls ip
 mpls ldp autoconfig
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.1.1.0 0.0.0.255 area 0
!
ethernet cfm domain md1 level 7
 service ma1
!  continuity-check
!  mep 2 interface GigabitEthernet1/0/1.1 inward
!   ccm-transmit
!  mep 1
!   ccm-receive
!
end