hostname PE1
!
bfd
!
!
mpls ldp router-id Loopback1 force
!
mpls traffic-eng
!
!ip explicit-path name backup enable
! next-address 10.3.1.2
! next-address 10.5.1.2
! next-address 3.3.3.3
!
!ip explicit-path name main enable
! next-address 10.4.1.2
! next-address 10.2.1.2
! next-address 3.3.3.3
!
router isis
 net 49.0000.0000.0004.00
! is-type level-1-2
 metric-style wide
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.3.1.1 255.255.255.252
 ip router isis
 mpls ip
 mpls traffic-eng tunnels
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.4.1.1 255.255.255.252
 ip router isis
 mpls ip
 mpls traffic-eng tunnels
!
interface Loopback1
 ip address 4.4.4.4 255.255.255.255
 ip router isis
!
interface Tunnel10
 ip unnumbered Loopback1
! tunnel mode mpls traffic-eng
 tunnel destination 3.3.3.3
! tunnel mpls traffic-eng record-route
! tunnel mpls traffic-eng backup-path Tunnel 10
! tunnel mpls traffic-eng path-option 1 explicit name main
! tunnel mpls traffic-eng path-option 2 explicit name backup
! tunnel mpls traffic-eng bfd
! tunnel mpls traffic-eng bfd min-tx-interval 100 min-rx-interval 100
!
end