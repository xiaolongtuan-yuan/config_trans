hostname DeviceA

interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:db8:1::1/64

interface GigabitEthernet2/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:db8:100::1/96

router bgp 100
 bgp router-id 1.1.1.1
 neighbor 2001:db8:100::2 remote-as 200
 !
 address-family ipv6
  no synchronization
  network 2001:db8:1::/64
  neighbor 2001:db8:100::2 activate
 exit-address-family

end