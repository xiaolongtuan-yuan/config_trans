hostname CE1

! MPLS Configuration
mpls ip
mpls ldp router-id Loopback1
mpls ldp discovery hello holdtime 15
mpls ldp discovery targeted-hello holdtime 15

! Interface Configurations
interface GigabitEthernet1/0/0
 no shutdown
 ip address 40.1.1.2 255.255.255.0
 mpls ip
 mpls ldp enable

interface GigabitEthernet2/0/0
 no shutdown
 ip address 11.1.1.1 255.255.255.0
 mpls ip
 mpls ldp enable

interface Loopback1
 ip address 2.2.2.9 255.255.255.255

! BGP Configuration
router bgp 200
 bgp router-id 2.2.2.9
 neighbor 1.1.1.9 remote-as 200
 neighbor 1.1.1.9 update-source Loopback1
 neighbor 11.1.1.2 remote-as 100
 !
 address-family ipv4 unicast
  neighbor 1.1.1.9 activate
  neighbor 11.1.1.2 activate
  no synchronization
  redistribute ospf 1
 exit-address-family
 !
 address-family ipv4 vrf public
  neighbor 1.1.1.9 activate
  neighbor 11.1.1.2 activate
 exit-address-family
!

! OSPF Configuration
router ospf 1
 network 2.2.2.9 0.0.0.0 area 0
 network 40.1.1.0 0.0.0.255 area 0
 network 11.1.1.0 0.0.0.255 area 0
!
end