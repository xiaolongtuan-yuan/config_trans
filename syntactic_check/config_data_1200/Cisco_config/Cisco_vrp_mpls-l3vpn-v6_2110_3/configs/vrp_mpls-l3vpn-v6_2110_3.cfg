hostname PE1
!
vrf definition vpn1
 rd 200:1
 route-target export 1:1
 route-target import 1:1
!
router isis
 net 10.0000.0000.0004.00
!
router ospf 1 vrf vpn1
 redistribute bgp 100 subnets
 network 3.3.3.9 0.0.0.0 area 0
 network 11.1.1.0 0.0.0.255 area 0
!
interface GigabitEthernet1/0/0
 no shutdown
 vrf forwarding vpn1
 ip address 11.1.1.2 255.255.255.0
 mpls ip
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 30.1.1.1 255.255.255.0
 mpls ip
!
interface Loopback1
 ip address 3.3.3.9 255.255.255.255
!
router bgp 100
 neighbor 4.4.4.9 remote-as 100
 neighbor 4.4.4.9 update-source Loopback1
 !
 address-family ipv4
  neighbor 4.4.4.9 activate
  no synchronization
 exit-address-family
 !
 address-family vpnv4
  neighbor 4.4.4.9 activate
 exit-address-family
 !
 address-family ipv4 vrf vpn1
  redistribute ospf 1
 exit-address-family
!
end