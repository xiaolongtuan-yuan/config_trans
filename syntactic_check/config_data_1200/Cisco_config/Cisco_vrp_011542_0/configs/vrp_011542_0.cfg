hostname CE1
!
vlan 2
!
ethernet cfm ieee
!
ethernet cfm domain MD3 level 0
!
ethernet cfm service MA3 vlan 2
 !continuity-check
!
interface GigabitEthernet1/0/1
 switchport mode trunk
 switchport trunk allowed vlan 2
 no shutdown
 ethernet cfm mep 3 domain MD3 service MA3 direction down
 ethernet cfm mip
!
end