hostname CE1
!
vlan 2
!
ethernet cfm
  ieee dot1ag
!
interface GigabitEthernet1/0/1
 switchport mode trunk
 switchport trunk allowed vlan 2
 no shutdown
!
ethernet cfm
 cfm version 0
 cfm domain md3 level 0
  service ma3 vlan 2
   mep id 3 mep-direction receive
   mep interface GigabitEthernet1/0/1
   ccm-send mep-id 3 enable
   remote-mep mep-id 4 ccm-receive enable
   mep test 1 mep-src-id 3 mep-dst-id 4
   mep test 2 mep-src-id 3
   delay-measurement one-way test-id 2 continual receive

end