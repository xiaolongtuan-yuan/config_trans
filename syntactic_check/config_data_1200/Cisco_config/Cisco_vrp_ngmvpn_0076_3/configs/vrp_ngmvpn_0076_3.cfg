hostname ASBR2

mpls ldp router-id Loopback0 force
mpls ldp discovery targeted-hello accept
mpls ldp discovery targeted-hello initiate

interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.1.4.1 255.255.255.0
 mpls ip
 mpls ldp enable

interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.3.2 255.255.255.0
 mpls ip
 mpls ldp enable

interface Loopback0
 ip address 4.4.4.4 255.255.255.255

interface NULL0
 no shutdown

router isis
 net 49.0000.0000.0000.0004.00
 is-type level-2-only
 metric-style wide
 mpls traffic-eng router-id Loopback0
 mpls traffic-eng level-2

router bgp 65535
 bgp router-id 4.4.4.4
 neighbor 10.1.3.1 remote-as 1
 neighbor 10.1.3.1 update-source Loopback0
 neighbor 5.5.5.5 remote-as 65535
 neighbor 5.5.5.5 update-source Loopback0
 !
 address-family ipv4
  network 4.4.4.4 mask 255.255.255.255
  neighbor 10.1.3.1 activate
  neighbor 10.1.3.1 send-label
  neighbor 5.5.5.5 activate
  neighbor 5.5.5.5 send-label
 exit-address-family

ip route 3.3.3.3 255.255.255.255 10.1.3.1

route-map policy1 permit 10
 set mpls-label

route-map policy2 permit 10
 set mpls-label