hostname SSH_Server
!
crypto key generate rsa modulus 2048
!
username client001 privilege 3 secret 0 password123
ip ssh pubkey-chain
  username client001
!
username client002 privilege 3 secret 0 password456
ip ssh pubkey-chain
  username client002
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
interface GigabitEthernet0/0/0
 ip address 192.168.1.1 255.255.255.0
!
line vty 0 4
 transport input ssh
 login authentication default
 privilege level 3
!
end