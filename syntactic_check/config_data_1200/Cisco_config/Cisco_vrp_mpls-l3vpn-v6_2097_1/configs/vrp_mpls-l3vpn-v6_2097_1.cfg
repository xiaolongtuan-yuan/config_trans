hostname PE1

! VRF Configuration
vrf definition vpn1
 rd 100:1
 address-family ipv4
  route-target export 1:1
  route-target import 1:1
 exit-address-family
 address-family ipv6
  route-target export 1:1
  route-target import 1:1
 exit-address-family

! MPLS Configuration
mpls ip
mpls ldp router-id 1.1.1.9

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.10.1.2 255.255.255.0
 mpls ip
 mpls ldp discovery hello holdtime 15
 mpls ldp discovery targeted-hello holdtime 15

interface GigabitEthernet2/0/0
 no shutdown
 vrf forwarding vpn1
 ipv6 enable
 ipv6 address 2001:db8:1::2/64

interface Loopback1
 ip address 1.1.1.9 255.255.255.255

! BGP Configuration
router bgp 100
 bgp router-id 1.1.1.9
 neighbor 2.2.2.9 remote-as 100
 neighbor 2.2.2.9 update-source Loopback1
 neighbor 4.4.4.9 remote-as 200
 neighbor 4.4.4.9 ebgp-multihop 10
 neighbor 4.4.4.9 update-source Loopback1
 !
 address-family ipv4
  neighbor 2.2.2.9 activate
  neighbor 2.2.2.9 next-hop-self
  neighbor 4.4.4.9 activate
 exit-address-family
 !
 address-family vpnv4
  neighbor 4.4.4.9 activate
  neighbor 4.4.4.9 send-community extended
 exit-address-family
 !
 address-family vpnv6
  neighbor 4.4.4.9 activate
  neighbor 4.4.4.9 send-community extended
 exit-address-family
 !
 address-family ipv6 vrf vpn1
  neighbor 2001:db8:1::1 remote-as 65001
  neighbor 2001:db8:1::1 activate
 exit-address-family

! OSPF Configuration
router ospf 1
 router-id 1.1.1.9
 network 1.1.1.9 0.0.0.0 area 0
 network 10.10.1.0 0.0.0.255 area 0