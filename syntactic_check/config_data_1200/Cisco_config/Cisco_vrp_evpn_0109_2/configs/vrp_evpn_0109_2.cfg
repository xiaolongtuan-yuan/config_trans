hostname ASBR2
!
router isis
 net 49.1111.1111.1111.0000.00
 is-type level-2-only
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.3.1.2 255.255.255.0
 mpls ip
 mpls ldp autoconfig
 isis network point-to-point
 isis metric 1
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.2.1.2 255.255.255.0
 mpls ip
!
interface Loopback1
 ip address 3.3.3.9 255.255.255.255
!
router bgp 200
 bgp router-id 3.3.3.9
 neighbor 4.4.4.9 remote-as 200
 neighbor 4.4.4.9 update-source Loopback1
 neighbor 10.2.1.1 remote-as 100
 neighbor 10.2.1.1 update-source Loopback1
 !
 address-family ipv4 unicast
  network 3.3.3.9 mask 255.255.255.255
  neighbor 4.4.4.9 activate
  neighbor 10.2.1.1 activate
 !
  neighbor 4.4.4.9 activate
  neighbor 10.2.1.1 activate
!
end