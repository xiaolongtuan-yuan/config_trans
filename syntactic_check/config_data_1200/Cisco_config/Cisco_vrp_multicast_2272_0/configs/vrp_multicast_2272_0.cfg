hostname DeviceA
!
ip multicast-routing distributed
!
interface GigabitEthernet1/0/0
 no switchport
 no shutdown
 ip address 10.1.1.1 255.255.255.0
 ip pim sparse-mode
!
interface GigabitEthernet1/0/1
 no switchport
 no shutdown
 ip address 10.1.4.1 255.255.255.0
 ip pim sparse-mode
!
router ospf 1
 network 10.1.1.0 0.0.0.255 area 0
 network 10.1.4.0 0.0.0.255 area 0
!
ip igmp static-group 225.1.1.1 source 10.1.4.100
!
event manager applet EMDI_MONITOR
 event timer cron name DAILY_MONITOR cron-entry "0 * * * *"
 action 1.0 cli command "ping 225.1.1.1 source 10.1.4.1 repeat 10"
 action 2.0 syslog msg "EMDI monitoring executed"
!
end