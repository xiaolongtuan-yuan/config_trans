hostname DeviceC
!
flow exporter exporter1
 description Exporter for monitor1
 destination 192.168.0.1
 transport udp 6000
 source GigabitEthernet1/0/0
!
flow exporter exporter2
 description Exporter for monitor2
 destination 2001:DB8:100::1
 transport udp 6000
 source GigabitEthernet2/0/0
!
flow monitor monitor1
 exporter exporter1
 record netflow ipv6 original-input
!
flow monitor monitor2
 exporter exporter2
 record netflow ipv6 original-input
!
sampler Sampler1
 mode deterministic 1 out-of 10000
!
interface GigabitEthernet1/0/0
 no shutdown
 ipv6 address 2001:DB8:200::1/96
 ip flow monitor monitor1 input
!
interface GigabitEthernet2/0/0
 no shutdown
 ipv6 address 2001:DB8:300::1/96
 ip flow monitor monitor2 input
!
end