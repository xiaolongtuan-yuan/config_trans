hostname PE2
!
vrf definition vpna
 rd 100:2
 route-target export 111:1
 route-target import 111:1
!
router ospf 1
 router-id 3.3.3.9
 network 3.3.3.9 0.0.0.0 area 0
 network 172.17.1.0 0.0.0.255 area 0
!
router bgp 100
 bgp router-id 3.3.3.9
 neighbor 1.1.1.9 remote-as 100
 neighbor 1.1.1.9 update-source Loopback1
 !
 address-family ipv4 unicast
  neighbor 1.1.1.9 activate
  no auto-summary
 exit-address-family
 !
 address-family vpnv4
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-community both
 exit-address-family
 !
 address-family ipv4 vrf vpna
  redistribute connected
  neighbor 10.3.1.1 remote-as 65430
  neighbor 10.3.1.1 activate
 exit-address-family
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.3.1.2 255.255.255.0
 ip pim sparse-mode
!
interface GigabitEthernet3/0/0
 no shutdown
 ip address 172.17.1.2 255.255.255.0
 ip pim sparse-mode
 mpls ip
 mpls ldp enable
!
interface Loopback1
 ip address 3.3.3.9 255.255.255.255
 ip pim sparse-mode
!
mpls ldp router-id Loopback1 force
!
ip multicast-routing
ip multicast-routing vrf vpna
!
end