hostname MCE

vrf definition vpna
 rd 100:1
 address-family ipv4
 exit-address-family
!

vrf definition vpnb
 rd 200:2
 address-family ipv4
 exit-address-family
!

interface GigabitEthernet1/0/0
 no shutdown
 vrf forwarding vpna
 ip address 10.5.1.2 255.255.255.0
!

interface GigabitEthernet2/0/0
 no shutdown
 vrf forwarding vpnb
 ip address 10.5.2.2 255.255.255.0
!

interface GigabitEthernet3/0/0
 no shutdown
 vrf forwarding vpna
 ip address 10.3.1.2 255.255.255.0
!

interface GigabitEthernet4/0/0
 no shutdown
 vrf forwarding vpnb
 ip address 10.4.1.2 255.255.255.0
!

router ospf 100 vrf vpna
 capability vrf-lite
 network 10.3.1.0 0.0.0.255 area 0
 network 10.5.1.0 0.0.0.255 area 0
 redistribute static subnets
!

router ospf 200 vrf vpnb
 capability vrf-lite
 network 10.4.1.0 0.0.0.255 area 0
 network 10.5.2.0 0.0.0.255 area 0
 redistribute static subnets
!

router bgp 65000
 address-family ipv4 vrf vpna
  redistribute ospf 100 match internal external 1 external 2
 exit-address-family
 address-family ipv4 vrf vpnb
  redistribute ospf 200 match internal external 1 external 2
 exit-address-family
!