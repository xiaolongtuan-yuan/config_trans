hostname PE1
!
ethernet cfm
!
mpls ldp router-id Loopback0 force
!
l2vpn vfi context VFI1
 vpn id 1001
!
interface GigabitEthernet1/0/1
 no shutdown
!
interface GigabitEthernet1/0/1.1
 encapsulation dot1q 1
 xconnect 2.2.2.2 1001 encapsulation mpls
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 192.168.1.2 255.255.255.0
 mpls ip
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.0
!
router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 192.168.1.0 0.0.0.255 area 0
!
ethernet cfm domain MD1 level 7
ethernet cfm service MA1 vlan 1 direction down
 ethernet cfm mep domain MD1 service MA1 mpid 1 interface GigabitEthernet1/0/1.1
 ethernet cfm cc mep domain MD1 service MA1 mpid 1 enable
 ethernet cfm remote-mep domain MD1 service MA1 mpid 2
 ethernet cfm cc remote-mep domain MD1 service MA1 mpid 2 enable
 ethernet cfm linktrace domain MD1 service MA1 mpid 1 target mpid 2
 ethernet cfm delay-measure domain MD1 service MA1 mpid 1
!
end