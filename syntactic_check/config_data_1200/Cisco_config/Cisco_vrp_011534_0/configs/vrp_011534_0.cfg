hostname PE1
!
cfm
!
mpls label protocol ldp
mpls l2vpn
mpls ldp router-id Loopback0 force
!
interface GigabitEthernet1/0/1.1
 encapsulation dot1q 1
 xconnect 2.2.2.2 1001 encapsulation mpls
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 192.168.1.2 255.255.255.0
 mpls ip
 mpls label protocol ldp
!
interface LoopBack0
 ip address 1.1.1.1 255.255.255.0
!
router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 192.168.1.0 0.0.0.255 area 0
!
cfm md md1
 ma ma1
  mpls l2vpn
  mep domain 1
   mep id 1 interface GigabitEthernet1/0/1.1
   ccm-send mep-id 1 enable
   remote-mep mep-id 2
   ccm-receive mep-id 2 enable
   test-id 1 source mep 1 destination remote-mep 2
   test-id 3 source mep 1
   delay-measure one-way type receive test-id 3
!
end