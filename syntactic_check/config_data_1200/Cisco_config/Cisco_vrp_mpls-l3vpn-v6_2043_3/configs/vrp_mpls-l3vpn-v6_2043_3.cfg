hostname PE2
!
vrf definition vpn1
 rd 100:1
 route-target export 1:1
 route-target import 1:1
 address-family ipv4
 address-family ipv6
!
mpls ldp router-id Loopback1 force
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.4.1.2 255.255.255.0
 mpls ip
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.3.1.2 255.255.255.0
 mpls ip
!
interface GigabitEthernet3/0/0
 no shutdown
 vrf forwarding vpn1
 ipv6 enable
 ipv6 address 2001:db8:2::1/64
!
interface Loopback1
 ip address 3.3.3.9 255.255.255.255
!
router bgp 100
 bgp router-id 3.3.3.9
 neighbor 1.1.1.9 remote-as 100
 neighbor 1.1.1.9 update-source Loopback1
 !
 address-family ipv4
  neighbor 1.1.1.9 activate
  no synchronization
 exit-address-family
 !
 address-family vpnv4
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-community extended
 exit-address-family
 !
 address-family vpnv6
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf vpn1
 address-family ipv6 vrf vpn1
!
router ospf 1
 router-id 3.3.3.9
 mpls traffic-eng router-id Loopback1
 mpls traffic-eng area 0
 network 3.3.3.9 0.0.0.0 area 0
 network 10.3.1.0 0.0.0.255 area 0
 network 10.4.1.0 0.0.0.255 area 0
!
end