hostname ASBR1

mpls ldp router-id 2.2.2.9  ! 修正：Cisco使用"router-id"而非"lsr-id"

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.10.1.2 255.255.255.0
 mpls ip
 mpls ldp enable  ! 修正：Cisco接口级LDP启用语法

interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.20.1.1 255.255.255.0

interface Loopback1
 ip address 2.2.2.9 255.255.255.255

router bgp 100
 neighbor 1.1.1.9 remote-as 100
 neighbor 1.1.1.9 update-source Loopback1
 neighbor 10.20.1.2 remote-as 200
 !
 address-family ipv4 unicast
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 route-map policy1 out  ! 修正行25：Cisco用"route-map out"
  neighbor 1.1.1.9 send-label  ! 修正行26：Cisco用"send-label"
  neighbor 10.20.1.2 activate
  neighbor 10.20.1.2 route-map policy2 out  ! 修正行28
  neighbor 10.20.1.2 send-label  ! 修正行29：移除"tunnel"参数
 exit-address-family
 !
 address-family vpnv4  ! 可选：添加VPNv4地址族以支持MPLS VPN
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-community extended
 exit-address-family

router ospf 1
 network 2.2.2.9 0.0.0.0 area 0  ! 修正行32：直接配置network
 network 10.10.1.0 0.0.0.255 area 0

route-map policy1 permit 10

route-map policy2 permit 10
!
end