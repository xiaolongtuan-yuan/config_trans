hostname CE1
!
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.4.1.2 255.255.255.0
 mpls ip
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.1.1.1 255.255.255.0
 mpls ip
!
interface Loopback1
 ip address 2.2.2.9 255.255.255.255
!
router bgp 200
 neighbor 10.1.1.2 remote-as 100
 neighbor 1.1.1.9 remote-as 200
 neighbor 1.1.1.9 update-source Loopback1
 !
 address-family ipv4
  neighbor 10.1.1.2 activate
  neighbor 10.1.1.2 route-map policy1 out
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 route-map policy2 out
 exit-address-family
!
route-map policy1 permit 10
 set mpls-label
!
route-map policy2 permit 10
 match tag 1
 set mpls-label
!
router ospf 1
 network 2.2.2.9 0.0.0.0 area 0
 network 10.1.1.0 0.0.0.255 area 0
 network 10.4.1.0 0.0.0.255 area 0
!
end