hostname LSRA

interface GigabitEthernet1/0/0
no switchport
ip address 10.1.1.1 255.255.255.252
mpls ip

interface GigabitEthernet2/0/0
no switchport
ip address 10.2.1.1 255.255.255.252
mpls ip

interface Loopback0
ip address 1.1.1.1 255.255.255.255

ip route 2.2.2.2 255.255.255.255 GigabitEthernet1/0/0 10.1.1.2
ip route 3.3.3.3 255.255.255.255 GigabitEthernet2/0/0 10.2.1.2
ip route 4.4.4.4 255.255.255.255 GigabitEthernet1/0/0 10.1.1.2 40
ip route 4.4.4.4 255.255.255.255 GigabitEthernet2/0/0 10.2.1.2
ip route 10.3.1.0 255.255.255.252 GigabitEthernet1/0/0
ip route 10.4.1.0 255.255.255.252 GigabitEthernet2/0/0

