hostname LSRA
!
mpls ldp router-id Loopback1
!
mpls traffic-eng tunnels
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 2.1.1.1 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
!
interface Loopback1
 ip address 1.1.1.1 255.255.255.255
!
interface Tunnel10
 ip unnumbered Loopback1
 tunnel destination 3.3.3.3

!
ip route 2.2.2.2 255.255.255.255 Tunnel10
ip route 3.3.3.3 255.255.255.255 Tunnel10
!
mpls traffic-eng auto-tunnel primary
mpls traffic-eng auto-bw collect frequency 300
mpls traffic-eng auto-bw min-bw 500
mpls traffic-eng auto-bw max-bw 1000
!
mpls oam
 mpls oam lsp-ping interval 1
 mpls oam lsp-ping timeout 1
 mpls oam lsp-ping reply-mode ipv4 1000
!
end