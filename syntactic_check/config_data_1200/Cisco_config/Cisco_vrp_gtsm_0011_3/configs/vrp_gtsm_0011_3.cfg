hostname DeviceD

interface GigabitEthernet1/0/0
 ip address 10.2.2.2 255.255.255.0
 no shutdown

interface Loopback0
 ip address 10.4.4.9 255.255.255.255
 no shutdown

router bgp 20
 bgp router-id 10.4.4.9
 neighbor 10.2.2.9 remote-as 20
 neighbor 10.2.2.9 ttl-security hops 2
 neighbor 10.2.2.9 update-source Loopback0
 neighbor 10.3.3.9 remote-as 20
 neighbor 10.3.3.9 ttl-security hops 1
 neighbor 10.3.3.9 update-source Loopback0

 address-family ipv4
  no synchronization
  neighbor 10.2.2.9 activate
  neighbor 10.3.3.9 activate
 exit-address-family

router ospf 1
 network 10.2.2.0 0.0.0.255 area 0
 network 10.4.4.9 0.0.0.0 area 0

end