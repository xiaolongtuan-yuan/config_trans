hostname ABR1
!
mpls ldp router-id Loopback0 force  ! 修正行4：添加force参数
mpls ip
!
router isis
 net 49.0001.0000.0000.000a.00
 is-type level-2-only
!
interface GigabitEthernet1/0/3
 no shutdown
 ip address 10.0.7.7 255.255.255.0
 mpls ip
!
interface GigabitEthernet1/0/4
 no shutdown
 ip address 10.0.16.1 255.255.255.0
 mpls ip
!
interface Loopback0
 ip address 1.1.1.3 255.255.255.255
!
router bgp 1
 bgp router-id 1.1.1.3
 neighbor 10.0.16.2 remote-as 65535
 neighbor 1.1.1.2 remote-as 1
 neighbor 1.1.1.2 update-source Loopback0
 !
 address-family ipv4 unicast  ! 修正行26：添加unicast关键字
  network 1.1.1.3 mask 255.255.255.255  ! 修正语法
  neighbor 10.0.16.2 activate
  neighbor 1.1.1.2 activate
  neighbor 1.1.1.2 route-map policy1 out  ! 修正行29：使用route-map
 !
 address-family vpnv4 unicast  ! 添加unicast关键字
  neighbor 10.0.16.2 activate
  neighbor 1.1.1.2 activate
  neighbor 1.1.1.2 send-community extended
 !
  neighbor 10.0.16.2 activate
  neighbor 1.1.1.2 activate
 !
 address-family vpnv6 unicast  ! 修正行39：添加unicast关键字
  neighbor 10.0.16.2 activate
  neighbor 1.1.1.2 activate
  neighbor 1.1.1.2 send-community extended
!
ip route 1.1.1.4 255.255.255.255 10.0.16.2