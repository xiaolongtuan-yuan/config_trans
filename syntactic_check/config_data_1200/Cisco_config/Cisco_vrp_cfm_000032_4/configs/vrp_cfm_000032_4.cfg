hostname PE2

mpls ldp router-id Loopback1 force

l2vpn
!
pseudowire-class bgp1
 encapsulation mpls
!
l2vpn vfi context bgp1
 vpn id 1
 !route-distinguisher 192.168.10.2:1
 !route-target 100:1
 !route-target 100:1 export
 bridge-domain bgp1
 ! member vfi bgp1
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 192.168.10.2 255.255.255.0
 mpls ip
 mpls ldp discovery hello holdtime 15
 mpls ldp discovery targeted-hello holdtime 15
 mpls ldp igp sync
!
interface GigabitEthernet2/0/0.1
 no shutdown
 encapsulation dot1Q 10
 xconnect vfi bgp1
!
interface Loopback1
 ip address 3.3.3.9 255.255.255.255
!
router bgp 100
 bgp log-neighbor-changes
 neighbor 1.1.1.9 remote-as 100
 neighbor 1.1.1.9 update-source Loopback1
 !
 address-family vpnv4
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-community extended
 exit-address-family
!
router ospf 1
 network 3.3.3.9 0.0.0.0 area 0
 network 192.168.10.0 0.0.0.255 area 0
!
ethernet cfm
 ethernet evc ma1
!  continuity-check interval 1s
!  mep domain 5 service 1
!   mep-id 1
!   direction down
!  mep domain 5 service 1
!   mep-id 2
!   direction up
!
end