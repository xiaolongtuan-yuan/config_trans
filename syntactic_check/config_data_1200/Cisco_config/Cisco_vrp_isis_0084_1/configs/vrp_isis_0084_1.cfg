hostname DeviceB

router isis 1
 net 10.0000.0000.0002.00
 metric-style wide
 is-type level-1

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.1.1.2 255.255.255.0
 isis network point-to-point

interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.2.1.1 255.255.255.0

interface Loopback0
 ip address 1.1.1.1 255.255.255.255

router bgp 65008
 bgp router-id 1.1.1.1
 neighbor 10.2.1.2 remote-as 65009

 address-family ipv4
  network 10.2.1.0 mask 255.255.255.0
  neighbor 10.2.1.2 activate
  neighbor 10.2.1.2 route-map RTC in
 exit-address-family

ip as-path access-list 1 permit ^65009$

route-map RTC permit 10
 match as-path 1
 set metric 20

