hostname Spoke1
!
crypto ikev2 proposal IKE-PROPOSAL
 encryption aes-cbc-256
 integrity sha512
 group 19
!
crypto ikev2 policy IKE-POLICY
 proposal IKE-PROPOSAL
!
crypto ikev2 profile IKE-PROFILE
 match identity remote any
 authentication remote pre-share
 authentication local pre-share
 keyring local DSVPN-KEYRING
!
crypto ipsec profile IPSEC-PROFILE
 set ikev2-profile IKE-PROFILE
!
interface GigabitEthernet1/0/0
 ip address 10.1.2.10 255.255.255.0
!
interface GigabitEthernet2/0/0
 ip address 192.168.1.1 255.255.255.0
!
interface Tunnel0
 ip address 172.16.1.2 255.255.255.0
 tunnel source GigabitEthernet1/0/0
 tunnel key 0
!
router bgp 200
 bgp router-id 172.16.1.2
 neighbor 172.16.1.1 remote-as 100
 neighbor 172.16.1.1 ebgp-multihop 255
 neighbor 172.16.1.1 update-source Tunnel0
 !
 address-family ipv4
  network 192.168.1.0
  neighbor 172.16.1.1 activate
  neighbor 172.16.1.1 next-hop-self
 exit-address-family
!
router ospf 1
 router-id 172.16.1.2
 network 192.168.1.0 0.0.0.255 area 0
!
router ospf 2
 router-id 10.1.2.10
 network 10.1.2.0 0.0.0.255 area 1
!
end