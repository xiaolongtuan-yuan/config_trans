set system host-name P1

# LDP Configuration
set protocols ldp interface lo0.0
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp transport-address 172.16.1.2

# MPLS Configuration
set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0
set protocols mpls interface lo0.0

# IS-IS Configuration
set protocols isis level 2 wide-metrics-only
set protocols isis interface lo0.0 passive
set protocols isis interface ge-0/0/0.0 point-to-point
set protocols isis interface ge-0/0/1.0 point-to-point

# Interface Configuration: ge-0/0/0
set interfaces ge-0/0/0 unit 0 family inet address 172.16.1.2/24
set interfaces ge-0/0/0 unit 0 family iso
set interfaces ge-0/0/0 flexible-vlan-tagging
set interfaces ge-0/0/0 encapsulation flexible-ethernet-services

# Interface Configuration: ge-0/0/1
set interfaces ge-0/0/1 unit 0 family inet address 172.17.1.1/24
set interfaces ge-0/0/1 unit 0 family iso
set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 encapsulation flexible-ethernet-services

# Loopback Configuration
set interfaces lo0 unit 1 family inet address 2.2.2.9/32