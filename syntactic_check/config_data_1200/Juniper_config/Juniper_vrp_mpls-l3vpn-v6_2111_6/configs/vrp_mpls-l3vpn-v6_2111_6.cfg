set system host-name PE4

# VRF Configuration
set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:2
set routing-instances vpn1 vrf-target import target:1:1
set routing-instances vpn1 vrf-target export target:1:1

# VRF Policies (if needed)
set policy-options policy-statement vpn1-import term 1 from community target:1:1
set policy-options policy-statement vpn1-import term 1 then accept
set policy-options policy-statement vpn1-export term 1 from protocol bgp
set policy-options policy-statement vpn1-export term 1 then community add target:1:1
set policy-options policy-statement vpn1-export term 1 then accept

set routing-instances vpn1 interface ge-1/0/0.0

# Core-facing Interface
set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.2/24
set interfaces ge-2/0/0 unit 0 family mpls
set protocols mpls interface ge-2/0/0.0

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 6.6.6.9/32

# BGP Configuration (Internal)
set protocols bgp group internal type internal
set protocols bgp group internal neighbor 5.5.5.9
set protocols bgp group internal peer-as 300
set protocols bgp group internal local-address 6.6.6.9
set protocols bgp group internal family inet-vpn unicast
set protocols bgp group internal export next-hop-self

# BGP Configuration (External)
set protocols bgp group external type external
set protocols bgp group external neighbor 1.1.1.9
set protocols bgp group external peer-as 200
set protocols bgp group external local-address 6.6.6.9
set protocols bgp group external multihop ttl 10
set protocols bgp group external family inet-vpn unicast

# Next-Hop-Self Policy
set policy-options policy-statement next-hop-self then next-hop self

# OSPF Configuration
set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-2/0/0.0

# VRF OSPF Configuration
set routing-instances vpn1 protocols ospf area 0 interface ge-1/0/0.0
set routing-instances vpn1 protocols ospf export export-connected