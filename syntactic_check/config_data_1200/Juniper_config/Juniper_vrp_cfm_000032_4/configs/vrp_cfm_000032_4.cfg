set system host-name PE2

# MPLS Configuration
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface lo0.0

# LDP Configuration
set protocols ldp interface lo0.0
set protocols ldp router-id lo0.0
set protocols ldp interface ge-1/0/0.0 hello-interval 1000
set protocols ldp interface ge-1/0/0.0 targeted-hello-interval 1000
set protocols ldp igp-synchronization

# L2VPN Configuration
set protocols l2vpn encapsulation-type ethernet-vpls
set protocols l2vpn site local-site-name1 site-id 1234
set protocols l2vpn site local-site-name1 interface ge-2/0/0.0

# VPLS Instance Configuration
set routing-instances vpls1 instance-type virtual-switch
set routing-instances vpls1 interface ge-2/0/0.0
set routing-instances vpls1 route-distinguisher 192.168.10.2:1
set routing-instances vpls1 vrf-target target:100:1

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 192.168.10.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 encapsulation flexible-ethernet-services
set interfaces ge-2/0/0 unit 0 vlan-id 10
set interfaces lo0 unit 0 family inet address 3.3.3.9/32

# BGP Configuration
set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 3.3.3.9
set protocols bgp group ibgp neighbor 1.1.1.9 peer-as 100
set protocols bgp group ibgp family evpn signaling
set routing-instances vpls1 protocols bgp group ibgp neighbor 1.1.1.9
set protocols bgp group ibgp export advertise-l2vpn-evpn

# OSPF Configuration
set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-1/0/0.0

# CFM Configuration
set protocols oam ethernet connectivity-fault-management maintenance-domain ma1 level 0
set protocols oam ethernet connectivity-fault-management maintenance-domain ma1 maintenance-association ma1-level
set protocols oam ethernet connectivity-fault-management maintenance-domain ma1 maintenance-association ma1-level maintenance-endpoint 2 interface ge-1/0/0.1 interval 100
set protocols oam ethernet connectivity-fault-management maintenance-domain ma1 maintenance-association ma1-level remote-maintenance-endpoint 2