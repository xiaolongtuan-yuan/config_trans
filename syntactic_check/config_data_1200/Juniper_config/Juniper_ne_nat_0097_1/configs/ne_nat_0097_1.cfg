set system host-name NATA

# Source NAT Pool Configuration (Corrected Syntax)
set security nat source pool address-groupa address 11.1.1.1/32 to 11.1.1.10/32
set security nat source pool address-groupb address 11.1.1.11/32 to 11.1.1.20/32

# Source NAT Rule Configuration (Corrected Syntax)
set security nat source rule-set NAT-RULE-SET from zone INSIDE
set security nat source rule-set NAT-RULE-SET to zone OUTSIDE
set security nat source rule-set NAT-RULE-SET rule 2464 match source-address 10.78.1.0/24
set security nat source rule-set NAT-RULE-SET rule 2464 then source-nat pool address-groupa
set security nat source rule-set NAT-RULE-SET rule 2465 match source-address 10.67.1.0/24
set security nat source rule-set NAT-RULE-SET rule 2465 then source-nat pool address-groupb

# Static NAT Configuration (Corrected Syntax)
set security nat static rule-set STATIC-NAT-RULE-SET rule 1 match destination-address 11.11.11.2/32
set security nat static rule-set STATIC-NAT-RULE-SET rule 1 then static-nat prefix 10.78.1.2/32
set security nat static rule-set STATIC-NAT-RULE-SET rule 2 match destination-address 11.11.11.1/32
set security nat static rule-set STATIC-NAT-RULE-SET rule 2 then static-nat prefix 10.67.1.2/32

# Interface Configuration
set interfaces ge-1/0/1 unit 0 family inet address 10.78.1.1/24
set security zones security-zone INSIDE interfaces ge-1/0/1.0

set interfaces ge-1/0/0 unit 0 family inet address 10.67.1.1/24
set security zones security-zone INSIDE interfaces ge-1/0/0.0
