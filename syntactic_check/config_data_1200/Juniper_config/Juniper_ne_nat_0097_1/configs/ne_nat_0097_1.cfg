set system host-name NATA

set services nat pool address-groupa address-range low 11.1.1.1 high 11.1.1.10
set services nat pool address-groupb address-range low 11.1.1.11 high 11.1.1.20

set services nat rule-set NAT-RULE-SET rule 2464 match direction input
set services nat rule-set NAT-RULE-SET rule 2464 match source-address 10.78.1.0/24
set services nat rule-set NAT-RULE-SET rule 2464 then source-nat pool address-groupa

set services nat rule-set NAT-RULE-SET rule 2465 match direction input
set services nat rule-set NAT-RULE-SET rule 2465 match source-address 10.67.1.0/24
set services nat rule-set NAT-RULE-SET rule 2465 then source-nat pool address-groupb

set security nat static rule-set STATIC-NAT-RULE-SET rule 1 match destination-address 11.11.11.2
set security nat static rule-set STATIC-NAT-RULE-SET rule 1 then static-nat prefix 10.78.1.2

set security nat static rule-set STATIC-NAT-RULE-SET rule 2 match destination-address 11.11.11.1
set security nat static rule-set STATIC-NAT-RULE-SET rule 2 then static-nat prefix 10.67.1.2

set interfaces ge-1/0/1 unit 0 family inet address 10.78.1.1/24
set security zones security-zone INSIDE interfaces ge-1/0/1.0

set interfaces ge-1/0/0 unit 0 family inet address 10.67.1.1/24
set security zones security-zone INSIDE interfaces ge-1/0/0.0