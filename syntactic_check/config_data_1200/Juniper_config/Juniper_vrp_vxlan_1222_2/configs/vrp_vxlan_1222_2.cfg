set system host-name Device3

# EVPN 实例配置修正
set routing-instances EVRF4 route-distinguisher 31:2
set routing-instances EVRF4 vrf-target target:2:2

# 接口配置修正
set interfaces ge-1/0/1 unit 0 family inet address 192.168.2.2/24

# VLAN 接口配置重构
set interfaces ge-1/0/2 flexible-vlan-tagging
set interfaces ge-1/0/2 unit 20 vlan-id 20
set interfaces ge-1/0/2 unit 20 family ethernet-switching

# Loopback 配置
set interfaces lo0 unit 1 family inet address 4.4.4.4/32

# BGP 配置修正
set protocols bgp group EVPN local-address 4.4.4.4
set protocols bgp group EVPN family evpn signaling
set protocols bgp group EVPN neighbor 2.2.2.2 peer-as 100
set protocols bgp group EVPN neighbor 3.3.3.3 peer-as 100

# OSPF 配置（保持不变）
set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-1/0/1.0