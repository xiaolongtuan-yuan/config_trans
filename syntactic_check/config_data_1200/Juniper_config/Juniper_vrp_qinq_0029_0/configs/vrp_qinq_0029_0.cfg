set system host-name PE1

set interfaces ge-1/0/1 unit 0 family ethernet-switching port-mode trunk
set interfaces ge-1/0/1 unit 1 vlan-id 10
set interfaces ge-1/0/1 unit 1 family inet address 10.1.1.1/24
set interfaces ge-1/0/1 unit 2 vlan-id 20
set interfaces ge-1/0/1 unit 2 family inet address 10.10.1.1/24

set interfaces ge-1/0/2 unit 0 family inet address 192.168.2.1/24

set routing-options router-id 192.168.2.1

set protocols ospf area 0.0.0.0 interface ge-1/0/1.1
set protocols ospf area 0.0.0.0 interface ge-1/0/1.2
set protocols ospf area 0.0.0.0 interface ge-1/0/2.0

set protocols vrrp group 1 interface ge-1/0/1.1 virtual-address 10.1.1.111
set protocols vrrp group 1 priority 120
set protocols vrrp group 1 preempt hold-time 20

set protocols vrrp group 2 interface ge-1/0/1.2 virtual-address 10.10.1.111