## Set the hostname
set system host-name DeviceD

## Interface GigabitEthernet1/0/0
set interfaces ge-0/0/0 unit 0 family inet address 172.16.0.2/24

## Interface GigabitEthernet2/0/0
set interfaces ge-0/0/1 unit 0 family inet address 172.17.1.2/24

## Interface GigabitEthernet3/0/0
set interfaces ge-0/0/2 unit 0 family inet address 192.168.1.1/24
set routing-options static route 172.17.1.3/32 next-hop 192.168.1.1

## Interface GigabitEthernet4/0/0
set interfaces ge-0/0/3 unit 0 family inet address 192.168.2.1/24

## NetFlow configuration
set forwarding-options sampling instance netflow-monitor input rate 100
set forwarding-options sampling instance netflow-monitor family inet output flow-server 192.168.2.2 port 3000 version 9
set forwarding-options sampling instance netflow-monitor family inet output source-address 192.168.2.1

## Configure ingress sampling on specific interfaces
set interfaces ge-0/0/2 unit 0 family inet sampling input
set interfaces ge-0/0/3 unit 0 family inet sampling input

## Flow timeout settings (修正原28-29行)
set forwarding-options sampling instance netflow-monitor flow-active-timeout 60
set forwarding-options sampling instance netflow-monitor flow-inactive-timeout 900

## Configure firewall to allow all traffic (修正原32行)
set firewall family inet filter netflow-filter term allow-all from source-address 0.0.0.0/0
set firewall family inet filter netflow-filter term allow-all from destination-address 0.0.0.0/0
set firewall family inet filter netflow-filter term allow-all then accept

## Apply firewall filter for sampling
set forwarding-options sampling instance netflow-monitor input filter netflow-filter