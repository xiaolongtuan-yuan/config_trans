set system host-name ASBR2

# MPLS Configuration
set protocols mpls interface ge-0/0/1.0

# LDP Configuration
set protocols ldp interface ge-0/0/1.0
set protocols ldp preference 9

# L2Circuit Configuration
set protocols l2circuit neighbor 4.4.4.4 interface ge-0/0/0.1
set protocols l2circuit neighbor 4.4.4.4 virtual-circuit-id v1
set protocols l2circuit encapsulation-type ethernet-vlan
set protocols l2circuit pseudowire-status-tlv

# Interface Configuration - ge-0/0/0 (L2 Circuit)
set interfaces ge-0/0/0 flexible-vlan-tagging
set interfaces ge-0/0/0 disable
set interfaces ge-0/0/0 unit 1 encapsulation vlan-ccc
set interfaces ge-0/0/0 unit 1 vlan-id 10
set interfaces ge-0/0/0 unit 1 family ccc

# Interface Configuration - ge-0/0/1 (MPLS)
set interfaces ge-0/0/1 disable
set interfaces ge-0/0/1 unit 0 family inet address 10.20.1.1/24
set interfaces ge-0/0/1 unit 0 family mpls

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 3.3.3.3/32

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0