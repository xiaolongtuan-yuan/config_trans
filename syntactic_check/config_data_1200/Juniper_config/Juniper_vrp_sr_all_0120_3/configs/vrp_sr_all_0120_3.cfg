set system host-name DeviceD

set protocols mpls ldp interface all
set protocols ldp router-id interface lo0.1
set protocols mpls interface all
set protocols mpls label-switched-path auto-tunnel-primary
set protocols mpls traffic-engineering auto-tunnel

set protocols isis level 1
set protocols isis level 1 wide-metrics-only
set protocols isis level 1 metric default 100
set protocols isis level 1 authentication-type simple
set protocols isis lsp-gen-interval 30
set protocols isis segment-routing mpls
set protocols isis traffic-engineering
set protocols isis traffic-engineering max-link-bandwidth 1000m
set protocols isis net 10.0000.0000.0004.00
set protocols isis traffic-engineering segment-routing global-block 16000 23999

set interfaces ge-1/0/0 unit 0 family inet address 10.3.1.2/24
set interfaces ge-1/0/0 unit 0 family inet address 10.3.1.2/24 primary 100
set interfaces ge-1/0/0 unit 0 family iso
set interfaces ge-1/0/0 unit 0 family iso address 0
set interfaces ge-1/0/0 enable

set interfaces ge-2/0/0 unit 0 family inet address 10.4.1.1/24
set interfaces ge-2/0/0 unit 0 family iso
set interfaces ge-2/0/0 unit 0 family iso address 0
set interfaces ge-2/0/0 enable

set interfaces lo0 unit 1 family inet address 4.4.4.9/32
set interfaces lo0 unit 1 family iso
set interfaces lo0 unit 1 family iso address 0
set protocols isis segment-routing prefix-sid-index 40
