set system host-name P

# OSPF配置（保持不变）
set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0

# 接口ge-1/0/0配置修正
set interfaces ge-1/0/0 unit 0 family inet address 192.168.2.1/24
# 移除无效的ldp地址配置（原行7）
set protocols ldp interface ge-1/0/0.0  # 正确配置LDP接口
set protocols pim interface ge-1/0/0.0 mode sparse
set interfaces ge-1/0/0 unit 0 family mpls

# 接口ge-2/0/0配置修正
set interfaces ge-2/0/0 unit 0 family inet address 192.168.1.2/24
# 移除无效的ldp地址配置（原行12）
set protocols ldp interface ge-2/0/0.0  # 正确配置LDP接口
set protocols pim interface ge-2/0/0.0 mode sparse
set interfaces ge-2/0/0 unit 0 family mpls

# Loopback配置（保持不变）
set interfaces lo0 unit 1 family inet address 2.2.2.2/32
set protocols pim interface lo0.1 mode sparse

# 协议全局配置修正（原行20）
set protocols ldp interface all  # 明确配置LDP接口
set protocols mpls interface ge-2/0/0.0