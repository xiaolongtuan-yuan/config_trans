set system host-name SPE1

set protocols igmp-snooping vlan-default

set protocols ldp
set protocols l2vpn
set routing-instances vsi1 instance-type l2vpn
set routing-instances vsi1 interface lo0.0
set routing-instances vsi1 protocols ldp
set routing-instances vsi1 protocols l2vpn neighbor 1.1.1.1
set routing-instances vsi1 protocols l2vpn neighbor 4.4.4.4
set routing-instances vsi1 protocols l2vpn neighbor 5.5.5.5
set routing-instances vsi1 protocols igmp-snooping
set protocols ldp

set interfaces ge-1/0/0 unit 0 family inet address 192.168.10.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols ldp interface ge-1/0/0.0
set interfaces ge-1/0/0 unit 0 enable

set interfaces ge-1/0/1 unit 0 family inet address 192.168.30.1/24
set interfaces ge-1/0/1 unit 0 family mpls
set protocols ldp interface ge-1/0/1.0
set interfaces ge-1/0/1 unit 0 enable

set interfaces lo0 unit 1 family inet address 2.2.2.2/32

set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-1/0/0.0
set protocols ospf area 0 interface ge-1/0/1.0