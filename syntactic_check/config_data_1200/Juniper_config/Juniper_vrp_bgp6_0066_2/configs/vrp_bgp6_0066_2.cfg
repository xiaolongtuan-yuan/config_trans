set system host-name DeviceC
!set interfaces ge-0/0/0 unit 0 family inet6 address 2001:db8:102::1/96
!set interfaces ge-0/0/1 unit 0 family inet6 address 2001:db8:101::1/96
set routing-options router-id 3.3.3.3
set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 200
set protocols bgp group external-peers neighbor 2001:db8:101::2
set protocols bgp group external-peers neighbor 2001:db8:102::2
set protocols bgp group external-peers family inet6 unicast
set protocols bgp group external-peers export announce-routes
set policy-options policy-statement announce-routes term 1 from protocol direct
set policy-options policy-statement announce-routes term 1 then accept
set protocols bgp group external-peers cluster 3.3.3.3
set protocols bgp group external-peers neighbor 2001:db8:101::2 family inet6 unicast
set protocols bgp group external-peers neighbor 2001:db8:102::2 family inet6 unicast