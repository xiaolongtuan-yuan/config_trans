set system host-name PE2
set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 200:1
set routing-instances vpn1 vrf-target target:1:1
set routing-instances vpn1 vrf-target import target:1:1
set routing-instances vpn1 vrf-target export target:1:1
set routing-instances vpn2 instance-type vrf
set routing-instances vpn2 route-distinguisher 200:2
set routing-instances vpn2 vrf-target target:2:2
set routing-instances vpn2 vrf-target import target:2:2
set routing-instances vpn2 vrf-target export target:2:2
set protocols mpls interface all
set protocols ldp interface all
set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-1/0/0 unit 0 routing-instance vpn2
set interfaces ge-2/0/0 unit 0 family inet address 192.168.1.2/24
set protocols mpls interface ge-2/0/0
set interfaces ge-3/0/0 unit 0 family inet address 10.3.1.1/24
set interfaces ge-3/0/0 unit 0 routing-instance vpn1
set interfaces lo0 unit 1 family inet address 2.2.2.9/32
set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols bgp group external type external
set protocols bgp group external neighbor 1.1.1.9 peer-as 100
set protocols bgp group external neighbor 1.1.1.9 local-address 2.2.2.9
set protocols bgp group external family inet unicast
set protocols bgp group external family inet-vpn unicast
set protocols bgp group external neighbor 1.1.1.9 remove-private
set routing-instances vpn1 routing-options static route 0.0.0.0/0 next-hop 10.3.1.1
set routing-instances vpn2 routing-options static route 0.0.0.0/0 next-hop 10.2.1.1