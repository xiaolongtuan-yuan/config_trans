set system host-name DeviceF

# ISIS配置修正
set protocols isis level 1 disable
set protocols isis level 2 disable
# 修正level 1-2配置（原行4）
set protocols isis level 1 wide-metrics-only
set protocols isis level 2 wide-metrics-only

set protocols isis interface all
# 修正接口level配置（原行7）
# 移除无效的level 1-2 enable配置
# 修正LSP传输配置（原行8）
set protocols isis lsp-lifetime 1200  # 设置合理的LSP生存时间

# 路由选项
set routing-options multipath

# 接口ge-1/0/1配置修正
set interfaces ge-1/0/1 unit 0 family inet address 192.168.12.2/24
set protocols pim interface ge-1/0/1 mode sparse
# 修正circuit-type配置（原行13）
set protocols isis interface ge-1/0/1 point-to-point

# 接口ge-1/0/2配置修正
set interfaces ge-1/0/2 unit 0 family inet address 192.168.13.1/24
set protocols pim interface ge-1/0/2 mode sparse
# 修正circuit-type配置（原行16）
set protocols isis interface ge-1/0/2 point-to-point