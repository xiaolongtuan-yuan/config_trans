set system host-name LSRC

set protocols isis level 2 disable
set protocols isis level 1 disable
set protocols isis reference-bandwidth 100g
set protocols isis interface lo0.0 passive
set protocols isis interface ge-1/0/0 point-to-point
set protocols isis interface ge-2/0/0 point-to-point
set interfaces ge-1/0/0 unit 0 family inet address 10.3.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols mpls interface ge-1/0/0
set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.2/24
set interfaces ge-2/0/0 unit 0 family mpls
set protocols mpls interface ge-2/0/0
set interfaces lo0 unit 0 family inet address 3.3.3.9/32
