set system host-name DeviceA

# 移除无效的protocols ipv6声明（原行3）
# 原错误命令：set protocols ipv6

# 接口ge-1/0/0配置修正
set protocols ospf3 area 0.0.0.0 interface ge-1/0/0.0
set protocols pim interface ge-1/0/0 mode sparse

# 接口ge-2/0/0配置修正
set protocols ospf3 area 0.0.0.0 interface ge-2/0/0.0
set protocols pim interface ge-2/0/0 mode sparse

# 接口ge-3/0/0配置修正
set protocols ospf3 area 0.0.0.0 interface ge-3/0/0.0
set protocols pim interface ge-3/0/0 mode sparse

# Loopback接口配置修正
set protocols ospf3 area 0.0.0.0 interface lo0.0
set protocols pim interface lo0 mode sparse

# PIM配置（保持不变）
set protocols pim rp local address 2001:db8:7::7
set protocols pim rp-candidate lo0
set protocols pim bsr-candidate lo0