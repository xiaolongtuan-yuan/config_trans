system {
    host-name PE2;
}

interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.10.3.4/24;
            }
            family mpls;
        }
        unit 10 {
            encapsulation vlan-ccc;
            vlan-id 10;
            family ccc;
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 4.4.4.4/32;
            }
        }
    }
}

protocols {
    ospf {
        area 0.0.0.0 {
            interface lo0.0;
            interface ge-0/0/0.0;
        }
!        router-id 4.4.4.4;  # 修改点1：router-id直接配置在OSPF下
    }

    ldp {
        transport-address 4.4.4.4;
        interface ge-0/0/0.0;
    }

    bgp {
        group ibgp {
            type internal;
            local-address 4.4.4.4;
            neighbor 3.3.3.3;
            family inet-vpn {
                unicast;
            }
            family l2vpn {
                signaling;
            }
            export bgp-l3vpn-export;
        }
    }

    l2circuit {
        neighbor 3.3.3.3 {
            interface ge-0/0/0.10 {
                virtual-circuit-id 1;
            }
        }
    }

    mpls {
        interface ge-0/0/0.0;  # 修改点2：TE接口直接配置在mpls下

!        path path1 {  # 修改点3：修正路径配置语法
!            no-cspf;
!            metric 1;
        }
    }
}

routing-instances {
    v1 {
!        instance-type vpls;
        interface ge-0/0/0.10;
        route-distinguisher 10.10.3.4:1;
        vrf-target {
            import target:100:1;
            export target:100:1;
        }
        protocols {
!            vpls {
!                site local {  # 修改点4：修正VPLS站点配置
!                    site-identifier 1;
                }
            }
        }
    }
}

policy-options {
    policy-statement bgp-l3vpn-export {
        term default {
            then accept;
        }
    }
}