set system host-name ASBR2

# LDP配置修正
set protocols ldp interface lo0.0
set protocols ldp interface ge-1/0/1.0  # 明确指定接口
set protocols ldp interface ge-1/0/3.0

# 接口配置（保持不变）
set interfaces ge-1/0/1 unit 0 family inet address 10.0.10.4/24
set interfaces ge-1/0/1 unit 0 family mpls

set interfaces ge-1/0/3 unit 0 family inet address 10.0.16.2/24
set interfaces ge-1/0/3 unit 0 family mpls

# 逻辑隧道配置修正（原行15）
set interfaces lt-0/0/0 unit 0 encapsulation ppp

# Loopback配置
set interfaces lo0 unit 0 family inet address 1.1.1.4/32

# ISIS配置修正（原行22）
set protocols isis level 2 disable
set protocols isis interface ge-1/0/3.0

# BGP配置修正（原行29,31）
set protocols bgp group bgp-group type external
set protocols bgp group bgp-group local-address 1.1.1.4
set protocols bgp group bgp-group neighbor 10.0.16.1 peer-as 1
set protocols bgp group bgp-group neighbor 1.1.1.5 peer-as 65535
set protocols bgp group bgp-group export policy2
set protocols bgp group bgp-group family inet unicast
set protocols bgp group bgp-group family inet labeled-unicast  # 修正MPLS家族

# 策略配置修正（原行34-36）
set policy-options policy-statement policy1 term 10 then accept

# 静态路由（保持不变）
set routing-options static route 1.1.1.3/32 next-hop 10.0.16.1