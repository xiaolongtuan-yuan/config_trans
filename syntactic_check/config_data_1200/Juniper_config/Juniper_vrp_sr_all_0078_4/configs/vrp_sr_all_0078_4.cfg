set system host-name CE1

# Routing Options
set routing-options router-id 10.10.10.10

# BGP Configuration
set protocols bgp group EXTERNAL type external
set protocols bgp group EXTERNAL peer-as 100
set protocols bgp group EXTERNAL local-address 2001:db8::1:1
set protocols bgp group EXTERNAL neighbor 2001:db8::1:2
set protocols bgp group EXTERNAL family inet6 unicast
set protocols bgp group EXTERNAL export route-to-advertise

# Policy Configuration
set policy-options policy-statement route-to-advertise term 1 from route-filter 2001:db8::11:1/128 exact
set policy-options policy-statement route-to-advertise term 1 then accept