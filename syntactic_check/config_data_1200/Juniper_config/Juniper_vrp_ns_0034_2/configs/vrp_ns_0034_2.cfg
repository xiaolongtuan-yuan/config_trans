set system host-name DeviceC

# 接口配置（保持不变）
set interfaces ge-1/0/0 unit 0 family inet address 10.1.2.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces lo0 unit 1 family inet address 3.3.3.9/32

# OSPF配置（保持不变）
set protocols ospf area 0 interface lo0.1 passive

# LDP配置（保持不变）
set protocols ldp interface ge-1/0/0.0  # 添加.0后缀
set protocols ldp router-id 3.3.3.9
set protocols ldp targeted-session 1.1.1.9  # 修正targetted-hello语法

# RSVP配置（保持不变）
set protocols rsvp interface ge-1/0/0.0  # 添加.0后缀
set protocols rsvp interface lo0.1
