set system host-name PE2

set protocols mpls label-switched-paths ldp-overrides protocol ldp

set protocols ldp router-id 3.3.3.9

set protocols ldp discovery transport-address 3.3.3.9

set policy-options prefix-list VPN-Labels

set interfaces ge-1/0/0 unit 0 family inet address 10.20.1.2/24

set protocols mpls interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 0 family inet

set interfaces ge-2/0/0 unit 10 vlan-id 10

set interfaces ge-2/0/0 unit 10 encapsulation vlan-ccc

set routing-instances a2 instance-type l2vpn

set interfaces lo0 unit 1 family inet address 3.3.3.9/32

set protocols mpls traffic-engineering

set protocols mpls traffic-engineering router-id 3.3.3.9

set protocols ospf area 0.0.0.0 interface lo0.1

set protocols ospf traffic-engineering

set protocols ospf database-creation router-id 3.3.3.9

set protocols ospf traffic-engineering options fg-keep-forwarding

set interfaces gr-0/0/10 unit 0 family mpls

set protocols mpls traffic-engineering autoroute-announce

set protocols mpls traffic-engineering tunnel-options path path2pe1

set protocols mpls traffic-engineering priority 7 7

set protocols mpls logging events level all

set protocols mpls neighbor-changes