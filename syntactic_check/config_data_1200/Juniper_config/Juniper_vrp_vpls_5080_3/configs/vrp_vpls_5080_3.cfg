set system host-name PE2

# MPLS/LDP Configuration
set protocols ldp router-id 3.3.3.9
set protocols ldp interface ge-1/0/0.0
set protocols ldp transport-address 3.3.3.9

# Policy Configuration
set policy-options prefix-list VPN-Labels

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 10.20.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family inet
set interfaces ge-2/0/0 unit 10 vlan-id 10
set interfaces ge-2/0/0 unit 10 encapsulation vlan-ccc
set interfaces ge-2/0/0 unit 10 family ccc

# L2VPN Configuration
set routing-instances a2 instance-type l2vpn
set routing-instances a2 interface ge-2/0/0.10

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 3.3.3.9/32

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf traffic-engineering
set protocols ospf overload
set protocols ospf reference-bandwidth 100g

# GRE Tunnel Configuration
set interfaces gr-0/0/10 unit 0 family mpls
set protocols mpls interface gr-0/0/10.0