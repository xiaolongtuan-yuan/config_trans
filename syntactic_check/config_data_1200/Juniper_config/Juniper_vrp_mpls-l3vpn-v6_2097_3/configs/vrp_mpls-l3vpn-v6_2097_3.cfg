# System Configuration
set system host-name ASBR2

# MPLS/LDP Configuration (explicit interfaces)
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 10.40.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces ge-2/0/0 unit 0 family inet address 10.21.1.2/24
set interfaces ge-2/0/0 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 3.3.3.9/32

# BGP Configuration (Group 200 - iBGP)
set protocols bgp group GROUP_200 type internal
set protocols bgp group GROUP_200 local-address 3.3.3.9
set protocols bgp group GROUP_200 neighbor 4.4.4.9
set protocols bgp group GROUP_200 peer-as 200
set protocols bgp group GROUP_200 family inet labeled-unicast  # Corrected send-label
set protocols bgp group GROUP_200 export policy2

# BGP Configuration (Group 100 - eBGP)
set protocols bgp group GROUP_100 type external
set protocols bgp group GROUP_100 peer-as 100
set protocols bgp group GROUP_100 neighbor 10.21.1.1
set protocols bgp group GROUP_100 family inet labeled-unicast  # Corrected send-label
set protocols bgp group GROUP_100 export policy1

# Policy Configuration
set policy-options policy-statement policy1 term 1 then accept
set policy-options policy-statement policy2 term 1 then accept
set policy-options policy-statement policy1 then next-hop self
set policy-options policy-statement policy2 then next-hop self

# OSPF Configuration
set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-1/0/0.0