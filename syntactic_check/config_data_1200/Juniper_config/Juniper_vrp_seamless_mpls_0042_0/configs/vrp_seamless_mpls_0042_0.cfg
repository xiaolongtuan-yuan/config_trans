set system host-name AGG

# LDP Configuration
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0

# ISIS Configuration
set protocols isis level 1 disable
set protocols isis level 2 wide-metrics-only
set protocols isis interface ge-0/0/1.0 point-to-point
set protocols isis interface ge-0/0/1.0 level 2 metric 10
set protocols isis interface lo0.0 passive

# Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 10.2.1.1/24
set interfaces ge-0/0/1 unit 0 family iso
set interfaces ge-0/0/1 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

# BGP Configuration
set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 2.2.2.2
set protocols bgp group ibgp cluster 2.2.2.2
set protocols bgp group ibgp neighbor 1.1.1.1 description "RR Client"
set protocols bgp group ibgp neighbor 1.1.1.1 peer-as 100
set protocols bgp group ibgp neighbor 1.1.1.1 family inet unicast
set protocols bgp group ibgp neighbor 1.1.1.1 family inet-vpn unicast
set protocols bgp group ibgp neighbor 3.3.3.3 description "RR Client"
set protocols bgp group ibgp neighbor 3.3.3.3 peer-as 100

# BFD Configuration
set protocols bfd traceoptions file bfd.log
set protocols bfd traceoptions flag all

# MPLS Configuration
set protocols mpls interface ge-1/0/0.0

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls

# LDP Configuration
set protocols ldp interface ge-1/0/0.0
set protocols ldp session-protection

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

# BGP Configuration
set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 1.1.1.1
set protocols bgp group ibgp neighbor 2.2.2.2 description "Route Reflector"
set protocols bgp group ibgp neighbor 2.2.2.2 peer-as 100
set protocols bgp group ibgp neighbor 2.2.2.2 bfd-liveness-detection minimum-interval 300
set protocols bgp group ibgp neighbor 2.2.2.2 family inet unicast
set protocols bgp group ibgp neighbor 2.2.2.2 export policy1
set protocols bgp group ibgp neighbor 2.2.2.2 multipath multiple-as

# Policy Configuration
set policy-options policy-statement policy1 term 10 then next-hop self
set policy-options policy-statement policy1 term 10 then accept

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols bgp group ibgp neighbor 3.3.3.3 family inet-vpn unicast

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0

# Policy Configuration
set policy-options policy-statement policy1 term 1 from protocol bgp
set policy-options policy-statement policy1 term 1 then accept