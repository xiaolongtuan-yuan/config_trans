set system host-name DeviceB

set protocols ldp
set protocols mpls interface all

set interfaces lo0 unit 0 family inet address 10.0.0.3/32
set protocols isis interface lo0.0 level 1

set interfaces ge-1/0/0 unit 31 vlan-id 31
set interfaces ge-1/0/0 unit 31 family inet address 3.0.0.6/30
set interfaces ge-1/0/0 mtu 9500
set protocols isis interface ge-1/0/0.31 level 1
set protocols mpls interface ge-1/0/0.31

set interfaces ge-1/0/1 unit 31 vlan-id 1
set interfaces ge-1/0/1 unit 31 family inet address 192.168.2.2/24
set routing-instances CDMA-RAN instance-type vrf
set routing-instances CDMA-RAN interface ge-1/0/1.31
set routing-instances CDMA-RAN route-distinguisher 4134:3060
set routing-instances CDMA-RAN vrf-target target:4134:306000
set routing-instances CDMA-RAN routing-options static arp 192.168.2.2 mac a1:b2:c3:d4:e5:f6 persistent

set services twamp-light session id 1 test-session 1
set services twamp-light session id 1 destination ip 192.168.1.1
set services twamp-light session id 1 source ip 192.168.2.2
set services twamp-light session id 1 destination-port 6000
set services twamp-light session id 1 source-port 6000
set services twamp-light session id 1 routing-instance CDMA-RAN
set services twamp-light sender-session id 1 interval 10