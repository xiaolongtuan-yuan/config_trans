set system host-name PE1

# VLAN Configuration
set vlans vlan10 vlan-id 10

# MPLS Configuration
set protocols mpls interface ge-1/0/1.0
set protocols mpls interface lo0.0

# LDP Configuration
set protocols ldp interface ge-1/0/1.0
set protocols ldp interface lo0.0

# L2VPN Configuration
set protocols l2vpn encapsulation-type ethernet-vpls
set protocols l2vpn site PE1 site-id 1
set protocols l2vpn site PE1 interface ge-1/0/0.1

# Interface Configuration
set interfaces ge-1/0/0 description "Interface GigabitEthernet1/0/1"
set interfaces ge-1/0/0 flexible-vlan-tagging

set interfaces ge-1/0/1 description "Interface GigabitEthernet1/0/2"
set interfaces ge-1/0/1 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/1 unit 0 family mpls

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface ge-1/0/1.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive