set system host-name PE1

set vlans vlan10 vlan-id 10

set protocols mpls interface all

set protocols mpls label-switched-path all label-protocol ldp

set protocols l2circuit bgp-signaling vfi ldp1 vpn-id 2
set protocols l2circuit bgp-signaling vfi ldp1 neighbor 2.2.2.9 neighbor-parameters encapsulation-type mpls

set bridge-domains bd10 vlan-id 10
set bridge-domains bd10 interface ge-1/0/0.1

set protocols ldp interface all

set interfaces ge-1/0/0 description "Interface GigabitEthernet1/0/1"
set interfaces ge-1/0/0 enable

set interfaces ge-1/0/0.1 encapsulation vlan-ccc
set interfaces ge-1/0/0.1 vlan-id 10

set interfaces ge-1/0/1 description "Interface GigabitEthernet1/0/2"
set interfaces ge-1/0/1 enable
set interfaces ge-1/0/1 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/1 unit 0 family mpls
set protocols mpls interface ge-1/0/1

set protocols ospf area 0 interface ge-1/0/1.0
set protocols ospf area 0 network 1.1.1.9/32
set protocols ospf area 0 network 10.1.1.0/24