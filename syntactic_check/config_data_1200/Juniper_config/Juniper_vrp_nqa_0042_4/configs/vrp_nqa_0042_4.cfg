set system host-name P2

# LDP配置保持不变
set protocols ldp transport-address-interface lo0.0

# 接口ge-1/0/0配置
set interfaces ge-1/0/0 unit 0 family inet address 10.3.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls

# 接口ge-2/0/0配置
set interfaces ge-2/0/0 unit 0 family inet address 10.4.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls

# Loopback配置
set interfaces lo0 unit 0 family inet address 4.4.4.9/32

# OSPF配置保持不变
set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0