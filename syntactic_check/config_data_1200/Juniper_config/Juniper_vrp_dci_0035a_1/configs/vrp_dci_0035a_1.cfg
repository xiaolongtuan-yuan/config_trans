set system host-name P

set protocols ldp router-id lo0
set protocols mpls label-distribution-protocol ldp

set protocols mpls traffic-engineering
set protocols mpls traffic-engineering area 0
set protocols mpls traffic-engineering router-id lo0
set protocols mpls traffic-engineering segment-routing global-block 153616 153800

set protocols isis level 2 wide-metrics-only
set protocols isis level 2 net 00.1111.1111.2222.00

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces lo1 unit 0 family inet address 2.2.2.2/32
set protocols isis interface lo1 point-to-point
set protocols isis interface lo1 prefix-sid 153710