set system host-name DeviceB

# 接口ge-1/0/1配置
set interfaces ge-1/0/1 unit 0 family ethernet-switching interface-mode access
set interfaces ge-1/0/1 unit 1 family inet address 10.1.1.2/24

# 接口ge-1/0/2配置
set interfaces ge-1/0/2 unit 0 family ethernet-switching interface-mode access
set interfaces ge-1/0/2 unit 0 family inet address 10.1.2.1/24

# 事件策略配置（保持不变）
set event-options policy SLA1
set event-options policy SLA1 then event-script log-script arguments 10.1.3.2
set event-options policy SLA1 then event-script log-script arguments 10.1.1.1
set event-options policy SLA1 events system
set event-options policy SLA1 within 10

# 防火墙过滤器配置（保持不变）
set firewall family inet filter ACCESS101 term term1 from source-address 0.0.0.0/0
set firewall family inet filter ACCESS101 term term1 from destination-address 10.1.3.2/32
set firewall family inet filter ACCESS101 term term1 then accept

set firewall family inet filter ACCESS101 term term2 from source-address 10.1.1.1/32
set firewall family inet filter ACCESS101 term term2 from destination-address 0.0.0.0/0
set firewall family inet filter ACCESS101 term term2 then accept

# 限速器配置（保持不变）
set firewall policer POLICE-TEST if-exceeding bandwidth-limit 500m
set firewall policer POLICE-TEST if-exceeding burst-size-limit 20000
set firewall policer POLICE-TEST then discard

# 策略配置修正（原行29-31）
set policy-options policy-statement test-policy then accept

# 应用限速器到接口（替代原策略应用）
set interfaces ge-1/0/1 unit 1 family inet policer input POLICE-TEST  # 直接应用限速器
set interfaces ge-1/0/1 unit 1 family inet filter input ACCESS101