set system host-name LSRA

# LDP Configuration
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface lt-0/0/10.0
set protocols ldp router-id 1.1.1.1

# Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 2.1.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols mpls interface ge-0/0/0.0

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

# MPLS-TP Interface
set interfaces lt-0/0/10 unit 0 encapsulation mpls
set interfaces lt-0/0/10 unit 0 family inet address 1.1.1.1/32
set protocols mpls interface lt-0/0/10.0
set protocols rsvp interface lt-0/0/10.0

# RSVP Configuration
set protocols rsvp interface ge-0/0/0.0



# Static Routing
set routing-options static route 2.2.2.2/32 next-hop 2.1.1.2
set routing-options static route 3.3.3.3/32 next-hop 2.1.1.2

# MPLS-TP OAM Configuration
set protocols oam mpls failure-alert
set protocols oam mpls test meg test mep-local 1 interface lt-0/0/10.0
set protocols oam mpls test meg test remote-mep-id 2