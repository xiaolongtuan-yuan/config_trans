set system host-name LSRC

# MPLS/LDP Configuration
set protocols mpls interface ge-1/0/0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp router-id 3.3.3.3

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 3.2.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 3.3.3.3/32

# RSVP Configuration
set protocols rsvp interface ge-1/0/0.0


# Static Routing
set routing-options static route 1.1.1.1/32 next-hop 3.2.1.1
set routing-options static route 2.2.2.2/32 next-hop 3.2.1.1

