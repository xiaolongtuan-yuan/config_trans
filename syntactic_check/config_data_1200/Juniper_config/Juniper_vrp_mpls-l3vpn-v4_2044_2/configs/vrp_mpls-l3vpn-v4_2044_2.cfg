set system host-name CE1

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0

set interfaces ge-1/0/0 unit 0 family inet address 40.1.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols ldp interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 0 family inet address 11.1.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls

set interfaces lo0 unit 1 family inet address 2.2.2.9/32

set routing-options autonomous-system 200

set protocols bgp group EXT-PEERS type external
set protocols bgp group EXT-PEERS neighbor 11.1.1.2 peer-as 100
set protocols bgp group EXT-PEERS export POLICY1
set protocols bgp group EXT-PEERS local-address 11.1.1.1
set protocols bgp group EXT-PEERS multihop ttl 255

set policy-options policy-statement POLICY1 term 1 then next-hop self
set policy-options policy-statement POLICY1 term 1 then accept

set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-1/0/0.0
set protocols ospf area 0 interface ge-2/0/0.0