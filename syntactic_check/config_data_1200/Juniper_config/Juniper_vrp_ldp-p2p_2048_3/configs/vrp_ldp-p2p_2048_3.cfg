set system host-name LSRD

# MPLS Configuration
set protocols mpls interface so-1/0/0
set protocols mpls interface lo0

# LDP Configuration
set protocols ldp
set protocols ldp interface so-1/0/0
set protocols ldp interface lo0

# SONET Interface Configuration
set interfaces so-1/0/0 sonet-options
set interfaces so-1/0/0 unit 0 family inet address 10.1.3.1/24
set interfaces so-1/0/0 unit 0 family mpls

# Loopback Configuration
set interfaces lo0 unit 1 family inet address 4.4.4.9/32

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface so-1/0/0
set protocols ospf area 0.0.0.0 interface lo0.1 passive

# Policy Configuration
set policy-options prefix-list prefix1 3.3.3.9/32