set system host-name LSRA

set protocols ldp
set protocols mpls traffic-engineering

set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/1 unit 0 mpls
set protocols isis interface ge-0/0/1.0 point-to-point
set protocols isis interface ge-0/0/1.0 level 2 disable

set interfaces lo0 unit 1 family inet address 1.1.1.1/32
set protocols isis interface lo0.1 point-to-point
set protocols isis interface lo0.1 level 2 disable

set interfaces lt-0/0/0 unit 10 family inet address-family mpls
set interfaces lt-0/0/0 unit 10 tunnel source 1.1.1.1
set interfaces lt-0/0/0 unit 10 tunnel destination 3.3.3.3
set protocols mpls label-switched-path tolsrc to 3.3.3.3
set protocols mpls label-switched-path tolsrc admin-groups all
set protocols mpls label-switched-path tolsrc bandwidth 1000
set protocols mpls label-switched-path tolsrc priority 7
set protocols mpls label-switched-path tolsrc path 1 explicit "tolsrc"
set protocols mpls label-switched-path tolsrc path 2 explicit "tolsrf"
set protocols mpls label-switched-path tolsrc path 3 explicit "tolsre"

set protocols mpls traffic-engineering area 0.0.0.1
set protocols mpls traffic-engineering router-id lo0.1

set protocols isis traffic-engineering
set protocols isis mpls-traffic-eng router-id lo0.1
set protocols isis net 49.0001.0000.0000.0001.00
set protocols isis level 2 metric-style wide
set protocols isis level 2 mpls ldp 

set protocols mpls traffic-engineering auto-bw
set protocols mpls traffic-engineering auto-bw periodic 
set protocols mpls traffic-engineering auto-bw frequency 600
set protocols mpls traffic-engineering auto-bw max-bandwidth 10000 application all

set protocols mpls traffic-engineering tunnel dynamic 