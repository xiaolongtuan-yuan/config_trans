set system host-name NPE1

set protocols mpls label-switched-path protocol ldp
set protocols ldp interface all

set interfaces ge-0/0/0 description "Channel-group interface"
set interfaces ge-0/0/0 gigether-options 802.3ad ae10
set interfaces ge-0/0/0 link-mode full-duplex

set interfaces ge-0/0/1 unit 0 family inet address 192.168.30.2/24
set interfaces ge-0/0/1 unit 0 family mpls
set interfaces ge-0/0/1 link-mode full-duplex

set interfaces ge-0/0/3 unit 0 family inet address 192.168.60.1/24
set interfaces ge-0/0/3 unit 0 family mpls
set interfaces ge-0/0/3 link-mode full-duplex

set interfaces lo0 unit 1 family inet address 4.4.4.4/32

set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface ge-0/0/3.0

set protocols ldp targeted-session 2.2.2.2
set protocols ldp targeted-session 3.3.3.3