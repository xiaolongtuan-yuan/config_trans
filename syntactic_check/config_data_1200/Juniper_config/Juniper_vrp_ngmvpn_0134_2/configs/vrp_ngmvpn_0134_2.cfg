set system host-name CE2

# IGMP/PIM配置（保持不变）
set protocols igmp interface ge-1/0/1.0 join 224.0.0.1
set protocols pim interface ge-1/0/1.0 mode sparse
set protocols pim interface ge-1/0/2.0 mode sparse

# 接口配置（保持不变）
set interfaces ge-1/0/1 unit 0 family inet address 172.16.2.1/24
set interfaces ge-1/0/2 unit 0 family inet address 192.168.2.2/24

# 修正多播路由配置（原行10）
set routing-options multicast  # 启用多播路由功能

# OSPF配置（保持不变）
set protocols ospf area 0 interface ge-1/0/1.0
set protocols ospf area 0 interface ge-1/0/2.0