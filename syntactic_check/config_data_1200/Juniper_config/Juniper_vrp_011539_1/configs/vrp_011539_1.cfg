set system host-name PE2

# Interface Configurations
set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 unit 1 vlan-id 2
set interfaces ge-1/0/1 unit 1 encapsulation vlan-ccc
set interfaces ge-1/0/1 unit 1 family ccc

set interfaces ge-1/0/2 unit 0 family inet address 10.1.1.2/24
set interfaces ge-1/0/2 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

# L2Circuit Configuration
set protocols l2circuit neighbor 1.1.1.1 interface ge-1/0/1.1 virtual-circuit-id 100
set protocols l2circuit neighbor 1.1.1.1 encapsulation-type ethernet-vlan
set protocols l2circuit neighbor 1.1.1.1 mtu 1500

# MPLS/LDP Configuration
set protocols mpls interface ge-1/0/1.1
set protocols mpls interface ge-1/0/2.0
set protocols ldp interface ge-1/0/2.0
set protocols ldp router-id 1.1.1.1

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/2.0

# CFM Configuration (Corrected Syntax)
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 level 3
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 md1
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 mep 2 interface ge-1/0/1.1 direction down
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 mep 2 continuity-check
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 remote-mep 2
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 loss-measurement one-way-delay test-id 1