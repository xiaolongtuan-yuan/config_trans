set system host-name PE2

set interfaces ge-1/0/1 vlan-tagging
set interfaces ge-1/0/1 unit 1 vlan-id 2
set interfaces ge-1/0/1 unit 1 encapsulation vlan-ccc
set protocols l2circuit neighbor 1.1.1.1 interface ge-1/0/1.1 virtual-circuit-id 100
set protocols l2circuit neighbor 1.1.1.1 interface ge-1/0/1.1 encapsulation-type ethernet-vlan
set protocols l2circuit neighbor 1.1.1.1 interface ge-1/0/1.1 mtu 1500

set interfaces ge-1/0/2 unit 0 family inet address 10.1.1.2/24
set interfaces ge-1/0/2 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 1.1.1.1/24

set protocols mpls interface ge-1/0/1.1
set protocols mpls interface ge-1/0/2
set protocols ldp router-id 1.1.1.1 force

set protocols ospf area 0 interface lo0.0 passive
set protocols ospf area 0 interface ge-1/0/2.0

set cfm domain md1 level 3 id 1
set cfm domain md1 service ma1-id 1
set cfm domain md1 service ma1 mep 2
set cfm domain md1 service ma1 mep 2 interface ge-1/0/1.1 direction 'inward'
set cfm domain md1 service ma1 mep 2 ccm enabled
set cfm domain md1 service ma1 mip 1
set cfm domain md1 service ma1 mip 1 ccm enabled
set cfm domain md1 service ma1 mep 2 peer-address 2.2.2.2 test-id 1 direction 'receive'