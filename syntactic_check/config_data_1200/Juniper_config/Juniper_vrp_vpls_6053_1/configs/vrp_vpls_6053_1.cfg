set system host-name PE1

# LDP 配置修正
set protocols ldp interface ge-2/0/0.0  # 替换"interface all"
set protocols ldp interface lo0.0

# MPLS 配置修正
set routing-options router-id 1.1.1.1

# VLAN 接口配置修正
set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 unit 0 family ethernet-switching

# 核心接口配置（保持不变）
set interfaces ge-2/0/0 unit 0 family inet address 10.10.1.1/24
set protocols ldp interface ge-2/0/0.0
set protocols mpls interface ge-2/0/0.0

# Loopback 配置（保持不变）
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

# VPLS 实例配置修正
set routing-instances VPLS-AD1 interface ge-1/0/0.1
set routing-instances VPLS-AD1 vrf-target target:100:100
set routing-instances VPLS-AD1 protocols l2vpn encapsulation-type ethernet  # 替换vpls
set routing-instances VPLS-AD1 protocols l2vpn site PE1 site-identifier 1  # 站点定义
set routing-instances VPLS-AD1 protocols l2vpn neighbor 200.1.1.1 pseudowire-status-tlv

# BGP 配置修正
set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 1.1.1.1
set protocols bgp group ibgp neighbor 2.2.2.2
set protocols bgp group ibgp family inet unicast
set protocols bgp group ibgp family inet labeled-unicast  # 修正label-switched-paths

set protocols bgp group ebgp type external
set protocols bgp group ebgp peer-as 200
set protocols bgp group ebgp multihop ttl 255
set protocols bgp group ebgp local-address 1.1.1.1
set protocols bgp group ebgp neighbor 4.4.4.4
set protocols bgp group ebgp family l2vpn signaling  # 修正vpls signaling

# OSPF 配置（保持不变）
set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0