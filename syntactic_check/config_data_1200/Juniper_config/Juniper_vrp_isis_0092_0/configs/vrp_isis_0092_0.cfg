set system host-name DeviceA

# IS-IS Configuration
set protocols isis level 1 disable
set protocols isis level 2 wide-metrics-only
set protocols isis interface ge-1/0/0.0 level 1 disable
set protocols isis interface ge-1/0/0.0 point-to-point

set protocols isis interface ge-2/0/0.0 level 1 disable
set protocols isis interface ge-2/0/0.0 point-to-point
set protocols isis interface ge-2/0/0.0 level 2 metric 30

# Interface Configurations
set interfaces ge-1/0/0 unit 0 family inet address 10.0.1.1/24
set interfaces ge-2/0/0 unit 0 family inet address 10.1.1.1/24