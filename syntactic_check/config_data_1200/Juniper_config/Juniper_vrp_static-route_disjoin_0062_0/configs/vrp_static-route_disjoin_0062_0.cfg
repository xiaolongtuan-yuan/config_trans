set system host-name LSRA

# LDP Configuration
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0

# Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/30
set interfaces ge-0/0/0 unit 0 family mpls
set protocols mpls interface ge-0/0/0.0

set interfaces ge-0/0/1 unit 0 family inet address 10.2.1.1/30
set interfaces ge-0/0/1 unit 0 family mpls
set protocols mpls interface ge-0/0/1.0

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

# Static Route Configuration
set routing-options static route 2.2.2.2/32 next-hop 10.1.1.2
set routing-options static route 3.3.3.3/32 next-hop 10.2.1.2
set routing-options static route 4.4.4.4/32 qualified-next-hop 10.1.1.2 preference 40
set routing-options static route 4.4.4.4/32 next-hop 10.2.1.2
set routing-options static route 10.3.1.0/30 next-hop 10.1.1.2
set routing-options static route 10.4.1.0/30 next-hop 10.2.1.2