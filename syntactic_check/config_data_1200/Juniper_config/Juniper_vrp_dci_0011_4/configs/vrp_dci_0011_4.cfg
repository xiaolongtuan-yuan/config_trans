set system host-name DCI-PE1

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target target:111:1
set routing-instances vpn1 vrf-target import target:111:1

set protocols mpls label-switched-path te-10 to 3.3.3.3
set protocols ldp interface all

set interfaces ge-1/0/0 unit 0 family inet address 192.168.20.1/24
set routing-instances vpn1 interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 0 family inet address 192.168.1.1/24
set protocols mpls interface ge-2/0/0

set interfaces lo0 unit 1 family inet address 1.1.1.1/32

set protocols mpls label-switched-path te-10 to 3.3.3.3
set protocols mpls label-switched-path te-10 from 1.1.1.1
set protocols mpls label-switched-path te-10 tunnel-id 100

set protocols bgp group ibgp type internal
set protocols bgp group ibgp neighbor 3.3.3.3 peer-as 100
set protocols bgp group ibgp local-address 1.1.1.1
set protocols bgp group ibgp family inet unicast
set protocols bgp group ibgp family inet-vpn unicast
set protocols bgp group ibgp family inet-vpn unicast add-path-tx route-target
set protocols bgp group ibgp family inet-vpn unicast send-community both
set routing-instances vpn1 protocols bgp group vpn1 type external
set routing-instances vpn1 protocols bgp group vpn1 peer-as 65410
set routing-instances vpn1 protocols bgp neighbor 192.168.20.2 peer-as 65410

set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf traffic-engineering
set protocols ospf traffic-engineering mpls-te-router-id 1.1.1.1