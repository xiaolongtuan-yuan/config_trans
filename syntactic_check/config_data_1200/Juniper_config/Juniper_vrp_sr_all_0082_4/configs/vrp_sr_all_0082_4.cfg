set system host-name CE1

# Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces lo0 unit 1 family inet address 10.11.1.1/32

# BGP Configuration
set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 100
set protocols bgp group external-peers neighbor 10.1.1.2
set protocols bgp group external-peers family inet unicast

# Static Route Configuration
set routing-options static route 10.11.1.1/32 discard

# BGP Export Policy
set policy-options policy-statement export-bgp-pol term 1 from route-filter 10.11.1.1/32 exact
set policy-options policy-statement export-bgp-pol term 1 then accept
set protocols bgp group external-peers export export-bgp-pol