set system host-name DeviceA

set vlans vlan-10 vlan-id 10
set vlans vlan-20 vlan-id 20

set interfaces ge-1/0/1 unit 0 family ethernet-switching interface-mode access
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members [ 2-500 ]
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan-stacking stacked-vlan 10
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan-stacking input-vlan-map [ 1000-2000 ]
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan-stacking output-vlan-map single-vlan-id 20

set interfaces ge-2/0/1 unit 0 family ethernet-switching interface-mode access
set interfaces ge-2/0/1 unit 0 family ethernet-switching vlan members [ 100-500 ]
set interfaces ge-2/0/1 unit 0 family ethernet-switching vlan-stacking stacked-vlan 10

set interfaces ge-3/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-3/0/1 unit 0 family ethernet-switching vlan members 20