set system host-name DeviceA

set vlans vlan-10 vlan-id 10
set vlans vlan-20 vlan-id 20

# QinQ Configuration for ge-1/0/1 (Customer-facing port)
set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 encapsulation flexible-ethernet-services
set interfaces ge-1/0/1 native-vlan-id 10
set interfaces ge-1/0/1 unit 0 encapsulation vlan-bridge
set interfaces ge-1/0/1 unit 0 vlan-id-list 2-500

# QinQ Configuration for ge-2/0/1 (Customer-facing port)
set interfaces ge-2/0/1 flexible-vlan-tagging
set interfaces ge-2/0/1 encapsulation flexible-ethernet-services
set interfaces ge-2/0/1 native-vlan-id 10
set interfaces ge-2/0/1 unit 0 encapsulation vlan-bridge
set interfaces ge-2/0/1 unit 0 vlan-id-list 100-500

# Trunk port configuration (Network-facing port)
set interfaces ge-3/0/1 flexible-vlan-tagging
set interfaces ge-3/0/1 encapsulation extended-vlan-bridge
set interfaces ge-3/0/1 unit 0 encapsulation vlan-bridge
set interfaces ge-3/0/1 unit 0 vlan-id 20
set interfaces ge-3/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-3/0/1 unit 0 family ethernet-switching vlan members vlan-20