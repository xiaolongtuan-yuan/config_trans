set system host-name routerA

set interfaces ae1 description "EtherChannel to Huawei Eth-Trunk1"
set interfaces ae1 unit 0 family inet address 10.40.1.1/24

set interfaces ge-0/0/0 enable
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24

set interfaces ge-0/0/1 enable
set interfaces ge-0/0/1 unit 0 family inet address 10.30.1.1/24

set interfaces ge-0/0/2 enable
set interfaces ge-0/0/2 gigether-options 802.3ad ae1

set interfaces ge-0/0/3 enable
set interfaces ge-0/0/3 gigether-options 802.3ad ae1

set routing-options static route 10.20.1.0/24 next-hop 10.30.1.2
set routing-options static route 10.20.1.0/24 next-hop 10.40.1.2
set routing-options static route 10.50.1.0/24 next-hop 10.30.1.2
set routing-options static route 10.50.1.0/24 next-hop 10.40.1.2