set system host-name DeviceC

set protocols isis level 2 wide-metrics-only
set protocols isis interface ge-1/0/0.0 point-to-point
set protocols isis interface ge-3/0/0.0 point-to-point
set protocols isis interface ge-1/0/0.0 family inet6
set protocols isis interface ge-3/0/0.0 family inet6

set protocols ospf3 area 0.0.0.2 interface ge-2/0/0.0
set protocols ospf3 area 0.0.0.2 interface lo0.0 passive
set routing-options router-id 1.1.1.1

set interfaces lo0 unit 0 family inet address 1.1.1.1/32