set system host-name PE1

# VLAN Configuration
set vlans vlan-100 vlan-id 100
set vlans vlan-200 vlan-id 200

# L2 Protocol Tunneling Configuration
set protocols l2-learning global-mode switching
set protocols l2-learning global-mode enhanced-switching
set protocols l2circuit neighbor 1.1.1.1 interface ge-1/0/1.0 virtual-circuit-id 100
set protocols l2circuit neighbor 1.1.1.1 interface ge-1/0/1.0 virtual-circuit-id 200

# Interface ge-1/0/1 Configuration (Access Port)
set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 encapsulation flexible-ethernet-services
set interfaces ge-1/0/1 unit 0 encapsulation vlan-bridge
set interfaces ge-1/0/1 unit 0 vlan-id 100
set interfaces ge-1/0/1 unit 0 family bridge vlan-id-list 100
set interfaces ge-1/0/1 unit 1 encapsulation vlan-bridge
set interfaces ge-1/0/1 unit 1 vlan-id 200
set interfaces ge-1/0/1 unit 1 family bridge vlan-id-list 200

# Interface ge-1/0/2 Configuration (Trunk Port)
set interfaces ge-1/0/2 flexible-vlan-tagging
set interfaces ge-1/0/2 encapsulation flexible-ethernet-services
set interfaces ge-1/0/2 unit 0 encapsulation vlan-bridge
set interfaces ge-1/0/2 unit 0 family bridge interface-mode trunk

# STP Configuration
set protocols stp interface ge-1/0/1 edge
set protocols stp interface ge-1/0/2 mode point-to-point