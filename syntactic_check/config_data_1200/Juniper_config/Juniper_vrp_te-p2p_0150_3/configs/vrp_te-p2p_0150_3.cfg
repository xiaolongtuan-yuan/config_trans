set system host-name PE2

# MPLS Configuration
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.2/30
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 disable

set interfaces ge-2/0/0 unit 0 family inet address 10.5.1.2/30
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 disable

set interfaces lo0 unit 0 family inet address 3.3.3.3/32