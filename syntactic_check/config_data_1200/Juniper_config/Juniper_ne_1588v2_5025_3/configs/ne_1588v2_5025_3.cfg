set system host-name PE2

# PTP Configuration
!set protocols ptp clock-source bits-intf0.0
!set protocols ptp clock-source bits-intf0.0 priority 1
!set protocols ptp domain 1

# Interface GigabitEthernet1/0/0
set interfaces ge-0/0/0 unit 0 family inet address 192.168.0.1/24
!set interfaces ge-0/0/0 unit 0 family inet ptp domain 1
!set interfaces ge-0/0/0 unit 0 family inet ptp delay-mechanism pdelay
!set interfaces ge-0/0/0 unit 0 family inet ptp announce-interval 8
!set interfaces ge-0/0/0 unit 0 family inet ptp min-delay-request-interval 10
!set interfaces ge-0/0/0 unit 0 family inet ptp transport address 192.168.0.2
!set interfaces ge-0/0/0 unit 0 family inet ptp transport destination-mac 00:e0:fc:22:44:44
!set interfaces ge-0/0/0 unit 0 family inet ptp transport source-ip 192.168.0.1

# Interface GigabitEthernet2/0/0
set interfaces ge-0/0/1 unit 0 family inet address 10.0.0.2/24
!set interfaces ge-0/0/1 unit 0 family inet ptp delay-mechanism pdelay
!set interfaces ge-0/0/1 unit 0 family inet ptp transport address 10.0.0.1
!set interfaces ge-0/0/1 unit 0 family inet ptp transport destination-mac 00:e0:fc:22:11:11
!set protocols ptp announce receipt-timeout 10

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
