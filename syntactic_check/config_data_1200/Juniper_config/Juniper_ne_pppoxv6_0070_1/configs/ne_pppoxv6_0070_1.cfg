set system host-name CE

# Port-Channel Configuration (Juniper equivalent of Cisco Port-channel)
set interfaces ae100 flexible-vlan-tagging
set interfaces ae100 encapsulation flexible-ethernet-services
set interfaces ae100 unit 100 vlan-id 100
set interfaces ae100 unit 100 family ethernet-switching interface-mode trunk
set interfaces ae100 unit 100 family ethernet-switching vlan members 100

# Physical Interfaces Configuration
set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 unit 100 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/1 unit 100 family ethernet-switching vlan members 100

set interfaces ge-1/0/2 ether-options 802.3ad ae100
set interfaces ge-1/0/3 ether-options 802.3ad ae100

