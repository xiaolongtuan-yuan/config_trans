set system host-name DeviceF

set routing-options multicast

set protocols isis level 1 disable
set protocols isis level 2 disable
set protocols isis interface all

set interfaces ge-1/0/0 unit 0 family inet address 10.110.2.2/24
set interfaces ge-1/0/0 unit 0 family inet mtu 1500
set interfaces ge-1/0/0 unit 0 family inet filter input VCA_ACL
set interfaces ge-1/0/0 unit 0 family inet filter output VCA_ACL_MASTER
set protocols pim interface ge-1/0/0.0 mode sparse
set protocols igmp interface ge-1/0/0.0
set protocols igmp interface ge-1/0/0.0 static group 224.0.0.0
set protocols igmp interface ge-1/0/0.0 static group 224.0.0.1