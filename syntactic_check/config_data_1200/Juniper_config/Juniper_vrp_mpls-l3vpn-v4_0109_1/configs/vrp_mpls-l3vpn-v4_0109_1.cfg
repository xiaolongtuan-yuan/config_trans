set system host-name Spoke-PE1

# VRF Configuration
set routing-instances vpna instance-type vrf
set routing-instances vpna route-distinguisher 100:1
set routing-instances vpna vrf-export target:100:1
set routing-instances vpna vrf-import target:200:1

# LDP Configuration
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface lo0.0

# MPLS Configuration
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
set protocols mpls interface lo0.0

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 100.1.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set routing-instances vpna interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 0 family inet address 20.1.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls

set interfaces lo0 unit 1 family inet address 1.1.1.9/32

# BGP Configuration
set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 1.1.1.9
set protocols bgp group ibgp neighbor 2.2.2.9
set protocols bgp group ibgp peer-as 100
set protocols bgp group ibgp family inet unicast
set protocols bgp group ibgp family inet-vpn unicast
set protocols bgp group ibgp export send-community

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.1