set system host-name DeviceB

# IPv6 Interface Configuration (Corrected Syntax)
set interfaces ge-1/0/0 disable

# IPv4 Interface Configuration
set interfaces ge-1/0/1 unit 0 family inet address 172.16.1.2/24
set interfaces ge-1/0/1 disable

# GRE Tunnel Configuration
set interfaces gr-1/0/0 unit 1 tunnel source 2001:db8:300::2
set interfaces gr-1/0/0 unit 1 tunnel destination 2001:db8:200::1
set interfaces gr-1/0/0 unit 1 family inet address 192.168.1.2/24

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface gr-1/0/0.1
set protocols ospf area 0.0.0.0 interface ge-1/0/1.0

# IPv6 Static Route (Corrected Syntax)
set routing-options rib inet6.0 static route 2001:db8:200::/64 next-hop 2001:db8:100::1