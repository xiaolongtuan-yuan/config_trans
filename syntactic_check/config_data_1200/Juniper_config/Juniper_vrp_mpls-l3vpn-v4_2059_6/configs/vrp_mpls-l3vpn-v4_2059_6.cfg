set system host-name PE4

# VRF Configuration for VPN1
set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:2
set routing-instances vpn1 vrf-target target:1:1

# MPLS & LDP Configuration
set protocols mpls interface ge-2/0/0
set protocols ldp interface ge-2/0/0

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 172.16.2.2/24
set routing-instances vpn1 interface ge-1/0/0

set interfaces ge-2/0/0 unit 0 family inet address 20.1.1.2/24
set interfaces ge-2/0/0 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 6.6.6.9/32

# BGP Configuration (External Peering)
set protocols bgp group ebgp type external
set protocols bgp group ebgp peer-as 200
set protocols bgp group ebgp neighbor 1.1.1.9
set protocols bgp group ebgp local-address 6.6.6.9
set protocols bgp group ebgp family inet unicast
set protocols bgp group ebgp family inet-vpn unicast

# BGP Configuration (Internal Peering)
set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 6.6.6.9
set protocols bgp group ibgp neighbor 5.5.5.9
set protocols bgp group ibgp family inet-vpn unicast
set protocols bgp group ibgp export next-hop-self

# VRF BGP Configuration (CE Peering)
set routing-instances vpn1 protocols bgp group ce-peering type external
set routing-instances vpn1 protocols bgp group ce-peering peer-as 65420
set routing-instances vpn1 protocols bgp group ce-peering neighbor 172.16.2.1
set routing-instances vpn1 protocols bgp group ce-peering local-address 172.16.2.2

# OSPF Configuration
set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-2/0/0.0