set system host-name PE4

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:2
set routing-instances vpn1 vrf-target target:1:1
set routing-instances vpn1 vrf-import vpn1-import
set routing-instances vpn1 vrf-export vpn1-export

set protocols ldp interface all

set interfaces ge-1/0/0 unit 0 family inet address 172.16.2.2/24
set interfaces ge-1/0/0 unit 0 family inet.vpn instance vpn1
set interfaces ge-1/0/0 disable false

set interfaces ge-2/0/0 unit 0 family inet address 20.1.1.2/24
set protocols mpls interface ge-2/0/0
set protocols ldp interface ge-2/0/0
set interfaces ge-2/0/0 disable false

set interfaces lo0 unit 1 family inet address 6.6.6.9/32

set routing-options autonomous-system 300

set protocols bgp group ebgp type external
set protocols bgp group ebgp import ebgp-import
set protocols bgp group ebgp export ebgp-export
set protocols bgp group ebgp peer-as 200
set protocols bgp group ebgp neighbor 1.1.1.9
set protocols bgp group ebgp multihop 10
set protocols bgp group ebgp local-address 6.6.6.9

set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 6.6.6.9
set protocols bgp group ibgp neighbor 5.5.5.9

set protocols bgp group ebgp family inet unicast
set protocols bgp group ebgp family inet-vpn unicast
set protocols bgp group ibgp family inet-vpn unicast
set protocols bgp group ibgp family inet-vpn send-community both

set protocols bgp group vrf-ibgp type internal
set protocols bgp group vrf-ibgp local-address 172.16.2.2
set protocols bgp group vrf-ibgp export vpn1-export
set protocols bgp group vrf-ibgp peer-as 65420
set protocols bgp group vrf-ibgp neighbor 172.16.2.1

set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-2/0/0