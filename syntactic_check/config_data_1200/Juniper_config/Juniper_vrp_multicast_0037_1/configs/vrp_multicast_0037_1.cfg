set system host-name DeviceB

# 多播基础配置
set routing-options multicast all-routes

# ACL配置保持不变
set firewall family inet filter ACL-2001 term 1 from destination-address 232.1.1.0/24
set firewall family inet filter ACL-2001 term 1 then accept

# ISIS协议配置修正
set protocols isis level 2 wide-metrics-only
set protocols isis interface all
# 修正lo0接口配置（原行7）
set protocols isis interface lo0.0 passive
set protocols isis level 2 disable

# 接口ge-1/0/0配置保持不变
set interfaces ge-1/0/0 unit 0 family inet address 192.168.2.1/24
set protocols pim interface ge-1/0/0 mode sparse
set protocols isis interface ge-1/0/0 point-to-point

# 接口ge-2/0/0配置修正
set interfaces ge-2/0/0 unit 0 family inet address 10.110.2.1/24
set protocols pim interface ge-2/0/0 mode sparse
# 修正IGMP配置（原行18）
set protocols igmp interface ge-2/0/0 version 3
set protocols isis interface ge-2/0/0 point-to-point

# PIM配置保持不变
set protocols pim ssm default-group-range ACL-2001
set protocols pim rp static address 192.168.4.1