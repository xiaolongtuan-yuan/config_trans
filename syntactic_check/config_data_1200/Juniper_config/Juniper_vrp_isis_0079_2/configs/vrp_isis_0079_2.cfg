set system host-name DeviceC

# IS-IS Global Configuration
set protocols isis level 1 disable
set protocols isis level 2 disable

# Interface ge-1/0/0 Configuration
set interfaces ge-1/0/0 disable
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 unit 0 family iso
set interfaces ge-1/0/0 encapsulation ethernet-ccc

# Interface ge-2/0/0 Configuration
set interfaces ge-2/0/0 disable
set interfaces ge-2/0/0 unit 0 family inet address 10.1.2.1/24
set interfaces ge-2/0/0 unit 0 family iso
set interfaces ge-2/0/0 encapsulation ethernet-ccc

# Interface ge-3/0/0 Configuration
set interfaces ge-3/0/0 disable
set interfaces ge-3/0/0 unit 0 family inet address 192.168.0.1/24
set interfaces ge-3/0/0 unit 0 family iso
set interfaces ge-3/0/0 encapsulation ethernet-ccc

# IS-IS Interface Configuration
set protocols isis interface ge-1/0/0.0 level 1 disable
set protocols isis interface ge-1/0/0.0 level 2 disable
