set system host-name UPE1

set protocols mpls label-switched-path ldp

set protocols l2circuit neighbor 2.2.2.2
set protocols l2circuit neighbor 4.4.4.4
set protocols l2circuit neighbor 2.2.2.2 preference 1
set protocols l2circuit neighbor 3.3.3.3 preference 2
set protocols l2circuit pw-redundancy master enable

set routing-instances bvsi1 instance-type virtual-switch
set routing-instances bvsi1 interface ge-0/0/0.1
set routing-instances bvsi1 bridge-domains vsi-bvsi1 vlan-id 100
set routing-instances bvsi1 backbone-source-mac 00:e0:fc:00:12:34
set routing-instances bvsi1 mac-withdraw mac-compatibility

set routing-instances ivsi1 instance-type virtual-switch
set routing-instances ivsi1 interface ge-0/0/0.1
set routing-instances ivsi1 bridge-domains vsi-ivsi1 vlan-id 10
set routing-instances ivsi1 i-tag 100
set routing-instances ivsi1 backbone-destination-mac static 00:e0:fc:12:34:56
set routing-instances ivsi1 interface ge-0/0/0.1

set protocols ldp

set interfaces ge-0/0/0 unit 0 family ethernet-switching
set interfaces ge-0/0/0 disable

set interfaces ge-0/0/0 unit 0.1 encapsulation vlan-ccc vlan-id 10

set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/1 unit 0 mpls

set interfaces ge-0/0/2 unit 0 family inet address 10.3.1.1/24
set interfaces ge-0/0/2 unit 0 mpls

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-0/0/1.0
set protocols ospf area 0 interface ge-0/0/2.0