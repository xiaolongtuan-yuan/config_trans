set system host-name PE3

# VRF Configuration
set routing-instances evrf1 instance-type vrf
set routing-instances evrf1 route-distinguisher 100:1
set routing-instances evrf1 vrf-target target:1:1

# MPLS/LDP Configuration
set protocols mpls interface ge-0/0/1.0
set protocols mpls interface lo0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp interface lo0.0

# VLAN Configuration
set vlans BD-10 vlan-id 10

# Interface Configuration
set interfaces ae10 aggregated-ether-options lacp active
set interfaces ae10 description "Port-channel 10"
set interfaces ae10 unit 0 family ethernet-switching

set interfaces ge-0/0/0 gigether-options 802.3ad ae10
set interfaces ge-0/0/0 ether-options no-auto-negotiation
set interfaces ge-0/0/0 link-mode full-duplex

set interfaces ge-0/0/1 unit 0 family inet address 10.3.1.2/24
set interfaces lo0 unit 0 family inet address 4.4.4.4/32

# BGP Configuration
set routing-options autonomous-system 100
set protocols bgp group EBGP-CUSTOMER type external
set protocols bgp group EBGP-CUSTOMER neighbor 3.3.3.3 peer-as 100
set protocols bgp group EBGP-CUSTOMER neighbor 3.3.3.3 local-address 4.4.4.4

# OSPF Configuration
set protocols ospf area 0 interface lo0.0 passive
set protocols ospf area 0 interface ge-0/0/1.0