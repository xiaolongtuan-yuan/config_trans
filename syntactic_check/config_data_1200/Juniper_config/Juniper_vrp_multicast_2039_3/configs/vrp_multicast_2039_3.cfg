set system host-name DeviceD

set routing-options router-id 4.4.4.4

set interfaces ge-1/0/0 unit 0 family inet6 address 2001:db8:2::2/64
set interfaces ge-1/0/0 unit 0 family inet6 address 2001:db8:2::2/64 ospf6-interface-type p2p
set interfaces ge-1/0/0 unit 0 multicast-options family inet6 mode sparse
set interfaces ge-1/0/0 unit 0 disable

set interfaces ge-2/0/0 unit 0 family inet6 address 2001:db8:3::2/64
set interfaces ge-2/0/0 unit 0 family inet6 address 2001:db8:3::2/64 ospf6-interface-type p2p
set interfaces ge-2/0/0 unit 0 multicast-options family inet6 mode sparse
set interfaces ge-2/0/0 unit 0 disable

set interfaces ge-3/0/0 unit 0 family inet6 address 2001:db8:4::1/64
set interfaces ge-3/0/0 unit 0 family inet6 address 2001:db8:4::1/64 ospf6-interface-type p2p
set interfaces ge-3/0/0 unit 0 multicast-options family inet6 mode sparse
set interfaces ge-3/0/0 unit 0 disable

set protocols ospf3 area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf3 area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf3 area 0.0.0.0 interface ge-3/0/0.0

set protocols pim interface ge-1/0/0.0 mode sparse
set protocols pim interface ge-2/0/0.0 mode sparse
set protocols pim interface ge-3/0/0.0 mode sparse

set policy-options policy-statement acl-2000 term 1 from source-address 2001:db8:5::5/64
set policy-options policy-statement acl-2001 term 1 from source-address 2001:db8:3::2/64
set policy-options policy-statement acl-3000 term 1 from source-address 2001:db8:3::2/128 destination-address ff00::8/128
set policy-options policy-statement acl-3001 term 1 from source-address 2001:db8:5::5/64 destination-address ff0e::1/64

set protocols pim bsr-candidate interface lo0 address 2001:db8:3::2
set protocols pim rp-candidate interface lo0 address 2001:db8:3::2
set protocols pim bsr-policy acl-2001
set protocols pim register-policy acl-3001
set protocols pim rp-policy acl-3000