set system host-name P1

# MPLS Configuration
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
set protocols mpls interface ge-3/0/0.0

# LDP Configuration
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0
set protocols ldp interface ge-3/0/0.0
set protocols ldp transport-address 1.1.1.1

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/30
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family inet address 10.4.1.2/30
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-3/0/0 unit 0 family inet address 10.2.1.1/30
set interfaces ge-3/0/0 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

# IS-IS Configuration
set protocols isis reference-bandwidth 100g
set protocols isis level 1 disable
set protocols isis level 2 disable
set protocols isis interface ge-1/0/0.0 point-to-point
set protocols isis interface ge-2/0/0.0 point-to-point
set protocols isis interface ge-3/0/0.0 point-to-point
set protocols isis interface lo0.0 passive

# RSVP Configuration
set protocols rsvp interface ge-1/0/0.0
set protocols rsvp interface ge-2/0/0.0
set protocols rsvp interface ge-3/0/0.0
