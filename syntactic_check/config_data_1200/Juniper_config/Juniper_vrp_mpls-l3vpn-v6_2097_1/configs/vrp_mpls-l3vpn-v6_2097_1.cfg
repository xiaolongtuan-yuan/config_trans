set system host-name PE1

# MPLS/LDP Configuration (explicit interfaces)
set protocols mpls interface ge-1/0/0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp router-id 1.1.1.9

# Core-facing Interface
set interfaces ge-1/0/0 unit 0 family inet address 10.10.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 interface ge-2/0/0.0
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target import target:1:1
set routing-instances vpn1 vrf-target export target:1:1

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 1.1.1.9/32

# BGP Configuration (iBGP)
set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address 1.1.1.9
set protocols bgp group IBGP neighbor 2.2.2.9
set protocols bgp group IBGP peer-as 100
set protocols bgp group IBGP family inet-vpn unicast

# BGP Configuration (eBGP)
set protocols bgp group EBGP type external
set protocols bgp group EBGP local-address 1.1.1.9
set protocols bgp group EBGP neighbor 4.4.4.9
set protocols bgp group EBGP peer-as 200
set protocols bgp group EBGP family inet-vpn unicast

# BGP Configuration (IPv6 VPN)
set protocols bgp group VPNV6 type external
set protocols bgp group VPNV6 neighbor 2001:db8:1::1
set protocols bgp group VPNV6 peer-as 65001
set protocols bgp group VPNV6 family inet6-vpn unicast

# OSPF Configuration
set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-1/0/0.0
