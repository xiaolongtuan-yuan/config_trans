set system host-name CGN

# Policy Configuration (Corrected Syntax)
set policy-options policy-statement PS-2001 term 1 from route-filter 10.10.10.0/24 exact
set policy-options policy-statement PS-2001 term 1 then accept

# NAT Pool Configuration (Corrected Syntax)
set security nat source pool nat1 address 10.34.161.101/32 to 10.34.161.105/32
set security nat source pool nat1 port no-translation

# Security Policy Configuration (Corrected Syntax)
set security policies from-zone trust to-zone untrust policy NAT-POLICY match source-address 10.10.10.0/24
set security policies from-zone trust to-zone untrust policy NAT-POLICY match destination-address any
set security policies from-zone trust to-zone untrust policy NAT-POLICY then permit

# Security Zones Configuration
set security zones security-zone trust interfaces ge-2/0/2.0
set security zones security-zone untrust host-inbound-traffic system-services all

# Interface Configuration
set interfaces ge-2/0/2 unit 0 family inet address 192.168.11.2/24