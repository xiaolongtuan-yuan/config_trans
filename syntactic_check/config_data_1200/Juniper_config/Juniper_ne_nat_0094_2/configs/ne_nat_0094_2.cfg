set system host-name CGN

set policy-options policy-statement 2001 term 1 from source-address 10.10.10.0/24
set policy-options policy-statement 2001 then accept

set security nat source pool nat1 address-range low 10.34.161.101
set security nat source pool nat1 address-range high 10.34.161.105
set security nat source pool nat1 address-mapping netmask 255.255.255.0

set security policies from-zone trust to-zone untrust policy p1 match source-address 10.10.10.0/24
set security policies from-zone trust to-zone untrust policy p1 then permit application nat-spp

set security zones security-zone trust interfaces ge-2/0/2.0
set security zones security-zone untrust host-inbound-traffic system-services all

set interfaces ge-2/0/2 unit 0 family inet address 192.168.11.2/24