# 设置主机名
set system host-name CE1

# 配置接口 GigabitEthernet1/0/0
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-1/0/0 unit 0 disable

# 配置接口 Loopback1
set interfaces lo0 unit 1 family inet address 11.11.11.11/32

# 配置BGP
set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 100
set protocols bgp group external-peers neighbor 10.1.1.1
set protocols bgp group external-peers export export-lo
set policy-options policy-statement export-lo term 1 from route-filter 11.11.11.11/32 exact
set policy-options policy-statement export-lo term 1 then accept

# 如果需要关闭同步，只需确保没有配置同步特性。Juniper默认情况下没有同步。