set system host-name DeviceC

# Loopback Interface
set interfaces lo0 unit 0 family inet address 3.3.3.3/32

# NTP Configuration
set system ntp server 1.1.1.1
set system ntp server 2.2.2.2
set system ntp source-address 3.3.3.3
!set system ntp authentication-key 1 value "$ABC123" type md5
set system ntp boot-server 1.1.1.1

# Clock Configuration
!set protocols ptp clock-mode boundary
!set protocols ptp priority1 1
!set protocols ptp clock-quality accuracy 0x20 class 6