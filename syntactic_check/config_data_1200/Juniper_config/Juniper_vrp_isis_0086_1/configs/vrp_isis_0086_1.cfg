set system host-name DeviceB

# BFD Configuration
set protocols bfd traceoptions file bfd.log
set protocols bfd traceoptions flag all

# IS-IS Configuration
set protocols isis level 2 disable
set protocols isis level 1 wide-metrics-only
set protocols isis level 2 wide-metrics-only

# Interface ge-1/0/0 Configuration
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-1/0/0 disable
set protocols isis interface ge-1/0/0.0 point-to-point
set protocols bfd interface ge-1/0/0.0 minimum-interval 50
set protocols bfd interface ge-1/0/0.0 minimum-receive-interval 50
set protocols bfd interface ge-1/0/0.0 multiplier 3
set protocols bfd interface ge-1/0/0.0 neighbor 10.1.1.1

# Interface ge-2/0/0 Configuration
set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-2/0/0 disable
set protocols isis interface ge-2/0/0.0 point-to-point