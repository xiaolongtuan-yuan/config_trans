set system host-name CE1

# LDP Configuration
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0

# Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 10.4.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/1 unit 0 family mpls

# BGP Configuration (External Peers)
set protocols bgp group external-peers type external
set protocols bgp group external-peers local-as 200
set protocols bgp group external-peers neighbor 10.1.1.2 peer-as 100
set protocols bgp group external-peers neighbor 1.1.1.9 peer-as 200
set protocols bgp group external-peers neighbor 1.1.1.9 local-address 2.2.2.9
set protocols bgp group external-peers family inet unicast
set protocols bgp group external-peers export policy1

# BGP Policy (AS Path Prepending)
set policy-options policy-statement policy1 term 1 then as-path-prepend "200 200"

# BGP Configuration (Internal Peers)
set protocols bgp group internal-peers type internal
set protocols bgp group internal-peers neighbor 1.1.1.9
set protocols bgp group internal-peers family inet unicast

# Corrected Policy (MPLS Label Matching)
set policy-options policy-statement policy2 term 1 then metric 10

# OSPF Configuration
set protocols ospf area 0 interface ge-0/0/0.0
set protocols ospf area 0 interface ge-0/0/1.0