set system host-name P

# PIM协议基础配置
set protocols pim

# 修正MPLS配置（原行3-4）
set protocols mpls interface ge-1/0/0
set protocols mpls interface ge-2/0/0

# LDP配置保持不变
set protocols ldp interface all

# 接口ge-1/0/0配置
set interfaces ge-1/0/0 unit 0 family inet address 192.168.1.2/24
set protocols pim interface ge-1/0/0 mode sparse
set protocols ldp interface ge-1/0/0

# 接口ge-2/0/0配置
set interfaces ge-2/0/0 unit 0 family inet address 192.168.2.1/24
set protocols pim interface ge-2/0/0 mode sparse
set protocols ldp interface ge-2/0/0

# Loopback配置
set interfaces lo0 unit 1 family inet address 2.2.2.2/32
set protocols pim interface lo0.1 mode sparse

# OSPF配置保持不变
set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-1/0/0
set protocols ospf area 0 interface ge-2/0/0

# PIM RP配置保持不变
set protocols pim rp static address 2.2.2.2