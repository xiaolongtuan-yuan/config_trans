set system host-name UPE2

# 修正MPLS接口配置（原行3）- 改为明确指定接口
set protocols mpls interface ge-1/0/0
set protocols mpls interface ge-2/0/0

# LDP配置保持不变（合法语法）
set protocols ldp interface all

# 接口配置保持不变
set interfaces ge-1/0/0 unit 0 family inet address 10.5.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces ge-2/0/0 unit 0 family inet address 10.5.2.2/24
set interfaces ge-2/0/0 unit 0 family mpls

# 禁用接口及VLAN配置保持不变
set interfaces ge-3/0/0 unit 0 disable
set interfaces ge-3/0/0 unit 0 family ethernet-switching vlan members 10
set routing-instances VFI1 instance-type virtual-switch
set routing-instances VFI1 interface ge-3/0/0.0

# Loopback配置保持不变
set interfaces lo0 unit 1 family inet address 6.6.6.6/32

# OSPF配置保持不变
set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf area 0.0.0.0 interface ge-1/0/0
set protocols ospf area 0.0.0.0 interface ge-2/0/0