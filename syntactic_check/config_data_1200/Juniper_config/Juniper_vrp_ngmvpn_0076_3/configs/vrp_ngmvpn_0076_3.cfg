set system host-name ASBR2

set protocols ldp interface ge-0/0/1.0
set protocols ldp interface ge-0/0/2.0
set protocols ldp router-id 4.4.4.4

set interfaces ge-0/0/1 unit 0 family inet address 10.1.4.1/24
set interfaces ge-0/0/2 unit 0 family inet address 10.1.3.2/24
set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set protocols isis level 2 disable
set protocols isis level 2 wide-metrics-only
set protocols isis interface ge-0/0/1.0
set protocols isis interface ge-0/0/2.0
set protocols isis interface lo0.0 passive
set protocols mpls interface ge-0/0/1.0
set protocols mpls interface ge-0/0/2.0

set routing-options router-id 4.4.4.4
set policy-options policy-statement policy1 term 1 then next-hop self
set policy-options policy-statement policy1 term 1 then accept
set policy-options policy-statement policy2 term 1 then accept

set protocols bgp group external type external
set protocols bgp group external peer-as 1
set protocols bgp group external neighbor 10.1.3.1
set protocols bgp group external neighbor 10.1.3.1 local-address 4.4.4.4
set protocols bgp group external neighbor 5.5.5.5
set protocols bgp group external neighbor 5.5.5.5 local-address 4.4.4.4
set protocols bgp group external export policy1
set protocols bgp group external export policy2
set protocols bgp group external neighbor 10.1.3.1 family inet unicast
set protocols bgp group external neighbor 5.5.5.5 family inet unicast

set routing-options static route 3.3.3.3/32 next-hop 10.1.3.1