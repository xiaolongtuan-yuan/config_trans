set system host-name PE2

# MPLS Configuration
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-1/0/1.0

# LDP Configuration
set protocols ldp transport-address 2.2.2.2
set protocols ldp router-id 2.2.2.2
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-1/0/1.0
set protocols ldp explicit-null
set protocols ldp export filter-ldp-labels

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 10.1.2.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/1 unit 0 family inet address 10.1.5.1/24
set interfaces ge-1/0/1 unit 0 family mpls
set interfaces ge-1/0/3 unit 1 vlan-id 10
set interfaces ge-1/0/3 unit 1 encapsulation vlan-vpls

# VPLS Configuration
set routing-instances vsi1 interface ge-1/0/3.1
set routing-instances vsi1 route-distinguisher 2:2
set routing-instances vsi1 vrf-target target:2:2

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 2.2.2.2/32

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/1.0

# BGP Configuration
set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 2.2.2.2
set protocols bgp group ibgp neighbor 1.1.1.1 peer-as 100
set protocols bgp group ibgp neighbor 1.1.1.1 cluster 2.2.2.2
set protocols bgp group ibgp family inet-vpn unicast

# Policy Configuration
set policy-options policy-statement filter-ldp-labels term 1 from route-filter 10.1.2.2/32 exact
set policy-options policy-statement filter-ldp-labels term 1 then accept
set policy-options policy-statement filter-ldp-labels term 2 from route-filter 10.1.5.1/32 exact
set policy-options policy-statement filter-ldp-labels term 2 then accept