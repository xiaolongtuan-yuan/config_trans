set system host-name DeviceB

set protocols isis interface ge-1/0/0 point-to-point
set protocols isis level 1 wide-metrics-only
set protocols isis level 1 interface ge-1/0/0
set protocols isis no-ipv6-routing
set protocols isis level 1 circuit-type level-1
set protocols isis iso-address 49.0001.0000.0000.0002.00

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/24
delete interfaces ge-1/0/0 disable

set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/24
delete interfaces ge-2/0/0 disable

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols bgp group internal type internal
set protocols bgp group external type external
set protocols bgp group external neighbor 10.2.1.2 peer-as 65009
set protocols bgp group external export RTC
set protocols bgp local-as 65008
set protocols bgp route-distinguisher-id 1.1.1.1

set policy-options policy-statement RTC term 1 from as-path 1
set policy-options policy-statement RTC term 1 then metric 20
set policy-options as-path 1 "^65009$"

set routing-options static route 10.2.1.0/24