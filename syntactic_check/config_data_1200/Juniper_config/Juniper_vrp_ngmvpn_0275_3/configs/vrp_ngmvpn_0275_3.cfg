set system host-name ABR1

# 接口配置（保持不变）
set interfaces ge-1/0/3 unit 0 family inet address 10.0.7.7/24
set interfaces ge-1/0/4 unit 0 family inet address 10.0.16.1/24
set interfaces lo0 unit 0 family inet address 1.1.1.3/32

# MPLS/LDP配置修正（原行7）
set protocols mpls interface ge-1/0/3
set protocols mpls interface ge-1/0/4
set protocols ldp interface ge-1/0/3
set protocols ldp interface ge-1/0/4
set protocols ldp router-id lo0.0

# ISIS配置修正（原行11,15-17）
set protocols isis interface ge-1/0/3.0 level 2 metric 10
set protocols isis interface ge-1/0/4.0 level 2 metric 10
set protocols isis interface lo0.0 passive

# 静态路由（保持不变）
set routing-options static route 1.1.1.4/32 next-hop 10.0.16.2

# BGP配置修正（原行30,34）
set protocols bgp group external neighbor 10.0.16.2 peer-as 65535
set protocols bgp group internal neighbor 1.1.1.2 peer-as 1
set protocols bgp group internal local-address 1.1.1.3
set protocols bgp group internal family inet unicast
set protocols bgp group internal export policy1

# 修正BGP地址族配置
set protocols bgp group external family inet unicast
set protocols bgp group external family inet-vpn unicast
set protocols bgp group external family inet6-vpn unicast
set protocols bgp group external family inet-mvpn signaling  # 修正mvpn语法

set protocols bgp group internal family inet-vpn unicast
set protocols bgp group internal family inet6-vpn unicast
set protocols bgp group internal family inet-mvpn signaling  # 修正mvpn语法