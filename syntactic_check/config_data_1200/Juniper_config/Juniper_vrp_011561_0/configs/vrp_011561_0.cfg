set system host-name PE1

# EVPN Configuration (Corrected Syntax)
set routing-instances evpn100 protocols evpn encapsulation vxlan
set routing-instances evpn100 route-distinguisher 100:1
set routing-instances evpn100 vrf-target target:1:1

# MPLS/LDP Configuration (Corrected Syntax)
set protocols mpls interface ge-0/0/1.0
set protocols mpls interface ge-0/0/2.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp interface ge-0/0/2.0
set protocols ldp interface lo0.0

# Interface Configurations
set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/2 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/2 unit 0 family mpls
set interfaces ge-0/0/2 unit 0 mtu 1500

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

# BGP Configuration
set protocols bgp group ebgp type external
set protocols bgp group ebgp peer-as 100
set protocols bgp group ebgp neighbor 2.2.2.2
set protocols bgp group ebgp local-address 1.1.1.1
set protocols bgp group ebgp family inet unicast
set protocols bgp group ebgp family evpn signaling

# CFM Configuration (Corrected Syntax)
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 level 5
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 md1
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 mep 1 interface ge-0/0/1.0 direction down
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 mep 1 continuity-check
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 remote-mep 2
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 loss-measurement one-way-delay test-id 3