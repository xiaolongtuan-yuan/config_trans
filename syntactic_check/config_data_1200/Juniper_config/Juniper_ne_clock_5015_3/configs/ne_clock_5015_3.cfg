set system host-name DeviceD

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet
set interfaces ge-2/0/0 unit 0 family inet

# NTP Configuration (Corrected Syntax)
!set system ntp source-address <interface-ip-address>  # 替换为ge-1/0/0接口的实际IP

# Time Zone Configuration (Corrected Syntax)
set system time-zone America/Los_Angeles