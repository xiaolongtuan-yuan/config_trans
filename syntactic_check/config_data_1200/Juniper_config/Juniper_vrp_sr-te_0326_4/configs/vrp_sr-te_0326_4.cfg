# 设置主机名
set system host-name PE2

# 配置VRF实例VPNB
set routing-instances VPNB instance-type vrf
set routing-instances VPNB route-distinguisher 200:1
set routing-instances VPNB vrf-target export target:111:1
set routing-instances VPNB vrf-target import target:111:1

# 设置MPLS LDP
set protocols ldp interface all
set protocols ldp transport-address interface lo0.1

# 设置MPLS标签分配协议为LDP
set protocols mplscp ldp

# 配置ISIS协议
set protocols isis level 2 wide-metrics-only
set protocols isis level 2 interface all
set protocols isis interface lo0.1 passive
set protocols isis level 2 net 10.0000.0000.0005.00

# GigabitEthernet1/0/0接口配置
set interfaces ge-1/0/0 unit 0 family inet address 10.4.1.1/24
set interfaces ge-1/0/0 mtu 1500
set protocols mpls interface ge-1/0/0 

# GigabitEthernet2/0/0接口配置
set interfaces ge-2/0/0 unit 0 family inet address 10.11.1.1/24
set routing-instances VPNB interface ge-2/0/0.0

# 配置Loopback1
set interfaces lo0 unit 1 family inet address 5.5.5.5/32

# 配置BGP
set protocols bgp group internal type internal
set protocols bgp group internal local-address 5.5.5.5
set protocols bgp group internal neighbor 1.1.1.1 peer-as 100

set protocols bgp group internal family inet unicast
set protocols bgp group internal export network-10.4.1.0
set policy-options policy-statement network-10.4.1.0 term 1 from route-filter 10.4.1.0/24 exact
set policy-options policy-statement network-10.4.1.0 term 1 then accept

set protocols bgp group internal family inet-vpn unicast

# 配置静态路由
set routing-instances VPNB routing-options static route 0.0.0.0/0 next-hop 10.11.1.2