set system host-name P1

# MPLS Configuration
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
set protocols mpls interface lo0.1

# IS-IS Configuration
set protocols isis level 2 wide-metrics-only
set protocols isis interface ge-1/0/0.0 point-to-point
set protocols isis interface ge-2/0/0.0 point-to-point
set protocols isis interface lo0.1 passive

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 172.16.1.2/24
set interfaces ge-1/0/0 unit 0 family iso
set interfaces ge-2/0/0 unit 0 family inet address 172.17.1.1/24
set interfaces ge-2/0/0 unit 0 family iso
set interfaces lo0 unit 1 family inet address 2.2.2.9/32
set interfaces lo0 unit 1 family iso