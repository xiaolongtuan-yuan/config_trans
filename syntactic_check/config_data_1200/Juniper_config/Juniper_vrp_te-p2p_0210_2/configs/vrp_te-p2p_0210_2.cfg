set system host-name LSRC

# LDP Configuration
set protocols ldp router-id 3.3.3.9
set protocols ldp interface ge-1/0/1.0
set protocols ldp interface ge-1/0/2.0

# MPLS Configuration
set protocols mpls interface ge-1/0/1.0
set protocols mpls interface ge-1/0/2.0

# Interface Configuration
set interfaces ge-1/0/1 unit 0 family inet address 10.1.2.2/24
set interfaces ge-1/0/1 unit 0 family mpls

set interfaces ge-1/0/2 unit 0 family inet address 10.1.3.2/24
set interfaces ge-1/0/2 unit 0 family mpls

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 3.3.3.9/32

# Static Route Configuration
set routing-options static route 1.1.1.9/32 next-hop lt-0/0/0.10
set routing-options static route 2.2.2.9/32 next-hop lt-0/0/0.20

# Tunnel Configuration
set interfaces lt-0/0/0 unit 10 family inet
set interfaces lt-0/0/0 unit 10 family mpls
set interfaces lt-0/0/0 unit 10 tunnel source 3.3.3.9
set interfaces lt-0/0/0 unit 10 tunnel destination 1.1.1.9

set interfaces lt-0/0/0 unit 20 family inet
set interfaces lt-0/0/0 unit 20 family mpls
set interfaces lt-0/0/0 unit 20 tunnel source 3.3.3.9
set interfaces lt-0/0/0 unit 20 tunnel destination 2.2.2.9

# IS-IS Configuration
set protocols isis interface ge-1/0/1.0 point-to-point
set protocols isis interface ge-1/0/2.0 point-to-point
set protocols isis level 1 disable
set protocols isis level 2 disable
set protocols isis reference-bandwidth 100g
