set system host-name P2

set protocols mpls label-switched-path ldp

set interfaces GigabitEthernet1/0/0 unit 0 family inet address 10.3.1.2/24
set interfaces GigabitEthernet1/0/0 unit 0 family mpls
set protocols mpls interface GigabitEthernet1/0/0
set protocols mpls traffic-engineering
set protocols mpls traffic-engineering auto-bandwidth
set protocols mpls rsvp interface GigabitEthernet1/0/0
set protocols mpls rsvp bandwidth 20m

set interfaces GigabitEthernet2/0/0 unit 0 family inet address 10.4.1.2/24
set protocols mpls interface GigabitEthernet2/0/0
set protocols ldp interface GigabitEthernet2/0/0

set interfaces lo0 unit 1 family inet address 4.4.4.4/32

set interfaces gr-0/0/0 unit 0 tunnel source 4.4.4.4
set interfaces gr-0/0/0 unit 0 tunnel destination 2.2.2.2
set protocols mpls label-switched-path name Tunnel1 to 2.2.2.2
set protocols mpls label-switched-path name Tunnel1 bandwidth 10000
set protocols mpls label-switched-path name Tunnel1 primary Tunnel1
set protocols mpls label-switched-path name Tunnel1 shortcut
set protocols mpls label-switched-path name Tunnel1 metric 1

set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface GigabitEthernet1/0/0.0
set protocols ospf area 0 interface GigabitEthernet2/0/0.0
set protocols ospf traffic-engineering
set protocols mpls traffic-engineering interface lo0.1