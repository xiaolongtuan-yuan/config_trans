set system host-name P2

# MPLS/LDP Configuration
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0

# Interface Configurations
set interfaces ge-1/0/0 unit 0 family inet address 10.3.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family inet address 10.4.1.2/24

# RSVP/TE Configuration
set protocols rsvp interface ge-1/0/0.0 bandwidth 20m
!set protocols mpls traffic-engineering
!set protocols mpls traffic-engineering auto-bandwidth-adjust
!set protocols mpls traffic-engineering auto-bandwidth-adjust interval 300
!set protocols mpls traffic-engineering auto-bandwidth-adjust adjust-threshold 5

# LSP Configuration
!set protocols mpls label-switched-path Tunnel1 to 2.2.2.2
!set protocols mpls label-switched-path Tunnel1 bandwidth 10m
!set protocols mpls label-switched-path Tunnel1 primary primary-path
!set protocols mpls label-switched-path Tunnel1 metric 1
!set protocols mpls path primary-path 2.2.2.2 strict

# GRE Tunnel Configuration
set interfaces gr-0/0/0 unit 0 tunnel source 4.4.4.4
set interfaces gr-0/0/0 unit 0 tunnel destination 2.2.2.2
set interfaces gr-0/0/0 unit 0 family inet

# Loopback and OSPF Configuration
set interfaces lo0 unit 1 family inet address 4.4.4.4/32
set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf traffic-engineering