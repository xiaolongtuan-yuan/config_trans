set system host-name CE2

# 配置trunk端口和VLAN成员
set interfaces ge-1/0/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members 10

# 修正VLAN接口配置（原行6-7）
set interfaces vlan unit 10 vlan-id 10
set interfaces vlan unit 10 family inet address 192.168.1.2/24

# 将VLAN接口绑定到物理接口
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members vlan-10