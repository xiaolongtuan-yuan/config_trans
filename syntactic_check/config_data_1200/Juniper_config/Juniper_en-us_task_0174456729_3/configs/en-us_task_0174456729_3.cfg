system {
    host-name DeviceD;
}

protocols {
    ldp {
        interface ge-1/0/0.0;  # 修改点1：替换华为的"all"为具体接口
        interface ge-2/0/0.0;  # 必须明确列出所有接口
        router-id 4.4.4.9;     # 修改点2：router-id直接配置在LDP下
    }

    isis {
        level 1 disable;       # 修改点3：符合Junos层级语法
        level 2 wide-metrics-only;

        interface ge-1/0/0.0 {  # 修改点4：带逻辑单元号的完整接口名
            point-to-point;
            level 1 disable;
            level 2 metric 100; # 修改点5：metric必须指定level
        }

        interface ge-2/0/0.0 {
            point-to-point;
            level 1 disable;
        }

        interface lo0.1 {
            passive;
            family inet {
!                prefix-sid index 40;  # 修改点6：修正prefix-sid层级
            }
        }

!        net 10.0000.0000.0004.00;

!        traffic-engineering {   # 修改点7：修正TE配置语法
!            igp {
!                router-id 4.4.4.9;
!                level 2;
            }
        }
    }
}

interfaces {
    ge-1/0/0 {
        unit 0 {
            family inet {
                address 10.3.1.2/24;
            }
            family iso;  # 新增：IS-IS必需
            family mpls; # 新增：MPLS必需
        }
    }

    ge-2/0/0 {
        unit 0 {
            family inet {
                address 10.4.1.1/24;
            }
            family iso;
            family mpls;
        }
    }

    lo0 {
        unit 1 {
            family inet {
                address 4.4.4.9/32;
            }
        }
    }
}