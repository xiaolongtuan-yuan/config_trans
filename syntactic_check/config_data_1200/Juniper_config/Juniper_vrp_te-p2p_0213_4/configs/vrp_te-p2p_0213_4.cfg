set system host-name LSRE

# MPLS Configuration
set protocols mpls interface ge-1/0/1.0
set protocols mpls interface ge-1/0/2.0

# LDP Configuration
set protocols ldp interface ge-1/0/1.0
set protocols ldp interface ge-1/0/2.0

# Interface Configuration
set interfaces ge-1/0/1 unit 0 family inet address 10.1.3.2/24
set interfaces ge-1/0/1 unit 0 family mpls

set interfaces ge-1/0/2 unit 0 family inet address 10.1.5.1/24
set interfaces ge-1/0/2 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 5.5.5.5/32

# IS-IS Configuration
set protocols isis reference-bandwidth 100g
set protocols isis level 1 disable
set protocols isis level 2 disable
set protocols isis interface ge-1/0/1.0 point-to-point
set protocols isis interface ge-1/0/2.0 point-to-point
set protocols isis interface lo0.0 passive

# RSVP Configuration
set protocols rsvp interface ge-1/0/1.0
set protocols rsvp interface ge-1/0/2.0