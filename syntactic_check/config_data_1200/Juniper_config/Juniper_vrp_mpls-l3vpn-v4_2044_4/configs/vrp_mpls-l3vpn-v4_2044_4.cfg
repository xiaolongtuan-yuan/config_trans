set system host-name PE2

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 200:2
set routing-instances vpn1 vrf-target target:1:1
# Removed unsupported `vrf-import` and `vrf-export` (use `vrf-import/export` policies if needed)

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
# Removed unsupported `label-switched-path ldp-setup` and `interface all`

set protocols isis interface ge-1/0/0.0 point-to-point
set protocols isis interface lo0.0 passive
set protocols isis level 1 disable
set protocols isis level 2 wide-metrics-only
# Removed redundant `level 2` and `metric 10` (adjust IS-IS metrics elsewhere if needed)

set interfaces ge-1/0/0 unit 0 family inet address 30.1.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family inet address 21.1.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 4.4.4.9/32
# Changed `lo0 unit 1` to `unit 0` (standard practice for loopback)

set protocols bgp group external type external
set protocols bgp group external local-address 4.4.4.9
set protocols bgp group external neighbor 3.3.3.9 peer-as 100
set protocols bgp group external family inet unicast
set protocols bgp group external family inet-vpn unicast

set protocols bgp group vrf-vpn1 type external
set protocols bgp group vrf-vpn1 local-address 21.1.1.1
set protocols bgp group vrf-vpn1 neighbor 21.1.1.2 peer-as 300
set protocols bgp group vrf-vpn1 family inet unicast
# Removed unsupported `import policy policy1` (use `vrf-import` in the VRF instead)
set protocols bgp group vrf-vpn1 advertise-inactive

set policy-options policy-statement policy1 term 1 then accept

set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-2/0/0.0
# Changed `lo0.1` to `lo0.0` for consistency

set routing-options autonomous-system 100