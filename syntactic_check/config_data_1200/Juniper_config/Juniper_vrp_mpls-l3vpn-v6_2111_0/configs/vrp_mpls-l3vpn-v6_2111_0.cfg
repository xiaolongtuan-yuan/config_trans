set system host-name CE3

# BGP Configuration
set protocols bgp group external type external
set protocols bgp group external local-address 2001:db8:1::1
set protocols bgp group external family inet6 unicast
set protocols bgp group external neighbor 2001:db8:1::2
set protocols bgp group external peer-as 200
set protocols bgp group external export redistribute-connected

# Policy Configuration
set policy-options policy-statement redistribute-connected term 1 from protocol direct
set policy-options policy-statement redistribute-connected term 1 then accept

# BGP Parameters
set protocols bgp local-as 65410
