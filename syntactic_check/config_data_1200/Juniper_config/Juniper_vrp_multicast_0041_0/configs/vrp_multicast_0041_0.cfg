set system host-name DeviceA
set routing-options multicast
set firewall family inet filter acl-2000 term 1 from destination-address 232.1.1.0/24
set firewall family inet filter acl-2000 term 1 then accept
set protocols isis level 1-2 wide-metrics-only
set protocols isis interface all
set protocols isis interface ge-0/0/0 point-to-point
set protocols isis interface ge-0/0/1 point-to-point
set protocols isis level 1-2 network-entity 10.0000.0000.0001.00
set interfaces ge-0/0/0 unit 0 family inet address 192.168.2.1/24
set interfaces ge-0/0/0 unit 0 family inet filter input acl-2000
set protocols pim interface ge-0/0/0 mode sparse
set protocols isis interface ge-0/0/0
set interfaces ge-0/0/1 unit 0 family inet address 10.110.1.2/24
set interfaces ge-0/0/1 unit 0 family inet filter input acl-2000
set protocols pim interface ge-0/0/1 mode sparse
set protocols isis interface ge-0/0/1
set protocols pim ssm
set protocols pim ssm range 232.1.1.0/24