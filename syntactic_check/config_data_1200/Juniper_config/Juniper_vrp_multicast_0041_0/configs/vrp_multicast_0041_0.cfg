set system host-name DeviceB

# PIM协议配置
set protocols pim interface all mode sparse
set protocols pim ssm default

# 修正策略配置（原行5）
set policy-options policy-statement MULTICAST-SOURCES term 1 from route-filter 232.1.1.0/24 exact
set policy-options policy-statement MULTICAST-SOURCES then accept
set policy-options prefix-list SSM-RANGE 232.1.1.0/24

# 多播转发配置
set routing-options multicast forwarding-cache

# 接口ge-1/0/0配置修正（原行12）
set interfaces ge-1/0/0 unit 0 family inet address 192.168.2.2/24
set protocols pim interface ge-1/0/0 mode sparse
set interfaces ge-1/0/0 unit 0 family iso
set protocols isis interface ge-1/0/0 point-to-point

# 接口ge-2/0/0配置修正（原行17）
set interfaces ge-2/0/0 unit 0 family inet address 192.168.4.1/24
set protocols pim interface ge-2/0/0 mode sparse
set interfaces ge-2/0/0 unit 0 family iso
set protocols isis interface ge-2/0/0 point-to-point
