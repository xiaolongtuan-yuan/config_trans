set system host-name DeviceA
set interfaces ge-1/0/0 unit 0 family inet address 10.216.1.1/24
set interfaces ge-2/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-3/0/0 unit 0 family inet address 10.1.2.1/24
set interfaces ge-1/0/1 unit 0 family inet address 10.1.3.1/24
set interfaces ge-1/0/2 unit 0 family inet address 10.1.4.1/24
set routing-options router-id 1.1.1.1
set routing-options autonomous-system 65001

set protocols bgp group confederation type internal
set protocols bgp group confederation local-as 65001
set protocols bgp group confederation peer-as 65002
set protocols bgp group confederation peer-as 65003

set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 100
set protocols bgp group external-peers neighbor 10.216.1.2

set protocols bgp group internal-peers type internal
set protocols bgp group internal-peers peer-as 65001
set protocols bgp group internal-peers neighbor 10.1.3.2
set protocols bgp group internal-peers neighbor 10.1.4.2

set protocols bgp group confederation-peers type external
set protocols bgp group confederation-peers peer-as 65002
set protocols bgp group confederation-peers neighbor 10.1.1.2
set protocols bgp group confederation-peers peer-as 65003
set protocols bgp group confederation-peers neighbor 10.1.2.2

set protocols bgp group external-peers family inet unicast
set protocols bgp group external-peers export next-hop-self
set protocols bgp group internal-peers family inet unicast
set protocols bgp group internal-peers export next-hop-self
set protocols bgp group confederation-peers family inet unicast
set protocols bgp group confederation-peers export next-hop-self