set system host-name ASBR1

set protocols ldp interface all
set protocols ldp router-id 2.2.2.9

set interfaces ge-1/0/0 unit 0 family inet address 10.10.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces ge-2/0/0 unit 0 family inet address 10.20.1.1/24

set interfaces lo0 unit 1 family inet address 2.2.2.9/32

set protocols bgp group internal type internal
set protocols bgp group internal local-address 2.2.2.9
set protocols bgp group internal neighbor 1.1.1.9 peer-as 100
set protocols bgp group internal export policy1
set protocols bgp group internal family inet nlri
set protocols bgp group internal family inet-vpn labeled-unicast

set protocols bgp group external type external
set protocols bgp group external neighbor 10.20.1.2 peer-as 200
set protocols bgp group external export policy2
set protocols bgp group external family inet nlri
set protocols bgp group external family inet-vpn labeled-unicast

set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0

set policy-options policy-statement policy1 term 1 from mpls-exp topmost 1
set policy-options policy-statement policy1 term 1 then mpls-exp rewrite 1

set policy-options policy-statement policy2 term 1 then mpls-exp rewrite 1