set system host-name PE1

# CFM Configuration (Corrected Syntax)
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 level 5
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 md1
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 mep 1 interface ge-1/0/1.1 direction down
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 mep 1 remote-mep 2
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 ccm-interval 1s
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 loss-measurement one-way-delay test-id 3

# MPLS/LDP Configuration (Corrected Syntax)
set protocols mpls interface ge-1/0/2.0
set protocols ldp interface ge-1/0/2.0
set protocols ldp interface lo0.0
set protocols ldp router-id 1.1.1.1

# Interface Configurations
set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 unit 1 encapsulation vlan-ccc
set interfaces ge-1/0/1 unit 1 vlan-id 1
set interfaces ge-1/0/1 unit 1 family ccc

set interfaces ge-1/0/2 unit 0 family inet address 192.168.1.2/24
set interfaces ge-1/0/2 unit 0 family mpls

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/2.0

# Cross-connect Configuration (Alternative to xconnect)
set protocols l2circuit neighbor 2.2.2.2 interface ge-1/0/1.1 virtual-circuit-id 1