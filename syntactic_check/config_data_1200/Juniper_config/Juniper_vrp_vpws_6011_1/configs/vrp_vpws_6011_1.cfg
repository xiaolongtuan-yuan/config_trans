set system host-name RSG

# MPLS/LDP 配置修正
set protocols ldp router-id 2.2.2.2
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface lo0.1

# 串行接口配置修正
set interfaces se-2/0/0 unit 0 family ccc  # 基础CCC配置
set interfaces se-2/0/0 unit 1 encapsulation vlan-ccc
set interfaces se-2/0/0 unit 1 family ccc
set interfaces se-2/0/0 unit 2 encapsulation vlan-ccc
set interfaces se-2/0/0 unit 2 family ccc

# L2Circuit 配置修正
set protocols l2circuit neighbor 1.1.1.1 interface se-2/0/0.1 virtual-circuit-id 100
set protocols l2circuit neighbor 1.1.1.1 interface se-2/0/0.2 virtual-circuit-id 200

# 以太网接口配置
set interfaces ge-1/0/0 unit 0 family inet address 10.0.1.2/24
set protocols mpls interface ge-1/0/0.0

# Loopback 配置
set interfaces lo0 unit 1 family inet address 2.2.2.2/32

# GRE 接口配置修正
set protocols mpls interface gr-1/0/0.11

# OSPF 配置
set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf traffic-engineering

# RSVP-TE 配置（替代原TE配置）
set protocols rsvp interface gr-1/0/0.11
