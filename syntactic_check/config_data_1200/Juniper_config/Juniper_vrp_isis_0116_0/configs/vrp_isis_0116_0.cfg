set system host-name DeviceA

# IS-IS Configuration
set protocols isis level 2 wide-metrics-only

# Interface ge-2/0/0 Configuration
set interfaces ge-2/0/0 unit 0 family inet address 10.0.0.1/24
set protocols ldp interface ge-2/0/0.0

# Interface ge-1/0/0 Configuration
set interfaces ge-1/0/0 unit 0 family inet address 172.16.1.1/24
set protocols igmp interface ge-1/0/0.0
set protocols igmp interface ge-1/0/0.0 join-group 224.0.0.1
set protocols ldp interface ge-1/0/0.0

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 1.1.1.1/32
