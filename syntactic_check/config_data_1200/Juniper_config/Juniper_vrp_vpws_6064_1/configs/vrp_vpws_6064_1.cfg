set system host-name PE1

# Loopback 配置（保持不变）
set interfaces lo0 unit 1 family inet address 1.1.1.9/32

# LDP 配置修正
set protocols ldp interface ge-0/0/0.0  # 替换"interface all"
set protocols ldp router-id 1.1.1.9

# iBGP 配置修正
set protocols bgp group ibgp-peers type internal
set protocols bgp group ibgp-peers local-address 1.1.1.9
set protocols bgp group ibgp-peers neighbor 2.2.2.9 peer-as 100
set protocols bgp group ibgp-peers family inet unicast
set protocols bgp group ibgp-peers family inet labeled-unicast  # 修正语法

# eBGP 配置修正
set protocols bgp group ebgp-peers type external
set protocols bgp group ebgp-peers local-address 1.1.1.9
set protocols bgp group ebgp-peers neighbor 4.4.4.9 peer-as 200
set protocols bgp group ebgp-peers import none
set protocols bgp group ebgp-peers export none
set protocols bgp group ebgp-peers family inet-vpn unicast

# 接口配置（保持不变）
set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols mpls interface ge-0/0/0.0

# OSPF 配置（保持不变）
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.1 passive

# L2VPN 配置（保持不变）
set routing-instances vpn1 instance-type l2vpn
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target import target:1:1
set routing-instances vpn1 vrf-target export target:1:1

# 其他接口（保持不变）
set interfaces ge-0/0/1 unit 0 family inet address 192.0.2.1/24