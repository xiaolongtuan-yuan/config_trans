set system host-name DeviceA

# IS-IS Configuration
set protocols isis interface ge-1/0/0.0 point-to-point
set protocols isis interface ge-2/0/0.0 point-to-point
set protocols isis interface ge-3/0/0.0 point-to-point

# Interface Configurations
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 unit 0 family iso
set interfaces ge-1/0/0 disable

set interfaces ge-2/0/0 unit 0 family inet address 10.1.2.1/24
set interfaces ge-2/0/0 unit 0 family iso
set interfaces ge-2/0/0 disable

set interfaces ge-3/0/0 unit 0 family inet address 172.16.1.1/24
set interfaces ge-3/0/0 unit 0 family iso
set interfaces ge-3/0/0 disable

# Routing Options
set routing-options autonomous-system 65000