set system host-name CE1

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls

# Loopback Configuration
set interfaces lo0 unit 1 family inet address 4.4.4.9/32

# BGP Configuration
set protocols bgp group iBGP type internal
set protocols bgp group iBGP local-address 4.4.4.9
set protocols bgp group iBGP neighbor 1.1.1.1
set protocols bgp group iBGP peer-as 100
set protocols bgp group iBGP family inet unicast
set protocols bgp group iBGP family inet6 unicast

# IPv6 Network Advertisement (Alternative)
set policy-options policy-statement ipv6-network term 1 from route-filter 2001:db8:8::/64 exact
set policy-options policy-statement ipv6-network term 1 then accept
set protocols bgp group iBGP export ipv6-network

# Default Route Origination (Alternative)
set policy-options policy-statement default-route term 1 then default-action accept
set protocols bgp group iBGP export default-route

# MPLS Configuration
set protocols mpls interface ge-1/0/0.0

# OSPF Configuration
set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-1/0/0.0

# Router ID Configuration
set routing-options router-id 4.4.4.9