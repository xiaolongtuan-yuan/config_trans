set system host-name NPE

# VPN Configuration (Corrected Syntax)
set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:1
!set routing-instances vpn1 vrf-import vpn1-import
!set routing-instances vpn1 vrf-export vpn1-export
set policy-options community vpn1-import members target:2:2
set policy-options community vpn1-export members target:2:2

# LDP Configuration
set protocols ldp interface all
set protocols ldp router-id 3.3.3.3

# ISIS Configuration (Corrected Syntax)
set protocols isis level 2 disable
set protocols isis level 1 wide-metrics-only
set protocols isis interface all
set protocols isis interface lo0.0
set protocols isis interface ge-0/0/0.0
set protocols isis interface ge-0/0/0.0 level 2 disable
!set protocols isis net 49.0001.0000.0000.0003

# Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 10.2.1.2/24
set protocols mpls interface ge-0/0/0.0
set protocols ldp interface ge-0/0/0.0

set interfaces ge-0/0/1 unit 0 family inet address 192.168.30.1/24
set routing-instances vpn1 interface ge-0/0/1.0

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

# BGP Configuration
set protocols bgp group internal type internal
set protocols bgp group internal local-address 3.3.3.3
set protocols bgp group internal neighbor 2.2.2.2 peer-as 100
set protocols bgp group internal family inet unicast
set protocols bgp group internal family inet-vpn unicast
set protocols bgp group internal family inet-vpn signaling
set protocols bgp group internal family evpn signaling

# Policy Configuration
set policy-options prefix-list default 0.0.0.0/0
set policy-options policy-statement SPE term 10 from prefix-list default
set policy-options policy-statement SPE term 10 then accept
set policy-options policy-statement SPE term 20 then accept