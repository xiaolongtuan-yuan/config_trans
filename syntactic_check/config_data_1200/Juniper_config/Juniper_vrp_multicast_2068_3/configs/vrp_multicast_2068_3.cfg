set system host-name DeviceD

# 基础配置
set routing-options router-id 4.4.4.4

# 接口ge-1/0/0配置修正
set protocols pim interface ge-1/0/0 mode sparse
set interfaces ge-1/0/0 disable

# 接口ge-2/0/0配置修正
set protocols pim interface ge-2/0/0 mode sparse
set interfaces ge-2/0/0 disable

# 接口ge-3/0/0配置修正
set protocols pim interface ge-3/0/0 mode sparse
set interfaces ge-3/0/0 disable

# OSPF3区域配置（保持不变）
set protocols ospf3 area 0.0.0.0 interface ge-1/0/0
set protocols ospf3 area 0.0.0.0 interface ge-2/0/0
set protocols ospf3 area 0.0.0.0 interface ge-3/0/0

# 策略配置（保持不变）
set policy-options policy-statement acl-2000 term 1 from route-filter 2001:db8:5::5/64 exact
set policy-options policy-statement acl-2001 term 1 from route-filter 2001:db8:3::2/64 exact
set policy-options policy-statement acl-3000 term 1 from route-filter 2001:db8:3::2/128 exact
set policy-options policy-statement acl-3000 term 1 then accept
set policy-options policy-statement acl-3000 term 1 from route-filter ff00::8/128 exact
set policy-options policy-statement acl-3001 term 1 from route-filter 2001:db8:5::5/64 exact
set policy-options policy-statement acl-3001 term 1 from route-filter ff0e::1/64 exact

# PIM配置（保持不变）
set protocols pim rp bootstrap-priority 10
set protocols pim rp bootstrap-address 2001:db8:3::2
set protocols pim rp static address 2001:db8:3::2
set protocols pim rp register-policy acl-3001
set protocols pim rp group-policy acl-3000