set system host-name NATA
set system syslog archive size 6m files 10

# NAT Pool Configuration (Corrected Syntax)
set security nat source pool address-groupa address 11.1.1.1/32 to 11.1.1.10/32
set security nat source pool address-groupb address 11.1.1.11/32 to 11.1.1.20/32

# NAT Rule Configuration (Corrected Syntax)
set security nat source rule-set NAT-RULES from zone trust
set security nat source rule-set NAT-RULES to zone untrust

# Static NAT Rules
set security nat source rule-set NAT-RULES rule STATIC-UDP1 match source-address 10.78.1.2/32
set security nat source rule-set NAT-RULES rule STATIC-UDP1 match destination-address 0.0.0.0/0
set security nat source rule-set NAT-RULES rule STATIC-UDP1 then static-nat prefix 11.11.11.2/32

# Pool NAT Rules
set security nat source rule-set NAT-RULES rule POOL-RULE1 match source-address 10.78.1.0/24
set security nat source rule-set NAT-RULES rule POOL-RULE1 then source-nat pool address-groupa

# Interface Configuration
set interfaces ge-0/0/1 unit 0 family inet address 10.78.1.1/24
set security zones security-zone trust interfaces ge-0/0/1.0

set interfaces ge-0/0/0 unit 0 family inet address 10.67.1.1/24
set security zones security-zone trust interfaces ge-0/0/0.0

# Additional Static NAT Rule
set security nat source rule-set NAT-RULES rule STATIC-UDP2 match source-address 10.67.1.2/32
set security nat source rule-set NAT-RULES rule STATIC-UDP2 match destination-address 0.0.0.0/0
set security nat source rule-set NAT-RULES rule STATIC-UDP2 then static-nat prefix 11.11.11.1/32

# Additional Pool NAT Rule
set security nat source rule-set NAT-RULES rule POOL-RULE2 match source-address 10.67.1.0/24
set security nat source rule-set NAT-RULES rule POOL-RULE2 then source-nat pool address-groupb