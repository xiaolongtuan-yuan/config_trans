set system host-name PE3

# VRF Configuration
set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target target:1:1
set routing-instances vpn1 vrf-table-label

# LDP Configuration
set protocols ldp interface lo0.1
set protocols ldp interface ge-0/0/1.0
set protocols ldp transport-address 1.1.1.9

# Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 172.16.1.2/24
set routing-instances vpn1 interface ge-0/0/0.0

set interfaces ge-0/0/1 unit 0 family inet address 40.1.1.1/24
set interfaces ge-0/0/1 unit 0 family mpls

set interfaces lo0 unit 1 family inet address 1.1.1.9/32

# BGP Configuration
set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 1.1.1.9
set protocols bgp group ibgp neighbor 2.2.2.9
set protocols bgp group ibgp peer-as 200
set protocols bgp group ibgp family inet-vpn unicast

set protocols bgp group ebgp type external
set protocols bgp group ebgp local-address 1.1.1.9
set protocols bgp group ebgp neighbor 6.6.6.9
set protocols bgp group ebgp peer-as 300
set protocols bgp group ebgp multihop ttl 10
set protocols bgp group ebgp family inet-vpn unicast

# VPN BGP Configuration
set routing-instances vpn1 protocols bgp group vpn1 type external
set routing-instances vpn1 protocols bgp group vpn1 neighbor 172.16.1.1
set routing-instances vpn1 protocols bgp group vpn1 peer-as 65410
set routing-instances vpn1 protocols bgp group vpn1 import vpn1-import

# Static Route
set routing-instances vpn1 routing-options static route 0.0.0.0/0 next-hop 172.16.1.1

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0

# MPLS Configuration
set protocols mpls interface ge-0/0/1.0
set protocols mpls interface lo0.1