set system services dhcp-local-server group pool1 interface <interface_name>
set access address-assignment pool pool1 family inet network 172.30.0.0/24
set access address-assignment pool pool1 family inet dhcp-attributes router 172.30.0.1
set access address-assignment pool pool1 family inet exclude-address 172.30.0.8

set system authentication-order [ radius password ]
set system radius-server <IP_address> secret <shared_key>

set access profile domain_auth authentication-order radius
set access profile domain_auth client-radius-server <IP_address>
set access profile domain_auth address-assignment pool <pool_name>

set access profile local_auth authentication-order password

set system accounting events interactive
set system authentication-order password
set system login user 172.30.0.8@printer class super-user authentication plain-text-password "%^%#4*RHO=w*}.d\>j09'Z:%=:co~p\w9'G-^|-zR'N4%^%#"

set interfaces ge-1/0/2 unit 0 family ethernet-switching port-mode access
set interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members <VLAN_ID>
set interfaces ge-1/0/2 unit 0 family ethernet-switching voice-vlan <VLAN_ID>

set ethernet-switching-options voip interface ge-1/0/2 vlan <VLAN_ID>

set interfaces ge-1/0/2 unit 0 family ethernet-switching authentication order [ mab dot1x ]
set interfaces ge-1/0/2 unit 0 family ethernet-switching authentication priority [ mab dot1x ]
set interfaces ge-1/0/2 unit 0 family ethernet-switching authentication port-control auto
set interfaces ge-1/0/2 unit 0 family ethernet-switching authentication host-mode multi-auth
set interfaces ge-1/0/2 unit 0 family ethernet-switching mac-authentication dot1x pae
set protocols dot1x authenticator interface ge-1/0/2 reauthentication interval 1800
set protocols dot1x authenticator interface ge-1/0/2 retry 3

set ethernet-switching-options secure-access-port ge-1/0/2 dhcp-trust true
set ethernet-switching-options dhcp-security vlan <VLAN_ID>
set ethernet-switching-options secure-access-port vlan <VLAN_ID> arp-inspection

set ethernet-switching-options secure-access-port interface ge-1/0/2 static-mac 00:e0:fc:12:34:56 vlan <VLAN_ID>