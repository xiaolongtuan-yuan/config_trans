set system host-name PE2

set protocols pim interface all
set protocols pim interface ge-1/0/0.0 mode sparse

set routing-options router-id 2.2.2.2

set routing-instances VPNA instance-type vrf
set routing-instances VPNA interface ge-1/0/0.0
set routing-instances VPNA route-distinguisher 300:1
set routing-instances VPNA vrf-target target:4:4

set interfaces ge-1/0/1 unit 0 family inet address 10.1.4.1/24
set interfaces ge-1/0/1 unit 0 family mpls
set protocols mpls interface ge-1/0/1.0

set interfaces ge-1/0/0 unit 0 family inet address 10.1.3.1/24

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols ldp interface lo0.0
set protocols ldp interface ge-1/0/1.0

set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 2.2.2.2
set protocols bgp group ibgp neighbor 3.3.3.3
set protocols bgp group ibgp peer-as 100
set protocols bgp group ibgp family inet unicast
set protocols bgp group ibgp family inet-vpn unicast
set protocols bgp group ibgp export direct
set protocols bgp group ibgp export static

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/1.0
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0 passive