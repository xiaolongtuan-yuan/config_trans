# Set hostname
set system host-name DeviceD

# Configure interfaces
set interfaces ge-0/0/0 unit 0 family inet6 address 2001:db8:9:1::2/64
set interfaces ge-0/0/1 unit 0 family inet6 address 2001:db8:9:2::2/64

# Configure BGP
set routing-options router-id 4.4.4.4

# BGP Group Configuration
set protocols bgp group internal type internal
set protocols bgp group internal local-address 2001:db8:9:1::2
set protocols bgp group internal family inet6 unicast
set protocols bgp group internal neighbor 2001:db8:9:1::1
set protocols bgp group internal neighbor 2001:db8:9:2::1

# Network statements for BGP
set policy-options policy-statement ipv6-networks term 1 from route-filter 2001:db8:9:1::/64 exact
set policy-options policy-statement ipv6-networks term 1 then accept
set policy-options policy-statement ipv6-networks term 2 from route-filter 2001:db8:9:2::/64 exact
set policy-options policy-statement ipv6-networks term 2 then accept
set protocols bgp group internal export ipv6-networks