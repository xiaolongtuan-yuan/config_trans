set system host-name DeviceD

# Routing Options
set routing-options router-id 4.4.4.4

# BGP Configuration (Corrected Syntax)
set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address 2001:db8:9:1::2
set protocols bgp group IBGP family inet6 unicast
set protocols bgp group IBGP neighbor 2001:db8:9:1::1
set protocols bgp group IBGP neighbor 2001:db8:9:2::1
set protocols bgp group IBGP export ipv6-networks

# BGP Policy Configuration
set policy-options policy-statement ipv6-networks term 1 from route-filter 2001:db8:9:1::/64 exact
set policy-options policy-statement ipv6-networks term 1 then accept
set policy-options policy-statement ipv6-networks term 2 from route-filter 2001:db8:9:2::/64 exact
set policy-options policy-statement ipv6-networks term 2 then accept

# Loopback Interface (Recommended for BGP)
set interfaces lo0 unit 0 family inet address 4.4.4.4/32