system {
    host-name Hub;
}

interfaces {
    ge-1/0/0 {
        unit 0 {
            family inet {
                address 10.1.1.10/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.168.0.1/32;
            }
        }
    }
    gr-1/0/0 {
        unit 0 {
            family inet {
                address 172.16.1.1/24;
            }
            tunnel {
                source 10.1.1.10;
                destination <destination IP address>;
            }
        }
    }
}

security {
    ike {
        policy <IKE-policy-name> {
            mode main;
            proposal-set basic;
        }
        gateway <IKE-gateway-name> {
            external-interface ge-1/0/0.0;
            ike-policy <IKE-policy-name>;
        }
    }
    ipsec {
        policy <IPsec-policy-name> {
            proposal-set basic;
        }
        vpn <IPsec-vpn-name> {
            bind-interface gr-1/0/0.0;
            ike {
                gateway <IKE-gateway-name>;
                ipsec-policy <IPsec-policy-name>;
            }
            establish-tunnels immediately;
        }
    }
}

routing-options {
    router-id 172.16.1.1;
}

protocols {
    ospf {
        area 0.0.0.0 {
            interface gr-1/0/0.0;
            interface lo0.0;
        }
        area 1 {
            interface ge-1/0/0.0;
        }
    }
}