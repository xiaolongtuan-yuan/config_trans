set system host-name PE2

# LDP Configuration
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0
set protocols ldp router-id 4.4.4.4
set protocols ldp preference 9

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 10.30.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family inet address 10.30.1.2/24
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 1 encapsulation vlan-ccc
set interfaces ge-2/0/0 unit 1 vlan-id 10
set interfaces ge-2/0/0 unit 1 family ccc
set interfaces lo0 unit 0 family inet address 4.4.4.4/32

# Routing Options
set routing-options autonomous-system 200

# BGP Configuration
set protocols bgp group external-peers type external
set protocols bgp group external-peers multihop ttl 255
set protocols bgp group external-peers peer-as 100
set protocols bgp group external-peers neighbor 1.1.1.1 local-address 4.4.4.4
set protocols bgp group internal-peers type internal
set protocols bgp group internal-peers local-address 4.4.4.4
set protocols bgp group internal-peers neighbor 3.3.3.3 export next-hop-self

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0

# L2VPN Configuration
set routing-instances l2vpn-instance instance-type l2vpn
set routing-instances l2vpn-instance interface ge-2/0/0.1