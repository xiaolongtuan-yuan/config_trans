set system host-name CE

# VLAN Configuration
set vlans vlan-2 vlan-id 2

# MAC Limiting Configuration
set protocols l2-learning global-mode switching
set protocols l2-learning interface ge-1/0/1 mac-limit 100
set protocols l2-learning interface ge-1/0/1 mac-limit-action forward
set protocols l2-learning interface ge-2/0/1 mac-limit 100
set protocols l2-learning interface ge-2/0/1 mac-limit-action forward

# Interface ge-1/0/1 Configuration
set interfaces ge-1/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members vlan-2

# Interface ge-2/0/1 Configuration
set interfaces ge-2/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-2/0/1 unit 0 family ethernet-switching vlan members vlan-2