set system host-name PE3

# VRF Configuration for VPN1
set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target import target:1:1
set routing-instances vpn1 vrf-target export target:1:1

# MPLS & LDP Configuration
set protocols mpls interface ge-0/0/1.0
set protocols ldp interface lo0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp interface ge-0/0/1.0 hello-interval 5

# Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 172.16.1.2/24

set interfaces ge-0/0/1 unit 0 family inet address 40.1.1.1/24
set interfaces ge-0/0/1 unit 0 family mpls

# BGP Configuration (External Peering)
set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 300
set protocols bgp group external-peers neighbor 6.6.6.9
set protocols bgp group external-peers neighbor 6.6.6.9 local-address 1.1.1.9
set protocols bgp group external-peers neighbor 6.6.6.9 multihop ttl 10
set protocols bgp group external-peers family inet unicast
set protocols bgp group external-peers family inet-vpn unicast

# BGP Policy
set policy-options policy-statement accept-all term 1 then accept

# OSPF Configuration
set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-0/0/1.0

# VRF BGP Configuration
set routing-instances vpn1 protocols bgp group vpn-router peer-as 65410
set routing-instances vpn1 protocols bgp group vpn-router neighbor 172.16.1.1