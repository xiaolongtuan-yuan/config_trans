set system host-name CE2

set protocols pim rp static address 192.168.3.1

set interfaces ge-1/0/2 unit 0 family inet address 192.168.4.1/24
set protocols pim interface ge-1/0/2.0 mode sparse
set protocols igmp interface ge-1/0/2.0 static group 239.0.0.1

set interfaces ge-1/0/1 unit 0 family inet address 192.168.2.2/24
set protocols pim interface ge-1/0/1.0 mode sparse
set protocols igmp interface ge-1/0/1.0 static group 239.0.0.1

set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 200
set protocols bgp group external-peers neighbor 192.168.2.1
set protocols bgp group external-peers neighbor 192.168.2.1 import DIRECT
set protocols bgp group external-peers export advertise-routes

set policy-options policy-statement advertise-routes term 1 from protocol direct
set policy-options policy-statement advertise-routes term 1 then accept

set routing-options static route 192.168.2.0/24 discard