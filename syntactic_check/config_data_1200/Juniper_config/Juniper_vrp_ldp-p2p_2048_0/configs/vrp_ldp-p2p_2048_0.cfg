set system host-name LSRA

# MPLS 配置（保持不变）
set protocols mpls interface pos-1/0/0.0
set protocols mpls interface lo0.1

# LDP 配置修正
set protocols ldp interface pos-1/0/0.0
set protocols ldp transport-address 1.1.1.9  # 替代lo0.1接口指定

# POS 接口配置修正
set interfaces pos-1/0/0 sonet-options payload-scrambler  # 必需指定具体SONET选项
set interfaces pos-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces pos-1/0/0 unit 0 family mpls  # 保持MPLS配置

# Loopback 配置（保持不变）
set interfaces lo0 unit 1 family inet address 1.1.1.9/32

# OSPF 配置修正
set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface pos-1/0/0.0 point-to-point  # 添加point-to-point参数
set routing-options router-id 1.1.1.9