set system host-name DeviceA

set protocols pim rp static address 2.2.2.2

set interfaces ae1 description "e-trunk 1"
set interfaces ae1 unit 0 family inet address 10.0.15.1/24
set protocols pim interface ae1.0 mode sparse

set interfaces ge-0/0/1 enable
set interfaces ge-0/0/1 unit 0 family inet address 10.0.13.1/24
set protocols pim interface ge-0/0/1.0 mode sparse

set interfaces ge-0/0/2 enable
set interfaces ge-0/0/2 ether-options 802.3ad ae1

set interfaces ge-0/0/3 enable
set interfaces ge-0/0/3 unit 0 family inet address 10.0.12.1/24
set protocols pim interface ge-0/0/3.0 mode sparse

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/3.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface ae1.0

set routing-options multicast