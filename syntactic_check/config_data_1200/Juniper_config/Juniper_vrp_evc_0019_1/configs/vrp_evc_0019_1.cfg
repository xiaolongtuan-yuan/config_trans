set system host-name PE2

# Bridge Domain Configuration
set bridge-domains bd10 vlan-id 10

# Interface Configuration
set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 encapsulation flexible-ethernet-services
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members 10
set interfaces ge-1/0/1 unit 0 family ethernet-switching interface-mode trunk

set interfaces ge-1/0/2 flexible-vlan-tagging
set interfaces ge-1/0/2 encapsulation flexible-ethernet-services
set interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members 10
set interfaces ge-1/0/2 unit 0 family ethernet-switching interface-mode trunk

# Bridge Domain Assignment
set bridge-domains bd10 interface ge-1/0/1.0
set bridge-domains bd10 interface ge-1/0/2.0