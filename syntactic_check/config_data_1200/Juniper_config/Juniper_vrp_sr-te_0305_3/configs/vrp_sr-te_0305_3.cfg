set system host-name Controller

# ISIS Configuration
set protocols isis level 1 disable
set protocols isis level 2 wide-metrics-only

# Interface Configuration
set interfaces ge-3/0/0 unit 0 family inet address 10.2.1.2/24
set interfaces ge-3/0/0 unit 0 family iso
set interfaces ge-3/0/0 unit 0 family mpls
set protocols isis interface ge-3/0/0.0 point-to-point
set protocols isis interface ge-3/0/0.0 level 2 metric 10
