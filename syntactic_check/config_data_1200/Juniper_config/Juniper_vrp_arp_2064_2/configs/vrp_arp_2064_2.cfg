set system host-name PE

# VLAN Configuration (Corrected Syntax)
set vlans vlan-2 vlan-id 2
set vlans vlan-3 vlan-id 3
set vlans vlan-4 vlan-id 4
!set vlans vlan-4 isolated-vlan
!set vlans vlan-4 private-vlan primary
!set vlans vlan-4 private-vlan community vlan-2
!set vlans vlan-4 private-vlan community vlan-3

# VLAN Interface Configuration (Corrected Syntax)
set interfaces vlan unit 4 family inet address 10.1.1.12/24
!set interfaces vlan unit 4 family inet proxy-arp

# Trunk Interface Configuration
set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members vlan-2

set interfaces ge-1/0/2 flexible-vlan-tagging
set interfaces ge-1/0/2 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members vlan-3