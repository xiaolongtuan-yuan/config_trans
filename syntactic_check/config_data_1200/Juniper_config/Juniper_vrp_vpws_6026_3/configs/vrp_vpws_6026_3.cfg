set system host-name PE2

# LDP 配置修正
set protocols ldp interface ge-1/0/0.0  # 替换"interface all"
set protocols ldp interface lo0.1
set protocols ldp track-igp-metric  # 修正track-interface语法
set protocols ldp router-id 3.3.3.9

# 接口配置
set interfaces ge-1/0/0 unit 0 family inet address 10.2.2.1/24
set interfaces ge-1/0/0 unit 0 family mpls

# L2VPN 接口配置修正
set interfaces ge-2/0/0 flexible-vlan-tagging
set interfaces ge-2/0/0 unit 0 encapsulation vlan-ccc
set interfaces ge-2/0/0 unit 0 family ccc

# Loopback 配置
set interfaces lo0 unit 1 family inet address 3.3.3.9/32
set interfaces lo0 unit 0 family inet address 10.10.10.10/32

# 桥接域配置修正
set interfaces irb unit 1 family inet address 10.2.2.2/24

# BGP 配置（保持不变）
set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 65001
set protocols bgp group external-peers neighbor 10.10.10.1
set protocols bgp group external-peers export announce-network

# 策略配置（保持不变）
set policy-options policy-statement announce-network term 1 from route-filter 10.2.2.0/24 exact
set policy-options policy-statement announce-network term 1 then accept

# 静态路由（保持不变）
set routing-options static route 0.0.0.0/0 next-hop 10.2.2.2