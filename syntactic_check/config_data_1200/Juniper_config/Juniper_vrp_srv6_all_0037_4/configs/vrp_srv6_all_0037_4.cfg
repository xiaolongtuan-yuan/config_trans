set system host-name DeviceB


# BGP Configuration
set protocols bgp group bgp-v6 type external
set protocols bgp group bgp-v6 local-as 300
set protocols bgp group bgp-v6 peer-as 100
set protocols bgp group bgp-v6 neighbor 2001:db8:22::2
set protocols bgp group bgp-v6 family inet6 unicast

# Global BGP Settings
set routing-options router-id 5.5.5.5
