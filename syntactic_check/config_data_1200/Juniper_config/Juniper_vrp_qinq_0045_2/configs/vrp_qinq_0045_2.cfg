set system host-name PE2

# 基础路由配置
set routing-options router-id 3.3.3.9

# OSPF 配置修正
set protocols ospf area 0.0.0.0 interface lo0.1 passive

# BGP 配置修正
set protocols bgp group IBGP type internal
set protocols bgp group IBGP peer-as 100
set protocols bgp group IBGP local-address 3.3.3.9
set protocols bgp group IBGP neighbor 1.1.1.9
set protocols bgp group IBGP family inet unicast
set protocols bgp group IBGP family inet-vpn unicast

# VPN 配置修正
set routing-instances VPNA instance-type vrf
set routing-instances VPNA interface ge-0/0/0.0
set routing-instances VPNA route-distinguisher 100:2
set routing-instances VPNA vrf-target target:111:1
set routing-instances VPNA vrf-table-label

# PIM 配置
set protocols pim rp static address 3.3.3.9  # 添加RP配置
set protocols pim interface ge-0/0/0.0 mode sparse
set protocols pim interface ge-0/0/1.0 mode sparse
set protocols pim interface lo0.1 mode sparse

# 接口配置修正
set interfaces ge-0/0/0 unit 0 family inet address 10.3.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols ldp interface ge-0/0/0.0  # 替换family inet address ldp

set interfaces ge-0/0/1 unit 0 family inet address 172.17.1.2/24
set interfaces ge-0/0/1 unit 0 family mpls
set protocols ldp interface ge-0/0/1.0  # 替换family inet address ldp

set interfaces lo0 unit 1 family inet address 3.3.3.9/32

# MPLS/LDP 配置修正
set protocols mpls interface ge-0/0/1.0
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp transport-address 3.3.3.9

# 策略配置
set policy-options policy-statement EXPORT-POLICY term 1 then accept