set system host-name SPE1

# MPLS/LDP 基础配置修正
set protocols ldp interface ge-0/0/0.0  # 替换原"interface all"
set protocols ldp interface ge-0/0/1.0
set protocols ldp router-id 1.1.1.9
set protocols mpls interface ge-0/0/1.0

# VPLS 实例配置修正
set routing-instances VPLS-V100 interface ge-0/0/0.0
set routing-instances VPLS-V100 interface ge-0/0/1.0

# 伪线连接配置修正
set routing-instances VPLS-V100 protocols l2vpn neighbor 3.3.3.9 encapsulation-type ethernet
set routing-instances VPLS-V100 protocols l2vpn neighbor 3.3.3.9 pseudowire-status-tlv
set routing-instances VPLS-V100 protocols l2vpn neighbor 4.4.4.9 encapsulation-type ethernet
set routing-instances VPLS-V100 protocols l2vpn neighbor 4.4.4.9 pseudowire-status-tlv

# 接口配置（保持不变）
set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family inet address 10.10.3.1/24
set interfaces ge-0/0/1 unit 0 family mpls
set interfaces lo0 unit 1 family inet address 1.1.1.9/32

# OSPF 配置（保持不变）
set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-0/0/0.0
set protocols ospf area 0 interface ge-0/0/1.0