set system host-name CE2

# 多播转发配置修正
set routing-options multicast
set forwarding-options family inet6 mode sparse

set protocols pim interface ge-1/0/0 mode sparse
set protocols pim join-source ge-1/0/0 group ff3e::1 source 2001:db8:5::2  # 使用小写地址

set protocols pim interface ge-1/0/4 mode sparse

# PIM RP配置（保持不变）
set protocols pim rp static address 2001:db8:6::3