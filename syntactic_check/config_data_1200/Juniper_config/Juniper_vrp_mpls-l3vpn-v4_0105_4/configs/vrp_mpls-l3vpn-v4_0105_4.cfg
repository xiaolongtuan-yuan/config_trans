# 设置主机名
set system host-name CE2

# 配置接口GigabitEthernet1/0/0
set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-1/0/0 disable

# 配置接口GigabitEthernet2/0/0
set interfaces ge-2/0/0 unit 0 family inet address 172.16.2.1/24
set interfaces ge-2/0/0 disable

# 配置BGP
set protocols bgp group to-AS-100 type external
set protocols bgp group to-AS-100 peer-as 100
set protocols bgp group to-AS-100 neighbor 10.2.1.2

# BGP地址族配置
set routing-options autonomous-system 600
set protocols bgp group to-AS-100 family inet unicast
set protocols bgp group to-AS-100 export redistribute-connected
set policy-options policy-statement redistribute-connected term 1 from protocol direct
set policy-options policy-statement redistribute-connected term 1 then accept