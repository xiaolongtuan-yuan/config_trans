# 设置主机名
set system host-name PE1

# 配置MPLS LDP（修正）
set protocols ldp interface ge-1/0/0.0  # 替换"interface all"
set protocols ldp interface lo0.0
set protocols ldp transport-address 192.168.2.2  # 替代loopback-address

# 配置L2VPN（修正）
set protocols l2vpn encapsulation-type mpls  # 替换l2circuit
set protocols l2vpn site PE1 site-identifier 1  # 标准化站点配置

# 配置接口Serial2/0/1和Serial2/0/2（修正）
set interfaces se-2/0/1 encapsulation ppp
set interfaces se-2/0/1 unit 0 family inet
set interfaces se-2/0/2 encapsulation ppp
set interfaces se-2/0/2 unit 0 family inet

# 接口启用配置（Juniper默认启用，移除无效命令）
# 删除原enable配置行

# 配置GigabitEthernet1/0/0（修正）
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set protocols mpls interface ge-1/0/0.0
# 删除重复的family inet配置

# 配置Loopback0（保持不变）
set interfaces lo0 unit 0 family inet address 192.168.2.2/32

# 配置OSPF（保持不变）
set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0

# 伪线配置补充（必需）
set protocols l2circuit neighbor 192.168.3.3 interface se-2/0/1.0 virtual-circuit-id 100
set protocols l2circuit neighbor 192.168.4.4 interface se-2/0/2.0 virtual-circuit-id 200