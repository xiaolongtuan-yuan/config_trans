# 设置主机名
set system host-name PE1

# 配置MPLS LDP
set protocols ldp interface all
set protocols ldp loopback-address 192.168.2.2

# 配置L2VPN
set protocols l2circuit encapsulation-type mpls
set protocols l2circuit site 1to3

# 配置接口Serial2/0/1和Serial2/0/2
set interfaces se-2/0/1:1 encapsulation ppp
set interfaces se-2/0/1:1 unit 0 family inet
set interfaces se-2/0/2:1 encapsulation ppp
set interfaces se-2/0/2:1 unit 0 family inet

# 激活接口Serial2/0/1和Serial2/0/2
set interfaces se-2/0/1:1 enable
set interfaces se-2/0/2:1 enable

# 配置GigabitEthernet1/0/0
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 family inet address 10.1.1.1/24
set protocols mpls interface ge-1/0/0.0

# 激活GigabitEthernet1/0/0
set interfaces ge-1/0/0 unit 0 enable

# 配置Loopback0
set interfaces lo0 unit 0 family inet address 192.168.2.2/32

# 配置OSPF
set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0

# 部署配置
commit