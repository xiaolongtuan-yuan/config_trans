set system host-name DeviceA

# MPLS 配置
set protocols mpls label-switched-path ldp
set protocols mpls interface all

# IS-IS 配置
set protocols isis level 1 wide-metrics-only
set protocols isis level 1 disable
set protocols isis interface ge-1/0/0 level 1
set protocols isis interface ge-1/0/0 point-to-point
set protocols isis interface lo0.1 level 1
set protocols isis interface lo0.1 passive
set protocols isis interface lo0.1 point-to-point
set protocols isis lo0.1 address-family inet unicast
set protocols isis lo0.1 address-family inet unicast prefix-sid index 10
set protocols isis no-advertise-mac
set protocols isis no-advertise-protocol

# 设置 NET
set protocols isis net 49.0001.0000.0000.0000.00

# Segment Routing 配置
set protocols isis sr-mpls
set routing-options dynamic-tunnels segment-routing mpls
set routing-options dynamic-tunnels segment-routing mpls label-range-page 16000 23999

# 接口配置 - GigabitEthernet1/0/0 相当于 ge-1/0/0
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24

# 接口配置 - Loopback1 相当于 lo0.1
set interfaces lo0 unit 1 family inet address 1.1.1.9/32