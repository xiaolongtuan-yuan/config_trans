set system host-name DeviceA

# MPLS配置修正
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface lo0.1

# LDP配置修正
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface lo0.1
set protocols ldp transport-address 1.1.1.9

# IS-IS配置修正
set protocols isis level 1 wide-metrics-only
set protocols isis interface ge-1/0/0.0 point-to-point
set protocols isis interface ge-1/0/0.0 level 1 disable
set protocols isis interface lo0.1 passive
set protocols isis interface lo0.1 point-to-point
set protocols isis interface lo0.1 level 1 disable

# 接口配置
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces lo0 unit 1 family inet address 1.1.1.9/32