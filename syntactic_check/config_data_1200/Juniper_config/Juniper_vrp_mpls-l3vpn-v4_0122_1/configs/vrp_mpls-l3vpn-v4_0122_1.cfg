set system host-name CE2

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces lo0 unit 1 family inet address 22.22.22.22/32

# BGP Configuration
set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 100
set protocols bgp group external-peers neighbor 10.2.1.2
set protocols bgp group external-peers family inet unicast

# Network Advertisement via Policy
set policy-options policy-statement ADVERTISE-LOOPBACK term 1 from protocol direct
set policy-options policy-statement ADVERTISE-LOOPBACK term 1 from route-filter 22.22.22.22/32 exact
set policy-options policy-statement ADVERTISE-LOOPBACK term 1 then accept

set protocols bgp group external-peers export ADVERTISE-LOOPBACK