# 设置设备主机名
set system host-name DeviceA

# 配置访问控制列表
set firewall family inet filter acl-2001 term 1 from source-address 1.1.1.2/32
set firewall family inet filter acl-2001 term 1 then accept
set firewall family inet filter acl-2001 term 2 from source-address 1.1.1.1/32
set firewall family inet filter acl-2001 term 2 then discard

# 配置GigabitEthernet1/0/0接口
set interfaces ge-1/0/0 unit 0 family inet address 1.1.2.1/24

# 配置Loopback0接口
set interfaces lo0 unit 0 family inet address 1.1.3.1/32

# 配置OSPF
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0

# 配置SNMP
set snmp location "Operator at 010-12345678"
set snmp contact "Operator at 010-12345678"
set snmp community nms2-admin authorization read-only
set snmp v3 usm local-engine user nms2-admin authentication-sha "\"%#%##/L&Fd]S.!i*S7<\\jCh2DkfkE4+:<%Wap|8zZWwPL+[a>h$wy>VJsp9(L{%B%#%#\""
set snmp v3 usm local-engine user nms2-admin privacy-aes128-key "\"#%#CM-]HDuhH6VX)**J<186nf({M823f(0Z73++7(A#%,1jODj}D>_HS>W,'Ss=%#%#\""
set snmp v3 target-address 1.1.1.2 user nms2-admin version 3

# 使能SNMP trap主机（与第5行修正对应）
set snmp v3 notify notify1 tag TG1  # 关联trap-group与通知配置
set snmp v3 notify notify1 type trap

# 完成
commit