set system host-name CE4

# BGP Configuration
set routing-options autonomous-system 65420
set protocols bgp group external-peers type external
set protocols bgp group external-peers local-address 2001:db8:2::1
set protocols bgp group external-peers neighbor 2001:db8:2::2
set protocols bgp group external-peers peer-as 300
set protocols bgp group external-peers family inet6 unicast
set protocols bgp group external-peers export announce

# Policy Configuration
set policy-options policy-statement nhs term 1 then next-hop self
set policy-options policy-statement nhs term 1 then accept

set policy-options policy-statement announce term 1 from route-filter 2001:db8:2::/64 orlonger
set policy-options policy-statement announce term 1 then accept