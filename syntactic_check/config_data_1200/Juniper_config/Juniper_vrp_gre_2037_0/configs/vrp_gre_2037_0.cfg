set interfaces vlan unit 10 family inet address 172.16.1.1/24
set interfaces ge-1/0/0 unit 0 family ethernet-switching port-mode access
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members vlan10
set interfaces lo0 unit 1 family inet address 1.1.1.9/32
