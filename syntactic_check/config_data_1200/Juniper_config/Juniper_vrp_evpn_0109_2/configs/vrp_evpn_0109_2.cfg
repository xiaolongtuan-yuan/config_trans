set system host-name ASBR2

# MPLS/LDP Configuration
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
set protocols mpls interface lo0.1
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0
set protocols ldp interface lo0.1
set protocols ldp router-id 3.3.3.9

# IS-IS Configuration
set protocols isis level 2 wide-metrics-only
set protocols isis interface ge-1/0/0.0 point-to-point
set protocols isis interface ge-2/0/0.0 point-to-point

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 10.3.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.2/24
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces lo0 unit 1 family inet address 3.3.3.9/32

# BGP Configuration
set protocols bgp group internal type internal
set protocols bgp group internal local-address 3.3.3.9
set protocols bgp group internal neighbor 4.4.4.9 peer-as 200
set protocols bgp group internal family inet unicast

set protocols bgp group external type external
set protocols bgp group external local-address 3.3.3.9
set protocols bgp group external neighbor 10.2.1.1 peer-as 100

# Route Advertisement
set policy-options policy-statement advertise-loopback term 1 from protocol direct
set policy-options policy-statement advertise-loopback term 1 from route-filter 3.3.3.9/32 exact
set policy-options policy-statement advertise-loopback term 1 then accept
set protocols bgp group internal export advertise-loopback

# EVPN Configuration
set routing-instances EVPN instance-type vrf
set routing-instances EVPN interface ge-1/0/0.0
set routing-instances EVPN interface ge-2/0/0.0
set routing-instances EVPN interface lo0.1