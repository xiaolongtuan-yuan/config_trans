set system host-name CE3

set vlans vlan10 vlan-id 10
set vlans vlan20 vlan-id 20

set protocols isis interface vlan.10 point-to-point
set protocols isis interface vlan.20
set protocols isis interface gr-0/0/2.2 point-to-point
set protocols isis level 1 disable

set interfaces vlan unit 10 family inet address 10.21.1.2/24
set interfaces vlan unit 20 family inet address 10.3.1.1/24
set interfaces ge-0/0/0 unit 0 family ethernet-switching port-mode access
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members vlan10
set interfaces ge-0/0/1 unit 0 family ethernet-switching port-mode access
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members vlan20
set interfaces lo0 unit 1 family inet address 5.5.5.9/32
set interfaces gr-0/0/2 unit 2 tunnel source 5.5.5.9
set interfaces gr-0/0/2 unit 2 tunnel destination 4.4.4.9
set interfaces gr-0/0/2 unit 2 family inet address 2.2.2.1/24

set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface vlan.20