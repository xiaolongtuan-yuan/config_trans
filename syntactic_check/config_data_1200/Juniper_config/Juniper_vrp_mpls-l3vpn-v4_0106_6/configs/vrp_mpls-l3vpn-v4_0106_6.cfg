set system host-name PE4

# VRF Configuration
set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:4
set routing-instances vpn1 vrf-target export target:1:1
set routing-instances vpn1 vrf-target import target:1:1

# MPLS Configuration
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface lo0.0

# IS-IS Configuration
set protocols isis level 2 wide-metrics-only
set protocols isis interface ge-1/0/0.0 point-to-point
set protocols isis interface lo0.0 passive
set protocols isis interface lo0.1 passive

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 10.40.1.2/30
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family inet address 10.4.1.1/30
set routing-instances vpn1 interface ge-2/0/0.0
set interfaces lo0 unit 1 family inet address 4.4.4.4/32

# BGP Configuration
set protocols bgp group ibgp type internal
set protocols bgp group ibgp peer-as 100
set protocols bgp group ibgp neighbor 2.2.2.2
set protocols bgp group ibgp local-address 4.4.4.4
set protocols bgp group ibgp family inet unicast
set protocols bgp group ibgp family inet-vpn unicast

# VPN BGP Configuration
set routing-instances vpn1 protocols bgp group vpn1-group type external
set routing-instances vpn1 protocols bgp group vpn1-group neighbor 10.4.1.2 peer-as 65420