set system host-name CE2

# VRF Configuration
set routing-instances vpnb instance-type vrf
set routing-instances vpnb route-distinguisher 100:2
set routing-instances vpnb vrf-import vpnb-import
set routing-instances vpnb vrf-export vpnb-export
set policy-options community vpnb-import members target:222:2
set policy-options community vpnb-export members target:222:2

# Interface Configuration (Corrected Syntax)
set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.2/24
set routing-instances vpnb interface ge-1/0/0.0

# System Services Configuration
set system services telnet
set system ports console type vt100