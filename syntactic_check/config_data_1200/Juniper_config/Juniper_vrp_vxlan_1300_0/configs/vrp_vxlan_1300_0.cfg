set system host-name Device1

# IS-IS 配置修正
set protocols isis interface ge-1/0/0 point-to-point
set protocols isis interface ge-1/0/1 point-to-point
set protocols isis interface lo0.0 passive

# 接口配置（保持不变）
set interfaces ge-1/0/0 unit 0 family inet address 192.168.3.2/24
set interfaces ge-1/0/0 unit 0 description "Connected to GigabitEthernet1/0/0"
set interfaces ge-1/0/1 unit 0 family inet address 192.168.2.2/24
set interfaces ge-1/0/1 unit 0 description "Connected to GigabitEthernet1/0/1"
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

# BGP 配置修正
set protocols bgp group external-peers local-address 1.1.1.1
set protocols bgp group external-peers neighbor 2.2.2.2 peer-as 100
set protocols bgp group external-peers neighbor 2.2.2.2 description "BGP Neighbor with Route-Reflector attributes"
set protocols bgp group external-peers neighbor 2.2.2.2 family inet-vpn unicast

set protocols bgp group external-peers neighbor 3.3.3.3 peer-as 100
set protocols bgp group external-peers neighbor 3.3.3.3 description "BGP Neighbor with Route-Reflector attributes"
set protocols bgp group external-peers neighbor 3.3.3.3 family inet-vpn unicast

# 路由反射器配置（单独配置）
set protocols bgp group external-peers neighbor 2.2.2.2 cluster 1.1.1.1
set protocols bgp group external-peers neighbor 3.3.3.3 cluster 1.1.1.1

# 全局路由配置（保持不变）
set routing-options autonomous-system 100