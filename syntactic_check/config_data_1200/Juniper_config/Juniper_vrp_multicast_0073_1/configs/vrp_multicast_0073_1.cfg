set system host-name DeviceC
set routing-options multicast

# 接口配置修正
set interfaces ge-1/0/0 unit 0 family inet address 192.168.2.2/24
set protocols pim interface ge-1/0/0 mode sparse

set interfaces ge-2/0/0 unit 0 family inet address 192.168.3.1/24
set protocols pim interface ge-2/0/0 mode sparse

set interfaces ge-3/0/0 unit 0 family inet address 192.168.4.1/24
set protocols pim interface ge-3/0/0 mode sparse

set interfaces lo0 unit 0 family inet address 2.2.2.2/32
set protocols pim interface lo0 mode sparse

# PIM配置
set protocols pim rp static address 2.2.2.2
set protocols pim bsr-candidate interface lo0.0

# OSPF配置
set protocols ospf area 0 interface ge-2/0/0.0
set protocols ospf area 0 interface ge-3/0/0.0
set protocols ospf area 0 interface lo0.0

# BGP配置修正
set protocols bgp group external type external
set protocols bgp group external local-address 2.2.2.2
set protocols bgp group external neighbor 192.168.2.1 peer-as 100
set protocols bgp group external neighbor 192.168.2.1 multihop ttl 255
set protocols bgp group external family inet unicast
# 移除不支持的advertisement-interval 0配置

# MSDP配置
set protocols msdp group group1 peer 192.168.2.1
set protocols msdp group group1 peer 192.168.4.2
set protocols msdp group group1 local-address 2.2.2.2  # 使用loopback地址替代物理接口