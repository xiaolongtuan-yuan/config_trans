set system host-name DeviceB
set security ike policy ike-policy-2 mode main
set security ike policy ike-policy-2 proposals ike-proposal-1
set security ike policy ike-policy-2 pre-shared-key ascii-text "$9$YourKeyHere"
set security ike proposal ike-proposal-1 authentication-method pre-shared-keys
set security ike proposal ike-proposal-1 dh-group group2
set security ike proposal ike-proposal-1 authentication-algorithm sha-256
set security ike proposal ike-proposal-1 encryption-algorithm aes-256-cbc
set security ike gateway ike-gate ike-policy ike-policy-2
set security ike gateway ike-gate address 1.1.1.1
set security ike gateway ike-gate external-interface ge-0/0/1
set security ipsec policy ipsec-policy-2 proposals ipsec-proposal-1
set security ipsec proposal ipsec-proposal-1 protocol esp
set security ipsec proposal ipsec-proposal-1 authentication-algorithm hmac-sha-256-128
set security ipsec proposal ipsec-proposal-1 encryption-algorithm aes-256-cbc
set security ipsec vpn ipsec-vpn bind-interface st0.0
set security ipsec vpn ipsec-vpn ike gateway ike-gate
set security ipsec vpn ipsec-vpn ike ipsec-policy ipsec-policy-2
set interfaces st0 unit 0 family inet6
set routing-options autonomous-system 65001
set protocols ospf3 area 0.0.0.1 interface st0.0
