set system host-name DeviceD
set routing-options multicast

# 修正ISIS配置（原错误行3,5,7-10）
set protocols isis level 2 wide-metrics-only
set protocols isis interface all
set protocols isis interface lo0.0 passive

# 接口ge-2/0/0配置（保持不变）
set interfaces ge-2/0/0 unit 0 family inet address 10.6.1.1/24
set protocols pim interface ge-2/0/0.0 mode sparse
set protocols igmp interface ge-2/0/0.0 version 3
set protocols igmp interface ge-2/0/0.0 join-group 224.0.0.1
set protocols isis interface ge-2/0/0 disable

# 接口ge-3/0/0配置（保持不变）
set interfaces ge-3/0/0 unit 0 family inet address 10.1.1.1/24
set protocols pim interface ge-3/0/0.0 mode sparse
set protocols isis interface ge-3/0/0 disable