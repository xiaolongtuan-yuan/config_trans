set system host-name RouterA

set interfaces ge-3/0/0 unit 0 family inet address 172.16.3.1/24
set interfaces ge-1/0/1 unit 0 family inet address 172.16.2.1/24
set interfaces ge-1/0/3 unit 0 family inet address 172.16.1.1/24

set protocols bgp group BGP-65008 type internal
set protocols bgp group BGP-65008 local-address 1.1.1.1
set protocols bgp group BGP-65008 neighbor 172.16.2.2 peer-as 65008

set protocols bgp group BGP-65008 family inet unicast
set protocols bgp group BGP-65008 neighbor 172.16.2.2 multipath
set policy-options policy-statement direct-import term 1 from protocol direct
set policy-options policy-statement direct-import term 1 then accept
set protocols bgp group BGP-65008 neighbor 172.16.2.2 import direct-import

set routing-options static route 0.0.0.0/0 next-hop 172.16.1.2