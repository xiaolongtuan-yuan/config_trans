set system host-name AP1

set firewall family inet filter VCA_ACL term 1 from source-address 1.1.1.1/32
set firewall family inet filter VCA_ACL term 1 then accept

set firewall family inet filter VCA_ACL_MASTER term 1 from source-address 3.3.3.3/32
set firewall family inet filter VCA_ACL_MASTER term 1 then accept
set firewall family inet filter VCA_ACL_MASTER term 2 from source-address 4.4.4.4/32
set firewall family inet filter VCA_ACL_MASTER term 2 then accept

set interfaces ge-1/0/1 unit 0 family inet address 10.1.2.1/30
set protocols isis interface ge-1/0/1.0 point-to-point
set protocols isis interface ge-1/0/1.0 level 1 metric 10

set interfaces ge-1/0/2 unit 0 family inet address 10.1.3.1/30
set protocols isis interface ge-1/0/2.0 point-to-point
set protocols isis interface ge-1/0/2.0 level 1 metric 10

set interfaces ge-1/0/3 unit 0 family inet address 192.168.0.1/24
deactivate interfaces ge-1/0/3
set protocols isis interface ge-1/0/3.0 point-to-point
set protocols isis interface ge-1/0/3.0 level 1 metric 10

set interfaces lo0 unit 0 family inet address 1.1.1.1/32
set protocols isis interface lo0.0 passive
set protocols isis interface lo0.0 level 1 metric 10

set protocols isis level 1 disable
set protocols isis level 1 wide-metrics-only
