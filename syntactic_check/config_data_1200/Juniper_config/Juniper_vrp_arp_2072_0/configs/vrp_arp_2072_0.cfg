set system host-name PE

# VLAN Configuration
set vlans vlan-10 vlan-id 10

# Bridge Domain Configuration (Corrected Syntax)
!set bridge-domains bridge-10 domain-type bridge
!set bridge-domains bridge-10 vlan-id 10
!set bridge-domains bridge-10 routing-interface irb.10

# IRB Interface Configuration (Corrected Syntax)
set interfaces irb unit 10 family inet address 10.110.10.3/24
!set interfaces irb unit 10 family inet proxy-arp

# Trunk Interface Configuration
set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/1 unit 10 encapsulation vlan-bridge
set interfaces ge-0/0/1 unit 10 vlan-id 10
set interfaces ge-0/0/1 unit 10 family bridge interface-mode trunk

set interfaces ge-0/0/2 flexible-vlan-tagging
set interfaces ge-0/0/2 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/2 unit 10 encapsulation vlan-bridge
set interfaces ge-0/0/2 unit 10 vlan-id 10
set interfaces ge-0/0/2 unit 10 family bridge interface-mode trunk