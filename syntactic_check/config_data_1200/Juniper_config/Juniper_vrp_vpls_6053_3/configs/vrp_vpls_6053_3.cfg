set system host-name ASBR2

# MPLS/LDP 基础配置（保持不变）
set protocols mpls interface ge-2/0/0
set protocols ldp interface ge-2/0/0
set protocols mpls interface ge-1/0/0

# 接口配置（保持不变）
set interfaces ge-2/0/0 unit 0 family inet address 10.30.1.1/24
set interfaces ge-1/0/0 unit 0 family inet address 10.20.1.2/24
set interfaces lo0 unit 1 family inet address 3.3.3.3/32

# iBGP 配置修正
set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 3.3.3.3
set protocols bgp group ibgp neighbor 4.4.4.4 peer-as 200
set protocols bgp group ibgp neighbor 4.4.4.4 family inet labeled-unicast  # 替换原advertise-labels
set policy-options policy-statement policy1 term 1 then accept
set protocols bgp group ibgp export policy1

# eBGP 配置修正
set protocols bgp group ebgp type external
set protocols bgp group ebgp local-address 10.20.1.2
set protocols bgp group ebgp neighbor 10.20.1.1 peer-as 100
set protocols bgp group ebgp neighbor 10.20.1.1 family inet labeled-unicast  # 替换原advertise-labels
set policy-options policy-statement policy2 term 1 then accept
set protocols bgp group ebgp export policy2

# OSPF 配置（保持不变）
set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf area 0.0.0.0 interface ge-2/0/0