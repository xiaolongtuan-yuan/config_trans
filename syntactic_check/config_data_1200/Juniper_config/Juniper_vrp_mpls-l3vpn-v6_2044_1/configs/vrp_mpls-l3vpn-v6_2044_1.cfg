set system host-name PE2

# BFD Configuration (per interface instead of 'all')
set protocols bfd interface ge-1/0/0.0
set protocols bfd interface ge-2/0/0.0

# MPLS & LDP Configuration (explicit interfaces)
set protocols mpls interface ge-1/0/0.0
set protocols ldp interface ge-1/0/0.0

# VRF Configuration
set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:2
set routing-instances vpn1 vrf-target import target:111:1
set routing-instances vpn1 vrf-target export target:111:1

# Core-facing Interface
set interfaces ge-1/0/0 unit 0 family inet address 10.10.1.2/30
set interfaces ge-1/0/0 unit 0 family mpls

# VRF-facing IPv6 Interface
set routing-instances vpn1 interface ge-2/0/0

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 2.2.2.2/32

# BGP Configuration (IPv4)
set protocols bgp group external type external
set protocols bgp group external local-address 2.2.2.2
set protocols bgp group external neighbor 1.1.1.1 peer-as 100
set protocols bgp group external family inet unicast

# BGP Configuration (IPv6 VPN)
set protocols bgp group external family inet6-vpn unicast

# VRF BGP Configuration (IPv6)
set routing-instances vpn1 protocols bgp group vpnv6 type external
set routing-instances vpn1 protocols bgp group vpnv6 neighbor 2001:db8:1::1
set routing-instances vpn1 protocols bgp group vpnv6 peer-as 65410
set routing-instances vpn1 protocols bgp group vpnv6 family inet6 unicast

# OSPF Configuration
set protocols ospf area 0 interface ge-1/0/0.0
set protocols ospf area 0 interface lo0.0
