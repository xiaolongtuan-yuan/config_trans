set system host-name PE2

# VRF Configuration for VPN1
set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target export target:1:1
set routing-instances vpn1 vrf-target import target:1:1

# MPLS & LDP Configuration
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0
set protocols ldp router-id 3.3.3.9

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 10.4.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces ge-2/0/0 unit 0 family inet address 10.3.1.2/24
set interfaces ge-2/0/0 unit 0 family mpls

# IPv6 VRF Interface Configuration
set routing-instances vpn1 interface ge-3/0/0.0

set interfaces lo0 unit 0 family inet address 3.3.3.9/32

# BGP Configuration
set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address 3.3.3.9
set protocols bgp group IBGP neighbor 1.1.1.9
set protocols bgp group IBGP peer-as 100
set protocols bgp group IBGP family inet unicast
set protocols bgp group IBGP family inet-vpn unicast
set protocols bgp group IBGP family inet6-vpn unicast  # Added IPv6 VPN support

# OSPF Configuration
set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-1/0/0.0
set protocols ospf area 0 interface ge-2/0/0.0
set protocols ospf traffic-engineering