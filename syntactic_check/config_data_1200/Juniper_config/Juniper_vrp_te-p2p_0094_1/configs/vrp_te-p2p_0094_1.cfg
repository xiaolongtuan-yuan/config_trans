set system host-name LSRB

# MPLS/LDP Configuration
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0

# ISIS Configuration
set protocols isis level 1 disable
set protocols isis level 2 wide-metrics-only
set protocols isis interface ge-1/0/0.0 point-to-point
set protocols isis interface ge-1/0/0.0 level 2 metric 10
set protocols isis interface ge-2/0/0.0 point-to-point
set protocols isis interface ge-2/0/0.0 level 2 metric 10
set protocols isis traffic-engineering credibility-protocol-preference

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-1/0/0 unit 0 family iso
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 0 bandwidth 100m

set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-2/0/0 unit 0 family iso
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 bandwidth 100m

# Loopback Configuration
set interfaces lo0 unit 1 family inet address 2.2.2.9/32
set interfaces lo0 unit 1 family iso
set protocols isis interface lo0.1 passive

# Routing Options
set routing-options router-id 2.2.2.9
