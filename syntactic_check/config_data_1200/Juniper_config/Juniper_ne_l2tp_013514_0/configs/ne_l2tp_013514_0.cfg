set system host-name DeviceA

# RADIUS Configuration
set system radius-server 10.0.0.249 port 1812 secret "$ABC123"  # 替换为加密后的radius-key
set access profile radius-authentication authentication-order radius

# VLAN Interface Configuration (Corrected Syntax)
set interfaces ge-2/0/0 flexible-vlan-tagging
set interfaces ge-2/0/0 unit 0 family ethernet-switching vlan members 100
set interfaces ge-2/0/0 unit 100 vlan-id 100
set interfaces ge-2/0/0 unit 100 family inet

# VRF Configuration (Corrected Syntax)
set routing-instances vrf1 instance-type vrf
set routing-instances vrf1 interface ge-1/0/1.0
set routing-instances vrf1 route-distinguisher 100:1
!set routing-instances vrf1 vrf-import vrf1-import
!set routing-instances vrf1 vrf-export vrf1-export

# Policy Configuration for VRF
set policy-options community vrf1-import members 100:1
set policy-options community vrf1-export members 100:1

# Loopback and Routing
set interfaces lo0 unit 0 family inet address 1.1.1.1/32
set routing-instances vrf1 routing-options static route 3.3.3.3/32 next-hop 10.0.0.2