set system host-name DeviceA

# Corrected policy statement using proper match conditions
set policy-options policy-statement ACL_2001 term 5 from route-filter 10.1.1.1/32 exact
set policy-options policy-statement ACL_2001 term 5 then accept

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-1/0/0 enable

set interfaces ge-1/0/1 unit 0 family inet address 10.1.2.1/24
set interfaces ge-1/0/1 enable

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/1.0