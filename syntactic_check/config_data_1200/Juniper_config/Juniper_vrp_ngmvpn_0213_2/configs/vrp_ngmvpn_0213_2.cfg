set system host-name CE2

# 多播路由配置
set routing-options multicast  # 修正IPv6多播路由配置

set protocols pim interface ge-1/0/0 mode sparse

set protocols pim interface ge-1/0/1 mode sparse
set protocols pim interface ge-1/0/1 version 6 join-group ff3e::1 source 2001:db8:3::2  # 使用小写地址

# Loopback配置
set interfaces lo0 unit 0 family inet address 4.4.4.4/32

# ISIS配置修正
set protocols isis level 2 wide-metrics-only
set protocols isis interface all
# 修正LSP生存时间配置（原行13）
set protocols isis lsp-lifetime 65535
# 修正metric配置（原行15-16）
set protocols isis interface ge-1/0/0.0 level 2 metric 10
set protocols isis interface ge-1/0/1.0 level 2 metric 10
# 认证配置保持不变
set protocols isis level 2 authentication-type simple
set protocols isis interface lo0.0 passive

# PIM IPv6配置
set protocols pim rp local address 2001:db8:2::2  # 添加RP配置