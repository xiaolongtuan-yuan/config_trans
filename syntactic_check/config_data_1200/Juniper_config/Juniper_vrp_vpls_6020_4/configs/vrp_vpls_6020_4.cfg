set system host-name SPE

# MPLS/LDP Configuration
set protocols mpls interface ge-0/0/0.0
set protocols ldp interface ge-0/0/0.0
set protocols ldp router-id 1.1.1.1

# VPLS Configuration
set routing-instances vsi1 interface ge-0/0/0.0

set routing-instances vsi1 route-distinguisher 1.1.1.1:2
set routing-instances vsi1 vrf-target target:1:2