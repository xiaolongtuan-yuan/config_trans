set system host-name PE1

# VRF and Route Target Configuration
set routing-instances evrf1 instance-type virtual-switch
set routing-instances evrf1 route-distinguisher 1:1
set routing-instances evrf1 vrf-target target:1:1

# VLAN Configuration
set vlans bd100 vlan-id 1

# MPLS/LDP Configuration
set protocols mpls interface ge-2/0/0.0
set protocols mpls interface lo0.1
set protocols ldp interface ge-2/0/0.0
set protocols ldp interface lo0.1

# Interface Configuration
set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 encapsulation flexible-ethernet-services
set interfaces ge-1/0/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members bd100

set interfaces ge-2/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces lo0 unit 1 family inet address 1.1.1.1/32

# BGP Configuration
set protocols bgp group external type external
set protocols bgp group external local-address 1.1.1.1
set protocols bgp group external neighbor 3.3.3.3 peer-as 100
set protocols bgp group external family inet unicast

# OSPF Configuration
set protocols ospf area 0 interface lo0.1 passive
set protocols ospf area 0 interface ge-2/0/0.0

# EVPN Configuration
set protocols evpn encapsulation vxlan
set protocols evpn extended-vni-list all