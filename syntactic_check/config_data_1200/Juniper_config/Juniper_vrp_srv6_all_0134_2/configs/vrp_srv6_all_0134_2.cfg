set system host-name P

# Global Routing Options
set routing-options router-id 2.2.2.2

# Interface Configurations
set interfaces lo0 unit 1 family inet address 2.2.2.2/32

# OSPFv3 Configuration
set protocols ospf3 area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf3 area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf3 area 0.0.0.0 interface lo0.1 passive
