set system host-name Server1

set protocols ptp mode boundary
set protocols ptp domain 45
set protocols ptp clock-class 248
set protocols ptp priority1 128
set protocols ptp priority2 128
set protocols ptp unicast-negotiation
set class-of-service forwarding-class FC1 dscp 60

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set interfaces ge-1/0/0 unit 0 family ethernet-switching
set protocols ptp interface ge-1/0/0