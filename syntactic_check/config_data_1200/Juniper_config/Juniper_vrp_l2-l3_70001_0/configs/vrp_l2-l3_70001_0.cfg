set system host-name UPE

# Loopback Configuration
set interfaces lo0 unit 1 family inet address 1.1.1.9/32

# Interface ge-0/0/0 Configuration (L2 Switching)
set interfaces ge-0/0/0 disable
set interfaces ge-0/0/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members 10
set interfaces ge-0/0/0 unit 10 vlan-id 10
set interfaces ge-0/0/0 unit 10 encapsulation vlan-ccc
set interfaces ge-0/0/0 unit 10 family mpls

# Interface ge-0/0/1 Configuration (L3 Routing)
set interfaces ge-0/0/1 disable
set interfaces ge-0/0/1 unit 0 family inet address 10.2.1.1/24
set interfaces ge-0/0/1 unit 0 family mpls

# MPLS Configuration
set protocols mpls interface ge-0/0/0.10
set protocols mpls interface ge-0/0/1.0

# LDP Configuration
set protocols ldp interface ge-0/0/1.0
set protocols ldp interface lo0.1
set protocols ldp neighbor 3.3.3.9

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0