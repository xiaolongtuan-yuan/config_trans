set system host-name LSRA

# MPLS/LDP Configuration (explicit interfaces)
set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp transport-address interface lo0.0
set protocols ldp session-protection
set protocols ldp hold-time 10
set protocols ldp hello-interval 5

# Targeted LDP Configuration
set protocols ldp targeted-session 192.0.2.1  # Example peer address
set protocols ldp targeted-session hold-time 10
set protocols ldp targeted-session hello-interval 5
set protocols ldp targeted-session accept
set protocols ldp targeted-session local-address lo0.0

# VRF Configuration Template (for each VRF)
set routing-instances vrf1 protocols ldp interface ge-0/0/0.0
set routing-instances vrf1 protocols ldp targeted-session 192.0.2.2  # Example VRF peer
set routing-instances vrf1 protocols ldp targeted-session hold-time 10
set routing-instances vrf1 protocols ldp targeted-session hello-interval 5