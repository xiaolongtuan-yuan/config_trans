set system host-name DeviceB

set interfaces ge-1/0/0 unit 0 family inet address 192.168.2.1/24

set protocols bgp group external-peers type external
set protocols bgp group external-peers local-address 192.168.2.1
set protocols bgp group external-peers peer-as 100
set protocols bgp group external-peers neighbor 192.168.2.2

set routing-options router-id 5.5.5.5