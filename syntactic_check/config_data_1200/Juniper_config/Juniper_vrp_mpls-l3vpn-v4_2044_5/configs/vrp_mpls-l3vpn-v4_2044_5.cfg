# 设置主机名
set system host-name CE2

# 配置接口GigabitEthernet1/0/0
set interfaces ge-1/0/0 unit 0 family inet address 21.1.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls

# 配置接口GigabitEthernet2/0/0
set interfaces ge-2/0/0 unit 0 family inet address 20.1.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls

# 配置环回接口Loopback0（标准Junos实践）
set interfaces lo0 unit 0 family inet address 5.5.5.9/32

# 配置OSPF路由协议
set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-2/0/0.0
set protocols ospf area 0 interface ge-1/0/0.0
# 移除不支持的 `export bgp-to-ospf`（需单独定义策略）

# 配置BGP路由协议
set protocols bgp group to-AS300 type external
set protocols bgp group to-AS300 neighbor 21.1.1.1 peer-as 300
set protocols bgp group to-AS300 local-address 21.1.1.2
# 修正策略语法（移除不支持的 `mpls-topmost`）
set policy-options policy-statement policy1 term 1 then accept
set protocols bgp group to-AS300 export policy1

# 配置MPLS LDP
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0
# 移除不支持的 `router-id 5.5.5.9`（LDP默认使用loopback地址）

# 移除不支持的RSVP-TE配置（CE设备通常不参与MPLS TE）
# 移除不支持的 `set forwarding-options mpls-forwarding`