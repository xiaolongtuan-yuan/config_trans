set system host-name DeviceD

# PIM协议配置（保持不变）
set protocols pim interface all
set protocols pim ssm-map enable
set protocols pim ssm-map address 232.1.1.0/24 source 10.10.1.1
set protocols pim ssm-map address 232.1.1.0/24 source 10.10.3.1

# 策略配置（保持不变）
set policy-options policy-statement MULTICAST-FILTER term 1 from route-filter 232.1.1.0/24 exact
set policy-options policy-statement MULTICAST-FILTER term 1 then accept

# 多播SSM组配置（保持不变）
set routing-options multicast ssm-groups 232.1.1.0/24

# ISIS配置修正
set protocols isis level 1 disable
set protocols isis interface ge-1/0/0 point-to-point
set protocols isis interface ge-2/0/0 point-to-point
set protocols isis interface ge-3/0/0 point-to-point

# 接口配置修正（原行20,23,26）
set interfaces ge-1/0/0 unit 0 family inet address 10.10.4.2/24
set protocols pim interface ge-1/0/0 mode sparse

set interfaces ge-2/0/0 unit 0 family inet address 192.168.3.2/24
set protocols pim interface ge-2/0/0 mode sparse

set interfaces ge-3/0/0 unit 0 family inet address 192.168.4.1/24
set protocols pim interface ge-3/0/0 mode sparse