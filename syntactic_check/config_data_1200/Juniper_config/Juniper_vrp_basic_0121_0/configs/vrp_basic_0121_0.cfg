# 通过防火墙实现SSH源地址限制
set firewall family inet filter SSH-ACCESS term ALLOW-SSH from source-address 10.1.1.1/32
set firewall family inet filter SSH-ACCESS term ALLOW-SSH from protocol tcp
set firewall family inet filter SSH-ACCESS term ALLOW-SSH from port ssh
set firewall family inet filter SSH-ACCESS term ALLOW-SSH then accept
set firewall family inet filter SSH-ACCESS term DENY-ALL then discard
set interfaces lo0 unit 0 family inet filter input SSH-ACCESS

# 建议的SSH安全增强
set system services ssh connection-limit 5
set system services ssh rate-limit 5
set system services ssh no-passwords
set system services ssh ciphers aes128-ctr