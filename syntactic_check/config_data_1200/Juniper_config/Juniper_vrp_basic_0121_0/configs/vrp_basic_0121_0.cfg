# Juniper Configuration
set system host-name SSH_Server
set system services ssh-key rsa modulus 2048
set interfaces lo0 unit 0 family inet address 10.1.1.1/32
set system services ssh protocol-version v2
set system services ssh source-address 10.1.1.1
set system login user client001 uid 1001
set system login user client001 class super-user
set system login user client002 uid 1002
set system login user client002 class super-user
set system login authentication order [local]
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/16