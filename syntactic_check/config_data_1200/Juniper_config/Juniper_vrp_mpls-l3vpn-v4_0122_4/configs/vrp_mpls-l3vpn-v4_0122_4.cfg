set system host-name MCE

# VRF configurations
set routing-instances vpna instance-type vrf
set routing-instances vpna route-distinguisher 100:1
set routing-instances vpna vrf-import vpna-import
set routing-instances vpna vrf-export vpna-export

set routing-instances vpnb instance-type vrf
set routing-instances vpnb route-distinguisher 200:2
set routing-instances vpnb vrf-import vpnb-import
set routing-instances vpnb vrf-export vpnb-export

# Interface configurations
set interfaces ge-1/0/0 unit 0 family inet address 10.5.1.2/24
set routing-instances vpna interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 0 family inet address 10.5.2.2/24
set routing-instances vpnb interface ge-2/0/0.0

set interfaces ge-3/0/0 unit 0 family inet address 10.3.1.2/24
set routing-instances vpna interface ge-3/0/0.0

set interfaces ge-4/0/0 unit 0 family inet address 10.4.1.2/24
set routing-instances vpnb interface ge-4/0/0.0

# OSPF configurations for vpna
set routing-instances vpna protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set routing-instances vpna protocols ospf area 0.0.0.0 interface ge-3/0/0.0
set routing-instances vpna protocols ospf export redis-rip

# OSPF configurations for vpnb
set routing-instances vpnb protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set routing-instances vpnb protocols ospf area 0.0.0.0 interface ge-4/0/0.0
set routing-instances vpnb protocols ospf export redis-rip

# Policies for redistribution
set policy-options policy-statement redis-ospf term 1 from protocol ospf
set policy-options policy-statement redis-ospf term 1 then accept

set policy-options policy-statement redis-rip term 1 then accept

# VRF import/export policies
set policy-options policy-statement vpna-import term 1 from community vpna-comm
set policy-options policy-statement vpna-import term 1 then accept
set policy-options policy-statement vpna-export term 1 then community add vpna-comm
set policy-options policy-statement vpna-export term 1 then accept

set policy-options policy-statement vpnb-import term 1 from community vpnb-comm
set policy-options policy-statement vpnb-import term 1 then accept
set policy-options policy-statement vpnb-export term 1 then community add vpnb-comm
set policy-options policy-statement vpnb-export term 1 then accept

set policy-options community vpna-comm members target:100:1
set policy-options community vpnb-comm members target:200:2