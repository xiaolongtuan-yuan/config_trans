set system host-name P

set protocols mpls label-switched-path LSP1 label-operation ldp

set interfaces ge-1/0/0 unit 0 family inet address 10.10.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces ge-2/0/0 unit 0 family inet address 10.11.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls

set interfaces lo0 unit 1 family inet address 2.2.2.9/32

set protocols isis interface all
set protocols isis level 1
set protocols isis level 1 traffic-engineering
set protocols isis metric-style wide
set protocols isis traffic-engineering router-id lo0.1

set protocols mpls traffic-engineering
set protocols mpls traffic-engineering auto-bandwidth
set protocols mpls traffic-engineering auto-bandwidth minimum-bandwidth 400000
set protocols mpls traffic-engineering lsp-refresh-interval 300
set protocols mpls traffic-engineering record-route
set protocols mpls traffic-engineering rsvp
set protocols mpls traffic-engineering auto-bw-interval 60
set protocols mpls traffic-engineering logging bandwidth-change
set protocols mpls traffic-engineering logging status-change
set protocols mpls traffic-engineering logging path-errors
set protocols mpls traffic-engineering logging reoptimize-events
set protocols mpls traffic-engineering logging test-events

# Manual definition of explicit path-options and segment-routing in Juniper is not directly available like in Cisco.
# You would typically configure different explicit paths and then associate them with RSVP-TE LSPs.

# If explicit path-options mapping was required it would be done with static routes or former Junos OLIP configurations

# Note that the output has been simplified; real implementations would involve more detailed configurations per path.
set protocols mpls label-switched-path to R1-R2 segment-routing
set protocols mpls label-switched-path to R2-R1 segment-routing
# Repeat this for each defined path option as necessary