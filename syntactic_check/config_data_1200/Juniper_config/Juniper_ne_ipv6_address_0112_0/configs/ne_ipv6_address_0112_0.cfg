set system host-name Device
set system authentication-order radius
set system radius-server 10.6.55.55 port 1550 secret "$ABC123"  # 替换为实际加密后的密钥

# IPv6 Routing Configuration
set routing-options rib inet6.0 static route 2001:DB8::/62 discard

# IPv6 Address Pools
set access address-assignment pool pool1 family inet6 prefix 2001:DB8::/64
set access address-assignment pool pool2 family inet6 prefix 2001:DB8::/62

# DHCPv6 Configuration (Corrected Syntax)
set system services dhcp-local-server dhcpv6 group dhcpv6-group dns-server 2001:DB8::2:2

# Interface Configuration (Corrected Syntax)
set interfaces ge-1/0/1 unit 1 encapsulation vlan-ccc
set interfaces ge-1/0/1 unit 1 vlan-id 1
