set system host-name DeviceA
set system domain-name isp1

# RADIUS Configuration
set access profile radius-auth-profile accounting-order radius
set access profile radius-auth-profile authentication-order radius
set access radius-server 10.20.20.1 secret "$ABC123"  # 替换为实际加密密钥
set access radius-server 10.20.20.1 accounting-port 1813
set access radius-server 10.20.20.1 authentication-port 1812

# VLAN and PPPoE Configuration (Corrected Syntax)
set interfaces ge-2/0/0 flexible-vlan-tagging
set interfaces ge-2/0/0 encapsulation flexible-ethernet-services
set interfaces ge-2/0/0 unit 100 encapsulation vlan-ccc
set interfaces ge-2/0/0 unit 100 vlan-id 100

# Routing Policies
set policy-options policy-statement POLICY-IN term 1 then accept
set policy-options policy-statement POLICY-OUT term 1 then accept

# Interface Configuration
set interfaces lo0 unit 0 family inet address 1.1.1.1/32
set interfaces ge-1/0/1 unit 0 family inet address 11.11.11.1/24
set interfaces ge-1/0/2 unit 0 family inet address 12.12.12.1/24

# Static Routing
set routing-options static route 3.3.3.3/32 next-hop 11.11.11.2
set routing-options static route 4.4.4.4/32 next-hop 12.12.12.2

# L2TP Configuration
set services l2tp version 2
set access profile l2tp-profile authentication-order radius
set services l2tp tunnel authentication-profile l2tp-profile
set services l2tp tunnel password "$XYZ456"  # 替换为实际隧道密码