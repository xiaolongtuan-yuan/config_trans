set system host-name DeviceC

# PIM协议配置（保持不变）
set protocols pim ssm-groups 232.1.1.0/24
set protocols pim interface all mode sparse
set protocols pim ssm-translate rule-1 from 232.1.1.0/24

# 接口ge-1/0/0配置（保持不变）
set interfaces ge-1/0/0 unit 0 family inet address 192.168.4.2/24
set protocols pim interface ge-1/0/0 mode sparse
set protocols isis interface ge-1/0/0 point-to-point

# 接口ge-2/0/0配置（保持不变）
set interfaces ge-2/0/0 unit 0 family inet address 10.110.2.1/24
set protocols pim interface ge-2/0/0 mode sparse
set protocols pim interface ge-2/0/0 version 3
set protocols pim interface ge-2/0/0 join-232.1.1.0
set protocols isis interface ge-2/0/0 point-to-point