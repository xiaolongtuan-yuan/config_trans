! 设置主机名
set system host-name RR

! 配置MPLS使用LDP协议 - 修改第5行
! 原错误命令: set protocols mpls label-switched-path ldp-tunnel
! 修改为:
set protocols mpls interface ge-2/0/0
set protocols mpls interface ge-1/0/0
set protocols mpls interface ge-3/0/0
set protocols ldp interface ge-2/0/0
set protocols ldp interface ge-1/0/0
set protocols ldp interface ge-3/0/0

! 配置接口（保持不变）
set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.2/24
set protocols mpls interface ge-2/0/0
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/24
set protocols mpls interface ge-1/0/0
set interfaces ge-3/0/0 unit 0 family inet address 10.3.1.1/24
set protocols mpls interface ge-3/0/0
set interfaces lo0 unit 1 family inet address 3.3.3.3/32

! 配置BGP（修改第20行）
! 原错误命令: set protocols bgp group external export update-source lo0.1
! 修改为:
set protocols bgp group external type external
set protocols bgp group external peer-as 100
set protocols bgp group external neighbor 1.1.1.1
set protocols bgp group external neighbor 2.2.2.2
set protocols bgp group external neighbor 4.4.4.4

! 配置BGP地址族（保持不变）
set protocols bgp group external family inet unicast
set protocols bgp group external family evpn signaling

! 配置BGP为路由反射器（修改第30-32行）
! 原错误命令: 
! set protocols bgp group external neighbor X.X.X.X route-reflector-client
! 修改为:
set protocols bgp group ibgp type internal
set protocols bgp group ibgp family evpn signaling
set protocols bgp group ibgp cluster 3.3.3.3
set protocols bgp group ibgp neighbor 1.1.1.1
set protocols bgp group ibgp neighbor 2.2.2.2
set protocols bgp group ibgp neighbor 4.4.4.4

! 配置OSPF（保持不变）
set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0
set protocols ospf area 0.0.0.0 interface ge-2/0/0
set protocols ospf area 0.0.0.0 interface ge-3/0/0