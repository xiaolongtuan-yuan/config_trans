set system host-name DeviceC

# Interface Configurations
set interfaces ge-1/0/0 unit 0 family inet address 1.1.1.2/24
set interfaces ge-2/0/0 unit 0 family inet address 2.2.2.1/24

# IS-IS Configuration
set protocols isis level 2 disable
set protocols isis interface ge-1/0/0.0 level 2 disable
set protocols isis interface ge-2/0/0.0 level 2 disable
set protocols isis interface ge-1/0/0.0 bfd-liveness-detection minimum-interval 3000
set protocols isis interface ge-1/0/0.0 bfd-liveness-detection multiplier 3
set protocols isis interface ge-2/0/0.0 bfd-liveness-detection minimum-interval 3000
set protocols isis interface ge-2/0/0.0 bfd-liveness-detection multiplier 3
set protocols isis level 2 wide-metrics-only
set protocols isis interface ge-1/0/0.0 passive
set protocols isis interface ge-2/0/0.0 passive
