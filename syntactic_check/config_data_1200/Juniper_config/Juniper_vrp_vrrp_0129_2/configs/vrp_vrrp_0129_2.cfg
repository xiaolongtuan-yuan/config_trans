# 设置主机名
set system host-name PE1

# MPLS/LDP 配置修正
set protocols mpls interface ge-0/0/3.0
set protocols ldp interface ge-0/0/2.0   # 替换"interface all"
set protocols ldp interface ge-0/0/3.0
set protocols ldp transport-address 3.3.3.3  # 替换interface指定方式

# Loopback 配置（保持不变）
set interfaces lo0 unit 0 family inet address 3.3.3.3/32

# 接口配置
set interfaces ge-0/0/2 unit 0 family inet address 172.16.34.3/24
set interfaces ge-0/0/2 unit 0 family mpls

# 以太网接口配置
set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 unit 0 family ethernet-switching
set interfaces ge-0/0/1 unit 1 vlan-id 10
set interfaces ge-0/0/1 unit 1 family ethernet-switching

# 另一接口配置
set interfaces ge-0/0/3 unit 0 family inet address 172.16.35.3/24
set interfaces ge-0/0/3 unit 0 family mpls

# OSPF 配置修正
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0
set protocols ospf area 0.0.0.0 interface ge-0/0/3.0

# L2VPN 配置修正
set routing-instances VPLS-LDP1 interface ge-0/0/1.1
set routing-instances VPLS-LDP1 protocols l2vpn encapsulation-type ethernet