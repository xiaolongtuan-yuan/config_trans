set system host-name Spoke-CE1

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 100.1.1.1/24
set interfaces ge-1/0/0 enable
set interfaces lo0 unit 1 family inet address 11.11.11.11/32

# Autonomous System
set routing-options autonomous-system 65410

# BGP Configuration
set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 100
set protocols bgp group external-peers neighbor 100.1.1.2
set protocols bgp group external-peers family inet unicast
set protocols bgp group external-peers export EXPORT-LOOPBACK

# Routing Policy
set policy-options policy-statement EXPORT-LOOPBACK term 1 from route-filter 11.11.11.11/32 exact
set policy-options policy-statement EXPORT-LOOPBACK term 1 then accept