set system host-name DeviceA


# Routing Options
set routing-options router-id 1.1.1.1
set routing-options autonomous-system 65009

# BGP Configuration (Corrected Syntax)
set protocols bgp group external type external
set protocols bgp group external peer-as 65009
set protocols bgp group external neighbor 2001:db8:10::1
set protocols bgp group external family inet6 unicast

# Routing Policy (Corrected Syntax)
set policy-options policy-statement export-v6 term 1 from route-filter 2001:db8:8::/64 exact
set policy-options policy-statement export-v6 term 1 then accept
set policy-options policy-statement export-v6 term 2 from route-filter 2001:db8:10::/64 exact
set policy-options policy-statement export-v6 term 2 then accept