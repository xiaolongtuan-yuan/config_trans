set system host-name PE2

# 修正IS-IS配置
set protocols isis level 1 wide-metrics-only
set protocols isis level 2 wide-metrics-only
set protocols isis interface ae1.0
set protocols isis interface ae1.0 level 1 disable
set protocols isis interface ae1.0 level 2 disable

# 接口配置
set interfaces ae1 unit 0 family inet address 10.1.1.2/24
set interfaces ae1 unit 0 family iso
set interfaces ge-0/0/0 gigether-options 802.3ad ae1
set interfaces ge-0/0/1 gigether-options 802.3ad ae1

# 移除物理接口的IS-IS配置（因为已加入LAG）
delete protocols isis interface ge-0/0/0.0
delete protocols isis interface ge-0/0/1.0