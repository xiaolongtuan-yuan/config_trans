set system host-name DeviceA

# MPLS/LDP Configuration
set protocols mpls interface ge-0/0/0.0
set protocols ldp interface ge-0/0/0.0
set protocols ldp transport-address 1.1.1.9

# Static Route with ECMP
set routing-options static route 160.20.0.0/32 next-hop 160.50.0.0
set routing-options static route 160.20.0.0/32 next-hop 160.60.0.0

# ISIS Configuration for Segment Routing
set protocols isis level 1 disable
set protocols isis level 2 wide-metrics-only
set protocols isis interface ge-0/0/0.0 point-to-point
set protocols isis interface ge-0/0/0.0 level 2 metric 10
set protocols isis traffic-engineering credibility-protocol-preference

# Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family iso
set interfaces ge-0/0/0 unit 0 family mpls

# Loopback Configuration
set interfaces lo0 unit 1 family inet address 1.1.1.9/32
set interfaces lo0 unit 1 family iso
set protocols isis interface lo0.1 passive
