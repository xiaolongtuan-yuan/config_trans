set system host-name DeviceC

# Corrected IS-IS configuration
set protocols isis level 1 disable
set protocols isis level 2 disable
set protocols isis interface ge-1/0/0
set protocols isis interface ge-2/0/0 point-to-point
set protocols isis interface ge-3/0/0 point-to-point
set protocols isis interface ge-4/0/0 point-to-point
set protocols isis interface all level 1 disable
set protocols isis interface all level 2 disable

# Interface configuration
set interfaces ge-1/0/0 unit 0 family inet address 1.1.1.1/24
set interfaces ge-1/0/0 unit 0 family iso
set interfaces ge-2/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-3/0/0 unit 0 family inet address 192.168.0.1/24
set interfaces ge-4/0/0 unit 0 family inet address 10.1.2.1/24

# BGP configuration
set protocols bgp group external type external
set protocols bgp group external local-address 1.1.1.1
set protocols bgp group external peer-as 100
set protocols bgp group external neighbor 1.1.1.2
set protocols bgp group external family inet unicast
set protocols bgp group external family evpn signaling