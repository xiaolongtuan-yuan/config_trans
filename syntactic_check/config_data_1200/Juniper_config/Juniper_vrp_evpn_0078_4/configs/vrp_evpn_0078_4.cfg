set system host-name CE1

# VLAN Configuration
set vlans bd10 vlan-id 10
set vlans vlan100 vlan-id 100

# LAG Configuration
set chassis aggregated-devices ethernet device-count 1
set interfaces ae10 aggregated-ether-options lacp active
set interfaces ae10 unit 0 family ethernet-switching interface-mode trunk
set interfaces ae10 unit 0 family ethernet-switching vlan members bd10
set interfaces ae10 unit 0 family ethernet-switching vlan members vlan100

# Member Interface Configuration
set interfaces ge-0/0/0 ether-options 802.3ad ae10