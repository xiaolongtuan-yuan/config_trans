set system host-name CE

set vlans vlan-2 vlan-id 2

set ethernet-switching-options aging-time 500

set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode access
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members vlan-2

set interfaces ge-0/0/2 unit 0 family ethernet-switching interface-mode access
set interfaces ge-0/0/2 unit 0 family ethernet-switching vlan members vlan-2

set ethernet-switching-options secure-access-port interface ge-0/0/1 static-mac 00:e0:fc:12:34:58 vlan vlan-2
set ethernet-switching-options secure-access-port interface ge-0/0/1 static-mac 00:e0:fc:12:34:56 vlan vlan-2
set ethernet-switching-options secure-access-port interface ge-0/0/2 static-mac 00:e0:fc:12:34:57 vlan vlan-2