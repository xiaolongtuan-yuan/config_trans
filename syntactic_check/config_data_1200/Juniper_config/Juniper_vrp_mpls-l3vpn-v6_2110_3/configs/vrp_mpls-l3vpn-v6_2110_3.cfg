set system host-name PE1

# VRF Configuration
set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 200:1
set routing-instances vpn1 vrf-target import target:1:1
set routing-instances vpn1 vrf-target export target:1:1

# MPLS/LDP Configuration (explicit interfaces)
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0

# IS-IS Configuration
set protocols isis interface ge-1/0/0.0
set protocols isis interface ge-2/0/0.0
set protocols isis level 2 wide-metrics-only

# OSPF Configuration
set protocols ospf area 0 interface ge-1/0/0.0
set protocols ospf area 0 interface ge-2/0/0.0
set protocols ospf export bgp-to-ospf

# Policy Configuration
set policy-options policy-statement bgp-to-ospf term 1 from protocol bgp
set policy-options policy-statement bgp-to-ospf term 1 then accept
set policy-options policy-statement ospf-to-bgp term 1 from protocol ospf
set policy-options policy-statement ospf-to-bgp term 1 then accept

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 11.1.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set routing-instances vpn1 interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 0 family inet address 30.1.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls

# BGP Configuration
set protocols bgp group internal type internal
set protocols bgp group internal local-address 3.3.3.9
set protocols bgp group internal neighbor 4.4.4.9
set protocols bgp group internal peer-as 100
set protocols bgp group internal family inet unicast
set protocols bgp group internal family inet-vpn unicast
set protocols bgp group internal export ospf-to-bgp
set protocols bgp hold-time 60  # Corrected hold-time syntax

# VRF BGP Configuration
set routing-instances vpn1 protocols bgp group vpn1 type internal
set routing-instances vpn1 protocols bgp group vpn1 neighbor 4.4.4.9
set routing-instances vpn1 protocols bgp group vpn1 peer-as 100
set routing-instances vpn1 protocols bgp group vpn1 family inet unicast