set system host-name NATA

# Interface Configuration
set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 unit 0 family inet address 1.1.1.1/24
set interfaces ge-1/0/1 unit 0 vlan-id 1

# Bridge Domain Configuration (Corrected Syntax)
set bridge-domains bd1 domain-type bridge
set bridge-domains bd1 vlan-id 1
set bridge-domains bd1 interface ge-1/0/1.0

# NAT Configuration
set security nat source rule-set rs1 from zone trust
set security nat source rule-set rs1 to zone untrust
set security nat source rule-set rs1 rule r1 match source-address 192.168.10.0/24
set security nat source rule-set rs1 rule r1 then source-nat interface

# Policy Configuration (Corrected Syntax)
set policy-options policy-statement ps1 term 1 from route-filter 192.168.10.0/24 exact
set policy-options policy-statement ps1 term 1 then accept

# Additional Interfaces
set interfaces ge-2/0/0 unit 0 family inet address 192.168.10.1/24
set interfaces ge-3/0/0 unit 0 family inet address 2.2.2.1/24

# OSPF Configuration (Corrected Syntax)
set protocols ospf area 0.0.0.0 interface ge-3/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

# Static Routing
set routing-options static route 0.0.0.0/0 next-hop 2.2.2.2
