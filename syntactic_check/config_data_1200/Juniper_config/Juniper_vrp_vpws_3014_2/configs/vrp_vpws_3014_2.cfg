set system host-name P

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/24
set protocols mpls interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 0 family inet address 10.2.2.1/24
set protocols mpls interface ge-2/0/0.0

set interfaces lo0 unit 0 family inet address 192.168.4.4/32
set protocols ldp interface lo0.0

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0