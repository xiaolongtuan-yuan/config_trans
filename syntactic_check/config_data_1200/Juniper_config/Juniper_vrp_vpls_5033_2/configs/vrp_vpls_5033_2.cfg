# System configuration
set system host-name UPE1

# MPLS/LDP Configuration
set protocols mpls interface ge-0/0/0.0
set protocols mpls interface lo0.0
set protocols ldp interface lo0.0
set protocols ldp router-id 4.4.4.9
set protocols ldp interface ge-0/0/0.0

# Interface Configuration - ge-0/0/0 (MPLS)
set interfaces ge-0/0/0 unit 0 family inet address 10.10.3.2/24
set interfaces ge-0/0/0 unit 0 family mpls

# Interface Configuration - ge-0/0/1 (L2 Circuit)
set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 unit 0 encapsulation vlan-ccc
set interfaces ge-0/0/1 unit 0 vlan-id 1
set interfaces ge-0/0/1 unit 0 family ccc

# L2 Circuit Configuration
set protocols l2circuit neighbor 1.1.1.9 interface ge-0/0/1.0 virtual-circuit-id 100
set protocols l2circuit encapsulation-type ethernet-vlan

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 4.4.4.9/32

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0