set system host-name LSRB


set interfaces ge-0/0/0 unit 0 family inet address 2.1.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 0 disable

set interfaces ge-0/0/1 unit 0 family inet address 3.2.1.1/24
set interfaces ge-0/0/1 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 disable

set interfaces lo0 unit 1 family inet address 2.2.2.2/32

set routing-options static route 1.1.1.1/32 next-hop 2.1.1.1
set routing-options static route 3.3.3.3/32 next-hop 3.2.1.2

set protocols ldp interface all
set protocols ldp track-igp-metric

set forwarding-options hash-key family mpls label-1
set forwarding-options hash-key family mpls label-2