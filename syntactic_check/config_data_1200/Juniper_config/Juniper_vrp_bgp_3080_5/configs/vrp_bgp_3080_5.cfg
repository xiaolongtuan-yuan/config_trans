set system host-name DeviceF

set interfaces ge-1/0/0 unit 0 family inet address 10.20.3.1/24
set interfaces ge-1/0/0 enable

set interfaces ge-2/0/0 unit 0 family inet address 10.22.8.1/24
set interfaces ge-2/0/0 enable

set interfaces lo0 unit 0 family inet address 6.6.6.6/32

set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 200
set protocols bgp group external-peers neighbor 10.20.3.2

set policy-options policy-statement export-network term 1 from route-filter 10.2.1.0/24 exact
set policy-options policy-statement export-network term 1 then accept

set protocols bgp group external-peers export export-network
