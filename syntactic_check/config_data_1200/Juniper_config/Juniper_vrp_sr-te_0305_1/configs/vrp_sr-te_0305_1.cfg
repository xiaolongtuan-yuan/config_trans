set system host-name P1

# LDP 配置（保持不变）
set protocols ldp router-id 2.2.2.2
set protocols ldp interface all

# MPLS 配置修正
set protocols mpls interface ge-3/0/0

# IS-IS 配置修正
set protocols isis level 2 wide-metrics-only
set protocols isis interface all

# ge-2/0/0 接口配置
set interfaces ge-2/0/0 unit 0 family inet address 10.1.2.2/24
set interfaces ge-2/0/0 unit 0 family iso
set protocols isis interface ge-2/0/0 point-to-point
set protocols mpls interface ge-2/0/0

# ge-3/0/0 接口配置
set interfaces ge-3/0/0 unit 0 family inet address 10.1.3.2/24
set interfaces ge-3/0/0 unit 0 family iso
set protocols isis interface ge-3/0/0 point-to-point
set protocols mpls interface ge-3/0/0

# Loopback 配置（保持不变）
set interfaces lo0 unit 0 family inet address 2.2.2.2/32
set interfaces lo0 unit 0 family iso
set protocols isis interface lo0 passive