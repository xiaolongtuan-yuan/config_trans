set system host-name PE3

# LDP 配置修正
set protocols ldp interface lo0.0  # 明确指定unit
set protocols ldp interface ge-1/0/1.0
set protocols ldp interface ge-1/0/2.0

# MPLS 配置修正
set protocols mpls interface ge-1/0/2.0

# L2VPN 配置修正
set protocols l2vpn encapsulation-type ethernet  # 必需的基础配置
set protocols l2vpn site PE3 site-identifier 3  # 标准化站点配置
set routing-instances LDP1 interface ge-1/0/3.1
set routing-instances LDP1 route-distinguisher 5.5.5.5:100
set routing-instances LDP1 vrf-target target:100:100
set routing-instances LDP1 protocols l2vpn neighbor 4.4.4.4 pseudowire-id 100

# 接口配置修正
set interfaces ge-1/0/3 flexible-vlan-tagging
set interfaces ge-1/0/3 unit 1 encapsulation vlan-ccc  # 修正封装类型
set interfaces ge-1/0/3 unit 1 vlan-id 10
set interfaces ge-1/0/3 unit 1 family ccc  # 替代ethernet-switching

# 其他接口配置
set interfaces ge-1/0/1 unit 0 family inet address 172.16.35.5/24
set interfaces ge-1/0/2 unit 0 family inet address 172.16.45.5/24
set interfaces lo0 unit 0 family inet address 5.5.5.5/32

# OSPF 配置（保持不变）
set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-1/0/1.0
set protocols ospf area 0 interface ge-1/0/2.0