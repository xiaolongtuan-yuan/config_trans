set system host-name DeviceB
set system root-authentication encrypted-password "<encrypted-password>"

# IPv4 Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 2.2.2.2/8

# 6to4 Tunnel Configuration (Corrected Syntax)
set interfaces ip-0/0/10 unit 0 family inet6
set interfaces ip-0/0/10 unit 0 tunnel source 2.2.2.2
set interfaces ip-0/0/10 unit 0 tunnel destination 6to4
set interfaces ip-0/0/10 unit 0 tunnel family inet6

# IPv6 Static Route
set routing-options rib inet6.0 static route 2002::/16 next-hop ip-0/0/10.0