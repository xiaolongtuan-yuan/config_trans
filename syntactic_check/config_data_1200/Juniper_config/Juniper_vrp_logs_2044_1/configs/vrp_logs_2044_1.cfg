set system host-name Device

# Syslog 配置（保持不变）
set system syslog host 10.1.1.1 any informational
set system syslog source-address 10.1.1.2

# 接口配置（保持不变）
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24

# SNMP 配置修正
set snmp community public authorization read-only
set snmp trap-group public targets 10.1.1.1
set snmp trap-group public version v2c  # 修正版本号为v2c
set snmp trap-group public categories chassis  # 分离配置项
set snmp trap-group public categories link
set snmp trap-group public categories routing