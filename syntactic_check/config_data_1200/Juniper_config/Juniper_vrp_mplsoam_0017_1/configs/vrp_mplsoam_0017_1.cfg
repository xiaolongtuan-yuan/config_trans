set system host-name LSRB

set protocols mpls label-switched-path Tunnel10 to 10.2.1.2
set protocols mpls label-switched-path Tunnel10 primary explicit name Tunnel10
set protocols mpls label-switched-path Tunnel10 lsp-attributes record

set protocols mpls label-switched-path Tunnel20 to 10.1.1.1
set protocols mpls label-switched-path Tunnel20 primary explicit name Tunnel20
set protocols mpls label-switched-path Tunnel20 lsp-attributes record

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/30
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 mtu 1514
set interfaces ge-1/0/0 enable

set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/30
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 mtu 1514
set interfaces ge-2/0/0 enable

set interfaces lo0 unit 1 family inet address 2.2.2.2/32

set protocols rsvp interface ge-1/0/0
set protocols rsvp interface ge-2/0/0
set protocols rsvp interface lo0.1

set protocols mpls interface ge-1/0/0
set protocols mpls interface ge-2/0/0

set policy-options policy-statement next-hop-Tunnel10 term t1 from interface Tunnel10
set policy-options policy-statement next-hop-Tunnel10 term t1 then accept

set policy-options policy-statement next-hop-Tunnel20 term t1 from interface Tunnel20
set policy-options policy-statement next-hop-Tunnel20 term t1 then accept

set policy-options explicit-path Tunnel10 10.2.1.2
set policy-options explicit-path Tunnel20 10.1.1.1

set protocols mpls label-switched-path Tunnel10 primary explicit-path Tunnel10
set protocols mpls label-switched-path Tunnel20 primary explicit-path Tunnel20