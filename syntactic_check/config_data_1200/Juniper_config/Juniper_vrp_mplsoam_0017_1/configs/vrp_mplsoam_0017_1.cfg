set system host-name LSRB

# 接口配置
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/30
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 mtu 1514
set interfaces ge-1/0/0 description "Enabled interface"

set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/30
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 mtu 1514
set interfaces ge-2/0/0 description "Enabled interface"

set interfaces lo0 unit 1 family inet address 2.2.2.2/32

# 协议配置
set protocols rsvp interface ge-1/0/0
set protocols rsvp interface ge-2/0/0
set protocols rsvp interface lo0.1

set protocols mpls interface ge-1/0/0
set protocols mpls interface ge-2/0/0

# 修正策略配置
set policy-options policy-statement next-hop-Tunnel10 term t1 from protocol direct
set policy-options policy-statement next-hop-Tunnel10 term t1 then next-hop 10.2.1.2
set policy-options policy-statement next-hop-Tunnel10 term t1 then accept

set policy-options policy-statement next-hop-Tunnel20 term t1 from protocol direct
set policy-options policy-statement next-hop-Tunnel20 term t1 then next-hop 10.1.1.1
set policy-options policy-statement next-hop-Tunnel20 term t1 then accept