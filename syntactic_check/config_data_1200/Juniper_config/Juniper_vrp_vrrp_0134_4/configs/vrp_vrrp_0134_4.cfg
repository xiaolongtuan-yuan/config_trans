set system host-name PE3

# 接口配置修正
set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 unit 0 family inet address 172.16.35.5/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 1 encapsulation vlan-ccc
set interfaces ge-1/0/0 unit 1 family ccc  # 必需配置

# 其他接口配置
set interfaces ge-1/0/1 unit 0 family inet address 172.16.35.5/24
set interfaces ge-1/0/1 unit 0 family mpls
set interfaces ge-1/0/2 unit 0 family inet address 172.16.45.5/24
set interfaces ge-1/0/2 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 5.5.5.5/32

# MPLS/LDP 配置修正
set protocols mpls interface ge-1/0/1.0
set protocols mpls interface ge-1/0/2.0
set protocols ldp interface ge-1/0/0.0   # 替换"interface all"
set protocols ldp interface ge-1/0/1.0
set protocols ldp interface ge-1/0/2.0
set protocols ldp transport-address 5.5.5.5  # 替换interface指定方式

# OSPF 配置（保持不变）
set protocols ospf area 0 interface ge-1/0/0.0
set protocols ospf area 0 interface ge-1/0/1.0
set protocols ospf area 0 interface ge-1/0/2.0
set protocols ospf area 0 interface lo0.0

# L2Circuit 配置修正
set protocols l2circuit neighbor 3.3.3.3 interface ge-1/0/0.1 pseudowire-id 100  # 替换"interface all"
set protocols l2circuit neighbor 4.4.4.4 interface ge-1/0/0.1 pseudowire-id 100  # 替换"interface all"