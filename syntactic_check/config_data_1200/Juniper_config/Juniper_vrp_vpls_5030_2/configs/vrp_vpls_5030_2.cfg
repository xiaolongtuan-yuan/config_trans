set system host-name PE1

# MPLS Protection Configuration
set protocols ldp interface ge-2/0/0.0
set protocols ldp interface lo0.0

# L2Circuit Configuration
set protocols l2circuit neighbor 3.3.3.9 interface ge-1/0/0.0 virtual-circuit-id 2
set protocols l2circuit encapsulation-type ethernet-vlan
set protocols l2circuit pseudowire-status-tlv

# Interface Configuration
set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 unit 0 encapsulation vlan-ccc
set interfaces ge-1/0/0 unit 0 vlan-id 10
set interfaces ge-1/0/0 unit 0 family ccc

set interfaces ge-2/0/0 unit 0 family inet address 10.10.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls

# Loopback Configuration
set interfaces lo0 unit 0 family inet address 1.1.1.9/32

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0