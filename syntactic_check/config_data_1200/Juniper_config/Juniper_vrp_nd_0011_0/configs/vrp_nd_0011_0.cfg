set routing-options rib inet6.0 static route ::/0 next-hop (next-hop-address)
set interfaces vlan unit 10 family inet6 address 2001:DB8:300:400::3/64
set interfaces vlan unit 10 family inet6 address 2001:DB8:300:400::3/64 nd router-advertisement managed-configuration
set interfaces vlan unit 10 family inet6 address 2001:DB8:300:400::3/64 nd router-advertisement other-stateful-configuration
set interfaces vlan unit 10 family inet6 address 2001:DB8:300:400::3/64 nd router-advertisement suppress
