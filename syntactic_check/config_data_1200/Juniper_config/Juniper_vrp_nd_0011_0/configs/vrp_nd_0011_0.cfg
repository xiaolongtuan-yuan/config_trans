set system host-name DeviceA

# VLAN配置（保持不变）
set vlans vlan-10 vlan-id 10

# 修正VLAN接口IPv6配置（原行4-7）
set protocols router-advertisement interface vlan.10 managed-configuration
set protocols router-advertisement interface vlan.10 other-stateful-configuration
set protocols router-advertisement interface vlan.10 suppress

# 接口ge-1/0/1配置（保持不变）
set interfaces ge-1/0/1 unit 0 family ethernet-switching port-mode access
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members vlan-10
