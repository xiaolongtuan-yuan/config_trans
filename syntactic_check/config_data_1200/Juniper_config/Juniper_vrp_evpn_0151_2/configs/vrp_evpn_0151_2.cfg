set system host-name PE2

# Forwarding options
set forwarding-options family inet6 mode packet-based

# IS-IS Configuration
set protocols isis interface ge-1/0/0.0
set protocols isis interface ge-2/0/0.0
set protocols isis interface lo0.1
set protocols isis level 1 disable
set protocols isis level 2 wide-metrics-only

# BGP Configuration
set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 100

set protocols bgp group external-peers export export-connected
set protocols bgp group external-peers export export-network

# Policy Configuration
set policy-options policy-statement export-network term 1 from route-filter 2001:DB8:20::/64 exact
set policy-options policy-statement export-network term 1 then accept

set policy-options policy-statement export-connected term 1 from protocol direct
set policy-options policy-statement export-connected term 1 then accept

# Static Routing
set routing-options rib inet6.0 static route 2001:DB8:130::/64 next-hop 2001:DB8:20::1
set routing-options rib inet6.0 static route 2001:DB8:130::/64 next-hop 2001:DB8:22::2
set routing-options rib inet6.0 static route 2001:DB8:22::/64 discard
set routing-options rib inet6.0 static route 2001:DB8:3::3/128 discard