set system host-name PE2

set forwarding-options family inet6 mode packet-based

set protocols isis interface all
set protocols isis level 1 disable
set protocols isis wide-metrics-only
set protocols isis network-entity 10.0000.0000.0003.00

set interfaces ge-1/0/0 unit 0 family inet6 address 2001:DB8:20::2/64
set interfaces ge-1/0/0 unit 0 family inet6 address 2001:DB8:20::2/64 preferred

set interfaces ge-2/0/0 unit 0 family inet6 address 2001:DB8:22::1/64
set interfaces ge-2/0/0 unit 0 family inet6 address 2001:DB8:22::1/64 preferred

set interfaces lo0 unit 1 family inet6 address 2001:DB8:3::3/128

set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 100
set protocols bgp group external-peers neighbor 2001:DB8:1::1 remote-as 100
set protocols bgp group external-peers neighbor 2001:DB8:1::1 update-source lo0.1
set protocols bgp group external-peers export [ export-connected export-network ]

set policy-options policy-statement export-network term 1 from route-filter 2001:DB8:20::/64 exact
set policy-options policy-statement export-network term 1 then accept

set policy-options policy-statement export-connected term 1 from protocol direct
set policy-options policy-statement export-connected term 1 then accept

set routing-options static route 2001:DB8:130::/64 next-hop ge-1/0/0.0
set routing-options static route 2001:DB8:130::/64 next-hop ge-2/0/0.0
set routing-options static route 2001:DB8:22::/64 next-hop ge-2/0/0.0
set routing-options static route 2001:DB8:3::3/128 next-hop lo0.1