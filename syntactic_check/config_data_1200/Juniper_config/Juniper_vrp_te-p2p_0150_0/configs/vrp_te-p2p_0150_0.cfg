set system host-name PE1

# BFD Configuration
set protocols bfd

# LDP Configuration
set protocols ldp router-id 4.4.4.4
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0

# MPLS TE Configuration
set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0

# IS-IS Configuration
set protocols isis reference-bandwidth 100g
set protocols isis level 1 disable
set protocols isis level 2 disable
set protocols isis interface ge-0/0/0.0 point-to-point
set protocols isis interface ge-0/0/1.0 point-to-point
set protocols isis interface lo0.0 passive

# Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 10.3.1.1/30
set interfaces ge-0/0/0 unit 0 family iso
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family inet address 10.4.1.1/30
set interfaces ge-0/0/1 unit 0 family iso
set interfaces ge-0/0/1 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 4.4.4.4/32
set interfaces lo0 unit 0 family iso

# RSVP Configuration
set protocols rsvp interface ge-0/0/0.0
set protocols rsvp interface ge-0/0/1.0


# Logical Tunnel Interface
set interfaces lt-0/0/0 unit 10 family inet address 4.4.4.4/32
set interfaces lt-0/0/0 unit 10 family mpls
set protocols rsvp interface lt-0/0/0.10
set protocols mpls interface lt-0/0/0.10
set protocols rsvp interface lt-0/0/0.10 record-route