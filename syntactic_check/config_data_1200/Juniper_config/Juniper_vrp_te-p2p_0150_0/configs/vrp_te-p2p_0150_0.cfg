set system host-name PE1

set protocols bfd

set protocols ldp router-id 4.4.4.4
set protocols ldp interface all

set protocols mpls traffic-engineering

set protocols isis level 1-2 wide-metrics-only
set protocols isis interface all point-to-point
set protocols isis interface lo0.0 passive
set protocols isis interface ge-0/0/0.0 point-to-point
set protocols isis interface ge-0/0/1.0 point-to-point
set protocols isis iso-address "49.0000.0000.0004.00"

set interfaces ge-0/0/0 unit 0 family inet address 10.3.1.1/30
set interfaces ge-0/0/0 unit 0 family iso
set protocols mpls interface ge-0/0/0.0
set protocols rsvp interface ge-0/0/0.0

set interfaces ge-0/0/1 unit 0 family inet address 10.4.1.1/30
set interfaces ge-0/0/1 unit 0 family iso
set protocols mpls interface ge-0/0/1.0
set protocols rsvp interface ge-0/0/1.0

set interfaces lo0 unit 0 family inet address 4.4.4.4/32
set interfaces lo0 unit 0 family iso

set protocols mpls name explicit-path-backup
set protocols mpls name explicit-path-backup hop 10.3.1.2
set protocols mpls name explicit-path-backup hop 10.5.1.2
set protocols mpls name explicit-path-backup hop 3.3.3.3

set protocols mpls name explicit-path-main
set protocols mpls name explicit-path-main hop 10.4.1.2
set protocols mpls name explicit-path-main hop 10.2.1.2
set protocols mpls name explicit-path-main hop 3.3.3.3

set interfaces lt-0/0/0 unit 10 family inet address 4.4.4.4/32
set protocols rsvp interface lt-0/0/0.10
set protocols mpls interface lt-0/0/0.10
set protocols rsvp interface lt-0/0/0.10 record-route
set protocols mpls label-switched-path to-3.3.3.3 to 3.3.3.3
set protocols mpls label-switched-path to-3.3.3.3 primary explicit-path-main
set protocols mpls label-switched-path to-3.3.3.3 secondary explicit-path-backup
set protocols mpls label-switched-path to-3.3.3.3 bfd-liveness-detection
set protocols mpls label-switched-path to-3.3.3.3 bfd-liveness-detection minimum-interval 100
set protocols mpls label-switched-path to-3.3.3.3 bfd-liveness-detection minimum-receive-interval 100