set system host-name CE2

# IPv6 Interface Configuration (without curly braces)

# BGP Configuration
set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 100
set protocols bgp group external-peers neighbor 2001:db8:2::2
set protocols bgp local-as 65420
set protocols bgp group external-peers family inet6 unicast
# Removed duplicate neighbor family statement
set protocols bgp group external-peers export redistribute-connected

# Route Redistribution Policy
set policy-options policy-statement redistribute-connected term 1 from protocol direct
set policy-options policy-statement redistribute-connected term 1 then accept