set system host-name DeviceA

# IPv6 Interface Configuration (Corrected Syntax)
set interfaces ge-0/0/0 unit 0 family inet6

# OSPFv3 Configuration (Corrected Syntax)
set protocols ospf3 area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf3 area 0.0.0.0 interface lo0.0 passive

# BFD Configuration (Corrected Syntax)
set protocols bfd interface ge-0/0/0.0 ipv6 destination 2001:db8:2::2 local-address 2001:db8:1::1
set protocols bfd interface ge-0/0/0.0 ipv6 minimum-interval 300
set protocols bfd interface ge-0/0/0.0 ipv6 multiplier 3

# Loopback Interface (Required for OSPF Router-ID)
set interfaces lo0 unit 0 family inet address 1.1.1.1/32