set system host-name DeviceA

set protocols pim rp ipv6

set firewall family inet6 filter 2000 term 1 from destination-address ff3e::/64
set firewall family inet6 filter 2000 term 1 then accept

set protocols pim interface ge-1/0/0.0 mode sparse

set protocols ospf3 area 0.0.0.0 interface ge-1/0/0.0

set protocols pim interface ge-2/0/0.0 mode sparse

set protocols ospf3 area 0.0.0.0 interface ge-2/0/0.0

set protocols pim interface ge-3/0/0.0 mode sparse

set protocols ospf3 area 0.0.0.0 interface ge-3/0/0.0

set protocols pim interface ge-1/0/1.0 mode sparse
set protocols pim interface ge-1/0/1.0 border

set protocols ospf3 area 0.0.0.0 interface ge-1/0/1.0

set routing-options router-id 1.1.1.1
set protocols ospf3 area 0.0.0.0

set protocols pim ssm-groups ff3e::/64
set protocols pim source-specific-filter 2000