set system host-name NATA

# License Acceptance (Corrected Syntax)
set system license accept end-user-agreement

# Security NAT Configuration (Corrected Syntax)
set security nat source pool NAT-POOL address 11.11.11.101/32 to 11.11.11.105/32
set security nat source rule-set NAT-RULES from zone untrust
set security nat source rule-set NAT-RULES to zone trust
set security nat source rule-set NAT-RULES rule NAT-RULE match source-address 192.168.10.0/24
set security nat source rule-set NAT-RULES rule NAT-RULE then source-nat pool NAT-POOL

# Firewall Filter
set firewall family inet filter PROTECT-FILTER term 1 from source-address 192.168.10.0/24
set firewall family inet filter PROTECT-FILTER term 1 then accept

# Interface Configuration
set interfaces ge-0/0/1 unit 0 family inet address 1.1.1.1/24
set interfaces ge-0/0/1 unit 0 family inet filter input PROTECT-FILTER

# Security Zones
set security zones security-zone trust interfaces ge-0/0/1.0
