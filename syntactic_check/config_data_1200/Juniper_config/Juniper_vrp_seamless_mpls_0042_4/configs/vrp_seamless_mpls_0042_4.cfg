set system host-name MASG

set protocols bfd all-interfaces
set protocols ldp interface all 
set protocols ldp transport-address-interface lo0.0
set protocols mpls interface all

set interfaces ge-2/0/0 unit 0 family inet address 10.4.1.2/24
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 gigether-options no-auto-negotiation

set interfaces lo0 unit 0 family inet address 5.5.5.5/32

set protocols bgp group external-peers type external
set protocols bgp group external-peers neighbor 4.4.4.4 peer-as 200
set protocols bgp group external-peers neighbor 4.4.4.4 local-address 5.5.5.5
set protocols bgp group external-peers neighbor 4.4.4.4 family inet unicast
set protocols bgp group external-peers neighbor 4.4.4.4 export EXPORT-POLICY

set policy-options policy-statement EXPORT-POLICY term 10 from protocol direct
set policy-options policy-statement EXPORT-POLICY term 10 from route-filter 5.5.5.5/32 exact
set policy-options policy-statement EXPORT-POLICY term 10 then accept
set policy-options policy-statement EXPORT-POLICY term 10 then set mpls-label

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0