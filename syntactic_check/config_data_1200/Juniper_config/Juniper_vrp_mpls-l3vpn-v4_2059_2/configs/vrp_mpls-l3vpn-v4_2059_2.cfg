set system host-name CE1

set protocols mpls interface all
set interfaces ge-0/0/0 unit 0 family inet address 40.1.1.2/24
set protocols mpls interface ge-0/0/0
set interfaces ge-0/0/1 unit 0 family inet address 11.1.1.1/24
set protocols mpls interface ge-0/0/1
set interfaces lo0 unit 1 family inet address 2.2.2.9/32

set protocols bgp group external-peers type external
set protocols bgp group external-peers neighbor 1.1.1.9 peer-as 200
set protocols bgp group external-peers neighbor 1.1.1.9 local-address 2.2.2.9
set protocols bgp group external-peers neighbor 11.1.1.2 peer-as 100

set protocols bgp group external-peers family inet unicast
set protocols bgp group external-peers family inet-labeled unicast
set policy-options policy-statement IMPORT-OSPF term 1 from protocol ospf
set policy-options policy-statement IMPORT-OSPF term 1 then accept
set protocols bgp group external-peers import IMPORT-OSPF

set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-0/0/0.0
set protocols ospf area 0 interface ge-0/0/1.0