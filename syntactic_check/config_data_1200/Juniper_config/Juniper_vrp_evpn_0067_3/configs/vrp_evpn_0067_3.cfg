set system host-name CPE

# Basic EVPN Configuration
set routing-instances EVPN instance-type virtual-switch
set routing-instances EVPN interface ge-0/0/3.17
set routing-instances EVPN interface ge-0/0/3.27

# VLAN Configuration
set vlans BD10 vlan-id 10
set vlans BD20 vlan-id 20

# Interface Configuration
set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/2 unit 0 family inet address 10.1.2.2/24

set interfaces ge-0/0/3 flexible-vlan-tagging
set interfaces ge-0/0/3 unit 0 family ethernet-switching vlan members BD10
set interfaces ge-0/0/3 unit 0 family ethernet-switching vlan members BD20

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

# IRB Configuration
set interfaces irb unit 10 family inet address 192.168.10.1/24
set interfaces irb unit 20 family inet address 192.168.20.1/24

# BGP Configuration
set protocols bgp group evpn type internal
set protocols bgp group evpn local-address 4.4.4.4
set protocols bgp group evpn family evpn signaling
set protocols bgp group evpn neighbor 3.3.3.3 peer-as 65000

# IS-IS Configuration
set protocols isis interface ge-0/0/1.0 point-to-point
set protocols isis interface ge-0/0/2.0 point-to-point
set protocols isis interface lo0.0 passive