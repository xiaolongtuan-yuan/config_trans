#
sysname SPE1
#
mpls lsr-id 1.1.1.9
#
mpls
#
mpls l2vpn
#
vsi v100
 pwsignal ldp
  vsi-id 100
  mac-withdraw enable
  peer 3.3.3.9 static-npe trans 300 recv 400 
  peer 4.4.4.9 static-upe trans 200 recv 100 
