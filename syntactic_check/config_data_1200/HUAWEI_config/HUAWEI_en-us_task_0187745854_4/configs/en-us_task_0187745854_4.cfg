#
sysname name PE2
#
router id 4.4.4.4
#
tunnel-selector s1 permit node 10
 apply tunnel-policy p1
#
mpls lsr-id 4.4.4.4
mpls
mpls l2vpn
#
vsi v1
 pwsignal bgp
  route-distinguisher 10.10.3.4:1
  vpn-target 100:1 import-extcommunity
  vpn-target 100:1 export-extcommunity
#
mpls ldp
 ipv4-family
#
interface GigabitEthernet1/0/0.1
 vlan-type dot1q 10
 l2 binding vsi v1
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 10.10.3.4 255.255.255.0
 mpls
 mpls ldp
#
interface GigabitEthernet1/0/0.1
 vlan-type dot1q 10
 l2 binding vsi 2
#
interface LoopBack1
 ip address 4.4.4.4 255.255.255.255
#
bgp 200
 peer 3.3.3.3 as-number 200
 peer 3.3.3.3 connect-interface LoopBack1
 #
 l2vpn-ad-family
  policy vpn-target
  tunnel-selector s1  
  signaling vpls
  peer 3.3.3.3 enable
  peer 3.3.3.3 send-community extended
#
ospf 1
 bgp-ls enable
 area 0.0.0.0
  network 4.4.4.4 0.0.0.0
  network 10.10.3.0 0.0.0.255
#
tunnel-policy p1
 tunnel select-seq bgp ldp load-balance-number 1
#
return
