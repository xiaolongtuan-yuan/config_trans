#
 sysname RSG
#
 mpls lsr-id 2.2.2.2
 mpls
  mpls te
  label advertise non-null
  mpls rsvp-te
  mpls te cspf
#
 mpls l2vpn
#
mpls ldp
#
#
 mpls ldp remote-peer 1.1.1.1
 remote-ip 1.1.1.1
#
interface Serial2/0/0:0
 link-protocol atm
 undo shutdown
#
interface Serial2/0/0:0.1
 pvc 1/33
 mpls l2vc 1.1.1.1 100 tunnel-policy policy1 control-word
#
interface Serial2/0/0:0.2
 pvc 2/33
 mpls l2vc 1.1.1.1 200 tunnel-policy policy1 control-word
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.0.1.2 255.255.255.0
 mpls
 mpls te
 mpls rsvp-te
#
interface LoopBack1
 ip address 2.2.2.2 255.255.255.255
#
interface Tunnel11
 ip address unnumbered interface LoopBack1
 tunnel-protocol mpls te
 destination 1.1.1.1
 mpls te tunnel-id 100
 mpls te signal-protocol rsvp-te
 mpls te reserved-for-binding
#
ospf 100
 opaque-capability enable
 area 0.0.0.0
  network 2.2.2.2 0.0.0.0
  network 10.0.1.0 0.0.0.255
  mpls-te enable
#
tunnel-policy policy1
 tunnel binding destination 1.1.1.1 te Tunnel11
#
return
