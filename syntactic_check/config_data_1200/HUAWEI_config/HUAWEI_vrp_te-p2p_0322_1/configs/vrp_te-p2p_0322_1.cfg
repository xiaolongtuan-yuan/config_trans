 mpls te bandwidth max-reservable-bandwidth 400000
 mpls te bandwidth bc0 400000 bc1 300000 bc2 200000
 mpls rsvp-te
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 10.11.1.1 255.255.255.0
 mpls
 mpls te
 mpls te bandwidth max-reservable-bandwidth 400000
 mpls te bandwidth bc0 400000 bc1 300000 bc2 200000
 mpls rsvp-te
