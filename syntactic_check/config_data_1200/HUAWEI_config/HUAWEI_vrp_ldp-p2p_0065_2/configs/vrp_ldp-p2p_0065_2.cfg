#
sysname LSRC
#
mpls lsr-id 3.3.3.3
#
mpls
#
mpls ldp
 mldp p2mp
 #
 ipv4-family
  mldp p2mp-lsp name lsp1 root-ip 1.1.1.1 lsp-id 1
#
isis 1
 is-level level-2
 network-entity 00.0005.0000.0000.0003.00
#
interface GigabitEthernet1/0/2
 undo shutdown
 ip address 10.3.1.2 255.255.255.0
 isis enable 1
 mpls
 mpls ldp
#
interface LoopBack1
 ip address 3.3.3.3 255.255.255.255
 isis enable 1
#
return
