sysname P2
#
mpls lsr-id 4.4.4.4
#
mpls
 mpls te
 mpls rsvp-te
 mpls te cspf
 lsp-trigger all
#
mpls ldp
 ipv4-family
#
mpls ldp remote-peer lsrb
 remote-ip 2.2.2.2
#
interface GigabitEthernet1/0/0
 undo shutdown 
 ip address 10.3.1.2 255.255.255.0
 mpls
 mpls te
 mpls te bandwidth max-reservable-bandwidth 20000
 mpls te bandwidth bc0 20000
 mpls rsvp-te
#
interface GigabitEthernet2/0/0
 undo shutdown 
 ip address 10.4.1.2 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack1
 ip address 4.4.4.4 255.255.255.255
#
interface Tunnel1
 ip address unnumbered interface LoopBack1
 tunnel-protocol mpls te
 destination 2.2.2.2
 mpls te tunnel-id 101
 mpls te bandwidth ct0 10000
 mpls te igp shortcut
 mpls te igp metric absolute 1
#
ospf 1
 opaque-capability enable
 enable traffic-adjustment advertise
 area 0.0.0.0
  network 4.4.4.4 0.0.0.0
  network 10.3.1.0 0.0.0.255
  network 10.4.1.0 0.0.0.255
  mpls-te enable
#
return
