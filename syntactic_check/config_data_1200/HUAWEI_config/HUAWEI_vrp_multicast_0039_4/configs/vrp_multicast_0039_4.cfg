#
sysname DeviceE
#
multicast routing-enable
#
acl number 2000
 rule 5 permit source 10.110.5.0 0.0.0.255
#
acl number 2001
 rule 5 permit source 192.168.2.0 0.0.0.255
#
acl number 3000
 rule 5 permit ip source 192.168.2.2 0 destination 224.0.0.0 15.255.255.255
#
acl number 3001
 rule 5 permit ip source 10.110.5.0 0.0.0.255 destination 225.1.1.0 0.0.0.255
#
isis 1
 network-entity 10.0000.0000.0005.00
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 192.168.3.2 255.255.255.0
 pim sm
 isis enable 1
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 192.168.2.2 255.255.255.0
 pim sm
 isis enable 1
#
interface GigabitEthernet3/0/0
 undo shutdown
 ip address 192.168.9.2 255.255.255.0
 pim sm
 isis enable 1
#
interface GigabitEthernet1/0/1
 undo shutdown
 ip address 192.168.4.1 255.255.255.0
 pim sm
 isis enable 1
#
pim
 bsr-policy 2001
 register-policy 3001
 source-policy 2000
 c-bsr GigabitEthernet2/0/0
 crp-policy 3000
 c-rp GigabitEthernet2/0/0
#
return
