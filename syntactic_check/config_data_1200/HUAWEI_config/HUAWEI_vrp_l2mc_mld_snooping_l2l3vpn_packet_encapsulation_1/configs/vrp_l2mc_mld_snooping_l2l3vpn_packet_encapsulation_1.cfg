#
 sysname UPE
 #
 mpls lsr-id 1.1.1.1
 #
 mpls
 #
 mpls l2vpn
 #
 vsi vsi1 static
  pwsignal ldp
   vsi-id 1112
   peer 2.2.2.2 
  mld-snooping enable
 #
 mpls ldp
 #
 mpls ldp remote-peer 2.2.2.2
 #
 interface GigabitEthernet1/0/1
  undo shutdown
  ip address 172.16.1.2 255.255.255.0
  mpls
  mpls ldp
  undo dcn
 #
 interface GigabitEthernet1/0/0.1
  vlan-type dot1q 10
  l2 binding vsi vsi1
 #
 interface LoopBack0
  ip address 1.1.1.1 255.255.255.255
 #
 ospf 1
  area 0.0.0.0
   network 1.1.1.1 0.0.0.0
   network 172.16.1.0 0.0.0.255
 #
 return
