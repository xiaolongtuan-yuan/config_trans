#
sysname DeviceA
#
multicast routing-enable
#
e-trunk 1
 peer-address 3.3.3.3 source-address 1.1.1.1
#
lacp priority 100
lacp e-trunk system-id 0000-0105-0001
#
remote-backup-service service1
 peer 3.3.3.3 source 1.1.1.1 port 1025
#
remote-backup-profile profile1
 service-type igmp
 backup-id 10 remote-backup-service service1
 peer-backup hot
 e-trunk 1 eth-trunk 1
#
interface Eth-Trunk1
 ip address 10.0.15.1 255.255.255.0
 pim sm
 igmp enable
 mode lacp-static
 e-trunk 1
 remote-backup-profile profile1
#
interface GigabitEthernet1/0/1
 undo shutdown
 ip address 10.0.13.1 255.255.255.0
 pim sm
#
interface GigabitEthernet1/0/2
 undo shutdown
 eth-trunk 1
#
interface GigabitEthernet1/0/3
 undo shutdown
 ip address 10.0.12.1 255.255.255.0
 pim sm
#
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
#
interface NULL0
#
ospf 1
 area 0.0.0.0
  network 1.1.1.1 0.0.0.0
  network 10.0.12.0 0.0.0.255
  network 10.0.13.0 0.0.0.255
  network 10.0.15.0 0.0.0.255
#
pim
 static-rp 2.2.2.2
#
return
