hostname CE2
!
ethernet cfm global
!
ethernet cfm domain MD1 level 7
 service MA1
!
ethernet cfm domain MD2 level 7
 service MA2
!
vlan 10
!
interface Vlan10
 ip address 10.1.1.2 255.255.255.0
!
interface GigabitEthernet1/0/0
 switchport mode trunk
 switchport trunk allowed vlan 10
 no shutdown
 service instance 10 ethernet
  ethernet cfm mep domain MD1 service MA1 2 outward
  ethernet cfm mep 2 domain MD1 service MA1 continuity-check
  ethernet cfm mep 2 domain MD1 service MA1 remote-mep 1
!
interface GigabitEthernet2/0/0
 switchport mode trunk
 switchport trunk allowed vlan 10
 no shutdown
 service instance 10 ethernet
  ethernet cfm mep domain MD2 service MA2 4 outward
  ethernet cfm mep 4 domain MD2 service MA2 continuity-check
  ethernet cfm mep 4 domain MD2 service MA2 remote-mep 3
!
end