hostname PE
!
bridge-domain 2
!
interface GigabitEthernet1/0/0
 no shutdown
 service instance 2 ethernet
  encapsulation dot1q 2
  rewrite ingress tag pop 1 symmetric
  bridge-domain 2
!
interface GigabitEthernet2/0/0
 no shutdown
 service instance 2 ethernet
  encapsulation dot1q 2
  rewrite ingress tag pop 1 symmetric
  bridge-domain 2
!
l2vpn bridge group BD_GROUP
 bridge-domain BD_2
!
end