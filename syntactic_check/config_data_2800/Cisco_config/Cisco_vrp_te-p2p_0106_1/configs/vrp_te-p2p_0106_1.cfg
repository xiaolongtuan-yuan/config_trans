hostname LSRB
!
mpls ldp
 router-id 2.2.2.2
!
mpls traffic-eng tunnels
 autoroute announce
 autoroute destination
!
router ospf 1
 mpls traffic-eng router-id Loopback0
 area 0
  mpls traffic-eng passive-interface default
  network 3.1.1.0 0.0.0.255 area 0
  network 3.2.1.0 0.0.0.255 area 0
  network 2.1.1.0 0.0.0.255 area 0
  network 2.2.2.2 0.0.0.0 area 0
!
interface GigabitEthernet0/0/0/0
 shutdown
 ipv4 address 3.2.1.1 255.255.255.0
 mpls traffic-eng tunnels
 mpls traffic-eng rsvp
!
interface GigabitEthernet0/0/0/1
 shutdown
 ipv4 address 3.1.1.1 255.255.255.0
 mpls traffic-eng tunnels
 mpls traffic-eng rsvp
!
interface GigabitEthernet0/0/0/2
 shutdown
 ipv4 address 2.1.1.2 255.255.255.0
 mpls traffic-eng tunnels
 mpls traffic-eng rsvp
!
interface Loopback0
 ipv4 address 2.2.2.2 255.255.255.255
!
end