hostname PE2

mpls ip
mpls ldp router-id Loopback1 force
!
interface GigabitEthernet1/0/0
 no shutdown

interface GigabitEthernet1/0/0.10
 encapsulation dot1Q 10
 xconnect vfi VSI1

interface GigabitEthernet2/0/0
 no shutdown
 ip address 192.168.20.1 255.255.255.0
 mpls ip

interface Loopback1
 ip address 2.2.2.2 255.255.255.255

router ospf 1
 router-id 2.2.2.2
 network 2.2.2.2 0.0.0.0 area 0
 network 192.168.20.0 0.0.0.255 area 0
!
l2vpn 
!
l2vpn vfi context VSI1
 vpn id 20
 !
!
ethernet cfm
!
ethernet cfm domain MD1
!
ethernet cfm service MD2
!
interface GigabitEthernet1/0/0.10
 ethernet cfm mep domain MD1 service MD2 mep-id 4
 ethernet cfm continuity-check transmission
 ethernet cfm continuity-check reception
!
end