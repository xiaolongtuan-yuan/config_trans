hostname LSRA

mpls label protocol ldp

interface Eth-Trunk1
 ip address 10.1.1.1 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 mpls traffic-eng authentication key-chain MPLS_AUTH
 mpls traffic-eng authentication hello
 mpls traffic-eng authentication window-size 32

interface GigabitEthernet1/0/0
 no shutdown
 channel-group 1 mode desirable

interface GigabitEthernet2/0/0
 no shutdown
 channel-group 1 mode desirable

interface GigabitEthernet3/0/0
 no shutdown
 channel-group 1 mode desirable

interface Loopback1
 ip address 1.1.1.1 255.255.255.255

interface Tunnel1
 ip unnumbered Loopback1
 tunnel mode mpls traffic-eng
 tunnel destination 3.3.3.3
 tunnel mpls traffic-eng tunnel-id 1

router ospf 1
 mpls traffic-eng area
 network 1.1.1.1 0.0.0.0 area 0
 network 10.1.1.0 0.0.0.255 area 0

mpls traffic-eng router-id Loopback1

mpls traffic-eng auto-bw

mpls traffic-eng log-adjacency-changes

mpls traffic-eng multicast-intact

mpls traffic-eng affinity 1

mpls traffic-eng priority 7

mpls traffic-eng logging bandwidth-changes

mpls traffic-eng logging state-changes

mpls traffic-eng logging path-errors

mpls traffic-eng logging reoptimize-events

mpls traffic-eng logging bandwidth-events

mpls traffic-eng logging resv-errors

