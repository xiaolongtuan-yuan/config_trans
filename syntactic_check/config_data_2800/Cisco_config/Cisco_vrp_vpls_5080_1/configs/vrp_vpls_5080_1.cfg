hostname PE1

mpls label protocol ldp
mpls ip

mpls l2vpn
vsi a2
 pw signal ldp
  vsi-id 2
  peer 3.3.3.9
   tunnel-policy policy1
  exit
 exit

mpls traffic-eng tunnels
path-option 1 explicit name path2pe2
  next-address strict ipv4 3.3.3.9
 exit

mpls ldp router-id Loopback1 force

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.10.1.1 255.255.255.0
 exit

interface GigabitEthernet2/0/0
 no shutdown
 exit

interface GigabitEthernet2/0/0.1
 encapsulation dot1Q 10
 xconnect vfi a2
 exit

interface Loopback1
 ip address 1.1.1.9 255.255.255.255
 exit

interface Tunnel10
 ip unnumbered Loopback1
 tunnel mode mpls traffic-eng
 tunnel destination 3.3.3.9
 tunnel mpls traffic-eng autoroute announce
 tunnel mpls traffic-eng path-option 1 explicit name path2pe2
 exit

router ospf 1
 mpls traffic-eng router-id Loopback1
 segment-routing mpls
 area 0
  passive-interface default
  network 1.1.1.9 0.0.0.0 area 0
  network 10.10.1.0 0.0.0.255 area 0
  mpls traffic-eng area
 exit

tunnel-te policy policy1
 destination 3.3.3.9
 tunnel-id 100
 exit

end