hostname LSRA

mpls label protocol ldp
mpls ip

interface GigabitEthernet1/0/0
no shutdown
ip address 2.1.1.1 255.255.255.0
mpls ip
mpls traffic-eng tunnels
mpls traffic-eng bandwidth 100000
mpls traffic-eng bandwidth 100000 100000
mpls traffic-eng auto-bw

interface Loopback1
ip address 1.1.1.1 255.255.255.255

interface Tunnel10
ip unnumbered Loopback1
tunnel mode mpls traffic-eng
tunnel destination 3.3.3.3
tunnel mpls traffic-eng autoroute announce
tunnel mpls traffic-eng priority 7
tunnel mpls traffic-eng bandwidth 10000
tunnel mpls traffic-eng path-option 10 explicit name Tunnel10

ip route 2.2.2.2 255.255.255.255 2.1.1.2
ip route 3.3.3.3 255.255.255.255 2.1.1.2

