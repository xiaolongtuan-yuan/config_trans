hostname PE1
!
mpls ldp router-id Loopback1 force
!
l2vpn vfi context VPLSAD1
!
interface Loopback1
 ip address 1.1.1.9 255.255.255.255
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.10.1.1 255.255.255.0
 mpls ip
!
interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.10.2.1 255.255.255.0
 mpls ip
!
interface GigabitEthernet1/0/0.1
 no shutdown
 encapsulation dot1Q 10
 service instance 10 ethernet
  bridge-domain 100
!
bridge-domain 100
 member vfi VPLSAD1
!
router bgp 100
 bgp router-id 1.1.1.9
 neighbor 2.2.2.9 remote-as 100
 neighbor 2.2.2.9 update-source Loopback1
 neighbor 3.3.3.9 remote-as 100
 neighbor 3.3.3.9 update-source Loopback1
 !
 address-family ipv4 unicast
  neighbor 2.2.2.9 activate
  neighbor 3.3.3.9 activate
 exit-address-family
 !
 address-family l2vpn vpls
  neighbor 2.2.2.9 activate
  neighbor 2.2.2.9 send-community extended
  neighbor 3.3.3.9 activate
  neighbor 3.3.3.9 send-community extended
 exit-address-family
!
router ospf 1
 router-id 1.1.1.9
 network 1.1.1.9 0.0.0.0 area 0
 network 10.10.1.0 0.0.0.255 area 0
 network 10.10.2.0 0.0.0.255 area 0
!
end