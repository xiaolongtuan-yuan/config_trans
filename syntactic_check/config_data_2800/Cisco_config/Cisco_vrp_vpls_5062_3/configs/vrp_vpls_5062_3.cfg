hostname PE1
!
mpls label protocol ldp
mpls ldp router-id Loopback1 force
!
interface GigabitEthernet1/0/0
 no shutdown
!
interface GigabitEthernet1/0/0.1
 encapsulation dot1Q 10
 xconnect vfi vplsad1
!
interface GigabitEthernet1/0/0.1 l2transport
 xconnect vfi vplsad1
!
interface GigabitEthernet1/0/0
 ip address 10.10.2.1 255.255.255.0
 mpls ip
!
interface GigabitEthernet1/0/0
 ip address 10.10.1.1 255.255.255.0
 mpls ip
!
interface Loopback1
 ip address 1.1.1.9 255.255.255.255
!
router bgp 100
 neighbor 2.2.2.9 remote-as 100
 neighbor 2.2.2.9 update-source Loopback1
 neighbor 3.3.3.9 remote-as 100
 neighbor 3.3.3.9 update-source Loopback1
 !
 address-family ipv4 unicast
  neighbor 2.2.2.9 activate
  neighbor 3.3.3.9 activate
 exit-address-family
 !
 address-family l2vpn vplsad
  neighbor 2.2.2.9 activate
  neighbor 3.3.3.9 activate
  exit-address-family
 !
!
router ospf 1
 router-id 1.1.1.9
 network 1.1.1.9 0.0.0.0 area 0
 network 10.10.1.0 0.0.0.255 area 0
 network 10.10.2.0 0.0.0.255 area 0
!
end