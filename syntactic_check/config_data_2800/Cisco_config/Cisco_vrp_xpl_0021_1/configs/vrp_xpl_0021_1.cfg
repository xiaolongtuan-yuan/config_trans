hostname DeviceB
!
interface GigabitEthernet3/0/0
 no shutdown
 ip address 1.1.5.1 255.255.255.0
!
interface GigabitEthernet3/0/1
 no shutdown
 ip address 1.1.4.2 255.255.255.0
!
interface GigabitEthernet3/0/2
 no shutdown
 ip address 1.1.3.2 255.255.255.0
!
router bgp 100
 no bgp default ipv4-unicast
 neighbor 1.1.3.1 remote-as 200
 neighbor 1.1.4.1 remote-as 200
 neighbor 1.1.5.2 remote-as 100
 !
 address-family ipv4
  no synchronization
  neighbor 1.1.3.1 activate
  neighbor 1.1.4.1 activate
  neighbor 1.1.5.2 activate
  network 1.1.3.0 mask 255.255.255.0
  network 1.1.4.0 mask 255.255.255.0
  network 1.1.5.0 mask 255.255.255.0
 exit-address-family
!
end