hostname Device1
!
feature isis
feature bgp
feature nv overlay
!
interface Loopback0
 no shutdown
 ip address 1.1.1.1/32
!
router bgp 100
 address-family l2vpn evpn
  retain route-target all
 neighbor 2.2.2.2
  remote-as 100
  update-source loopback0
  address-family l2vpn evpn
   route-reflector-client
   send-community extended
 neighbor 3.3.3.3
  remote-as 100
  update-source loopback0
  address-family l2vpn evpn
   route-reflector-client
   send-community extended
!