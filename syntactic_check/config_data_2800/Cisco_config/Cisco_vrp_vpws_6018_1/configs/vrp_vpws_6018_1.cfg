hostname CE2

bfd
!
interface Vlan2
 ip address 10.2.1.3 255.255.255.0
!
interface GigabitEthernet1/0/0
 switchport mode trunk
 no shutdown
 switchport trunk allowed vlan 2
!
interface GigabitEthernet1/0/1
 switchport mode trunk
 no shutdown
 switchport trunk allowed vlan 2
!
bfd all-interfaces
!
bfd template single-hop CPE1
!
bfd discriminator local 61
bfd discriminator remote 16
!
bfd discriminator local 62
bfd discriminator remote 26
!
interface Vlan2
 bfd address 10.2.1.1
 bfd multipath CPE1
!
interface Vlan2
 bfd address 10.2.1.2
 bfd multipath CPE1
!
end

