hostname PE1
!
mpls ldp router-id Loopback1 force
!
l2vpn
  vpn id 1
 !
!
interface GigabitEthernet1/0/0.1
 no shutdown
 encapsulation dot1Q 10
 service instance 10 ethernet
  rewrite ingress tag pop 1 symmetric
  bridge-domain 1 split-horizon group 10
 !
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 192.168.1.1 255.255.255.0
 mpls ip
!
interface Loopback1
 ip address 1.1.1.9 255.255.255.255
!
router bgp 100
 bgp log-neighbor-changes
 neighbor 3.3.3.9 remote-as 100
 neighbor 3.3.3.9 update-source Loopback1
 !
 address-family vpnv4
  neighbor 3.3.3.9 activate
  neighbor 3.3.3.9 send-community extended
 exit-address-family
 !
 address-family l2vpn vpls
  neighbor 3.3.3.9 activate
  neighbor 3.3.3.9 send-community both
 exit-address-family
!
router ospf 1
 network 1.1.1.9 0.0.0.0 area 0
 network 192.168.1.0 0.0.0.255 area 0
!
end