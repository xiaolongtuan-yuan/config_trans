hostname PE2
!
mpls ip
!
interface Serial2/0/1:1
 ppp multilink
 no shutdown
!
interface Multilink1
 no shutdown
 ppp multilink
 ppp multilink fragment delay 10
 ppp multilink fragment-threshold 1000
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.2.2.2 255.255.255.0
 mpls ip
!
interface Loopback0
 ip address 192.168.3.3 255.255.255.255
!
router ospf 1
 network 192.168.3.3 0.0.0.0 area 0
 network 10.2.2.0 0.0.0.255 area 0
!
l2vpn
 pseudowire-class 3to1
  encapsulation mpls
!
interface Serial2/0/1:1
  xconnect 192.168.2.2 100 pw-class 3to1
!
interface Multilink1
  xconnect 192.168.2.2 200 pw-class 3to1
!
mpls ldp
!
end