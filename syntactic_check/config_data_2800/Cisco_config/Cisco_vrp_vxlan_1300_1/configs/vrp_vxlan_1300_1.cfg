hostname Device2
!
feature ospf
feature bgp
feature interface-vlan
feature vn-segment-vlan-based
feature nv overlay
!
vlan 10
  name VXLAN_VLAN10
  vn-segment 10000
!
vrf context vpn1
  rd 11:11
  address-family ipv4 unicast
    route-target both 11:1
!
interface Vlan10
  no shutdown
  vrf member vpn1
  ip address 10.1.1.1/24
!
!
interface Loopback0
  no shutdown
  ip address 2.2.2.2/32
!
interface nve1
  no shutdown
  source-interface loopback0
  host-reachability protocol bgp
!
  member vni 10000
    mcast-group 239.1.1.1
!
!
router bgp 100
  router-id 2.2.2.2
  neighbor 1.1.1.1
    remote-as 100
    update-source loopback0
    address-family l2vpn evpn
      send-community extended
!
  address-family l2vpn evpn
    retain route-target all
