hostname PE3
!
mpls ldp router-id Loopback1 force
!
pseudowire-class STATIC-PW
 encapsulation mpls
!
l2vpn vfi context LDP1
 vpn id 1
!
interface Loopback1
 ip address 5.5.5.5 255.255.255.255
!
interface GigabitEthernet1/0/1
 no shutdown
 ip address 172.16.35.5 255.255.255.0
 mpls ip
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 172.16.45.5 255.255.255.0
 mpls ip
!
interface GigabitEthernet1/0/3
 no shutdown
!
interface GigabitEthernet1/0/3.1
 no shutdown
 encapsulation dot1Q 10
 xconnect vfi LDP1
!
router ospf 1
 network 5.5.5.5 0.0.0.0 area 0
 network 172.16.35.0 0.0.0.255 area 0
 network 172.16.45.0 0.0.0.255 area 0
!
end