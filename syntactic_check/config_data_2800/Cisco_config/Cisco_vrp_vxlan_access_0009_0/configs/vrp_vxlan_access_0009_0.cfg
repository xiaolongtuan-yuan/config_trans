hostname DeviceA
!
feature nv overlay
feature interface-vlan
feature vn-segment-vlan-based
!
vlan 10
  vn-segment 10
!
interface Vlan10
  no shutdown
!
interface Loopback1
  no shutdown
  ip address 1.1.1.1/32
!
ip route 1.1.1.2/32 192.168.1.2
!
interface nve1
  no shutdown
  source-interface loopback1
  host-reachability protocol bgp
  member vni 10
!