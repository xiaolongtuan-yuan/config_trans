hostname LSRA
!
mpls ldp router-id Loopback0 force
!
mpls traffic-eng
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface Tunnel10
 ip unnumbered Loopback0
 tunnel destination 3.3.3.3
!
interface Tunnel11
 ip unnumbered Loopback0
 tunnel destination 3.3.3.3
!
interface GigabitEthernet1/0/0
 ip address 2.1.1.1 255.255.255.0
 no shutdown
 mpls ip
 mpls traffic-eng tunnels
 ip rsvp bandwidth
!
interface GigabitEthernet1/0/1
 ip address 4.1.1.1 255.255.255.0
 no shutdown
 mpls ip
 mpls traffic-eng tunnels
 ip rsvp bandwidth
ip route 2.2.2.2 255.255.255.255 2.1.1.2
ip route 3.3.3.3 255.255.255.255 2.1.1.2
ip route 3.3.3.3 255.255.255.255 4.1.1.2
ip route 4.4.4.4 255.255.255.255 4.1.1.2
!
end