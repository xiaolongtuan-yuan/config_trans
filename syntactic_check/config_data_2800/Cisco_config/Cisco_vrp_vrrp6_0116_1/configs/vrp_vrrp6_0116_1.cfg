hostname DeviceB
!
ipv6 unicast-routing
!
interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8::2/64
 vrrp 1 ipv6 FE80::1
 vrrp 2 ipv6 FE80::2
 vrrp 2 priority 120
 ipv6 ospf 1 area 0.0.0.0
!
interface GigabitEthernet2/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8:2::1/64
 ipv6 ospf 1 area 0.0.0.0
!
ipv6 router ospf 1
 router-id 1.1.1.1
!
end