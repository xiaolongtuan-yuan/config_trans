hostname CE1
!
ethernet cfm global
ethernet cfm domain md3 level 7
ethernet cfm service ma3 domain md3
!
interface GigabitEthernet3/0/1.1
 encapsulation dot1Q 200
 ethernet cfm mep domain md3 service ma3 id 3 direction down
 ethernet cfm mep domain md3 service ma3 id 3 continuity-check
 ethernet cfm mep domain md3 service ma3 id 4
 ethernet cfm mep crosscheck start delay 0 timeout 300
 ethernet cfm traceroute cache
!
end