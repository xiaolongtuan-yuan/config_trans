hostname CE1
!
ethernet cfm
  service MA vlan 2 MA3
!
ethernet cfm traceroute cache
!
interface Vlan2
 no shutdown
!
interface GigabitEthernet1/0/1
 no shutdown
 switchport mode trunk
 switchport trunk allowed vlan 2
 ethernet cfm mep domain MD3 service MA3 mep 3
 ethernet cfm mip auto-create level 3
 service instance 2 ethernet
  encapsulation dot1q 2
!
end