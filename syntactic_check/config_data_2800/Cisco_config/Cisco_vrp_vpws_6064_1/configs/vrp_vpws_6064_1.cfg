hostname PE1
!
mpls ldp router-id Loopback1
!
mpls ip
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.10.1.1 255.255.255.0
 mpls ip
!
interface Loopback1
 ip address 1.1.1.9 255.255.255.255
!
!
l2vpn
  vpn id 1
!
interface GigabitEthernet1/0/0
 no shutdown
 service instance 1 ethernet
  encapsulation default
  rewrite ingress tag pop 1 symmetric
  xconnect vfi vpn1
!
router bgp 100
 neighbor 2.2.2.9 remote-as 100
 neighbor 2.2.2.9 update-source Loopback1
 neighbor 4.4.4.9 remote-as 200
 neighbor 4.4.4.9 ebgp-multihop 255
 neighbor 4.4.4.9 update-source Loopback1
 !
 address-family ipv4
  neighbor 2.2.2.9 activate
  neighbor 2.2.2.9 send-label
  neighbor 4.4.4.9 activate
 exit-address-family
 !
 address-family vpnv4
  neighbor 4.4.4.9 activate
  neighbor 4.4.4.9 send-community extended
 exit-address-family
!
router ospf 1
 network 1.1.1.9 0.0.0.0 area 0
 network 10.10.1.0 0.0.0.255 area 0
!
end