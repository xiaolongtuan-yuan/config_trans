hostname PE1
!
mpls ip
!
mpls ldp router-id Loopback1 force
!
interface GigabitEthernet1/0/0
 no shutdown
 no ip address
!
interface GigabitEthernet1/0/0.1
 encapsulation dot1Q 100
 xconnect 2.2.2.2 100 encapsulation mpls pw-class 1to2
!
interface GigabitEthernet1/0/0.2
 encapsulation dot1Q 200
 xconnect 3.3.3.3 200 encapsulation mpls pw-class 1to3
!
interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.2.1.1 255.255.255.252
 mpls ip
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.4.1.1 255.255.255.252
 mpls ip
!
interface Loopback1
 ip address 1.1.1.1 255.255.255.255
!
router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.2.1.0 0.0.0.3 area 0
 network 10.4.1.0 0.0.0.3 area 0
!
pseudowire-class 1to2
 encapsulation mpls
!
pseudowire-class 1to3
 encapsulation mpls
!
bfd-template single-hop VPWS_BFD
 interval min-tx 50 min-rx 50 multiplier 3
!
end