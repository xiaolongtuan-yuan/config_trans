hostname DeviceA
!
interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8::1/64
  priority 120
  preempt delay minimum 20
 ipv6 ospf 1 area 0
!
interface GigabitEthernet2/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8:1::1/64
 ipv6 ospf 1 area 0
!
ipv6 router ospf 1
 router-id 1.1.1.1
!
end