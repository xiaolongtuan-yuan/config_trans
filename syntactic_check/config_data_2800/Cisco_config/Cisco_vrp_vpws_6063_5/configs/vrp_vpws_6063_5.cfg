hostname PE2
!
router ospf 1
 network 10.20.1.0 0.0.0.255 area 0
 network 4.4.4.9 0.0.0.0 area 0
!
mpls ldp router-id Loopback1
mpls ip
!
l2vpn vfi context vpn1
 vpn id 1
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.20.1.2 255.255.255.0
 mpls ip
!
interface GigabitEthernet2/0/0
 no shutdown
 service instance 1 ethernet
  encapsulation dot1q 200
  rewrite ingress tag pop 1 symmetric
  bridge-domain 200
!
interface Loopback1
 ip address 4.4.4.9 255.255.255.255
!
pseudowire-class vpn1
 encapsulation mpls
 control-word
!
 pseudowire-class vpn1
!
router bgp 200
 neighbor 3.3.3.9 remote-as 200
 neighbor 3.3.3.9 update-source Loopback1
 !
 address-family ipv4
  no synchronization
  neighbor 3.3.3.9 activate
 !
 address-family l2vpn vpls
  neighbor 3.3.3.9 activate
  neighbor 3.3.3.9 send-community extended
  neighbor 3.3.3.9 send-label
!
end