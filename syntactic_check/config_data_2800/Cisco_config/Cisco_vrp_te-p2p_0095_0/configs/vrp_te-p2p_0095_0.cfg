hostname LSRA
!
mpls ip
!
mpls traffic-eng
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 192.168.1.1 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 ip rsvp bandwidth 50000
!
interface Loopback1
 ip address 1.1.1.1 255.255.255.255
!
interface Tunnel1
 ip unnumbered Loopback1
 tunnel destination 3.3.3.3
!
interface Tunnel2
 ip unnumbered Loopback1
 tunnel destination 3.3.3.3
!
end