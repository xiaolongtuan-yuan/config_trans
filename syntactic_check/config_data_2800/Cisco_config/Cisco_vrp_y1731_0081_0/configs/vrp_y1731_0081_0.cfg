hostname CE1
!
ethernet cfm global
!
interface GigabitEthernet1/0/0.1
 encapsulation dot1Q 1
 service instance 1 ethernet
  service-policy output qos-profile-1
 !
!
policy-map qos-profile-1
 class class-default
  police cir 10000000 pir 12000000 conform-action transmit exceed-action drop
!
ethernet cfm domain md1 level 7
!
ethernet cfm service ma1 domain md1
!
interface GigabitEthernet1/0/0.1
 ethernet cfm mep domain md1 service ma1 id 1 direction down
 ethernet cfm mep domain md1 service ma1 id 1 continuity-check
!
end