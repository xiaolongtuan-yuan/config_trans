hostname PE2
!
mpls ip
!
l2vpn
 pseudowire-class VPLS_PW
  encapsulation mpls
!
 vpn id 1
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.30.1.2 255.255.255.0
 mpls ip
!
interface Loopback1
 ip address 4.4.4.9 255.255.255.255
!
router bgp 200
 neighbor 1.1.1.9 remote-as 100
 neighbor 1.1.1.9 update-source Loopback1
 neighbor 3.3.3.9 remote-as 200
 neighbor 3.3.3.9 update-source Loopback1
 !
 address-family ipv4
  neighbor 1.1.1.9 activate
  neighbor 3.3.3.9 activate
 exit-address-family
 !
 address-family l2vpn vpls
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-community extended
  neighbor 3.3.3.9 activate
  neighbor 3.3.3.9 send-community extended
 exit-address-family
!
router ospf 1
 network 4.4.4.9 0.0.0.0 area 0
 network 10.30.1.0 0.0.0.255 area 0
!
end