hostname LSRC
!
mpls ip
!
mpls traffic-eng
!
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 3.2.1.2 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 ip rsvp bandwidth 100000
!
interface Loopback1
 ip address 3.3.3.3 255.255.255.255
!
interface Tunnel200
 ip unnumbered Loopback1
 tunnel destination 1.1.1.1
!
ip route 1.1.1.1 255.255.255.255 GigabitEthernet1/0/0 3.2.1.1
ip route 2.2.2.2 255.255.255.255 GigabitEthernet1/0/0 3.2.1.1
!
end