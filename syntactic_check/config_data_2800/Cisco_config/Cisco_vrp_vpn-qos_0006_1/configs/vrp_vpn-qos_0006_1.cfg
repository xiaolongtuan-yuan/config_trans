hostname PE1
!
mpls ip
!
pseudowire-class PW_CLASS
 encapsulation mpls
 load-balance flow-label
!
interface GigabitEthernet1/0/0
 no shutdown
!
interface GigabitEthernet1/0/0.1
 no shutdown
 encapsulation dot1Q 10
 service instance 10 ethernet
  xconnect 3.3.3.9 101 pw-class PW_CLASS
!
class-map match-any PW_CLASSIFIER
 match any
!
policy-map PW_QOS
 class PW_CLASSIFIER
  police cir 2000000 bc 8000 pir 3000000 be 12000
   conform-action transmit
   exceed-action transmit
   violate-action drop
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.1.1.1 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 ip rsvp bandwidth 5000
 service-policy output PW_QOS
!
interface Loopback1
 ip address 1.1.1.9 255.255.255.255
!
interface Tunnel10
 ip unnumbered Loopback1
 tunnel destination 3.3.3.9
!
router ospf 1
 mpls traffic-eng router-id Loopback1
 mpls traffic-eng area 0
 network 1.1.1.9 0.0.0.0 area 0
 network 10.1.1.0 0.0.0.255 area 0
!
end