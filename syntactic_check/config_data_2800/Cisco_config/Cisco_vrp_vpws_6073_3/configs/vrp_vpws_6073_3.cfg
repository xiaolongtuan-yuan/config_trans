hostname PE1
!
mpls ldp router-id Loopback0
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface Tunnel1
 ip unnumbered Loopback0
 tunnel destination 2.2.2.2
!
interface GigabitEthernet1/0/2.100
 no shutdown
 encapsulation dot1Q 100
!
router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
!
end