hostname PE1
mpls ip
mpls ldp router-id Loopback1 force
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.10.1.1 255.255.255.0
 mpls ip
interface Loopback1
 ip address 1.1.1.9 255.255.255.255
!
l2vpn bridge group VPN1
 bridge-domain VPN1
  interface GigabitEthernet1/0/0
!
l2vpn vfi context VPN1
 vpn id 1
!
router bgp 100
 bgp log-neighbor-changes
 neighbor 2.2.2.9 remote-as 100
 neighbor 2.2.2.9 update-source Loopback1
 !
 address-family ipv4 unicast
  no synchronization
  neighbor 2.2.2.9 activate
 !
 address-family l2vpn vpls
  neighbor 2.2.2.9 activate
  neighbor 2.2.2.9 send-community extended
!
router ospf 1
 router-id 1.1.1.9
 network 1.1.1.9 0.0.0.0 area 0
 network 10.10.1.0 0.0.0.255 area 0
end