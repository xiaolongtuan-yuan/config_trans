hostname CE2
!
vlan 2
!
ethernet cfm domain MD1
 service MA1
!
ethernet cfm mep crossconnect MD1 MA1 4 interface GigabitEthernet1/0/1
ethernet cfm mep crossconnect MD1 MA1 3 peer
!
interface GigabitEthernet1/0/1
 switchport mode trunk
 switchport trunk allowed vlan 2
 ethernet cfm mep domain MD1 service MA1 mep-id 4
 ethernet cfm mep domain MD1 service MA1 continuity-check transmission enable
 ethernet cfm mep domain MD1 service MA1 continuity-check reception enable
 no shutdown
!
end