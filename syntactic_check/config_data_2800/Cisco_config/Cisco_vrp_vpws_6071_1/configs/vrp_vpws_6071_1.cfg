hostname CE2
!
vlan 10
!
ethernet cfm global
!
interface Vlan10
 ip address 10.1.1.2 255.255.255.0
!
interface GigabitEthernet1/0/0
 switchport mode trunk
 switchport trunk allowed vlan 10
 no shutdown
 ethernet cfm mep domain md1 service ma1 2
 ethernet cfm mep 2 domain md1 service ma1 direction outward
 ethernet cfm mep 2 domain md1 service ma1 continuity-check interval 1s
 ethernet cfm mep 2 domain md1 service ma1 remote-mep 1
!
interface GigabitEthernet2/0/0
 switchport mode trunk
 switchport trunk allowed vlan 10
 no shutdown
 ethernet cfm mep domain md2 service ma2 4
 ethernet cfm mep 4 domain md2 service ma2 direction outward
 ethernet cfm mep 4 domain md2 service ma1 continuity-check interval 1s
 ethernet cfm mep 4 domain md2 service ma1 remote-mep 3
!
ethernet cfm domain md1 level 7
 service ma1
!
ethernet cfm domain md2 level 7
 service ma2
!
end