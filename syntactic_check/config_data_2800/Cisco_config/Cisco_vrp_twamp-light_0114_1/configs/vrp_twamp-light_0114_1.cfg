hostname DeviceB
!
mpls ldp router-id Loopback0
!
vrf definition CDMA-RAN
 rd 4134:3060
 !
 address-family ipv4
  route-target export 4134:306000
  route-target import 4134:306000
 exit-address-family
!
interface Loopback0
 ip address 10.0.0.3 255.255.255.255
 ip router isis 1
!
interface GigabitEthernet1/0/0.31
 encapsulation dot1Q 31
 mtu 9500
 ip address 3.0.0.6 255.255.255.252
 ip router isis 1
 mpls ip
!
interface GigabitEthernet1/0/1.31
 encapsulation dot1Q 1
 vrf forwarding CDMA-RAN
 ip address 192.168.2.2 255.255.255.0
!
ip sla 1
 dest-port 6000
 control disable

end