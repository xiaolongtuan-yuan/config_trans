hostname DeviceB
!
track 1 ip sla 1 reachability
!
ip sla 1
 icmp-echo 10.1.1.1 source-ip 10.1.1.2
 frequency 10
!
ip sla schedule 1 life forever start-time now
!
bfd-template single-hop TRACK_BFD
 interval min-tx 150 min-rx 150 multiplier 3
!
bfd map ipv4 10.1.1.1/32 GigabitEthernet1/0/0
 template TRACK_BFD
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.1.1.2 255.255.255.0
 standby version 2
 standby 1 ip 10.1.1.111
 standby 1 priority 150
 standby 1 preempt
 standby 1 track 1 decrement 40
 bfd echo
!
end