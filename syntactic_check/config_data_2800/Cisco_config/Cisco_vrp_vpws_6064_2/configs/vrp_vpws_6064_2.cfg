hostname ASBR1

mpls ldp lsr-id 2.2.2.9

interface GigabitEthernet1/0/0
no shutdown
ip address 10.10.1.2 255.255.255.0
mpls ip
mpls ldp autoconfig

interface GigabitEthernet2/0/0
no shutdown
ip address 10.20.1.1 255.255.255.0

interface Loopback1
ip address 2.2.2.9 255.255.255.255

router bgp 100
neighbor 1.1.1.9 remote-as 100
neighbor 1.1.1.9 update-source Loopback1
neighbor 10.20.1.2 remote-as 200
neighbor 10.20.1.2 update-source GigabitEthernet2/0/0
address-family ipv4 unicast
neighbor 1.1.1.9 activate
neighbor 1.1.1.9 route-policy policy1 export
neighbor 1.1.1.9 label advertise
neighbor 10.20.1.2 activate
neighbor 10.20.1.2 route-policy policy2 export
neighbor 10.20.1.2 label advertise tunnel

router ospf 1
area 0
network 2.2.2.9 0.0.0.0 area 0
network 10.10.1.0 0.0.0.255 area 0

route-map policy1 permit 10
match mpls experimental topmost 1
set mpls experimental topmost 1

route-map policy2 permit 10
set mpls experimental topmost 1

end