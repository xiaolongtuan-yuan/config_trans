hostname ASBR1
!
mpls ldp router-id Loopback0
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.10.1.2 255.255.255.0
 mpls ip
 mpls label protocol ldp
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.20.1.1 255.255.255.0
!
interface Loopback0
 ip address 2.2.2.9 255.255.255.255
!
router bgp 100
 neighbor 1.1.1.9 remote-as 100
 neighbor 1.1.1.9 update-source Loopback0
 neighbor 10.20.1.2 remote-as 200
 neighbor 10.20.1.2 ebgp-multihop 2
 !
 address-family ipv4
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-label
  neighbor 1.1.1.9 route-map POLICY1 out
  neighbor 10.20.1.2 activate
  neighbor 10.20.1.2 send-label
  neighbor 10.20.1.2 route-map POLICY2 out
  network 2.2.2.9 mask 255.255.255.255
!
router ospf 1
 network 2.2.2.9 0.0.0.0 area 0
 network 10.10.1.0 0.0.0.255 area 0
!
route-map POLICY1 permit 10
!
route-map POLICY2 permit 10
!
end