hostname PE2

mpls label protocol ldp

mpls ldp router-id Loopback1 force

interface POS1/0/0
 no shutdown

interface GigabitEthernet2/0/0
 no shutdown
 ip address 192.168.10.2 255.255.255.0
 mpls ip

interface Loopback1
 ip address 3.3.3.9 255.255.255.255

mpls l2vpn vfi vpn1 manual
 vpn id 100
 autodiscovery bgp signaling bgp
 route-target import 200:1
 route-target export 200:1
 exit

router bgp 100
 neighbor 1.1.1.9 remote-as 100
 neighbor 1.1.1.9 update-source Loopback1
 address-family ipv4
  neighbor 1.1.1.9 activate
 exit-address-family
 address-family l2vpn vpls
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-community
 exit-address-family

router ospf 1
 network 3.3.3.9 0.0.0.0 area 0
 network 192.168.10.0 0.0.0.255 area 0

