hostname DeviceA

mpls ip
mpls ldp router-id Loopback0 force
!
mpls ldp discovery targeted-hello accept
mpls ldp neighbor 10.0.0.2 targeted
!
mpls ldp session protection
!
router ospf 1
 router-id 10.0.0.1
 network 3.0.0.0 0.0.0.3 area 0.0.0.1
 network 10.0.0.1 0.0.0.0 area 0.0.0.1
!
interface Loopback0
 ip address 10.0.0.1 255.255.255.255
!
interface GigabitEthernet1/0/1.31
 encapsulation dot1Q 31
 mtu 9500
 ip address 3.0.0.1 255.255.255.252
 mpls ip
!
interface GigabitEthernet1/0/0.1
 encapsulation dot1Q 1
 mtu 9500
 service instance 1 ethernet
  xconnect 10.0.0.2 26 pw-class raw
 !
ip sla 1
