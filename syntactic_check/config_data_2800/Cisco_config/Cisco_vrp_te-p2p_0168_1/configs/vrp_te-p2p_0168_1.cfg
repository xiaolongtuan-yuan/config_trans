hostname LSRB
!
mpls traffic-eng tunnels
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 2.1.1.2 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 mpls traffic-eng bandwidth 100000
!
interface GigabitEthernet1/0/1
 no shutdown
 ip address 3.2.1.1 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 mpls traffic-eng bandwidth 100000
!
interface Loopback1
 ip address 2.2.2.2 255.255.255.255
!
ip route 1.1.1.1 255.255.255.255 2.1.1.1
ip route 3.3.3.3 255.255.255.255 3.2.1.2
!
router ospf 1
 mpls traffic-eng router-id Loopback1
 mpls traffic-eng area 0
 network 0.0.0.0 255.255.255.255 area 0
!
interface Tunnel10
 ip unnumbered Loopback1
 tunnel destination 3.3.3.3
!
interface Tunnel20
 ip unnumbered Loopback1
 tunnel destination 1.1.1.1
!
mpls traffic-eng auto-bw timers frequency 3600
mpls traffic-eng fast-reroute timers delay-recovery 30
mpls traffic-eng reoptimize events link-up
mpls traffic-eng reoptimize timers frequency 60
mpls traffic-eng logging reoptimization
mpls traffic-eng logging preemption
!
end