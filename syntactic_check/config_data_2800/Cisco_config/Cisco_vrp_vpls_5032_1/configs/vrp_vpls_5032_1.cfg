hostname SPE
!
mpls ip
!
mpls label protocol ldp
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.10.1.2 255.255.255.0
 mpls ip
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.20.1.1 255.255.255.0
 mpls ip
!
interface LoopBack1
 ip address 2.2.2.9 255.255.255.255
!
router ospf 1
 network 2.2.2.9 0.0.0.0 area 0
 network 10.20.1.0 0.0.0.255 area 0
 network 10.10.1.0 0.0.0.255 area 0
!
mpls ldp neighbor 1.1.1.9 targeted
!
vrf definition v123
 rd 1:123
!
interface GigabitEthernet1/0/0
 vrf forwarding v123
!
interface GigabitEthernet2/0/0
 vrf forwarding v123
!
mpls ldp router-id Loopback1 force
!
mpls l2vpn
 vfi v123 manual
  vpn id 123
  neighbor 3.3.3.9 pw-id 123
  neighbor 1.1.1.9 pw-id 123
!
mpls ldp neighbor 1.1.1.9 targeted
!
end