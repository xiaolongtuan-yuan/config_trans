hostname ASBR2
!
router ospf 1
 network 3.3.3.3 0.0.0.0 area 0
 network 10.30.1.0 0.0.0.255 area 0
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.20.1.2 255.255.255.252
 mpls ip
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.30.1.1 255.255.255.0
 mpls ip
!
interface Loopback1
 ip address 3.3.3.3 255.255.255.255
!
mpls ldp
!
router bgp 200
 neighbor 4.4.4.4 remote-as 200
 neighbor 4.4.4.4 update-source Loopback1
 neighbor 10.20.1.1 remote-as 100
 neighbor 10.20.1.1 update-source GigabitEthernet1/0/0
 !
 address-family ipv4
  neighbor 4.4.4.4 send-label
  neighbor 4.4.4.4 route-map policy1 out
  neighbor 10.20.1.1 send-label
  neighbor 10.20.1.1 route-map policy2 out
  network 4.4.4.4 mask 255.255.255.255
 exit-address-family
!
route-map policy1 permit 10
 set mpls-label
!
route-map policy2 permit 10
 set mpls-label
!
end