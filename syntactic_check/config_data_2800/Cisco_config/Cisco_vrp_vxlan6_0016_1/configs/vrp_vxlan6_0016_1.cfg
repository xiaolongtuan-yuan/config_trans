hostname Device2
!
vrf definition VPN1
 rd 11:11
 !
 address-family ipv4
  route-target export 11:1
  route-target import 11:1
 exit-address-family
!
bridge-domain 10
!
interface BDI10
 vrf forwarding VPN1
 ip address 10.1.1.1 255.255.255.0
 ipv6 enable
 ipv6 address FE80::1 link-local
!
interface GigabitEthernet1/0/0
 no shutdown
 ipv6 address 2001:DB8:2::1/64
 ospfv3 1 ipv6 area 0
!
interface GigabitEthernet1/0/1.1
 no shutdown
 encapsulation dot1Q 10
 service instance 10 ethernet
 bridge-domain 10
!
interface Loopback0
 no shutdown
 ipv6 address 2001:DB8:22::2/128
 ospfv3 1 ipv6 area 0
!
interface nve1
!
router ospfv3 1
 router-id 2.2.2.2
 address-family ipv6 unicast
  area 0
 exit-address-family
!
router bgp 100
 bgp router-id 2.2.2.2
 neighbor 2001:DB8:11::1 remote-as 100
 neighbor 2001:DB8:11::1 update-source Loopback0
 !
  neighbor 2001:DB8:11::1 activate
  neighbor 2001:DB8:11::1 send-community extended
  neighbor 2001:DB8:11::1 route-map SET_ENCAP out
 !
 address-family ipv4 unicast
  neighbor 2001:DB8:11::1 activate
 exit-address-family
!
route-map SET_ENCAP permit 10
!
end