hostname ASBR2
!
mpls ip
!
mpls traffic-eng
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.3.1.1 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 ip rsvp bandwidth 5000
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 192.168.1.2 255.255.255.0
!
interface Loopback1
 ip address 3.3.3.9 255.255.255.255
!
interface Tunnel10
 ip unnumbered Loopback1
 tunnel destination 4.4.4.9
!
router ospf 1
 mpls traffic-eng router-id Loopback1
 network 3.3.3.9 0.0.0.0 area 0
 network 10.3.1.0 0.0.0.255 area 0
!
router bgp 200
 bgp log-neighbor-changes
 neighbor 4.4.4.9 remote-as 200
 neighbor 4.4.4.9 update-source Tunnel10  
 !
 address-family ipv4
  no synchronization
  neighbor 4.4.4.9 activate
  neighbor 192.168.1.1 activate
 exit-address-family
 !
 address-family vpnv4
  neighbor 4.4.4.9 activate
  neighbor 192.168.1.1 activate
 exit-address-family
!
end