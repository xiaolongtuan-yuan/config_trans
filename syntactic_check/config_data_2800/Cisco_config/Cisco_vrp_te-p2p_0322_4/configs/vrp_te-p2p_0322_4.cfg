hostname PE4
!
mpls label protocol ldp
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.6.1.2 255.255.255.0
 mpls ip
!
interface Loopback1
 ip address 5.5.5.9 255.255.255.255
!
router isis
 net 49.0001.0000.0000.0005.00
 is-type level-1
 metric-style wide
 traffic-eng router-id Loopback1
!
end