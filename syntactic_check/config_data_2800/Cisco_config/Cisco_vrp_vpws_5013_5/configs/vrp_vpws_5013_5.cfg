hostname PE3
!
mpls ldp router-id Loopback1 force
!
key chain LDP-KEY
 key 1
  key-string 7 061A2B4C5D6F
!
bfd-template single-hop BFD-TEMPLATE
 interval min-tx 50 min-rx 50 multiplier 3
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.5.1.2 255.255.255.252
 mpls ip
 mpls ldp igp sync
 bfd template BFD-TEMPLATE
!
interface GigabitEthernet1/0/1
 no shutdown
 xconnect 1.1.1.1 200 encapsulation mpls pw-class VPWS-PW
!
interface Loopback1
 ip address 5.5.5.5 255.255.255.255
!
pseudowire-class VPWS-PW
 encapsulation mpls
!
router ospf 1
 network 5.5.5.5 0.0.0.0 area 0
 network 10.5.1.0 0.0.0.3 area 0
 bfd all-interfaces
!
  password key-chain LDP-KEY
!
mpls ldp discovery targeted-hello accept
mpls ldp discovery targeted-hello send
!
end