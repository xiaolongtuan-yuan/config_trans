hostname P
!
mpls ldp router-id Loopback0 force
!
mpls ip
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.10.1.2 255.255.255.0
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.20.1.1 255.255.255.0
!
interface Loopback1
 ip address 2.2.2.9 255.255.255.255
!
router ospf 1
 router-id 2.2.2.9
 mpls ldp autoconfig area 0.0.0.0
!
mpls traffic-eng router-id Loopback1
!
mpls traffic-eng area 0.0.0.0
!
mpls traffic-eng global-reserved-bandwidth 16000 47999
!
mpls traffic-eng link-management
!
mpls traffic-eng topology
!
mpls traffic-eng interface GigabitEthernet1/0/0
!
mpls traffic-eng interface GigabitEthernet2/0/0
!
end