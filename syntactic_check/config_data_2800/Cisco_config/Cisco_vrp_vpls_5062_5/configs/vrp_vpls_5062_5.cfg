hostname PE3
!
mpls ip
!
l2vpn
  vpn id 10001
!
interface GigabitEthernet1/0/0
 no shutdown
!
interface GigabitEthernet1/0/0.1
 encapsulation dot1Q 10
 service instance 10 ethernet
  xconnect vfi vplsad1
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.20.3.2 255.255.255.0
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.10.1.2 255.255.255.0
 mpls ip
!
interface Loopback1
 ip address 3.3.3.9 255.255.255.255
!
router bgp 100
 neighbor 1.1.1.9 remote-as 100
 neighbor 1.1.1.9 update-source Loopback1
 neighbor 2.2.2.9 remote-as 100
 neighbor 2.2.2.9 update-source Loopback1
 !
 address-family ipv4
  neighbor 1.1.1.9 activate
  neighbor 2.2.2.9 activate
  neighbor 1.1.1.9 send-community both
  neighbor 2.2.2.9 send-community both
 exit-address-family
!
router ospf 1
 network 3.3.3.9 0.0.0.0 area 0
 network 10.20.3.0 0.0.0.255 area 0
 network 10.10.1.0 0.0.0.255 area 0
 redistribute static subnets
!
ip route 10.10.1.0 255.255.255.0 Null0
!
end