hostname CE2
!
vlan 2
!
ethernet cfm
!
ethernet cfm domain md1 level 7
 service ma1
!
ethernet cfm mep 4 domain md1 service ma1 interface GigabitEthernet1/0/1 vlan 2
 ethernet cfm mep 4 domain md1 service ma1 direction outward
 ethernet cfm mep 4 domain md1 service ma1 continuity-check
 ethernet cfm mep 4 domain md1 service ma1 remote-mep 3
 ethernet cfm mep 4 domain md1 service ma1 loss-measurement test-id 2 dual-ended continual
!
interface GigabitEthernet1/0/1
 switchport mode trunk
 switchport trunk allowed vlan 2
 no shutdown
 ethernet cfm mip auto-create vlan 2
!
end