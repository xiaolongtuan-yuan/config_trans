hostname PE3
!
ethernet cfm global
!
ethernet cfm domain MD3 level 5
 service MA3
!
interface GigabitEthernet3/0/1.1
 encapsulation dot1Q 200
 service instance 200 ethernet
  ethernet cfm mep domain MD3 service MA3 4 inward
  ethernet cfm mep 4 domain MD3 service MA3 continuity-check
  ethernet cfm mep 4 domain MD3 service MA3 remote-mep 3
  ethernet cfm mib continuity-check alarm notification
!
ethernet cfm maintenance-points mep domain MD3 service MA3 mpid 4
 ethernet cfm delay-measurement domain MD3 service MA3 mpid 4
!
end