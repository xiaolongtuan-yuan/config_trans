hostname SPE1
!
mpls ip
!
l2vpn vfi context v100
 vpn id 100
!
l2vpn
 pseudowire-class VPLS_PW
  encapsulation mpls
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.10.1.1 255.255.255.0
 mpls ip
 mpls ldp autoconfig
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.10.3.1 255.255.255.0
 mpls ip
 mpls ldp autoconfig
!
interface Loopback1
 ip address 1.1.1.9 255.255.255.255
!
router ospf 1
 network 1.1.1.9 0.0.0.0 area 0
 network 10.10.1.0 0.0.0.255 area 0
 network 10.10.3.0 0.0.0.255 area 0
!
end