hostname ASBR1
!
mpls ip
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.10.1.2 255.255.255.0
 mpls ip
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.20.1.1 255.255.255.0
 mpls ip
!
interface Loopback1
 ip address 2.2.2.2 255.255.255.255
!
router bgp 100
 neighbor 1.1.1.1 remote-as 100
 neighbor 1.1.1.1 update-source Loopback1
 neighbor 10.20.1.2 remote-as 200
 neighbor 10.20.1.2 update-source GigabitEthernet2/0/0
 !
 address-family ipv4
  neighbor 10.20.1.2 send-label
  network 1.1.1.1 mask 255.255.255.255
 exit-address-family
!
ip route 1.1.1.1 255.255.255.255 Null0
!
class-map match-any EXP1
 match mpls experimental topmost 1
!
policy-map QOS_POLICY
 class EXP1
  set mpls experimental topmost 1
!
interface GigabitEthernet1/0/0
 service-policy output QOS_POLICY
!
interface GigabitEthernet2/0/0
 service-policy output QOS_POLICY
!
router ospf 1
 network 2.2.2.2 0.0.0.0 area 0
 network 10.10.1.0 0.0.0.255 area 0
!
end