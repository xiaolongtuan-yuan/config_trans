hostname Device3
!
vrf context evrf1
  rd 20:1
  address-family ipv4 unicast
    route-target import 11:1
    route-target export 11:1
!
vrf context vpn1
  rd 22:22
  address-family ipv4 unicast
    route-target import 11:1
    route-target export 11:1
!
vlan 20
  vn-segment 20000
!
evpn
  vni 20000 l2
    rd auto
    route-target import 11:1
    route-target export 11:1
!
feature ospfv3
router ospfv3 1
  router-id 3.3.3.3
  address-family ipv6 unicast
!
interface Vlan20
  vrf member vpn1
  ip address 10.2.1.1/24
  no shutdown
!
!
interface Loopback0
  ipv6 address 2001:DB8:33::3/128
!
interface nve1
  source-interface loopback0
  host-reachability protocol bgp
  member vni 20000 associate-vrf
!
feature bgp
router bgp 100
  neighbor 2001:DB8:11::1 remote-as 100
  update-source loopback0
  address-family l2vpn evpn
    send-community extended
  vrf vpn1
    address-family ipv4 unicast
      advertise l2vpn evpn
!