hostname PE1

service evc-type evpn
md level 1
ma level 1
mep crosscheck enable

evpn
 vrf evpna
  rd 100:1
  route-target export 1:1
  route-target import 1:1

mpls ldp router-id Loopback0

interface GigabitEthernet1/0/1.1
 no shutdown
 encapsulation dot1Q 2
 xconnect vfi evpna

interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.1.1 255.255.255.0
 mpls ip
 mpls ldp neighbor 2.2.2.2

interface Loopback0
 ip address 1.1.1.1 255.255.255.255

router bgp 100
 neighbor 2.2.2.2 remote-as 100
 neighbor 2.2.2.2 update-source Loopback0
 address-family ipv4 unicast
  neighbor 2.2.2.2 activate
  no synchronization
 exit-address-family
 address-family l2vpn evpn
  neighbor 2.2.2.2 activate
 exit-address-family

router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.1.1.0 0.0.0.255 area 0

 interface GigabitEthernet1/0/1.1
  mep crosscheck enable
  mep ccm-enable
  mep ccm-send interval 1
  mep ccm-receive interval 1
  mep crosscheck enable
  mep ccm-enable
  mep ccm-send interval 1
  mep ccm-receive interval 1
  loss-measurement dual-ended
  loss-measurement test-id 1
  loss-measurement send-mep 1 receive-mep 2

