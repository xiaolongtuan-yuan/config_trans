hostname CE1
!
ethernet cfm global
!
ethernet cfm domain md1 level 0
 service ma1
!
vlan configuration 2
!
interface GigabitEthernet1/0/1
 switchport mode trunk
 switchport trunk allowed vlan 2
 no shutdown
 ethernet cfm mep domain md1 service ma1 2 direction down
 ethernet cfm mep 2 domain md1 service ma1 continuity-check
 ethernet cfm mep 2 domain md1 service ma1 cross-check remote-mep 1
!
end