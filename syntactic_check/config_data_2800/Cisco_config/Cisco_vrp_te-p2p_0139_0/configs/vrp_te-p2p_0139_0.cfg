hostname LSRA

mpls label protocol ldp

mpls traffic-eng tunnels

interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.1.1.1 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 isis network point-to-point
 isis circuit-type level-2-only

interface Loopback1
 ip address 1.1.1.1 255.255.255.255
 isis network point-to-point
 isis circuit-type level-2-only

interface Tunnel10
 ip unnumbered Loopback1
 tunnel mode mpls traffic-eng
 tunnel destination 3.3.3.3
 tunnel mpls traffic-eng autoroute announce
 tunnel mpls traffic-eng priority 7
 tunnel mpls traffic-eng bandwidth 1000
 tunnel mpls traffic-eng path-option 1 explicit name tolsrc
 tunnel mpls traffic-eng path-option 2 explicit name tolsrf
 tunnel mpls traffic-eng path-option 3 explicit name tolsre

mpls traffic-eng area 1
mpls traffic-eng router-id Loopback1 force

router isis
 net 49.0001.0000.0000.0001.00
 metric-style wide
 is-type level-2-only
 mpls traffic-eng router-id Loopback1

mpls traffic-eng autoroute announce

mpls traffic-eng path-option 1 explicit name tolsrc
  next-address 10.1.1.2
  next-address 10.3.1.2

mpls traffic-eng path-option 2 explicit name tolsrf
  next-address 10.1.1.2
  next-address 10.2.1.2
  next-address 10.5.1.2

mpls traffic-eng path-option 3 explicit name tolsre
  next-address 10.1.1.2
  next-address 10.2.1.2
  next-address 10.4.1.2

mpls traffic-eng auto-bw collection

mpls traffic-eng auto-bw destination 3.3.3.3
  bandwidth 10000
  tunnel-name tolsrc

mpls traffic-eng auto-bw destination 5.5.5.5
  bandwidth 10000
  tunnel-name tolsre

mpls traffic-eng auto-bw destination 6.6.6.6
  bandwidth 10000
  tunnel-name tolsrf

mpls traffic-eng auto-bw
mpls traffic-eng auto-bw application

mpls traffic-eng auto-bw flow-based

