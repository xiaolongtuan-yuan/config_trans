hostname DeviceD
!
interface GigabitEthernet3/0/1
 no shutdown
 ip address 1.1.2.2 255.255.255.0
!
interface GigabitEthernet3/0/2
 no shutdown
 ip address 1.1.4.1 255.255.255.0
!
router bgp 200
 neighbor 1.1.2.1 remote-as 200
 neighbor 1.1.4.2 remote-as 100
 !
 address-family ipv4
  no synchronization
  neighbor 1.1.2.1 activate
  neighbor 1.1.4.2 activate
 exit-address-family
!
end