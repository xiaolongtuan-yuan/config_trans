hostname CE1
!
ethernet cfm global
!
ethernet cfm domain MD1 level 7
 service MA1
 service MA2
!
vlan 10
!
interface Vlan10
 ip address 10.10.1.1 255.255.255.0
!
interface GigabitEthernet1/0/0
 switchport mode trunk
 switchport trunk allowed vlan 10
 no shutdown
 service instance 10 ethernet
  encapsulation dot1q 10
  ethernet cfm mep domain MD1 service MA1 1 outward
  ethernet cfm mep 1 domain MD1 service MA1 continuity-check
  ethernet cfm mep 1 domain MD1 service MA1 remote-mep 2
!
interface GigabitEthernet2/0/0
 switchport mode trunk
 switchport trunk allowed vlan 10
 no shutdown
 service instance 10 ethernet
  encapsulation dot1q 10
  ethernet cfm mep domain MD1 service MA2 3 outward
  ethernet cfm mep 3 domain MD1 service MA2 continuity-check
  ethernet cfm mep 3 domain MD1 service MA2 remote-mep 4
!
end