hostname PE2

mpls lsr-id 3.3.3.9

mpls label protocol ldp

mpls l2vpn

vsi a2
 pwsignal ldp
  vsi-id 2
  peer 1.1.1.9 tnl-policy policy1

explicit-path name path2pe1
 next-address ipv4 unicast 1.1.1.9 sid 16300
 next-address ipv4 unicast 1.1.1.9 sid 16100

segment-routing mpls

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.20.1.2 255.255.255.0

interface GigabitEthernet2/0/0
 no shutdown

interface GigabitEthernet2/0/0.1
 encapsulation dot1Q 10
 xconnect vsi a2

interface Loopback1
 ip address 3.3.3.9 255.255.255.255
 mpls traffic-eng router-id Loopback1
 mpls traffic-eng area 0
 mpls traffic-eng prefix-sid label 16200

interface Tunnel10
 ip unnumbered Loopback1
 tunnel mode mpls traffic-eng
 tunnel destination 1.1.1.9
 tunnel mpls traffic-eng autoroute announce
 tunnel mpls traffic-eng priority 7
 tunnel mpls traffic-eng path-option 1 explicit name path2pe1

router ospf 1
 opaque-lsa-capability
 mpls traffic-eng area
 mpls traffic-eng router-id Loopback1
 mpls traffic-eng segment-routing global-block 16000 47999
 network 3.3.3.9 0.0.0.0 area 0
 network 10.20.1.0 0.0.0.255 area 0

tunnel-policy policy1
 destination 1.1.1.9
 tunnel-mode mpls traffic-eng
 tunnel-mode mpls traffic-eng autoroute announce
 tunnel-mode mpls traffic-eng priority 7
 tunnel-mode mpls traffic-eng path-option 1 explicit name path2pe1

end