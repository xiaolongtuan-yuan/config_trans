hostname LSRC

interface GigabitEthernet2/0/0
 no shutdown
 ip address 3.2.1.2 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels

interface GigabitEthernet1/0/0
 no shutdown

interface Loopback1
 ip address 3.3.3.3 255.255.255.255

interface Tunnel20
 ip unnumbered Loopback1
 tunnel destination 1.1.1.1

mpls traffic-eng router-id Loopback1 force

mpls traffic-eng area 0

mpls traffic-eng path-option 200 explicit name 30

mpls traffic-eng passive-interface default

mpls traffic-eng autoroute announce

mpls traffic-eng logging events all

mpls traffic-eng logging events lsp-status

mpls traffic-eng logging events reoptimize

mpls traffic-eng logging events all

mpls traffic-eng logging events path-change

mpls traffic-eng logging events path-error

mpls traffic-eng logging events bandwidth-change

mpls traffic-eng logging events link-status

mpls traffic-eng logging events reroute

mpls traffic-eng logging events reoptimize

mpls traffic-eng logging events all

mpls traffic-eng logging events path-change

mpls traffic-eng logging events path-error

mpls traffic-eng logging events bandwidth-change

mpls traffic-eng logging events link-status

mpls traffic-eng logging events reroute