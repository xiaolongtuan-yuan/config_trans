hostname LSRD

mpls ip

mpls ldp router-id Loopback1

interface GigabitEthernet1/0/0
no shutdown
ip address 4.1.1.2 255.255.255.0
mpls ip
mpls traffic-eng

interface GigabitEthernet1/0/1
no shutdown
ip address 3.4.1.1 255.255.255.0
mpls ip
mpls traffic-eng

interface Loopback1
ip address 4.4.4.4 255.255.255.255

ip route 1.1.1.1 255.255.255.255 4.1.1.1
ip route 3.3.3.3 255.255.255.255 3.4.1.2

end