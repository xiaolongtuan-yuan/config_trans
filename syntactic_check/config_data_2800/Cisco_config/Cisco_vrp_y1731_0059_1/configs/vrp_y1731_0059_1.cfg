hostname PE3

interface GigabitEthernet3/0/1.1
 encapsulation dot1Q 200
 service instance 1 ethernet
  ethernet cfm mep domain MD3 service MA3 mep 4
  ethernet cfm continuity-check
  ethernet cfm loss-measurement dual-ended
!
ethernet cfm
!
ethernet cfm global
!
ethernet cfm domain MD3
 service MA3
!
ethernet cfm mep crossconnect MD3 MA3 4 interface GigabitEthernet3/0/1.1
ethernet cfm mep crossconnect MD3 MA3 3 peer
!
end