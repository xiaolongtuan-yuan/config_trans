hostname PE2
!
mpls ldp router-id Loopback0
!
pseudowire-class POLICY1
 encapsulation mpls
!
interface Loopback1
 ip address 3.3.3.9 255.255.255.255
!
interface Tunnel10
 ip unnumbered Loopback1
 tunnel destination 1.1.1.9
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.2.2.1 255.255.255.0
 mpls ip
!
interface GigabitEthernet2/0/0
 no shutdown
!
interface GigabitEthernet2/0/0.1
 no shutdown
 encapsulation dot1Q 20
 xconnect 1.1.1.9 101 pw-class POLICY1
!
router ospf 1
 mpls ldp autoconfig area 0
 network 3.3.3.9 0.0.0.0 area 0
 network 10.2.2.0 0.0.0.255 area 0
!
mpls traffic-eng tunnels
mpls traffic-eng auto-tunnel primary
mpls traffic-eng auto-tunnel destination 1.1.1.9 32
!
end