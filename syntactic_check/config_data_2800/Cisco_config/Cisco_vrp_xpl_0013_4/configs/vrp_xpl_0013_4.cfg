hostname DeviceE
interface GigabitEthernet3/0/1
 no shutdown
 ip address 1.1.2.1 255.255.255.0

interface GigabitEthernet3/0/2
 no shutdown
 ip address 1.1.1.1 255.255.255.0

router bgp 200
 neighbor 1.1.1.2 remote-as 200
 neighbor 1.1.2.2 remote-as 200
 no synchronization
 !
 address-family ipv4 unicast
  neighbor 1.1.1.2 activate
  neighbor 1.1.1.2 route-map r3 in
  neighbor 1.1.2.2 activate
  neighbor 1.1.2.2 route-map r2 in
  default-information originate
 exit-address-family

route-map appmed permit 10
 set metric 0

route-map r2 permit 10
 match ip address prefix-list ACL_R2_10
 set metric 200

route-map r2 permit 20
 match ip address prefix-list ACL_R2_R3
 set metric 100

route-map r2 permit 30
 set metric 0

route-map r3 permit 10
 match ip address prefix-list ACL_R3_10
 set metric 100

route-map r3 permit 20
 set metric 0

ip prefix-list ACL_R2_10 seq 5 permit 2.2.2.0/24
ip prefix-list ACL_R2_R3 seq 5 permit 2.2.2.0/24
ip prefix-list ACL_R2_R3 seq 10 permit 3.3.3.0/24
ip prefix-list ACL_R3_10 seq 5 permit 2.2.2.0/24