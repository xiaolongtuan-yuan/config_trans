hostname P

mpls ip

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.2.2.2 255.255.255.0
 mpls ip

interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.1.1.2 255.255.255.0
 mpls ip

interface Loopback1
 ip address 2.2.2.9 255.255.255.255

mpls ldp router-id Loopback1 force

mpls ldp advertise-labels

mpls ldp neighbor 10.1.1.1 targeted hello accept-label

mpls ldp neighbor 10.2.2.1 targeted hello accept-label

mpls traffic-eng tunnels

interface GigabitEthernet1/0/0
 mpls traffic-eng tunnels

interface GigabitEthernet2/0/0
 mpls traffic-eng tunnels

mpls traffic-eng lsp setup

mpls traffic-eng reroute

mpls traffic-eng autoroute announce

mpls traffic-eng autoroute destination

mpls traffic-eng logging bandwidth

mpls traffic-eng logging fast-reroute-events

mpls traffic-eng logging fast-reroute-calculations

mpls traffic-eng logging fast-reroute-backup

mpls traffic-eng logging fast-reroute-reoptimization

mpls traffic-eng logging fast-reroute-tunnels

mpls traffic-eng logging fast-reroute-tunnel-status

mpls traffic-eng logging fast-reroute-tunnel-reoptimization

ip route 10.1.1.1 255.255.255.255 GigabitEthernet1/0/0

ip route 10.2.2.1 255.255.255.255 GigabitEthernet2/0/0

mpls traffic-eng tunnel destination 10.1.1.1

mpls traffic-eng tunnel mpls label 100

mpls traffic-eng tunnel mode ip

mpls traffic-eng tunnel destination 10.2.2.1

mpls traffic-eng tunnel mpls label 201

mpls traffic-eng tunnel mode ip

end

