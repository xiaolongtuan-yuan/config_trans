hostname Device1

!
router ospfv3 1
 router-id 1.1.1.1
 area 0.0.0.0
!

interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8:3::2/64
 ospfv3 1 ipv6 area 0.0.0.0
!

interface GigabitEthernet1/0/1
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8:2::2/64
 ospfv3 1 ipv6 area 0.0.0.0
!

interface Loopback0
 ipv6 enable
 ipv6 address 2001:DB8:11::1/128
 ospfv3 1 ipv6 area 0.0.0.0
!

router bgp 100
 bgp log-neighbor-changes
 neighbor 2001:DB8:22::2 remote-as 100
 neighbor 2001:DB8:22::2 update-source Loopback0
 neighbor 2001:DB8:33::3 remote-as 100
 neighbor 2001:DB8:33::3 update-source Loopback0
 !
 address-family ipv6
  neighbor 2001:DB8:22::2 activate
  neighbor 2001:DB8:33::3 activate
 exit-address-family
 !
  neighbor 2001:DB8:22::2 activate
  neighbor 2001:DB8:22::2 send-community extended
  neighbor 2001:DB8:33::3 activate
  neighbor 2001:DB8:33::3 send-community extended
  neighbor 2001:DB8:22::2 route-reflector-client
  neighbor 2001:DB8:33::3 route-reflector-client
!

end