hostname PE3
!
ethernet cfm global
!
ethernet cfm domain md3 level 7
 service ma3
!
interface GigabitEthernet3/0/1.1
 encapsulation dot1Q 200
 ethernet cfm mep domain md3 service ma3 4
 ethernet cfm mep 4 domain md3 service ma3 direction down
 ethernet cfm mep 4 domain md3 service ma3 continuity-check
 ethernet cfm mep 4 domain md3 service ma3 remote-mep 3
!
end