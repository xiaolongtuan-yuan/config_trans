hostname DeviceA

interface GigabitEthernet1/0/0
 ip address 10.1.1.1 255.255.255.0
 standby version 2
 standby 1 ip 10.1.1.10
 standby 1 priority 120
 standby 1 preempt delay minimum 20
 standby 1 track nqa 1 reachability
  delay down 40

interface GigabitEthernet2/0/0
 ip address 10.1.2.1 255.255.255.0

ip route 10.2.1.0 255.255.255.0 10.1.1.2

ip sla 1
 icmp-echo 10.2.1.1 source-interface GigabitEthernet1/0/0
 frequency 20
 timeout 10000
 threshold 2
ip sla schedule 1 start-time now life forever

end