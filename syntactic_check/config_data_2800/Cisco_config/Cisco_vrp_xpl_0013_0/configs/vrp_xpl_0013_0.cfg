hostname DeviceA
!
interface GigabitEthernet3/0/0
 no shutdown
 ip address 1.1.5.2 255.255.255.0
!
router bgp 100
 neighbor 1.1.5.1 remote-as 100
 neighbor 1.1.5.1 update-source GigabitEthernet3/0/0
 !
 address-family ipv4
  neighbor 1.1.5.1 activate
  neighbor 1.1.5.1 route-map export-r1 out
  redistribute static
 exit-address-family
!
ip route 2.2.2.0 255.255.255.0 Null0
ip route 3.3.3.0 255.255.255.0 Null0
ip route 4.4.4.0 255.255.255.0 Null0
ip route 5.5.5.0 255.255.255.0 Null0
!
ip prefix-list prefix1 seq 5 permit 2.2.2.0/24
ip prefix-list prefix1 seq 10 permit 3.3.3.0/24
ip prefix-list prefix1 seq 15 permit 4.4.4.0/24
ip prefix-list prefix1 seq 20 permit 5.5.5.0/24
!
route-map export-r1 permit 10
 match ip address prefix-list prefix1
!
end