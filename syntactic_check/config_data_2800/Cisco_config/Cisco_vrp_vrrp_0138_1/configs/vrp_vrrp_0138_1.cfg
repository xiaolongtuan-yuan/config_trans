hostname DeviceB
!
interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.1.1.2 255.255.255.0
 standby 10 ip 10.1.1.111
 standby 10 priority 140
 standby 10 track bfd 2 decrement 40
 efm enable
 efm error-frame period 5
 efm error-frame threshold 5
 efm error-frame notification enable
 efm error-frame-second period 120
!
bfd all-interfaces
 neighbor 10.1.1.1 interface GigabitEthernet1/0/1
!
router ospf 1
 network 10.1.1.0 0.0.0.255 area 0
!
end