hostname DeviceB
!
interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.1.1.2 255.255.255.0
 standby 10 ip 10.1.1.111
 standby 10 priority 140
 !
 ethernet cfm global
 ethernet cfm domain MD level 7
 ethernet cfm service MA level 7
 !
 ethernet cfm mep 1 domain MD service MA
 ethernet cfm continuity-check
!
bfd
 no bfd echo
 bfd interval 900 min_rx 900 multiplier 3
!
bfd-template single-hop 2
 interval min-tx 50 min-rx 50 multiplier 3
!
router ospf 1
 network 10.1.1.0 0.0.0.255 area 0
 bfd all-interfaces
!
end