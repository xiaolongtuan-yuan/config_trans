hostname CE1
!
vlan 10
!
ethernet cfm
  service ma1 vlan 10
  service ma2 vlan 10
!
interface Vlan10
 ip address 10.1.1.1 255.255.255.0
!
interface GigabitEthernet1/0/0
 switchport mode trunk
 switchport trunk allowed vlan 10
 no shutdown
 ethernet cfm mep domain md1 service ma1 mep-id 2 direction outward
 ethernet cfm mep continuity-check
 ethernet cfm mep crosscheck start-delay 0
 ethernet cfm mep crosscheck mep-id 1
!
interface GigabitEthernet2/0/0
 switchport mode trunk
 switchport trunk allowed vlan 10
 no shutdown
 ethernet cfm mep domain md2 service ma2 mep-id 4 direction outward
 ethernet cfm mep continuity-check
 ethernet cfm mep crosscheck start-delay 0
 ethernet cfm mep crosscheck mep-id 3
!
end