hostname CE1

vlan 10

ethernet cfm

interface Vlan10
 ip address 10.1.1.1 255.255.255.0

interface GigabitEthernet1/0/0
 switchport mode trunk
 switchport trunk allowed vlan add 10
 no shutdown

interface GigabitEthernet2/0/0
 switchport mode trunk
 switchport trunk allowed vlan add 10
 no shutdown

ethernet cfm md md1
 eth cfm ma ma1
  mep domain vlan 10
   mep id 2
    interface GigabitEthernet1/0/0
    direction outward
    ccm send
   remote-mep id 1
    ccm receive

ethernet cfm md md2
 eth cfm ma ma2
  mep domain vlan 10
   mep id 4
    interface GigabitEthernet2/0/0
    direction outward
    ccm send
   remote-mep id 3
    ccm receive

end