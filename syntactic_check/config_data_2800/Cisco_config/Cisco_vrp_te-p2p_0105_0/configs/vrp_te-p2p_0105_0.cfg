hostname LSRA

mpls label protocol ldp

mpls traffic-eng tunnels

mpls traffic-eng area 1

interface GigabitEthernet1/0/0

no shutdown

ip address 2.1.1.1 255.255.255.0

mpls ip

isis network point-to-point

isis circuit-type level-2-only

isis cost-style wide

isis metric-style wide

mpls traffic-eng level-2

mpls traffic-eng router-id Loopback1

mpls traffic-eng administrative-weight 32

mpls traffic-eng auto-bw

isis instance 1

isis level-2

isis level-2 wide-metrics-only

isis level-2 mpls traffic-eng

isis level-2 metric-style wide

isis level-2 fast-reroute

isis level-2 lsp-refresh-interval 500

exit

interface Loopback1

ip address 1.1.1.1 255.255.255.255

mpls traffic-eng router-id Loopback1

isis network point-to-point

isis circuit-type level-2-only

isis cost-style wide

isis metric-style wide

isis level-2

isis level-2 wide-metrics-only

isis level-2 mpls traffic-eng

isis level-2 metric-style wide

isis level-2 fast-reroute

isis level-2 lsp-refresh-interval 500

exit

interface Tunnel1

ip unnumbered Loopback1

tunnel mode mpls traffic-eng

tunnel destination 4.4.4.4

tunnel mpls traffic-eng tunnel-id 1

tunnel mpls traffic-eng record-route label

tunnel mpls traffic-eng path-option 1 explicit name pri-path

tunnel mpls traffic-eng fast-reroute

exit

