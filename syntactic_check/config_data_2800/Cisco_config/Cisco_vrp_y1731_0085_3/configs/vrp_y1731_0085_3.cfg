hostname PE2
!
ethernet cfm global
!
ethernet cfm domain MD1 level 3
 service MA1
!
mpls ldp router-id Loopback0
!
l2vpn evpn
!
bridge-domain EVPNA
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
!
interface GigabitEthernet1/0/1.1
 no shutdown
 encapsulation dot1Q 2
 service instance 2 ethernet
  bridge-domain EVPNA
 ethernet cfm mep domain MD1 service MA1 1 direction outward
 ethernet cfm mep 1 domain MD1 service MA1 continuity-check
 ethernet cfm mep 1 domain MD1 service MA1 remote-mep 4
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.2.1.1 255.255.255.0
 mpls ip
!
router bgp 100
 neighbor 1.1.1.1 remote-as 100
 neighbor 1.1.1.1 update-source Loopback0
 !
 address-family ipv4 unicast
  neighbor 1.1.1.1 activate
 !
  neighbor 1.1.1.1 activate
  neighbor 1.1.1.1 send-community extended
 !
!
router ospf 1
 network 2.2.2.2 0.0.0.0 area 0
 network 10.2.1.0 0.0.0.255 area 0
!
end