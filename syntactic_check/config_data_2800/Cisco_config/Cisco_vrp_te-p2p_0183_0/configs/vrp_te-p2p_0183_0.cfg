hostname LSRA
!
mpls ip
!
mpls traffic-eng
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 2.1.1.1 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 ip rsvp bandwidth
!
interface Tunnel10
 ip unnumbered Loopback0
 tunnel destination 3.3.3.3
!
end