hostname ASBR2
!
mpls ip
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.20.1.2 255.255.255.0
 mpls ip
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.30.1.1 255.255.255.0
 mpls ip
!
interface Loopback1
 ip address 3.3.3.9 255.255.255.255
!
router bgp 200
 neighbor 4.4.4.9 remote-as 200
 neighbor 4.4.4.9 update-source Loopback1
 neighbor 10.20.1.1 remote-as 100
 neighbor 10.20.1.1 update-source GigabitEthernet1/0/0
 !
 address-family ipv4
  no synchronization
  network 4.4.4.9 mask 255.255.255.255
  neighbor 4.4.4.9 activate
  neighbor 4.4.4.9 send-label
  neighbor 4.4.4.9 route-map POLICY_MPLS out
  neighbor 10.20.1.1 activate
  neighbor 10.20.1.1 send-label
  neighbor 10.20.1.1 route-map POLICY_MPLS out
 exit-address-family
!
router ospf 1
 network 3.3.3.9 0.0.0.0 area 0
 network 10.30.1.0 0.0.0.255 area 0
!
route-map POLICY_MPLS permit 10
 match ip address prefix-list PERMIT_ALL
!
ip prefix-list PERMIT_ALL permit 0.0.0.0/0 le 32
!
end