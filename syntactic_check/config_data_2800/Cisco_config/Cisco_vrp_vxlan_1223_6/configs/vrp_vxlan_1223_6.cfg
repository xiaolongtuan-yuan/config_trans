hostname Device1

interface GigabitEthernet1/0/0
 no shutdown  
 ip address 192.168.50.1 255.255.255.0
exit

interface GigabitEthernet2/0/0
 no shutdown  
 ip address 192.168.1.1 255.255.255.0
exit

interface Loopback1
 ip address 1.1.1.1 255.255.255.255
exit

ip route 6.6.6.6 255.255.255.255 192.168.50.2
ip route 7.7.7.7 255.255.255.255 192.168.1.2
ip route 192.168.60.0 255.255.255.0 192.168.1.2

end