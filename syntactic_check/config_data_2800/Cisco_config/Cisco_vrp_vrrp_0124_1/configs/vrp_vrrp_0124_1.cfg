hostname PE2
!
interface GigabitEthernet1/0/1
 no shutdown 
 ip address 10.10.1.1 255.255.255.0
 standby 10 ip 10.10.1.111
!
interface GigabitEthernet1/0/2
 no shutdown 
 ip address 10.20.1.1 255.255.255.0
 standby 20 ip 10.20.1.111
!
interface GigabitEthernet1/0/3
 no shutdown 
 ip address 192.168.2.1 255.255.255.0
!
interface GigabitEthernet1/0/4
 ip address 10.10.3.2 255.255.255.0 
 standby 1 ip 10.10.3.111
 standby 1 preempt
!
interface GigabitEthernet1/0/5
 ip address 10.20.3.2 255.255.255.0 
 standby 2 ip 10.1.1.222
 standby 2 preempt
!
router ospf 1
 network 10.10.1.0 0.0.0.255 area 0
 network 10.10.3.0 0.0.0.255 area 0
 network 10.20.1.0 0.0.0.255 area 0
 network 10.20.3.0 0.0.0.255 area 0
 network 192.168.2.0 0.0.0.255 area 0
!
