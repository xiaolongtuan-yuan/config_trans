hostname UPE

mpls ip
mpls ldp neighbor 2.2.2.9 targeted
mpls ldp discovery targeted-hello accept
mpls ldp discovery targeted-hello send
mpls ldp discovery targeted-hello accept from 2.2.2.9
mpls ldp discovery targeted-hello send to 2.2.2.9

interface GigabitEthernet1/0/0.1
 no shutdown
 encapsulation dot1q 10
 xconnect v123

interface GigabitEthernet2/0/0.1
 no shutdown
 encapsulation dot1q 10
 xconnect v123

interface GigabitEthernet3/0/0
 no shutdown
 ip address 10.10.1.1 255.255.255.0
 mpls ip
 mpls ldp

interface Loopback1
 ip address 1.1.1.9 255.255.255.255

router ospf 1
 network 1.1.1.9 0.0.0.0 area 0
 network 10.10.1.0 0.0.0.255 area 0

