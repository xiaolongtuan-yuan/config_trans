hostname DeviceA

interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8::1/64
 hsrp version 2
 hsrp 1
  preempt delay minimum 20
 exit

interface GigabitEthernet2/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8:1::1/64
 ospfv3 1 ipv6 area 0.0.0.0
 no shutdown

bfd-template single-hop AToB
  interval min-tx 50 min-rx 50

bfd map ipv4 2001:DB8::2/128 GigabitEthernet1/0/0
 bfd session-template AToB local-discriminator 1 remote-discriminator 2

track 1 interface GigabitEthernet2/0/0 line-protocol

end