hostname CSG

mpls label protocol ldp
mpls ldp router-id Loopback1 force

interface Loopback1
ip address 1.1.1.1 255.255.255.255

interface Tunnel11
ip unnumbered Loopback1
tunnel mode mpls traffic-eng
tunnel destination 2.2.2.2
tunnel mpls traffic-eng tunnel-id 100
tunnel mpls traffic-eng path-option 1 explicit name path1
tunnel mpls traffic-eng autoroute announce
tunnel mpls traffic-eng priority 7 7
tunnel mpls traffic-eng record-route

interface GigabitEthernet1/0/1
no shutdown
ip address 10.0.1.1 255.255.255.0
mpls ip
mpls traffic-eng tunnels

interface Serial2/0/0:0
no shutdown

interface Serial2/0/0:0.1 point-to-point
ip address 10.0.1.1 255.255.255.0
mpls ip
mpls traffic-eng tunnels

interface Serial2/0/0:0.2 point-to-point
ip address 10.0.1.2 255.255.255.0
mpls ip
mpls traffic-eng tunnels

interface Serial2/0/1:0
no shutdown

interface Serial2/0/1:0.1 point-to-point
ip address 10.0.1.3 255.255.255.0
mpls ip
mpls traffic-eng tunnels

interface Serial2/0/1:0.2 point-to-point
ip address 10.0.1.4 255.255.255.0
mpls ip
mpls traffic-eng tunnels

mpls traffic-eng area 0
mpls traffic-eng router-id Loopback1

mpls l2vpn

mpls ldp

router ospf 100
router-id 1.1.1.1
mpls traffic-eng router-id Loopback1
area 0 stub no-summary
network 10.0.1.0 0.0.0.255 area 0
network 1.1.1.1 0.0.0.0 area 0

mpls traffic-eng auto-tunnel backup
mpls traffic-eng backup-path tunnel11 explicit name path1
mpls traffic-eng backup-path tunnel11 priority 100 100

mpls traffic-eng auto-tunnel primary
mpls traffic-eng backup-path tunnel11

mpls traffic-eng autoroute announce

mpls traffic-eng forwarding adjacency-download

mpls traffic-eng load-sharing

end

