hostname PE2
!
bfd all-interfaces
!
mpls ip
!
pseudowire-class 2to1
 encapsulation mpls
 control-word
!
mpls ldp neighbor 1.1.1.1 targeted
!
interface GigabitEthernet1/0/0
 no shutdown
 xconnect 1.1.1.1 100 encapsulation mpls
!
interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.3.1.2 255.255.255.252
 mpls ip
 mpls ldp autoconfig
!
interface Loopback1
 ip address 4.4.4.4 255.255.255.255
!
router ospf 1
 network 4.4.4.4 0.0.0.0 area 0
 network 10.3.1.0 0.0.0.3 area 0
!
bfd bind session-interface GigabitEthernet1/0/0 pw-id 2to1 local-discriminator 21 remote-discriminator 12
!
end