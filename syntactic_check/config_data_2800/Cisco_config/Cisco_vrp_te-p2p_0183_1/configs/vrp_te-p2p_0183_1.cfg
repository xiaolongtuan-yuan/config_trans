hostname LSRB

mpls ip
mpls traffic-eng

interface Tunnel10
 ip unnumbered Loopback1
 tunnel destination 2.1.1.2

interface Tunnel20
 ip unnumbered Loopback1
 tunnel destination 3.2.1.1

interface GigabitEthernet2/0/0
 no shutdown
 ip address 3.2.1.1 255.255.255.0
 mpls ip

interface GigabitEthernet1/0/0
 no shutdown
 ip address 2.1.1.2 255.255.255.0
 mpls ip

interface Loopback1
 ip address 2.2.2.2 255.255.255.255

end