set system host-name CE2

set vlans vlan10 vlan-id 10
set vlans vlan10 l3-interface irb.10

set interfaces irb unit 10 family inet address 10.1.1.2/24

set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members vlan10

set interfaces ge-2/0/0 flexible-vlan-tagging
set interfaces ge-2/0/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-2/0/0 unit 0 family ethernet-switching vlan members vlan10

set protocols oam ethernet connectivity-fault-management
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 level 0
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 2 interface ge-1/0/0.0 direction down
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 remote-mep 1

set protocols oam ethernet connectivity-fault-management maintenance-domain md2 level 0
set protocols oam ethernet connectivity-fault-management maintenance-domain md2 maintenance-association ma2
set protocols oam ethernet connectivity-fault-management maintenance-domain md2 maintenance-association ma2 mep 4 interface ge-2/0/0.0 direction down
set protocols oam ethernet connectivity-fault-management maintenance-domain md2 maintenance-association ma2 remote-mep 3