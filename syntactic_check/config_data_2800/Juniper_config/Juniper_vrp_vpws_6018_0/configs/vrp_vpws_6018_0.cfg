set system host-name CE1
set vlans vlan2 vlan-id 2
set interfaces irb unit 2 family inet address 10.1.1.3/24

set interfaces ge-0/0/0 disable
set interfaces ge-0/0/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members vlan2

set interfaces ge-0/0/1 disable
set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members vlan2

set protocols bfd
set protocols bfd session CE1 peer 10.1.1.1
set protocols bfd session CE1 local-address 10.1.1.3
set protocols bfd session CE1 echo-mode
set protocols bfd session CE1 discriminator local 51
set protocols bfd session CE1 discriminator remote 15
set protocols bfd session CE1 minimum-interval 1000
set protocols bfd session CE1 minimum-receive-interval 1000