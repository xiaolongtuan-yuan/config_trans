set system host-name CE2

set interfaces irb unit 10 description "VLAN_10"
set interfaces irb unit 10 family inet address 10.1.1.2/24

set interfaces ae10 description "Port-Channel_10"
set interfaces ae10 aggregated-ether-options lacp active

set interfaces ge-1/0/0 description "GigE_10_1"
set interfaces ge-1/0/0 ether-options 802.3ad ae10

set interfaces ge-1/0/1 description "GigE_10_2"
set interfaces ge-1/0/1 ether-options 802.3ad ae10

set vlans VLAN-10 vlan-id 10
set vlans VLAN-10 interface ae10.0
set vlans VLAN-10 l3-interface irb.10