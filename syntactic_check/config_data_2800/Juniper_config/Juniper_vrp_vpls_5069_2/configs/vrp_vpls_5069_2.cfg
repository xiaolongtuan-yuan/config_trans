user@router> configure

set interfaces lo0 unit 0 family inet address 3.3.3.3/32
set protocols bgp peer-group internal
set protocols bgp peer-group internal peer-as 100
set protocols bgp neighbor 2.2.2.2 peer-group internal
set protocols ospf router-id 3.3.3.3

set routing-instances instance1 type vrf
set routing-instances instance1 v4-routing-instance
set routing-instances instance1 interface lo0.0
set vlans vlan1 encapsulation ethernet-switching
set vlans vlan1 associate-vlan 2
set vlans vlan2 encapsulation ethernet-switching
set vlans vlan2 associate-vlan 3
set vlans vlan3 encapsulation ethernet-switching
set vlans vlan3 associate-vlan 4
set vlans vlan4 encapsulation ethernet-switching
set vlans vlan4 associate-vlan 5

set vlans vlan1 interface ge-0/0/0.0
set vlans vlan2 interface ge-0/0/0.1
set vlans vlan3 interface ge-0/0/0.2
set vlans vlan4 interface ge-0/0/0.3
set interfaces lo0 unit 0 family inet6 address ::/128

commit
