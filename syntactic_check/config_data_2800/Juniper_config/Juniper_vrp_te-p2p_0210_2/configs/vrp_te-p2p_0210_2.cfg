set system host-name LSRc
set routing-options router-id 3.3.3.9

set interfaces ge-1/0/1 unit 0 family inet address 10.1.2.2/24
set interfaces ge-1/0/1 unit 0 family mpls
set interfaces ge-1/0/2 unit 0 family inet address 10.1.3.2/24
set interfaces ge-1/0/2 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 3.3.3.9/32

set routing-instances inst1 instance-type vrf
set routing-instances inst1 interface ge-1/0/1.0
set routing-instances inst1 route-distinguisher 65000:1
set routing-instances inst1 vrf-target target:65000:1

set protocols mpls interface ge-1/0/1.0
set protocols mpls interface ge-1/0/2.0
set protocols ldp interface ge-1/0/1.0
set protocols ldp interface ge-1/0/2.0
set protocols ldp router-id 3.3.3.9
