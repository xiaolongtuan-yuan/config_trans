set system host-name mpls-lab-proto-ldp-mpls-ip
set interfaces ge-0/1/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/2/0 unit 0 family inet address 10.2.2.1/24
set interfaces lo0 unit 0 family inet address 192.168.4.4/32
set protocols ospf area 0.0.0.0 interface ge-0/1/0.0
set protocols ospf area 0.0.0.0 interface ge-0/2/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set routing-options router-id 192.168.4.4