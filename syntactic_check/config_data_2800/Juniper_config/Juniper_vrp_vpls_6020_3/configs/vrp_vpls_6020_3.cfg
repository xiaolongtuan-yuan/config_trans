set system host-name PE1
set protocols ldp

set interfaces ge-1/0/0 unit 1 encapsulation vlan-id 10
set routing-instances vsi1 interface ge-1/0/0.1
set routing-instances vsi1 route-distinguisher 2:2
set routing-instances vsi1 vrf-target target:2:2

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set interfaces ge-2/0/0 unit 0 family inet address 10.10.1.1/24

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0

set protocols ldp interface lo0.0
set protocols ldp interface ge-1/0/0.1