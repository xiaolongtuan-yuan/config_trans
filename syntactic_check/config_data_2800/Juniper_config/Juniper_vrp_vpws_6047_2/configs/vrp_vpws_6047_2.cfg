set system host-name ASBR1
set protocols ldp interface all

set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 0 family inet address 10.20.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols bgp group internal type internal
set protocols bgp group internal local-as 100
set protocols bgp group internal neighbor 10.20.1.2 peer-as 200
set protocols bgp group internal local-address 10.20.1.1
set protocols bgp group external type external
set protocols bgp group external local-as 100
set protocols bgp group external peer-as 100

set routing-options static route 1.1.1.1/32 discard

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive