set system host-name ASBR1
set protocols ldp enabled
set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls ip
set interfaces ge-1/0/0 unit 0 family inet address 10.20.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls ip
set interfaces lo0 unit 0 family inet address 2.2.2.2/32
set protocols bgp group external type internal peer-as 100 local-as 100
set protocols bgp group internal peer-as 200
set protocols bgp group internal update-source ge-1/0/0 unit 0
set routing-options static route 1.1.1.1/32 next-hop null0
set policies routing-policy mpls-policy1 terms match_exp terms match_exp from protocol mpls-exp to mpls-metapost then set mpls-exp mpls-metapost
set policies routing-policy mpls-policy2 terms match_exp terms match_exp from protocol mpls-exp to mpls-metapost then set mpls-exp mpls-metapost
set protocols ospf area 0 interface ge-0/0/0 unit 0
set protocols ospf area 0 interface lo0 unit 0
