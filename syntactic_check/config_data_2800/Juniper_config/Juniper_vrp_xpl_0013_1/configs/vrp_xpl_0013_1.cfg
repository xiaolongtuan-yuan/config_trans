set system host-name DeviceB

set interfaces ge-0/0/0 unit 0 family inet address 1.1.5.1/24
set interfaces ge-0/0/1 unit 0 family inet address 1.1.4.2/24
set interfaces ge-0/0/2 unit 0 family inet address 1.1.3.2/24

set protocols bgp group PEERS type internal
set protocols bgp group PEERS local-address 1.1.5.1
set protocols bgp group PEERS peer-as 200
set protocols bgp group PEERS neighbor 1.1.3.1
set protocols bgp group PEERS neighbor 1.1.4.1
set protocols bgp group PEERS neighbor 1.1.5.2

set routing-options router-id 1.1.5.1