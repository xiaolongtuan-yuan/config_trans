set system host-name CE2

set protocols oam ethernet connectivity-fault-management maintenance-domain md1 level 0
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 3 direction down interface ge-0/0/1.0
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 remote-mep 3

set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members 2
set interfaces ge-0/0/1 disable
delete interfaces ge-0/0/1 disable