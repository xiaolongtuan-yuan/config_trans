set system host-name PE1
set routing-options router-id 1.1.1.9

set interfaces lo0 unit 0 family inet address 1.1.1.9/32

set routing-instances vpns1 interface ge-0/0/0.0
set routing-instances vpns1 interface ge-0/0/1.0
set routing-instances vpns1 route-distinguisher 100:1
set routing-instances vpns1 vrf-target target:100:1

set protocols ldp router-id 1.1.1.9
set protocols ldp interface lo0.0

set protocols bgp group PE1 type internal
set protocols bgp group PE1 neighbor 2.2.2.2
set protocols bgp group PE1 local-address 1.1.1.9
set protocols bgp group PE1 family l2vpn signaling

set interfaces xe-0/0/0 flexible-vlan-tagging
set interfaces xe-0/0/0 unit 10 vlan-id 10

set interfaces xe-0/0/1 flexible-vlan-tagging
set interfaces xe-0/0/1 unit 10 vlan-id 10