set system host-name PE2

set protocols ldp interface ge-2/0/0.0
set protocols ldp router-id 192.168.10.2
set interfaces ae1 unit 0 family inet address 192.168.10.2/24
set interfaces ge-2/0/0 gigether-options 802.3ad ae1
set interfaces lo0 unit 0 family inet address 3.3.3.9/32

set protocols bgp group ipv4-internal type internal
set protocols bgp group ipv4-internal neighbor 1.1.1.9
set protocols bgp group ipv4-internal family inet-vpn unicast
set protocols bgp local-as 100
set routing-options autonomous-system 100

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 interface ae1.0
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target target:100:1

set routing-options router-id 3.3.3.9

set protocols ospf area 0 interface ge-2/0/0.0
set protocols ospf area 0 interface lo0.0 passive