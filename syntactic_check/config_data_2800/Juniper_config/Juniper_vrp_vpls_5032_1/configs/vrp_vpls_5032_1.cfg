set system host-name SPE
set protocols ldp
set interfaces ge-1/0/0 unit 0 family inet address 10.10.1.2/24
set interfaces ge-2/0/0 unit 0 family inet address 10.20.1.1/24
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ldp neighbor 1.1.1.9
set protocols ldp session 1.1.1.9 targeted
set routing-instances v123 instance-type vrf
set routing-instances v123 interface ge-1/0/0.0
set routing-instances v123 interface ge-2/0/0.0
set routing-instances v123 route-distinguisher 1:123
set protocols ldp router-id 1.1.1.9
set routing-instances vpls1 interface ge-1/0/0.1
set routing-instances vpls1 protocols l2vpn interface ge-1/0/0.1 remote-site-id 123
set routing-instances vpls1 protocols l2vpn interface ge-2/0/0.1 remote-site-id 123