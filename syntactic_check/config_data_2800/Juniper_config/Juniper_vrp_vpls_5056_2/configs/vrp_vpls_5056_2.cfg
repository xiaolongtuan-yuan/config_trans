set system host-name SPE2

set protocols ldp interface ge-0/0/0

set interfaces ge-0/0/0 unit 0 family inet address 192.168.20.2/24
set interfaces ge-0/0/0 unit 0 family mpls ip

set interfaces ge-0/0/1 unit 0 family inet address 192.168.50.1/24
set interfaces ge-0/0/1 unit 0 family mpls ip

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set routing-options router ospf 1 area 0 network 3.3.3.3/32
set routing-options router ospf 1 area 0 network 192.168.20.0/24
set routing-options router ospf 1 area 0 network 192.168.50.0/24

set protocols ldp interface ge-0/0/0
set protocols ldp interface ge-0/0/1
set protocols mpls vni vsi1 static pw-signaling ldp peer 1.1.1.1
set protocols mpls vni vsi1 static pw-signaling ldp peer 4.4.4.4
set protocols mpls vni vsi1 static pw-signaling ldp peer 5.5.5.5
set protocols mpls vni vsi1 static vsi-id 1
