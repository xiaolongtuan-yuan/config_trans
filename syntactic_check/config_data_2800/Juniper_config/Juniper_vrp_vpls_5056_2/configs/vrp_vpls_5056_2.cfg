set system host-name SPE2

set protocols ldp interface ge-0/0/0.0

set interfaces ge-0/0/0 unit 0 family inet address 192.168.20.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols mpls interface ge-0/0/0.0

set interfaces ge-0/0/1 unit 0 family inet address 192.168.50.1/24
set interfaces ge-0/0/1 unit 0 family mpls
set protocols mpls interface ge-0/0/1.0

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0

set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0
set routing-instances vsi1 interface ge-0/0/0.0
set routing-instances vsi1 protocols l2vpn neighbor 1.1.1.1
set routing-instances vsi1 protocols l2vpn neighbor 4.4.4.4
set routing-instances vsi1 protocols l2vpn neighbor 5.5.5.5