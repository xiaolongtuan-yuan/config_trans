set system host-name P1
set protocols ldp interface GigaEth2/0/0
set interfaces ge-2/0/0 unit 0 family inet address 10.4.1.2 255.255.255.252
set forwarding-rules rule-set default from protocol ldp interface GigaEth2/0/0

set protocols ldp interface GigaEth1/0/0
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1 255.255.255.252
set forwarding-rules rule-set default from protocol ldp interface GigaEth1/0/0

set protocols ldp interface GigaEth3/0/0
set interfaces ge-3/0/0 unit 0 family inet address 10.2.1.1 255.255.255.252
set forwarding-rules rule-set default from protocol ldp interface GigaEth3/0/0

set system mtu-scaling disable
set interfaces lo0 unit 0 family inet address 1.1.1.1/32
set protocols isis net 10.0.0.1.1 preference wide level-1-2

set forwarding-options ldp interface GigaEth2/0/0 router-id lo0.0 force
set forwarding-options rsvp-te
set forwarding-options label-switched-path all advertise-labels 1.1.1.1/32
set forwarding-options ldp discovery-transport-address lo0.0
set forwarding-options igp sync

commit
