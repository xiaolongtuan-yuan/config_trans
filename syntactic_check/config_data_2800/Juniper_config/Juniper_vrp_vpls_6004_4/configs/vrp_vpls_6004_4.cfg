set system host-name PE2

set protocols ldp interface lo0.0
set protocols ldp targeted-session 1.1.1.9

set routing-instances vpls-instance route-distinguisher 3.3.3.9:100
set routing-instances vpls-instance vrf-target target:100:1

set interfaces ge-0/0/0 unit 0 family mpls
set routing-instances vpls-instance interface ge-0/0/0.0
set interfaces ge-0/0/0 unit 0 family inet address 192.168.20.2/32

set interfaces ge-1/0/0 unit 1 family mpls
set routing-instances vpls-instance interface ge-1/0/0.1

set interfaces lo0 unit 0 family inet address 3.3.3.9/32

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/0.1