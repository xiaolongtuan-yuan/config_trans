set system host-name LSRc

set protocols rsvp interface all
set protocols isis level 2 wide-metrics-only
set routing-options static route 10.3.1.1/32 discard

set interfaces ge-0/0/0 flexible-vlan-tagging
set interfaces ge-0/0/0 encapsulation flexible-ethernet-services
set interfaces ge-0/0/0 unit 0 family inet
set interfaces ge-0/0/0 unit 0 family iso
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-2/0/0 flexible-vlan-tagging
set interfaces ge-2/0/0 encapsulation flexible-ethernet-services
set interfaces ge-2/0/0 unit 0 family inet
set interfaces ge-2/0/0 unit 0 family iso
set interfaces ge-2/0/0 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 3.3.3.9/32
set interfaces lo0 unit 0 family iso
set interfaces lo0 unit 0 family mpls

