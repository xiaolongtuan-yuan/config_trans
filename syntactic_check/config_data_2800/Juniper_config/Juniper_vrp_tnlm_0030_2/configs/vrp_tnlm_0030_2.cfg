set system host-name CE1

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/29

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set routing-options autonomous-system 65410
set protocols bgp group default type external
set protocols bgp group default neighbor 10.1.1.2
set protocols bgp group default peer-as 100
set protocols bgp group default local-address 10.1.1.1
set protocols bgp group default export import-route
set protocols bgp group default import export-route

set policy-options policy-statement import-route term 1 from route-filter 3.3.3.3/32 exact
set policy-options policy-statement import-route term 1 then accept
set policy-options policy-statement export-route term 1 from route-filter 0.0.0.0/0 exact
set policy-options policy-statement export-route term 1 then accept

set routing-options static route 3.3.3.3/32 discard