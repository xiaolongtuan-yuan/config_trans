set system host-name Device2

set routing-instances bd10 instance-type virtual-switch

set routing-instances bd20 instance-type virtual-switch

set interfaces irb unit 10 family inet address 192.168.10.10/24
set interfaces irb unit 20 family inet address 192.168.20.10/24

set interfaces ge-0/0/1 unit 0 family inet address 192.168.1.2/24
set interfaces ge-0/0/2 unit 0 family inet address 192.168.2.1/24

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set routing-options router-id 3.3.3.3

set protocols pim rp static address 3.3.3.3
set protocols pim interface ge-0/0/1.0
set protocols pim interface ge-0/0/2.0
set protocols pim interface irb.10
set protocols pim interface irb.20
set protocols pim interface lo0.0

set routing-options static route 0.0.0.0/0 qualified-next-hop 192.168.1.1
set routing-options static route 0.0.0.0/0 qualified-next-hop 192.168.2.1

set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive