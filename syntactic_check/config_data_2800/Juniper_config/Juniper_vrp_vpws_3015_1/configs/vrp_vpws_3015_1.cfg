set system host-name PE1

set protocols ldp
set protocols ldp router-id loopback1 force

set interfaces ge-0/0/0 unit 0 family ip address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 0 family mpls traffic-eng tunnels
set interfaces ge-0/0/0 unit 0 family mpls traffic-eng bandwidth max-reservable 10000
set interfaces ge-0/0/0 unit 0 family mpls traffic-eng bandwidth bc0 5000
set interfaces ge-0/0/0 unit 0 family mpls traffic-eng rsvp

set interfaces ge-1/0/0 unit 0 family iso
set protocols l2tpv3 vc 10 neighbor 3.3.3.9
set interfaces ge-1/0/0 unit 0 family ip address 0.0.0.0/0

set interfaces lo0 unit 0 family ip address 1.1.1.9/32

set interfaces tun0 unit 0 family inet unnumbered interface lo0.0
set interfaces tun0 unit 0 family mpls traffic-eng mode te-tunnel
set interfaces tun0 unit 0 family mpls traffic-eng tunnel-destination 3.3.3.9
set interfaces tun0 unit 0 family mpls traffic-eng bandwidth ct0 2000
set interfaces tun0 unit 0 family mpls traffic-eng tunnel-id 10

set routing-options router ospf 1
set routing-options router ospf 1 area 0 network 1.1.1.9/32 area 0
set routing-options router ospf 1 area 0 network 10.1.1.0/24 area 0

commit
