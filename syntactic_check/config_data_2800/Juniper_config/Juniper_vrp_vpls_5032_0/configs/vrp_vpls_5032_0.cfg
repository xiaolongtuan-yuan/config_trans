set system host-name UPE
set protocols ldp targeted-session 2.2.2.9
set protocols ldp interface ge-0/0/0.1
set protocols ldp interface ge-1/0/0.1

set interfaces ge-0/0/0 unit 1 encapsulation vlan-id 10
set interfaces ge-0/0/0 unit 1 family inet address 10.10.1.1/24
set interfaces ge-1/0/0 unit 1 encapsulation vlan-id 10
set interfaces ge-1/0/0 unit 1 family inet address 10.10.1.1/24
set interfaces lo0 unit 0 family inet address 1.1.1.9/32

set protocols ospf area 0.0.0.0 interface ge-0/0/0.1
set protocols ospf area 0.0.0.0 interface ge-1/0/0.1
set protocols ospf area 0.0.0.0 interface lo0.0 passive