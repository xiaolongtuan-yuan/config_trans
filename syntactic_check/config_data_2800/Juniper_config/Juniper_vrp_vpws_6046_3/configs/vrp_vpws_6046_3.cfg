set system host-name ASBR2
set protocols ldp label-install-mode liberal
setprotocols ldp local-address 3.3.3.3
set interfaces ge-0/0/0 unit 0 family mpls encapsulation mpls
set interfaces ge-0/0/0 unit 0 family inet address 10.20.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 0 family mpls ldp discovery transport-address 10.20.1.1
set interfaces ge-0/0/0 unit 0 family mpls l2transport enable
set routing-options router ospf 1
set routing-options router ospf 1 network 3.3.3.3/32 area 0
set routing-options router ospf 1 network 10.20.1.0/24 area 0
