set system host-name PE1

set protocols ldp
set protocols ldp interface ge-0/0/0.0

set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 1.1.1.9/32

set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target target:100:1
set routing-instances vpn1 interface ge-0/0/0.0

set protocols bgp group test type internal
set protocols bgp group test neighbor 2.2.2.9
set protocols bgp group test local-address 1.1.1.9

set routing-options router-id 1.1.1.9
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive