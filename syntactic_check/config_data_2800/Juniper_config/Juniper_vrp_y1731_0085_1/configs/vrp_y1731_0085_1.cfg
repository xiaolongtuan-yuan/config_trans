set system services evpn-type evpn
set chassis card 0 module 1 host-name PE1
set interfaces ge-0/0/1.0 encapsulation vlan-encapsulation dot1q 2
set interfaces ge-0/0/1 unit 0 family l2vpn
set interfaces ge-0/0/1.0 vrf forwarding evpn
set protocols bgp group evpn type internal
set protocols bgp group evpn peer 2.2.2.2 password ""
set protocols ospf area 0 interface ge-0/0/1.0
set routing-instances evpn route-target import 1:1
set routing-instances evpn route-target export 1:1
set interfaces ge-0/0/2 unit 0 family l2vpn
set interfaces ge-0/0/2 vrf forwarding evpn
set protocols l2tpv3 interface ge-0/0/1.0 encapsulation vlan-encapsulation dot1q 2
set protocols l2tpv3 interface ge-0/0/1.0 ccm-enable
set protocols l2tpv3 interface ge-0/0/1.0 ccm-interval-send 1000
set protocols l2tpv3 interface ge-0/0/1.0 ccm-interval-recv 1000
set interfaces lo0 unit 0 family evpn instance-id 1
