set system host-name SPE1

set protocols ldp router-id 2.2.2.2
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp interface lo0.0
set protocols ldp targeted-session 1.1.1.1
set protocols ldp targeted-session 4.4.4.4
set protocols ldp targeted-session 5.5.5.5

set interfaces ge-0/0/0 unit 0 family inet address 192.168.10.2/24
set protocols ospf area 0 interface ge-0/0/0.0
set interfaces ge-0/0/1 unit 0 family inet address 192.168.30.1/24
set protocols ospf area 0 interface ge-0/0/1.0

set interfaces lo0 unit 0 family inet address 2.2.2.2/32
set protocols ospf area 0 interface lo0.0

set routing-instances vpls-pw1 interface ge-0/0/0.0
