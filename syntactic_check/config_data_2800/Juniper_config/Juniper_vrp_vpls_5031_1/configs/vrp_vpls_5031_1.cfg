set system host-name PE1
set protocols ldp
set protocols ldp router-id 1.1.1.9
set protocols ldp targeted-session 3.3.3.9

set interfaces ge-0/0/0 vlan-tagging
set interfaces ge-0/0/0 unit 1 encapsulation vlan-id 10
set interfaces ge-0/0/0 unit 1 family ethernet-switching
set routing-instances a2 interface ge-0/0/0.1

set interfaces ge-1/0/0 unit 0 family inet address 10.10.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols rsvp interface ge-1/0/0.0

set interfaces lo0 unit 0 family inet address 1.1.1.9/32

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0