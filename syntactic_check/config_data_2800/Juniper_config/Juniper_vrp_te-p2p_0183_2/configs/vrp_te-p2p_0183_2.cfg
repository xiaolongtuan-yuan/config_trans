set interfaces eth0 unit 0 family ethernet-switching port-mode trunk
set protocols lldp run
set protocols lldp enable interface all
set failover group mgmt primary-interface ge-0/0/0
set routing-options static route 0.0.0.0/0 next-hop 192.168.1.1
set interfaces lo0 unit 0 family inet address 192.168.1.2/32
set system services ssh host-key algorithm all
set security policies from-zone Trust to-zone Untrust policy Allow-All match destination-address Any
set security policies from-zone Trust to-zone Untrust policy Allow-All then permit
set security zones security-zone Trust interface lo0.0
set security authentication login user admin password encrypted密码123456
set system services api key-management keys admin key 加密后的密钥
set vlans Management vrrp-group 1 virtual-router-id 1 primary-vrf Vlan1
set vlans Management vrrp-group 1 priority 150
set vlans Production vrrp-group 2 virtual-router-id 2 primary-vrf Vlan2
set vlans Production vrrp-group 2 priority 120
