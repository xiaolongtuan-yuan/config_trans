set system host-name DeviceB

set interfaces ge-0/0/0 description "To VLAN 1"
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24

set interfaces ge-0/0/1 description "To VLAN 2"
set interfaces ge-0/0/1 unit 0 family inet address 10.1.2.1/24

set routing-options static route 10.2.1.0/24 next-hop 10.1.2.2