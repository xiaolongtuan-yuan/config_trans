set system host-name CE2
set interfaces xe-1/0/0 flexible-vlan-tagging
set interfaces xe-1/0/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces xe-1/0/0 unit 0 family ethernet-switching vlan members 10
set interfaces xe-2/0/0 flexible-vlan-tagging
