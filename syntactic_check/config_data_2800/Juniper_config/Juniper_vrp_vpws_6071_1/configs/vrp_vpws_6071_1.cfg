set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 remote-mep 3
set protocols oam ethernet connectivity-fault-management maintenance-domain md2 level 0
set protocols oam ethernet connectivity-fault-management maintenance-domain md2 maintenance-association ma1
set protocols oam ethernet connectivity-fault-management maintenance-domain md2 maintenance-association ma1 mep 4 interface xe-2/0/0.0 direction down
