set system host-name LSRB
set protocols ldp
set protocols isis export redistribute-level2-to-level1
set policy-options policy-statement redistribute-level2-to-level1 term 1 from level 2
set policy-options policy-statement redistribute-level2-to-level1 term 1 to level 1
set policy-options policy-statement redistribute-level2-to-level1 term 1 then accept

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols rsvp interface ge-1/0/0.0
set protocols mpls interface ge-1/0/0.0
set protocols isis interface ge-1/0/0.0 point-to-point

set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls
set protocols rsvp interface ge-2/0/0.0 bandwidth 100m
set protocols mpls interface ge-2/0/0.0
set protocols isis interface ge-2/0/0.0 point-to-point

set interfaces lo0 unit 0 family inet address 2.2.2.2/32
set protocols isis interface lo0.0 passive