set system host-name DeviceB

set interfaces ge-3/0/0 unit 0 family inet address 1.1.5.1/24
set interfaces ge-3/0/1 unit 0 family inet address 1.1.4.2/24
set interfaces ge-3/0/2 unit 0 family inet address 1.1.3.2/24

set protocols bgp group as200-peers type external
set protocols bgp group as200-peers neighbor 1.1.3.1 peer-as 200
set protocols bgp group as200-peers neighbor 1.1.4.1 peer-as 200

set protocols bgp group as100-peer type internal
set protocols bgp group as100-peer neighbor 1.1.5.2 peer-as 100
set protocols bgp group as100-peer local-address 1.1.5.1