set system host-name DeviceB

set interfaces gigabit-ethernet3/0/0 address 1.1.5.1/24
set interfaces gigabit-ethernet3/0/1 address 1.1.4.2/24
set interfaces gigabit-ethernet3/0/2 address 1.1.3.2/24

setprotocols bgp 100
set protocols bgp 100 peers 1.1.3.1 as 200
set protocols bgp 100 peers 1.1.4.1 as 200
set protocols bgp 100 peers 1.1.5.2 as 100
set routing-options synchronization disable

set protocols bgp 100 peer 1.1.3.1 enable
set protocols bgp 100 peer 1.1.4.1 enable
set protocols bgp 100 peer 1.1.5.2 enable

set interfaces gigabit-ethernet3/0/0 address 1.1.5.1/24
set interfaces gigabit-ethernet3/0/1 address 1.1.4.2/24
set interfaces gigabit-ethernet3/0/2 address 1.1.3.2/24

set protocols bgp 100 neighbor 1.1.3.1 remote-as 200
set protocols bgp 100 neighbor 1.1.4.1 remote-as 200
set protocols bgp 100 neighbor 1.1.5.2 remote-as 100

set protocols bgp 100 address-family ipv4 unicast
set routing-options synchronization disable
set protocols bgp 100 neighbor 1.1.3.1 activate
set protocols bgp 100 neighbor 1.1.4.1 activate
set protocols bgp 100 neighbor 1.1.5.2 activate