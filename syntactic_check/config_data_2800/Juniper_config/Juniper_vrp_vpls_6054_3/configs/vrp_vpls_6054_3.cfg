setRoutingProtocolOSPF area 0 network 192.168.1.0/24
setRoutingProtocolEIGRP network 192.168.1.0
setBGPGroup inet peer 192.168.2.2 as 65000
setInterfaceEthernet4 unit 0 family inet地址 192.168.1.1/24
setInterfaceLoopback0 family inet address 192.16.1.1/32
(setRoutingPolicyroute-map myRouteMap from protocols ospf 1 set metric 10)
(setRoutingPolicyroute-map myRouteMap from protocols eigrp 1 set distance 150)
(setRoutingPolicyroute-map myRouteMap from protocols bgp set local-preference 100)
setRouteStatic 0.0.0.0/0 next-hop 192.168.2.2
(configureServicePolicyfamily的带领不正确，假设为class-class-map的配置继续下一部分)
(class-class-map myClassMap match ip address prefix-list myPrefixList)
(policy-policy myPolicy from class myClassMap set qos precedence 5)
(setInterfaceEthernet4 unit 0 family packet-mapping policy myPolicy)