set system host-name ASBR1
set interfaces lo0 unit 0 family inet address 2.2.2.9/32
set routing-options router-id 2.2.2.9

set protocols ldp interface ge-0/0/0.0
set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols mpls interface ge-0/0/0.0

set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 2.2.2.9
set protocols bgp group ibgp neighbor 1.1.1.9
set protocols bgp group ibgp family inet labeled-unicast
set protocols bgp group ibgp peer-as 100

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive