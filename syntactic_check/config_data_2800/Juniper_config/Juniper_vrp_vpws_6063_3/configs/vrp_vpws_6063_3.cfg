set system host-name ASBR1

set protocols ldp interface ge-0/0/0 

set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls ip

set interfaces ge-0/0/1 unit 0 family inet
set interfaces ge-0/0/1 unit 0 family mpls encapsulation mpls route-target import 1:1 
set interfaces ge-0/0/1 unit 0 family mpls encapsulation mpls route-target export 1:1 

setprotocols bgp group external type internal peer 1.1.1.9 as 100
set protocols bgp group external peer 1.1.1.9 source-address lo1

set protocols ospf area 0 network 2.2.2.9/32 
set protocols ospf area 0 network 10.10.1.0/24 

