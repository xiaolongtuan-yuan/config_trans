set system host-name PE1
set protocols ldp

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 unit 0 family ccc
set interfaces ge-1/0/0 unit 0 encapsulation vlan-id 100
set interfaces lo0 unit 0 family inet address 192.168.1.9/32

set routing-instances CE1-CE2 instance-type l2vpn
set routing-instances CE1-CE2 interface ge-1/0/0.0
set routing-instances CE1-CE2 protocols l2vpn encapsulation-type ethernet
set routing-instances CE1-CE2 protocols l2vpn peer-address 192.168.1.10 # 远端PE地址
set routing-instances CE1-CE2 protocols l2vpn interface ge-1/0/0.0 pseudowire-id 100