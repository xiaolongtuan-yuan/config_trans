set system host-name UPE2

set protocols ldp
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-1/0/0.1
set interfaces ge-1/0/0 unit 1 encapsulation vlan-id 1
set interfaces ge-1/0/0 unit 1 family mpls

set interfaces ge-0/0/0 unit 0 family inet address 10.10.4.2/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-1/0/0 unit 0 family inet address 5.5.5.9/32
set interfaces ge-1/0/0 unit 0 encapsulation flexible-ethernet-services
set interfaces ge-1/0/0 unit 0 family ccc

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive