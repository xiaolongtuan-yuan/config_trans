set system host-name LSRD

set protocols ldp

set protocols isis level 2 wide-metrics-only
set protocols isis level 2 disable
set protocols isis interface all

set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.2/24
set interfaces ge-1/0/0 unit 0 family iso
set protocols isis interface ge-1/0/0.0 point-to-point
set protocols mpls interface ge-1/0/0.0
set protocols rsvp interface ge-1/0/0.0
set interfaces ge-1/0/0 aggregated-ether-options link-speed 10g

set interfaces ge-1/0/2 unit 0 family inet address 10.4.1.1/24
set interfaces ge-1/0/2 unit 0 family iso
set protocols isis interface ge-1/0/2.0 point-to-point
set protocols mpls interface ge-1/0/2.0
set protocols rsvp interface ge-1/0/2.0
set interfaces ge-1/0/2 aggregated-ether-options link-speed 10g

set interfaces ge-1/0/1 unit 0 family inet address 10.5.1.1/24
set interfaces ge-1/0/1 unit 0 family iso
set protocols isis interface ge-1/0/1.0 point-to-point
set protocols mpls interface ge-1/0/1.0
set protocols rsvp interface ge-1/0/1.0
set interfaces ge-1/0/1 aggregated-ether-options link-speed 10g

set interfaces lo0 unit 0 family inet address 4.4.4.4/32
set interfaces lo0 unit 0 family iso
set protocols isis interface lo0.0