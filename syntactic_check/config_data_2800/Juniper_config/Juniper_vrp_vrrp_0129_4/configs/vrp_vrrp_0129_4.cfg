set system host-name PE3

set protocols ldp

set interfaces ge-1/0/3 unit 0 family inet address 172.16.35.5/24
set interfaces ge-1/0/3 unit 1 encapsulation vlan-id 10

set routing-instances ldp1 interface ge-1/0/3.1
set routing-instances ldp1 route-distinguisher 100:1

set interfaces ge-1/0/1 unit 0 family inet address 172.16.45.5/24
set interfaces ge-1/0/2 unit 0 family inet address 172.16.45.5/24
set interfaces lo0 unit 0 family inet address 5.5.5.5/32

set protocols bgp group ldp-vpls type internal
set protocols bgp group ldp-vpls local-address 5.5.5.5
set protocols bgp group ldp-vpls family l2vpn signaling
set protocols bgp group ldp-vpls neighbor 3.3.3.3
set protocols bgp group ldp-vpls neighbor 4.4.4.4

set routing-options router-id 5.5.5.5
set protocols ospf area 0.0.0.0 interface ge-1/0/3.0
set protocols ospf area 0.0.0.0 interface ge-1/0/1.0
set protocols ospf area 0.0.0.0 interface ge-1/0/2.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive