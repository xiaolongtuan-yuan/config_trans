set system host-name PE1

set protocols ldp
set protocols l2vpn

set interfaces ge-1/0/0 unit 0 family ethernet-switching
set interfaces ge-1/0/0.1 encapsulation dot1q 10
set interfaces ge-1/0/0.1 unit 0 family vfi v1
set interfaces ge-1/0/0.1 unit 2 pw-packet neighbor 2.2.2.2

set interfaces ge-2/0/0 unit 0 family inet address 10.10.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls ip
set interfaces ge-2/0/0 unit 0 family mpls ldp

set protocols ospf 1 area 0 network 10.10.1.0/255.255.255.0
set protocols ospf 1 area 0 network 1.1.1.1/255.255.255.255

set interfaces lo0 unit 0 family inet address 1.1.1.1/255.255.255.255
