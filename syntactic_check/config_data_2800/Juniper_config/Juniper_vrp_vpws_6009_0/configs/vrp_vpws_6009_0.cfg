set system host-name PE1

set interfaces se-2/0/1 unit 0 family inet
set interfaces se-2/0/2 unit 0 family inet
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces lo0 unit 0 family inet address 192.168.2.2/32

set routing-options router-id 192.168.2.2

set routing-instances ospf-1 instance-type vrf
set routing-instances ospf-1 interface ge-1/0/0.0
set routing-instances ospf-1 interface lo0.0

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0 passive