set system host-name PE1

set protocols ldp
set protocols ldp router-id 1.1.1.9
set protocols ldp transport-address 1.1.1.9

set interfaces ge-0/0/0 vlan-tagging
set interfaces ge-0/0/0 unit 1 encapsulation vlan-id 10
set interfaces ge-0/0/0 unit 1 family inet address 3.3.3.9/24
set interfaces ge-0/0/0 unit 1 family mpls
set protocols rsvp interface ge-0/0/0.1
set protocols mpls interface ge-0/0/0.1

set interfaces ge-2/0/0 unit 0 family inet address 10.1.1.1/24
set protocols rsvp
set protocols rsvp interface ge-2/0/0.0 bandwidth 5g
set protocols rsvp interface ge-2/0/0.0 subscription 80

set interfaces lo0 unit 0 family inet address 1.1.1.9/32

set interfaces gr-0/0/10 unit 10 description "Tunnel for TE"
set interfaces gr-0/0/10 unit 10 tunnel source 1.1.1.9
set interfaces gr-0/0/10 unit 10 tunnel destination 3.3.3.3

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf traffic-engineering
