set system host-name LSR-A
set protocols ldp
set protocols ldp router-id 1.1.1.1
set interfaces ge-1/0/1 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/2 unit 0 family inet address 10.1.2.1/24
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols rsvp interface ge-1/0/1.0
set protocols rsvp interface ge-1/0/2.0