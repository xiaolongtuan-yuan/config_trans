set system host-name LSR-A
set protocols ldp enable
set protocols ldp router-id loopback0
set interfaces ge-1/0/1 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/2 unit 0 family inet address 10.1.2.1/24
set interfaces lo0 unit 0 family inet address 1.1.1.1/32
set protocols mpls traffic-eng tunnel tun1 interface ge-1/0/1
set protocols mpls traffic-eng tunnel tun1 interface ge-1/0/2
set protocols mpls traffic-eng tunnel tun1 destination 5.5.5.5
set protocols mpls traffic-eng tunnel tun1 path-option 10 explicit host-name LSRA_PATH
set protocols mpls traffic-eng tunnel tun1 record-route
set protocols mpls traffic-eng tunnel tun1 autoroute announce
set protocols mpls traffic-eng tunnel tun1 backup-path LSR_A_BACKUP
set protocols mpls traffic-eng path-priority 1 tunnel-id 100
set protocols isis net 49.0001.0000.0000.0001.00 level-2-only
set protocols mpls traffic-eng level-2
set system services mpls traffic-eng router-id loopback0
