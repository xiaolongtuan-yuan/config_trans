set system host-name PE2

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set interfaces ge-0/0/0 unit 0 family inet address 10.20.1.2/30
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 4.4.4.9/32

set routing-instances vpn1 interface ge-0/0/0.0
set routing-instances vpn1 route-distinguisher 200:1
set routing-instances vpn1 vrf-target import target:1:1
set routing-instances vpn1 vrf-target export target:1:1

set protocols bgp group BGPPeer type internal
set protocols bgp group BGPPeer local-address 4.4.4.9
set protocols bgp group BGPPeer family l2vpn signaling
set protocols bgp group BGPPeer neighbor 3.3.3.9