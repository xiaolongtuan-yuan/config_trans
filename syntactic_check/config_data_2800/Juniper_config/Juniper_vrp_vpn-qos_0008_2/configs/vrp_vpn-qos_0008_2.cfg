set system host-name router
set routing-options router-id 2.2.2.9

set interfaces ge-0/0/0 unit 0 family mpls traffic-eng tunnel
setinterfaces ge-0/0/0 unit 0 family mpls bandwidth-max-reservable-width 5000
set interfaces ge-0/0/0 unit 0 family mpls bandwidth bc0 4000

set interfaces ge-0/0/1 unit 0 family mpls traffic-eng tunnel
setinterfaces ge-0/0/1 unit 0 family mpls bandwidth-max-reservable-width 5000
set interfaces ge-0/0/1 unit 0 family mpls bandwidth bc0 4000

set interfaces lo0 unit 0 family inet address 2.2.2.9/32
set protocols ospf router-id 2.2.2.9
set interfaces lo0 unit 0 family mpls label protocol ldp
set interfaces lo0 unit 0 family mpls traffic-eng area 0