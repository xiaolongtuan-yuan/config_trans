set system host-name DeviceE

set interfaces ge-3/0/1 unit 0 family inet address 1.1.2.1/24
set interfaces ge-3/0/2 unit 0 family inet address 1.1.1.1/24

set protocols bgp group TEST type external
set protocols bgp group TEST peer-as 200
set protocols bgp group TEST neighbor 1.1.1.2
set protocols bgp group TEST import ROUTE-RULE-IN
set routing-options autonomous-system 200

set routing-instances Serverset instance-type vrf
set routing-instances Serverset interface ge-3/0/1.0
set routing-instances Serverset vrf-target target:200:1

set policy-options policy-statement ROUTE-RULE-IN term TERM_IN from protocol direct
set policy-options policy-statement ROUTE-RULE-IN term TERM_IN then accept
set policy-options policy-statement ROUTE-RULE-OUT term TERM_OUT from protocol bgp
set policy-options policy-statement ROUTE-RULE-OUT term TERM_OUT then metric 100
set policy-options policy-statement ROUTE-RULE-OUT term TERM_OUT then preference 50

set routing-options static route 2.2.2.0/24 reject
set routing-options static route 3.3.3.0/24 reject

set routing-options router-id 1.1.2.1
set system login user admin class super-user