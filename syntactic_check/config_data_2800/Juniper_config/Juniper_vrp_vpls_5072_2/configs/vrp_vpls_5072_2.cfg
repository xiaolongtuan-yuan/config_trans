set system host-name PE3

set protocols ldp interface ge-1/0/2.0
set protocols mpls interface ge-1/0/2.0

set routing-instances vSi1 route-distinguisher 2:2
set routing-instances vSi1 vrf-target import target:2:2
set routing-instances vSi1 vrf-target export target:2:2
set routing-instances vSi1 interface ge-1/0/3.10

set interfaces ge-1/0/2 unit 0 family mpls

set interfaces ge-1/0/3 flexible-vlan-tagging
set interfaces ge-1/0/3 unit 10 vlan-id 10

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols bgp group ibgp type internal
set protocols bgp group ibgp neighbor 1.1.1.1
set protocols bgp group ibgp local-address 3.3.3.3
set protocols bgp group ibgp peer-as 100
set protocols bgp group ibgp family l2vpn signaling

set protocols ospf area 0.0.0.0 interface ge-1/0/2.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive