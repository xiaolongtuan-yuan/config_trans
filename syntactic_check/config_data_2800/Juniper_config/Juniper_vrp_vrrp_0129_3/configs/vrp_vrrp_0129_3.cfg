set system host-name PE2

set protocols ldp
set protocols ldp transport-address 4.4.4.4

set interfaces ge-0/0/2 unit 0 family mpls
set protocols mpls interface ge-0/0/2.0
set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 encapsulation flexible-ethernet-services
set interfaces ge-0/0/1 unit 1 encapsulation vlan-id 10
set interfaces ge-0/0/1 unit 1 family ccc
set protocols l2vpn interface ge-0/0/1.1
set interfaces ge-0/0/3 unit 0 family inet address 172.16.45.4/32
set interfaces ge-0/0/3 unit 0 family mpls
set protocols mpls interface ge-0/0/3.0
set protocols ldp interface ge-0/0/3.0

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set routing-options router-id 4.4.4.4
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/3.0

set routing-instances ldp1 route-distinguisher 100:1