set system host-name LSR-C
set protocols ldp

set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 0 family inet address 4.1.1.1/24

set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 0 family inet address 3.1.1.2/24

set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family inet address 3.3.1.2/24

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols isis interface all point-to-point

set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0