set system host-name LSR-A
set protocols ldp

set protocols rsvp interface ge-0/0/0.0
set protocols rsvp interface ge-0/0/1.0
set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0
set interfaces ge-0/0/0 encapsulation flexible-ethernet-services
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/1 encapsulation flexible-ethernet-services
set interfaces ge-0/0/1 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family inet address 10.1.2.1/24
set protocols isis interface ge-0/0/0.0 point-to-point
set protocols isis interface ge-0/0/1.0 point-to-point
set security policies from-zone Trust to-zone Trust policy Standard-Tunnel match source-address 2.2.2.9/32
set security policies from-zone Trust to-zone Trust policy Standard-Tunnel match source-address 3.3.3.9/32
set security policies from-zone Trust to-zone Trust policy Standard-Tunnel then permit