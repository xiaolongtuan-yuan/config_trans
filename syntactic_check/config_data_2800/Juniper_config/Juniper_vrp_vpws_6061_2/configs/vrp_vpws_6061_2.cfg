set system host-name PE1
set protocols ldp
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0

set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family inet address 192.168.1.1/24
set interfaces lo0 unit 0 family inet address 1.1.1.9/32

set routing-instances vcn1 instance-type l2vpn
set routing-instances vcn1 interface ge-0/0/0.0
set routing-instances vcn1 route-distinguisher 1.1.1.9:1
set routing-instances vcn1 vrf-target target:100:1

set protocols bgp group vpn-group type internal
set protocols bgp group vpn-group local-address 1.1.1.9
set protocols bgp group vpn-group neighbor 3.3.3.9
set protocols bgp group vpn-group family l2vpn signaling
set protocols bgp group vpn-group family inet unicast

set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive