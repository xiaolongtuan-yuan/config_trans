set system host-name PE1

set protocols ldp

set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 0 family mpls ldp enable

set interfaces ge-0/0/1 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family mpls ldp enable
set interfaces ge-0/0/1 unit 0 family inet address 192.168.1.1/24

set interfaces lo0 unit 0 family inet address 1.1.1.9/32

set vlans vcn1 vlan-id 10
set vlans vcn1 l2-vpn encapsulation mpls

set protocols l2vpn vnp1 routing-distinguisher auto
set protocols l2vpn vnp1 target 100:1
set protocols bgp 100
set protocols bgp 100 peer 3.3.3.9 remote-as 100
set protocols bgp 100 peer 3.3.3.9 update-source lo0
set protocols bgp 100 family inet
set protocols bgp 100 family inet peer 3.3.3.9 activate
set protocols bgp 100 family l2vpn-vpls
set protocols bgp 100 family l2vpn-vpls peer 3.3.3.9 activate
set protocols bgp 100 family l2vpn-vpls peer 3.3.3.9 send-community
set protocols bgp 100 family l2vpn-vpls peer 3.3.3.9 transport

set protocols ospf 1 area 0 network 1.1.1.9/32
set protocols ospf 1 area 0 network 192.168.1.0/24
