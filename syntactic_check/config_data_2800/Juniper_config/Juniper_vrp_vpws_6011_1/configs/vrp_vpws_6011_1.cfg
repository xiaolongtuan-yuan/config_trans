set system host-name RSGB

set protocols ldp interface ge-0/0/0.0
set protocols ldp neighbor 1.1.1.1

set interfaces se-2/0/0 encapsulation flexible-ethernet-services
set interfaces se-2/0/0 unit 0 encapsulation vlan-ccc
set interfaces se-2/0/0 unit 0 vlan-id 1
set protocols l2circuit local-switch interface se-2/0/0.0 remote-ip-address 1.1.1.1 virtual-circuit-id 100

set interfaces ge-0/0/0 unit 0 family inet address 10.0.1.1/24

set routing-options router-id 2.2.2.2
set routing-options autonomous-system 100

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set interfaces lo0 unit 0 family inet address 2.2.2.2/32