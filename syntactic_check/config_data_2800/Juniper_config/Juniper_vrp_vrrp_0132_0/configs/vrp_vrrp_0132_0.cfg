set system host-name DeviceA
set interfaces ge-0/0/1 unit 0 family inet address 192.168.1.1/24
set interfaces ge-0/0/1 standby address-family inet master-address 192.168.1.1 backup-address 192.168.1.2
set interfaces ge-0/0/2 unit 0 family inet address 10.1.1.1/24
set chassis slot 1 redundancy-group 1 priority 120
set routing-options router ospf 1 area 0 network 192.168.1.0/255.255.255.0
set routing-options router ospf 1 area 0 network 10.1.1.0/255.255.255.0
