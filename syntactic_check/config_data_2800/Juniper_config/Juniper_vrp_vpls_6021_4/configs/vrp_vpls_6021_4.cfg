set system host-name PE2
set protocols ldp

set interfaces ge-0/0/0 vlan-tagging
set interfaces ge-0/0/0 unit 1 vlan-id 10
set interfaces ge-0/0/0 unit 1 family inet address 10.20.1.1/30

set vlans vfi-v1 vlan-id 10
set interfaces ge-0/0/0 unit 0 family inet address 10.20.1.2/30

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 4.4.4.4
set protocols bgp group ibgp neighbor 3.3.3.3
set protocols bgp group ibgp family evpn signaling

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.1

set protocols ldp interface ge-0/0/0.0

set routing-instances vfi-v1 interface ge-0/0/0.1
set routing-instances vfi-v1 route-distinguisher 1.1.1.1:1
set routing-instances vfi-v1 vrf-target import target:1:1
set routing-instances vfi-v1 vrf-target export target:1:1