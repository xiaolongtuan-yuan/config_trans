set system host-name PE2
set protocols ldp enable
set protocols mpls
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan-id 10
set vlans vfi-v1 encapsulation dot1q 10
set interfaces ge-0/0/0.1 unit 0 family ether-options dhcp
set interfaces ge-0/0/0.1 unit 0 family inet address 10.20.1.2/30
set interfaces ge-0/0/0 unit 0 family inet address 10.20.1.1/30
set interfaces lo0 unit 0 family inet address 4.4.4.4/32
set protocols bgp group ibgp peer-as 200
set protocols bgp group ibgp local-address lo0.0
set protocols bgp group ibgp peer-address 3.3.3.3
set protocols bgp group ibgp advertise-communities
set protocols bgp group ibgp neighbor-loopsuppress
set protocols ospf area 0.0.0.0 interface ge-0/0/0.1.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.1.255
set vlans vfi-v1 forwarding-mode l2
set interfaces ge-0/0/0 unit 0 family mpls ldp
set routing-instances vfi-v1 instance-type vfi
set routing-instances vfi-v1 ethernet-vlan-id 10
set routing-instances vfi-v1 route-target export target:1:1
set routing-instances vfi-v1 route-target import target:1:1