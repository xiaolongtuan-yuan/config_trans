set system host-name Spine2

set interfaces ge-1/0/0 unit 0 family inet address 192.168.30.1/24
set interfaces ge-2/0/0 unit 0 family inet address 192.168.40.1/24
set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set routing-options static route 0.0.0.0/0 qualified-next-hop 192.168.30.2
set routing-options static route 0.0.0.0/0 qualified-next-hop 192.168.40.2

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive