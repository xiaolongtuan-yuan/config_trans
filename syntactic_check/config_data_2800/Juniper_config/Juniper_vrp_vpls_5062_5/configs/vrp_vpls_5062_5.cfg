set system host-name PE3
set protocols mpls ldp graceful-restart force 
set protocols mpls label-protocol ldp
set forwarding-plane vfi vplsa1 manual
set forwarding-plane vfi vplsa1 vpi 10
set forwarding-plane vfi vplsa1 vcid 10.10.1.1
set forwarding-plane vfi vplsa1 target 100:1
set interfaces ge-1/0/0 unit 0 family ethernet-switching dot1q-tunnel 10
set interfaces ge-1/0/0 unit 0家庭 Ethernet封装 dot1q-tunnel 10 需要调整为正确的命令语法
set protocols mpls ip interfaces ge-1/0/0.0
set protocols mpls ip interfaces ge-2/0/0
set routing-options router-id loopback0
set protocols bgp 100 peer 1.1.1.9 as 100
set protocols bgp 100 peer 1.1.1.9 update-source lo0.0
set protocols bgp 100 peer 2.2.2.9 as 100
set protocols bgp 100 peer 2.2.2.9 update-source lo0.0
set protocols bgp 100 family inet unicast send-community both
set protocols bgp 100 neighbor 1.1.1.9 activate
set protocols bgp 100 neighbor 2.2.2.9 activate
set routing-options route-options static route 3.3.3.9/32 next-hop self
set routing-options interfaces ge-1/0/0 unit 0 family inet address 10.20.3.2/24
set routing-options interfaces ge-2/0/0 unit 0 family inet address 10.10.1.2/24
set routing-options interfaces lo0 unit 0 family inet address 10.20.3.1/24
set protocols ospf 1 area 0 interface ge-1/0/0.0
set protocols ospf 1 area 0 interface ge-2/0/0
set protocols ospf 1 redistribute connected subnets
