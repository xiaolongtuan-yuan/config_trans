set system host-name PE3
set protocols ldp graceful-restart
set protocols ldp interface ge-1/0/0.0
set routing-instances vplsa1 interface ge-1/0/0.10
set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 unit 10 encapsulation vlan-vpls
set interfaces ge-1/0/0 unit 10 vlan-id 10
set routing-options router-id 3.3.3.9
set protocols bgp group internal type internal
set protocols bgp group internal local-address 3.3.3.9
set protocols bgp group internal family l2vpn signaling
set protocols bgp group internal neighbor 1.1.1.9
set protocols bgp group internal neighbor 2.2.2.9
set interfaces lo0 unit 0 family inet address 3.3.3.9/32
set interfaces ge-1/0/0 unit 0 family inet address 10.20.3.2/24
set interfaces ge-2/0/0 unit 0 family inet address 10.10.1.2/24
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf export connected-to-ospf
set policy-options policy-statement connected-to-ospf from protocol direct
set policy-options policy-statement connected-to-ospf then accept