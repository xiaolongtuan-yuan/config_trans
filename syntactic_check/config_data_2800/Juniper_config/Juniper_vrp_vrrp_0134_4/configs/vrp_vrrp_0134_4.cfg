set protocols ldp router-id 5.5.5.5
set interfaces ge-0/0/0 vlan-tagging
set interfaces ge-0/0/0 unit 0 encapsulation vlan-vpls
set interfaces ge-0/0/0 unit 0 vlan-id 10
