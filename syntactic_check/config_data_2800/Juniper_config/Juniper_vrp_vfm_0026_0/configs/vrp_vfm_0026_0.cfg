set system host-name SSH_Server
set system login user client001 authentication plain-text-password
set system login user client001 class super-user
set interfaces ge-0/0/0 unit 0 family inet address 10.137.217.223/16
set interfaces lo0 unit 0 family inet address 10.1.1.1/32
set system services ssh root-login allow
set system services ssh protocol-version v2
set system services ssh connection-limit 4
set security zones security-zone trust host-inbound-traffic system-services ssh
set security zones security-zone trust interfaces ge-0/0/0.0
set security policies default-policy permit-all