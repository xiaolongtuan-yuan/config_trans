set system host-name PE2
set protocols ldp

set interfaces ge-0/0/0 flexible-vlan-tagging
set interfaces ge-0/0/0 unit 0 family inet address 10.10.2.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 1 encapsulation vlan-id 10

set interfaces ge-1/0/0 unit 0 family inet address 10.20.3.1/24
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 2.2.2.9/32

set routing-options router-id 2.2.2.9

set routing-instances instance1 route-distinguisher 100:1
set routing-instances instance1 vrf-target target:100:1
set routing-instances instance1 interface ge-0/0/0.1

set protocols bgp group external type external
set protocols bgp group external neighbor 4.4.4.4 peer-as 100
set protocols bgp group external neighbor 5.5.5.5 peer-as 100
set protocols bgp group external local-address 2.2.2.9

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0