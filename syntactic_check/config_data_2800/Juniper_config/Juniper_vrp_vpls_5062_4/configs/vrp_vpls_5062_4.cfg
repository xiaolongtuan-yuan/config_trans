set system host-name PE2
set protocols ldp enable
set forwarding-options label allocate per-vpn
set forwarding_options vlan-forwarding encapsulation dot1q 10
set interfaces ge-0/0/0 unit 1 family ethernet-switching virtual-template-id 1
set interfaces ge-0/0/0 unit 1 family ethernet-switching virtual-path-name vpls_ad1
set interfaces ge-0/0/0 unit 1 family interface-vlan input vlan 10
set routing-options router-id 2.2.2.9
set routing-instances instance1 instance-type vpls
set routing-instances instance1 vfi vpls_ad1 target-network 100:1
set interfaces ge-0/0/0 family inet address 10.10.2.2/24
set interfaces ge-0/0/0.0 family mpls ip
set interfaces ge-0/0/0.0 family ethernet-switching vlan members default
set interfaces ge-0/0/0.0 unit 1 encapsulation dot1q 10
set interfaces ge-0/0/0.0 unit 1 family ethernet-switching port-mode access
set interfaces ge-1/0/0 family inet address 10.20.3.1/24
set protocols bgp group external type external peer-as 100
set protocols bgp group external local-address 2.2.2.9
set protocols bgp group external peer-group external
set routing-instances instance1 protocols bgp group external peer-as 100
set routing-instances instance1 protocols bgp group internal type internal peer-as 100
set interfaces ge-1/0/0 unit 0 family mpls ip
set protocols ospf area 0 interface ge-0/0/0.0
set protocols ospf area 0 interface ge-0/0/0.0 unit 1 inherit-attributes
