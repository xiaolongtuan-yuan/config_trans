set system host-name PE2

set interfaces se-3/0/1 unit 1 encapsulation ppp
set interfaces se-3/0/1 unit 1 family inet
set interfaces se-3/0/1 unit 2 encapsulation ppp
set interfaces se-3/0/1 unit 2 family inet

set protocols ldp interface se-3/0/1.1
set protocols ldp interface se-3/0/1.2

set interfaces ge-2/0/0 unit 0 family inet address 10.2.2.2/24
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0

set routing-options static route 0.0.0.0/0 next-hop 10.2.2.1