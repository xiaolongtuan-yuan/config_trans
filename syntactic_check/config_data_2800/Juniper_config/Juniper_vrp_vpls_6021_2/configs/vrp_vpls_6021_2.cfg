set system host-name ASBR1
set protocols ldp peer 1.1.1.1
set interfaces ge-2/0/0 unit 0 family inet address 10.10.1.2/30
set routing-instances vpni route-distinguisher 100:1
set routing-instances vpni vrf-target export target:1:1
set routing-instances vpni vrf-target import target:1:1
set interfaces ge-2/0/0 unit 10 vlan-id 10
set interfaces ge-2/0/0 unit 10 family inet
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members vlan1
set routing-options router-id 2.2.2.2
set routing-options autonomous-system 100
set protocols bgp group external type external
set protocols bgp group external peer-as 200
set protocols bgp group external neighbor 1.1.1.1
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0