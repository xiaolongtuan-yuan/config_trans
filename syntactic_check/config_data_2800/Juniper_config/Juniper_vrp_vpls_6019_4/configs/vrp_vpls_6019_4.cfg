set system host-name PE2
set protocols l2vpn

set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 0 family inet address 192.168.10.2/30

set interfaces ge-2/0/0 unit 1 encapsulation vlan-id 10
set routing-instances bgp-1 interface ge-2/0/0.1
set routing-instances bgp-1 route-distinguisher 100:1
set routing-instances bgp-1 vrf-target target:100:1

set routing-options router-id 3.3.3.9
set protocols bgp group vpls-peers type internal
set protocols bgp group vpls-peers local-address 3.3.3.9
set protocols bgp group vpls-peers neighbor 1.1.1.9
set protocols bgp group vpls-peers family l2vpn signaling

set interfaces lo0 unit 0 family inet address 3.3.3.9/32
set routing-options static route 0.0.0.0/0 next-hop 1.1.1.9

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive