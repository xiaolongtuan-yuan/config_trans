set system host-name DeviceA

set interfaces ge-0/0/1 unit 0 family inet address 192.168.1.1/24
set interfaces ge-0/0/2 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/2 unit 0 family ethernet-switching vlan members 10

set vlans bd-10vlan vlan-id 10

set interfaces irb unit 10 family inet address 192.168.10.1/24
set vlans bd-10vlan l3-interface irb.10

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set routing-options static route 1.1.1.2/32 next-hop 192.168.1.2