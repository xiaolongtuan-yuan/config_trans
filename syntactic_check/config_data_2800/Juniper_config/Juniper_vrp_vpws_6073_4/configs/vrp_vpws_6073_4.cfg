set system host-name PE2
set protocols ldp peer 1.1.1.1
set interfaces ge-0/0/0 unit 0 family inet address 192.168.1.2/24
set interfaces ge-0/0/1.100 encapsulation dot1q 100
set interfaces ge-0/0/1.100 family mpls encapsulation mpls forwarding-instance default-mfg
set routing-options routing-instance defaultTables route-table inet.0 import ospf-areao0
