set system host-name PE2

set protocols ldp router-id 3.3.3.9
set protocols ospf traffic-engineering
set protocols ospf area 0 interface lo0.0 passive
set protocols ospf area 0 interface ge-1/0/0.0
set protocols ospf area 0 interface ge-2/0/0.0

set interfaces ge-1/0/0 unit 0 family inet address 10.2.2.1/24
set interfaces ge-2/0/0 unit 0 family inet
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 3.3.3.9/32

set routing-options static route 0.0.0.0/0 next-hop 10.2.2.2

set protocols bgp group test type external
set protocols bgp group test peer-as 65001
set protocols bgp group test neighbor 10.10.10.10
set protocols bgp local-as 65000

set routing-instances vpg1 instance-type virtual-router
set routing-instances vpg1 interface ge-1/0/0.0
set routing-instances vpg1 interface ge-2/0/0.0
set routing-instances vpg1 interface lo0.0
set routing-instances vpg1 route-distinguisher 3:3
set routing-instances vpg1 protocols bgp group test peer-as 65001
set routing-instances vpg1 protocols bgp group test neighbor 10.10.10.1