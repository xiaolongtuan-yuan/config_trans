set system host-name PE2
set protocols ldp interface ge-0/0/0.0
set protocols mpls interface ge-0/0/0.0
set interfaces ge-0/0/0 unit 0 family inet address 10.2.2.1/24
set protocols rsvp interface ge-0/0/0.0 subscription 80
set protocols rsvp interface ge-0/0/0.0 bandwidth 5g
set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 unit 1 encapsulation vlan-id 20
set interfaces ge-0/0/1 unit 1 family inet
set vlans management vlan-id 20
set vlans management interface ge-0/0/1.1

set routing-instances PE2-lsr instance-type forwarding
set routing-instances PE2-lsr interface lo0.0
set routing-instances PE2-lsr routing-options router-id 1.1.1.1
set interfaces ge-1/0/0 unit 0 family inet filter input traffic-eng-pol

set routing-instances PE2-lsr protocols ospf area 0.0.0.0 interface lo0.0 passive
set routing-options static route 10.2.2.0/24 next-hop 10.2.2.1