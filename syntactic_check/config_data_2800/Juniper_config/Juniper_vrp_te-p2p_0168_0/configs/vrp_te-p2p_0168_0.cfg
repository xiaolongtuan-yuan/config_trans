set system host-name LSR-A
set protocols ldp interface ge-0/0/0.0
set interfaces ge-0/0/0 unit 0 family inet address 2.1.1.1/24
set interfaces lo0 unit 0 family inet address 1.1.1.1/32
set protocols rsvp

set routing-options static route 2.2.2.2/32 next-hop 2.1.1.2
set routing-options static route 3.3.3.3/32 next-hop 2.1.1.2
