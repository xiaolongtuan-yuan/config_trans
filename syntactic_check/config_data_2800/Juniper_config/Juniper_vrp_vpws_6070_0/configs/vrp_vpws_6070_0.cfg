set system host-name CE1

set vlans vlan10 vlan-id 10
set vlans vlan10 l3-interface irb.10

set interfaces irb unit 10 family inet address 10.1.1.1/24

set interfaces ge-0/0/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members vlan10
set interfaces ge-0/0/0 disable

set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members vlan10
set interfaces ge-0/0/1 disable

set protocols oam ethernet connectivity-fault-management
set protocols oam ethernet connectivity-fault-management maintenance-domain md-md-1 level 0
set protocols oam ethernet connectivity-fault-management maintenance-domain md-md-1 maintenance-association ma-ma-1
set protocols oam ethernet connectivity-fault-management maintenance-domain md-md-1 maintenance-association ma-ma-1 mep 2 interface irb.10 direction down
set protocols oam ethernet connectivity-fault-management maintenance-domain md-md-1 maintenance-association ma-ma-1 remote-mep 1

set protocols oam ethernet connectivity-fault-management maintenance-domain md-md-2 level 0
set protocols oam ethernet connectivity-fault-management maintenance-domain md-md-2 maintenance-association ma-ma-2
set protocols oam ethernet connectivity-fault-management maintenance-domain md-md-2 maintenance-association ma-ma-2 mep 4 interface irb.10 direction down
set protocols oam ethernet connectivity-fault-management maintenance-domain md-md-2 maintenance-association ma-ma-2 remote-mep 3