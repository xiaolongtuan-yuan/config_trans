set system host-name LSR-A
set routing-options autonomous-system 65000

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces lt-0/0/0 unit 1 family inet
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols isis
set protocols isis interface ge-0/0/0.0 point-to-point
set protocols isis interface lo0.0 passive

set protocols ldp interface ge-0/0/0.0

set protocols mpls interface lt-0/0/0.1

set routing-instances r1 instance-type vrf

set forwarding-options
set policy-options policy-statement NEXT-HOP-SELECTION then next-hop 1.1.1.1