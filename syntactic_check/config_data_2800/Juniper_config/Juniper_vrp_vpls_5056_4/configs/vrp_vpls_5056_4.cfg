set interfaces eth0 unit 10 family ethernet-switching trunk-ports [Ethernet1/0/0 Ethernet1/0/1]
set interfaces lo0 unit 0 family inet address 5.5.5.5/32
set protocols ospf area 0 network 5.5.5.5/32
set protocols ospf area 0 network 192.168.50.0/24
set protocols ospf area 0 network 192.168.60.0/24
set interfaces ge-0/0/2 family inet address 192.168.60.2/24
set interfaces ge-0/0/0 family inet address 192.168.50.2/24
set forwarding-options l2vpns ldp enable
set forwarding-options l2vpns ldp sync enable
set forwarding-options l2vpns vn-segment-type vlans
set vlans vlan-1 interface ge-0/0/0
set vlans vlan-1 interface lo0
set vlans vlan-1 forwarding-mode transparent
set mpls lsr-id 5.5.5.5
set interfaces xe-0/0/3 unit 0 family inet address 192.168.60.2/24
set interfaces xe-0/0/1 unit 0 family inet address 192.168.50.2/24