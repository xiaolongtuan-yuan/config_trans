set system host-name PE1

set protocols ldp interface lo0.0
set protocols ldp router-id 1.1.1.1

set interfaces ge-0/0/0 unit 0 family ethernet-switching port-mode access
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members vlan-100
set interfaces ge-1/0/0 unit 0 family ethernet-switching port-mode access
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members vlan-100

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols ospf area 0.0.0.0 interface lo0.0 passive