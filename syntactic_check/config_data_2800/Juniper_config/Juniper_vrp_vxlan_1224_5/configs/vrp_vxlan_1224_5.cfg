set system host-name Leaf4
set interfaces ge-0/0/0 unit 0 family inet address 192.168.40.2/24
set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode access
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members 10

set routing-instances default instance-type vrf
set routing-instances default route-distinguisher 1:10
set routing-instances default interface ge-0/0/0.0
set routing-instances default interface ge-0/0/1.0

set protocols bgp group internal type internal
set protocols bgp group internal local-address 4.4.4.4
set protocols bgp group internal neighbor 3.3.3.3
set protocols bgp group internal peer-as 200

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set interfaces lo0 unit 0 family inet address 4.4.4.4/32
