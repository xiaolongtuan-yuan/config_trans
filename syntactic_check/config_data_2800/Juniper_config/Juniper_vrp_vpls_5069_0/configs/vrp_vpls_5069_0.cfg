set system host-name PE1
set protocols bfd session to-neighbor source-address 1.1.1.1 destination-address 2.2.2.2 discriminator local 104 remote 401
set protocols bfd session to-neighbor2 source-address 1.1.1.1 destination-address 3.3.3.3 discriminator local 104 remote 401
set interfaces ge-0/0/0 flexible-vlan-tagging
set interfaces ge-0/0/0 encapsulation flexible-ethernet-services
set interfaces ge-0/0/0 unit 0 family bridge
set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 encapsulation flexible-ethernet-services
set interfaces ge-0/0/1 unit 0 family bridge
set interfaces ge-0/0/2 flexible-vlan-tagging
set interfaces ge-0/0/2 encapsulation flexible-ethernet-services
set interfaces ge-0/0/2 unit 10 encapsulation vlan-bridge
set interfaces ge-0/0/2 unit 10 vlan-id 10

set routing-instances vsi1 interface ge-0/0/0.0
set routing-instances vsi1 interface ge-0/0/1.0
set routing-instances vsi1 interface ge-0/0/2.10

set protocols ldp

set interfaces lo0 unit 0 family inet address 1.1.1.1/32
set interfaces ge-0/0/0 disable
set interfaces ge-0/0/1 disable
set interfaces ge-0/0/2 disable
set routing-options router-id 1.1.1.1