set system host-name DeviceE
set interfaces ge-0/0/1 unit 0 family inet address 1.1.2.1/24
set interfaces ge-0/0/2 unit 0 family inet address 1.1.1.1/24
set protocols bgp group external type external
set protocols bgp group external neighbor 1.1.1.2 peer-as 200
set protocols bgp group external neighbor 1.1.2.2 peer-as 200
delete protocols bgp synchronization
set protocols bgp group external family inet unicast
set protocols bgp group external neighbor 1.1.1.2 import r3
set protocols bgp group external neighbor 1.1.2.2 import r2
set policy-options policy-statement out term 1 from route-filter 2.2.2.0/24 exact
set policy-options policy-statement out term 1 then accept
set policy-options policy-statement out term 2 from route-filter 3.3.3.0/24 exact
set policy-options policy-statement out term 2 then accept