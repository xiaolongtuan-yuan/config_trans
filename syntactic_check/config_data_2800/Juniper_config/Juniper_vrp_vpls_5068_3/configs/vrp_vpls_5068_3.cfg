set system host-name PE4
set protocols ldp interface all
set protocols ldp router-id 4.4.4.4

set interfaces ge-1/0/1 unit 0 family inet address 192.168.6.2/24
set interfaces ge-1/0/1 unit 0 family mpls
set interfaces ge-1/0/3 unit 0 family inet address 192.168.5.1/24
set interfaces ge-1/0/3 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set protocols bgp group internal type internal
set protocols bgp group internal local-address 4.4.4.4
set protocols bgp group internal neighbor 3.3.3.3
set protocols bgp group internal peer-as 100
set protocols bgp group external type external
set protocols bgp group external local-address 4.4.4.4
set protocols bgp group external neighbor 5.5.5.5
set protocols bgp group external peer-as 100
set protocols bgp group internal family inet unicast
set protocols bgp group external family inet unicast
set protocols bgp group internal export send-community
set protocols bgp group external export send-community

set protocols ospf area 0.0.0.0 interface ge-1/0/1
set protocols ospf area 0.0.0.0 interface ge-1/0/3
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set routing-instances v1 interface ge-1/0/1.0
set routing-instances v1 interface ge-1/0/3.0
