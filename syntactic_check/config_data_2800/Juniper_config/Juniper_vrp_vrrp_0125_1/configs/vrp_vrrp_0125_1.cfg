set system host-name DeviceB
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24 standby 1 ip 10.1.1.1
set interfaces ge-0/0/0 unit 0 family inet dhcp
set interfaces ge-0/0/1 unit 0 family inet address 192.168.2.1/24
set routing-options static route 0.0.0.0/0 next-hop <next-hop-ip>
set routing-options ospf area 0 interface ge-0/0/0.0
set routing-options ospf area 0 interface ge-0/0/1.0
