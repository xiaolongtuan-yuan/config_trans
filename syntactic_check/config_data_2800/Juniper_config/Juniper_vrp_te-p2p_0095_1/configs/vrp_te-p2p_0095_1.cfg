set system host-name LSRB

set protocols ldp interface ge-0/0/0.0
set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/1/0.0
set protocols mpls interface ge-0/2/0.0

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/1/0.0
set protocols ospf area 0.0.0.0 interface ge-0/2/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set interfaces ge-0/0/0 unit 0 family inet address 192.168.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols rsvp interface ge-0/0/0.0 bandwidth 100m

set interfaces ge-0/1/0 unit 0 family inet address 192.168.2.1/24
set interfaces ge-0/1/0 unit 0 family mpls

set interfaces ge-0/2/0 unit 0 family inet address 192.168.3.1/24
set interfaces ge-0/2/0 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 2.2.2.2/32
set interfaces lo0 unit 0 family mpls

