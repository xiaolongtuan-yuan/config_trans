set system host-name PE2

set protocols ldp peer 3.3.3.3
set protocols ldp interface ge-0/0/0.0
set routing-instances bgp-ad1 instance-type vrf
set routing-instances bgp-ad1 interface ge-0/0/0.1
set routing-instances bgp-ad1 route-distinguisher 100:1
set routing-instances bgp-ad1 vrf-target import target:200:1
set routing-instances bgp-ad1 vrf-target export target:200:1

set interfaces ge-0/0/0 unit 0 family inet address 10.20.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols mpls interface ge-0/0/0.0
set protocols ldp interface ge-0/0/0.0

set interfaces ge-0/0/0 unit 1 encapsulation vlan-id 10
set interfaces ge-0/0/0 unit 1 family inet
set interfaces ge-0/0/0 vlan-tagging

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set routing-options static route 0.0.0.0/0 next-hop 4.4.4.4
set protocols bgp group external type external
set protocols bgp group external neighbor 3.3.3.3
set protocols bgp group external peer-as 200
set protocols bgp group external local-address 4.4.4.4
set routing-instances bgp-ad1 protocols bgp group internal type internal
set routing-instances bgp-ad1 protocols bgp group internal local-address 4.4.4.4

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive