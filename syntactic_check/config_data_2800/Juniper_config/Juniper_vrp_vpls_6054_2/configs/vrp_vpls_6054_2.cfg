set system host-name PE1

set protocols ldp router-id 1.1.1.1
set protocols ldp interface ge-1/0/0.0

set vlans v1 vlan-id 10
set interfaces ge-1/0/0 vlan-tagging
set interfaces ge-1/0/0 unit 1 encapsulation vlan-id 10
set routing-instances v1 interface ge-1/0/0.1
set routing-instances v1 route-distinguisher 100:1
set routing-instances v1 vrf-target target:100:1
set routing-instances v1 protocols l2vpn site 1 site-identifier 20

set protocols oam ethernet connectivity-fault-management maintenance-domain md1 level 1
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 2 interface ge-1/0/0.1 direction out
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 2 continuity-check interval 1s

set interfaces ge-2/0/0 unit 0 family inet address 192.168.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls
set protocols ldp interface ge-2/0/0.0
set protocols mpls interface ge-2/0/0.0

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0