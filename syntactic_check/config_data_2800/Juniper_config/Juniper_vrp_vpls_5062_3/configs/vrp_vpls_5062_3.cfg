set system host-name PE1

set protocols ldp router-id 1.1.1.9
set routing-options router-id 1.1.1.9
set routing-options autonomous-system 100

set interfaces ge-0/0/0 flexible-vlan-tagging
set interfaces ge-0/0/0 unit 10 vlan-id 10
set interfaces lo0 unit 0 family inet address 1.1.1.9/32

set protocols bgp group external type external
set protocols bgp group external neighbor 2.2.2.9
set protocols bgp group external peer-as 100
set protocols bgp group internal type internal
set protocols bgp group internal neighbor 3.3.3.9
set protocols bgp group internal local-address 1.1.1.9

set routing-instances vpslad1 interface ge-0/0/0.10
set routing-instances vpslad1 route-distinguisher 1.1.1.9:1
set routing-instances vpslad1 vrf-target target:10:10

set protocols ospf area 0 interface ge-0/0/0.10
set protocols ospf area 0 interface lo0.0 passive