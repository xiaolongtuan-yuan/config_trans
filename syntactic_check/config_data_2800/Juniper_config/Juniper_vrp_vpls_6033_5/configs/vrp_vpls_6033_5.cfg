set system host-name SPE2
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0

set interfaces ge-0/0/0 flexible-vlan-tagging
set interfaces ge-0/0/0 encapsulation flexible-ethernet-services
set interfaces ge-0/0/0 unit 0 vlan-id 100

set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 encapsulation flexible-ethernet-services
set interfaces ge-0/0/1 unit 0 vlan-id 100

set interfaces lo0 unit 0 family inet address 3.3.3.9/32

set routing-instances test interface ge-0/0/0.0
set routing-instances test interface ge-0/0/1.0

set protocols ospf area 0.0.0.0 interface lo0.0 passive