set system host-name Device3
set bridge-domains bd10 domain-type bridge
set bridge-domains bd10 vlan-id none
set bridge-domains bd10 vxlan vni 5010
set bridge-domains bd10 vxlan source-interface lo0.0
set bridge-domains bd10 vxlan unicast-remote-ip 2.2.2.2

set interfaces ge-1/0/1 unit 0 family inet address 192.168.2.2/24

set interfaces ge-1/0/2 flexible-vlan-tagging
set interfaces ge-1/0/2 unit 0 disable
set interfaces ge-1/0/2 unit 20 family ethernet-switching
set interfaces ge-1/0/2 unit 20 vlan-id 20

set bridge-domains bd10 interface ge-1/0/2.20

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/1.0