set system host-name ASBR1

set routing-instances bgp-ad1 instance-type vrf
set routing-instances bgp-ad1 route-distinguisher 100:1
set routing-instances bgp-ad1 vrf-target export target:200:1
set routing-instances bgp-ad1 vrf-target import target:200:1

set protocols ldp

set interfaces ge-2/0/0 unit 10 encapsulation vlan-bridge
set interfaces ge-2/0/0 unit 10 vlan-id 10
set interfaces ge-2/0/0 unit 10 family bridge interface-mode trunk
set routing-instances bgp-ad1 interface ge-2/0/0.10

set interfaces ge-1/0/0 unit 0 family inet address 10.10.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols ldp interface ge-1/0/0.0

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address 2.2.2.2
set protocols bgp group IBGP neighbor 1.1.1.1

set routing-instances bgp-ad1 protocols bgp group EBGP type external
set routing-instances bgp-ad1 protocols bgp group EBGP peer-as 200

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive