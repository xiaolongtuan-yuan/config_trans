set system services bgp as 100
set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.2 255.255.255.0
set interfaces ge-0/0/0 unit 0 family mpls ip
set interfaces ge-0/0/0 unit 0 family mpls label switched-path-candidate neighbor 10.20.1.2 in-band-source 
set interfaces ge-0/0/0 unit 0 family mpls ldp
set interfaces ge-1/0/0 unit 0 family inet address 10.20.1.1 255.255.255.0
set interfaces ge-1/0/0 unit 0 family mpls ip
set interfaces ge-1/0/0 unit 0 family mpls label switched-path-candidate neighbor 10.20.1.1 in-band-source 
set routing-options static route 0.0.0.0/0 next-hop 1.1.1.1
set routing-options neighbors 1.1.1.1 peer-as 100
set routing-options neighbor 1.1.1.1 update-source lo0
set routing-options protocols ospf area 0 interface ge-0/0/0.0
set routing-options interfaces lo0 unit 0 family inet address 2.2.2.2/32
set routing-options policies host-name map-policy1 rule 10 match mpls-label then set mpls-label
set routing-options policies host-name map-policy2 rule 10 then set mpls-label
set protocols bgp peer-group pgroup-1
set protocols bgp peer-group pgroup-1 remote-as 100
set protocols bgp peer-group pgroup-1 update-source lo0
set protocols bgp group pgroup-1 type external
set protocols bgp neighbor 1.1.1.1 peer-group pgroup-1 route-map map-policy1 out
set protocols bgp peer-group pgroup-2
set protocols bgp peer-group pgroup-2 remote-as 200
set protocols bgp peer-group pgroup-2 update-source in-band-source
set protocols bgp group pgroup-2 type external
set protocols bgp neighbor 10.20.1.2 peer-group pgroup-2 route-map map-policy2 out

