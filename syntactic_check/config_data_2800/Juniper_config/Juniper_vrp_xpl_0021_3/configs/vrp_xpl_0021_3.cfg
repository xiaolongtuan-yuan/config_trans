set system host-name DeviceD
set interfaces ge-0/0/1 unit 0 family inet address 1.1.2.2/24
set interfaces ge-0/0/2 unit 0 family inet address 1.1.4.1/24
set routing-options router-id 1.1.2.2

set protocols bgp group internal type external
set protocols bgp group internal neighbor 1.1.2.1
set protocols bgp group internal peer-as 200

set protocols bgp group external type external
set protocols bgp group external neighbor 1.1.4.2
set protocols bgp group external peer-as 100