set system host-name PE4

set protocols ldp interface GigabitEthernet1/0/0
set protocols ldp interface GigabitEthernet1/0/1
set protocols ldp interface GigabitEthernet1/0/2

set interfaces GigabitEthernet1/0/0 unit 0 family inet address 192.168.5.2/32
set interfaces GigabitEthernet1/0/1 unit 0 family inet address 192.168.4.2/32
set interfaces GigabitEthernet1/0/2 unit 0 family inet address 0.0.0.0/0

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set protocols bgp group external type external
set protocols bgp group external peer 2.2.2.2 as 100
set protocols bgp group external update-source lo0.0
set protocols bgp group internal type internal
set protocols bgp group internal peer 2.2.2.2 as 100
set protocols bgp group internal update-source lo0.0
set protocols bgp group internal activate
set protocols bgp group external activate

set routing-options protocols ospf area 0 network 4.4.4.4/32
set routing-options protocols ospf area 0 network 192.168.4.0/24
set routing-options protocols ospf area 0 network 192.168.5.0/24
set routing-options protocols ospf area 0 network 192.168.6.0/24

set vfi vSi1 interface GigabitEthernet1/0/2
set vfi vSi1 tunnel-type ip-in-ip
set vfi vSi1 store-localsequence true
set vfi vSi1 local-label 1
set protocols bgp group vSi1 type external
set protocols bgp group vSi1 peer 2.2.2.2 as 100
set protocols bgp group vSi1 activate
set protocols bgp group vSi1 authentication none
set protocols bgp group vSi1 peer-as 100
set protocols bgp group vSi1 local-address lo0.0
set protocols bgp group vSi1 local-label 1