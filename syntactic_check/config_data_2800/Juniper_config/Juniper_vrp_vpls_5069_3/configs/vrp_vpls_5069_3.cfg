set system host-name PE4

set protocols ldp interface ge-1/0/0
set protocols ldp interface ge-1/0/1
set protocols ldp interface ge-1/0/2

set interfaces ge-1/0/0 unit 0 family inet address 192.168.5.2/32
set interfaces ge-1/0/1 unit 0 family inet address 192.168.4.2/32

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set protocols bgp group external type external
set protocols bgp group external neighbor 2.2.2.2 peer-as 100
set protocols bgp group external local-address 4.4.4.4
set protocols bgp group external family inet unicast
set protocols bgp group internal type internal
set protocols bgp group internal neighbor 2.2.2.2 peer-as 100
set protocols bgp group internal local-address 4.4.4.4
set protocols bgp group internal family inet unicast

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/1.0

set routing-instances vSi1 interface ge-1/0/2.0
set protocols bgp group vSi1 family l2vpn signaling
set protocols bgp group vSi1 neighbor 2.2.2.2 peer-as 100
set protocols bgp group vSi1 local-address 4.4.4.4