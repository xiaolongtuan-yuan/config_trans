set system host-name LSR-E
set protocols ldp interface ge-0/0/0
set interfaces ge-0/0/0 unit 0 family ip address 10.1.4.2/24
set interfaces ge-0/0/0 unit 0 family mpls traffic-eng tunnels
set interfaces ge-0/0/1 unit 0 family ip address 10.1.5.1/24
set interfaces ge-0/0/1 unit 0 family mpls traffic-eng tunnels
set protocols ldp interface ge-0/0/1
set system services mpls traffic-eng administrative-weight 10
set interfaces lo0 unit 0 family ip address 5.5.5.5/32
set routing-options router-id Loopback1
set routing-options ospf instance/default area 0 network 5.5.5.5.0.0.0.0
set routing-options ospf instance/default area 0 network 10.1.4.0.0.0.255
set routing-options ospf instance/default area 0 network 10.1.5.0.0.0.255