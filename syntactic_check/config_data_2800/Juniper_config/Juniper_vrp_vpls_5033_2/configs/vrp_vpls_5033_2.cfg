set system host-name UPE1
set protocols ldp router-id 4.4.4.9

set interfaces ge-0/0/0 unit 0 family inet address 10.10.3.2/24
set interfaces ge-1/0/0 unit 0 family inet

set interfaces ge-2/0/0 flexible-vlan-tagging
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 1 encapsulation vlan-id 1
set interfaces ge-2/0/0 unit 1 family inet

set interfaces lo0 unit 0 family inet address 4.4.4.9/32

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.1
set protocols ospf area 0.0.0.0 interface lo0.0 passive