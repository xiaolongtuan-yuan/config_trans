set system host-name PE2

set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 unit 1 encapsulation vlan-bridge
set interfaces ge-0/0/1 unit 1 vlan-id 1
set interfaces ge-0/0/1 unit 1 family bridge

set protocols ldp interface ge-0/0/2.0
set protocols bgp group evpn-group type internal
set protocols bgp group evpn-group local-address 2.2.2.2
set protocols bgp group evpn-group family evpn signaling
set protocols bgp group evpn-group neighbor 1.1.1.1
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0

set routing-instances EVPN protocols evpn encapsulation vxlan
set routing-instances EVPN protocols evpn extended-vni-list all

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols oam ethernet connectivity-fault-management domain md1 level 7
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 1 direction down
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 1 interface ge-0/0/1.1
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 continuity-check-measurement disable