set system host-name PE1
set protocols ldp enable
set protocols ldp router-id loopback1
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 0 family mpls encapsulation mpls-l2transport
set interfaces lo0 unit 0 family inet address 1.1.1.1/32
set interfaces ge-0/0/0 unit 0 family mpls
set protocols ldp peer 4.4.4.4 remote-as 200 update-source lo0
set routing-options router-id lo0.0
set protocols bgp group internal type internal peer 2.2.2.2 as-range 100
set protocols bgp group external type external peer 4.4.4.4 as-range 200 multipath-sessions 255 update-source lo0
set protocols rip 1 network 1.1.1.1/32 area 0
set protocols rip 1 network 10.10.1.0/24 area 0
