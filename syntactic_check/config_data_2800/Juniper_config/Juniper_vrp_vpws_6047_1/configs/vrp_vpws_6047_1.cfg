set system host-name PE1
set protocols ldp
set protocols ldp interface ge-0/0/0.0
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 0 encapsulation ethernet-ccc
set interfaces lo0 unit 0 family inet address 1.1.1.1/32
set protocols ldp interface ge-1/0/0.0
set routing-options router-id 1.1.1.1
set protocols bgp group internal type internal
set protocols bgp group internal neighbor 2.2.2.2
set protocols bgp group internal local-address 1.1.1.1
set protocols bgp group external type external
set protocols bgp group external neighbor 4.4.4.4
set protocols bgp group external peer-as 200
set protocols bgp group external local-address 1.1.1.1
set protocols ospf area 0.0.0.0 interface lo0.0 passive