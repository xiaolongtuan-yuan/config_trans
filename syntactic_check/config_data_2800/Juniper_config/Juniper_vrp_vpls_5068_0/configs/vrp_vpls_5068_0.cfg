set system host-name PE1

set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp targeted-session 2.2.2.2
set protocols ldp targeted-session 3.3.3.3

set interfaces ge-0/0/0 unit 0 family inet address 192.168.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols ldp interface ge-0/0/0.0

set interfaces ge-0/0/1 unit 0 family inet address 192.168.2.1/24
set interfaces ge-0/0/1 unit 0 family mpls
set protocols ldp interface ge-0/0/1.0

set interfaces ge-0/0/2 unit 1 encapsulation vlan-id 10
set interfaces ge-0/0/2 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/2 unit 0 family ethernet-switching vlan members all

set chassis aggregated-devices ethernet device-count 0

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set interfaces lo0 unit 0 family inet address 1.1.1.1/32
