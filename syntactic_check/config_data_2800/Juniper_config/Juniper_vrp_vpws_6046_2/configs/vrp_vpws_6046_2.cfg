set system host-name ASBR1

set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.2/30
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-1/0/0 encapsulation flexible-ethernet-services
set interfaces ge-1/0/0 unit 0 family ccc
set interfaces ge-1/0/0 unit 0 family mpls

set chassis fpc 1 pic 0 tunnel-services bandwidth 1g
set protocols ospf area 0 interface ge-0/0/0.0
set protocols ospf area 0 interface lo0.0 passive
set routing-options router-id 2.2.2.2

set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp session 2.2.2.2 authentication-key "$9$secret"

set protocols l2circuit neighbor 10.10.1.1 interface ge-1/0/0.0 virtual-circuit-id 100