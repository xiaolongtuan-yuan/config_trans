set system host-name PE2

set protocols ldp enable
set protocols ldp router-id loopback0

set interfaces ge-0/0/0 unit 0 family inet address 10.1.2.2/30
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family inet address 10.1.5.1/30
set interfaces ge-0/0/1 unit 0 family mpls

set interfaces ge-0/0/3 unit 1 encapsulation dot1q 10

set routing-instances vfi1 interface ge-0/0/3.1

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols bgp group ibgp type internal
set protocols bgp group ibgp neighbor 1.1.1.1
set protocols bgp group ibgp local-address 2.2.2.2
set protocols bgp group ibgp family evpn signaling

set protocols ospf area 0.0.0.0 interface ge-0/0/3.1

set protocols ldp interface ge-0/0/0.0
set protocols rsvp interface all