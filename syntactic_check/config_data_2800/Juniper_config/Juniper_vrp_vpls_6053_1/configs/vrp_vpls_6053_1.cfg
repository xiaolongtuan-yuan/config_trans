set system host-name PE1
set protocols ldp interface all
set protocols ldp router-id 1.1.1.1

set chassis aggregated-devices ethernet device-count 1

set routing-instances vplsa-1 interface ge-1/0/0.1
set protocols ldp neighbor 200.1.1.1

set interfaces ge-1/0/0 unit 1 encapsulation vlan-id 10

set interfaces ge-2/0/0 unit 0 family inet address 10.10.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls
set protocols mpls interface lo0.0

set protocols bgp group bgp-internal type internal
set protocols bgp group bgp-internal neighbor 2.2.2.2
set protocols bgp group bgp-internal local-address 1.1.1.1
set protocols bgp group bgp-internal family inet labeled-unicast
set protocols bgp group ebgp-external type external
set protocols bgp group ebgp-external neighbor 4.4.4.4
set protocols bgp group ebgp-external peer-as 200
set protocols bgp group ebgp-external multihop
set protocols bgp group ebgp-external local-address 1.1.1.1
set protocols bgp group ebgp-external family l2vpn signaling

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.1