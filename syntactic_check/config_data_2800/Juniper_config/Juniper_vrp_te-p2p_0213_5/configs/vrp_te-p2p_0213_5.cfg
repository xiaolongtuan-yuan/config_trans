set system host-name LSRF
set protocols ldp
set protocols ldp interface ge-1/0/2.0
set protocols ldp interface ge-1/0/1.0
set protocols isis level 2 wide-metrics-only
set protocols isis interface ge-1/0/2.0
set protocols isis interface ge-1/0/1.0
set interfaces ge-1/0/2 unit 0 family inet address 10.1.5.2/24
set interfaces ge-1/0/2 unit 0 family mpls
set interfaces ge-1/0/1 unit 0 family inet address 10.1.7.2/24
set interfaces ge-1/0/1 unit 0 family mpls
set interfaces lo0 unit 1 family inet address 6.6.6.6/32
set routing-options router-id 6.6.6.6