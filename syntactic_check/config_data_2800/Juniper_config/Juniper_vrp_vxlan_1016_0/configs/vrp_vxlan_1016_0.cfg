set system host-name Device1

set interfaces ge-1/0/0 unit 0 family inet address 192.168.1.1/24
set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 unit 0 family ethernet-switching interface-mode trunk

set interfaces irb unit 5010 family inet address 10.10.10.1/24

set protocols ospf area 0.0.0.0 interface irb.5010

set routing-instances vni5010 instance-type vrf
set routing-instances vni5010 interface ge-1/0/1.1
set routing-instances vni5010 route-distinguisher 800:800

set interfaces lo0 unit 0 family inet address 2.2.2.2/32