set system host-name SPE1
set protocols ldp router-id 1.1.1.9

set routing-instances v100 instance-type l2vpn
set routing-instances v100 protocols l2vpn interface ge-1/0/0.0
set routing-instances v100 protocols l2vpn encapsulation-type ethernet
set routing-instances v100 vrf-target target:100:100

set protocols l2circuit interface ge-1/0/0.0 neighbor 1.1.1.9 virtual-circuit-id 300
set protocols l2circuit interface ge-1/0/0.1 neighbor 1.1.1.9 virtual-circuit-id 200

set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 unit 0 family inet address 10.10.1.1/24
set interfaces ge-1/0/0 unit 1 family inet address 10.10.3.1/24

set interfaces lo0 unit 0 family inet address 1.1.1.9/32
set routing-options router-id 1.1.1.9

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/0.1