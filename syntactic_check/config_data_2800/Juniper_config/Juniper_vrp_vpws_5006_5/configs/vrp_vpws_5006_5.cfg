set system host-name-up-e2
set protocols ldp
set protocols mpls
set vlans vbv1 vlan-id 10
set interfaces ge-0/0/0 unit 0 family inet address 10.4.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls label-switched-path up-lsp to 3.3.3.9 encap mpls pw-class pw-aucfg
set interfaces ge-1/0/0 unit 0 family mpls encapsulation mpls label switched-pw-class aas-name pw-a
set interfaces lo0 unit 0 family inet address 5.5.5.9/32
set routing-options ospf 1 area 0 interface ge-0/0/0.0
set routing-options ospf 1 area 0 network 10.4.1.0/24

