set system host-name ASBR2

set routing-options router-id 3.3.3.3

set protocols ldp

set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family inet address 10.20.1.1/24

set interfaces ge-1/0/0 unit 1 encapsulation vlan-id 10
set interfaces ge-1/0/0 unit 1 family inet

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols bgp group pgroup type internal
set protocols bgp group pgroup local-address 3.3.3.3
set protocols bgp group pgroup neighbor 4.4.4.4
set protocols bgp group pgroup family l2vpn signaling

set routing-instances fbgpad1 interface ge-1/0/0.1
set routing-instances fbgpad1 route-distinguisher 200:1
set routing-instances fbgpad1 vrf-target target:200:1

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0 interface-type p2p