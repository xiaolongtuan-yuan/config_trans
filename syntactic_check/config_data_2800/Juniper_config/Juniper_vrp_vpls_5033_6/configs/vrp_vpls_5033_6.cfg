set system host-name UPE2
set interfaces ge-0/0/0 unit 0 family inet address 10.10.4.2/24
set protocols ldp interface ge-0/0/0.0
set interfaces ge-0/0/0 description "MPLS IP"
set interfaces ge-1/0/0 vlan-tagging
set interfaces ge-1/0/0 unit 0 family inet address 10.10.5.2/24
set protocols ldp interface ge-1/0/0.0
set interfaces ge-1/0/0 unit 1 encapsulation vlan-bridge
set interfaces ge-1/0/0 unit 1 vlan-id 1
set vlans Vlan1 vlan-id 1
set routing-instances UPE2 interface ge-1/0/0.1
set routing-options static route 0.0.0.0/0 next-hop 5.5.5.9