set system host-name PE
set protocols ldp peer 10.20.1.1 authentication-key ""

set interfaces ge-0/0/0 unit 1 family ethernet-switching native-vlan-id 1
set interfaces fe-2/0/0 unit 1 encapsulation vlan-id 10
set protocols rsvp interface ge-0/0/0

set routing-options autonomous-system 0
set routing-options static route 10.20.1.0/24 next-hop 10.20.1.1
set routing-options static route 3.3.3.9/32 next-hop lo0.0