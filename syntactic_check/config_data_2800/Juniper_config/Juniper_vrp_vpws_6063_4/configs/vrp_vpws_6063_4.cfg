set system host-name ASBR2

set protocols ldp router-id 3.3.3.9
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0

set interfaces ge-1/0/0 unit 0 family inet address 10.20.1.1/24
set interfaces ge-2/0/0 unit 0 family inet address 10.20.1.2/24
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 3.3.3.9/32

set routing-instances vpn1 interface ge-2/0/0.0
set routing-instances vpn1 route-distinguisher 200:1
set routing-instances vpn1 vrf-target import target:200:1
set routing-instances vpn1 vrf-target export target:200:1

set protocols bgp group external type internal
set protocols bgp group external local-address 3.3.3.9
set protocols bgp group external neighbor 4.4.4.9
set protocols bgp group external family l2vpn unicast

set routing-options autonomous-system 200

set protocols ospf area 0 interface ge-1/0/0.0
set protocols ospf area 0 interface ge-2/0/0.0
set protocols ospf area 0 interface lo0.0 passive