set system host-name PE1

set protocols mpls interface ge-1/0/0.0
set protocols ldp interface ge-1/0/0.0
set routing-instances vfi1 interface ge-0/0/0.1

set interfaces ge-0/0/0 flexible-vlan-tagging
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 1 vlan-id 10
set interfaces ge-0/0/0 unit 1 family inet
set routing-options router-id 2.2.2.2

set interfaces ge-1/0/0 unit 0 family inet address 10.10.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls

set protocols bgp group external type external
set protocols bgp group external local-address 2.2.2.2
set protocols bgp group external local-as 100
set protocols bgp group external neighbor 2.2.2.2
set protocols bgp group external-bgp type external
set protocols bgp group external-bgp neighbor 4.4.4.4
set protocols bgp group external-bgp peer-as 200
set protocols bgp group external-bgp local-address 2.2.2.2
set protocols bgp group external-bgp multihop ttl 255

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0