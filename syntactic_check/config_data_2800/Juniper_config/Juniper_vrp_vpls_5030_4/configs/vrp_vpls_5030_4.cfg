set system host-name PE2
set protocols ldp router-id 3.3.3.9
set interfaces ge-0/0/0 flexible-vlan-tagging
set interfaces ge-0/0/0 unit 0 family inet address 10.20.1.2/24
set interfaces ge-0/0/0 unit 1 encapsulation vlan-bridge
set interfaces ge-0/0/0 unit 1 vlan-id 10
