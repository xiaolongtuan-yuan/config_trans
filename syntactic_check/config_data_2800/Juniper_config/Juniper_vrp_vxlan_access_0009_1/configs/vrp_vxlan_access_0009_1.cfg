set system host-name DeviceB
set interfaces ge-0/0/1 unit 0 family ethernet-switching
set interfaces lo0 unit 0 family inet address 1.1.1.2/32
set interfaces ae0 flexible-vlan-tagging
set vlans evpn-vlan vlan-id 10
set protocols bgp group pe type internal
set protocols bgp group pe neighbor 1.1.1.1
set protocols bgp group pe local-address 1.1.1.2
set routing-instances evpn interface ae0.0
set routing-options static route 1.1.1.1/32 next-hop 192.168.1.1