set system host-name LSRc
set protocols ldp peer 1.1.1.1
set interfaces ge-0/0/0 unit 0 family inet address 3.2.1.2/24
set interfaces lo0 unit 0 family inet address 3.3.3.3/32
set tunnels mpls traffic-eng tunnel tun200 interface ge-0/0/0.0 bandwidth 100000 priority 77 explicit-name PATH1
set forwarding-options label-switched-path lsrp 1.1.1.1 destination 1.1.1.1
set routing-table default route 1.1.1.1/32 next-hop 3.2.1.1
set routing-table default route 2.2.2.2/32 next-hop 3.2.1.1
