set system host-name Device2

set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family inet address 192.168.2.1/24
set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set routing-options router-id 2.2.2.2

set protocols isis interface ge-0/0/1.0 point-to-point
set protocols isis interface ge-0/0/0.0 point-to-point

set vlans vlan10 vlan-id 10

set protocols bgp group PE type external
set protocols bgp group PE neighbor 1.1.1.1 peer-as 100
set protocols bgp group PE local-address 2.2.2.2
set protocols bgp group PE family inet unicast

set routing-instances pn1 interface ge-0/0/1.0
set routing-instances pn1 route-distinguisher 1:2