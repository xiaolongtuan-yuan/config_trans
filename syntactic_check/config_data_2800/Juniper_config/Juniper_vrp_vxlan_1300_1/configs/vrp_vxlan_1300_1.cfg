set system host-name Device2
set interfaces ne1 unit 0 family ethernet-switching vlan-map 10 switch-vid 10
set interfaces ne1 unit 0 family ethernet-switching port-mode access
set interfaces ne1 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family inet address 192.168.2.1/24
set routing-options router-id 1.1.1.1
set protocols isis networkPointToPoint interface ne1.0
set vlans vlan-name 10vlan vlangroup 10
set interfaces ge-0/0/0 unit 0 family dot1qenis 10
set interfaces lo0 unit 0 family inet address 2.2.2.2/32
set forwarding-options arp host-learning enable
set forwarding-options arp distribute-gateway global-enabled
set protocols bgp neighbor 1.1.1.1 as 100
set protocols bgp group PE router-id 1.1.1.1
set interfaces ne1.0 unit 0 family vpls forwarding-vpn pn1 remote-id 1:2
set protocols l2vpn epl binding-vlan 10 binding-ip 10.1.1.1-255.255.255.0
set interfaces ge-0/0/1 unit 1 family vpls encapsulation-type vxlan
set protocols l2vpn epipe advertised-remote-all-vn
