set system host-name DeviceA
set interfaces ge-3/0/0 unit 0 family inet address 1.1.5.2/24

set protocols bgp group PEER1 type internal
set protocols bgp group PEER1 neighbor 1.1.5.1
set protocols bgp group PEER1 peer-as 100

set protocols bgp group PEER1 import all
set policy-options policy-statement ALLOW-PEER1 term t from route-filter 2.2.2.0/24 exact
set policy-options policy-statement ALLOW-PEER1 term t from route-filter 3.3.3.0/24 exact
set policy-options policy-statement ALLOW-PEER1 term t from route-filter 4.4.4.0/24 exact
set policy-options policy-statement ALLOW-PEER1 term t from route-filter 5.5.5.0/24 exact
set policy-options policy-statement ALLOW-PEER1 term t then accept
set protocols bgp group PEER1 export ALLOW-PEER1