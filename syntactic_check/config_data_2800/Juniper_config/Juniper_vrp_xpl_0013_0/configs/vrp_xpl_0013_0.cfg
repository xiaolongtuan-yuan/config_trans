set system host-name DeviceA
set interfaces gigabit-ether3/0/0 unit 0 family inet address 1.1.5.2/24

set protocols bgp 100 peer-group PEER1
set protocols bgp 100 peer-group PEER1 peer-address 1.1.5.1 neighbor-settings remote-as 100
set protocols bgp 100 import static
set routing-instances default-instance routes static route 2.2.2.0/24 next-hop null0
set routing-instances default-instance routes static route 3.3.3.0/24 next-hop null0
set routing-instances default-instance routes static route 4.4.4.0/24 next-hop null0
set routing-instances default-instance routes static route 5.5.5.0/24 next-hop null0

set protocols bgp 100 group PEER1 type internal
set protocols bgp 100 group PEER1 import all
set firewall family ipv4 filter ALLOW-PEER1 term t permit from prefix-list PREFIX1
set routing-options static route 2.2.2.0/255.255.255.0 next-hop null0
set routing-options static route 3.3.3.0/255.255.255.0 next-hop null0
set routing-options static route 4.4.4.0/255.255.255.0 next-hop null0
set routing-options static route 5.5.5.0/255.255.255.0 next-hop null0

set protocols bgp 100 group PEER1 routes distribute-list ALLOW-PEER1 export