set system host-name ASBR1
set protocols ldp
set interfaces ge-0/0/0 flexible-vlan-tagging
set interfaces ge-0/0/0 unit 10 encapsulation vlan-id 10
set interfaces ge-1/0/0 unit 0 family inet address 10.10.1.2/30
set interfaces lo0 unit 0 family inet address 2.2.2.2/32
set protocols ldp interface lo0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-0/0/0.10
set routing-instances vpls interface ge-0/0/0.10
set routing-instances vpls route-distinguisher 2.2.2.2:1
set routing-instances vpls vrf-target target:1:1
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0