set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24 vrrp-group 1 priority 120
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24 vrrp-group 1 preempt
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24 vrrp-group 1 accept-data
