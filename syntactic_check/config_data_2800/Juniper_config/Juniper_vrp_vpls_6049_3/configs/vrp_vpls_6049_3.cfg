set system name PE4
set routing-options autonomous-system 100
set protocols bgp peer-group AS100
set protocols bgp peer-group AS100 remote-as 100
set protocols bgp group AS100 type internal
set protocols bgp group AS100 peer-address 1.1.1.1
set protocols bgp group AS100 local-address Loopback1
set interfaces ge-0/0/1 unit 0 family inet address 10.1.5.2/24
set interfaces ge-0/0/1 unit 0 family mpls
set interfaces ge-0/0/3.1 encap-type dot1q 10
set interfaces ge-0/0/3.1 family inet xconnect-vfi vsi1
set system services dhcpv4 server pool 10.1.5.0/24 address-range low 10.1.5.1 high 10.1.5.254
set vlan unit 2 family inet address 10.1.5.2/30
set vlans vsi1
set forwarding-options label-switched-path default rsvp-group no-te
set forwarding-options l2 forwarding vfi vsi1
set forwarding-options l2 forwarding vfi vsi1 interface ge-0/0/3.1
set routing-table vrf vsi1 route 4.4.4.4/32 next-hop self
