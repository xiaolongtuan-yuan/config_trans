set system host-name PE2
set protocols ldp router-id 1.1.1.1

set interfaces ge-2/0/0 unit 0 family inet address 10.30.1.2/24
set interfaces ge-2/0/0 unit 1 encapsulation vlan-id 10
set interfaces ge-2/0/0 unit 1 family mpls

set interfaces ge-1/0/0 unit 0 family inet address 4.4.4.4/32

set protocols bgp group external type external
set protocols bgp group external neighbor 1.1.1.1 peer-as 100
set protocols bgp group internal type internal
set protocols bgp group internal neighbor 3.3.3.3 peer-as 200

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0