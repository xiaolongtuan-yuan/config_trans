set system host-name Device2

set routing-instances vpng1 interface ge-0/0/0.0
set routing-instances vpng1 route-distinguisher 11:1

set policy-options policy-statement vpng1-import term 1 from community vpng1-comm
set policy-options policy-statement vpng1-import term 1 then accept
set policy-options policy-statement vpng1-export term 1 then community add vpng1-comm
set policy-options policy-statement vpng1-export term 1 then accept
set policy-options community vpng1-comm members target:11:1

set vlans vxlan0 vlan-id 100
set vlans vxlan0 l3-interface irb.10

set interfaces irb unit 10 family inet address 10.1.1.1/24

set protocols ospf area 0 interface ge-0/0/0.0
set protocols ospf area 0 interface irb.10

set routing-options router-id 10.1.1.1

set protocols bgp group vpng1 type internal
set protocols bgp group vpng1 local-address 2001:db8:11::1
set protocols bgp group vpng1 family inet unicast
set protocols bgp group vpng1 family inet6 unicast
set protocols bgp group vpng1 family evpn signaling
set protocols bgp group vpng1 neighbor 2001:db8:11::2
set protocols bgp group vpng1 multipath

set firewall family inet filter f_vpng1 term t1 then accept

set interfaces lo0 unit 0 family inet address 127.0.0.1/32