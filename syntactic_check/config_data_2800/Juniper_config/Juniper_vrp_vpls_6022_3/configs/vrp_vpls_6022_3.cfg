set system host-name ASBR2  
set protocols ospf area 0 interface GigabitEthernet1/0/0.0  
set protocols ospf area 0 network 10.30.1.0/24  
set interfaces ge-1/0/0 unit 0 family inet address 10.20.1.2/30  
set interfaces ge-1/0/0 unit 0 family mpls ip  
set interfaces ge-2/0/0 unit 0 family inet address 10.30.1.1/24  
set interfaces ge-2/0/0 unit 0 family mpls ip  
set system routing-options static route 3.3.3.3/32 next-hop self  
set protocols mpls label Protocol ldp  
setprotocols bgp as 200  
set protocols bgp group internal peer-as 200  
set protocols bgp group internal local-address 10.20.1.2  
set protocols bgp group internal neighbor 4.4.4.4  
set protocols static route 4.4.4.4/32 next-hop 10.20.1.1  
set routing-options filter policy export-policy1 family inet.0 term any then accept-packet  
set routing-options filter policy export-policy2 family inet.0 term any then accept-packet  
set protocols bgp group internal family inet export export-policy1  
set protocols bgp group internal family inet advertise-tunnel  
set protocols bgp group internal family inet activate