set system host-name ASBR2  
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0  
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0  
set interfaces ge-1/0/0 unit 0 family inet address 10.20.1.2/30  
set interfaces ge-1/0/0 unit 0 family mpls  
set interfaces ge-2/0/0 unit 0 family inet address 10.30.1.1/24  
set interfaces ge-2/0/0 unit 0 family mpls  
set routing-options static route 3.3.3.3/32 next-hop 10.20.1.2   
set protocols ldp interface ge-1/0/0.0  
set protocols ldp interface ge-2/0/0.0  
set protocols bgp group internal type internal  
set protocols bgp group internal local-address 10.20.1.2  
set protocols bgp group internal neighbor 4.4.4.4  
set routing-options static route 4.4.4.4/32 next-hop 10.20.1.1  
set policy-options policy-statement export-policy1 then accept  
set protocols bgp group internal family inet unicast  
set protocols bgp group internal export export-policy1  
set protocols bgp group internal family inet labeled-unicast