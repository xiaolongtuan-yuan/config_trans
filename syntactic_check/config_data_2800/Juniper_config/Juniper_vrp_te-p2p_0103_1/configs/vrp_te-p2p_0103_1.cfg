set system host-name LSRB
set protocols ldp router-id loopback1 force
set interfaces lo0 unit 0 family inet address 10.1.1.2/24

set mpls traffic-eng tunnels
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols isis network point-to-point
set system login user admin privilege 15 class superuser

set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols isis network point-to-point 

set system logging file-messages critical
set protocols ldp interface ge-0/0/0
set protocols ldp interface ge-1/0/0

set security policies from-zone Trust to-zone Untrust policy any match-source anywhere
set security policies from-zone Untrust to-zone Trust policy any match-source anywhere

set system services ssh root-login disabled

set interfaces lo1 unit 0 family inet address 2.2.2.9/32
set protocols isis network point-to-point

set service tcp-established-timeout 1800
set security zones security-zone Trust interface ge-0/0/0.0
set security zones security-zone Trust interface ge-1/0/0.0
