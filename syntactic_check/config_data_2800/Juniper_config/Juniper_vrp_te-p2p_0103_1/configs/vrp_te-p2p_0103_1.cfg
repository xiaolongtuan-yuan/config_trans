set system host-name LSRB
set protocols ldp router-id 10.1.1.2
set interfaces lo0 unit 0 family inet address 10.1.1.2/32

set protocols rsvp interface ge-0/0/0.0
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols isis interface ge-0/0/0.0 point-to-point
set system login user admin class superuser
set system login user admin authentication plain-text-password
set system login user admin uid 2000

set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols isis interface ge-1/0/0.0 point-to-point

set system syslog file messages any critical
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-1/0/0.0.0

set security policies from-zone Trust to-zone Untrust policy any match source-address any
set security policies from-zone Trust to-zone Untrust policy any then permit
set security policies from-zone Untrust to-zone Trust policy any match source-address any
set security policies from-zone Untrust to-zone Trust policy any then permit

set system services ssh root-login deny

set interfaces lo1 unit 0 family inet address 2.2.2.9/32
set protocols isis interface lo1.0 passive

set security flow tcp-session-established-timeout 1800
set security zones security-zone Trust interfaces ge-0/0/0.0
set security zones security-zone Trust interfaces ge-1/0/0.0