set system host-name PE2
set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.2/29
set interfaces ge-2/0/0 unit 0 family inet address 10.5.1.2/29
set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set routing-options router-id 3.3.3.3
set routing-options static route 10.0.0.3/32 next-hop 10.2.1.1
set routing-options static route 0.0.0.0/0 next-hop 10.5.1.1

set protocols bfd session 3.3.3.3_4.4.4.4
set protocols bfd session 3.3.3.3_4.4.4.4 neighbor 4.4.4.4
set protocols bfd session 3.3.3.3_4.4.4.4 local-address 3.3.3.3
set protocols bfd session 3.3.3.3_4.4.4.4 minimum-interval 100
set protocols bfd session 3.3.3.3_4.4.4.4 multiplier 3