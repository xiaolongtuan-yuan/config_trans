set system host-name PE4

set protocols ldp traffic-engineering
set protocols ldp discovery target-hello-accept interface ge-1/0/1
set protocols ldp discovery target-hello-accept interface ge-1/0/3.0

set interfaces ge-1/0/1 unit 0 family inet address 10.1.5.2/24
set interfaces ge-1/0/1 unit 0 family mpls ip

set vlans vlan1 vlan-id 2
set vlans vlan1 bridge-domain 2
set forwarding-options l2转发 vlan-ids 1,2

set interfaces ge-1/0/3 unit 1 encapsulation dot1q 10
set interfaces ge-1/0/3 unit 1 family mpls
set interfaces ge-1/0/3 unit 1 family mpls ip
set interfaces ge-1/0/3 unit 1 family mpls ldp discovery target-hello-accept

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set protocols bgp group external peer-as 100
set protocols bgp group external local-address lo0.0
set protocols bgp group internal peer-as 100
set protocols bgp group internal local-address lo0.0

set routing-instances vfi1 instance-type vpls
set routing-instances vfi1 vfi-id 2
set forwarding-options l2转发 forwarding-table vfi1 arp-options proxy-arp enable

set routing-options static route 0.0.0.0/0 next-hop 4.4.4.1
set routing-options static route 10.1.5.0/24 next-hop ge-1/0/3.1

set protocols ospf area 0 interface ge-1/0/2
set protocols ospf area 0 interface lo0.0

