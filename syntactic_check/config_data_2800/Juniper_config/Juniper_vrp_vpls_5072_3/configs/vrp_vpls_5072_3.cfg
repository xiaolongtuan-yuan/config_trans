set system host-name PE4

set protocols ldp traffic-engineering
set protocols ldp discovery hello-interval 9
set protocols ldp discovery hello-accept from 10.1.5.1
set protocols ldp discovery hello-accept from ge-1/0/3.1

set interfaces ge-1/0/1 unit 0 family inet address 10.1.5.2/24
set interfaces ge-1/0/1 unit 0 family mpls
set protocols mpls interface ge-1/0/1.0

set bridge-domains BD1 domain-type bridge
set bridge-domains BD1 interface ge-1/0/0.1
set bridge-domains BD1 vlan-id 2

set interfaces ge-1/0/3 unit 1 encapsulation vlan-id 10
set interfaces ge-1/0/3 unit 1 family inet address 0.0.0.0/0
set protocols mpls interface ge-1/0/3.1

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set protocols bgp group external peer-as 100
set protocols bgp group external local-address 4.4.4.4
set protocols bgp group internal peer-as 100
set protocols bgp group internal local-address 4.4.4.4

set routing-instances vfi1 instance-type vpls
set routing-instances vfi1 protocols vpls vpls-id 2:2
set routing-instances vfi1 interface ge-1/0/3.1
set routing-instances vfi1 proxy-arp enable

set routing-options static route 0.0.0.0/0 next-hop 4.4.4.1
set routing-options static arp 10.1.5.0/24 next-hop ge-1/0/3.1

set protocols ospf area 0.0.0.0 interface ge-1/0/2.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive