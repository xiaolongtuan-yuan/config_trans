set system host-name PE2
set routing-options router-id 192.168.3.3

set protocols ldp
set protocols ldp interface lo0.0
set interfaces se-2/0/1 encapsulation ppp

set interfaces ge-2/0/0 unit 0 family inet address 10.2.2.2/24
set protocols mpls interface ge-2/0/0.0
set interfaces lo0 unit 0 family inet address 192.168.3.3/32
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols l2circuit neighbor 192.168.2.2 interface ge-2/0/0.0 virtual-circuit-id 100
set protocols l2circuit neighbor 192.168.2.2 interface ge-2/0/0.0 virtual-circuit-id 200
set protocols l2circuit neighbor 192.168.2.2 interface ge-2/0/0.0 virtual-circuit-id 300
set protocols l2circuit neighbor 192.168.2.2 interface ge-2/0/0.0 virtual-circuit-id 400