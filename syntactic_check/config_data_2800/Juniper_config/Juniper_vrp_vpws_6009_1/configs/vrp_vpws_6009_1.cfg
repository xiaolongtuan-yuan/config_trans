set system host-name PE2
set protocols mpls
set protocols mpls ldp
set protocols mpls ldp router-id loopback0
set protocols mpls ip

interface serial2/0/1 unit 0
set encapsulation ppp
set ppp multi-link group 1
unconfigure
interface serial2/0/1 unit 1
set encapsulation ppp
set ppp multi-link group 1
set ppp multi-link fragment-delay 10
set ppp multi-link fragment-threshold 1000
unconfigure

interface gigabitethernet2/0/0
unconfigure

ip address 10.2.2.2/24
set protocols mpls ip

interface lo0
ip address 192.168.3.3/32

route-options ospf 1 area 0
network 192.168.3.3/32 area 0
network 10.2.2.0/24 area 0

set protocols mpls l2vpn
set protocols mpls l2vpn pw-template 3 to 1
set protocols mpls l2vpn neighbor 192.168.2.2 pw-id 100
set protocols mpls l2vpn neighbor 192.168.2.2 pw-id 200
set protocols mpls l2vpn neighbor 192.168.2.2 pw-id 300
set protocols mpls l2vpn neighbor 192.168.2.2 pw-id 400

set protocols mpls l2vc 100 pw-class 3 to 1
set protocols mpls l2vc 200 pw-class 3 to 1
set protocols mpls l2vc 300 pw-class 3 to 1
set protocols mpls l2vc 400 pw-class 3 to 1

set forwarding-label mpls lsr-id 192.168.3.3