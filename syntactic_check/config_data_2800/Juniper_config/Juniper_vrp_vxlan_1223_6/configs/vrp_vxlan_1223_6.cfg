set system host-name Device1

set interfaces ge-0/0/0 unit 0 family inet address 192.168.50.1/24
set interfaces ge-0/0/1 unit 0 family inet address 192.168.1.1/24
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set routing-options static route 6.6.6.6/32 next-hop 192.168.50.2
set routing-options static route 7.7.7.7/32 next-hop 192.168.1.2
set routing-options static route 192.168.60.0/24 next-hop 192.168.1.2