set system host-name PE2
set protocols ldp router-id 4.4.4.4
set protocols mpls interface ge-1/0/2.0
set protocols mpls interface ge-1/0/1.0
set protocols mpls interface ge-1/0/3.0

set interfaces ge-1/0/2 unit 0 family inet address 172.16.34.4/24
set interfaces ge-1/0/1 unit 0 family inet address 172.16.34.4/24
set interfaces ge-1/0/1 unit 1 family ethernet-switching
set routing-instances ldp1 interface ge-1/0/1.1

set interfaces ge-1/0/3 unit 0 family inet address 172.16.45.4/24

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set protocols ospf area 0 interface lo0.0 passive
set protocols ospf area 0 interface ge-1/0/2.0
set protocols ospf area 0 interface ge-1/0/3.0