set system host-name PE1
set protocols igmp interface all

set protocols ldp
set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols mpls interface ge-0/0/0.0

set interfaces lo0 unit 0 family inet address 1.1.1.9/32
set protocols ldp interface ge-0/0/0.0
set protocols ldp label-allocation per-nexthop

set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target import target:1:1
set routing-instances vpn1 vrf-target export target:1:1

set interfaces ge-1/0/0 unit 0 family inet
set routing-options autonomous-system 100
set protocols bgp group PE9-pg type internal
set protocols bgp group PE9-pg local-as 100
set interfaces lo0 unit 0
set protocols bgp group PE9 neighbor 2.2.2.9
set protocols bgp group PE9 local-address 1.1.1.9
set protocols bgp group PE9-ebgp type external
set protocols bgp group PE9-ebgp peer-as 200
set protocols bgp group PE9-ebgp neighbor 4.4.4.9
set protocols bgp group PE9-ebgp local-address 1.1.1.9
set protocols bgp group PE9-ebgp multihop ttl 255

set routing-instances PE9-vpn interface ge-0/0/0.0

set routing-options static route 10.10.0.0/24 next-hop 10.10.1.2
set policy-options policy-statement export-l2vpn term 1 then community add target:1:1
set policy-options policy-statement export-l2vpn then accept
set routing-options rib-groups import-l2vpn import-rib inet.0
set routing-options rib-groups import-l2vpn import-rib vpn1.inet.0
