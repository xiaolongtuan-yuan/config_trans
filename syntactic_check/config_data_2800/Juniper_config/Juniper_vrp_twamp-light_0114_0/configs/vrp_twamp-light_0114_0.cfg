set system host-name DeviceA

set protocols ldp router-id 10.0.0.1
set protocols ldp targeted-session 10.0.0.2
set protocols ldp hello-interval 45
set protocols ldp hold-time 45

set protocols ospf area 0 interface lo0.0 passive
set protocols ospf area 0 interface ge-0/0/1.31
set routing-options router-id 10.0.0.1
set interfaces lo0 unit 0 family inet address 10.0.0.1/32
set interfaces ge-0/0/1 encapsulation flexible-ethernet-services
set interfaces ge-0/0/1 unit 31 vlan-id 31
set interfaces ge-0/0/1 unit 31 family inet mtu 9500

set routing-instances r1 instance-type virtual-router
set routing-instances r1 interface lo0.0
set routing-instances r1 routing-options static route 3.0.0.0/29 next-hop 10.0.0.2
set protocols layer2-control bpdu-block

set interfaces ge-0/0/0 encapsulation flexible-ethernet-services
set interfaces ge-0/0/0 unit 1 vlan-id 1
set interfaces ge-0/0/0 unit 1 family inet mtu 9500
set routing-instances r1 interface ge-0/0/0.1
set protocols ldp interface ge-0/0/0.1

set vlans vlan0 vlan-id 1
set vlans vlan0 description "Vlan0"

set interfaces irb unit 31 family inet address 192.168.1.1/24
set interfaces irb unit 31 mac 00:00:00:00:00:01

set firewall family inet filter f1 term t1 from source-address 192.168.1.0/24
set firewall family inet filter f1 term t1 from destination-address 3.0.0.1
set firewall family inet filter f1 term t1 then accept

set protocols l2circuit peer 10.0.0.2 interface ge-0/0/0.1 virtual-circuit-id 26

set system services netconf ssh
set system services ssh
set system ports console log-out-on-disconnect