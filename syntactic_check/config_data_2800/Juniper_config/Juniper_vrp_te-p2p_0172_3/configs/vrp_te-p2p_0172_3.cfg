set system host-name LSRD

set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-1/0/1.0
set protocols ldp interface ge-1/0/2.0

set interfaces ge-1/0/0 unit 0 family inet address 10.1.6.2/24
set interfaces ge-1/0/1 unit 0 family inet address 10.1.3.2/24
set interfaces ge-1/0/2 unit 0 family inet address 10.1.7.1/24

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set routing-instances ospf-1 instance-type vrf
set routing-instances ospf-1 interface ge-1/0/0.0
set routing-instances ospf-1 interface ge-1/0/1.0
set routing-instances ospf-1 interface ge-1/0/2.0
set routing-instances ospf-1 protocols ospf area 0.0.0.0 interface all

set routing-options router-id 4.4.4.4
set protocols ospf traffic-engineering