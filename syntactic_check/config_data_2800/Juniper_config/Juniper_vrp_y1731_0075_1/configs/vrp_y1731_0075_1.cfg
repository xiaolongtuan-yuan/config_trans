set system host-name CE2

set interfaces ge-1/0/1 unit 0 description "trunk-port"
set interfaces ge-1/0/1 native-vlan-id 1
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members 2
set interfaces ge-1/0/1 unit 0 family ethernet-switching interface-mode trunk

set protocols oam ethernet connectivity-fault-management maintenance-domain md3 level 2
set protocols oam ethernet connectivity-fault-management maintenance-domain md3 maintenance-association ma3
set protocols oam ethernet connectivity-fault-management maintenance-domain md3 maintenance-association ma3 continuity-check interval 1s
set protocols oam ethernet connectivity-fault-management maintenance-domain md3 maintenance-association ma3 mep 3 interface ge-1/0/1.0 direction outward
set protocols oam ethernet connectivity-fault-management maintenance-domain md3 maintenance-association ma3 remote-mep 3

set security flow tcp-session timeout-syn-wait 300