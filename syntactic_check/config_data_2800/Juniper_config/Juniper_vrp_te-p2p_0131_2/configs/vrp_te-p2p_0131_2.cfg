set system host-name PE3

set routing-instances vp1 instance-type vrf
set routing-instances vp1 interface ge-1/0/0.0
set routing-instances vp1 route-distinguisher 100:1
set routing-instances vp1 vrf-target export target:100:1
set routing-instances vp1 vrf-target import target:100:1

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 2.2.2.2/32
set protocols mpls interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf traffic-engineering

set routing-options static route 10.1.1.1/32 discard
set routing-options static route 10.1.1.1/32 no-install

set protocols bgp group vrf-vp1 type external
set protocols bgp group vrf-vp1 neighbor 1.1.1.1
set protocols bgp group vrf-vp1 export EXPORT-VP1