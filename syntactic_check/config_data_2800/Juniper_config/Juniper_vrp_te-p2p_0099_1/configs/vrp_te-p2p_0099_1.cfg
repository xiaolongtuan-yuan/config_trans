set system host-name LSRB
set protocols ldp
set interfaces ae1 aggregated-ether-options minimum-links 1
set interfaces ae1 unit 0 family inet address 10.1.1.2/24
set interfaces ge-1/0/0 gigether-options 802.3ad ae1
set interfaces ge-2/0/0 gigether-options 802.3ad ae1
set interfaces ge-3/0/0 gigether-options 802.3ad ae1
set interfaces ge-4/0/0 gigether-options 802.3ad ae1
set interfaces lo0 unit 0 family inet address 2.2.2.2/32
set protocols ospf traffic-engineering
set protocols ospf area 0.0.0.0 interface ae1.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols mpls interface ae1.0
set protocols ldp interface ae1.0
set protocols ldp interface lo0.0