set system host-name LSRB
set protocols ldp enable
set interfaces eth-trunk1 unit 0 family ip address 10.1.1.2 255.255.255.0
set protocols mpls label protocol ldp
set interfaces gigabit-ethernet1/0/0 channel-group 1 mode active
set interfaces gigabit-ethernet2/0/0 channel-group 1 mode active
set interfaces gigabit-ethernet3/0/0 channel-group 1 mode active
set interfaces gigabit-ethernet4/0/0 channel-group 1 mode active
set interfaces lo0 unit 0 family ip address 2.2.2.2 255.255.255.255
set protocols ospf area 0 interface lo0.0
set protocols mpls traffic-eng area 0
set protocols mpls traffic-eng router-id Loopback1 force
