set system host-name PE1

set protocols ldp interface ge-0/0/1.0
set protocols mpls interface lo0.0
set interfaces ge-0/0/1 unit 0 encapsulation vlan-id 2
set routing-instances evpn interface ge-0/0/1.1

set interfaces ge-0/0/2 unit 0 family inet address 10.1.1.1/32
set protocols ldp interface ge-0/0/2.0
set protocols mpls interface ge-0/0/2.0
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set routing-options autonomous-system 100
set protocols bgp group evpn type internal
set protocols bgp group evpn family evpn signaling
set protocols bgp group evpn neighbor 2.2.2.2
set protocols bgp group evpn local-address 1.1.1.1
set protocols bgp group evpn bfd-liveness-detection minimum-interval 300

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0

set protocols oam ethernet connectivity-fault-management maintenance-domain md1
set protocols oam ethernet connectivity-fault-management maintenance-association ma1
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 1 interface ge-0/0/1.1 direction down
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 1 continuity-check interval 1s
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 remote-mep 2
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 remote-mep 2 continuity-check enable