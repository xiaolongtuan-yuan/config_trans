set system host-name PE2
set protocols ldp interface ge-0/0/0.0
set interfaces ge-0/0/0 unit 0 family ethernet-switching
set interfaces ge-0/0/1 unit 0 family ethernet-switching
set interfaces ge-0/0/0 unit 0 family inet address 192.168.10.2/24
set interfaces lo0 unit 0 family inet address 3.3.3.9/32
set routing-instances vpn1 vrf-target import target:200:1
set routing-instances vpn1 vrf-target export target:200:1
set routing-options autonomous-system 100
set protocols bgp group internal neighbor 1.1.1.9
set protocols bgp group internal type internal
set protocols bgp group internal local-address 3.3.3.9
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive