set system host-name PE2

set protocols ldp interface ge-0/0/0.0
set protocols ldp neighbor 1.1.1.9
set routing-options router-id 3.3.3.9

set interfaces ge-0/0/0 unit 0 family inet address 10.2.2.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols rsvp interface ge-0/0/0.0

set protocols ospf area 0 interface ge-0/0/0.0
set protocols ospf area 0 interface lo0.0 passive

set interfaces lo0 unit 0 family inet address 3.3.3.9/32

set interfaces xe-1/0/0 unit 0 family ethernet-switching interface-mode access
set interfaces xe-1/0/0 unit 0 family ethernet-switching vlan members default

set interfaces xe-2/0/0 encapsulation flexible-ethernet-services
set interfaces xe-2/0/0 unit 1 vlan-id 20
set interfaces xe-2/0/0 unit 1 family inet
set interfaces xe-2/0/0 unit 1 family mpls

set routing-instances vpws-pw1 instance-type l2vpn
set routing-instances vpws-pw1 interface xe-2/0/0.1
set routing-instances vpws-pw1 route-distinguisher 3.3.3.9:1
set routing-instances vpws-pw1 vrf-target target:65000:1
set routing-instances vpws-pw1 protocols l2vpn interface xe-2/0/0.1
set routing-instances vpws-pw1 protocols l2vpn pseudowire bw 2000
set routing-instances vpws-pw1 protocols l2vpn peer-address 1.1.1.9

set firewall family inet filter allow-mpls-trf-ing term 1 from destination-address 0.0.0.0/0

set policy-options policy-statement mpls-export term 1 then accept
set routing-options autonomous-system 65000
