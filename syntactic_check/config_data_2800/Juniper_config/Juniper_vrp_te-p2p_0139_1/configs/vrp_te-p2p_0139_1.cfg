set system host-name LSRB
set protocols ldp interface all
set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-1/0/2 unit 0 family inet address 10.3.1.1/24
set interfaces ge-1/0/1 unit 0 family inet address 10.1.1.2/24
set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set routing-options router-id 2.2.2.2
set routing-options autonomous-system 65000

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-1/0/2.0
set protocols mpls interface ge-1/0/1.0

set protocols rsvp interface ge-1/0/0.0
set protocols rsvp interface ge-1/0/2.0
set protocols rsvp interface ge-1/0/1.0

set protocols ospf traffic-engineering
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/1.0
set protocols ospf area 0.0.0.0 interface ge-1/0/2.0
set protocols ospf area 0.0.0.0 interface lo0.0