set system hostname DeviceA

edit interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members 10
edit interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members 10
edit interfaces ge-1/0/3 unit 0 family ethernet-switching vlan members 10

set protocols lldp run
set forwarding-options spanning-tree priority 0 vlan 10
set interfaces po1 unit 0 family ethernet-switching lag-mode active
set vlans Vlan10 vlan-id 10
set interfaces ge-1/0/1 unit 0 family ethernet-switching interface-table-vlan Vlan10
set interfaces ge-1/0/2 unit 0 family ethernet-switching interface-table-vlan Vlan10
set interfaces ge-1/0/3 unit 0 family ethernet-switching interface-table-vlan Vlan10

edit routing-options router-id 10.1.1.2
set routing-options static route 10.1.1.1/24 next-hop self
set protocols lldp run

commit
