set system host-name DeviceA

delete interfaces ge-1/0/1
delete interfaces ge-1/0/2
delete interfaces ge-1/0/3

set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members Vlan10
set interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members Vlan10
set interfaces ge-1/0/3 unit 0 family ethernet-switching vlan members Vlan10

set protocols lldp interface all
set protocols rstp vlan Vlan10 bridge-priority 0
set interfaces ae1 aggregated-ether-options lacp active
set vlans Vlan10 vlan-id 10
set interfaces ge-1/0/1 ether-options 802.3ad ae1
set interfaces ge-1/0/2 ether-options 802.3ad ae1
set interfaces ge-1/0/3 ether-options 802.3ad ae1

set routing-options router-id 10.1.1.2