set system host-name PE1
set protocols ldp
set routing-instances v1 interface ge-0/0/0.1

set interfaces ge-0/0/0 unit 0 encapsulation vlan-id 10
set interfaces ge-1/0/0 unit 0 family inet address 10.10.1.1/30

set protocols ldp interface all

set routing-options autonomous-system 100

set protocols bgp group external type external
set protocols bgp group external neighbor 2.2.2.2 peer-as 100
set protocols bgp group external local-address 1.1.1.1
set protocols bgp group external family l2vpn signaling

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0

set routing-instances v1 route-distinguisher 100:1
set routing-instances v1 vrf-target target:100:1