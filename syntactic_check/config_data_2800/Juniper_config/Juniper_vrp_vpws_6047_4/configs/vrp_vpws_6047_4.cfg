set system host-name PE2

set protocols ldp interface lo0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0

set interfaces ge-1/0/0 unit 0 family inet address 10.30.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 100 family inet

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set protocols bgp group external type external
set protocols bgp group external local-address 4.4.4.4
set protocols bgp group external peer-as 100
set protocols bgp group external neighbor 1.1.1.1

set protocols bgp group internal type internal
set protocols bgp group internal local-address 4.4.4.4
set protocols bgp group internal peer-as 200
set protocols bgp group internal neighbor 3.3.3.3
set protocols bgp group internal family l2vpn signaling

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0

set routing-options router-id 4.4.4.4