set system host-name PE2
set protocols ldp interface ge-1/0/0.0
set interfaces ge-1/0/0 unit 0 family inet address 10.30.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols mpls interface ge-1/0/0.0
set interfaces lo0 unit 0 family inet address 4.4.4.9/32
set vlans vnp1 vlan-id 1
set routing-options router-id 4.4.4.9
set protocols bgp group ldp type external
set protocols bgp group ldp neighbor 1.1.1.9
set protocols bgp group ldp peer-as 100
set protocols bgp group ldp local-address 4.4.4.9
set protocols bgp group ldp family l2vpn signaling
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set routing-instances vnp1 interface ge-1/0/0.0