set system host-name DeviceA
set routing-options instance vrf vpna routing-table export vrf-target target:111:1
set routing-options instance vrf vpna routing-table import vrf-target target:111:1
set protocols mpls label-distribution-protocol ldp
set protocols mpls ldp router-id loopback0
set protocols isis net 49.0005.0000.0000.0c0c.00
set routing-instances vpna instance-type level-2-only
set routing-options bgp group vrf1_neighbor remote-as 100 local-address loopback0
set routing-options rib-groups default-rip-route import all
set routing-options rib-groups vpna-unicast route-group vpna-unicast-rib unicast-import all unicast-export accept-all unicast-auto-discover true
set protocols bgp group vrf1_neighbor activate
set protocols bgp group vrf1_neighbor send-community both
set protocols mpls traffic-eng tunnels segment-routing area 0
set routing-options mpls traffic-eng tunnels segment-routing global-block 200000-201000
set routing-options mpls traffic-eng router-id loopback0
set interfaces ge-0/0/0 unit 0 family mpls
