set system host-name DeviceA

set routing-instances vpna instance-type vrf
set routing-instances vpna interface ge-0/0/0.0

set protocols ldp interface ge-0/0/0.0
set protocols ldp router-id 4.4.4.4

set protocols isis interface ge-0/0/0.0 point-to-point

set protocols bgp group vrf1_neighbor type internal
set protocols bgp group vrf1_neighbor local-address 4.4.4.4
set protocols bgp group vrf1_neighbor neighbor 10.1.1.1
set protocols bgp group vrf1_neighbor peer-as 100
set protocols bgp group vrf1_neighbor family inet unicast
set protocols bgp group vrf1_neighbor export send-community

set routing-options router-id 4.4.4.4

set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24