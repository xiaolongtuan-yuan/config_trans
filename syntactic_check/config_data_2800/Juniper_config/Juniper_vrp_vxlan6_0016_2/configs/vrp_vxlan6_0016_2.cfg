set system host-name Device3

set routing-instances vrf1 instance-type vrf

set interfaces irb unit 20 family inet address 10.2.1.1/24

set routing-instances vrf1 protocols ospf area 0.0.0.0

set interfaces ge-0/0/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members bd1

set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 encapsulation flexible-ethernet-services
set interfaces ge-0/0/1 unit 1 encapsulation vlan-bridge
set interfaces ge-0/0/1 unit 1 vlan-id 20
set interfaces ge-0/0/1 unit 1 family bridge interface-mode trunk

set routing-instances vrf1 protocols igmp interface all

set routing-options static route 0.0.0.0/0 next-hop 10.2.1.1

set protocols bgp group bgp1_type1 type external
set protocols bgp group bgp1_type1 peer-as 100
set protocols bgp group bgp1_type1 neighbor 2001:DB8:11::1

set routing-instances vpni1 instance-type virtual-switch