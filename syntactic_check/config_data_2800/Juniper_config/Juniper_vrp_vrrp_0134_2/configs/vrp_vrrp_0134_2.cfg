set system host-name PE1

set protocols ldp interface ge-0/0/2
set interfaces ge-0/0/2 unit 0 family inet address 172.16.34.3/24
set interfaces ge-0/0/2 unit 0 family mpls ip
set interfaces ge-0/0/1 unit 0 ether-options encapsulation dot1q 10
set interfaces ge-0/0/1 unit 0 family dlci connect ldp-session-id 1
set interfaces ge-0/0/3 unit 0 family inet address 172.16.35.3/24
set interfaces ge-0/0/3 unit 0 family mpls ip

set routing-options router ospf 1
set routing-options router ospf 1 network 3.3.3.3/32 area 0
set routing-options router ospf 1 network 172.16.34.0/24 area 0
set routing-options router ospf 1 network 172.16.35.0/24 area 0

