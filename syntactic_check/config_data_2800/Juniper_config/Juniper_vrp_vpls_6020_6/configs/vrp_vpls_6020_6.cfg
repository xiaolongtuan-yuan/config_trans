set system host-name PE3
set protocols ldp router-id 3.3.3.3

set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 encapsulation flexible-ethernet-services
set interfaces ge-1/0/0 unit 1 vlan-id 10

set interfaces et-0/0/0 unit 1 family inet address 10.30.1.2/24
set interfaces et-0/0/0 unit 1 family mpls

set protocols bgp group ecmp1 type internal
set protocols bgp group ecmp1 neighbor 2.2.2.2
set protocols bgp group ecmp1 local-address 3.3.3.3
set protocols bgp group ecmp1 peer-as 100
set protocols bgp group ecmp1 family l2vpn signaling

set protocols bgp group ecmp2 type internal
set protocols bgp group ecmp2 neighbor 3.3.3.3
set protocols bgp group ecmp2 local-address 3.3.3.3
set protocols bgp group ecmp2 peer-as 100
set protocols bgp group ecmp2 family l2vpn signaling

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface et-0/0/0.1