set system host-name CE2

set interfaces ge-0/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces lo0 unit 0 family inet address 6.6.6.6/32
        
set routing-options autonomous-system 65002

set protocols bgp group external-peers type external
set protocols bgp group external-peers local-as 65002
set protocols bgp group external-peers peer-as 200
set protocols bgp group external-peers neighbor 10.2.1.2