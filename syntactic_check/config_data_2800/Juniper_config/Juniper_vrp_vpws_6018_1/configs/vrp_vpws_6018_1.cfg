set system host-name CE2

set vlans VLAN2 vlan-id 2
set interfaces irb unit 2 family inet address 10.2.1.3/24

set interfaces ge-0/0/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members VLAN2

set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members VLAN2

set protocols bfd

set protocols bfd session CPE1 neighbor 10.2.1.1
set protocols bfd session CPE1 minimum-interval 100
set protocols bfd session CPE1 minimum-receive-interval 100
set protocols bfd session CPE1 multiplier 3
set protocols bfd session CPE1 local-address 10.2.1.3

set protocols bfd session CPE2 neighbor 10.2.1.2
set protocols bfd session CPE2 minimum-interval 100
set protocols bfd session CPE2 minimum-receive-interval 100
set protocols bfd session CPE2 multiplier 3
set protocols bfd session CPE2 local-address 10.2.1.3