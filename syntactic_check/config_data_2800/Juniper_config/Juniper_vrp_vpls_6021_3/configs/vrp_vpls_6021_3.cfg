set system host-name ASBR2
set interfaces ge-0/0/0 unit 1 encapsulation vlan-id 10
set interfaces ge-0/0/0.1 family inet
set vlans v1 interface ge-0/0/0.1
set protocols bgp group internal type internal
set protocols bgp group internal neighbor 4.4.4.4
set protocols bgp group internal neighbor 4.4.4.4 peer-as 200
set protocols bgp group internal neighbor 4.4.4.4 damping
set protocols ospf area 0.0.0.0 interface ge-0/0/0.1
set protocols ospf area 0.0.0.0 interface lo0.0
set routing-instances v1 interface ge-0/0/0.1
set routing-instances v1 route-distinguisher 200:1
set routing-instances v1 vrf-target import target:1:1
set routing-instances v1 vrf-target export target:1:1
set protocols ldp interface ge-0/0/0.0
set protocols ldp targeted-hello
