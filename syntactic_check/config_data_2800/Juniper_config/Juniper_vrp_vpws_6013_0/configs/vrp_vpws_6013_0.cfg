set system host-name PE1
set chassis serial-number "PE1"
set protocols ldp router-id 192.168.2.2

set interfaces se-2/0/1 unit 0 family mpls
set interfaces se-2/0/2 unit 0 encapsulation ppp
set interfaces se-2/0/2 unit 0 family inet

set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members default

set vlans default vlan-id 1

set interfaces lo0 unit 0 family inet address 192.168.2.2/32

set routing-options static route 0.0.0.0/0 next-hop 192.168.2.1

set protocols ospf area 0.0.0.0 interface se-2/0/1.0
set protocols ospf area 0.0.0.0 interface se-2/0/2.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive