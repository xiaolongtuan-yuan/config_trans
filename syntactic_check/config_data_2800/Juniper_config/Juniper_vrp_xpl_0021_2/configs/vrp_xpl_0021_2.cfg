set system host-name DeviceC
set interfaces ge-0/0/1 unit 0 family inet address 1.1.1.2/24
set interfaces ge-0/0/2 unit 0 family inet address 1.1.3.1/24
set routing-options router-id 1.1.1.2

set protocols bgp group internal type internal
set protocols bgp group internal local-address 1.1.1.2
set protocols bgp group internal neighbor 1.1.1.1
set protocols bgp group internal peer-as 200

set protocols bgp group external type external
set protocols bgp group external local-address 1.1.3.1
set protocols bgp group external neighbor 1.1.3.2
set protocols bgp group external peer-as 100