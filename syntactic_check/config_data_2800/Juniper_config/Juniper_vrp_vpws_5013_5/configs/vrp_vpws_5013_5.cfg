set system host-name PE3

set interfaces ge-0/0/0 unit 0 family inet address 10.5.1.2/30
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 0 encapsulation mpls

set interfaces ge-0/0/1 unit 0 family mpls
set protocols l2circuit interface ge-0/0/1.0 neighbor 1.1.1.1 virtual-circuit-id 200
set interfaces ge-0/0/1 unit 0 mtu 1500

set interfaces lo0 unit 0 family inet address 5.5.5.5/32

set routing-options router-id 5.5.5.5
set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0

set protocols bfd interface ge-0/0/1.0 minimum-interval 50 multiplier 3
set protocols ldp interface ge-0/0/0.0

set protocols ldp neighbor 1.1.1.1 targeted
set protocols ldp targeted-hello accept
set protocols ldp session-protection
set security policies from-zone untrust to-zone trust policy allow-anything then permit

set protocols ldp interface ge-0/0/0.0 igp-synchronization
set protocols ldp neighbor 1.1.1.1 authentication-key-chain 1