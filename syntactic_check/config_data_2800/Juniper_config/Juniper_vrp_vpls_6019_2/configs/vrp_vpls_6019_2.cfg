set system host-name PE1

set protocols ldp interface all
set protocols ldp router-id 1.1.1.9

set interfaces ge-1/0/0 vlan-tagging
set interfaces ge-1/0/0 unit 1 encapsulation vlan-vpls
set interfaces ge-1/0/0 unit 1 vlan-id 10

set routing-instances vfi_bgp1 interface ge-1/0/0.1
set routing-instances vfi_bgp1 route-distinguisher 192.168.1.1:1
set routing-instances vfi_bgp1 vrf-target target:100:1

set interfaces ge-2/0/0 unit 0 family inet address 192.168.1.1/30
set interfaces ge-2/0/0 unit 0 family mpls
set protocols mpls interface ge-2/0/0.0

set interfaces lo0 unit 0 family inet address 1.1.1.9/32

set routing-options autonomous-system 100

set protocols bgp group Peers neighbor 3.3.3.9
set protocols bgp group Peers type external
set protocols bgp group Peers local-address 1.1.1.9
set protocols bgp group Peers family l2vpn signaling

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0