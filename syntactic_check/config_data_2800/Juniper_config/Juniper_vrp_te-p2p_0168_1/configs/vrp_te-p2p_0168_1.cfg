set interfaces ge-0/0/0 unit 0 family ethernet-switching port-mode trunk
set protocols lldp retransmit-interval 15
set protocols lldp hold-time 20
set chassis card-aliases alias card-aliases "card-description"
set routing-options router-id 1.1.1.1
set forwarding-class classes class1 priority 7
set firewall host-name LAN_TO_WAN src-address 192.168.1.0/24
set firewall host-name LAN_TO_WAN dst-address 10.0.0.0/8
set security policies from-zone Trust to-zone Untrust policy allow rule-name Allow-ICMP-Lan-To-Untrust action permit
set security policies from-zone Trust to-zone Untrust policy deny-all rule-name Deny-All action deny
set zone-security interface-trust interfaces ge-0/0/2.0
set zone-security interfaces xe-1/0/0 trust
set zone-security interfaces xe-1/0/1 untrust
set protocols ospf area 0 network 192.168.1.0/24
set protocols bgp peer-group example-as.local peer-as 65100
set protocols bgp group IXP type external
set protocols bgp group IXP local-address 1.2.3.4
set protocols bgp group IXP peer-as 12345
set interfaces lo0 unit 0 family inet address 192.0.2.1/32
set system services ssh max-connections 80
set firewall family inet filter LAN_IN ruleset default rule drop action drop
set firewall family inet6 filter LAN_INET6 ruleset default rule drop action drop
set security policies from-zone Trust to-zone Untrust policy LAN_TO_WAN rule-name allow-lan-to-wan then log session-initiations
set interfaces xe-0/0/1 unit 2 ether-options vif-id 3
set management-api http server address 192.0.2.1 allow-origin "*"
