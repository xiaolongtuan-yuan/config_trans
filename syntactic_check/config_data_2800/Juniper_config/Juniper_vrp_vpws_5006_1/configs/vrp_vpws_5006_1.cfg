set system host-name U-PE1

 Marlinspike l2vpn

!

interface ge-0/0/0
 edit-vlan mpls-label protocol ldp
 next-vlan
end

interface ge-1/0/0
 edit-vlan mpls-label protocol ldp
 next-vlan
end

interface lo0
 4-address 1.1.1.9
edit-vlan mpls-label protocol ldp
next-vlan
end

protocols ospf 1 area 0 network 10.1.1.0.255.255.255.0 area 0
 protocols ospf 1 area 0 network 1.1.1.9/32 area 0

security l2vpn pw-class pw-t
 encapsulation mpls
control-word
end

security l2vpn ps-class pw-t
 encapsulation mpls
end

l2vpn pseudowire pw-t neighbor 3.3.3.9 remote-as 0
l2vpn ldp
l2vpn label protocol ldp
l2vpn ip
