set system host-name U-PE1

set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 1.1.1.9/32

set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-1/0/0.0

set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface lo0.0

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0 passive
set protocols ospf area 0.0.0.0 interface lo0.0

set routing-instances vpls-instance instance-type l2vpn
set routing-instances vpls-instance interface ge-0/0/0.0
set routing-instances vpls-instance route-distinguisher 100:1
set routing-instances vpls-instance vrf-target target:100:1
set routing-instances vpls-instance protocols l2vpn encapsulation-type ethernet-vpls
set routing-instances vpls-instance protocols l2vpn control-word
set routing-instances vpls-instance protocols l2vpn peer-address 3.3.3.9