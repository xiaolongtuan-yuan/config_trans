set interfaces lo0 unit 0 family inet address 192.168.1.1/32

set protocols bgp group <group-name> type external

set protocols bgp group <group-name> import filter1
set protocols bgp group <group-name> export filter2
set security policies from-zone Trust to-zone Trust policy Trust-to-Trust match source-address 192.168.1.0/24
set security policies from-zone Trust to-zone Trust policy Trust-to-Trust then permit
set interfaces ge-0/0/0 speed 1g
set system host-name router-hostname
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members default-vlan
set vlans default-vlan vlan-id 1
set vlans default-vlan interface ge-0/0/0.0
set security zones security-zone Trust interfaces ge-0/0/0.0
set security zones security-zone Trust host-inbound-traffic system-services all
set system services ssh client-alive-interval 60
set system syslog host 192.168.1.2 port 514

set system services ssh root-login deny
set security policies from-zone Trust to-zone Trust policy Trust-to-Trust match destination-address 203.0.113.0/24
set chassis aggregated-devices ethernet device-count 1
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members default-vlan
set vlans default-vlan interface ge-0/0/1.0
set system syslog file messages files 5 size 5000000
set security flow tcp-mss 1452