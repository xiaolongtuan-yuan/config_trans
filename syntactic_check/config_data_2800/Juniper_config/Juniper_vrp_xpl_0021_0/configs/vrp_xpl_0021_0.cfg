set system host-name DeviceA
set interfaces ge-0/0/0 unit 0 family inet address 1.1.5.2/24
set routing-options autonomous-system 100

set protocols bgp group external type internal
set protocols bgp group external neighbor 1.1.5.1
set protocols bgp group external local-address 1.1.5.2

set policy-options policy-statement prefix1 term permit-addr then accept
set vlans vlan1 vlan-id 1
set vlans vlan1 interface ge-0/0/0.0

set routing-instances ri-to-null instance-type virtual-router
set routing-instances ri-to-null routing-options static route 2.2.2.0/24 discard
set routing-instances ri-to-null routing-options static route 3.3.3.0/24 discard
set routing-instances ri-to-null routing-options static route 4.4.4.0/24 discard
set routing-instances ri-to-null routing-options static route 5.5.5.0/24 discard