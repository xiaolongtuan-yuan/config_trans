set system host-name PE1 
set protocols ldp

set protocols ospf area 0.0.0.0 interface ge-1/0/0.1

set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 unit 1 vlan-id 10
set interfaces ge-1/0/0 unit 1 family inet address 10.10.1.1/24

set interfaces lo0 unit 0 family inet address 1.1.1.9/32

set routing-instances a2 interface ge-1/0/0.1