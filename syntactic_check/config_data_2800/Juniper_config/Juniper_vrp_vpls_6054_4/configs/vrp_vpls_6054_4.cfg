set system host-name PE3
set protocols ldp

set interfaces ge-3/0/0 unit 0 family inet address 192.168.1.2/24
set interfaces ge-3/0/0 unit 1 encapsulation vlan-id 10
set routing-instances vis1 interface ge-3/0/0.1

set interfaces ge-1/0/0 unit 0 family inet address 192.168.1.1/24

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-3/0/0.0

set interfaces ge-2/0/0 unit 0 family inet address 192.168.20.2/24
set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set routing-options static route 0.0.0.0/0 next-hop 192.168.20.1

set protocols ldp interface lo0.0
set protocols ldp interface ge-3/0/0.0