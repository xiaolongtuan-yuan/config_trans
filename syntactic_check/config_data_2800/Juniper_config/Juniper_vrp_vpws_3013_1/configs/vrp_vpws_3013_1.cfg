set system host-name PE

set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0

set routing-options static route 0.0.0.0/0 next-hop 1.1.1.10

set interfaces ge-0/0/0 unit 0 family inet address 192.168.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 192.168.2.1/24
set interfaces ge-0/0/1 unit 0 family mpls

set firewall family inet filter FW1 term 1 then accept

set routing-instances vpls0 interface ge-0/0/0.0

set routing-instances vpls1 interface ge-0/0/1.0

set protocols ldp neighbor 192.168.2.2
set protocols ldp neighbor 192.168.1.2