set system name ASBR2

set protocols mpls label-retention-mode du

set interfaces ge-1/0/0 unit 0 family ipv4 address 10.20.1.2/30
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces ge-2/0/0 unit 0 family ipv4 address 10.30.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls
set protocols ldp interface ge-2/0/0

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set routing-options router-id 3.3.3.3

set policy route-control pc-to-as100-inbound term 1 from protocol bgp
set policy route-control pc-to-as100-inbound term 1 then mpls-label 55 push
set policy route-control pc-to-as100-inbound term 2 from protocol direct
set policy route-control pc-to-as100-inbound term 2 then mpls-label 66 push

set routing-instances public-mpi route-distinguisher 3:3
set routing-instances public-mpi vrf-table-target both
set routing-instances public-mpi instance-type vplink
set routing-instances public-mpi protocols bgp group AS100 type internal
set routing-instances public-mpi protocols bgp group AS100 peer-address 10.20.1.1
set routing-instances public-mpi protocols bgp group AS100 export pc-to-as100-outbound

set protocols bgp group AS200 type external
set protocols bgp group AS200 peer-address 4.4.4.4
set protocols bgp group AS200 export pc-to-as200-outbound
set protocols bgp group AS200 import pc-from-as200-inbound

set routing-options routes static route 3.3.3.3/32 next-hop self
set routing-options interfaces ge-2/0/0 unit 0 family inet accept-routes from vifi ge-2/0/0.0
set routing-options forwarding-table use-forwarding-engine-mpls

set protocols ospf area 0 interface ge-2/0/0.0
set protocols ospf area 0 interface lo0.0
