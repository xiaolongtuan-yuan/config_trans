set system host-name PE2

set protocols ldp interface all
set protocols mpls interface ge-0/0/1.1
set protocols mpls interface ge-0/0/2.0

set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 vlan-tagging
set interfaces ge-0/0/1 unit 1 family inet

set interfaces ge-0/0/2 unit 0 family inet address 10.2.1.1/24
set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols bgp group internal type internal
set protocols bgp group internal local-as 100
set protocols bgp group internal neighbor 2.2.2.2
set protocols bgp group internal family inet-vpn unicast

set protocols ospf area 0 interface ge-0/0/1.1
set protocols ospf area 0 interface lo0.0 passive

set routing-instances evpn-a interface ge-0/0/1.1