set system host-name LSRB
set protocols ldp enable
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 2.2.2.2/32
set routing-instances instance-name1 protocols ldp target-nodes node-1
set routing-instances instance-name1 routing-options static route 1.1.1.1/32 next-hop 2.1.1.1
set routing-instances instance-name1 routing-options static route 3.3.3.3/32 next-hop 3.2.1.2
