set system host-name PE2
set protocols ldp enable
set protocols mpls
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 0 family inet address 10.2.1.2/24
set protocols mpls traffic-eng tunnels
set interfaces ge-0/0/0 unit 0 family mpls traffic-eng bandwidth max-reservable-bandwidth 10000
set interfaces ge-0/0/0 unit 0 family mpls traffic-eng bandwidth bc0 5000
set protocols rsvp-te
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 0 family mpls encapsulation mpls
set interfaces ge-1/0/0 unit 0 family mpls encap-type pw-class policy1
set interfaces ge-1/0/0 unit 0 family mpls encap-type pw-class connection 1.1.1.9 10
set routing-options static route 0.0.0.0/0 next-hop 3.3.3.9
set interfaces lo0 unit 0 family inet address 3.3.3.9/32
set interfaces lo0 unit 0 family pfe ip-in-ip
set forwarding-plane traffic-eng tunnels tunnel-id 10
set protocols ospf area 0 interface ge-0/0/0.0
set protocols mpls traffic-eng area 0 network 10.2.1.0/24
set protocols mpls traffic-eng bandwidth max-reservable-bandwidth 10000 loept1 tunnel-id 10
