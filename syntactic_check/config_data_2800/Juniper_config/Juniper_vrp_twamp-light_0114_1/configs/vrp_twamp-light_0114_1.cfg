set system host-name DeviceB
set interfaces ge-1/0/0 unit 31 vlan-id 31
set interfaces ge-1/0/0 unit 31 family inet address 3.0.0.6/31

set interfaces ge-1/0/1 unit 1 vlan-id 1
set interfaces ge-1/0/1 unit 1 family inet address 192.168.2.2/24

set interfaces lo0 unit 0 family inet address 10.0.0.3/32

set services rpm probe test1 test test-type twamp-light
set services rpm probe test1 test target address 192.168.1.1
set services rpm probe test1 test target port 6000
set services rpm probe test1 test probe-count 10
set services rpm probe test1 test probe-interval 60

set security zones security-zone trust host-inbound-traffic system-services all
set firewall family inet filter PERMIT-TWAMP term ALLOW from source-address 192.168.2.2/32
set firewall family inet filter PERMIT-TWAMP term ALLOW from destination-address 192.168.1.1/32
set firewall family inet filter PERMIT-TWAMP term ALLOW from destination-port 6000
set firewall family inet filter PERMIT-TWAMP term ALLOW then accept
set interfaces ge-1/0/1 unit 1 family inet filter input PERMIT-TWAMP

set system processes disable netflow
