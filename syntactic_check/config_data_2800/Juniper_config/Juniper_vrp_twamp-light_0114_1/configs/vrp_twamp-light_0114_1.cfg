set system host-name DeviceB
set protocols ldp enable
set protocols mpls label protocol ldp
set protocols mpls ip
set interfaces lo0 unit 0 family inet address 10.0.0.3/32
set routing-options router isis 1
set interfaces gigabit-ethernet1/0/0.31 encapsulation dot1q 31
set interfaces gigabit-ethernet1/0/0.31 family inet mtu 9500
set interfaces gigabit-ethernet1/0/0.31 family inet address 3.0.0.6/31
set forwarding-options vxlan forwarding-cdma-ran rd 4134:3060 export 4134:306000 import 4134:306000
set routing-instances wamplight-instance vrf-target export 4134:306000
set routing-instances wamplight-instance vrf-target import 4134:306000
set interfaces gigabit-ethernet1/0/1.1 encapsulation dot1q 1
set interfaces gigabit-ethernet1/0/1.1 family inet address 192.168.2.2/24
set forwarding-options vxlan forwarding-cdma-ran vlink-direct-route-advertise
set protocols igmp interface lo0
set security zones security-zone trust host-inbound-traffic ip-filter wamplight
delete system services netflow cache timeout inactive
set security flow tcp-udp-options allow-tunnel-transports
set routing-options interfaces gigabit-ethernet1/0/1.31 unit 0 family vxlan encap-cdni-ipv4
set routing-options interfaces gigabit-ethernet1/0/1.31 unit 0 family inet address 3.0.0.6/31
set security zones security-zone trust interfaces all allow-incoming igmp-v2
delete protocols ospf
delete protocols bgp
delete routing-instances default-electronic
delete protocols rip
set firewall family inet filter wamplight input term permit-wamplight from protocol igmp
set firewall family inet filter wamplight input term permit-wamplight from port 6000 to 6000 
set security forwardingservice flowtype wamplight-sender session 1 destination-address 192.168.1.1
set security forwardingservice flowtype wamplight-sender session 1 source-address 192.168.2.2
set security forwardingservice flowtype wamplight-sender session 1 destination-port 6000
set security forwardingservice flowtype wamplight-sender session 1 source-port 6000
set security zones security-zone trust interfaces all policy permit-wamplight term permit-wamplight from protocol igmp 
set security forwarding-service flowtypes append wamplight-sender