set system host-name DeviceC
set interfaces ge-0/0/1 unit 0 family inet address 1.1.1.2/24
set interfaces ge-0/0/2 unit 0 family inet address 1.1.3.1/24
set routing-options autonomous-system 200

set protocols bgp group testpeer type external
set protocols bgp group testpeer peer-as 100
set protocols bgp group testpeer neighbor 1.1.1.1
set protocols bgp group testpeer neighbor 1.1.3.2