set system host-name PE1
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-1/0/0.0
set routing-options router-id 192.168.2.2

set interfaces ge-0/0/0 flexible-vlan-tagging
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/32
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 1 encapsulation vlan-bridge
set interfaces ge-0/0/0 unit 1 vlan-id 1

set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 1 encapsulation vlan-bridge
set interfaces ge-1/0/0 unit 1 vlan-id 1

set bridge-domains Vlan1 interface ge-0/0/0.1
set bridge-domains Vlan1 interface ge-1/0/0.1

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set interfaces lo0 unit 0 family inet address 192.168.2.2/32

set protocols l2circuit interface ge-1/0/0.1 neighbor 192.168.3.3 virtual-circuit-id 100