#
sysname PE1
#
mpls lsr-id 1.1.1.9
#
mpls
 mpls te
#
mpls l2vpn
#
vsi a2
 pwsignal ldp
  vsi-id 2
  peer 3.3.3.9 tnl-policy policy1
#
explicit-path path2pe2
 next sid label 16300 type prefix
 next sid label 16200 type prefix
#
mpls ldp
 #
 ipv4-family
#
mpls ldp remote-peer 3.3.3.9
 remote-ip 3.3.3.9
#
segment-routing
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.10.1.1 255.255.255.0
#
interface GigabitEthernet2/0/0
 undo shutdown
#
interface GigabitEthernet2/0/0.1
 vlan-type dot1q 10
 l2 binding vsi a2
#
interface LoopBack1
 ip address 1.1.1.9 255.255.255.255
 ospf prefix-sid absolute 16100
#
interface Tunnel10
 ip address unnumbered interface LoopBack1
 tunnel-protocol mpls te
 destination 3.3.3.9
 mpls te signal-protocol segment-routing
 mpls te reserved-for-binding
 mpls te tunnel-id 100
 mpls te path explicit-path path2pe2
#
ospf 1
 opaque-capability enable
 segment-routing mpls
 segment-routing global-block 16000 47999
 area 0.0.0.0
  network 1.1.1.9 0.0.0.0
  network 10.10.1.0 0.0.0.255
  mpls-te enable
#
tunnel-policy policy1
 tunnel binding destination 3.3.3.9 te Tunnel10
#
return
