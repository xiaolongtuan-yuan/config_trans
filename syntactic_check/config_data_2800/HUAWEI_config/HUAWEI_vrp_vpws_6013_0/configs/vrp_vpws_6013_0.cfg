#
 sysname PE1
#
 mpls lsr-id 192.168.2.2
 mpls
#
 mpls l2vpn
#
pw-template 1to3
 peer-address 192.168.3.3
 jitter-buffer depth 20
 tdm-encapsulation-number 40
 idle-code 33
#
mpls ldp
#
 mpls ldp remote-peer 192.168.3.3
 remote-ip 192.168.3.3 
#
controller e1 2/0/1
using ce1
code ami
frame-format crc4
channel-set 1 timeslot-list 1-15
undo shutdown
#
controller e1 2/0/2
using ce1
code ami
frame-format crc4
channel-set 1 timeslot-list 16-31
undo shutdown
#
interface serial2/0/1:1
link-protocol tdm
mpls l2vc pw-template 1to3 100
undo shutdown
#
interface serial2/0/2:1
link-protocol tdm
mpls l2vc pw-template 1to3 200
undo shutdown
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.1.1.1 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack0
 ip address 192.168.2.2 255.255.255.255
#
ospf 1
area 0.0.0.0
  network 192.168.2.2 0.0.0.0
  network 10.1.1.0 0.0.0.255
#
return
