sysname PE2
#
mpls lsr-id 4.4.4.4
mpls
#
mpls l2vpn
#
vsi v1
 pwsignal ldp
  vsi-id 2
  peer 3.3.3.3
#
mpls ldp
#
interface GigabitEthernet2/0/0
 undo shutdown
#
interface GigabitEthernet2/0/0.1
 undo shutdown
 vlan-type dot1q 10
 l2 binding vsi v1
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.20.1.2 255.255.255.252
