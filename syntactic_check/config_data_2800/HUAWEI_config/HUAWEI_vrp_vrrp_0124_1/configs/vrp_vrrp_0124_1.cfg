#
 sysname PE2
#
interface GigabitEthernet1/0/1
 undo shutdown 
 ip address 10.10.1.1 255.255.255.0
 vrrp vrid 10 virtual-ip 10.10.1.111
 vrrp vrid 10 track admin-vrrp interface gigabitethernet1/0/4 vrid 1 unflowdown
#
interface GigabitEthernet1/0/2
 undo shutdown 
 ip address 10.20.1.1 255.255.255.0
 vrrp vrid 20 virtual-ip 10.20.1.111
 vrrp vrid 20 track admin-vrrp interface gigabitethernet1/0/5 vrid 2 unflowdown
#
interface GigabitEthernet1/0/3
 undo shutdown 
 ip address 192.168.2.1 255.255.255.0
#
interface GigabitEthernet1/0/4
 ip address 10.10.3.2 255.255.255.0 
 vrrp vrid 1 virtual-ip 10.10.3.111
 admin-vrrp vrid 1
#
interface GigabitEthernet1/0/5
 ip address 10.20.3.2 255.255.255.0 
 vrrp vrid 2 virtual-ip 10.1.1.222
 admin-vrrp vrid 2
#
ospf 1
 area 0.0.0.0
  network 10.10.1.0 0.0.0.255
  network 10.10.3.0 0.0.0.255
  network 10.20.1.0 0.0.0.255
  network 10.20.3.0 0.0.0.255
  network 192.168.2.0 0.0.0.255
#
return
