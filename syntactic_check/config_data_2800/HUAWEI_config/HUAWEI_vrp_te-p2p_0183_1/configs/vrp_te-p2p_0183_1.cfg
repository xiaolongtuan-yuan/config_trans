#
sysname LSRB
#
mpls lsr-id 2.2.2.2
#
mpls
 mpls te
#
static-cr-lsp transit Tunnel10 incoming-interface GigabitEthernet1/0/0 in-label 20 nexthop 3.2.1.2 out-label 30
#
static-cr-lsp transit Tunnel20 incoming-interface GigabitEthernet2/0/0 in-label 120 nexthop 2.1.1.1 out-label 130
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 3.2.1.1 255.255.255.0
 mpls
 mpls te
#               
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 2.1.1.2 255.255.255.0
 mpls
 mpls te
#
interface LoopBack1
 ip address 2.2.2.2 255.255.255.255
#               
return
