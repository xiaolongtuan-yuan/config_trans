#
sysname PE1
#
 bfd
#
 mpls lsr-id 1.1.1.1
 mpls
#
 mpls l2vpn
#
pw-template 1to2
 peer-address 4.4.4.4
 control-word
#
pw-template 1to3
 peer-address 5.5.5.5
 control-word
#
mpls ldp
#
 mpls ldp remote-peer 4.4.4.4
 remote-ip 4.4.4.4
#
 mpls ldp remote-peer 5.5.5.5
 remote-ip 5.5.5.5
#
interface GigabitEthernet1/0/0
 undo shutdown
 mpls l2vc pw-template 1to2 100
 mpls l2vc pw-template 1to3 200 secondary
#
interface GigabitEthernet1/0/1
 undo shutdown
 ip address 10.2.1.1 255.255.255.252
 mpls
 mpls ldp
#
interface GigabitEthernet1/0/2
 undo shutdown
 ip address 10.4.1.1 255.255.255.252
 mpls
 mpls ldp
#
interface LoopBack1
 ip address 1.1.1.1 255.255.255.255
#
ospf 1
 area 0.0.0.0
  network 1.1.1.1 0.0.0.0
  network 10.2.1.0 0.0.0.3
  network 10.4.1.0 0.0.0.3
#
bfd 1to2 bind pw interface GigabitEthernet1/0/0
 discriminator local 12
 discriminator remote 21
 commit
#
bfd 1to3 bind pw interface GigabitEthernet1/0/0 secondary
 discriminator local 13
 discriminator remote 31
 commit
#
return
