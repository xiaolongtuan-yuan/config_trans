#
 sysname PE2
#
 mpls lsr-id 192.168.3.3
 mpls
#
 mpls l2vpn
#
pw-template 3to1
 peer-address 192.168.2.2
 atm-pack-overtime 1000
#
mpls ldp
#
 mpls ldp remote-peer 192.168.2.2
 remote-ip 192.168.2.2
#
controller e1 2/0/1
using ce1
channel-set 1 timeslot-list 1-15
undo shutdown
#
interface serial2/0/1:1
link-protocol atm
ima ima-group 2/0/1
undo shutdown
#
interface ima-group 2/0/1.1
 pvc 1/100
 pvc 1/200
 pvc 1/300
 pvc 1/400
 mpls l2vc pw-template 3to1 100
 undo shutdown
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 10.2.2.2 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack0
 ip address 192.168.3.3 255.255.255.255
#
ospf 1
 area 0.0.0.0
  network 192.168.3.3 0.0.0.0
network 10.2.2.0 0.0.0.255
#
return
