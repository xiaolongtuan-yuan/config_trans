#
 sysname LSRA
#
mpls lsr-id 1.1.1.1
#
mpls
 mpls te
 mpls te cspf
 mpls rsvp-te
#
explicit-path pri-path
 next hop 2.1.1.2
 next hop 3.1.1.2
 next hop 4.1.1.2
 next hop 4.4.4.4
#
isis 1
 is-level level-2
 cost-style wide
 traffic-eng level-2
 network-entity 00.0005.0000.0000.0001.00
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 2.1.1.1 255.255.255.0
 mpls
 mpls te
 isis enable 1
 mpls rsvp-te
#
interface LoopBack1
 ip address 1.1.1.1 255.255.255.255
 isis enable 1
#
interface Tunnel1
 ip address unnumbered interface LoopBack1
 tunnel-protocol mpls te
 destination 4.4.4.4
 mpls te tunnel-id 1
 mpls te record-route label
 mpls te path explicit-path pri-path
 mpls te fast-reroute
#
return
