#
sysname ASBR1
#
mpls lsr-id 2.2.2.2
mpls
#
mpls l2vpn
#
vsi v1
 pwsignal ldp
  vsi-id 2
  peer 1.1.1.1
#
mpls ldp
#
interface GigabitEthernet2/0/0
 undo shutdown
#
interface GigabitEthernet2/0/0.1
 undo shutdown
 vlan-type dot1q 10
 l2 binding vsi v1
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.10.1.2 255.255.255.252
 mpls
 mpls ldp
#
interface LoopBack1
 ip address 2.2.2.2 255.255.255.255
#
ospf 1
 area 0.0.0.0
  network 2.2.2.2 0.0.0.0
  network 10.10.1.0 0.0.0.255
#
return
