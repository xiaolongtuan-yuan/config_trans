#
sysname PE2
#
mpls lsr-id 4.4.4.9
#
mpls
#
mpls l2vpn
#
mpls ldp
#               
interface GigabitEthernet1/0/0
 undo shutdown  
 ip address 10.20.1.2 255.255.255.0
 mpls           
 mpls ldp       
#               
interface GigabitEthernet2/0/0
 undo shutdown  
#               
interface LoopBack1
 ip address 4.4.4.9 255.255.255.0
#               
mpls l2vpn vpn1 encapsulation ethernet
 route-distinguisher 200:1
 vpn-target 1:1 import-extcommunity
 vpn-target 1:1 export-extcommunity
 ce ce4 id 4 range 10 default-offset 0
  connection ce-offset 3 interface GigabitEthernet2/0/0
#               
bgp 200         
 peer 3.3.3.9 as-number 200
 peer 3.3.3.9 connect-interface LoopBack1
 #              
 ipv4-family unicast
  undo synchronization
  peer 3.3.3.9 enable
 #              
 l2vpn-ad-family
  policy vpn-target
  peer 3.3.3.9 enable
  peer 3.3.3.9 signaling vpws
#               
ospf 1          
 area 0.0.0.0   
  network 4.4.4.9 0.0.0.0
  network 10.20.1.0 0.0.0.255
#               
return
