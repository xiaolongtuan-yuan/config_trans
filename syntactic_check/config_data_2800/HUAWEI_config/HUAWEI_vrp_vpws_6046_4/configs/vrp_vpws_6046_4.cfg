sysname PE2
#
mpls lsr-id 4.4.4.4
mpls
#
mpls l2vpn
#
mpls ldp
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.20.1.2 255.255.255.0
 mpls
 mpls ldp
