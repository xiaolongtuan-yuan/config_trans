set system host-name LSRD
set protocols mpls traffic-eng tunnels
set routing-options isis network point-to-point
set routing-options isis metric-style wide
set routing-options isis mpls traffic-eng level-2-only
set interfaces ge-0/0/0 unit 0 family inet address 4.1.1.2/24
set interfaces lo0 unit 0 family inet address 4.4.4.4/32
