set system host-name CE2

set interfaces ge-1/0/0 unit 0 family inet address 192.168.2.2/24

set interfaces lo0 unit 1 family inet address 10.20.20.20/32

set routing-options autonomous-system 65420

set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 200
set protocols bgp group external-peers neighbor 192.168.2.1
set protocols bgp group external-peers family inet unicast
set protocols bgp group external-peers export redistribute-connected

set policy-options policy-statement redistribute-connected term 1 from protocol direct
set policy-options policy-statement redistribute-connected term 1 then accept