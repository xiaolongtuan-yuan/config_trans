set system host-name ASBR2
set protocols mpls interface all
set protocols ldp interface all

set interfaces ge-1/0/0 unit 0 family inet address 172.22.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols ldp interface ge-1/0/0

set interfaces ge-2/0/0 unit 0 family inet address 192.168.1.2/24
set interfaces ge-2/0/0 unit 0 family mpls

set interfaces lo0 unit 1 family inet address 3.3.3.9/32

set routing-options autonomous-system 200

set protocols bgp group EBGP-100 type external
set protocols bgp group EBGP-100 peer-as 100
set protocols bgp group EBGP-100 neighbor 192.168.1.1

set protocols bgp group IBGP-200 type internal
set protocols bgp group IBGP-200 local-address 3.3.3.9
set protocols bgp group IBGP-200 peer-as 200
set protocols bgp group IBGP-200 neighbor 4.4.4.9

set protocols bgp group IBGP-200 family inet unicast
set protocols bgp group IBGP-200 family evpn signaling

set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-1/0/0.0
