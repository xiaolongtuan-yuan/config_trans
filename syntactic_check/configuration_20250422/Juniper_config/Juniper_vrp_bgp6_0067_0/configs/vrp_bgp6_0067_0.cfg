set system host-name DeviceA
set protocols bfd
set interfaces ge-1/0/0 unit 0 family inet6 address 2001:db8:8::1/64
set interfaces ge-2/0/0 unit 0 family inet6 address 2001:db8:10::1/64
set routing-options autonomous-system 100
set routing-options router-id 1.1.1.1
set protocols bgp group EBGP-PEER1 type external
set protocols bgp group EBGP-PEER1 peer-as 200
set protocols bgp group EBGP-PEER1 neighbor 2001:db8:8::2
set protocols bgp group EBGP-PEER1 bfd-liveness-detection minimum-interval 100
set protocols bgp group EBGP-PEER1 bfd-liveness-detection multiplier 4
set protocols bgp group EBGP-PEER2 type external
set protocols bgp group EBGP-PEER2 peer-as 200
set protocols bgp group EBGP-PEER2 neighbor 2001:db8:10::2
set protocols bgp group EBGP-PEER1 family inet6 unicast
set protocols bgp group EBGP-PEER2 family inet6 unicast
