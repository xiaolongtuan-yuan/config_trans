set system host-name CE

set vlans vlan10 vlan-id 10
set vlans vlan100 vlan-id 100

set protocols rstp vlan 10
set protocols rstp vlan 100

set protocols erps ring 1 control-vlan 100
set protocols erps ring 1 instance 0 version 2 sub-ring

set interfaces ge-1/0/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members [10 100]
set interfaces ge-1/0/0 disable
set protocols rstp interface ge-1/0/0 disable
set protocols erps ring 1 interface ge-1/0/0

set interfaces ge-2/0/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-2/0/0 unit 0 family ethernet-switching vlan members [10 100]
set interfaces ge-2/0/0 disable
set protocols rstp interface ge-2/0/0 disable
set protocols erps ring 1 interface ge-2/0/0
