set system host-name DeviceB

set protocols bfd

set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.2/24
set interfaces ge-0/0/0 enable

set interfaces ge-0/0/1 unit 0 family inet address 8.8.8.8/24
set interfaces ge-0/0/1 enable

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set routing-options static route 0.0.0.0/0 next-hop 10.10.1.1
set routing-options static route 1.1.1.1/32 next-hop 10.10.1.1 bfd-liveness-detection minimum-interval 1000