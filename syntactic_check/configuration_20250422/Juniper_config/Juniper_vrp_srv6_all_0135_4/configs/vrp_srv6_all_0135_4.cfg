# 设置主机名
set system host-name CE2

# 配置GigabitEthernet1/0/0接口
set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.2/24

# 配置Loopback1接口
set interfaces lo0 unit 1 family inet address 22.22.22.22/32

# 配置BGP协议
set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 100
set protocols bgp group external-peers neighbor 10.2.1.1

# 不进行同步（通常在Juniper中这是默认的）
# 不像Cisco，Juniper没有显式的同步命令

# 在BGP中声明网络
set policy-options policy-statement advertise-networks term 1 from route-filter 22.22.22.22/32 exact
set policy-options policy-statement advertise-networks then accept

# 将声明的网络应用于BGP组
set protocols bgp group external-peers export advertise-networks