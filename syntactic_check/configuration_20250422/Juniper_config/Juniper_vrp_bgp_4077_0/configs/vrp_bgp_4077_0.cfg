set system host-name DeviceA

set interfaces ge-1/0/0 unit 0 family inet address 10.5.1.1/24
set interfaces ge-1/0/0 unit 0 description "Interface GigabitEthernet1/0/0"

set interfaces ge-2/0/0 unit 0 family inet address 10.1.2.1/24
set interfaces ge-2/0/0 unit 0 description "Interface GigabitEthernet2/0/0"

set routing-options autonomous-system 10
set routing-options router-id 1.1.1.1

set protocols bgp group EBGP_AS20 type external
set protocols bgp group EBGP_AS20 peer-as 20
set protocols bgp group EBGP_AS20 neighbor 10.1.2.2
set protocols bgp group EBGP_AS20 family inet unicast
set protocols bgp group EBGP_AS20 export comm_policy
set protocols bgp group EBGP_AS20 send-community

set policy-options policy-statement comm_policy term 1 from community no-export
set policy-options policy-statement comm_policy term 1 then community set no-export
set policy-options policy-statement comm_policy term 1 then accept

set policy-options community no-export members no-export
