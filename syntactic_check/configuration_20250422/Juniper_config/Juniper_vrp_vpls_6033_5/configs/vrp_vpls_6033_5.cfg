set system host-name SPE2

set protocols ldp enable

set forwarding-label protocol ldp

set forwarding-options label policy label

set vlans v100 interfaces ge-0/0/0

set vlans v100 tagged ge-0/0/1

set forwarding-options mac-learning vlan v100 time 300 disable

set interfaces ge-0/0/0 unit 0 family l2-bridge vlan v100
set interfaces ge-0/0/1 unit 0 family l2-bridge vlan v100

set interfaces ge-0/0/0 unit 0 family inet address 10.10.2.2/24
set forwarding-options mpls ip interface ge-0/0/0 unit 0

set interfaces ge-0/0/1 unit 0 family inet address 10.10.4.1/24
set forwarding-options mpls ip interface ge-0/0/1 unit 0

set interfaces lo0 unit 0 family inet address 3.3.3.9/32

set routing-instances test vlan-id 100
set routing-instances test instance-type vplc
set routing-instances test forwarding-options mac-address-table learning disable
set routing-instances test members ge-0/0/0.0
set routing-instances test members ge-0/0/1.0

set protocols ospf 1 area 0 interface lo0.0

commit
