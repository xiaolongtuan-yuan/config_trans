set system host-name DeviceC
set interfaces gigabit-ethernet1/0/0 unit 0 family inet address 192.168.1.2/24
set interfaces gigabit-ethernet2/0/0 unit 0 family inet address 192.168.2.2/24
set interfaces gigabit-ethernet3/0/0 unit 0 family inet address 172.16.1.1/24
set routing-options router ospf 1
set routing-options router ospf 1 network 192.168.1.0/255.255.255.0 area 0
set routing-options router ospf 1 network 192.168.2.0/255.255.255.0 area 0
set routing-options router ospf 1 network 172.16.1.0/255.255.255.0 area 0
