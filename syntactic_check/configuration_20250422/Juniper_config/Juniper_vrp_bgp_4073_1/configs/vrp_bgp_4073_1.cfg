set system host-name DeviceB

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 unit 0 description "GigabitEthernet1/0/0"

set interfaces ge-2/0/0 unit 0 family inet address 172.16.1.1/24
set interfaces ge-2/0/0 unit 0 description "GigabitEthernet2/0/0"

set routing-options autonomous-system 65009
set routing-options router-id 2.2.2.2

set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 65008
set protocols bgp group external-peers neighbor 172.16.1.2

set protocols bgp group external-peers family inet unicast
set protocols bgp group external-peers export ospf-to-bgp
set protocols bgp group external-peers import bgp-to-ospf

set policy-options policy-statement ospf-to-bgp term 1 from protocol ospf
set policy-options policy-statement ospf-to-bgp term 1 then accept

set policy-options policy-statement bgp-to-ospf term 1 from protocol bgp
set policy-options policy-statement bgp-to-ospf term 1 then accept

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf export bgp-to-ospf
