set system host-name CE2

set protocols pim interface ge-1/0/0 mode sparse
set protocols pim interface ge-1/0/1 mode sparse
set protocols pim rp local address 10.1.3.5

set interfaces ge-1/0/0 unit 0 family inet address 192.168.2.2/24
set interfaces ge-1/0/0 unit 0 family inet address 10.1.4.1/24 
set interfaces ge-1/0/1 unit 0 family inet igmp join-group 225.1.1.1 source 10.1.3.5

set protocols ospf area 0 interface ge-1/0/0
set protocols ospf area 0 interface ge-1/0/1

set routing-options multicast inet6-routing no-restrictedpacket

set protocols ospf area 0 interface ge-1/0/0.0
set protocols ospf area 0 interface ge-1/0/1.0

activate interfaces ge-1/0/0
activate interfaces ge-1/0/1

commit and-quit