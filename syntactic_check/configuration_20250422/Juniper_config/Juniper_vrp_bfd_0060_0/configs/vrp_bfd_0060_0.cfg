set system host-name DeviceA

set interfaces ae1 description "Eth-Trunk1"
set interfaces ae1 unit 0 family inet address 10.1.1.1/24

set interfaces ge-1/0/0 ether-options 802.3ad ae1
set interfaces ge-2/0/0 ether-options 802.3ad ae1

set protocols bfd interface ae1
set protocols bfd interface ae1 local-address 10.1.1.1
set protocols bfd interface ae1 neighbor 10.1.1.2
set protocols bfd interface ae1 local-discriminator 10
set protocols bfd interface ae1 remote-discriminator 20
