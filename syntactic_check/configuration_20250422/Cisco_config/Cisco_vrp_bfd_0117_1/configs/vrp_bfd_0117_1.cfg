hostname DeviceB
!
interface Eth-Trunk1
 ip address 10.1.1.2 255.255.255.0
!
interface Gigabitethernet3/0/0
 no shutdown
 channel-group 1 mode on
!
interface Gigabitethernet3/0/1
 no shutdown
 channel-group 1 mode on
!
bfd template btoa
 interval min-tx 10
 interval min-rx 10
!
bfd bind bundle peer-ip 10.1.1.1 source-ip 10.1.1.2 interface Eth-Trunk1 template btoa
!
end