hostname PE1

cfm version standard
cfm

mpls label protocol ldp
mpls l2vpn
mpls ldp

interface GigabitEthernet1/0/1.1
 encapsulation dot1q 2
 xconnect 2.2.2.2 2 encapsulation mpls

interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.1.1 255.255.255.0
 mpls ip
 mpls ldp

interface Loopback0
 ip address 1.1.1.1 255.255.255.0

router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.1.1.0 0.0.0.255 area 0

cfm domain md1
 cfm mep 1 interface GigabitEthernet1/0/1.1 inward
 remote-mep 2 mep 2
 mep 1 ccm send
 mep 2 ccm receive
 test 1 mep 1 remote-mep 2 loss-measure dual-ended continual interval 30000
 mpls l2vpn
  xconnect 2.2.2.2 2 encapsulation mpls

end

