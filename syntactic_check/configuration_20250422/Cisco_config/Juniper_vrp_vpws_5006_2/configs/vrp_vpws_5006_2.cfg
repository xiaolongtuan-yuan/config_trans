set system host-name P1
set protocols mpls label-mode ldp
set interfaces ge-0/0/0 unit 0 family ethernet-switching
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/0 family inet enable-mpls
set interfaces ge-0/1/0 unit 0 family ethernet-switching
set interfaces ge-0/1/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-0/1/0 family inet enable-mpls
set interfaces lo0 unit 0 family inet address 2.2.2.9/32
set routing-options router ospf 1
set routing-options router ospf 1 network 2.2.2.9.0.0.0.0 area 0
set routing-options router ospf 1 network 10.1.1.0.0.0.255.255 area 0
set routing-options router ospf 1 network 10.2.1.0.0.0.255.255 area 0
