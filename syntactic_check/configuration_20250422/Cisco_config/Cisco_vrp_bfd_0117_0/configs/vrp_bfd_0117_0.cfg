hostname DeviceA

interface Port-channel1
 ip address 10.1.1.1 255.255.255.0

interface GigabitEthernet3/0/0
 no shutdown
 channel-group 1 mode on

interface GigabitEthernet3/0/1
 no shutdown
 channel-group 1 mode on

bfd all-interfaces
 min-tx-interval 10
 min-rx-interval 10

bfd all-interfaces destination 10.1.1.2 source 10.1.1.1

end