set system host-name DeviceG

set vlans vlan3 vlan-id 3

set interfaces ge-1/0/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members 3

set interfaces ge-1/0/2 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members 3

set protocols oam ethernet connectivity-fault-management maintenance-domain md1 level 6
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma2
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma2 continuity-check interval 1s
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma2 mep 2 interface ge-1/0/0 direction inward
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma2 remote-mep 1
