set system host-name CE2

set vlans vlan10 vlan-id 10
set vlans vlan30 vlan-id 30

set interfaces ge-1/0/1 unit 0 family ethernet-switching interface-mode access
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members vlan30
set interfaces ge-1/0/1 disable false

set interfaces ge-1/0/2 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members [vlan10 vlan30]
set interfaces ge-1/0/2 disable false

set interfaces ge-1/0/3 unit 0 family ethernet-switching interface-mode access
set interfaces ge-1/0/3 unit 0 family ethernet-switching vlan members vlan10
set interfaces ge-1/0/3 disable false
