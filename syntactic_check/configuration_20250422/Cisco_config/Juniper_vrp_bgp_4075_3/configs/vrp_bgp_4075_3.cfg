set system host-name DeviceD

set interfaces ge-1/0/0 unit 0 family inet address 10.1.4.2/24
set interfaces ge-1/0/0 unit 0 description "GigabitEthernet1/0/0"

set interfaces ge-2/0/0 unit 0 family inet address 10.1.6.1/24
set interfaces ge-2/0/0 unit 0 description "GigabitEthernet2/0/0"

set routing-options autonomous-system 65010

set protocols bgp group internal type internal
set protocols bgp group internal local-address 4.4.4.4
set protocols bgp group internal neighbor 10.1.4.1
set protocols bgp group internal neighbor 10.1.6.2
