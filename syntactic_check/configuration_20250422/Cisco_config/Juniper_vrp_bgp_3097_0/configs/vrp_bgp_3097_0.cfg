set system host-name RouterA

set interfaces ge-3/0/0 unit 0 family inet address 172.16.3.1/24
set interfaces ge-1/0/1 unit 0 family inet address 172.16.2.1/24
set interfaces ge-1/0/3 unit 0 family inet address 172.16.1.1/24

set routing-options autonomous-system 65008
set routing-options router-id 1.1.1.1
set protocols bgp group internal type internal
set protocols bgp group internal neighbor 172.16.2.2
set protocols bgp group internal family inet unicast add-path receive
set policy-options policy-statement direct-import term 1 from protocol direct
set policy-options policy-statement direct-import term 1 then accept
set protocols bgp group internal import direct-import

set routing-options static route 0.0.0.0/0 next-hop <next-hop>  (replace <next-hop> with the appropriate next-hop IP address)
