set system host-name LSR-A
set protocols ldp interface ge-0/0/0
set forwarding-lsp mpls enable
set interfaces ge-0/0/0 unit 0 family inet address 2.1.1.1/24
set interfaces lo0 unit 0 family inet address 1.1.1.1/32
set vlans管理名 space vfi LPT1 tunnel-type mpls traffic-eng bandwidth 100000
set vlans管理名 space vfi LPT2 tunnel-type mpls traffic-eng bandwidth 100000 100000
set interfaces lo0 unit 0 family inet unnumbered vlan management
set protocols mpls traffic-eng tunnels
set protocols mpls traffic-eng autoroute announce all
set protocols mpls traffic-eng priority 7
set protocols mpls traffic-eng bandwidth 10000
set protocols mpls traffic-eng path-option 10 explicit host-name Tunnel10 destination 3.3.3.3
set forwarding-rules family inet route 2.2.2.2/32 next-hop 2.1.1.2
set forwarding-rules family inet route 3.3.3.3/32 next-hop 2.1.1.2
