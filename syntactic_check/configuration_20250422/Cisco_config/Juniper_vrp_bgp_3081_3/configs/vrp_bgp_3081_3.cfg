set system host-name DeviceD

set interfaces ge-1/0/0 unit 0 family inet address 10.1.4.1/24
set interfaces ge-1/0/0 unit 0 description "GigabitEthernet1/0/0"

set interfaces ge-2/0/0 unit 0 family inet address 10.1.3.1/24
set interfaces ge-2/0/0 unit 0 description "GigabitEthernet2/0/0"

set interfaces ge-3/0/0 unit 0 family inet address 172.16.1.1/24
set interfaces ge-3/0/0 unit 0 description "GigabitEthernet3/0/0"

set routing-options autonomous-system 200
set routing-options router-id 4.4.4.4

set protocols bgp group EBGP-PEERS type external
set protocols bgp group EBGP-PEERS peer-as 300
set protocols bgp group EBGP-PEERS neighbor 10.1.3.2
set protocols bgp group EBGP-PEERS neighbor 10.1.4.2

set protocols bgp group EBGP-PEERS family inet unicast
set protocols bgp group EBGP-PEERS export EXPORT-POLICY

set policy-options policy-statement EXPORT-POLICY term 1 from protocol direct
set policy-options policy-statement EXPORT-POLICY term 1 from interface ge-3/0/0.0
set policy-options policy-statement EXPORT-POLICY term 1 then accept
