hostname LSRA
#
mpls label protocol ldp
#
mpls traffic-eng tunnels
#
router isis
 is-type level-2-only
 metric-style wide
 traffic-eng level-2
 net 49.0005.0000.0000.0001.00
#
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.1.1.1 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 mpls traffic-eng bandwidth max-reservable-bandwidth 100000
 mpls traffic-eng bandwidth bc0 100000
 isis network point-to-point
 mpls traffic-eng rsvp-te
#
interface Loopback1
 ip address 1.1.1.9 255.255.255.255
 isis network point-to-point
#
interface Tunnel1
 ip unnumbered Loopback1
 tunnel mode mpls traffic-eng
 tunnel destination 4.4.4.9
 tunnel mpls traffic-eng bandwidth ct0 20000
 tunnel mpls traffic-eng tunnel-id 1
#
end