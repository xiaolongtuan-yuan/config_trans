set system host-name LSR-A

set protocols ldp peer-address 49.0005.0000.0000.0100 interface ge-0/0/0

set routing-options isis level-2-only
set link-state-routing isis metric-style wide
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls ip
set interfaces ge-0/0/0 unit 0 family mpls traffic-eng tunnels
set interfaces ge-0/0/0(unit 0) family mpls traffic-eng bandwidth-max-reservable-bandwidth 1000000
set interfaces ge-0/0/0(unit 0) family mpls traffic-eng bandwidth-c0 1000000

set protocols isis network-type point-to-point area 49.0005.0000.0000.0100
set protocols ripv2 default-information originate

set interfaces lo0 unit 0 family inet address 1.1.1.9/32
set interfaces lo0 unit 0 family mpls ip
set interfaces lo0 unit 0 family isis point-to-point

set forwarding-options mpls ldp mode shared
set forwarding-options mpls traffic-eng tunnels
set forwarding-options mpls traffic-eng tunnel-destination 4.4.4.9
set forwarding-options mpls traffic-eng priority 1
set forwarding-options mpls traffic-eng bandwidth c0 20000

set interfaces tun0 unit 0 family inet unnumbered lo0.0
set interfaces tun0 unit 0 family mpls ip
set interfaces tun0 unit 0 family mpls traffic-eng tunnels
set interfaces tun0 unit 0 family mpls traffic-eng tunnel-id 1