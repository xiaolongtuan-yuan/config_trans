set system host-name DeviceA

set interfaces ae1 unit 0 family inet6 address 2001:DB8:1::1/64

set interfaces ge-3/0/0 ether-options 802.3ad ae1
set interfaces ge-3/0/1 ether-options 802.3ad ae1

set protocols bfd template AtoB minimum-interval 10
set protocols bfd template AtoB minimum-receive-interval 10

set interfaces ae1 unit 0 family inet6 bfd-liveness-detection minimum-interval 10
set interfaces ae1 unit 0 family inet6 bfd-liveness-detection minimum-receive-interval 10
set interfaces ae1 unit 0 family inet6 bfd-liveness-detection neighbor 2001:DB8:1::2
