set system host-name DeviceE

set protocols mpls interface lo0.0
set protocols mpls label-switched-path traffic-eng enable
set protocols ldp interface lo0.0
set protocols ldp transport-address 5.5.5.9
set protocols ldp router-id 5.5.5.9
set protocols traffic-engineering mpls

set protocols isis segment-routing mpls
set protocols segment-routing global-block 16000 23999

set protocols isis level 1
set protocols isis level 1 wide-metrics-only
set protocols isis level 1 traffic-engineering
set protocols isis interface lo0.0 family inet address 5.5.5.9/32
set protocols isis interface ge-1/0/0.0 family inet address 10.6.1.1/24
set protocols isis interface ge-2/0/0.0 family inet address 10.4.1.2/24
set protocols isis interface ge-3/0/0.0 family inet address 10.5.1.2/24
set protocols isis level 1 prefix-sid index 50 interface lo0.0
set protocols isis net 49.0000.0000.0000.0005.00


set interfaces lo0 unit 0 family inet address 5.5.5.9/32

set interfaces ge-1/0/0 unit 0 family inet address 10.6.1.1/24
set interfaces ge-1/0/0 unit 0 enable

set interfaces ge-2/0/0 unit 0 family inet address 10.4.1.2/24
set interfaces ge-2/0/0 unit 0 enable

set interfaces ge-3/0/0 unit 0 family inet address 10.5.1.2/24
set interfaces ge-3/0/0 unit 0 enable
