set system host-name DeviceA

set interfaces ge-0/0/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode trunk

set interfaces ge-0/0/0 unit 0 family inet address 0.0.0.0/32
set interfaces ge-0/0/0 unit 0 pppoe-options encapsulation ppp
set interfaces ge-0/0/0 unit 0 pppoe-options multilink
set interfaces ge-0/0/0 unit 0 pppoe-options multilink-group 1

set interfaces ge-0/0/0 unit 1 family inet address 0.0.0.0/32
set interfaces ge-0/0/0 unit 1 encapsulation ppp
set interfaces ge-0/0/0 unit 1 ppp multilink group 1

set interfaces ge-0/0/1 unit 1 family inet address 0.0.0.0/32
set interfaces ge-0/0/1 unit 1 encapsulation ppp
set interfaces ge-0/0/1 unit 1 ppp multilink group 1
