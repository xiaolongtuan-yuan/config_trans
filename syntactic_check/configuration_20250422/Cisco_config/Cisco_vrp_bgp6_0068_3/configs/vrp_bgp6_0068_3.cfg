hostname CE2

interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:db8:2::1/64

interface Loopback1
 ipv6 enable
 ipv6 address 2001:db8:6::6/128

router bgp 300
 bgp router-id 6.6.6.6
 neighbor 2001:db8:2::2 remote-as 200
 address-family ipv4 unicast
  no synchronization 
 exit-address-family
 address-family ipv6 unicast
  no synchronization 
  network 2001:db8:6::6/128
  neighbor 2001:db8:2::2 activate
 exit-address-family

end