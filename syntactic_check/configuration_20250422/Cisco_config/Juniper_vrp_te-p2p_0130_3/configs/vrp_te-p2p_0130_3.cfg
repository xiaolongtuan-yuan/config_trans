set system host-name PE2
set interfaces gigabit-ethernet1/0/0 unit 0 family inet address 10.2.1.2/29
set interfaces gigabit-ethernet2/0/0 unit 0 family inet address 10.5.1.2/29
set interfaces lo0 unit 0 family inet address 3.3.3.3/32
set tunnels ipv4 tunnel-tun2 mode mpls traffic-eng
set tunnels ipv4 tunnel-tun2 destination 4.4.4.4
set tunnels ipv4 tunnel-tun2 traffic-eng record-route
set tunnels ipv4 tunnel-tun2 traffic-eng backup-path ordinary-best-effort
set tunnels ipv4 tunnel-tun2 traffic-eng backup-path hot-standby
set tunnels ipv4 tunnel-tun2 traffic-eng tunnel-id 502
set routing-instances default instance-type vlan
set routing-instances default vrf-table-label yes
set protocols direct routed-host 10.0.0.3/32 next-hop 10.2.1.1
set routing-options static route 0.0.0.0/0 next-hop 10.5.1.1
set routing-instances default protocols bgp peer-group default
set interfaces lo0 unit 0 family inet echo-function bfd interval 100 min-rx 100 multiplier 3
set interfaces lo0 unit 0 family inet bfd-options address 3.3.3.3
set interfaces lo0 unit 0 family inet bfd-options address 4.4.4.4
set interfaces lo0 unit 0 family inet bfd-options disable-echo
