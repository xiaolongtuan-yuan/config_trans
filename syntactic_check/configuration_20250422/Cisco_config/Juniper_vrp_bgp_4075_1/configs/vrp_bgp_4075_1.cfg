set system host-name DeviceB

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 description "Active Interface"

set interfaces ge-2/0/0 unit 0 family inet address 10.1.4.1/24
set interfaces ge-2/0/0 description "Active Interface"

set interfaces ge-3/0/0 unit 0 family inet address 10.1.5.1/24
set interfaces ge-3/0/0 description "Active Interface"

set interfaces ge-1/0/1 unit 0 family inet address 10.1.2.1/24
set interfaces ge-1/0/1 description "Active Interface"

set routing-options autonomous-system 65010

set protocols bgp group internal type internal
set protocols bgp group internal local-address 2.2.2.2
set protocols bgp group internal neighbor 10.1.1.2
set protocols bgp group internal neighbor 10.1.2.2
set protocols bgp group internal neighbor 10.1.4.2
set protocols bgp group internal neighbor 10.1.5.2

set protocols bgp group internal neighbor 10.1.4.2 route-reflector-client
set protocols bgp group internal neighbor 10.1.5.2 route-reflector-client

set protocols bgp group internal family inet unicast
