#
sysname PE1
#
mpls lsr-id 1.1.1.1
#
mpls
mpls ldp
#
mpls l2vpn
#
interface GigabitEthernet1/0/2.100
 undo shutdown                                                   
 vlan-type dot1q 100                                                            
 mpls ccc out-interface GigabitEthernet1/0/1.100                                          
 mpls l2vc 2.2.2.2 100 secondary                                                
 mpls l2vpn redundancy master                                                   
#
interface GigabitEthernet1/0/1.100
 vlan-type dot1q 100                                                            
 mpls ccc out-interface GigabitEthernet1/0/2.100
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 192.168.1.1 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack1
 ip address 1.1.1.1 255.255.255.255
#
ospf 1                                                                                                            
 area 0.0.0.0                                                                   
  network 1.1.1.1 0.0.0.0                                                       
  network 192.168.1.1 0.0.0.255
#
return
