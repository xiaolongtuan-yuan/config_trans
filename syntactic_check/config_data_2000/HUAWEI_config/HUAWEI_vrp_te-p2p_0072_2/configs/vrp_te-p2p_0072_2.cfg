#
sysname P2
#
bfd
#
mpls lsr-id 3.3.3.3
#
mpls
 mpls te
 mpls rsvp-te
 mpls rsvp-te hello
 mpls te cspf
#
isis 1
 is-level level-2
 cost-style wide
 network-entity 86.4501.0030.0300.3003.00
 traffic-eng level-2
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.4.1.1 255.255.255.252
 isis enable 1  
 mpls
 mpls te
 mpls rsvp-te
 mpls rsvp-te hello
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 10.2.1.2 255.255.255.252
 isis enable 1
 mpls
 mpls te
 mpls rsvp-te
 mpls rsvp-te bfd enable
 mpls rsvp-te bfd min-tx-interval 100 min-rx-interval 100
 mpls rsvp-te hello
#
interface LoopBack1
 ip address 3.3.3.3 255.255.255.255
 isis enable 1
#
return
