#
sysname Device
#
vlan batch 2 to 4
#
vlan 4
 aggregate-vlan
 access-vlan 2 to 3
#
interface Vlanif4
 ipv6 enable
 ipv6 address 2001:DB8:300:400::5/64
 ipv6 nd proxy inter-access-vlan enable
#
interface GigabitEthernet1/0/1
 portswitch
 undo shutdown
 port link-type access
 port default vlan 2
#
interface GigabitEthernet1/0/2
 portswitch
 undo shutdown
 port link-type access
 port default vlan 2
#
interface GigabitEthernet2/0/1
 portswitch
 undo shutdown
 port link-type access
 port default vlan 3
#
interface GigabitEthernet2/0/2
 portswitch
 undo shutdown
 port link-type access
 port default vlan 3
#
return
