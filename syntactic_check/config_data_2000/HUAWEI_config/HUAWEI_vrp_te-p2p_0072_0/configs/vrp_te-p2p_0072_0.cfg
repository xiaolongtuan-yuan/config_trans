#
sysname PE1
#
mpls lsr-id 1.1.1.1
#
mpls
 mpls te
 mpls rsvp-te
 mpls rsvp-te hello
 mpls te cspf
#
explicit-path tope2
 next hop 10.1.1.2
 next hop 10.2.1.2
 next hop 10.4.1.2
 next hop 5.5.5.5
#
isis 1
 is-level level-2
 cost-style wide
 network-entity 86.4501.0010.0100.1001.00
 traffic-eng level-2
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.1.1.1 255.255.255.252
 isis enable 1
 mpls
 mpls te
 mpls rsvp-te
 mpls rsvp-te hello
#               
interface LoopBack1
 ip address 1.1.1.1 255.255.255.255
 isis enable 1  
#
interface Tunnel10
 ip address unnumbered interface LoopBack1
 tunnel-protocol mpls te
 destination 5.5.5.5
 mpls te record-route label
 mpls te fast-reroute
 mpls te tunnel-id 100
 mpls te path explicit-path tope2  
#
return
