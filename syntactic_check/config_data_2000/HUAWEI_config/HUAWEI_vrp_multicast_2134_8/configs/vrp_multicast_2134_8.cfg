#
 sysname CE-Bc
#
 multicast routing-enable
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.110.11.1 255.255.255.0 
 pim sm
 igmp enable
 igmp version 3
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 10.110.6.2 255.255.255.0 
 pim sm
#
rip 3
 network 10.0.0.0
 import-route direct
#
return
