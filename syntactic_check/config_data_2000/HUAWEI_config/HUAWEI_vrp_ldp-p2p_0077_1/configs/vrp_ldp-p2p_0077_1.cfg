#
sysname LSRB
#
mpls lsr-id 2.2.2.9
#
mpls
 lsp-trigger all
#
mpls ldp
 #              
 ipv4-family
#
isis 1          
 is-level level-2
 network-entity 10.0000.0000.0002.00
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.1.1.2 255.255.255.0
 isis enable 1
 mpls
 mpls ldp
#
interface GigabitEthernet1/0/1
 undo shutdown
 ip address 10.1.3.1 255.255.255.0
 isis enable 1
 mpls           
 mpls ldp
#
interface LoopBack0
 ip address 2.2.2.9 255.255.255.255
 isis enable 1
#
return
