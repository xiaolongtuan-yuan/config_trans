#
sysname NPE1
#
stp enable
#
stp region-configuration
 region-name RG1
#
mpls lsr-id 2.2.2.2
#
mpls
#
mpls l2vpn
#
vsi m1 static
 pwsignal ldp
  vsi-id 10
  peer 3.3.3.3
  peer 3.3.3.3 pw pw1
    stp enable
    stp cost 2
  peer 4.4.4.4
  peer 4.4.4.4 pw pw2
    stp enable
    stp cost 2
 admin-vsi
#
vsi s1 static
 pwsignal ldp
  vsi-id 100
  peer 1.1.1.1 upe
  peer 4.4.4.4 
 track admin-vsi m1
#
mpls ldp
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.6.1.1 255.255.255.0
 mpls
 mpls ldp
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 10.8.1.1 255.255.255.0
 mpls
 mpls ldp
#
interface GigabitEthernet3/0/0
 undo shutdown
 ip address 10.1.1.2 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack1
 ip address 2.2.2.2 255.255.255.255
#
ospf 1
 area 0.0.0.0
  network 2.2.2.2 0.0.0.0
  network 10.1.1.0 0.0.0.255
  network 10.6.1.0 0.0.0.255
  network 10.8.1.0 0.0.0.255
 #
return
