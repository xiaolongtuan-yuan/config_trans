#
 sysname UPE
#
 igmp-snooping enable
#
 mpls lsr-id 1.1.1.9
 mpls
#
 mpls l2vpn
#
 vsi ldp1 static
  pwsignal ldp
   vsi-id 1
   peer 2.2.2.9
#
 vsi ldp2 static
  pwsignal ldp
   vsi-id 2
   peer 2.2.2.9
  admin-vsi
   igmp-snooping enable
   igmp-snooping version 3
   igmp-snooping static-router-port remote-peer 2.2.2.9
#
 mpls ldp
#
 isis 1
  is-level level-2
  network-entity 49.0010.0100.1009.00
#
 interface GigabitEthernet1/0/1
 undo shutdown
#
 interface GigabitEthernet1/0/1.1
 encapsulation qinq-termination
 vlan-swap enable
 qinq termination l2 symmetry
 qinq termination pe-vid 7 ce-vid 1 to 1000
 l2 binding vsi ldp1
#
 interface GigabitEthernet1/0/1.2
 encapsulation qinq-termination
 vlan-swap enable
 qinq termination pe-vid 8 ce-vid 1 to 1000
 l2 binding vsi ldp2
#
 interface GigabitEthernet1/0/2
  undo shutdown
  ip address 10.1.1.1 255.255.255.252
  isis enable 1 
  mpls
  mpls ldp
#
 interface LoopBack1
  ip address 1.1.1.9 255.255.255.255
  isis enable 1
#
return
