#
 sysname PE2
#
 mpls lsr-id 192.168.1.3
 mpls
#
 mpls l2vpn
#
pw-template 3to1
 peer-address 192.168.1.2
 jitter-buffer depth 20
 tdm-encapsulation-number 40
#
mpls ldp
#
 mpls ldp remote-peer 192.168.1.2
 remote-ip 192.168.1.2
#
controller Cpos3/0/1
 undo shutdown
 aps group 1
 aps working
#
controller Cpos3/0/2
 undo shutdown
 aps group 1
 aps protect
 aps mode one-plus-one unidirection
#
interface cpos-trunk1
e1 1 unframed
e1 2 unframed
 Cpos3/0/1
 Cpos3/0/2
#
interface trunk-serial1/1:0
link-protocol tdm
mpls l2vc pw-template 3to1 100
undo shutdown
#
interface trunk-serial1/2:0
link-protocol tdm
mpls l2vc pw-template 3to1 200
undo shutdown
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 10.2.2.2 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack0
 ip address 192.168.1.3 255.255.255.255
#
ospf 1
 area 0.0.0.0
  network 192.168.1.3 0.0.0.0
  network 10.2.1.0 0.0.0.255
#
return
