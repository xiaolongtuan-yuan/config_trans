#
 sysname PE2
#
 mpls lsr-id 3.3.3.9
 mpls
#
 mpls l2vpn
#
vsi a2
 pwsignal ldp  
  vsi-id 2     
  peer 1.1.1.9 
# 
mpls ldp
#
 mpls ldp remote-peer 1.1.1.9
 remote-ip 1.1.1.9
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.20.1.2 255.255.255.0
 mpls
 mpls ldp
#
interface GigabitEthernet2/0/0.1
 undo shutdown
 vlan-type dot1q 10
 l2 binding vsi a2
#
interface LoopBack1
 ip address 3.3.3.9 255.255.255.255
#
ospf 1
 area 0.0.0.0
  network 3.3.3.9 0.0.0.0
  network 10.20.1.0 0.0.0.255
#
return
