# 
sysname ASBR2 
# 
mpls lsr-id 1.1.1.4 
# 
mpls 
# 
mpls ldp 
 mldp p2mp 
#
 mldp recursive-fec 
# 
 ipv4-family 
# 
isis 1 
 is-level level-2 
 cost-style wide 
 network-entity 10.0000.0000.000b.00 
# 
interface GigabitEthernet1/0/1
 undo shutdown 
 ip address 10.0.10.4 255.255.255.0 
 isis enable 1 
 mpls 
 mpls ldp 
# 
interface GigabitEthernet1/0/3
 undo shutdown 
 ip address 10.0.16.2 255.255.255.0 
 mpls 
 mpls ldp 
# 
interface LoopBack0 
 ip address 1.1.1.4 255.255.255.255 
 isis enable 1 
# 
interface NULL0 
# 
bgp 65535.65535 
 peer 10.0.16.1 as-number 1.0 
 peer 1.1.1.5 as-number 65535.65535 
 peer 1.1.1.5 connect-interface LoopBack0 
 
 ipv4-family unicast 
 undo synchronization 
 peer 10.0.16.1 enable 
 peer 1.1.1.5 enable 
 
 ipv6-family mvpn 
 undo policy vpn-target 
 peer 10.0.16.1 enable 
 peer 1.1.1.5 enable 
 
 ipv6-family vpnv6 
 undo policy vpn-target 
 peer 10.0.16.1 enable 
 peer 1.1.1.5 enable 
# 
ip route-static 1.1.1.3 255.255.255.255 10.0.16.1 
# 
return
