#
 sysname PE1
#
 mpls lsr-id 192.168.2.2
 mpls
#
 mpls l2vpn
#
pw-template 1to3
 peer-address 192.168.3.3
 atm-pack-overtime 1000
#
mpls ldp
#
 mpls ldp remote-peer 192.168.3.3
 remote-ip 192.168.3.3 
#
controller e1 2/0/1
using ce1
code ami
channel-set 1 timeslot-list 1-15
undo shutdown
#
interface serial2/0/1:1
link-protocol atm
ima ima-group 2/0/1
undo shutdown
#
controller e1 2/0/2
using ce1
code ami
channel-set 1 timeslot-list 16-30
undo shutdown
#
interface serial2/0/2:1
link-protocol atm
ima ima-group 2/0/1
undo shutdown
#
interface ima-group 2/0/1
 undo shutdown
#
interface ima-group 2/0/1.1
 pvc 1/100
 pvc 1/200
 pvc 1/300
 pvc 1/400
 mpls l2vc pw-template 1to3 100
 undo shutdown
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.1.1.1 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack0
 ip address 192.168.2.2 255.255.255.255
#
ospf 1
area 0.0.0.0
  network 192.168.2.2 0.0.0.0
  network 10.1.1.0 0.0.0.255
#
return
