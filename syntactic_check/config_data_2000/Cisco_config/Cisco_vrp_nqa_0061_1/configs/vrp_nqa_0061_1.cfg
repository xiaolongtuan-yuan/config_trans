hostname DeviceC

interface GigabitEthernet1/0/1
 no shutdown
!

interface GigabitEthernet1/0/1.1
 ip address 10.1.3.1 255.255.255.255
!

interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.2.2 255.255.255.0
!

ip access-list extended TEST-FLOW
 permit ip host 10.1.1.1 host 10.1.3.2
!

class-map match-all TEST-FLOW
 match access-group name TEST-FLOW
!

policy-map TEST-POLICY
 class TEST-FLOW
  police cir 10000000 conform-action transmit exceed-action drop
!

interface GigabitEthernet1/0/1.1
 service-policy input TEST-POLICY
!

ip sla 1
 icmp-echo 10.1.3.2 source-ip 10.1.3.1
 timeout 1000
 frequency 5

ip sla schedule 1 life forever start-time now