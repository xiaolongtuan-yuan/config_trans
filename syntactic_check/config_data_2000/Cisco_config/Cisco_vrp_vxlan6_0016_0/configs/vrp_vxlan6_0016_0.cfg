hostname Device1
!
ipv6 unicast-routing
!
router ospfv3 1
 router-id 1.1.1.1
 area 0
!
interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8:3::2/64
 ospfv3 1 ipv6 area 0
!
interface GigabitEthernet1/0/1
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8:2::2/64
 ospfv3 1 ipv6 area 0
!
interface Loopback0
 ipv6 enable
 ipv6 address 2001:DB8:11::1/128
 ospfv3 1 ipv6 area 0
!
router bgp 100
 neighbor 2001:DB8:22::2 remote-as 100
 neighbor 2001:DB8:22::2 update-source Loopback0
 neighbor 2001:DB8:33::3 remote-as 100
 neighbor 2001:DB8:33::3 update-source Loopback0
!
end