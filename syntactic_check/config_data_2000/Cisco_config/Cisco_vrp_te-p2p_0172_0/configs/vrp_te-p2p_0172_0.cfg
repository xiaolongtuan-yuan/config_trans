hostname LSRA
#
mpls label protocol ldp
mpls ldp router-id Loopback0
mpls ldp session protection
mpls traffic-eng tunnels
mpls traffic-eng router-id Loopback0
mpls traffic-eng area 0
mpls traffic-eng level-1
mpls traffic-eng level-2
mpls traffic-eng autoroute announce
mpls traffic-eng auto-bw
mpls traffic-eng auto-tunnel bandwidth 1000 1000
mpls traffic-eng backup-path tunnel 2
mpls traffic-eng logging bandwidth-changes
mpls traffic-eng logging fast-reroute
mpls traffic-eng logging status
mpls traffic-eng logging state-changes
mpls traffic-eng logging link-status
mpls traffic-eng logging priority-changes
mpls traffic-eng logging all-changes
mpls traffic-eng logging all
mpls traffic-eng logging debug
mpls traffic-eng logging log-packets
#
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.1.1.1 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 mpls traffic-eng tunnel-id 1
 mpls traffic-eng affinity 1
 mpls traffic-eng bandwidth 1000
 mpls traffic-eng fast-reroute
 mpls traffic-eng path-option 1 explicit name EXP1
 mpls traffic-eng autoroute announce
 mpls traffic-eng backup-path tunnel 2
 mpls traffic-eng record-route
 mpls traffic-eng cspf
#
interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.1.2.1 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 mpls traffic-eng tunnel-id 2
 mpls traffic-eng affinity 2
 mpls traffic-eng bandwidth 1000
 mpls traffic-eng fast-reroute
 mpls traffic-eng path-option 1 explicit name EXP2
 mpls traffic-eng autoroute announce
 mpls traffic-eng backup-path tunnel 1
 mpls traffic-eng record-route
 mpls traffic-eng cspf
#
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
#
interface Tunnel1
 ip unnumbered Loopback0
 tunnel mode mpls traffic-eng
 tunnel destination 6.6.6.6
 tunnel mpls traffic-eng record-route
 tunnel mpls traffic-eng backup hot-standby
 tunnel mpls traffic-eng tunnel-id 1
 tunnel mpls traffic-eng cspf disjoint
#
router ospf 1
 mpls traffic-eng area 0
 network 1.1.1.1 0.0.0.0 area 0
 network 10.1.1.0 0.0.0.255 area 0
 network 10.1.2.0 0.0.0.255 area 0
 mpls traffic-eng router-id Loopback0
#
end