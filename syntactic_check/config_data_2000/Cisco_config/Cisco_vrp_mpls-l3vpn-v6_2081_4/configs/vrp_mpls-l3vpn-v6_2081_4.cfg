hostname MCE
!
ipv6 unicast-routing
!
vrf definition VPNA
 rd 100:1
!
vrf definition VPNB
 rd 200:2
!
interface GigabitEthernet1/0/0
 no shutdown
 vrf forwarding VPNA
 ipv6 address 2001:DB8:8::2/64
 ospfv3 1 area 0
!
interface GigabitEthernet2/0/0
 no shutdown
 vrf forwarding VPNB
 ipv6 address 2001:DB8:9::2/64
 ospfv3 2 area 0
!
interface GigabitEthernet3/0/0
 no shutdown
 vrf forwarding VPNA
 ipv6 address 2001:DB8:3::2/64
!
interface GigabitEthernet4/0/0
 no shutdown
 vrf forwarding VPNB
 ipv6 address 2001:DB8:4::2/64
!
router ospfv3 1
 router-id 7.7.7.7
!
router ospfv3 2
 router-id 8.8.8.8
!
end