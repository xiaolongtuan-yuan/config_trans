hostname MCE

ip vrf vpna
 rd 100:1
 route-target export 100:1
 route-target import 100:1

ip vrf vpnb
 rd 200:2
 route-target export 200:2
 route-target import 200:2

router ospfv3 100 vrf vpna
 router-id 7.7.7.7
 capability vrf-lite
 redistribute ripng process 100
 area 0.0.0.1

router ospfv3 200 vrf vpnb
 router-id 8.8.8.8
 capability vrf-lite
 redistribute ripng process 200
 area 0.0.0.2

interface GigabitEthernet1/0/0
 no shutdown
 vrf forwarding vpna
 ipv6 enable
 ipv6 address 2001:db8:8::2/64
 ospfv3 100 area 0.0.0.1 instance 1

interface GigabitEthernet2/0/0
 no shutdown
 vrf forwarding vpnb
 ipv6 enable
 ipv6 address 2001:db8:9::2/64
 ospfv3 200 area 0.0.0.2 instance 2

interface GigabitEthernet3/0/0
 no shutdown
 vrf forwarding vpna
 ipv6 enable
 ipv6 address 2001:db8:3::2/64
 ripng enable

interface GigabitEthernet4/0/0
 no shutdown
 vrf forwarding vpnb
 ipv6 enable
 ipv6 address 2001:db8:4::2/64
 ripng enable

router ripng 100 vrf vpna
 redistribute ospfv3 100

router ripng 200 vrf vpnb
 redistribute ospfv3 200

