hostname SFF2
!
ipv6 unicast-routing
!
interface GigabitEthernet1/0/0
 no shutdown
 ipv6 address 2001:db8:2::2/96
 ospfv3 1 ipv6 area 0
!
interface GigabitEthernet2/0/0
 no shutdown
 ipv6 address 2001:db8:3::1/96
 ospfv3 1 ipv6 area 0
!
interface Loopback1
 ipv6 address 3::3/128
 ospfv3 1 ipv6 area 0
!
router ospfv3 1
 router-id 3::3
!
end