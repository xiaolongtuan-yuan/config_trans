hostname ASBR2

mpls ldp router-id Loopback1      

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.162.1.1 255.255.255.0
 mpls ip                        
 mpls ldp                       

interface GigabitEthernet2/0/0
 no shutdown
 ip address 192.168.1.2 255.255.255.0
 mpls ip
 mpls ldp

interface Loopback1
 ip address 3.3.3.9 255.255.255.255

router bgp 200
 neighbor 192.168.1.1 remote-as 100
 !
 address-family ipv4 labeled-unicast  
  neighbor 192.168.1.1 activate
  neighbor 192.168.1.1 send-label     
  neighbor 192.168.1.1 route-map policy1 out
  network 4.4.4.9 mask 255.255.255.255
 exit-address-family

router ospf 1
 redistribute bgp 200 subnets
 network 3.3.3.9 0.0.0.0 area 0
 network 10.162.1.0 0.0.0.255 area 0

route-map policy1 permit 10
 set mpls-label 