hostname CE-Bc

ip multicast-routing

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.110.11.1 255.255.255.0
 ip pim sparse-mode
 ip igmp version 3

interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.110.6.2 255.255.255.0
 ip pim sparse-mode

router rip
 version 2
 network 10.0.0.0
 redistribute connected

end