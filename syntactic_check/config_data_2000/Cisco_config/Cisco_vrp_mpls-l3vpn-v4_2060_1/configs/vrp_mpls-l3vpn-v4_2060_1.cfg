hostname PE3
!
vrf definition vpn1
 rd 100:1
 route-target export 1:1
 route-target import 1:1
!
mpls ldp router-id Loopback1
!
interface GigabitEthernet1/0/0
 no shutdown
 vrf forwarding vpn1
 ip address 172.16.1.2 255.255.255.0
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 40.1.1.1 255.255.255.0
 mpls ip
 mpls ldp autoconfig
!
interface Loopback1
 ip address 1.1.1.9 255.255.255.255
!
router bgp 200
 neighbor 6.6.6.9 remote-as 300
 neighbor 6.6.6.9 ebgp-multihop 10
 neighbor 6.6.6.9 update-source Loopback1
 !
 address-family vpnv4
  neighbor 6.6.6.9 activate
  neighbor 6.6.6.9 send-community both
 exit-address-family
!
router ospf 1
 network 1.1.1.9 0.0.0.0 area 0
 network 40.1.1.0 0.0.0.255 area 0
!
end