hostname NPE1
!
spanning-tree mode rapid-pvst
spanning-tree vlan 1-4094 priority 32768
!
mpls ldp router-id Loopback1
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.6.1.1 255.255.255.0
 mpls ip
 xconnect 3.3.3.3 100 encapsulation mpls
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.8.1.1 255.255.255.0
 mpls ip
 xconnect 4.4.4.4 200 encapsulation mpls
!
interface GigabitEthernet3/0/0
 no shutdown
 ip address 10.1.1.2 255.255.255.0
 mpls ip
 xconnect 1.1.1.1 300 encapsulation mpls
 xconnect 4.4.4.4 400 encapsulation mpls
!
interface Loopback1
 ip address 2.2.2.2 255.255.255.255
!
router ospf 1
 network 2.2.2.2 0.0.0.0 area 0
 network 10.1.1.0 0.0.0.255 area 0
 network 10.6.1.0 0.0.0.255 area 0
 network 10.8.1.0 0.0.0.255 area 0
!
end