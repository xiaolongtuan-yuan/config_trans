hostname PPPoE-Server
!
ip multicast-routing
!
interface GigabitEthernet1/0/0
 no shutdown
 ip pim sparse-mode
!
interface GigabitEthernet2/0/0
 no shutdown
 ip igmp join-group 239.0.0.1
!
interface Virtual-Template1
 ip unnumbered GigabitEthernet2/0/0
 peer default ip address pool PPPOE_POOL
 ppp authentication chap
!
ip dhcp excluded-address 192.168.1.2 192.168.1.200
!
ip dhcp pool POOL1
 network 192.168.1.0 255.255.255.0
 default-router 192.168.1.1 
 dns-server 192.168.7.252
!
aaa authentication ppp default local
!
ip pim ssm default
ip access-list standard MULTICAST_FILTER
 permit 239.0.0.1
!
radius-server host <radius server IP> auth-port 1812 acct-port 1813
radius-server key <shared secret>