hostname ASBR1

mpls ldp router-id Loopback0 force
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.0.7.5 255.255.255.0
 mpls ip
 mpls ldp igp autoconfig
!
interface GigabitEthernet1/0/4
 no shutdown
 ip address 10.0.2.5 255.255.255.0
 mpls ip
 mpls ldp igp autoconfig
!
interface Loopback0
 ip address 1.1.1.2 255.255.255.255
!
router bgp 100
 neighbor 10.0.7.7 remote-as 200
 neighbor 1.1.1.1 remote-as 100
 neighbor 1.1.1.1 update-source Loopback0
 !
 address-family ipv4
  neighbor 10.0.7.7 activate
  neighbor 1.1.1.1 activate
  no auto-summary
 exit-address-family
 !
 address-family vpnv6
  neighbor 10.0.7.7 activate
  neighbor 1.1.1.1 activate
  neighbor 10.0.7.7 send-community extended
  neighbor 1.1.1.1 send-community extended
 exit-address-family
!
router ospf 1
 router-id 1.1.1.2
 network 10.0.2.0 0.0.0.255 area 0
 network 1.1.1.2 0.0.0.0 area 0
!
ip route 1.1.1.3 255.255.255.255 GigabitEthernet1/0/2 10.0.7.7
!
end