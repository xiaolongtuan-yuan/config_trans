hostname DeviceA
!
aaa new-model
aaa authentication ppp default group radius
aaa authorization network default group radius 
aaa accounting network default start-stop group radius
!
radius-server host 10.20.20.1 auth-port 1812 acct-port 1813 key 7 <shared-key>
!
interface GigabitEthernet2/0/0.100
 encapsulation dot1Q 100
!
vpdn enable
vpdn-group L2TP_GROUP
 accept-dialin
  protocol l2tp
  virtual-template 1
 !
 l2tp tunnel password 7 <tunnel-password>
!
end