hostname PE

vrf definition vpna 
rd 100:1 
address-family ipv4
route-target export 111:1 
route-target import 111:1
exit-address-family

vrf definition vpnb
rd 100:2
address-family ipv4
route-target export 222:2
route-target import 222:2
exit-address-family

ip access-list extended VTY-ACCESS 
permit ip 10.1.1.0 0.0.0.255 any 
deny ip 10.2.1.0 0.0.0.255 any 

interface GigabitEthernet1/0/0
no shutdown
vrf forwarding vpna 
ip address 10.1.1.1 255.255.255.0

interface GigabitEthernet2/0/0
no shutdown
vrf forwarding vpnb
ip address 10.2.1.1 255.255.255.0

line con 0
line vty 0 4
access-class VTY-ACCESS in 
login local
privilege level 15
password 7 094F47131E0A1218000C 
transport input ssh
line vty 16 20