hostname PE2
!
mpls ip
!
mpls ldp router-id Loopback0
!
interface GigabitEthernet1/0/1.1
 encapsulation dot1q 1
 xconnect 1.1.1.1 1001 encapsulation mpls
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 192.168.1.2 255.255.255.0
 mpls ip
 mpls ldp autoconfig
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.0
!
router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 192.168.1.0 0.0.0.255 area 0
!
cfm md md1
 ma ma1
  mep mep-id 2 interface GigabitEthernet1/0/1.1
  mep ccm-send mep-id 2
  remote-mep mep-id 1
  remote-mep ccm-receive mep-id 1
  test-id 1 mep 2
  delay-measure two-way receive test-id 1
  test-id 2 mep 2 remote-mep 1
  delay-measure two-way continual send test-id 2 interval 30000
!
