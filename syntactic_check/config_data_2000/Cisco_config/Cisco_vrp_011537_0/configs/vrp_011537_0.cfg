hostname CE1

vlan batch 2

ethernet cfm
  md md1
    ma ma2
      mep mep-id 3
        interface GigabitEthernet1/0/1
        ccm-send interval 10
        ccm-send enable
      mep mep-id 4
        interface GigabitEthernet1/0/1
        ccm-receive enable
      mep mep-id 3
        remote-mep mep-id 4
        ccm-receive enable
        loss-measure dual-ended
          test-id 2
          test-duration 0
          continuity-check interval 1
          continuity-check enable

interface GigabitEthernet1/0/1
 no shutdown
 switchport access vlan 2

end