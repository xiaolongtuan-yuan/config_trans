hostname MasterB
!
vrf definition virtual-cluster-access
 rd 65534:1
 !
 address-family ipv4
 exit-address-family
!
bfd interval 50 min_rx 50 multiplier 3
!
interface GigabitEthernet1/0/1
 no shutdown
 vrf forwarding virtual-cluster-access
 ip address 10.2.4.2 255.255.255.252
 mpls ip
 ip router isis 
 isis circuit-type level-2
 isis metric 10
!
interface GigabitEthernet1/0/2
 no shutdown
 vrf forwarding virtual-cluster-access
 ip address 10.3.4.2 255.255.255.252
 mpls ip
 ip router isis 
 isis circuit-type level-2
 isis metric 10
!
interface Loopback0
 ip address 4.4.4.4 255.255.255.255
 ip router isis
 isis circuit-type level-2
!
interface GigabitEthernet1/0/3
 no shutdown
 ip address 192.168.0.3 255.255.255.0
!
interface GigabitEthernet1/0/3.1
 encapsulation dot1Q 1
 ip address 1.1.1.1 255.255.255.252
!
interface GigabitEthernet1/0/3.2
 encapsulation dot1Q 2
 ip address 2.2.2.2 255.255.255.252
!
router isis
 net 49.0000.0000.0000.0000.00.00
 is-type level-1
 metric-style wide
 nsf ietf
 log-adjacency-changes
!
end