hostname netconf-agent
!

ip domain-name cisco-lab.com
crypto key generate rsa modulus 2048 
!
aaa new-model
username client001 secret 9 $9$H4sIAAAAAAAAAAAAAADUVmZqZma= 
!
interface GigabitEthernet0/0/0
 no shutdown
 ip address 10.1.1.1 255.255.255.255
!

ip ssh server algorithm version 2  
ip ssh server v2                  
!

netconf ssh port 830              
!
line vty 0 4
 login local
 transport input ssh netconf-ssh  
!
end