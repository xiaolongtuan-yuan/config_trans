hostname LSRA
!
bfd
!
mpls lsr-id 1.1.1.9
!
mpls
 mpls bfd enable
 mpls bfd-trigger-tunnel fec-list list1
!
fec-list list1
 fec-node 4.4.4.9
!
mpls ldp
 !
 ipv4-family
!
router isis
 isis router-id 10.0000.0000.0001.00
 isis network point-to-point
 isis metric-style wide
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.1.1.1 255.255.255.0
 mpls ip
!
interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.1.2.1 255.255.255.0
 mpls ip
!
interface Loopback0
 ip address 1.1.1.9 255.255.255.255
 isis enable
!
end