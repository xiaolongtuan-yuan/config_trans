hostname P2
!
router isis
 net 49.0000.0000.0000.0002.00
 is-type level-2  
 metric-style wide
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.1.1.2 255.255.255.252
 ip router isis  
 isis circuit-type level-2-only  
 mpls ip
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
 ip router isis
!
end