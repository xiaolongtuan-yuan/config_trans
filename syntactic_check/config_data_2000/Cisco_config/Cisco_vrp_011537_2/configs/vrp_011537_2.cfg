sysname PE2

cfm version standard
cfm enable

mpls lsr-id 1.1.1.1
mpls

mpls l2vpn

vsi ldp1 static
 pwsignal ldp
  vsi-id 1
  peer 2.2.2.2

mpls ldp

interface GigabitEthernet1/0/1.1
 vlan-type dot1q 2
 l2 binding vsi ldp1

interface GigabitEthernet1/0/2
 undo shutdown
 ip address 10.1.1.2 255.255.255.0
 mpls
 mpls ldp

interface LoopBack0
 ip address 1.1.1.1 255.255.255.0

ospf 1
 area 0.0.0.0
  network 1.1.1.1 0.0.0.0
  network 10.1.1.0 0.0.0.255

cfm md md1
 ma ma1
  map vsi ldp1
   mep mep-id 2 interface GigabitEthernet1/0/1.1 inward
   mep ccm-send mep-id 2 enable
   remote-mep mep-id 1
   remote-mep ccm-receive mep-id 1 enable
   test-id 1 mep 2 remote-mep 1 peer-ip 2.2.2.2
   loss-measure dual-ended continual test-id 1

return
hostname PE2

mpls ip

mpls ldp router-id Loopback0 force

mpls l2vpn

vfi ldp1 manual
 vpn id 1
 neighbor 2.2.2.2 pw-id 1

interface GigabitEthernet1/0/1.1
 encapsulation dot1Q 2
 xconnect vfi ldp1

interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.1.2 255.255.255.0
 mpls ip

interface Loopback0
 ip address 1.1.1.1 255.255.255.0

router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.1.1.0 0.0.0.255 area 0

cfm domain md1
 service ma1
  mep 2
   mep interface GigabitEthernet1/0/1.1
   mep ccm-send interval 3
   mep ccm-send enable
   remote-mep 1
   remote-mep ccm-receive enable
   continuity-check interval 3 mep 2 remote-mep 1 peer-ip 2.2.2.2
   loss-measurement dual-ended test-id 1

end
