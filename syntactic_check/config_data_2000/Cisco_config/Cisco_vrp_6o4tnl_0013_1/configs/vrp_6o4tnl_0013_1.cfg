hostname DeviceA

interface GigabitEthernet1/0/1
no shutdown
ip address 10.1.1.1 255.255.255.0

interface GigabitEthernet1/0/2
no shutdown
ipv6 enable
ipv6 address 2001:DB8:101:101::1/64

interface Tunnel1
ipv6 enable
ipv6 address 2001:DB8:101:100::1/56
tunnel source GigabitEthernet1/0/1
tunnel destination 203.0.113.5
tunnel mode ipsec ipv4 
tunnel protection ipsec profile VPN_PROFILE 

ipv6 route 2001:DB8::/32 Tunnel1

crypto ikev2 profile VPN_IKE_PROFILE
match identity remote address 203.0.113.5 255.255.255.255
authentication remote pre-share
authentication local pre-share
keyring VPN_KEYRING

crypto ipsec profile VPN_PROFILE
set ikev2-profile VPN_IKE_PROFILE

end