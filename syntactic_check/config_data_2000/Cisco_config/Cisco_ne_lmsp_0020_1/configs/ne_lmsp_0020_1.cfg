hostname PE2
!
mpls label protocol ldp
!
mpls l2vpn
!
pseudowire-class 3to1
 encapsulation mpls
!
interface Cpos3/0/1
 no shutdown
 aps group 1
!
interface Cpos3/0/2
 no shutdown
 aps group 1
 aps protect
 aps mode 1+1 unidirectional
!
interface cpos-trunk1
 no ip address
!
interface trunk-serial1/1:0
 encapsulation mpls
 xconnect 192.168.1.2 100 pw-class 3to1
 no shutdown
!
interface trunk-serial1/2:0
 encapsulation mpls
 xconnect 192.168.1.2 200 pw-class 3to1
 no shutdown
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.2.2.2 255.255.255.0
 mpls ip
!
interface Loopback0
 ip address 192.168.1.3 255.255.255.255
!
router ospf 1
 network 192.168.1.3 0.0.0.0 area 0
 network 10.2.1.0 0.0.0.255 area 0
!