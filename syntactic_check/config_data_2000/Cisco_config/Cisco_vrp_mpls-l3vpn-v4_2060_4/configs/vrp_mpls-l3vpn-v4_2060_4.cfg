hostname PE2

vrf definition vpn1
 rd 200:2
 !
 address-family ipv4
  route-target export 1:1
  route-target import 1:1
 exit-address-family
!
mpls ldp router-id Loopback1
!
router isis
 net 10.0000.0000.0005.00
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 30.1.1.2 255.255.255.0
 mpls ip
 mpls ldp discovery transport-address interface
!
interface GigabitEthernet2/0/0
 no shutdown
 vrf forwarding vpn1
 ip address 21.1.1.1 255.255.255.0
 mpls ip
 mpls ldp discovery transport-address interface
!
interface Loopback1
 ip address 4.4.4.9 255.255.255.255
!
router bgp 100
 neighbor 3.3.3.9 remote-as 100
 neighbor 3.3.3.9 update-source Loopback1
 !
 address-family ipv4
  neighbor 3.3.3.9 activate
  no synchronization
 exit-address-family
 !
 address-family vpnv4
  neighbor 3.3.3.9 activate
  neighbor 3.3.3.9 send-community both
 exit-address-family
!
router ospf 1 vrf vpn1
 network 4.4.4.9 0.0.0.0 area 0
 network 21.1.1.0 0.0.0.255 area 0
!
end