hostname DeviceC

vlan 10,20,100-200,300-400

spanning-tree region vlan 10 100-200

spanning-tree region vlan 20 300-400

erps ring 1

control-vlan 10

protected-instance 1

wtr-timer 6

guard-timer 100

erps ring 2

control-vlan 20

protected-instance 2

wtr-timer 6

guard-timer 100

interface GigabitEthernet1/0/1

switchport mode trunk

no shutdown

switchport trunk allowed vlan 10,20,100-200,300-400

spanning-tree disable

erps ring 1

erps ring 2

interface GigabitEthernet1/0/2

switchport mode trunk

no shutdown

switchport trunk allowed vlan 10,20,100-200,300-400

spanning-tree disable

erps ring 1

erps ring 2

end