hostname DeviceC
!

vlan 10,20,100-200,300-400
!

spanning-tree mst configuration
 instance 1 vlan 10,100-200
 instance 2 vlan 20,300-400
!

interface range GigabitEthernet1/0/1 - 2
 switchport mode trunk
 no shutdown
 switchport trunk allowed vlan 10,20,100-200,300-400
!

interface GigabitEthernet1/0/1
 spanning-tree portfast trunk
 switchport backup interface GigabitEthernet1/0/2
!
interface GigabitEthernet1/0/2
 spanning-tree portfast trunk
!

spanning-tree extend system-id
spanning-tree uplinkfast
spanning-tree backbonefast
!

spanning-tree mst 1-2 priority 4096
spanning-tree mst hello-time 2
spanning-tree mst max-age 20
spanning-tree mst forward-time 15
end