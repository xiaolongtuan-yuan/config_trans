hostname LSRC
!
mpls ldp router-id Loopback0 force
!
router isis
 net 10.0010.0300.0002.00
 is-type level-1
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.1.3.2 255.255.255.0
 isis network point-to-point
 mpls ip
!
interface Loopback0
 ip address 10.10.3.2 255.255.255.255
 isis network point-to-point
!
end