hostname NPE
!
vrf definition vpn1
 rd 100:1
 !
 address-family ipv6
  route-target export 1:1
  route-target import 1:1
 exit-address-family
!
mpls ldp router-id Loopback0
!
mpls ip
!
router isis
 net 10.0000.0000.0003.00
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.2.1.2 255.255.255.0
 ip router isis 1
 mpls ip
 mpls ldp autoconfig
!
interface GigabitEthernet2/0/0
 no shutdown
 vrf forwarding vpn1
 ipv6 address 2001:DB8:30::1/64
 ipv6 enable
!
interface Loopback1
 ip address 3.3.3.3 255.255.255.255
 ip router isis 1
!
router bgp 100
 neighbor 2.2.2.2 remote-as 100
 neighbor 2.2.2.2 update-source Loopback1
 !
 address-family ipv4
  neighbor 2.2.2.2 activate
  no auto-summary
 exit-address-family
 !
 address-family vpnv6
  neighbor 2.2.2.2 activate
  neighbor 2.2.2.2 route-map vpn-target in
 exit-address-family
!
ipv6 prefix-list default seq 10 permit ::/0
!
route-map vpn-target permit 10
 set extcommunity rt 1:1 additive
!
end