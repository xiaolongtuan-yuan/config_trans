hostname CPE


feature bgp
feature nv overlay


router bgp 100
  router-id 4.4.4.4
  neighbor 3.3.3.3 
    remote-as 100
    update-source loopback1
    address-family l2vpn evpn
      send-community extended


interface nve1
  no shutdown
  source-interface loopback1
  host-reachability protocol bgp


interface loopback1
  ip address 4.4.4.4/32
  no shutdown


interface Ethernet1/0/3
  no shutdown
  switchport mode trunk