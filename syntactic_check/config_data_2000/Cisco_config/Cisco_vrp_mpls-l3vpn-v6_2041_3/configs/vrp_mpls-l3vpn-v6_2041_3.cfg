hostname PE2
!
vrf definition vpna
 rd 100:1
 !
 address-family ipv4
  route-target export 1:1
  route-target import 1:1
 exit-address-family
!
mpls ldp router-id Loopback1
!
mpls ip
!
interface GigabitEthernet1/0/0
 no shutdown
 vrf forwarding vpna
 ipv6 address 2001:db8:2::2/64
 ipv6 enable
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 30.1.1.2 255.255.255.0
 mpls ip
 mpls ldp autoconfig
!
interface Loopback1
 ip address 3.3.3.9 255.255.255.255
!
router bgp 100
 neighbor 1.1.1.9 remote-as 100
 neighbor 1.1.1.9 update-source Loopback1
 !
 address-family vpnv4
  neighbor 1.1.1.9 activate
 exit-address-family
 !
 address-family ipv6 vrf vpna
  neighbor 2001:db8:2::1 remote-as 65410
  neighbor 2001:db8:2::1 route-map DIRECT_IMPORT in
 exit-address-family
!
router ospf 1
 router-id 3.3.3.9
 network 3.3.3.9 0.0.0.0 area 0
 network 30.1.1.0 0.0.0.255 area 0
!
end