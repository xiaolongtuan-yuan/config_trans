hostname PE1

vrf definition vpna
 rd 100:1
 !
 address-family ipv4
  route-target export 111:1
  route-target import 111:1
 exit-address-family
 !!
 address-family ipv6
  route-target export 111:1
  route-target import 111:1
 exit-address-family
!!

interface GigabitEthernet1/0/0
 no shutdown
 vrf forwarding vpna
 ipv6 enable
 ipv6 address 2001:db8:1::2/64
!!

interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.2.1.1 255.255.255.0
!!

router bgp 200
 neighbor 10.2.1.2 remote-as 200
 neighbor 10.2.1.2 update-source GigabitEthernet2/0/0
 !
 address-family ipv6
  neighbor 10.2.1.2 activate
  no synchronization
 exit-address-family
 !
 address-family vpnv4
  neighbor 10.2.1.2 activate
  neighbor 10.2.1.2 send-community extended
 exit-address-family
!!

vrf definition vpnv6
 rd 100:1
 !
 address-family ipv6
  route-target export 111:1
  route-target import 111:1
 exit-address-family
!!