hostname DeviceB

interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:db8:101::2/96

interface GigabitEthernet2/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:db8:100::2/96

router bgp 200
 bgp router-id 2.2.2.2
 neighbor 2001:db8:100::1 remote-as 100
 neighbor 2001:db8:101::1 remote-as 200

 address-family ipv6
  no synchronization
  neighbor 2001:db8:100::1 activate
  neighbor 2001:db8:101::1 activate
  neighbor 2001:db8:101::1 next-hop-self

end