hostname DeviceA


controller T3 3/0/0
 framing c-bit
 channel-group 1 timeslots 1-15
 channel-group 2 timeslots 16-31



interface GigabitEthernet3/0/1
 ip address 10.1.1.1 255.255.255.0



interface Serial3/0/0/1:1
 encapsulation ppp
 ppp multilink
 ppp multilink group 1

interface Serial3/0/0/2:1
 encapsulation ppp
 ppp multilink
 ppp multilink group 1


