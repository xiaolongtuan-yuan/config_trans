hostname PE1
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 172.16.1.1 255.255.255.0
!
interface Loopback1
 ip address 1.1.1.9 255.255.255.255
!
router isis
 net 10.0000.0000.0001.00
 is-type level-1
 segment-routing mpls
!
router bgp 100
 neighbor 3.3.3.9 remote-as 100
 neighbor 3.3.3.9 update-source Loopback1
 !
 address-family ipv4 unicast
  no synchronization
  neighbor 3.3.3.9 activate
  neighbor 3.3.3.9 next-hop-self
  redistribute connected
!
mpls ldp router-id Loopback1
!
mpls
!
mpls segment-routing
 tunnel-preference segment-routing
!
tunnel-interface sr-lsp1
 destination 10.0.0.0
 tunnel-policy p1
!
tunnel-policy p1
 tunnel select-seq sr-lsp load-balance-number 1
!
end