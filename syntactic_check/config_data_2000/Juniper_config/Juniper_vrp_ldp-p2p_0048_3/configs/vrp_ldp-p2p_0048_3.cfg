set system host-name DSLAM

set routing-options router-id 4.4.4.9
set protocols mpls interface ge-1/0/1.0
set protocols ldp interface ge-1/0/1.0

set interfaces ge-1/0/1 unit 0 family inet address 10.1.3.2/24
set interfaces ge-1/0/1 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 4.4.4.9/32

set protocols ospf area 0 interface ge-1/0/1.0
set protocols ospf area 0 interface lo0.0 passive

set routing-options static route 4.4.4.9/32 next-hop 10.1.3.2