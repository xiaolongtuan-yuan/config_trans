set system host-name DeviceC

set protocols isis level 1
set protocols isis network-entity 10.0000.0000.0003.00
set protocols isis ipv6 enable
set protocols isis ipv6 topology ipv6

set protocols ospfv3 1 router-id 1.1.1.1
set protocols ospfv3 1 area 0.0.0.0
set protocols ospfv3 1 area 0.0.0.2

set interfaces ge-0/0/0 unit 0 family inet6 address 2001:db8:20::1/64
set interfaces ge-0/0/0 unit 0 family inet6 isis enable

set interfaces ge-0/0/1 unit 0 family inet6 address 2001:db8:201::1/64
set interfaces ge-0/0/1 unit 0 family inet6 ospfv3 1 area 0.0.0.2

set interfaces ge-0/0/2 unit 0 family inet6 address 2001:db8:101::1/64
set interfaces ge-0/0/2 unit 0 family inet6 isis enable