set system host-name RSG

set routing-instances a instance-type virtual-router
set routing-instances a route-distinguisher 1:1
set routing-instances a interface ge-0/0/5

set interfaces ge-0/0/5 unit 0 description "VRF_A_Interface"
set interfaces ge-0/0/5 unit 0 family inet address 10.20.0.2/30

set protocols mpls interface ge-0/0/2.0
set protocols mpls interface ge-0/0/4.0
set protocols ldp interface ge-0/0/2.0
set protocols ldp interface ge-0/0/4.0

set protocols bgp group external type external
set protocols bgp group external local-address 10.5.2.9
set protocols bgp group external neighbor 10.3.2.9 peer-as 100
set protocols bgp group external neighbor 10.4.2.9 peer-as 100