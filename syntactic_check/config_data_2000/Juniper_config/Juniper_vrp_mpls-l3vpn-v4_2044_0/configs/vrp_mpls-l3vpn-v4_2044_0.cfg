set system host-name CE3

set interfaces ge-1/0/0 unit 0 family inet address 172.16.1.1/24

set protocols bgp local-as 65410
set protocols bgp group PEER-200 type external
set protocols bgp group PEER-200 peer-as 200
set protocols bgp group PEER-200 neighbor 172.16.1.2
set protocols bgp group PEER-200 family inet unicast
set protocols bgp group PEER-200 export REDISTRIBUTE-CONNECTED

set policy-options policy-statement REDISTRIBUTE-CONNECTED term 1 from protocol direct
set policy-options policy-statement REDISTRIBUTE-CONNECTED term 1 then accept