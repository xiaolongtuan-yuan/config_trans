set system host-name PE2

set protocols ldp interface ge-1/0/0.0
set protocols ldp interface lo0.1
set protocols ldp targeted-session 1.1.1.9

set protocols l2circuit neighbor 1.1.1.9 interface ge-2/0/0.1 virtual-circuit-id 2

set interfaces ge-1/0/0 unit 0 family inet address 10.20.1.2/24
set protocols mpls interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 1 vlan-id 10
set interfaces ge-2/0/0 unit 1 family ccc

set interfaces lo0 unit 1 family inet address 3.3.3.9/32

set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0