set system host-name PE1  

set protocols ldp interface ge-2/0/0.0  
set protocols ldp interface ge-3/0/0.0  
 
set vlans bd10 vlan-id 10  
set routing-instances evpn-vrf instance-type virtual-switch  
set routing-instances evpn-vrf interface ge-1/0/0.1  
set routing-instances evpn-vrf route-distinguisher 10:1  
set routing-instances evpn-vrf vrf-target export target:11:1  
set routing-instances evpn-vrf vrf-target import target:11:1  

set interfaces ge-1/0/0 unit 1 family bridge interface-mode trunk  

set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.2/24  
set interfaces ge-3/0/0 unit 0 family inet address 10.1.1.1/24  
set interfaces lo0 unit 0 family inet address 1.1.1.1/32  

set protocols bgp group internal type internal  
set protocols bgp group internal local-address 1.1.1.1  
set protocols bgp group internal family evpn signaling  
set protocols bgp group internal neighbor 2.2.2.2 peer-as 100  
set protocols bgp group internal neighbor 3.3.3.3 peer-as 100  

set protocols ospf area 0.0.0.0 interface lo0.0 passive  
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0  
set protocols ospf area 0.0.0.0 interface ge-3/0/0.0  