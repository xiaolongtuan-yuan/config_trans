set system host-name U-PE2
set protocols mpls label-switched-path protocol ldp
set protocols l2circuit neighbor 3.3.3.9 interface pw-class pwt
set protocols l2circuit neighbor 3.3.3.9 control-word
set protocols mpls ldp targeted-session 3.3.3.9

set interfaces ge-1/0/0 unit 0 family inet address 10.4.1.2/24
set interfaces ge-1/0/0 unit 0 family inet address mpls
set protocols mpls ldp interface ge-1/0/0
set interfaces ge-2/0/0 unit 0 encapsulation ethernet-ccc
set protocols l2circuit neighbor 3.3.3.9 interface ge-2/0/0 virtual-circuit-id 200 pw-class pwt
set interfaces lo0 unit 0 family inet address 5.5.5.9/32

set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-1/0/0