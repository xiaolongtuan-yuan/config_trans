set system host-name PE3

set protocols ldp interface lo0.0
set protocols ldp router-id 4.4.4.4

set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 unit 1 vlan-id 10
set interfaces ge-1/0/0 unit 1 family inet address 10.30.1.2/24

set interfaces ge-2/0/0 unit 0 family inet address 10.30.1.2/24
set interfaces ge-2/0/0 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set protocols bgp group internal type internal
set protocols bgp group internal local-address 4.4.4.4
set protocols bgp group internal neighbor 2.2.2.2
set protocols bgp group internal neighbor 2.2.2.2 peer-as 100
set protocols bgp group internal neighbor 3.3.3.3
set protocols bgp group internal neighbor 3.3.3.3 peer-as 100
set protocols bgp group internal family inet-vpn unicast

set routing-instances vsi1 instance-type vrf
set routing-instances vsi1 interface ge-1/0/0.1
set routing-instances vsi1 route-distinguisher 100:1
set routing-instances vsi1 vrf-target target:100:1
set routing-instances vsi1 routing-options static route 0.0.0.0/0 next-hop 10.30.1.1

set policy-options community vpn-target members target:100:1
set policy-options policy-statement vpn-import term 1 from community vpn-target
set policy-options policy-statement vpn-import term 1 then accept