set system host-name CE4

set interfaces ge-1/0/0 unit 0 family inet address 10.30.1.2/24
set interfaces lo0 unit 0 family inet address 44.44.44.44/32

set policy-options policy-statement EXPORT-STATIC term 1 from protocol static
set policy-options policy-statement EXPORT-STATIC term 1 then accept

set routing-options static route 44.44.44.44/32 discard
set routing-options router-id 44.44.44.44

set protocols bgp group external type external
set protocols bgp group external local-address 10.30.1.2
set protocols bgp group external peer-as 100
set protocols bgp group external neighbor 10.30.1.1
set protocols bgp group external family inet unicast
set protocols bgp group external export EXPORT-STATIC