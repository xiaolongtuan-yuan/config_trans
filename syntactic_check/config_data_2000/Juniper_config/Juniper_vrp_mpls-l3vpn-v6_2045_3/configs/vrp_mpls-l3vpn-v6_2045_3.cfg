set system host-name CE
set protocols bgp group ipv6-peers type external
set protocols bgp group ipv6-peers local-address 2001:db8:0:1:2::1
set protocols bgp group ipv6-peers neighbor 2001:db8:1::2 peer-as 100
set protocols bgp group ipv6-peers neighbor 2001:db8:3::2 peer-as 100

set protocols bgp group ipv6-peers family inet6 unicast
set protocols bgp group ipv6-peers export advertise-loopback