set system host-name CE1

set vlans vlan2

set ethernet-switching-options cfm mep 3 interface ge-0/0/1
set ethernet-switching-options cfm mep 3 interface ge-0/0/1 ccm-send interval 10
set ethernet-switching-options cfm mep 3 interface ge-0/0/1 ccm-send enable
set ethernet-switching-options cfm mep 4 interface ge-0/0/1 ccm-receive enable
set ethernet-switching-options cfm mep 3 remote-mep 4 ccm-receive enable
set ethernet-switching-options cfm mep 3 loss-measure dual-ended test-id 2
set ethernet-switching-options cfm mep 3 loss-measure dual-ended test-duration 0
set ethernet-switching-options cfm mep 3 loss-measure dual-ended continuity-check interval 1
set ethernet-switching-options cfm mep 3 loss-measure dual-ended continuity-check enable

set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members vlan2