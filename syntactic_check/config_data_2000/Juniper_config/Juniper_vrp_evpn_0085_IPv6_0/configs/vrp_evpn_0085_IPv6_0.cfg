set system host-name UPE

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target target:2:2
set routing-instances vpn1 interface ge-0/0/0.0
set routing-instances vpn1 interface ge-0/0/1.0

set protocols mpls interface ge-0/0/0.0
set protocols ldp interface ge-0/0/0.0

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols bgp group external type external
set protocols bgp group external local-address 1.1.1.1
set protocols bgp group external peer-as 100
set protocols bgp group external neighbor 2.2.2.2
set protocols bgp group external family inet-vpn unicast
set protocols bgp group external family inet6-vpn unicast

set policy-options policy-statement import-direct term 1 from protocol direct
set policy-options policy-statement import-direct term 1 then accept
set policy-options policy-statement import-direct term 2 then reject

set routing-options autonomous-system 100
set routing-options router-id 1.1.1.1

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set routing-instances vpn1 protocols evpn encapsulation vxlan
