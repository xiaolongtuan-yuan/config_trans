set system host-name PE1
set routing-options router-id 1.1.1.1

set protocols l2vpn
set protocols l2vpn vsi vsi1 l2vpn-id 100
set protocols l2vpn vsi vsi1 interface ge-0/0/0.11
set protocols l2vpn vsi vsi1 neighbor 2.2.2.2 vpls-id 100
set protocols l2vpn vsi vsi1 neighbor 3.3.3.3 vpls-id 100
set protocols l2vpn vsi vsi1 protocols igmp-snooping
set protocols l2vpn vsi vsi1 multicast limit 10

set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0
set protocols mpls interface ge-0/0/2.0

set protocols ldp
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp interface ge-0/0/2.0
set protocols ldp interface lo0.0

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 10.1.2.1/24
set interfaces ge-0/0/1 unit 0 family mpls

set interfaces ge-0/0/2 unit 0 family inet address 10.1.3.1/24
set interfaces ge-0/0/2 unit 0 family mpls

set interfaces ge-0/0/0 unit 11 encapsulation vlan-ccc
set interfaces ge-0/0/0 unit 11 family ccc
