set system host-name PE2

set routing-instances vpna instance-type vrf
set routing-instances vpna route-distinguisher 200:1
set routing-instances vpna vrf-target target:111:1 export
set routing-instances vpna vrf-target target:111:1 import
set routing-instances vpna vrf-table-label
set routing-instances vpna interface ge-1/0/0.0

set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.2/24
set interfaces ge-1/0/0 unit 0 family inet vrf vpna

set interfaces lo0 unit 1 family inet address 3.3.3.3/32

set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address 3.3.3.3
set protocols bgp group IBGP peer-as 200
set protocols bgp group IBGP neighbor 10.2.1.1 family inet unicast
set protocols bgp group IBGP neighbor 10.2.1.1 family inet flow

set policy-options policy-statement FlowSpec1 term 1 from protocol tcp
set policy-options policy-statement FlowSpec1 term 1 from destination-port 159
set policy-options policy-statement FlowSpec1 term 1 then reject

set forwarding-options sampling input rate 100
set forwarding-options sampling instance FlowSpec1 family inet filter FlowSpec1
set forwarding-options sampling instance FlowSpec1 input interface ge-1/0/0.0
set forwarding-options sampling export destination 10.2.1.1
set forwarding-options sampling export source-address 3.3.3.3
set forwarding-options sampling export format flow

set firewall family inet filter FlowSpec1 term 1 from protocol tcp
set firewall family inet filter FlowSpec1 term 1 from destination-port 159
set firewall family inet filter FlowSpec1 term 1 then discard