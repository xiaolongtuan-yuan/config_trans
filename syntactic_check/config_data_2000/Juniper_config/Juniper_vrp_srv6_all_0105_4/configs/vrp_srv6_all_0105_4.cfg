set system host-name CE1

set routing-options static route 11.11.11.11/32 discard

set policy-options policy-statement EXPORT-STATIC term 1 from protocol static
set policy-options policy-statement EXPORT-STATIC term 1 then accept

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces lo0 unit 1 family inet address 11.11.11.11/32

set protocols bgp group external type external
set protocols bgp group external export EXPORT-STATIC
set protocols bgp group external neighbor 10.1.1.1 peer-as 100
set protocols bgp group external family inet unicast