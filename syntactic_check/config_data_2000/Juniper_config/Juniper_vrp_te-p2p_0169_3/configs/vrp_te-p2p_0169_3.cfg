set system host-name LSRD

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-1/0/1.0

set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-1/0/1.0
set protocols ldp router-id 4.4.4.4

set interfaces ge-1/0/0 unit 0 family inet address 4.1.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces ge-1/0/1 unit 0 family inet address 3.4.1.1/24
set interfaces ge-1/0/1 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set routing-options static route 1.1.1.1/32 next-hop 4.1.1.1
set routing-options static route 3.3.3.3/32 next-hop 3.4.1.2
