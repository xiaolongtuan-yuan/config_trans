set system host-name ABR1
set protocols mpls
set protocols mpls ldp
set protocols mpls ldp router-id lo0.0
set protocols isis level 2 wide-metrics-only
set protocols isis network-entity 49.0001.0000.0000.000a.00
set interfaces ge-1/0/3 unit 0 family inet address 10.0.7.7/24
set interfaces ge-1/0/3 unit 0 family mpls
set interfaces ge-1/0/3 unit 0 isis
set interfaces ge-1/0/4 unit 0 family inet address 10.0.16.1/24
set interfaces ge-1/0/4 unit 0 family mpls
set interfaces ge-1/0/4 unit 0 isis
set interfaces lo0 unit 0 family inet address 1.1.1.3/32
set interfaces lo0 unit 0 isis
set routing-options static route 1.1.1.4/32 next-hop 10.0.16.2
set protocols bgp group external-as type external
set protocols bgp group external-as local-address lo0.0
set protocols bgp group external-as neighbor 10.0.16.2 peer-as 65535
set protocols bgp group external-as neighbor 1.1.1.2 peer-as 1
set protocols bgp group external-as neighbor 1.1.1.2 local-address lo0.0
set protocols bgp group external-as family inet unicast
set protocols bgp group external-as neighbor 10.0.16.2 family inet unicast
set protocols bgp group external-as neighbor 1.1.1.2 family inet unicast
set protocols bgp group external-as family inet-vpn
set protocols bgp group external-as neighbor 10.0.16.2 family inet-vpn
set protocols bgp group external-as neighbor 1.1.1.2 family inet-vpn
set protocols bgp group external-as family inet6-vpn
set protocols bgp group external-as neighbor 10.0.16.2 family inet6-vpn
set protocols bgp group external-as neighbor 1.1.1.2 family inet6-vpn
set policy-options policy-statement policy1 term 1 then mpls-label