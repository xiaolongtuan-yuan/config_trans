set system host-name P1

set protocols mpls ldp label-protocol
set protocols mpls ldp router-id 2.2.2.2

set protocols isis level 2-only metric-style wide
set protocols isis traffic-engineering router-id lo0
set protocols isis traffic-engineering level 2
set protocols isis traffic-engineering area 0
set protocols isis traffic-engineering segment-routing

set interfaces ge-1/0/0 unit 0 family inet address 10.1.2.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 0 family inet6 mpls

set interfaces ge-2/0/0 unit 0 family inet address 10.1.3.2/24
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family inet6 mpls

set interfaces ge-3/0/0 unit 0 family inet address 10.2.1.1/24

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols bgp group 100 neighbor 10.2.1.2 remote-as 100
set protocols bgp group 100 family inet unicast
set protocols bgp group 100 family inet unicast neighbor 10.2.1.2 activate

set protocols isis level 2
set protocols isis segment-routing mpls

set routing-options mpls label-range 100000 199999