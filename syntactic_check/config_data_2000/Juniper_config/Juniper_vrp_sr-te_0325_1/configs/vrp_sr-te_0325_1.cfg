set system host-name P1

set protocols ldp router-id 2.2.2.2
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0

set protocols isis interface all
set protocols isis level 2 wide-metrics-only

set interfaces ge-1/0/0 unit 0 family inet address 10.1.2.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 0 family inet6

set interfaces ge-2/0/0 unit 0 family inet address 10.1.3.2/24
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family inet6

set interfaces ge-3/0/0 unit 0 family inet address 10.2.1.1/24

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols bgp group 100 type external
set protocols bgp group 100 neighbor 10.2.1.2 peer-as 100
set protocols bgp group 100 family inet unicast
