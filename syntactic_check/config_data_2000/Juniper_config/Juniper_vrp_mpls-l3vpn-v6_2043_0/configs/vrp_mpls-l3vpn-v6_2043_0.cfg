set system host-name PE1

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target target:1:1 export
set routing-instances vpn1 vrf-target target:1:1 import
set routing-instances vpn1 vrf-table-label
set routing-instances vpn1 interface lo0.2

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols mpls interface ge-1/0/0.0
set protocols rsvp interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls
set protocols mpls interface ge-2/0/0.0
set protocols ldp interface ge-2/0/0.0

set interfaces lo0 unit 1 family inet address 1.1.1.9/32
set protocols ospf area 0.0.0.0 interface lo0.1
set protocols mpls traffic-engineering router-id 1.1.1.9

set interfaces lo0 unit 2 family inet6 address 2001:db8:9::1/128
set routing-instances vpn1 interface lo0.2

set interfaces gr-0/0/0 unit 1 tunnel source 1.1.1.9
set interfaces gr-0/0/0 unit 1 tunnel destination 3.3.3.9
set protocols mpls traffic-engineering tunnels gr-0/0/0.1
set protocols mpls traffic-engineering tunnels gr-0/0/0.1 tunnel-id 100
set protocols mpls traffic-engineering auto-route announce

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf opaque-lsa enable

set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address 1.1.1.9
set protocols bgp group IBGP peer-as 100
set protocols bgp group IBGP neighbor 3.3.3.9 family inet unicast
set protocols bgp group IBGP neighbor 3.3.3.9 family inet labeled-unicast
set protocols bgp group IBGP neighbor 3.3.3.9 family inet6 unicast
set protocols bgp group IBGP export vpn-target

set policy-options policy-statement vpn-target term 1 then accept

set protocols mpls traffic-engineering load-balance 2