set system host-name DeviceC

set chassis network-services enhanced-ip

set interfaces ge-1/0/0 unit 0 family inet address 192.168.1.1/24
set interfaces ge-2/0/0 unit 0 family inet address 192.168.2.1/24
set interfaces ge-3/0/0 unit 0 family inet address 192.168.3.1/24

set routing-instances VPN1 instance-type vrf
set routing-instances VPN1 interface ge-1/0/0.0
set routing-instances VPN1 route-distinguisher 100:1
set routing-instances VPN1 vrf-target target:100:1

set routing-options static route 0.0.0.0/0 next-hop 192.168.1.254