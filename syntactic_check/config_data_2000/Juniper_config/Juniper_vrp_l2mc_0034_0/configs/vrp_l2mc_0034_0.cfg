set protocols igmp-snooping

set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members vlan3
set interfaces ge-0/0/0 unit 0 family ethernet-switching igmp-snooping static-router-port vlan3
set interfaces ge-0/0/0 unit 0 family ethernet-switching port-mode access

set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members vlan3
set interfaces ge-0/0/1 unit 0 family ethernet-switching port-mode access

set interfaces ge-0/0/2 unit 0 family ethernet-switching vlan members vlan3
set interfaces ge-0/0/2 unit 0 family ethernet-switching port-mode access