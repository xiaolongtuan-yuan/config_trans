set system host-name RR

set interfaces ge-0/0/3 unit 0 family inet address 172.16.4.1/24
set interfaces ge-0/0/1 unit 0 family inet address 172.16.2.2/24
set interfaces ge-0/0/2 unit 0 family inet address 172.16.5.1/24
set interfaces lo0 unit 0 family inet address 5.5.5.5/32

set protocols bgp group RR type external
set protocols bgp group RR local-address 5.5.5.5
set protocols bgp group RR neighbor 172.16.2.1 peer-as 65008
set protocols bgp group RR neighbor 172.16.4.2 peer-as 65008
set protocols bgp group RR neighbor 172.16.5.2 peer-as 65008
set protocols bgp group RR family inet unicast
set protocols bgp group RR multipath multiple-as

set policy-options policy-statement export-direct term 1 from protocol direct
set policy-options policy-statement export-direct term 1 then accept
set protocols bgp group RR export export-direct