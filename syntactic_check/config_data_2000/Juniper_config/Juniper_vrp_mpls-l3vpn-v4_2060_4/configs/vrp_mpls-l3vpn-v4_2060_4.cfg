set system host-name PE2

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 200:2
set routing-instances vpn1 interface ge-2/0/0.0

set interfaces ge-1/0/0 unit 0 family inet address 30.1.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 0 family iso

set interfaces ge-2/0/0 unit 0 family inet address 21.1.1.1/24

set interfaces lo0 unit 0 family inet address 4.4.4.9/32

set protocols isis interface ge-1/0/0.0
set protocols isis interface lo0.0
set protocols isis level 1 wide-metrics-only

set protocols bgp group internal type internal
set protocols bgp group internal local-address 4.4.4.9
set protocols bgp group internal family inet unicast
set protocols bgp group internal family inet-vpn unicast
set protocols bgp group internal neighbor 3.3.3.9 peer-as 100

set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-1/0/0.0