set system host-name P
set routing-instances mpls lsr-id 2.2.2.9

set protocols mpls label-protocol ldp
set protocols mpls ldp router-id 2.2.2.9

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols mpls ldp interface ge-0/0/0

set interfaces ge-0/0/1 unit 0 family inet address 10.2.2.1/24
set interfaces ge-0/0/1 unit 0 family mpls
set protocols mpls ldp interface ge-0/0/1

set interfaces lo0 unit 0 family inet address 2.2.2.9/32

set protocols ospf area 0 interface ge-0/0/0
set protocols ospf area 0 interface ge-0/0/1
set protocols ospf area 0 interface lo0