set system host-name PE3

set protocols ldp interface ge-0/0/2.0
set protocols ldp interface ge-0/0/3.0

set protocols l2vpn site PE3-PW1 site-identifier 2
set protocols l2vpn site PE3-PW1 connectivity-type permanent
set protocols l2vpn site PE3-PW1 interface ge-0/0/1.1

set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 encapsulation extended-vlan-bridge
set interfaces ge-0/0/1 unit 1 encapsulation vlan-bridge
set interfaces ge-0/0/1 unit 1 family bridge interface-mode trunk

set interfaces ge-0/0/2 unit 0 family inet address 192.168.1.2/30
set interfaces ge-0/0/2 unit 0 family mpls

set interfaces ge-0/0/3 unit 0 family inet address 192.168.2.1/30
set interfaces ge-0/0/3 unit 0 family mpls

set interfaces lo0 unit 1 family inet address 3.3.3.9/32

set routing-options static route 0.0.0.0/0 next-hop 192.168.1.1

set protocols ospf area 0.0.0.0 interface ge-0/0/2.0
set protocols ospf area 0.0.0.0 interface ge-0/0/3.0
set protocols ospf area 0.0.0.0 interface lo0.1 passive