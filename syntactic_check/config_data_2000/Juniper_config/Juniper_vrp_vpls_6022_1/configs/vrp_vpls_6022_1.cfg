set system host-name PE1

set protocols mpls label-switched-path protocol ldp
set protocols mpls ldp router-id lo0.1 force

set protocols mpls l2circuit neighbor v1 auto-discovery bgp
set protocols mpls l2circuit neighbor v1 route-distinguisher 100:1
set protocols mpls l2circuit neighbor v1 vrf-target target:1:1 export
set protocols mpls l2circuit neighbor v1 vrf-target target:1:1 import
set protocols mpls l2circuit neighbor v1 vpn-id 1
set protocols mpls l2circuit neighbor v1 default-offset 0

set interfaces ge-1/0/0 unit 0
set interfaces ge-1/0/0 unit 1 vlan-id 10
set protocols mpls l2circuit neighbor v1 interface ge-1/0/0.1

set interfaces ge-2/0/0 unit 0 family inet address 10.10.1.1/24
set protocols mpls interface ge-2/0/0
set protocols mpls ldp interface ge-2/0/0

set interfaces lo0 unit 1 family inet address 1.1.1.1/32

set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-2/0/0

set protocols bgp group internal type internal
set protocols bgp group internal neighbor 2.2.2.2 peer-as 100
set protocols bgp group internal local-address 1.1.1.1
set protocols bgp group internal family inet unicast
set protocols bgp group internal neighbor 2.2.2.2 label-route-capability

set protocols bgp group external type external
set protocols bgp group external neighbor 4.4.4.4 peer-as 200
set protocols bgp group external local-address 1.1.1.1
set protocols bgp group external family l2vpn vpls
set protocols bgp group external neighbor 4.4.4.4 send-community
set protocols bgp group external neighbor 4.4.4.4 ebgp-multihop 255