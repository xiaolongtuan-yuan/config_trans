set system host-name PE1

set protocols mpls interface ge-2/0/0
set protocols ldp interface ge-2/0/0
set protocols ldp interface lo0.1

set protocols l2vpn site PE1 site-identifier 1
set protocols l2vpn encapsulation-type ethernet
set protocols l2vpn interface ge-1/0/0.1

set routing-instances v1 instance-type virtual-switch
set routing-instances v1 interface ge-1/0/0.1
set routing-instances v1 route-distinguisher 100:1
set routing-instances v1 vrf-target target:1:1


set interfaces ge-1/0/0 unit 1 encapsulation vlan-ccc
set interfaces ge-1/0/0 unit 1 vlan-id 10

set interfaces ge-2/0/0 unit 0 family inet address 10.10.1.1/24

set interfaces lo0 unit 1 family inet address 1.1.1.1/32

set protocols ospf area 0 interface lo0.1 passive
set protocols ospf area 0 interface ge-2/0/0

set protocols bgp group internal type internal
set protocols bgp group internal neighbor 2.2.2.2 peer-as 100
set protocols bgp group internal local-address 1.1.1.1
set protocols bgp group internal family inet-vpn unicast

set protocols bgp group external type external
set protocols bgp group external neighbor 4.4.4.4 peer-as 200
set protocols bgp group external neighbor 4.4.4.4 local-address 1.1.1.1
set protocols bgp group external neighbor 4.4.4.4 family evpn signaling
set protocols bgp group external neighbor 4.4.4.4 multihop ttl 255
