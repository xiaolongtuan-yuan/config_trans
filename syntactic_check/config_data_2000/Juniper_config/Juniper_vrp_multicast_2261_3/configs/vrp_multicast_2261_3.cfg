set system host-name CE1

set routing-options multicast-routing

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set protocols pim interface ge-0/0/0.0 sparse-mode

set interfaces ge-0/0/1 unit 0 family inet address 10.1.2.1/24
set protocols pim interface ge-0/0/1.0 sparse-mode

set interfaces lo0 unit 0 family inet address 4.4.4.4/32
set protocols pim interface lo0.0 sparse-mode

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface lo0.0

set protocols pim rp static address 4.4.4.4