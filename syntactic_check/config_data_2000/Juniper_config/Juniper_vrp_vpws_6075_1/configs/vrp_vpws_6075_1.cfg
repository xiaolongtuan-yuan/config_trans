set system host-name CE2

set interfaces ae20 aggregated-ether-options link-speed 1g
set interfaces ae20 unit 0 family ethernet-switching vlan members [ 100 ]
set interfaces ae20 unit 0 family inet address 10.1.1.2/24

set interfaces ge-0/0/0 ether-options 802.3ad ae20
set interfaces ge-0/0/0 disable

set interfaces ge-0/0/1 ether-options 802.3ad ae20
set interfaces ge-0/0/1 disable