set system host-name DeviceC
!
set interfaces ge-0/0/1 unit 0 family inet address 10.1.3.1/24
!
set interfaces ge-0/0/2 unit 0 family inet address 10.1.2.2/24
!
set firewall family inet filter TEST-FLOW term 1 from source-address 10.1.1.1
set firewall family inet filter TEST-FLOW term 1 from destination-address 10.1.3.2
set firewall family inet filter TEST-FLOW term 1 then accept
set firewall family inet filter TEST-FLOW term 2 then reject
!
set class-of-service schedulers TEST-POLICY
set class-of-service scheduler TEST-POLICY bandwidth-limit 10000
!
set interfaces ge-0/0/1.1 unit 0 family inet address 10.1.3.2/24
set interfaces ge-0/0/1.1 unit 0 family inet filter input TEST-FLOW
!
set system analytics nqa responder 1
set system analytics nqa scheduler-group 1
set system analytics nqa scheduler-group 1 prober 1 test 1 reflector 1
!