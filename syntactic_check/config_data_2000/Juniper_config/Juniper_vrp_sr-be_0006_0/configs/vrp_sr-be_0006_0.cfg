set system host-name PE1  

set interfaces ge-1/0/0 unit 0 family inet address 172.16.1.1/24  
set interfaces lo0 unit 1 family inet address 1.1.1.9/32  

set protocols isis level 1 wide-metrics-only  

set protocols mpls interface ge-1/0/0.0  

set protocols bgp group internal type internal  
set protocols bgp group internal local-address 1.1.1.9  
set protocols bgp group internal neighbor 3.3.3.9 peer-as 100  
set protocols bgp group internal family inet unicast  
set protocols bgp group internal export NH_SELF_POLICY  

set policy-options policy-statement NH_SELF_POLICY term 1 then next-hop self  
set policy-options policy-statement EXPORT_CONNECTED term 1 from protocol direct  
set policy-options policy-statement EXPORT_CONNECTED term 1 then accept  

set routing-options router-id 1.1.1.9  
set routing-options autonomous-system 100  
