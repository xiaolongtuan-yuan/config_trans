set system host-name CE1

delete set protocols multicast-routing
set routing-options multicast

set interfaces ge-0/0/0 unit 0 family inet address 10.1.3.1/24

delete set interfaces ge-0/0/0 unit 0 family inet pim sm

set interfaces ge-0/0/1 unit 0 family inet address 192.168.1.1/24
delete set interfaces ge-0/0/1 unit 0 family inet pim sm

set interfaces ge-0/0/2 unit 0 family inet address 10.1.4.1/24
delete set interfaces ge-0/0/2 unit 0 family inet pim sm

set protocols pim interface ge-0/0/0.0 mode sparse
set protocols pim interface ge-0/0/1.0 mode sparse
set protocols pim interface ge-0/0/2.0 mode sparse

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0

delete set protocols pim rp-address 4.4.4.4
set protocols pim rp static address 4.4.4.4