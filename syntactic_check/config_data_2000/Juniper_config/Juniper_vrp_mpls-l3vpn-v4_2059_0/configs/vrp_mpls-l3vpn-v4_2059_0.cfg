set system host-name CE3

set interfaces ge-0/0/0 unit 0 family inet address 172.16.1.1/24

set protocols bgp group 65410 type external
set protocols bgp group 65410 peer-as 200
set protocols bgp group 65410 neighbor 172.16.1.2

set protocols bgp group 65410 family inet unicast
set policy-options policy-statement EXPORT_DIRECT from protocol direct
set policy-options policy-statement EXPORT_DIRECT then accept
set protocols bgp group 65410 export EXPORT_DIRECT