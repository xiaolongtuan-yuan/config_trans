set system host-name CE3

# Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 172.16.1.1/24

# BGP Configuration
set protocols bgp group 65410 neighbor 172.16.1.2 remote-as 200

# BGP IPv4 Unicast Configuration
set protocols bgp group 65410 family inet unicast network 172.16.1.0/24
set protocols bgp group 65410 family inet unicast neighbor 172.16.1.2 activate
set protocols bgp group 65410 family inet unicast neighbor 172.16.1.2 import-route direct