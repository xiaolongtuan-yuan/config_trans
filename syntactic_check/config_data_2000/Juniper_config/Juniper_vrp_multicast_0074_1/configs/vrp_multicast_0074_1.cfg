set system host-name DeviceD

delete set protocols multicast-routing
set routing-options multicast

delete set policy-options prefix-list list-c term 10 from prefix 192.168.0.0/16
delete set policy-options prefix-list list-c term 10 from orlonger

set interfaces ge-1/0/0 unit 0 family inet address 192.168.3.2/24
delete set interfaces ge-1/0/0 unit 0 family inet pim-mode sparse
delete set interfaces lo0 unit 0 family inet pim-mode sparse

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

delete set protocols pim rp static address 2.2.2.2
set protocols pim rp static address 2.2.2.2

set protocols pim interface ge-1/0/0.0 mode sparse
set protocols pim interface lo0.0 mode sparse
set protocols pim interface lo0.0

delete set protocols pim rp-candidate lo0.0
set protocols pim rp-candidate interface lo0.0

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0

set protocols msdp peer 192.168.1.1 local-address ge-1/0/0.0
set protocols msdp peer 192.168.1.1 originator-id 192.168.1.1