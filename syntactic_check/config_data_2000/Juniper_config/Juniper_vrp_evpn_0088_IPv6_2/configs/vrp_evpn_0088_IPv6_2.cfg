set system host-name NPE

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target target:1:1
set protocols mpls interface ge-0/0/0.0
set protocols ldp
set protocols ldp interface ge-0/0/0.0
set protocols ldp router-id 3.3.3.3

set protocols isis
set protocols isis interface ge-0/0/0.0 point-to-point
set protocols isis interface ge-0/0/0.0 level 1 disable
set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols bgp group vpn-v6 type internal
set protocols bgp group vpn-v6 local-address 3.3.3.3
set protocols bgp group vpn-v6 neighbor 2.2.2.2
set protocols bgp group vpn-v6 family inet6-vpn unicast

set interfaces ge-0/0/0 unit 0 family inet address 10.2.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet6
set routing-instances vpn1 interface ge-0/0/1.0

set routing-instances vpn1 protocols bgp group vpnv6 type external
set routing-instances vpn1 protocols bgp group vpnv6 neighbor 2001:db8:40::2
set routing-instances vpn1 protocols bgp group vpnv6 family inet6 unicast
set routing-instances vpn1 protocols bgp group vpnv6 import vpn-target
set routing-instances vpn1 protocols bgp group vpnv6 export vpn-target

set policy-options policy-statement vpn-target term 1 then community add vpn-target-community
set policy-options policy-statement vpn-target then accept
set policy-options community vpn-target-community members target:1:1