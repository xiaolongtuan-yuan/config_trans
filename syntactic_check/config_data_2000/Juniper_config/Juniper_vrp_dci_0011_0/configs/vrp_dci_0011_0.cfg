set system host-name Device1

set interfaces ge-0/0/0 unit 0 family inet address 192.168.40.2/24
set interfaces lo0 unit 0 family inet address 5.5.5.5/32

set protocols bgp group external type external
set protocols bgp group external local-address 5.5.5.5
set protocols bgp group external peer-as 65410
set protocols bgp group external neighbor 4.4.4.4
set protocols bgp group external neighbor 6.6.6.6
set protocols bgp group external family inet unicast

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0