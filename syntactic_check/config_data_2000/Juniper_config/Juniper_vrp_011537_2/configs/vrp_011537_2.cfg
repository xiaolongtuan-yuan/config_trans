set system host-name PE2

set protocols cfm version standard
set protocols cfm enable

set protocols mpls label-switched-path protocol ldp
set protocols mpls lsr-id 1.1.1.1

set protocols mpls l2vpn
set protocols mpls l2vpn vsi ldp1 static
set protocols mpls l2vpn vsi ldp1 pwsignal ldp
set protocols mpls l2vpn vsi ldp1 vsi-id 1
set protocols mpls l2vpn vsi ldp1 peer 2.2.2.2

set interfaces ge-1/0/1 unit 1 vlan-id 2
set protocols mpls l2circuit neighbor 2.2.2.2 interface ge-1/0/1.1 virtual-circuit-id 1

set interfaces ge-1/0/2 unit 0 family inet address 10.1.1.2/24
set protocols mpls interface ge-1/0/2
set protocols mpls ldp interface ge-1/0/2

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-1/0/2

set protocols cfm domain md1
set protocols cfm domain md1 service ma1
set protocols cfm domain md1 service ma1 mep-id 2 interface ge-1/0/1.1
set protocols cfm domain md1 service ma1 mep-id 2 continuity-check interval 3
set protocols cfm domain md1 service ma1 mep-id 2 ccm-send enable
set protocols cfm domain md1 service ma1 remote-mep-id 1 ccm-receive enable
set protocols cfm domain md1 service ma1 remote-mep-id 1 continuity-check interval 3
set protocols cfm domain md1 service ma1 test-id 1 loss-measurement dual-ended