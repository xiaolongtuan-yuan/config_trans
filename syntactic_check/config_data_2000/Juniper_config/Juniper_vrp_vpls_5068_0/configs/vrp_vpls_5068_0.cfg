set system host-name PE1

set routing-instances BD10 instance-type l2vpn
set routing-instances BD10 interface ge-1/0/2.1
set routing-instances BD10 protocols l2vpn encapsulation-type ethernet
set routing-instances BD10 protocols l2vpn site PE1 site-identifier 1

set interfaces ge-1/0/2 flexible-vlan-tagging
set interfaces ge-1/0/2 unit 1 vlan-id 10
set interfaces ge-1/0/2 unit 1 family inet address 192.168.3.1/24