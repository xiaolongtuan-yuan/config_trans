set system host-name PE2

set routing-options router-id 4.4.4.9

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 200:2
set routing-instances vpn1 vrf-target target:1:1
set routing-instances vpn1 interface ge-0/0/1.0

set protocols mpls interface ge-0/0/0.0
set protocols ldp interface ge-0/0/0.0

set protocols isis interface all
set protocols isis interface ge-0/0/0.0
set protocols isis interface lo0.0 passive

set interfaces ge-0/0/0 unit 0 family inet address 30.1.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 21.1.1.1/24

set interfaces lo0 unit 0 family inet address 4.4.4.9/32

set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address 4.4.4.9
set protocols bgp group IBGP neighbor 3.3.3.9 peer-as 100
set protocols bgp group IBGP family inet-vpn unicast

set routing-instances vpn1 protocols bgp group CE type external
set routing-instances vpn1 protocols bgp group CE neighbor 21.1.1.2 peer-as 300
set routing-instances vpn1 protocols bgp group CE family inet unicast