set system host-name CE1

set interfaces ge-1/0/1 unit 10 vlan-id 10
set interfaces ge-1/0/1 unit 10 family inet address 10.1.1.2/24

set protocols bgp group eBGP type external
set protocols bgp group eBGP peer-as 100
set protocols bgp group eBGP neighbor 10.1.1.1 family inet unicast
set protocols bgp group eBGP export connected-routes

set policy-options policy-statement connected-routes term 1 from protocol direct
set policy-options policy-statement connected-routes term 1 then accept