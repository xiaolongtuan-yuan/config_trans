set system host-name DHCP-Relay

set system services dhcp-relay information option

set interfaces ge-0/0/1 unit 0 family inet address 192.168.1.1/24
set interfaces ge-0/0/1 unit 0 vlan-id 100
set interfaces ge-0/0/1 unit 0 family inet dhcp-relay server 192.168.3.1
set interfaces ge-0/0/1.1 unit 0 vlan-id 100
set interfaces ge-0/0/1.1 encapsulation ethernet-bridging
set interfaces ge-0/0/1.1 family inet address 192.168.1.1/24

set interfaces ge-0/0/2 unit 0 family inet address 192.168.2.1/24

set dhcp-relay service enable
set dhcp-relay option82 rebuild
set dhcp-relay arp-broadcast enable