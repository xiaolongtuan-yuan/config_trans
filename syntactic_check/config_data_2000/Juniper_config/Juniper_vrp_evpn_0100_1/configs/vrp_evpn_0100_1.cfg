set system host-name PE2

set routing-instances evrf1 instance-type virtual-router
set routing-instances evrf1 route-distinguisher 10:1
set policy-options policy-statement evrf1-import term 1 from community 11:1
set policy-options policy-statement evrf1-import term 1 then accept
set policy-options policy-statement evrf1-export term 1 from protocol direct
set policy-options policy-statement evrf1-export term 1 then community add 11:1

set protocols ldp router-id 2.2.2.2

set vlans VLAN10 vlan-id 10
set vlans VLAN10 l3-interface irb.10
set interfaces irb unit 10 family inet address 10.1.1.2/24
set routing-instances evrf1 interface irb.10

set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 unit 1 vlan-id 10
set interfaces ge-1/0/0 unit 1 family bridge interface-mode trunk
set interfaces ge-1/0/0 unit 1 family bridge vlan-id-list 10

set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-3/0/0 unit 0 family inet address 10.3.1.1/24
set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols bgp group peer1 type internal
set protocols bgp group peer1 local-address 2.2.2.2
set protocols bgp group peer1 family evpn signaling
set protocols bgp group peer1 neighbor 1.1.1.1

set protocols bgp group peer2 type internal
set protocols bgp group peer2 local-address 2.2.2.2
set protocols bgp group peer2 family evpn signaling
set protocols bgp group peer2 neighbor 3.3.3.3

set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface ge-3/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set routing-instances evrf1 protocols evpn encapsulation vxlan

set policy-options community 11:1 members 11:1