set system host-name PE2

set routing-instances evrf1 instance-type virtual-router
set routing-instances evrf1 route-distinguisher 10:1
set routing-instances evrf1 vrf-import 11:1
set routing-instances evrf1 vrf-export 11:1

set protocols mpls ldp router-id lo0.0

set bridge-domains 10 bridge-domain-type ethernet
set bridge-domains 10 mtu 1500
set bridge-domains 10 efp 10
set bridge-domains 10 interface ge-1/0/0.1
set bridge-domains 10 interface ge-1/0/0.1 encapsulation vlan-ccc 10
set bridge-domains 10 interface ge-1/0/0.1 xconnect 10.1.1.1
set bridge-domains 10 interface ge-1/0/0.1 bridge-domain 10

set interfaces ge-1/0/0.1 unit 0 encapsulation vlan-ccc 10
set interfaces ge-1/0/0.1 unit 0 xconnect 10.1.1.1

set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-3/0/0 unit 0 family inet address 10.3.1.1/24
set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols bgp group peer1 neighbor 1.1.1.1 remote-as 100
set protocols bgp group peer1 neighbor 1.1.1.1 update-source lo0
set protocols bgp group peer1 family inet unicast
set protocols bgp group peer1 family l2vpn evpn

set protocols bgp group peer2 neighbor 3.3.3.3 remote-as 100
set protocols bgp group peer2 neighbor 3.3.3.3 update-source lo0
set protocols bgp group peer2 family inet unicast
set protocols bgp group peer2 family l2vpn evpn

set protocols ospf area 0.0.0.0 network 2.2.2.2/32
set protocols ospf area 0.0.0.0 network 10.2.1.0/24
set protocols ospf area 0.0.0.0 network 10.3.1.0/24

set protocols evpn source-address 2.2.2.2