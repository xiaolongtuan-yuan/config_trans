set system host-name DeviceA

set protocols pim rp static address 192.168.4.1

set firewall family inet filter multicast-filter term 1 from source-address 232.1.1.0/24
set firewall family inet filter multicast-filter term 1 then accept
set firewall family inet filter multicast-filter term 2 then reject

set interfaces ge-1/0/0 unit 0 family inet address 192.168.9.1/24
set protocols pim interface ge-1/0/0.0
set protocols isis interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 0 family inet address 10.110.1.1/24
set protocols pim interface ge-2/0/0.0
set protocols igmp interface ge-2/0/0.0 version 3
set protocols isis interface ge-2/0/0.0

set interfaces ge-3/0/0 unit 0 family inet address 192.168.1.1/24
set protocols pim interface ge-3/0/0.0
set protocols isis interface ge-3/0/0.0

set protocols pim ssm-address-list 2001
set protocols pim rp static address 192.168.4.1