set system host-name P

set protocols ldp router-id 2.2.2.2
set protocols ldp transport-address 2.2.2.2
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp deaggregate
set protocols ldp igp-synchronization

set protocols isis level 2 wide-metrics-only

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/1 unit 0 family inet address 10.2.1.1/24
set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0

set protocols isis interface ge-0/0/0.0
set protocols isis interface ge-0/0/1.0
set protocols isis interface lo0.0
set protocols isis interface lo0.0 passive
