set system host-name DeviceE

set interfaces ge-1/0/0 unit 0 family inet6 address 2001:db8:2000::1/24
set interfaces ge-2/0/0 unit 0 family inet6 address 2001:db8:2001::1/24
set interfaces ge-3/0/0 unit 0 family inet6 address 2001:db8:2002::1/24
set interfaces ge-1/0/1 unit 0 family inet6 address 2001:db8:3000::1/24
set interfaces ge-1/0/1 unit 0 family inet6 ospfv3 cost 5

set protocols ipv6 unicast-routing

set protocols ospfv3 1 router-id 4.4.4.4
set protocols ospfv3 1 area 0.0.0.1 interface ge-1/0/0
set protocols ospfv3 1 area 0.0.0.1 interface ge-2/0/0
set protocols ospfv3 1 area 0.0.0.1 interface ge-3/0/0
set protocols ospfv3 1 area 0.0.0.1 interface ge-1/0/1

set protocols bfd all-interfaces enable
set protocols bfd all-interfaces frr-binding