set system host-name ASBR2

set routing-instances vpn1 instance-type virtual-router
set routing-instances vpn1 route-distinguisher 200:2
set policy-options community vpn-target members target:2:2
set routing-instances vpn1 vrf-import vpn-import
set routing-instances vpn1 vrf-export vpn-export
set policy-options policy-statement vpn-import term 1 from community vpn-target
set policy-options policy-statement vpn-import term 1 then accept
set policy-options policy-statement vpn-export term 1 from community vpn-target
set policy-options policy-statement vpn-export term 1 then accept

set protocols ldp

set interfaces ge-0/0/0 unit 0 family inet address 10.40.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols mpls interface ge-0/0/0.0

set interfaces ge-0/0/1 unit 0 family inet address 12.12.12.2/24
set routing-instances vpn1 interface ge-0/0/1.0

set interfaces lo0 unit 0 family inet address 3.3.3.9/32

set protocols bgp group neighbor-4.4.4.9 type external
set protocols bgp group neighbor-4.4.4.9 local-address 3.3.3.9
set protocols bgp group neighbor-4.4.4.9 peer-as 200
set protocols bgp group neighbor-4.4.4.9 family inet unicast
set protocols bgp group neighbor-4.4.4.9 family inet-vpn unicast
set protocols bgp group neighbor-4.4.4.9 neighbor 4.4.4.9

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0

set routing-instances vpn1 protocols bgp group neighbor-12.12.12.1 peer-as 100