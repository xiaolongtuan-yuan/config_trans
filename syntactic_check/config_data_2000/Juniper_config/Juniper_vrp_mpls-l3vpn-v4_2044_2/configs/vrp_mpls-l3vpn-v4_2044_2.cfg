set system host-name CE1

set routing-options router-id 2.2.2.9
set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0

set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0

set interfaces ge-0/0/0 unit 0 family inet address 40.1.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family inet address 11.1.1.1/24
set interfaces ge-0/0/1 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 2.2.2.9/32

set routing-options static route 0.0.0.0/0 next-hop 40.1.1.1

set protocols bgp group peer-AS100 type external
set protocols bgp group peer-AS100 local-address 11.1.1.1
set protocols bgp group peer-AS100 neighbor 11.1.1.2 peer-as 100
set protocols bgp group peer-AS100 export policy1
set protocols bgp group peer-AS100 family inet unicast

set policy-options policy-statement policy1 term 1 from protocol bgp
set policy-options policy-statement policy1 term 1 then next-hop self
set policy-options policy-statement policy1 term 1 then accept

set protocols ospf area 0 interface ge-0/0/0.0
set protocols ospf area 0 interface ge-0/0/1.0
set protocols ospf area 0 interface lo0.0
set protocols ospf export policy1