set system host-name PE2

set interfaces ge-0/0/0 unit 0 family inet address 10.2.1.2/30
set interfaces ge-0/0/0 unit 0 family inet address 10.2.1.2/30 mpls
set interfaces ge-0/0/1 unit 0 family inet address 10.5.1.2/30
set interfaces ge-0/0/1 unit 0 family inet address 10.5.1.2/30 mpls
set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols mpls lsr-id 3.3.3.3
set protocols mpls traffic-eng
set protocols mpls rsvp-te

set protocols isis interface ge-0/0/0.0
set protocols isis interface ge-0/0/1.0
set protocols isis interface lo0.0
set protocols isis cost-style wide
set protocols isis level 1-2 traffic-eng

set protocols bfd mpls-passive