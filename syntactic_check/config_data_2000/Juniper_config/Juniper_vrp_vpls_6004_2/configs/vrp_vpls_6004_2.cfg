set system host-name PE1

set routing-instances vsi-a2 instance-type l2vpn
set routing-instances vsi-a2 interface ge-1/0/0.1
set routing-instances vsi-a2 protocols l2vpn site 100

set protocols ldp interface ge-2/0/0.0

set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 encapsulation flexible-ethernet-services
set interfaces ge-1/0/0 unit 1 vlan-id 10
set interfaces ge-1/0/0 unit 1 family bridge

set interfaces ge-2/0/0 unit 0 family inet address 192.168.10.1/24
set protocols mpls interface ge-2/0/0.0

set interfaces lo0 unit 1 family inet address 1.1.1.9/32

set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0