set system host-name LSRC

set protocols mpls label-protocol ldp

set interfaces ge-0/0/0 unit 0 family inet address 10.3.1.1/24
set interfaces ge-0/0/0 unit 0 family inet mpls

set interfaces ge-0/0/1 unit 0 family inet address 10.2.1.2/24
set interfaces ge-0/0/1 unit 0 family inet mpls

set interfaces lo0 unit 0 family inet address 3.3.3.9/32

set protocols isis level 2-only net 00.0005.0000.0000.0003.00
set protocols isis metric-style wide
set protocols isis traffic-eng level-2

set protocols mpls traffic-eng router-id lo0
set protocols mpls traffic-eng
set protocols mpls rsvp-te

set routing-options static route 10.2.1.0/24 next-hop 10.3.1.1
set routing-options static route 10.3.1.0/24 next-hop 10.2.1.2

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0