set system host-name NPE

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:1

set policy-options community vpn-target-1 members target:1:1
set policy-options community vpn-target-2 members target:2:2
set policy-options policy-statement vpn1-import then community add vpn-target-1
set policy-options policy-statement vpn1-import then community add vpn-target-2
set policy-options policy-statement vpn1-import then accept
set policy-options policy-statement vpn1-export then community add vpn-target-1
set policy-options policy-statement vpn1-export then community add vpn-target-2
set policy-options policy-statement vpn1-export then accept

set protocols ldp
set protocols ldp interface lo0.1
set protocols isis
set protocols isis level 1 wide-metrics-only

set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols isis interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 0 family inet address 192.168.30.1/24
set routing-instances vpn1 interface ge-2/0/0.0

set interfaces lo0 unit 1 family inet address 3.3.3.3/32
set protocols isis interface lo0.1 passive

set protocols bgp group internal type internal
set protocols bgp group internal local-address 3.3.3.3
set protocols bgp group internal neighbor 2.2.2.2
set protocols bgp group internal peer-as 100
set protocols bgp group internal family inet unicast
set protocols bgp group internal family inet-vpn unicast

set policy-options prefix-list default 0.0.0.0/0
set policy-options policy-statement SPE term deny from protocol static
set policy-options policy-statement SPE term deny from prefix-list default
set policy-options policy-statement SPE term deny then reject
set policy-options policy-statement SPE term permit then accept
set routing-options static route 0.0.0.0/0 discard