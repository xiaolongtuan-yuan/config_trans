set system host-name CE4

set interfaces ge-0/0/0 unit 0 family inet address 172.16.2.1/24

set protocols bgp group neighbor-172.16.2.2 type external
set protocols bgp group neighbor-172.16.2.2 peer-as 300
set protocols bgp group neighbor-172.16.2.2 neighbor 172.16.2.2
set protocols bgp group neighbor-172.16.2.2 family inet unicast

set policy-options policy-statement EXPORT-DIRECT term 1 from protocol direct
set policy-options policy-statement EXPORT-DIRECT term 1 then accept
set protocols bgp group neighbor-172.16.2.2 export EXPORT-DIRECT

set routing-options static route 172.16.2.0/24 discard