set system host-name CE1

set vlans v100 vlan-id 100
set vlans v100 interface ge-1/0/0.0
set vlans v100 interface ae0.0

set interfaces ae0 aggregated-ether-options minimum-links 1
set interfaces ae0 unit 0 family ethernet-switching
set interfaces ae0 unit 0 family ethernet-switching vlan members 100

set interfaces ge-1/0/0 ether-options 802.3ad ae0
set interfaces ge-1/0/0 disable