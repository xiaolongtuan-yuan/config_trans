set system host-name CE3

set vlans vlan1-1000 vlan-id-list [ 1-1000 ]

set interfaces ge-1/0/1 unit 0 family ethernet-switching interface-mode access
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members vlan7
set interfaces ge-1/0/1 unit 0 vlan-id-stack 1

set interfaces ge-1/0/2 unit 0 family ethernet-switching interface-mode access
set interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members vlan7
set interfaces ge-1/0/2 unit 0 vlan-id-stack 1000

set interfaces ge-1/0/3 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/3 unit 0 family ethernet-switching vlan members vlan1-1000