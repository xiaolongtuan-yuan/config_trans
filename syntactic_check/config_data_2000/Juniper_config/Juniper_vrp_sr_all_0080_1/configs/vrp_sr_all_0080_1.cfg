set system host-name P1

set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0
set protocols ldp interface ge-0/0/1.0
set protocols rsvp interface ge-0/0/1.0

set protocols isis interface ge-0/0/0.0 passive
set protocols isis interface ge-0/0/1.0 passive
set protocols isis interface lo0.0

set interfaces ge-0/0/0 unit 0 family inet address 10.11.1.2/24
set interfaces ge-0/0/1 unit 0 family inet address 10.12.1.1/24
set interfaces lo0 unit 0 family inet address 2.2.2.9/32

set routing-options static route 0.0.0.0/0 next-hop 10.12.1.2