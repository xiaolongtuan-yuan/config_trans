set system host-name PE2
set protocols mpls lsr-id 3.3.3.9
set protocols mpls
set protocols l2vpn
set protocols ldp router-id lo0.0
set interfaces ge-1/0/0 unit 0 family inet
set interfaces ge-1/0/0 unit 0 encapsulation ethernet-vpls
set interfaces ge-1/0/0 unit 0 l2vpn vpls-id 100
set interfaces ge-2/0/0 unit 0 family inet address 192.168.10.2/24
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 3.3.3.9/32
set protocols bgp group vpnv4 type external
set protocols bgp group vpnv4 local-address lo0.0
set protocols bgp group vpnv4 peer-as 100
set protocols bgp group vpnv4 neighbor 1.1.1.9 family inet-vpn signaling
set protocols bgp group vpnv4 neighbor 1.1.1.9 family l2vpn signaling
set routing-instances vpn1 instance-type vpls
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target target:200:1 export
set routing-instances vpn1 vrf-target target:200:1 import
set routing-instances vpn1 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0