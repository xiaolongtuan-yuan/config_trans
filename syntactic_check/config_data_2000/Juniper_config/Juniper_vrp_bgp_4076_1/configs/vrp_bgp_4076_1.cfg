set system host-name DeviceB

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/24

set routing-options router-id 2.2.2.2
set routing-options autonomous-system 65002

set protocols bgp group CONFED-PEER type internal
set protocols bgp group CONFED-PEER local-address 10.1.1.2
set protocols bgp group CONFED-PEER peer-as 65001
set protocols bgp group CONFED-PEER neighbor 10.1.1.1
set protocols bgp group CONFED-PEER family inet unicast