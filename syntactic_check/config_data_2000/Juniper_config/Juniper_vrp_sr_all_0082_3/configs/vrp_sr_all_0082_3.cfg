set system host-name P2
set protocols mpls label-switched-path protocol ldp
set protocols mpls ldp router-id lo0.0 force
set protocols mpls ldp hello hold-time 5
set protocols mpls ldp hello interval 1
set protocols mpls ldp targeted-hello hold-time 5
set protocols mpls ldp targeted-hello interval 1
set protocols mpls ldp targeted-hello accept

set interfaces ge-1/0/0 unit 0 family inet address 10.13.1.2/24
set interfaces ge-1/0/0 unit 0 family iso
set protocols isis interface ge-1/0/0 level 1

set interfaces ge-2/0/0 unit 0 family inet address 10.14.1.1/24
set interfaces ge-2/0/0 unit 0 family iso
set protocols isis interface ge-2/0/0 level 1

set interfaces lo0 unit 0 family inet address 4.4.4.9/32
set interfaces lo0 unit 0 family iso
set protocols isis interface lo0.0 level 1

set protocols isis level 1 wide-metrics-only
set protocols isis network-entity 49.0000.0000.0004.00
set protocols isis segment-routing mpls
set protocols isis segment-routing adjacency-sid 10.13.1.2 local 330002
set protocols isis segment-routing adjacency-sid 10.14.1.1 local 330003