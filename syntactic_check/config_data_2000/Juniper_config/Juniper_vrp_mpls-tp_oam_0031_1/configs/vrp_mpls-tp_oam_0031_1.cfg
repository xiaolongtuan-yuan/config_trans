set system host-name LSRB
set protocols mpls
set protocols mpls ldp
set protocols ldp router-id lo0.0
set interfaces ge-1/0/0 unit 0 family inet address 2.1.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 0 mpls traffic-engineering
set interfaces ge-2/0/0 unit 0 family inet address 3.2.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 mpls traffic-engineering
set interfaces lo0 unit 1 family inet address 2.2.2.2/32
set routing-options static route 1.1.1.1/32 next-hop 2.1.1.1
set routing-options static route 3.3.3.3/32 next-hop 3.2.1.2
set protocols mpls traffic-engineering
set protocols mpls traffic-engineering lsp tunnel-1 destination 3.2.1.2
set protocols mpls traffic-engineering lsp tunnel-1 autoroute announce
set protocols mpls traffic-engineering lsp tunnel-2 destination 2.1.1.1
set protocols mpls traffic-engineering lsp tunnel-2 autoroute announce
set protocols mpls traffic-engineering refresh-interval 5
set protocols mpls static-lsp lsp1 transit ingress-label 20 nexthop 3.2.1.2 egress-label 40
set protocols mpls static-lsp lsp1 transit ingress-label 16 nexthop 2.1.1.1 egress-label 20