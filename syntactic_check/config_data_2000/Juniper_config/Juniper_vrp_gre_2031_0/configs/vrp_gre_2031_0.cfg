set system host-name DeviceA

set interfaces ge-0/0/0 unit 0 family inet address 172.20.1.1/24
set interfaces ge-0/0/0 unit 0 family inet mtu 1500

set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.2/24

set interfaces gr-0/0/0 unit 0 family inet address 172.22.1.1/24
set interfaces gr-0/0/0 unit 0 tunnel source-address 172.20.1.1
set interfaces gr-0/0/0 unit 0 tunnel destination-address 172.21.1.2

set protocols ospf area 0 interface ge-0/0/0.0
set protocols ospf area 0 interface gr-0/0/0.0

set routing-options static route 10.2.1.0/24 next-hop gr-0/0/0.0