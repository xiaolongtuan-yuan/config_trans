set system host-name ASBR1

set protocols mpls label-protocol ldp
set protocols mpls mldp p2mp
set protocols mpls mldp recursive-fec

set routing-options router-id 2.2.2.2
set routing-instances instance1 interface ge-0/0/2 unit 0 family inet address 10.1.3.1/24
set routing-instances instance1 interface ge-0/0/1 unit 0 family inet address 10.1.2.2/24
set routing-instances instance1 interface lo0 unit 0 family inet address 2.2.2.2/32

set protocols isis level 2
set protocols isis level 2 network-entity 10.0000.0000.000c.00

set protocols bgp group external-neighbors type external
set protocols bgp group external-neighbors local-address 2.2.2.2
set protocols bgp group external-neighbors peer-as 200
set protocols bgp group external-neighbors neighbor 10.1.3.2 family inet unicast
set protocols bgp group external-neighbors neighbor 10.1.3.2 route-policy policy1 export
set protocols bgp group external-neighbors neighbor 10.1.3.2 label-route-capability

set protocols bgp group internal-neighbors type external
set protocols bgp group internal-neighbors local-address 2.2.2.2
set protocols bgp group internal-neighbors peer-as 100
set protocols bgp group internal-neighbors neighbor 1.1.1.1 family inet unicast
set protocols bgp group internal-neighbors neighbor 1.1.1.1 route-policy policy2 export
set protocols bgp group internal-neighbors neighbor 1.1.1.1 label-route-capability

set routing-options static route 3.3.3.3/32 next-hop 10.1.3.2

set policy-options policy-statement policy1 term 1 from protocol mpls
set policy-options policy-statement policy1 term 1 then accept

set policy-options policy-statement policy2 term 1 from protocol mpls
set policy-options policy-statement policy2 term 1 then accept