set system host-name ASBR1

set interfaces ge-1/0/2 unit 0 family inet address 10.0.7.5/24
set interfaces ge-1/0/2 unit 0 mpls
set interfaces ge-1/0/2 unit 0 mpls ldp autoconfig

set interfaces ge-1/0/4 unit 0 family inet address 10.0.2.5/24
set interfaces ge-1/0/4 unit 0 mpls
set interfaces ge-1/0/4 unit 0 mpls ldp autoconfig

set interfaces lo0 unit 0 family inet address 1.1.1.2/32

set routing-options static route 1.1.1.3/32 next-hop 10.0.7.7

set protocols bgp group AS100 neighbor 10.0.7.7 remote-as 200
set protocols bgp group AS100 neighbor 1.1.1.1 remote-as 100
set protocols bgp group AS100 neighbor 1.1.1.1 update-source lo0
set protocols bgp group AS100 address-family inet unicast neighbor 10.0.7.7
set protocols bgp group AS100 address-family inet unicast neighbor 1.1.1.1
set protocols bgp group AS100 address-family ipv6 mvpn neighbor 10.0.7.7
set protocols bgp group AS100 address-family ipv6 mvpn neighbor 1.1.1.1
set protocols bgp group AS100 address-family vpnv6 neighbor 10.0.7.7
set protocols bgp group AS100 address-family vpnv6 neighbor 1.1.1.1

set protocols ospf area 0 interface ge-1/0/4.0
set protocols ospf area 0 interface lo0.0

set mpls lsr-id 1.1.1.2
set mpls ldp mldp p2mp
set mpls ldp mldp recursive-fec