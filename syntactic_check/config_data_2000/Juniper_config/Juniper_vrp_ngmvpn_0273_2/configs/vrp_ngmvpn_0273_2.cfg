set system host-name ASBR1

set interfaces ge-1/0/2 unit 0 family inet address 10.0.7.5/24
set interfaces ge-1/0/2 unit 0 family mpls

set interfaces ge-1/0/4 unit 0 family inet address 10.0.2.5/24
set interfaces ge-1/0/4 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 1.1.1.2/32

set routing-options static route 1.1.1.3/32 next-hop 10.0.7.7

set protocols bgp group AS100 type external
set protocols bgp group AS100 neighbor 10.0.7.7 peer-as 200
set protocols bgp group AS100 neighbor 10.0.7.7 local-address 10.0.7.5
set protocols bgp group AS100 neighbor 1.1.1.1 peer-as 100
set protocols bgp group AS100 neighbor 1.1.1.1 local-address 1.1.1.2
set protocols bgp group AS100 family inet unicast
set protocols bgp group AS100 family inet6-vpn unicast

set protocols ospf area 0 interface ge-1/0/4.0
set protocols ospf area 0 interface lo0.0 passive

set protocols mpls interface ge-1/0/2.0
set protocols mpls interface ge-1/0/4.0

set protocols ldp interface ge-1/0/2.0
set protocols ldp interface ge-1/0/4.0
set protocols ldp p2mp