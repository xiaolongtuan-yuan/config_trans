set system host-name DeviceA
set protocols spanning-tree mstp mode rapid-pvst
set protocols spanning-tree mstp instance 0 root primary
set protocols spanning-tree mstp path-cost-standard legacy
set protocols spanning-tree mstp enable
!
set interfaces ge-0/0/1 unit 0 family ethernet-switching
set interfaces ge-0/0/1 unit 0 family ethernet-switching storm-control
set interfaces ge-0/0/1 unit 0 family ethernet-switching spanning-tree root-protection
set interfaces ge-0/0/1 unit 0 family ethernet-switching no shutdown
!
set interfaces ge-0/0/2 unit 0 family ethernet-switching
set interfaces ge-0/0/2 unit 0 family ethernet-switching storm-control
set interfaces ge-0/0/2 unit 0 family ethernet-switching spanning-tree root-protection
set interfaces ge-0/0/2 unit 0 family ethernet-switching no shutdown
!