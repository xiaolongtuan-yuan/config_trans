set system host-name DeviceC

set interfaces ge-0/0/1 unit 0 family inet address 172.16.4.2/24
set interfaces ge-0/0/3 unit 0 family inet address 172.16.5.1/24

set routing-options router-id 3.3.3.3

set protocols bgp group 200 type external
set protocols bgp group 200 peer-as 65009
set protocols bgp group 200 neighbor 172.16.4.1
set protocols bgp group 200 neighbor 172.16.5.2

set protocols bgp group 200 family inet unicast

set policy-options policy-statement EXPORT-POLICY term 1 from protocol direct
set policy-options policy-statement EXPORT-POLICY term 1 then accept

set protocols bgp group 200 export EXPORT-POLICY