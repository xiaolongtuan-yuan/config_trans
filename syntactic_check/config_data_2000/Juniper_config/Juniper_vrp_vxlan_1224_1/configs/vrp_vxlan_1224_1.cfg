set system host-name Leaf1

set vlans v10 vlan-id 10
set vlans v10 vxlan vni 10
set vlans v10 l3-interface vlan.10

set bridge-domains bd10 vlan-id 10
set bridge-domains bd10 vxlan vni 10
set bridge-domains bd10 routing-interface vlan.10

set protocols evpn instance evrf1 bd-mode
set protocols evpn instance evrf1 route-distinguisher 10:1
set protocols evpn instance evrf1 vrf-target target:11:1 export
set protocols evpn instance evrf1 vrf-target target:11:1 import

set interfaces ge-1/0/0 unit 0 family inet address 192.168.10.2/24
set interfaces ge-2/0/0 unit 0
set interfaces ge-2/0/0 unit 1 vlan-id 10 family ethernet-switching interface-mode trunk

set interfaces lo0 unit 1 family inet address 1.1.1.1/32

set interfaces nve1 source-address 1.1.1.1
set interfaces nve1 vni 10 ingress-replication protocol bgp

set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-1/0/0

set protocols bgp group evpn type internal
set protocols bgp group evpn neighbor 2.2.2.2 peer-as 100
set protocols bgp group evpn local-address 1.1.1.1
set protocols bgp group evpn family evpn signaling
set protocols bgp group evpn family evpn encapsulation-type vxlan