set system host-name RR

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0

set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0

set interfaces ge-1/0/0 unit 0 family inet address 192.168.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces ge-2/0/0 unit 0 family inet address 192.168.10.1/24
set interfaces ge-2/0/0 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols ospf area 0 interface ge-1/0/0.0
set protocols ospf area 0 interface ge-2/0/0.0
set protocols ospf area 0 interface lo0.0 passive
set protocols ospf traffic-engineering

set protocols bgp group RR type internal
set protocols bgp group RR local-address 2.2.2.2
set protocols bgp group RR neighbor 1.1.1.1 peer-as 100
set protocols bgp group RR neighbor 3.3.3.3 peer-as 100
set protocols bgp group RR family inet unicast
set protocols bgp group RR family inet-vpn unicast
set protocols bgp group RR cluster 2.2.2.2
