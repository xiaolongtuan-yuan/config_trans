set system host-name P  

set protocols ldp interface ge-0/0/0.0  
set protocols ldp interface ge-0/0/1.0  
set protocols ldp router-id 2.2.2.2  

set interfaces ge-0/0/0 unit 0 family inet address 192.168.1.2/24  
set interfaces ge-0/0/0 unit 0 family mpls  

set interfaces ge-0/0/1 unit 0 family inet address 192.168.10.1/24  
set interfaces ge-0/0/1 unit 0 family mpls  

set interfaces lo0 unit 0 family inet address 2.2.2.2/32  

set routing-options router-id 2.2.2.2  

set protocols ospf traffic-engineering  
set protocols ospf area 0.0.0.0 interface lo0.0 passive  
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0  
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0  

set protocols mpls interface ge-0/0/0.0  
set protocols mpls interface ge-0/0/1.0  
set protocols rsvp interface ge-0/0/0.0  
set protocols rsvp interface ge-0/0/1.0  

set policy-options policy-statement ospf-mpls-te term 1 from protocol ospf  
set policy-options policy-statement ospf-mpls-te term 1 then accept  
set routing-options forwarding-table export ospf-mpls-te  