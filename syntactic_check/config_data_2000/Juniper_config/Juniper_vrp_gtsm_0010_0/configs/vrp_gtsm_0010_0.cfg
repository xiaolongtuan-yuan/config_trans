set system host-name DeviceA

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0 network 192.168.0.0/24
set protocols ospf area 0.0.0.1 interface ge-0/0/1.0 network 192.168.1.0/24

set protocols ospf router-id 1.1.1.1
set protocols ospf reference-bandwidth 10000

set interfaces ge-0/0/0 unit 0 family inet address 192.168.0.1/24
set interfaces ge-0/0/1 unit 0 family inet address 192.168.1.1/24

set protocols ospf ttl-security hops 1