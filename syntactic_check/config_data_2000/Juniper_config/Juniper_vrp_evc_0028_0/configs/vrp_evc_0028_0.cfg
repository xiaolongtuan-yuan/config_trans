set system host-name PE1

set vlans 10

set protocols mpls label-protocol ldp

set protocols mpls ip

set interfaces ge-0/0/0 unit 0 family ethernet-switching

set interfaces ge-0/0/0.1 unit 0 family ethernet-switching vlan-id 10
set interfaces ge-0/0/0.1 unit 0 encapsulation vlan-encapsulation
set interfaces ge-0/0/0.1 unit 0 mpls l2vc 2.2.2.9 100 raw

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls

set protocols ospf area 0.0.0.0
set protocols ospf area 0.0.0.0 network 1.1.1.9/32
set protocols ospf area 0.0.0.0 network 10.1.1.0/24