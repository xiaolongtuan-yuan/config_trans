set system host-name CE2

set interfaces ge-0/0/0 unit 0 family inet address 10.2.1.2/24
set interfaces ge-0/0/1 unit 0 family inet address 10.3.1.2/24
set interfaces lo0 unit 0 family inet address 22.22.22.22/32

set routing-options autonomous-system 65420
set routing-options router-id 22.22.22.22

set protocols bgp group peer-group-1 type external
set protocols bgp group peer-group-1 peer-as 100
set protocols bgp group peer-group-1 neighbor 10.2.1.1
set protocols bgp group peer-group-1 neighbor 10.3.1.1
set protocols bgp group peer-group-1 family inet unicast
set protocols bgp group peer-group-1 export advertise-loopback