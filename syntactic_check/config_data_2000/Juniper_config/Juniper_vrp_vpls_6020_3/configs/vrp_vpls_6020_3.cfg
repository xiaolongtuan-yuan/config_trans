set system host-name PE1

set routing-instances vsi1 instance-type l2vpn
set routing-instances vsi1 interface ge-0/0/0.0
set routing-instances vsi1 route-distinguisher 100:1

set protocols ldp interface ge-0/0/0.0
set protocols ldp neighbor 2.2.2.2 targeted

set interfaces ge-0/0/0 flexible-vlan-tagging
set interfaces ge-0/0/0 encapsulation vlan
set interfaces ge-0/0/0 unit 0 vlan-id 10
set interfaces ge-0/0/0 unit 0 family bridge
set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0