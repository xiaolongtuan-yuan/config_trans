set system host-name PE2

set protocols mpls label-protocol ldp
set protocols mpls ldp router-id 2.2.2.9

set protocols mpls l2vpn
set protocols mpls l2vpn vfi ldp1 manual
set protocols mpls l2vpn vfi ldp1 vpn-id 2
set protocols mpls l2vpn vfi ldp1 neighbor 1.1.1.9 pw-id 2
set protocols mpls l2vpn vfi ldp1 neighbor 3.3.3.9 pw-id 2

set interfaces ge-0/0/1 unit 0 family inet address 192.168.2.2/30
set interfaces ge-0/0/2 unit 0 family inet address 192.168.3.2/30
set interfaces lo0 unit 0 family inet address 2.2.2.9/32

set interfaces ge-0/0/1.10 unit 0 family inet address 0.0.0.0/0
set interfaces ge-0/0/1.10 encapsulation vlan-bridge vlan-id 10
set interfaces ge-0/0/1.10 encapsulation vlan-bridge vlan-id 20
set interfaces ge-0/0/1.10 l2-binding vsi ldp1

set protocols ospf area 0 interface ge-0/0/2.0
set protocols ospf area 0 interface ge-0/0/3.0
set protocols ospf area 0 interface lo0 unit 0

set policy-options policy-statement ospf-vpnv4 term 1 from protocol direct
set policy-options policy-statement ospf-vpnv4 term 1 then accept