set system host-name ASBR1  

set routing-instances vpn1 instance-type vrf  
set routing-instances vpn1 route-distinguisher 100:2  
set routing-instances vpn1 vrf-target export target:1:1  
set routing-instances vpn1 vrf-target import target:1:1  
  
set protocols ldp interface ge-0/0/0.0  
set protocols ldp router-id 2.2.2.9  

set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.1/24  
set interfaces ge-0/0/0 unit 0 family mpls  

set interfaces ge-0/0/1 unit 0 family inet address 12.12.12.1/24  
set routing-instances vpn1 interface ge-0/0/1.0  

set interfaces lo0 unit 0 family inet address 2.2.2.9/32  

set protocols bgp group external-neighbor type external  
set protocols bgp group external-neighbor local-address 2.2.2.9  
set protocols bgp group external-neighbor family inet-vpn unicast   

set protocols ospf area 0.0.0.0 interface lo0.0 passive  
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0  