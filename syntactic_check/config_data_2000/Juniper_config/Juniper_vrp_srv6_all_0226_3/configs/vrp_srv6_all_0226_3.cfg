set system host-name Tail

set routing-instances vpna instance-type vrf
set routing-instances vpna route-distinguisher 500:1
set routing-instances vpna vrf-target target:111:1

set protocols mpls interface ge-0/0/0.0

set interfaces ge-0/0/1 unit 0 family inet address 10.5.1.2/30

set protocols isis interface ge-0/0/0.0
set protocols isis interface lo0.0 passive
set protocols isis level 1 wide-metrics-only
