set system host-name PE2

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 interface ge-0/0/1.0

set protocols mpls interface ge-0/0/0.0
set protocols ldp interface ge-0/0/0.0

set interfaces ge-0/0/0 unit 0 family inet address 10.162.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family inet address 10.2.1.2/24
set interfaces lo0 unit 0 family inet address 4.4.4.9/32

set protocols bgp group PEER-TO-CORE type external
set protocols bgp group PEER-TO-CORE local-address 4.4.4.9
set protocols bgp group PEER-TO-CORE neighbor 1.1.1.9
set protocols bgp group PEER-TO-CORE peer-as 100
set protocols bgp group PEER-TO-CORE family inet unicast
set protocols bgp group PEER-TO-CORE family inet-vpn unicast

set protocols bgp group CE-PEER local-address 10.2.1.2
set protocols bgp group CE-PEER neighbor 10.2.1.1
set protocols bgp group CE-PEER peer-as 65002
set protocols bgp group CE-PEER family inet unicast

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0