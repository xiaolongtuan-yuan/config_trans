set system host-name LSRF

set protocols mpls label-switched-path protocol ldp
set protocols mpls ldp router-id lo0.0 force
set protocols mpls traffic-engineering tunnels
set protocols mpls traffic-engineering cspf

set interfaces ge-1/0/0 unit 0 family inet address 10.1.7.2/24
set protocols mpls interface ge-1/0/0
set protocols mpls rsvp interface ge-1/0/0

set interfaces ge-1/0/1 unit 0 family inet address 10.1.5.2/24
set protocols mpls interface ge-1/0/1
set protocols mpls rsvp interface ge-1/0/1

set interfaces lo0 unit 0 family inet address 6.6.6.6/32

set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-1/0/0
set protocols ospf area 0 interface ge-1/0/1
set protocols ospf traffic-engineering