set system host-name PE1

set protocols mpls label-protocol ldp
set protocols mpls lsr-id 1.1.1.1
set protocols mpls l2vpn

set interfaces ge-0/0/1 unit 1 family ethernet-switching vlan members 1
set interfaces ge-0/0/1 unit 1 encapsulation vlan-ccc
set interfaces ge-0/0/1 unit 1 family mpls
set interfaces ge-0/0/1 unit 1 xconnect 2.2.2.2 1001 encapsulation mpls

set interfaces ge-0/0/2 unit 0 family inet address 192.168.1.1/24
set interfaces ge-0/0/2 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 1.1.1.1/24

set protocols ospf area 0 interface ge-0/0/1.1 network 1.1.1.1/32
set protocols ospf area 0 interface ge-0/0/2.0 network 192.168.1.0/24

set protocols cfm md md1
set protocols cfm md md1 ma ma1
set protocols cfm md md1 ma ma1 mep 1 interface ge-0/0/1.1 inward
set protocols cfm md md1 ma ma1 mep 1 ccm-send mep-id 1 enable
set protocols cfm md md1 ma ma1 remote-mep 2
set protocols cfm md md1 ma ma1 remote-mep ccm-receive mep-id 2 enable
set protocols cfm md md1 ma ma1 test-id 1 mep 1 remote-mep 2
set protocols cfm md md1 ma ma1 test-id 2 mep 1 delay-measure two-way receive test-id 2