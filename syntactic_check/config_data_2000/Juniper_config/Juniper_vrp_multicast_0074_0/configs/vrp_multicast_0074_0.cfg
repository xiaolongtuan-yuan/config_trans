set system host-name DeviceC

set routing-options prefix-list list-df 192.168.0.0/16 through 192.168.255.255/32

set interfaces ge-1/0/0 unit 0 family inet address 192.168.1.1/24
set interfaces ge-1/0/0 unit 0 family inet pim-mode sparse

set interfaces ge-2/0/0 unit 0 family inet address 192.168.4.1/24
set interfaces ge-2/0/0 unit 0 family inet pim-mode sparse

set interfaces lo0 unit 0 family inet address 1.1.1.1/32
set interfaces lo0 unit 0 family inet pim-mode sparse

set protocols pim rp static address 1.1.1.1
set protocols pim bsr-candidate lo0.0
set protocols pim rp-candidate lo0.0

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0

set protocols msdp peer 192.168.3.2 local-address ge-1/0/0.0
set protocols msdp peer 192.168.5.1 local-address ge-2/0/0.0
set protocols msdp rp-address 1.1.1.1
set protocols msdp sa-filter-in prefix-list list-df
set protocols msdp sa-filter-out prefix-list list-df
set protocols msdp originator-id lo0.0