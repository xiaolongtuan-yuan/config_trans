set system host-name Device3

set routing-instances EVPN-RI instance-type virtual-switch
set routing-instances EVPN-RI route-distinguisher 31:2
set routing-instances EVPN-RI vrf-target target:2:2

set routing-instances EVPN-RI bridge-domains BD20 vlan-id 20
set routing-instances EVPN-RI bridge-domains BD20 vxlan vni 5020

set interfaces ge-1/0/1 unit 0 family inet address 192.168.2.2/24
set interfaces ge-1/0/2 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members 20

set interfaces lo0 unit 1 family inet address 4.4.4.4/32

set protocols bgp group EVPN type internal
set protocols bgp group EVPN local-address 4.4.4.4
set protocols bgp group EVPN family evpn signaling
set protocols bgp group EVPN neighbor 2.2.2.2 peer-as 100
set protocols bgp group EVPN neighbor 3.3.3.3 peer-as 100

set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-1/0/1.0