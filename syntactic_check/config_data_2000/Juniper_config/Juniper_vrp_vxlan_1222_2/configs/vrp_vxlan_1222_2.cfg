set system host-name Device3
set routing-instances evrf4 instance-type evpn
set routing-instances evrf4 route-distinguisher 31:2
set routing-instances evrf4 vrf-target target:2:2 export
set routing-instances evrf4 vrf-target target:2:2 import
set vlans vlan20 vlan-id 20
set vlans vlan20 vxlan vni 5020
set vlans vlan20 l2vpn-binding evrf4
set vlans vlan20 vxlan split-horizon
set interfaces ge-1/0/1 unit 0 family inet address 192.168.2.2/24
set interfaces ge-1/0/2 unit 20 encapsulation vlan-bridge vlan-id 20
set interfaces ge-1/0/2 unit 20 family bridge interface-mode trunk
set interfaces ge-1/0/2 unit 20 bridge-domain vlan20
set interfaces lo0 unit 1 family inet address 4.4.4.4/32
set interfaces nve1 source-address 4.4.4.4
set interfaces nve1 vni 5020
set interfaces nve1 encapsulation vxlan
set interfaces nve1 routing-instances evrf4
set protocols bgp group evpn type external
set protocols bgp group evpn local-address lo0.1
set protocols bgp group evpn neighbor 2.2.2.2 peer-as 100
set protocols bgp group evpn neighbor 3.3.3.3 peer-as 100
set protocols bgp group evpn family inet unicast
set protocols bgp group evpn neighbor 2.2.2.2 family inet unicast
set protocols bgp group evpn neighbor 3.3.3.3 family inet unicast
set protocols bgp group evpn family evpn signaling
set protocols bgp group evpn neighbor 2.2.2.2 family evpn signaling
set protocols bgp group evpn neighbor 3.3.3.3 family evpn signaling
set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-1/0/1.0