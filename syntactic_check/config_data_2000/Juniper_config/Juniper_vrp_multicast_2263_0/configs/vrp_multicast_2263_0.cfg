set system host-name PE1

set protocols pim interface all mode sparse
set protocols mpls label-switched-path protocol ldp

set interfaces ge-1/0/0 unit 0 family inet address 192.168.1.1/24
set protocols pim interface ge-1/0/0
set protocols mpls interface ge-1/0/0
set protocols mpls ldp interface ge-1/0/0

set interfaces lo0 unit 1 family inet address 1.1.1.1/32
set protocols pim interface lo0.1

set protocols ospf area 0 interface ge-1/0/0
set protocols ospf area 0 interface lo0.1
set protocols ospf router-id 1.1.1.1

set protocols bgp group internal type internal
set protocols bgp group internal neighbor 3.3.3.3 peer-as 100
set protocols bgp group internal local-address 1.1.1.1
set protocols bgp group internal family inet unicast
set protocols bgp group internal family inet-vpn