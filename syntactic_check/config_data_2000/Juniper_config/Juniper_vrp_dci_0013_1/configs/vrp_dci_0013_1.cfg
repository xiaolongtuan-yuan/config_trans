set system host-name RR  
 
set protocols ldp interface ge-0/0/0.0  
set protocols ldp interface ge-0/0/1.0  
 
set interfaces ge-0/0/0 unit 0 family inet address 192.168.1.2/24  
set interfaces ge-0/0/0 unit 0 family mpls  

set interfaces ge-0/0/1 unit 0 family inet address 192.168.10.1/24  
set interfaces ge-0/0/1 unit 0 family mpls  

set interfaces lo0 unit 0 family inet address 2.2.2.2/32  
  
set protocols bgp group neighbor-1.1.1.1 type external  
set protocols bgp group neighbor-1.1.1.1 local-address 2.2.2.2  
set protocols bgp group neighbor-1.1.1.1 family inet-vpn unicast  
set protocols bgp group neighbor-1.1.1.1 peer-as 100  

set protocols bgp group neighbor-3.3.3.3 type external  
set protocols bgp group neighbor-3.3.3.3 local-address 2.2.2.2  
set protocols bgp group neighbor-3.3.3.3 family inet-vpn unicast  
set protocols bgp group neighbor-3.3.3.3 peer-as 100  
 
set protocols ospf area 0.0.0.0 interface lo0.0 passive  
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0  
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0  
 
set routing-options static route 10.1.1.0/24 next-hop 192.168.1.1  