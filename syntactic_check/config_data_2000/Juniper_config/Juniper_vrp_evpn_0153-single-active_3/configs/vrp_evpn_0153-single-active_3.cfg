set system host-name RR

set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0
set protocols mpls interface ge-0/0/2.0
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp interface ge-0/0/2.0
set protocols ldp router-id 3.3.3.3

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 10.2.1.2/24
set interfaces ge-0/0/1 unit 0 family mpls

set interfaces ge-0/0/2 unit 0 family inet address 10.3.1.1/24
set interfaces ge-0/0/2 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols bgp group peer-100 type internal
set protocols bgp group peer-100 local-address 3.3.3.3
set protocols bgp group peer-100 cluster 3.3.3.3
set protocols bgp group peer-100 neighbor 1.1.1.1
set protocols bgp group peer-100 neighbor 2.2.2.2
set protocols bgp group peer-100 neighbor 4.4.4.4
set protocols bgp group peer-100 family inet unicast
set protocols bgp group peer-100 family evpn signaling

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set bridge-domains EVPN domain-type bridge
set bridge-domains EVPN vlan-id all
set bridge-domains EVPN routing-interface irb.0
set protocols evpn encapsulation vxlan
set protocols evpn extended-vni-list all