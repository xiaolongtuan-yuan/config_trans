set system host-name PE3

set routing-instances vpna instance-type virtual-router
set routing-instances vpna interface ge-0/0/1.0
set routing-instances vpna routing-options static route 0.0.0.0/0 next-hop 10.3.1.1

set routing-options router-id 3.3.3.3
set routing-options autonomous-system 100

set protocols mpls interface ge-0/0/0.0
set protocols ldp interface ge-0/0/0.0

set interfaces ge-0/0/0 unit 0 family inet address 10.30.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 10.3.1.2/24

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols bgp group vpn type internal
set protocols bgp group vpn local-address 3.3.3.3
set protocols bgp group vpn neighbor 4.4.4.4
set protocols bgp group vpn family inet-vpn

set protocols ospf area 0 interface ge-0/0/0.0
set protocols ospf area 0 interface lo0.0 passive