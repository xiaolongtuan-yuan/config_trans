set system host-name PE3
set routing-instances vpna instance-type virtual-router
set routing-instances vpna route-distinguisher 100:3
set routing-instances vpna vrf-import 111:1
set routing-instances vpna vrf-export 111:1
!
set routing-options mpls lsr-id 3.3.3.3
set protocols mpls ldp
!
set interfaces ge-0/0/0 unit 0 family inet address 10.30.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 0 family mpls ldp discovery transport-address lo0.0
!
set interfaces ge-0/0/1 unit 0 family inet address 10.3.1.2/24
set interfaces ge-0/0/1 unit 0 family inet routing-instance vpna
!
set interfaces lo0 unit 0 family inet address 3.3.3.3/32
!
set protocols bgp group external type external
set protocols bgp group external local-address 3.3.3.3
set protocols bgp group external peer-as 100
set protocols bgp group external neighbor 4.4.4.4
set protocols bgp group external neighbor 4.4.4.4 update-source lo0.0
set protocols bgp group external family inet unicast
set protocols bgp group external neighbor 4.4.4.4 activate
set protocols bgp group external neighbor 4.4.4.4 next-hop-self
set protocols bgp group external family inet-vpnv4
set protocols bgp group external neighbor 4.4.4.4 activate
!
set protocols ospf area 0.0.0.0 network 3.3.3.3/32
set protocols ospf area 0.0.0.0 network 10.30.1.0/24
!