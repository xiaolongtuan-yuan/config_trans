set system host-name UPE

set protocols l2circuit neighbor 3.3.3.9 interface ge-1/0/0.1
set protocols l2circuit neighbor 3.3.3.9 virtual-circuit-id 101
set protocols l2circuit neighbor 3.3.3.9 encapsulation-type ethernet

set interfaces ge-1/0/0 unit 1 vlan-id 10
set interfaces ge-1/0/0 unit 1 family ccc 

set protocols mpls interface ge-2/0/0.0
set protocols ldp interface ge-2/0/0.0

set routing-options router-id 1.1.1.9

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0