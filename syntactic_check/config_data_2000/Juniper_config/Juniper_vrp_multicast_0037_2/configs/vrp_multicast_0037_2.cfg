set system host-name DeviceC

set interfaces ge-1/0/0 unit 0 family inet address 10.110.2.2/24
set protocols pim interface ge-1/0/0.0 mode sparse
set protocols igmp interface ge-1/0/0.0 version 3

set interfaces ge-2/0/0 unit 0 family inet address 192.168.3.1/24
set protocols pim interface ge-2/0/0.0 mode sparse

set policy-options policy-statement ssm-policy term allow-ssm from prefix-list ssm-allowed
set policy-options policy-statement ssm-policy then accept
set policy-options prefix-list ssm-allowed 232.1.1.0/24

set protocols pim ssm-translate-policy ssm-policy
set protocols pim static-rp 192.168.4.1 family inet