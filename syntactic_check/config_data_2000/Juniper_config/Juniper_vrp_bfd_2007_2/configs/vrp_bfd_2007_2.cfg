routing-options {
    router-id 3.3.3.3;
}

interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet6 {
                address 2001:db8:2::2/64;
            }
        }
    }
}

protocols {
    ospf3 {
        area 0.0.0.0 {
            interface ge-0/0/0.0;
        }
    }
    bfd {
        interface ge-0/0/0.0 {
            neighbor 2001:db8:1::1 {
                local-discriminator 2;
                remote-discriminator 1;
            }
        }
    }
}

system {
    scripts {
        commit {
            file configs/cfg_dsvpn_0015_00_0.cfg;
        }
    }
}