set system host-name GW1

set interfaces ge-1/0/0 unit 0 family inet address 192.168.20.2/24
set interfaces ge-2/0/0 unit 0 family inet address 192.168.40.1/24
set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set protocols bgp group internal type internal
set protocols bgp group internal neighbor 5.5.5.5 peer-as 65410
set protocols bgp group internal neighbor 5.5.5.5 local-address 4.4.4.4
set protocols bgp group external type external
set protocols bgp group external neighbor 192.168.20.1 peer-as 100
set protocols bgp group internal family inet unicast
set protocols bgp group external family inet unicast

set policy-options policy-statement EXPORT-OSPF term 1 from protocol ospf
set policy-options policy-statement EXPORT-OSPF term 1 then accept
set policy-options policy-statement EXPORT-LOOPBACK term 1 from route-filter 4.4.4.4/32 exact
set policy-options policy-statement EXPORT-LOOPBACK term 1 then accept

set protocols bgp group external export EXPORT-LOOPBACK

set protocols ospf area 0 interface lo0.0 passive
set protocols ospf area 0 interface ge-2/0/0.0

set policy-options policy-statement REDIST-BGP term 1 from protocol bgp
set policy-options policy-statement REDIST-BGP term 1 then accept
set protocols ospf export REDIST-BGP