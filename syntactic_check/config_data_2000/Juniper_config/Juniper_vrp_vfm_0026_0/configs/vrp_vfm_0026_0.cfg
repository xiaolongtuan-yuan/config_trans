set system host-name SSH_Server

set system login user client001 authentication encrypted-password "$1$abc123$xyz4567890abcdefghijk"  
set system login user client001 class super-user

set interfaces ge-0/0/0 unit 0 family inet address 10.137.217.223/16

set interfaces lo0 unit 0 family inet address 10.1.1.1/32

set system services ssh
set system services ssh protocol-version v2
set system services ssh connection-limit 10
set system services ssh root-login deny

set system login user client001 full-name "SSH Client Account"
set system login user client001 authentication ssh-rsa "ssh-rsa AAAAB3NzaC1yc2E..."  