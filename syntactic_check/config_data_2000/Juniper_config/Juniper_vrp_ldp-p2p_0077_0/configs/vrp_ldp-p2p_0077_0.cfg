set protocols mpls bfd-trigger-tunnel fec-list list1
set protocols mpls fec-list list1 fec-node 4.4.4.9

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set protocols mpls interface ge-1/0/0
set protocols mpls ldp interface ge-1/0/0
set protocols isis interface ge-1/0/0

set interfaces ge-1/0/1 unit 0 family inet address 10.1.2.1/24
set protocols mpls interface ge-1/0/1
set protocols mpls ldp interface ge-1/0/1
set protocols isis interface ge-1/0/1

set interfaces lo0 unit 0 family inet address 1.1.1.9/32
set protocols isis interface lo0.0
set protocols isis level 2 wide-metrics-only
set protocols isis network-entity 10.0000.0000.0001.00