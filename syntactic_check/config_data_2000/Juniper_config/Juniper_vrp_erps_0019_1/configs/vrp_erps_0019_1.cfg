set system host-name DeviceB

set vlans vlan10 vlan-id 10
set vlans vlan20 vlan-id 20
set vlans vlan100 vlan-id 100
set vlans vlan200 vlan-id 200
set vlans vlan300 vlan-id 300
set vlans vlan400 vlan-id 400

set protocols rstp bridge-priority 0
set protocols rstp interface ge-0/0/1 edge
set protocols rstp interface ge-0/0/2 edge
set protocols rstp vstp-vlan-list 10,20,100-200,300-400

set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members vlan10
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members vlan20
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members vlan100
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members vlan200

set interfaces ge-0/0/2 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/2 unit 0 family ethernet-switching vlan members vlan10
set interfaces ge-0/0/2 unit 0 family ethernet-switching vlan members vlan20
set interfaces ge-0/0/2 unit 0 family ethernet-switching vlan members vlan300
set interfaces ge-0/0/2 unit 0 family ethernet-switching vlan members vlan400

set interfaces ae1 aggregated-ether-options minimum-links 1
set interfaces ae1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/1 ether-options 802.3ad ae1
set interfaces ge-0/0/2 ether-options 802.3ad ae1