set system host-name DCI-PE2

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 200:1
set routing-instances vpn1 vrf-target target:111:1 export
set routing-instances vpn1 vrf-target target:111:1 import
set routing-instances vpn1 interface ge-1/0/0.0

set interfaces ge-1/0/0 unit 0 family inet address 192.168.30.1/24
set interfaces ge-1/0/0 unit 0 family inet-vpn vpn-instance vpn1

set interfaces ge-2/0/0 unit 0 family inet address 192.168.10.2/24
set interfaces ge-2/0/0 unit 0 family inet mpls
set protocols mpls interface ge-2/0/0.0
set protocols rsvp interface ge-2/0/0.0

set interfaces lo0 unit 1 family inet address 3.3.3.3/32

set interfaces gr-1/0/0 unit 10 tunnel source 3.3.3.3
set interfaces gr-1/0/0 unit 10 tunnel destination 1.1.1.1
set interfaces gr-1/0/0 unit 10 family inet address 3.3.3.3/32
set protocols mpls traffic-engineering tunnels gr-1/0/0.10

set protocols bgp group BGP-LSP type internal
set protocols bgp group BGP-LSP local-address 3.3.3.3
set protocols bgp group BGP-LSP peer-as 100
set protocols bgp group BGP-LSP neighbor 1.1.1.1 family inet unicast
set protocols bgp group BGP-LSP neighbor 1.1.1.1 family inet-vpn unicast send-community extended

set protocols bgp group BGP-VPN type external
set protocols bgp group BGP-VPN local-address 192.168.30.1
set protocols bgp group BGP-VPN peer-as 65420
set protocols bgp group BGP-VPN neighbor 192.168.30.2 family inet-vpn unicast

set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf mpls-traffic-engineering enable
set protocols ospf opaque-lsa enable

set protocols mpls traffic-engineering auto-route announce
set protocols mpls traffic-engineering load-balancing 1