set system host-name DeviceC

set routing-options router-id 3.3.3.3

set interfaces ge-0/0/0 unit 0 family inet address 172.16.6.1/24
set interfaces ge-0/0/2 unit 0 family inet address 172.16.2.1/24
set interfaces ge-0/0/3 unit 0 family inet address 172.16.4.2/24

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0
set protocols ospf area 0.0.0.0 interface ge-0/0/3.0

set routing-options static route 172.16.7.0/24 next-hop 172.16.6.2

set policy-options policy-statement OSPF-IMPORT term 1 from protocol static
set policy-options policy-statement OSPF-IMPORT term 1 then accept

set protocols ospf export OSPF-IMPORT