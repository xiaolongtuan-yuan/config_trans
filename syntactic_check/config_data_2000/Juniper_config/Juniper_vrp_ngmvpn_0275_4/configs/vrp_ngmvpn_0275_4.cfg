set system host-name ASBR2

set protocols mpls interface ge-0/0/1.0
set protocols mpls interface ge-0/0/3.0

set protocols ldp interface ge-0/0/1.0
set protocols ldp interface ge-0/0/3.0
set protocols ldp p2mp
set protocols ldp recursive-next-hop

set routing-options router-id 1.1.1.4
set routing-options static route 1.1.1.3/32 next-hop 10.0.16.1

set interfaces ge-0/0/1 unit 0 family inet address 10.0.10.4/24
set interfaces ge-0/0/1 unit 0 family mpls
set interfaces ge-0/0/3 unit 0 family inet address 10.0.16.2/24
set interfaces ge-0/0/3 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 1.1.1.4/32

set protocols isis interface ge-0/0/1.0 level 2 passive
set protocols isis interface ge-0/0/3.0 level 2 passive
set protocols isis interface lo0.0 level 2 passive

set protocols bgp group external type external
set protocols bgp group external local-address 1.1.1.4
set protocols bgp group external export EXPORT_POLICY
set protocols bgp group external peer-as 1
set protocols bgp group external neighbor 10.0.16.1
set protocols bgp group external neighbor 1.1.1.5
set protocols bgp group external neighbor 1.1.1.5 local-address 1.1.1.4
set protocols bgp group external family inet unicast
set protocols bgp group external family inet-vpn any
set protocols bgp group external family inet6-vpn any