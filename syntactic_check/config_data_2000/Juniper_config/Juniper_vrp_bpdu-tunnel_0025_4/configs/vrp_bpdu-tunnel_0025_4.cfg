set system host-name PE1

set vlans vlan100 vlan-id 100
set vlans vlan200 vlan-id 200

set protocols spanning-tree extend-system-id
set protocols spanning-tree mode rapid-pvst

set interfaces ge-1/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members vlan100
set interfaces ge-1/0/1 unit 0 family ethernet-switching spanning-tree portfast
set interfaces ge-1/0/1 unit 0 family ethernet-switching spanning-tree bpdu-filter

set interfaces ge-1/0/2 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members vlan200
set interfaces ge-1/0/2 unit 0 family ethernet-switching spanning-tree portfast
set interfaces ge-1/0/2 unit 0 family ethernet-switching spanning-tree bpdu-filter

set interfaces ge-1/0/3 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/3 unit 0 family ethernet-switching vlan members vlan100 vlan200
set interfaces ge-1/0/3 unit 0 family ethernet-switching spanning-tree portfast