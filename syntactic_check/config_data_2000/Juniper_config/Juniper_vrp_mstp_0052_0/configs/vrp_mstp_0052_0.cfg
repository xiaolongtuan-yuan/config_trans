set system host-name UPE1

set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0

set routing-instances s1 instance-type l2vpn
set routing-instances s1 interface ge-0/0/0.1
set routing-instances s1 protocols l2vpn encapsulation-type ethernet
set routing-instances s1 protocols l2vpn site CE1 site-identifier 1
set routing-instances s1 protocols l2vpn site CE1 interface ge-0/0/0.1
set routing-instances s1 protocols l2vpn neighbor 2.2.2.2 pw-id 100
set routing-instances s1 protocols l2vpn neighbor 3.3.3.3 pw-id 100

set interfaces ge-0/0/0 flexible-vlan-tagging
set interfaces ge-0/0/0 encapsulation flexible-ethernet-services
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 1 encapsulation vlan-vpls
set interfaces ge-0/0/0 unit 1 vlan-id 10
set interfaces ge-0/0/0 unit 1 family bridge interface-mode trunk

set interfaces ge-0/0/1 unit 0 family inet address 10.1.2.1/24
set interfaces ge-0/0/1 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive