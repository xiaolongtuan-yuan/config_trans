set system host-name PE1

set routing-instances a2 instance-type virtual-switch
set routing-instances a2 bridge-domains bd1 vlan-id 10
set routing-instances a2 bridge-domains bd1 interface ge-0/0/0.0

set interfaces ge-0/0/0 flexible-vlan-tagging
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members 10
set interfaces ge-0/0/0 unit 1 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 1 family mpls

set interfaces lo0 unit 0 family inet address 1.1.1.9/32
set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-0/0/0.1

set protocols mpls interface ge-0/0/0.1
set protocols ldp interface lo0.0
set protocols ldp interface ge-0/0/0.1
set protocols ldp targeted-neighbor 3.3.3.9