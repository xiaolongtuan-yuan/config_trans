set system host-name CE2

set interfaces ge-1/0/0 unit 0 family inet address 21.1.1.2/24
set interfaces ge-2/0/0 unit 0 family inet address 20.1.1.1/24
set interfaces lo0 unit 0 family inet address 5.5.5.9/32

delete set protocols ospf area 0.0.0.0 interface ge-1/0/0
delete set protocols ospf area 0.0.0.0 interface ge-2/0/0
delete set protocols ospf area 0.0.0.0 interface lo0
delete set protocols ospf redistribute bgp 300
delete set protocols ospf network 5.5.5.9/32 area 0.0.0.0
delete set protocols ospf network 20.1.1.0/24 area 0.0.0.0
delete set protocols ospf network 21.1.1.0/24 area 0.0.0.0

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set policy-options policy-statement EXPORT-BGP term 1 from protocol bgp
set policy-options policy-statement EXPORT-BGP term 1 then accept
set protocols ospf export EXPORT-BGP

delete set protocols bgp group external neighbor 21.1.1.1 remote-as 300
delete set protocols bgp group external neighbor 21.1.1.1 next-hop-self
delete set protocols bgp group external neighbor 21.1.1.1 export policy policy1
delete set protocols bgp group external neighbor 21.1.1.1 label-route-capability
delete set protocols bgp group external family inet unicast

set protocols bgp group external type external
set protocols bgp group external neighbor 21.1.1.1
set protocols bgp group external peer-as 300
set protocols bgp group external export policy1
set protocols bgp group external family inet unicast
set protocols bgp group external local-address 5.5.5.9
set protocols bgp group external multipath

delete set policy-options policy-statement policy1 term 1 then apply-mpls-label

set policy-options policy-statement policy1 term 1 from protocol ospf
set policy-options policy-statement policy1 term 1 then next-hop self
set policy-options policy-statement policy1 term 1 then accept

delete set mpls label-protocol ldp
delete set mpls lsr-id 5.5.5.9
delete set mpls ldp interface ge-1/0/0
delete set mpls ldp interface ge-2/0/0
delete set mpls ldp interface lo0
delete set mpls ldp advertise-labels
delete set mpls ldp discovery targeted-hello accept
delete set mpls traffic-eng tunnels autoroute announce
delete set mpls bgp forwarding
delete set mpls bgp forwarding with-ldp

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0

set protocols ldp
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0
set protocols ldp router-id 5.5.5.9
set protocols ldp deaggregate

set policy-options policy-statement PPLB then load-balance per-packet