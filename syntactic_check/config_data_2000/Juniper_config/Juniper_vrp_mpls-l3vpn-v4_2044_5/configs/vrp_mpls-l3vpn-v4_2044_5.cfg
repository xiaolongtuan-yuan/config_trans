set system host-name CE2

set interfaces ge-1/0/0 unit 0 family inet address 21.1.1.2/24
set interfaces ge-2/0/0 unit 0 family inet address 20.1.1.1/24
set interfaces lo0 unit 0 family inet address 5.5.5.9/32

set protocols ospf area 0.0.0.0 interface ge-1/0/0
set protocols ospf area 0.0.0.0 interface ge-2/0/0
set protocols ospf area 0.0.0.0 interface lo0
set protocols ospf redistribute bgp 300
set protocols ospf network 5.5.5.9/32 area 0.0.0.0
set protocols ospf network 20.1.1.0/24 area 0.0.0.0
set protocols ospf network 21.1.1.0/24 area 0.0.0.0

set protocols bgp group external neighbor 21.1.1.1 remote-as 300
set protocols bgp group external neighbor 21.1.1.1 next-hop-self
set protocols bgp group external neighbor 21.1.1.1 export policy policy1
set protocols bgp group external neighbor 21.1.1.1 label-route-capability
set protocols bgp group external family inet unicast

set policy-options policy-statement policy1 term 1 from protocol bgp
set policy-options policy-statement policy1 term 1 then apply-mpls-label

set mpls label-protocol ldp
set mpls lsr-id 5.5.5.9
set mpls ldp interface ge-1/0/0
set mpls ldp interface ge-2/0/0
set mpls ldp interface lo0
set mpls ldp advertise-labels
set mpls ldp discovery targeted-hello accept
set mpls traffic-eng tunnels autoroute announce

set mpls bgp forwarding
set mpls bgp forwarding with-ldp