set system host-name PE3

set protocols mpls interface ge-1/0/1.0
set protocols mpls interface ge-1/0/2.0
set protocols ldp interface ge-1/0/1.0
set protocols ldp interface ge-1/0/2.0
set protocols ldp router-id 3.3.3.3

set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 unit 10 encapsulation vlan-bridge
set interfaces ge-1/0/0 unit 10 vlan-id 10
set interfaces ge-1/0/0 unit 10 family bridge

set interfaces ge-1/0/1 unit 0 family inet address 10.1.1.3/24
set interfaces ge-1/0/1 unit 0 family mpls
set interfaces ge-1/0/2 unit 0 family inet address 10.2.1.3/24
set interfaces ge-1/0/2 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set routing-instances cpe interface ge-1/0/0.10
set routing-instances cpe route-distinguisher 10.10.10.10:10
set routing-instances cpe vrf-target target:100:10

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/1.0
set protocols ospf area 0.0.0.0 interface ge-1/0/2.0

set protocols ldp graceful-restart
set protocols bgp graceful-restart restart-time 60