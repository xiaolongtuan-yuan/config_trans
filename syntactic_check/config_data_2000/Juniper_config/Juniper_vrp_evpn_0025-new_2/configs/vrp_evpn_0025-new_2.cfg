set system host-name PE3

set routing-instances evpna instance-type evpn
set routing-instances evpna route-distinguisher 300:1
set routing-instances evpna vrf-target target:1:1 export
set routing-instances evpna vrf-target target:1:1 import

set protocols mpls lsr-id 4.4.4.4
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ae10.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ae10.0

set interfaces ge-1/0/0 unit 0 family inet address 10.3.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces ge-2/0/0 ether-options 802.3ad ae10
set interfaces ae10 description "Ethernet Trunk"
set interfaces ae10 unit 0 family ethernet-switching interface-mode trunk
set interfaces ae10 unit 0 vlan-id-list all

set interfaces lo0 unit 1 family inet address 4.4.4.4/32

set protocols bgp group eBGP type external
set protocols bgp group eBGP local-address 4.4.4.4
set protocols bgp group eBGP peer-as 100
set protocols bgp group eBGP neighbor 3.3.3.3 family inet unicast
set protocols bgp group eBGP neighbor 3.3.3.3 family inet-vpn
set protocols bgp group eBGP neighbor 3.3.3.3 family evpn

set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0

set protocols evpn source-address 4.4.4.4