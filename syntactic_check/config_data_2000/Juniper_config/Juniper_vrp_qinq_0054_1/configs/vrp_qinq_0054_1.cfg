set system host-name PE2

set routing-instances vpn1 instance-type virtual-router
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target target:100:1

set routing-options router-id 2.2.2.9

set interfaces ge-0/0/1 unit 1 family inet address 192.168.2.1/24
set routing-instances vpn1 interface ge-0/0/1.1

set interfaces ge-0/0/2 unit 0 family inet address 10.1.1.1/30
set interfaces ge-0/0/2 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 2.2.2.9/32

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0

set policy-options policy-statement vpn-target term 1 from protocol bgp
set policy-options policy-statement vpn-target term 1 then accept
set policy-options policy-statement vpn-target term 2 then reject
set policy-options policy-statement vpn-target term 3 from protocol bgp
set policy-options policy-statement vpn-target term 3 then accept

set protocols bgp group neighbor1 neighbor 1.1.1.9
set protocols bgp group neighbor1 local-address 2.2.2.9
set protocols bgp group neighbor1 peer-as 100
set protocols bgp group neighbor1 family inet unicast
set protocols bgp group neighbor1 family inet-vpn unicast
set protocols bgp group neighbor1 family inet6 unicast

set protocols bgp group neighbor2 neighbor 192.168.2.2
set protocols bgp group neighbor2 peer-as 65420
set protocols bgp group neighbor2 export vpn-target