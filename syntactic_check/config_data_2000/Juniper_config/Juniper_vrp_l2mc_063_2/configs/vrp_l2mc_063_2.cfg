set system host-name PE3

set vlans vlan11 vlan-id 11
set protocols igmp-snooping

set protocols mpls interface ge-1/0/1.0
set protocols ldp interface ge-1/0/1.0
set protocols ldp router-id 3.3.3.3

set protocols l2circuit local-switching interface ge-1/0/0.11 virtual-circuit-id 100
set protocols l2circuit neighbor 1.1.1.1 interface ge-1/0/0.11 virtual-circuit-id 100
set firewall family any filter limit-unicast term 1 then policer 10m
set firewall family any filter limit-unicast term 1 then accept
set firewall policer 10m if-exceeding bandwidth-limit 10m
set firewall policer 10m then discard

set interfaces ge-1/0/0 unit 11 vlan-id 11
set interfaces ge-1/0/0 unit 11 family ccc

set interfaces ge-1/0/1 unit 0 family inet address 10.1.2.2/24
set interfaces ge-1/0/1 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/1.0