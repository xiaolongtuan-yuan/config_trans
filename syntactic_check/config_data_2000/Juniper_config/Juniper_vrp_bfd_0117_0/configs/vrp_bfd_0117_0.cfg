set system host-name DeviceA

set interfaces ae1 aggregated-ether-options minimum-links 1
set interfaces ae1 unit 0 family inet address 10.1.1.1/24

set interfaces ge-0/0/0 ether-options 802.3ad ae1
set interfaces ge-0/0/1 ether-options 802.3ad ae1

set protocols bfd interface ae1.0
set protocols bfd interface ae1.0 minimum-interval 10
set protocols bfd interface ae1.0 multiplier 3