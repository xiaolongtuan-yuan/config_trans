set system host-name SPE

set protocols ldp interface ge-0/0/0.0
set protocols ldp router-id 2.2.2.2

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family inet address 10.2.1.1/24
set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols ospf area 0 interface ge-0/0/0.0

set routing-options rib inet6.0 static route ::/0 discard

set policy-options policy-statement BGP-PEER-1 term 1 from protocol bgp
set policy-options policy-statement BGP-PEER-1 term 1 then accept
set policy-options policy-statement BGP-PEER-2 term 1 from protocol bgp
set policy-options policy-statement BGP-PEER-2 term 1 then accept

set protocols bgp group external type external
set protocols bgp group external local-address 2.2.2.2
set protocols bgp group external neighbor 1.1.1.1 peer-as 100
set protocols bgp group external neighbor 1.1.1.1 export BGP-PEER-1
set protocols bgp group external neighbor 3.3.3.3 peer-as 100
set protocols bgp group external neighbor 3.3.3.3 export BGP-PEER-2
set protocols bgp group external family inet unicast

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 routing-options rib inet6.0 static route ::/0 discard
set routing-instances vpn1 protocols bgp group external family inet unicast
set routing-instances vpn1 protocols bgp group external family inet-vpn unicast