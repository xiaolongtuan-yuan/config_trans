set system host-name PE2

set routing-options multicast

set routing-instances VPNA instance-type virtual-router
set routing-instances VPNA route-distinguisher 300:1
set routing-instances VPNA vrf-import vpn-import
set routing-instances VPNA vrf-export vpn-export

set policy-options policy-statement vpn-import term 1 from community comm-import
set policy-options policy-statement vpn-import term 1 then accept
set policy-options policy-statement vpn-export term 1 from community comm-export
set policy-options policy-statement vpn-export term 1 then accept
set policy-options community comm-import members target:4:4
set policy-options community comm-export members target:4:4

set protocols ldp router-id lo0.0
set protocols ldp deaggregate

set interfaces ge-0/0/1 unit 0 family inet address 10.1.4.1/24
set interfaces ge-0/0/1 unit 0 family mpls

set interfaces ge-0/0/0 unit 0 family inet address 10.1.3.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set routing-instances VPNA interface ge-0/0/0.0

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols bgp group external type external
set protocols bgp group external local-address 2.2.2.2
set protocols bgp group external neighbor 3.3.3.3 peer-as 100
set protocols bgp group external export export-policy
set protocols bgp group external family inet unicast
set protocols bgp group external family inet-vpn unicast

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set routing-options router-id 2.2.2.2
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0 passive

set protocols pim rp static address 2.2.2.2
set protocols pim interface ge-0/0/0.0
set protocols pim interface lo0.0
set protocols pim mvpn

set routing-instances VPNA protocols bgp group external type external
set routing-instances VPNA protocols bgp group external neighbor 3.3.3.3 peer-as 100
set routing-instances VPNA protocols bgp group external family inet unicast
set routing-instances VPNA protocols bgp group external export direct
set routing-instances VPNA protocols bgp group external export static