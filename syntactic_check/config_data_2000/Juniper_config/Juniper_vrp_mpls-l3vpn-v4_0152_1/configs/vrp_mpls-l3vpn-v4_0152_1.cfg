set system host-name PE1

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target import target:100:1
set routing-instances vpn1 vrf-target export target:100:1

set protocols ldp interface ge-0/0/0.0

set interfaces ge-0/0/0 unit 0 family inet address 172.16.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.2/24
set routing-instances vpn1 interface ge-0/0/1.0

set interfaces lo0 unit 0 family inet address 1.1.1.9/32

set routing-options autonomous-system 100
set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 1.1.1.9
set protocols bgp group ibgp neighbor 4.4.4.9
set protocols bgp group ibgp family inet unicast
set protocols bgp group ibgp family inet-vpn unicast
set protocols bgp group ibgp export export-direct
set protocols bgp group ibgp neighbor 4.4.4.9 multihop ttl 10

set routing-instances vpn1 protocols bgp group ce type external
set routing-instances vpn1 protocols bgp group ce neighbor 10.1.1.1
set routing-instances vpn1 protocols bgp group ce peer-as 65001
set routing-instances vpn1 protocols bgp group ce import import-direct

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0