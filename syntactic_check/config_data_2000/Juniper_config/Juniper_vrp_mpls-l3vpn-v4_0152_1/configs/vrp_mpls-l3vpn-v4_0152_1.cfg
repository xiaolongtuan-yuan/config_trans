set system host-name PE1

# VRF Configuration
set routing-instances vpn1 instance-type virtual-router
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-export 1:1
set routing-instances vpn1 vrf-import 1:1

# MPLS Configuration
set protocols mpls label-protocol ldp

# Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 172.16.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/1 unit 0 family inet vrf vpn1

set interfaces lo0 unit 0 family inet address 1.1.1.9/32

# BGP Configuration
set protocols bgp group 100 neighbor 4.4.4.9 remote-as 200
set protocols bgp group 100 neighbor 4.4.4.9 multihop 10
set protocols bgp group 100 neighbor 4.4.4.9 update-source lo0

# BGP IPv4 Unicast Configuration
set protocols bgp group 100 family inet unicast network 172.16.1.0/24
set protocols bgp group 100 family inet unicast network 1.1.1.9/32
set protocols bgp group 100 family inet unicast neighbor 4.4.4.9 activate

# BGP VPNv4 Configuration
set protocols bgp group 100 family inet-vpn unicast neighbor 4.4.4.9 activate
set protocols bgp group 100 family inet-vpn unicast neighbor 4.4.4.9 send-community both

# BGP IPv4 VRF Configuration
set protocols bgp group 100 family inet-vrf vpn1 neighbor 10.1.1.1 remote-as 65001
set protocols bgp group 100 family inet-vrf vpn1 redistribute connected

# OSPF Configuration
set protocols ospf area 0 interface lo0
set protocols ospf area 0 interface ge-0/0/0.0