set system host-name MasterB

set routing-instances virtual-cluster-access instance-type virtual-router
set routing-instances virtual-cluster-access routing-options static route 0.0.0.0/0 next-hop 4.4.4.4


set protocols isis interface lo0.0 passive
set protocols isis level 1 wide-metrics-only

set protocols mpls interface ge-0/0/1.0
set protocols mpls interface ge-0/0/2.0

set interfaces ge-0/0/1 unit 0 family inet address 10.2.4.2/30
set interfaces ge-0/0/1 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family inet address 10.2.4.2/30

set interfaces ge-0/0/2 unit 0 family inet address 10.3.4.2/30
set interfaces ge-0/0/2 unit 0 family mpls

set policy-options policy-statement VCA-POLICY term 1 from protocol direct
set policy-options policy-statement VCA-POLICY term 1 then accept