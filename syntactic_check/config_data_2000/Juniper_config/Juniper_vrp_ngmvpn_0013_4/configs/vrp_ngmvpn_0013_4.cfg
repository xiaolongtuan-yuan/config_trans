set system host-name CE3

set protocols pim rp static address 1.1.1.1

set protocols igmp
set protocols igmp interface ge-1/0/0
set protocols igmp interface ge-1/0/1 version 3

set protocols pim interface ge-1/0/0 mode sparse
set protocols pim interface ge-1/0/1 mode sparse

set interfaces ge-1/0/0 unit 0 family inet address 192.168.3.2/24
set interfaces ge-1/0/1 unit 0 family inet address 10.1.5.1/24

set interfaces lo0 unit 1 family inet address 6.6.6.6/32

set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-1/0/0
set protocols ospf area 0 interface ge-1/0/1