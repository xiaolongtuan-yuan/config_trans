set system host-name DeviceD

set vlans vlan10 vlan-id 10
set vlans vlan20 vlan-id 20
set vlans vlan100 vlan-id 100
set vlans vlan200 vlan-id 200
set vlans vlan300 vlan-id 300
set vlans vlan400 vlan-id 400

set interfaces ae1 aggregated-ether-options minimum-links 1
set interfaces ae1 unit 0 family ethernet-switching interface-mode trunk

set interfaces ae1 unit 0 family ethernet-switching vlan members 10
set interfaces ae1 unit 0 family ethernet-switching vlan members 20
set interfaces ae1 unit 0 family ethernet-switching vlan members 100
set interfaces ae1 unit 0 family ethernet-switching vlan members 200
set interfaces ae1 unit 0 family ethernet-switching vlan members 300
set interfaces ae1 unit 0 family ethernet-switching vlan members 400

set interfaces ge-1/0/1 ether-options 802.3ad ae1
set interfaces ge-1/0/2 ether-options 802.3ad ae1

set protocols rstp interface ae1 priority 0
set protocols rstp bridge-priority 4096