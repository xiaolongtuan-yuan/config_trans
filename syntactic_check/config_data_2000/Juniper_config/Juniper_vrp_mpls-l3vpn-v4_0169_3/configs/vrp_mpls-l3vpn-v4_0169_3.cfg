set system host-name UPE2

set routing-instances vpna instance-type virtual-router
set routing-instances vpna route-distinguisher 100:1
set routing-instances vpna vrf-import 1:1
set routing-instances vpna vrf-export 1:1

set protocols mpls label-protocol ldp

set interfaces ge-1/0/0 unit 0 family inet address 172.17.4.1/24
set interfaces ge-1/0/0 unit 0 family inet mpls

set interfaces ge-2/0/0 unit 0 family inet address 172.16.2.2/24
set interfaces ge-2/0/0 unit 0 family inet mpls

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols bgp 100 router-id 2.2.2.2
set protocols bgp 100 neighbor 3.3.3.3 remote-as 100
set protocols bgp 100 neighbor 3.3.3.3 update-source lo0
set protocols bgp 100 neighbor 4.4.4.4 remote-as 100
set protocols bgp 100 neighbor 4.4.4.4 update-source lo0

set protocols bgp 100 address-family ipv4 unicast
set protocols bgp 100 address-family vpnv4
set protocols bgp 100 address-family vpnv4 neighbor 3.3.3.3 activate
set protocols bgp 100 address-family vpnv4 neighbor 4.4.4.4 activate

set protocols ospf area 0.0.0.0 network 2.2.2.2/32
set protocols ospf area 0.0.0.0 network 172.16.2.0/24
set protocols ospf area 0.0.0.0 network 172.17.4.0/24

commit