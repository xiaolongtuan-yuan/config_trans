set system host-name DeviceA

set vlans vlan10 vlan-id 10
set vlans vlan20 vlan-id 20

set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 native-vlan-id 1
set interfaces ge-1/0/1 unit 0 encapsulation vlan-bridge
set interfaces ge-1/0/1 unit 0 vlan-id-list 2-500

set interfaces ge-2/0/1 flexible-vlan-tagging
set interfaces ge-2/0/1 unit 0 encapsulation vlan-bridge
set interfaces ge-2/0/1 unit 0 vlan-id 10

set interfaces ge-3/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-3/0/1 unit 0 family ethernet-switching vlan members 20

set chassis ethernet-switch-options vlan-tagging
set ethernet-switching-options qinq-protocol