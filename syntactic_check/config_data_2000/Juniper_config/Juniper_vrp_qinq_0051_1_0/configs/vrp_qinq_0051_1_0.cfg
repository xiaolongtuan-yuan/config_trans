set system host-name DeviceA

set vlans vlan10 vlan-id 10
set vlans vlan20 vlan-id 20

set interfaces ge-1/0/1 unit 0 family ethernet-switching interface-mode access
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan-members [ 2-500 ]
set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 stacked-vlan-translations vlan-id 10 translate vlan-id 20
set interfaces ge-1/0/1 stacked-vlan-translations vlan-id-range 1000-2000 translate vlan-id 20

set interfaces ge-2/0/1 unit 0 family ethernet-switching interface-mode access
set interfaces ge-2/0/1 unit 0 family ethernet-switching vlan-members [ 100-500 ]
set interfaces ge-2/0/1 flexible-vlan-tagging
set interfaces ge-2/0/1 stacked-vlan-translations vlan-id 10

set interfaces ge-3/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-3/0/1 unit 0 family ethernet-switching vlan-members vlan20