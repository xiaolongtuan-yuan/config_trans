set system host-name RouterA

set interfaces ge-0/0/0 unit 0 family inet address 172.16.3.1/24
set interfaces ge-0/0/1 unit 0 family inet address 172.16.2.1/24
set interfaces ge-0/0/3 unit 0 family inet address 172.16.1.1/24

set protocols bgp group internal type internal
set protocols bgp group internal local-address 172.16.2.1
set protocols bgp group internal neighbor 172.16.2.2 peer-as 65008
set protocols bgp group internal family inet unicast add-path receive
set protocols bgp group internal neighbor 172.16.2.2 import direct-import

set policy-options policy-statement direct-import term 1 from protocol direct
set policy-options policy-statement direct-import term 1 then accept

set routing-options static route 0.0.0.0/0 next-hop 172.16.3.2