set system host-name RouterA
set interfaces ge-0/0/0 unit 0 family inet address 172.16.3.1/24
set interfaces ge-0/0/1 unit 0 family inet address 172.16.2.1/24
set interfaces ge-0/0/3 unit 0 family inet address 172.16.1.1/24
set protocols bgp 65008 router-id 1.1.1.1
set protocols bgp 65008 neighbor 172.16.2.2 remote-as 65008
set protocols bgp 65008 address-family ipv4-unicast neighbor 172.16.2.2 activate
set protocols bgp 65008 address-family ipv4-unicast neighbor 172.16.2.2 capability add-path receive
set protocols bgp 65008 address-family ipv4-unicast neighbor 172.16.2.2 route-map direct-import in
set routing-options static route 0.0.0.0/0 next-hop <next-hop>