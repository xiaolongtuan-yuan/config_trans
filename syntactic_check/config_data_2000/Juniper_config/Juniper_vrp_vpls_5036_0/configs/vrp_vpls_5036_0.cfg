set system host-name PE1
set routing-options router-id 1.1.1.1

set protocols mpls label-switched-path trigger all
set protocols mpls ldp

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0.10 unit 0 encapsulation vlan-ccc vlan-id 10
set interfaces ge-0/0/0.10 unit 0 family ethernet-switching vlan-members a2

set interfaces ge-0/0/0.10 xconnect peer 2.2.2.2 pw-id 2
set interfaces ge-0/0/0.10 xconnect peer 4.4.4.4 pw-id 2
set interfaces ge-0/0/0.10 mac-withdraw
set interfaces ge-0/0/0.10 interface-status-change mac-withdraw

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.10
set protocols ospf area 0.0.0.0 interface lo0.0