set system host-name Device

set vlans vlan10 vlan-id 10

set interfaces ge-1/0/0 unit 0 family ethernet-switching interface-mode access
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members vlan10
set interfaces ge-1/0/0 storm-control broadcast bandwidth-percent 1.5
set interfaces ge-1/0/0 storm-control multicast bandwidth-percent 1.5
set interfaces ge-1/0/0 storm-control unicast bandwidth-percent 1.5

set interfaces ge-2/0/0 unit 0 family ethernet-switching interface-mode access
set interfaces ge-2/0/0 unit 0 family ethernet-switching vlan members vlan10
set interfaces ge-2/0/0 storm-control broadcast bandwidth-percent 1.5
set interfaces ge-2/0/0 storm-control multicast bandwidth-percent 1.5
set interfaces ge-2/0/0 storm-control unicast bandwidth-percent 1.5