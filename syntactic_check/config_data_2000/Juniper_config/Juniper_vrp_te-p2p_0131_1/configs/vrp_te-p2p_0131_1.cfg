set system host-name PE2

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:2
set routing-instances vpn1 vrf-target target:100:1

set routing-options router-id 3.3.3.3
set protocols mpls interface ge-0/0/0.0
set protocols rsvp interface ge-0/0/0.0

set interfaces ge-0/0/0 unit 0 family inet address 10.2.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 3.3.3.3/32


set protocols bgp group vpnv4-external type external
set protocols bgp group vpnv4-external local-address 3.3.3.3
set protocols bgp group vpnv4-external family inet-vpn unicast
set protocols bgp group vpnv4-external peer-as 100
set protocols bgp group vpnv4-external neighbor 1.1.1.1

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf traffic-engineering
set protocols bfd interface ge-0/0/0.0 minimum-interval 100
set protocols bfd interface ge-0/0/0.0 multiplier 3