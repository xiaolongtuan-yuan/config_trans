set system host-name UPE

set routing-options router-id 1.1.1.9

set protocols mpls interface ge-1/0/1.1
set protocols mpls interface ge-1/0/1.2
set protocols mpls interface ge-1/0/2.0

set protocols ldp interface ge-1/0/2.0

set routing-instances l2vpn1 instance-type l2vpn
set routing-instances l2vpn1 interface ge-1/0/1.1
set routing-instances l2vpn1 protocols l2vpn encapsulation-type ethernet
set routing-instances l2vpn1 protocols l2vpn site CE1 site-identifier 1
set routing-instances l2vpn1 protocols l2vpn neighbor 2.2.2.9 pw-id 1

set routing-instances l2vpn2 instance-type l2vpn
set routing-instances l2vpn2 interface ge-1/0/1.2
set routing-instances l2vpn2 protocols l2vpn encapsulation-type ethernet
set routing-instances l2vpn2 protocols l2vpn site CE2 site-identifier 2
set routing-instances l2vpn2 protocols l2vpn neighbor 2.2.2.9 pw-id 2

set protocols igmp-snooping vlan all
set protocols igmp-snooping vlan all version 3
set protocols igmp-snooping vlan all static-router-interface ge-1/0/1.1
set protocols igmp-snooping vlan all static-router-interface ge-1/0/1.2

set protocols isis interface all
set protocols isis level 2 wide-metrics-only
set protocols isis interface lo0.0 passive
set protocols isis interface ge-1/0/2.0 point-to-point

set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 encapsulation flexible-ethernet-services
set interfaces ge-1/0/1 unit 1 encapsulation vlan-bridge
set interfaces ge-1/0/1 unit 1 vlan-id 7
set interfaces ge-1/0/1 unit 1 family bridge interface-mode trunk
set interfaces ge-1/0/1 unit 1 family bridge vlan-id-list 1-1000
set interfaces ge-1/0/1 unit 2 encapsulation vlan-bridge
set interfaces ge-1/0/1 unit 2 vlan-id 8
set interfaces ge-1/0/1 unit 2 family bridge interface-mode trunk
set interfaces ge-1/0/1 unit 2 family bridge vlan-id-list 1-1000

set interfaces ge-1/0/2 unit 0 family inet address 10.1.1.1/30
set interfaces ge-1/0/2 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 1.1.1.9/32