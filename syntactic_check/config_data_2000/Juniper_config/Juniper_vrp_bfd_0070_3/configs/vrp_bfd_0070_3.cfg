set system host-name CE1

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/1 unit 0 family inet address 10.2.1.1/24
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set routing-options static route 0.0.0.0/0 next-hop 10.1.1.2
set routing-options static route 0.0.0.0/0 next-hop 10.2.1.2

set protocols bfd interface ge-0/0/0 unit 0 interval 100 min-rx 100 multiplier 3
set protocols bfd interface ge-0/0/1 unit 0 interval 100 min-rx 100 multiplier 3

set protocols bfd neighbor 10.1.1.2 interface ge-0/0/0 unit 0
set protocols bfd neighbor 10.2.1.2 interface ge-0/0/1 unit 0

set policy-options load-balancing per-packet

