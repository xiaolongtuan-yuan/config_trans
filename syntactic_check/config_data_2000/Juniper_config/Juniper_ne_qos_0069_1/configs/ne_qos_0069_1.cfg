set system host-name PE1

set routing-options router-id 11.11.11.11
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24
set protocols mpls interface ge-0/0/0.0

set interfaces ge-0/0/1 unit 0 family inet address 10.10.1.1/24
set protocols mpls interface ge-0/0/1.0

set interfaces lo0 unit 0 family inet address 11.11.11.11/32

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set firewall family inet filter pe term match-any then accept
set firewall family inet filter pe term default then discard

set class-of-service classifiers inet pe forwarding-class best-effort loss-priority low code-points 000000
set class-of-service schedulers pe transmit-rate percent 50
set class-of-service schedulers pe buffer-size percent 50
set class-of-service schedulers pe priority low

set interfaces ge-0/0/0 unit 0 family inet filter input pe