set system host-name CE2

set interfaces ge-1/0/0 enable
set interfaces ge-1/0/0 ether-options 802.3ad ae10

set interfaces ae10 aggregated-ether-options lacp active
set interfaces ae10 unit 0 family ethernet-switching
set interfaces ae10 unit 0 family ethernet-switching interface-mode trunk
set interfaces ae10 unit 0 family ethernet-switching vlan members 10

set interfaces ae10 unit 1 vlan-id 100
set interfaces ae10 unit 1 family ethernet-switching interface-mode trunk
set interfaces ae10 unit 1 family ethernet-switching vlan members 10

set vlans VLAN10 vlan-id 10