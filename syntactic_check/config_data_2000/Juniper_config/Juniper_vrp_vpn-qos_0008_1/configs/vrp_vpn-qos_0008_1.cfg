set system host-name PE1

set protocols rsvp interface all
set protocols ldp

set interfaces ge-1/0/0 encapsulation flexible-ethernet-services
set interfaces ge-1/0/0 unit 1 encapsulation vlan-vpls
set interfaces ge-1/0/0 unit 1 vlan-id 10
set protocols l2circuit neighbor 3.3.3.9 interface ge-1/0/0.1 virtual-circuit-id 101

set interfaces ge-2/0/0 unit 0 family inet address 10.1.1.1/24
set protocols rsvp interface ge-2/0/0.0 bandwidth 5000
set protocols rsvp interface ge-2/0/0.0 subscription 80

set interfaces lo0 unit 1 family inet address 1.1.1.9/32

set routing-options static route 10.1.1.1/32 next-hop 10.1.1.1

set protocols ospf traffic-engineering
set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set routing-options router-id 1.1.1.9