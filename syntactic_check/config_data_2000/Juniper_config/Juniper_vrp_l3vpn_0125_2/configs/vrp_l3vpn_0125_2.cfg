set system host-name DeviceC

set interfaces ge-0/0/0 unit 0 family inet address 172.16.1.2/24

set protocols bgp group neighbor-172.16.1.1 type external
set protocols bgp group neighbor-172.16.1.1 peer-as 200
set protocols bgp group neighbor-172.16.1.1 family inet unicast
set protocols bgp group neighbor-172.16.1.1 family inet-vpn unicast
set policy-options policy-statement EXPORT-STATIC term 1 from protocol static
set policy-options policy-statement EXPORT-STATIC term 1 then accept
set protocols bgp group neighbor-172.16.1.1 export EXPORT-STATIC

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set routing-options static route 33.33.0.0/16 next-hop 0.0.0.0