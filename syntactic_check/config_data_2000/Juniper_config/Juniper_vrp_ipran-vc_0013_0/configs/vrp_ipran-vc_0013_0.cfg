set system host-name AP1

set interfaces ge-0/0/1 unit 0 family inet address 10.1.2.1/30
set interfaces ge-0/0/1 unit 0 family iso
set interfaces ge-0/0/2 unit 0 family inet address 10.1.3.1/30
set interfaces ge-0/0/2 unit 0 family iso
set interfaces lo0 unit 0 family inet address 1.1.1.1/32
set interfaces lo0 unit 0 family iso

set protocols isis interface ge-0/0/1.0 level 1 disable
set protocols isis interface ge-0/0/1.0 point-to-point
set protocols isis interface ge-0/0/1.0 ldp-synchronization
set protocols isis interface ge-0/0/1.0 level 1 metric 10
set protocols isis interface ge-0/0/2.0 level 1 disable
set protocols isis interface ge-0/0/2.0 point-to-point
set protocols isis interface ge-0/0/2.0 ldp-synchronization
set protocols isis interface ge-0/0/2.0 level 1 metric 10
set protocols isis interface lo0.0 passive

set protocols isis level 1 wide-metrics-only
set protocols isis traffic-engineering credibility-protocol-preference

set policy-options policy-statement VCA_ACL term 1 from protocol local
set policy-options policy-statement VCA_ACL term 1 from route-filter 1.1.1.1/32 exact
set policy-options policy-statement VCA_ACL term 1 then accept
set policy-options policy-statement VCA_ACL_MASTER term 1 from route-filter 3.3.3.3/32 exact
set policy-options policy-statement VCA_ACL_MASTER term 1 then accept
set policy-options policy-statement VCA_ACL_MASTER term 2 from route-filter 4.4.4.4/32 exact
set policy-options policy-statement VCA_ACL_MASTER term 2 then accept