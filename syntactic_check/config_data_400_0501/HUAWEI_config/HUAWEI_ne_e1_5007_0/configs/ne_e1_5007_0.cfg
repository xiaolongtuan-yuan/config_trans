#
sysname DeviceA
#
controller E1 1/0/0
 using e1
 framing NO-CRC4
 clock-source internal
 line-code HDB3
 cable-length long 0db
 mp-group 1 timeslot 1-31
 undo shutdown
#
interface Serial1/0/0:0
 link-protocol ppp
 ppp mp mp-group 1/0/1
 undo shutdown
#
interface mp-group 1/0/1
 ip address 10.1.1.1 255.255.255.0
#
return
