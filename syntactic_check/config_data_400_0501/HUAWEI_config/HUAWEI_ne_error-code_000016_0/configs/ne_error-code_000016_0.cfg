#                                                                               
sysname UPE                                                                     
#
bfd
#
mpls lsr-id 1.1.1.1
mpls
mpls ldp        
 #              
 ipv4-family    
  auto-frr lsp-trigger all
#
interface GigabitEthernet1/0/0                                                  
 undo shutdown  
 ip address 10.1.1.1 255.255.255.0
 mpls
 mpls ldp
 mpls traffic-eng passive-interface
 mpls traffic-eng auto-bw
 mpls traffic-eng resv-bw
 mpls traffic-eng fast-reroute
 mpls traffic-eng frr alternate-path
 mpls traffic-eng frr link-protection
 mpls traffic-eng frr remote-lfa
 trap-threshold crc-error packet-error-ratio alarm-threshold 3 4 resume-threshold 2 5 trigger-section
#                                                                               
interface GigabitEthernet1/0/1                                                  
 undo shutdown  
 ip address 10.1.5.1 255.255.255.0
 mpls           
 mpls ldp
 mpls traffic-eng passive-interface
 mpls traffic-eng auto-bw
 mpls traffic-eng resv-bw
 mpls traffic-eng fast-reroute
 mpls traffic-eng frr alternate-path
 mpls traffic-eng frr link-protection
 mpls traffic-eng frr remote-lfa
 trap-threshold crc-error packet-error-ratio alarm-threshold 3 4 resume-threshold 2 5 trigger-section
#              
interface LoopBack0
 ip address 1.1.1.1 255.255.255.255
#
ospf 100        
 frr            
  loop-free-alternate
 area 0.0.0.0   
  network 1.1.1.1 0.0.0.0
  network 10.1.1.0 0.0.0.255
  network 10.1.5.0 0.0.0.255
  area range 1.1.1.1/32 
#                                                                             
return
