#
sysname PE1
#
mpls lsr-id 2.2.2.2
mpls
mpls l2vpn
mpls ldp
mpls ldp remote-peer 3.3.3.3
 remote-ip 3.3.3.3 
#
clock source cesacr slot 1 card 1 recovery-domain 1 synchronization enable
clock source cesacr slot 1 card 1 recovery-domain 1 ssm prc
clock source cesacr slot 1 card 1 recovery-domain 1 priority 1
#
controller cpos1/0/1
using ce1
channel-set 1 timeslot-list 1-31
undo shutdown
e1 2 set clock recovery-domain 1
#
interface serial1/0/1:1
 link-protocol tdm
 clock source cesacr slot 1 card 1 recovery-domain 1 priority 1
 mpls l2vc 3.3.3.3 100 control-word tdm-encapsulation-number 8
 undo shutdown
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 10.1.1.1 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack0
 ip address 2.2.2.2 255.255.255.255
#
ospf 1
 area 0.0.0.0
  network 2.2.2.2 0.0.0.0
  network 10.1.1.0 0.0.0.255
#
return
