#
sysname Spoke2
# 
nhrp enable
#
interface GigabitEthernet1/0/0
 ip address 10.1.3.10 255.255.255.0
 binding tunnel gre
#
interface LoopBack0
 ip address 192.168.2.1 255.255.255.255
# 
interface Tunnel0
 ip address 172.16.1.3 255.255.255.0
 tunnel-protocol gre p2mp
 source GigabitEthernet1/0/0
 ospf network-type p2mp
 nhrp enable
 nhrp shortcut
 nhrp entry 172.16.1.1 10.1.1.10 register
 nhrp nhs 172.16.1.1
 nhrp map multicast dynamic
 ipsec policy IPSEC_PROFILE
# 
ospf 1 router-id 172.16.1.3
 area 0.0.0.0
  network 172.16.1.0 0.0.0.255
  network 192.168.2.0 0.0.0.255
# 
ospf 2 router-id 10.1.3.10
 area 0.0.0.1
  network 10.1.3.0 0.0.0.255
# 
ipsec policy IPSEC_PROFILE 10 isakmp
 proposal 10
  encapsulation-mode tunnel
  transform esp
  transform esp-aes esp-sha-hmac
#
ike peer GRE_PEER
 pre-shared-key PRE_SHARED_KEY
 remote-address 172.16.1.1
#
return
