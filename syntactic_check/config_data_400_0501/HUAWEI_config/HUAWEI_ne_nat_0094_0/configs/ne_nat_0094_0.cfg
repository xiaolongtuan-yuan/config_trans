sysname BRAS
#
interface GigabitEthernet2/0/0.1
 user-vlan 1
 bas
  access-type layer2-subscriber default-domain authentication isp1
  authentication-method bind
#
ip pool pool1 bas local
 gateway 10.10.10.101 255.255.255.0
 section 1 10.10.10.1 10.10.10.100
 dns-server 192.168.7.252
#
license
 active nat session-table size 6 slot 1 engine 0
#
service-location 1
 location slot 1 engine 0
#
service-instance-group group1
 service-location 1
#
nat instance nat1 id 1
 service-instance-group group1
 nat address-group group1 group-id 1 11.11.11.101 11.11.11.105
 nat outbound 3001 address-group group1
 nat centralized-backup enable
 port-range 4096
#
user-group group1
#
acl number 3001
 rule 10 permit ip source 10.10.10.0 0.0.0.255
#
acl number 6001
 rule 1 permit ip source user-group group1
#
traffic classifier c1
 if-match acl 6001
#
traffic behavior b1
 nat bind instance nat1
#
traffic policy p1
 classifier c1 behavior b1
#
traffic-policy p1 inbound
#
aaa
 authentication-scheme auth1
  authentication-mode radius
#
 accounting-scheme acct1
  accounting-mode radius
 #
  domain isp1
   authentication-scheme auth1
   accounting-scheme acct1
   ip-pool pool1
   user-group group1 bind nat instance nat1
 #
#
 return
