sysname DeviceA
#
l2tp enable
#
radius-server group radius1
 radius-server authentication 10.20.20.1 1812 
 radius-server accounting 10.20.20.1 1813 
 radius-server shared-key <shared-key>
#
interface Virtual-Template1
 ppp authentication-mode chap
#
interface GigabitEthernet2/0/0
 undo shutdown
#
interface GigabitEthernet2/0/0.100
 pppoe-server bind Virtual-Template 1
 undo shutdown
#
interface gigabitethernet1/0/0
 undo shutdown
 ip address 10.38.160.1 255.255.255.0
#
l2tp-group 1
 tunnel password cipher <tunnel-password>
 tunnel name LAC
 tunnel authentication
 start l2tp ip 10.38.160.2
 tunnel source gigabitethernet 1/0/0
#
aaa
 domain default
  authentication-scheme default1
  accounting-scheme default1
  radius-server group radius1
  l2tp-group 1
#
return
