sysname CGNA
#
license
 active nat session-table size 6 slot 1 engine 0
 active nat session-table size 6 slot 1 engine 1
#
nat static-mapping
 inside-pool 1
  section 1 192.168.10.128 192.168.10.255
 global-pool 1
  section 1 11.11.11.101 11.11.11.200
 static-mapping 10 inside-pool 1 global-pool 1 port-range 256 1279 port-size 256
#
service-location 1      
 location slot 1 engine 0
#
service-location 2      
 location slot 1 engine 1
#
service-instance-group groupa      
 service-location 1      
 service-location 2
#
nat instance cpe1 id 11     
 service-instance-group groupa      
 nat bind static-mapping 10
#
acl number 3001
 rule 1 permit ip source 192.168.10.0 0.0.0.255
#
traffic classifier c1
 if-match acl 3001
#
traffic behavior b1
 nat bind instance cpe1
#
traffic policy p1
 classifier c1 behavior b1
#
interface GigabitEthernet 2/0/0
 ip address 192.168.10.1 255.255.255.0
 undo shutdown
 traffic-policy p1 inbound
#
return
