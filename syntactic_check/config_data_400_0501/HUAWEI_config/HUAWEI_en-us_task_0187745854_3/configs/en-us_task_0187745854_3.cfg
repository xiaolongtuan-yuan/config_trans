#
sysname name ASBR2
#
router id 3.3.3.3
#
tunnel-selector s1 permit node 10
 apply tunnel-policy p1
#
mpls lsr-id 3.3.3.3
mpls
mpls l2vpn
mpls ldp
 ipv4-family
mpls traffic-eng tunnels
mpls traffic-eng router-id 3.3.3.3
mpls bgp forwarding
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.10.2.3 255.255.255.0
 mpls
 mpls ldp
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 10.10.3.3 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack1
 ip address 3.3.3.3 255.255.255.255
#
bgp 200
 peer 4.4.4.4 as-number 200
 peer 4.4.4.4 connect-interface LoopBack1
 peer 10.10.2.2 as-number 100
 peer 10.10.2.2 connect-interface Ethernet1/0/0
 #
 l2vpn-ad-family
  policy vpn-target in
  peer 4.4.4.4 enable
  peer 10.10.2.2 enable
#
ospf 1
 bgp-ls enable
 area 0.0.0.0
  network 3.3.3.3 0.0.0.0
  network 10.10.2.0 0.0.0.255
  network 10.10.3.0 0.0.0.255
#
tunnel-policy p1
 tunnel select-seq ldp bgp load-balance-number 1
#
return
