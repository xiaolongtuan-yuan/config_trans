sysname CE2
#
cfm version standard
cfm enable
#
interface GigabitEthernet1/0/1
 undo shutdown
 portswitch
 port trunk allow-pass vlan 10

#
cfm md md2 level 6
 ma ma2
  map mpls vlan 10
  mep mep-id 62 interface gigabitEthernet1/0/1 outward
  ccm-interval 10000
  mep ccm-send enable
  remote-mep mep-id 61
  remote-mep ccm-receive enable
  ais enable
  ais suppress-alarm
#
return
