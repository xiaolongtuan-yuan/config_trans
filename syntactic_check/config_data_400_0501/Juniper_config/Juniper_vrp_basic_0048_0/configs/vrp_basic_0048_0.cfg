set system host-name SSH-Server

set firewall family inet filter acl-2000 term term-5 from source-address 10.248.103.0/24
set firewall family inet filter acl-2000 term term-5 then accept

set system login user huawei123 class super-user
set system login user huawei123 authentication ssh-rsa ""

set interfaces ge-0/0/0 unit 0 family inet address 10.248.103.194/24

set system services ssh root-login allow
set system services ssh connection-limit 5
set system services ssh rate-limit 10

set firewall family inet filter acl-2000 term term-allow from protocol tcp
set firewall family inet filter acl-2000 term term-allow from destination-port ssh
set firewall family inet filter acl-2000 term term-allow then accept

set system login user huawei123 full-name "SSH User"
set system login user huawei123 uid 1001
set system login user huawei123 home-directory /var/home/huawei123
set system login user huawei123 class super-user