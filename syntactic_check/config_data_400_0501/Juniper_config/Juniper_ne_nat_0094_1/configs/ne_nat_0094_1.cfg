set system host-name CR

set firewall family inet filter ACL-2001 term ALLOW-TRAFFIC from source-address 10.10.10.0/24
set firewall family inet filter ACL-2001 term ALLOW-TRAFFIC then accept

set policy-options policy-statement POLICY-P1 term SET-NEXT-HOP from route-filter 0.0.0.0/0 exact
set policy-options policy-statement POLICY-P1 term SET-NEXT-HOP then next-hop 192.168.11.2
set policy-options policy-statement POLICY-P1 term SET-NEXT-HOP then accept

set routing-options forwarding-table export POLICY-P1

set interfaces ge-2/0/2 unit 0 family inet address 192.168.10.2/24
set interfaces ge-2/0/2 unit 0 family inet filter input ACL-2001
set interfaces ge-2/0/2 disable

set routing-options interface-routes rib-group inet INTERFACE-RIB
set routing-options rib-groups INTERFACE-RIB import-rib inet.0
set routing-options rib-groups INTERFACE-RIB import-rib ge-2/0/2.0