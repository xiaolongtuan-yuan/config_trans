set system host-name CE2
set vlans vlan2 vlan-id 2

set protocols oam ethernet connectivity-fault-management version standard

set interfaces ge-1/0/1 unit 0 family ethernet-switching port-mode trunk
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members vlan2
# 修正点：启用接口的正确语法（直接移除disable语句或使用"enable"）
set interfaces ge-1/0/1 enable

set protocols oam ethernet connectivity-fault-management domain md3
set protocols oam ethernet connectivity-fault-management domain md3 level 0
set protocols oam ethernet connectivity-fault-management domain md3 ma ma3
set protocols oam ethernet connectivity-fault-management domain md3 ma ma3 mep 3
set protocols oam ethernet connectivity-fault-management domain md3 ma ma3 mep 3 direction outward
set protocols oam ethernet connectivity-fault-management domain md3 ma ma3 mep 3 ccm enable
set protocols oam ethernet connectivity-fault-management domain md3 ma ma3 mep 3 ccm-interval 1s
set protocols oam ethernet connectivity-fault-management domain md3 ma ma3 remote-mep 4 ccm enable

set protocols oam ethernet connectivity-fault-management domain md3 ma ma3 mep 3 loss-measurement single-ended receive-test test1