set system host-name P

set protocols bfd interface ge-0/0/0.0
set protocols bfd interface ge-0/0/1.0

set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0
set protocols mpls interface lo0.0
set protocols ldp router-id 2.2.2.2
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set ethernet-switching-options storm-control interface ge-0/0/0 level 3
set ethernet-switching-options storm-control interface ge-0/0/0 resume 2

set interfaces ge-0/0/1 unit 0 family inet address 10.1.3.1/24
set interfaces ge-0/0/1 unit 0 family mpls
set ethernet-switching-options storm-control interface ge-0/0/1 level 3
set ethernet-switching-options storm-control interface ge-0/0/1 resume 2

set interfaces lo0 unit 0 family inet address 2.2.2.2/32
set interfaces lo0 unit 0 family mpls

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0