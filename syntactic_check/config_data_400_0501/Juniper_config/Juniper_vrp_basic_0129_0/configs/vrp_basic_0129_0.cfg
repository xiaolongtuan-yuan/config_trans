set system host-name SSH-Server

set system radius-server 203.0.113.1 secret "$ABC123$XYZ456"  # 替换实际RADIUS信息
set system radius-server 203.0.113.1 source-address 192.0.2.1  # RADIUS源地址

set system login user client001 class read-only
set system login user client001 authentication encrypted-password "$1$abc123$xyz4567890ABCDEFGHIJKL"  # 替换为实际加密密码

set system services ssh
set system services ssh root-login deny
set system services ssh protocol-version v2
set system services ssh connection-limit 10
set system services ssh rate-limit 10

set system login user client001 authentication ssh-rsa "ssh-rsa AAAAB3Nza... user@host"  # 替换为实际公钥