set system host-name CE1

# IPv6 接口配置修正
set interfaces ge-1/0/0 unit 0 family inet6
!set interfaces ge-1/0/0 unit 0 family inet6 address 2001:db8:1::1/64
!set interfaces ge-1/0/0 unit 0 family inet6 address 2001:db8:1::1/64 preferred
!set interfaces ge-1/0/0 unit 0 family inet6 disable-icmpv6-redirects  # 替代no-redirects
!set interfaces ge-1/0/0 unit 0 family inet6 nd6-options no-icmp6-unreachables  # 替代no-unreachables

# Loopback 配置

# 路由配置
set routing-options router-id 5.5.5.5

# BGP 配置
set protocols bgp group EBGP type external
set protocols bgp group EBGP local-address 2001:db8:1::1
set protocols bgp group EBGP peer-as 200
set protocols bgp group EBGP neighbor 2001:db8:1::2
set protocols bgp group EBGP family inet6 unicast
set protocols bgp group EBGP export EXPORT-NETWORK

# 路由策略
set policy-options policy-statement EXPORT-NETWORK term 1 from route-filter 2001:db8:5::/128 exact
set policy-options policy-statement EXPORT-NETWORK term 1 then accept