set system host-name PE1

set protocols oam ethernet connectivity-fault-management maintenance-domain md1 level 3
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 vlan 10
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 31 interface ge-1/0/1.1 direction inward
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 31 alarm-indication-signal
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 31 continuity-check transmit interval 60
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 remote-mep 32

set interfaces lo0 unit 1 family inet address 1.1.1.1/32

set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 disable
set interfaces ge-1/0/1 unit 1 vlan-id 10
set interfaces ge-1/0/1 unit 1 encapsulation vlan-ccc
set interfaces ge-1/0/1 unit 1 family ccc

set protocols l2circuit neighbor 3.3.3.3 interface ge-1/0/1.1 virtual-circuit-id 100
set protocols l2circuit neighbor 3.3.3.3 interface ge-1/0/1.1 encapsulation-type ethernet

set interfaces ge-1/0/2 disable
set interfaces ge-1/0/2 unit 0 family inet address 10.1.1.1/30
set interfaces ge-1/0/2 unit 0 family mpls
set protocols mpls interface ge-1/0/2

set protocols ldp interface lo0.1
set protocols ldp interface ge-1/0/2
set protocols ldp router-id 1.1.1.1
set protocols ldp targeted-session 3.3.3.3

set routing-options router-id 1.1.1.1
set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/2.0