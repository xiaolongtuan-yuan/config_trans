set system host-name CE1
set vlans vlan-2 vlan-id 2

set protocols oam ethernet connectivity-fault-management
set protocols oam ethernet connectivity-fault-management maintenance-domain md3 level 3
set protocols oam ethernet connectivity-fault-management maintenance-association ma3 md md3
set protocols oam ethernet connectivity-fault-management maintenance-association ma3 vlan 2
set protocols oam ethernet connectivity-fault-management mep 3 interface ge-1/0/1 md md3 ma ma3 direction outward
set protocols oam ethernet connectivity-fault-management mep 3 md md3 ma ma3 continuity-check transmit enable
set protocols oam ethernet connectivity-fault-management mep 3 md md3 ma ma3 continuity-check receive enable
set protocols oam ethernet connectivity-fault-management remote-mep 4 md md3 ma ma3
set protocols oam ethernet connectivity-fault-management linktrace test-id 1 md md3 ma ma3 target-mep 4
set protocols oam ethernet connectivity-fault-management delay-measurement test-id 2 md md3 ma ma3 two-way

set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members vlan-2