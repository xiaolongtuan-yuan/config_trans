set system host-name CE

set interfaces ge-0/0/1 unit 0 family inet address 10.11.11.2/24
set interfaces ge-0/0/2 unit 0 family inet address 10.11.12.2/24
set interfaces lo0 unit 0 family inet address 10.2.2.2/32

set protocols bgp group EBGP type external
set protocols bgp group EBGP local-address 10.2.2.2
set protocols bgp group EBGP peer-as 200
set protocols bgp group EBGP neighbor 10.3.3.3
set protocols bgp group EBGP neighbor 10.3.3.3 description "PEER1"
set protocols bgp group EBGP neighbor 10.4.4.4
set protocols bgp group EBGP neighbor 10.4.4.4 description "PEER2"
set protocols bgp group EBGP family inet unicast

set policy-options policy-statement local_pre term 1 from protocol bgp
set policy-options policy-statement local_pre term 1 then accept
set policy-options policy-statement local_pre term 2 then reject

set protocols bgp group EBGP apply-groups import-policy
set protocols bgp group EBGP import local_pre