set system host-name Spoke1

set interfaces ge-1/0/0 unit 0 family inet address 10.1.2.10/24

set interfaces lo0 unit 0 family inet address 192.168.1.1/32

set interfaces gr-0/0/0 unit 0 family inet address 172.16.1.2/24
set interfaces gr-0/0/0 unit 0 tunnel source ge-1/0/0.0
set interfaces gr-0/0/0 unit 0 tunnel destination 172.16.1.1
set interfaces gr-0/0/0 unit 0 tunnel encapsulation gre

set routing-options router-id 10.1.2.10
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface gr-0/0/0.0
set protocols ospf export static-to-ospf

set routing-options static route 192.168.0.0/24 next-hop 172.16.1.1
set routing-options static route 192.168.2.0/24 next-hop 172.16.1.3

set policy-options policy-statement static-to-ospf term 1 from protocol static
set policy-options policy-statement static-to-ospf term 1 then accept

set security ike policy ike-policy mode main
set security ike policy ike-policy proposals ike-proposal
set security ike policy ike-policy pre-shared-key ascii-text "$9$YOUR_PRE_SHARED_KEY"
set security ike proposal ike-proposal authentication-method pre-shared-keys
set security ike proposal ike-proposal dh-group group2
set security ike proposal ike-proposal authentication-algorithm sha1
set security ike proposal ike-proposal encryption-algorithm aes-128-cbc
set security ike gateway ike-gateway ike-policy ike-policy
set security ike gateway ike-gateway address 172.16.1.1
set security ike gateway ike-gateway external-interface ge-1/0/0.0

set security ipsec policy ipsec-policy proposals ipsec-proposal
set security ipsec proposal ipsec-proposal protocol esp
set security ipsec proposal ipsec-proposal authentication-algorithm hmac-sha1-96
set security ipsec proposal ipsec-proposal encryption-algorithm aes-128-cbc
set security ipsec vpn vpn-name ike gateway ike-gateway
set security ipsec vpn vpn-name bind-interface gr-0/0/0.0
set security ipsec vpn vpn-name ike ipsec-policy ipsec-policy