# System Configuration
set system host-name L2TP-Gateway
set system authentication-order radius

# RADIUS Server Configuration
set access radius-server 10.0.0.249 secret "$9$%^%#vS%796FO7%C~pB%CR=q;j}gSCqR-X6+P!.DYI@)%^%"
set access radius-server 10.0.0.249 port 1812
set access accounting-server 10.0.0.249 secret "$9$%^%#vS%796FO7%C~pB%CR=q;j}gSCqR-X6+P!.DYI@)%^%"
set access accounting-server 10.0.0.249 port 1813

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 10.100.100.1/24
set interfaces ge-1/0/0 unit 100 vlan-id 100


# Access Profile
set access profile default1 authentication-order radius
set access profile default1 accounting-order radius
set access profile default1 authorization-order radius

# Static Routing
set routing-options static route 1.1.1.1/32 next-hop 10.100.100.2