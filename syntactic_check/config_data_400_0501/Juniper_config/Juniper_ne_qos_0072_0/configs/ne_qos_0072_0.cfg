set system host-name DeviceA

set class-of-service forwarding-classes queue 4 AF4

set firewall family inet filter DSCP-INBOUND term AF4 from dscp af41
set firewall family inet filter DSCP-INBOUND term AF4 then dscp 18
set firewall family inet filter DSCP-INBOUND term AF4 then forwarding-class AF4
set firewall family inet filter DSCP-INBOUND term AF4 then accept

set firewall family inet filter DSCP-INBOUND term default then accept

set interfaces ge-0/0/0 unit 0 family inet address 2.2.2.1/24
set interfaces ge-0/0/0 unit 0 family inet filter input DSCP-INBOUND

set interfaces ge-0/0/1 unit 0 family inet address 3.3.3.1/24
set interfaces ge-0/0/1 unit 0 family inet filter input DSCP-INBOUND

set class-of-service rewrite-rules exp MPLS-EXP-OUTBOUND forwarding-class AF4 code-point 5

set class-of-service interfaces ge-0/0/0 rewrite-rules exp MPLS-EXP-OUTBOUND
set class-of-service interfaces ge-0/0/1 rewrite-rules exp MPLS-EXP-OUTBOUND