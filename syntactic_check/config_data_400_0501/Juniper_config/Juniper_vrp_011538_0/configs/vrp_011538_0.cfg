set system host-name PE1

set protocols oam ethernet connectivity-fault-management maintenance-domain md1 level 2
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 continuity-check interval 3s
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 1 interface ge-1/0/1.1 direction down
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 remote-mep 2

set protocols mpls interface ge-1/0/2.0
set protocols ldp interface ge-1/0/2.0
set protocols ldp router-id 2.2.2.2

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/2.0

set interfaces ge-1/0/1 unit 1 encapsulation vlan-ccc
set interfaces ge-1/0/1 unit 1 vlan-id 2
set interfaces ge-1/0/1 unit 1 family ccc

set interfaces ge-1/0/2 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/2 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols l2circuit neighbor 1.1.1.1 interface ge-1/0/1.1 virtual-circuit-id 100