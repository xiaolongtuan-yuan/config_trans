set system host-name NATA

set firewall family inet filter ACL-3001 term 1 from source-address 192.168.10.0/24
set firewall family inet filter ACL-3001 term 1 then accept

set interfaces ge-2/0/1 unit 0 family inet address 1.1.1.1/24

set interfaces ge-2/0/0 unit 0 family inet address 192.168.10.1/24

set security nat source pool POOL-1 address 11.11.11.101/32 to 11.11.11.105/32

set security nat source rule-set RS-ACL-3001 from zone trust
set security nat source rule-set RS-ACL-3001 to zone untrust
set security nat source rule-set RS-ACL-3001 rule R1 match source-address 192.168.10.0/24
set security nat source rule-set RS-ACL-3001 rule R1 then source-nat pool POOL-1

set security nat static rule-set STATIC-RULES rule R1 match destination-address 1.1.1.1/32
set security nat static rule-set STATIC-RULES rule R1 then static-nat prefix 192.168.10.1/32

set interfaces ge-2/0/1 enable
set interfaces ge-2/0/0 enable

set security zones security-zone trust interfaces ge-2/0/1
set security zones security-zone untrust interfaces ge-2/0/0
