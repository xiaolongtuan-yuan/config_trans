set system host-name DeviceA

set system radius-server 2001:db8::1:1 secret "$9$132B0B124F0E"  # 加密密钥
set system radius-server 2001:db8::1:1 port authentication 1645
set system radius-server 2001:db8::1:1 port accounting 1646

set system login user admin class super-user
set system login user admin authentication encrypted-password "$9$encryptedpassword"  # 替换为实际加密密码

set access address-assignment pool pool1 family inet6 prefix 2001:db8:2::/64
set access address-assignment pool pool1 family inet6 dhcpv6-attributes name-server 2001:db8::1:2

set access address-assignment pool pool1-inet family inet network 10.1.1.0/24
set access address-assignment pool pool1-inet family inet range pool1-range low 10.1.1.2
set access address-assignment pool pool1-inet family inet range pool1-range high 10.1.1.254
set access address-assignment pool pool1-inet family inet dhcp-attributes router 10.1.1.1

set interfaces ge-1/0/2 flexible-vlan-tagging
set interfaces ge-1/0/2 unit 1 vlan-id 1
