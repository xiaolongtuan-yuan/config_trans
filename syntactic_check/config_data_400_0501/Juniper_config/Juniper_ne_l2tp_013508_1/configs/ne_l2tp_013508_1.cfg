set system host-name Device

# L2TP服务配置（保持不变）
set services l2tp enable

# RADIUS认证配置（保持不变）
set system authentication-order radius
set access profile radius-profile authentication-order radius
set access profile radius-profile radius-server 10.20.20.1 port 1812 secret "$9$<key>"
set access profile radius-profile accounting-port 1813

# 接口配置修正
set interfaces lo0 unit 0 family inet address 192.168.10.1/32
set interfaces ge-1/0/0 unit 0 family inet address 10.11.11.1/24

# VT接口配置修正
set interfaces vt-1/0/0 unit 0 family inet


# OSPF配置（保持不变）
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

# DHCP地址池配置（保持不变）
set access address-assignment pool bas family inet network 192.168.0.0/24
set access address-assignment pool bas family inet range range1 low 192.168.0.10 high 192.168.0.100

# L2TP LNS配置修正
set services l2tp tunnel authentication
set services l2tp tunnel password "$9$<password>"
set services l2tp lns local-address 192.168.10.1
set services l2tp lns tunnel-group LNS interface vt-1/0/0.0

# 计费配置（保持不变）
set system accounting radius source-address 192.168.10.1