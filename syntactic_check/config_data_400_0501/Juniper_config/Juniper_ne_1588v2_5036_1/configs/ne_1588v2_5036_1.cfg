set system host-name DeviceC

!set protocols ptp mode boundary
!set protocols ptp clock-mode boundary
!set protocols ptp domain 1
!set protocols ptp priority1 128
!set protocols ptp priority2 128
!set protocols ptp interface lo0.0
!set protocols ptp transport ipv4 unicast
!set protocols ptp slave 1.1.1.1
!set protocols ptp announce interval 0
!set protocols ptp sync interval 0
!set protocols ptp delay-mechanism peer-delay

set chassis synchronization network-option option1
!set system services ptp

set interfaces lo0 unit 0 family inet address 2.2.2.2/32