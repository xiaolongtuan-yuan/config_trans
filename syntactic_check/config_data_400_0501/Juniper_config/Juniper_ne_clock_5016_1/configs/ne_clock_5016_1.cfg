set system host-name DeviceB

# NTP 配置修正
set system ntp boot-server 192.168.1.1
set system ntp server 192.168.1.1
set system ntp server 192.168.1.2

# 接口配置修正
set interfaces ge-0/0/0 unit 0 family inet address 192.168.1.1/24
set interfaces ge-0/0/1 unit 0 family inet address 192.168.1.2/24

# NTP 服务接口绑定
!set system services ntp interface ge-0/0/0.0
!set system services ntp interface ge-0/0/1.0