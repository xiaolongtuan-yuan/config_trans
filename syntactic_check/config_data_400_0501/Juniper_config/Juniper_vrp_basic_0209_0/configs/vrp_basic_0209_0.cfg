set system host-name SSH_Server

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/16
# 接口默认启用，无需disable命令

set system services ssh protocol-version v2
set system services ssh root-login deny
set system services ssh connection-limit 10
!set system services scp connection-limit 5

set system login user client001 class operator
set system login user client001 authentication encrypted-password "$ABC123"  # 替换为实际加密密码

set system login user client002 class operator
set system login user client002 authentication ssh-ecdsa "ssh-ecdsa AAAAB3NzaC..."  # 替换为实际公钥

!set security pki ca-profile TP enrollment retry 3
!set security pki ca-profile TP enrollment url "http://ca.example.com"
!set security pki ca-profile TP revocation-check use-crl
!set security pki ca-profile TP subject DN "C=cn, O=SSH_SERVER"

!set security pki auto-re-enrollment certificate-id TP