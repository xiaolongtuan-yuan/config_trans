set system host-name HUAWEI

set access radius-server 192.168.7.249 port 1645
set access radius-server 192.168.7.249 secret "$9$0115121A0D1C1A1D1B"
set access radius-server 192.168.7.249 accounting-port 1646

set interfaces ge-0/0/2 flexible-vlan-tagging
set interfaces ge-0/0/2 unit 0 family inet address 192.168.1.1/24
set interfaces ge-0/0/2 unit 0 family ethernet-switching vlan members 1
set interfaces ge-0/0/2 unit 1 family inet address 192.168.100.1/24
set interfaces ge-0/0/2 unit 1 vlan-id 100
!set interfaces ge-0/0/2 unit 0 pppoe-options underlying-interface ge-0/0/2.0
!set interfaces ge-0/0/2 unit 0 pppoe-options client

set access address-assignment pool pool1 family inet network 10.82.0.0/24
set access address-assignment pool pool1 family inet range 10.82.0.2 to 10.82.0.254
set access address-assignment pool pool1 family inet default-router 10.82.0.1
set access address-assignment pool pool1 family inet dns-server 192.168.7.252

set system login user layer2lease1 class super-user
set system login user layer2lease1 authentication encrypted-password "$1$4HRHO=w*}.d>j09'Z:%=:co~p\w9'G-^|-zR'N4"

!set interfaces pp0 unit 0 pppoe-options underlying-interface ge-0/0/2.0
!set interfaces pp0 unit 0 pppoe-options dial-options dialin
!set interfaces pp0 unit 0 family inet

set system authentication-order radius