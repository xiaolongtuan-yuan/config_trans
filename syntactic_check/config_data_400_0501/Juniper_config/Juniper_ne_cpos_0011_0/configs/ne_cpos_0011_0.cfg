set system host-name DeviceA

# SONET接口配置修正
set interfaces so-3/0/0 sonet-options c2 framing c-bit
!set interfaces so-3/0/0 channelized
!set interfaces so-3/0/0 t1-options timeslots 1-15 channel-group 1
!set interfaces so-3/0/0 t1-options timeslots 16-31 channel-group 2

set interfaces ge-3/0/1 unit 0 family inet address 10.1.1.1/24

# 串行接口配置修正
set interfaces se-3/0/0 encapsulation ppp
!set interfaces se-3/0/0 multilink-options bundle-name mlb1
set interfaces se-3/0/0 unit 0 family inet

# 多链路PPP配置修正
!set interfaces ml-ppp0 unit 1 family inet
!set interfaces ml-ppp0 unit 1 ppp-options multilink
!set interfaces ml-ppp0 unit 1 ppp-options multilink-group 1