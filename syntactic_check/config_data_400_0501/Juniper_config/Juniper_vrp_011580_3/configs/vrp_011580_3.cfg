set system host-name PE2

set protocols oam ethernet connectivity-fault-management

set routing-instances evpna instance-type vrf
set routing-instances evpna interface ge-0/0/1.1
set routing-instances evpna route-distinguisher 200:1
set routing-instances evpna vrf-target export target:1:1
set routing-instances evpna vrf-target import target:1:1

set vlans bridge-domain-10 vlan-id 10
set vlans bridge-domain-10 l3-interface irb.10
set routing-instances evpna interface irb.10

set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 unit 1 vlan-id 2
set interfaces ge-0/0/1 unit 1 family bridge interface-mode trunk
set interfaces ge-0/0/1 unit 1 family bridge vlan-id-list 10
set firewall filter bridge-domain-10 term 1 then accept

set protocols oam ethernet connectivity-fault-management interface ge-0/0/1.1
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 level 5
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 md md1
set protocols oam ethernet connectivity-fault-management maintenance-association ma1 vlan bridge-domain-10
set protocols oam ethernet connectivity-fault-management mep 1 interface ge-0/0/1.1 md md1 ma ma1 direction outward
set protocols oam ethernet connectivity-fault-management mep 3 md md1 ma ma1 continuity-check transmit enable
set protocols oam ethernet connectivity-fault-management remote-mep 4 md md1 ma ma1
set protocols oam ethernet connectivity-fault-management remote-mep 4 md md1 ma ma1 continuity-check receive enable
set protocols oam ethernet connectivity-fault-management linktrace test-id 2 md md1 ma ma1 target-mep 4
set protocols oam ethernet connectivity-fault-management delay-measurement test-id 2 md md1 ma ma1