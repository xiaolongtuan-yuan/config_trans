set system host-name DeviceE

# MPLS/LDP Configuration
set protocols mpls interface lo0.0
set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
set protocols mpls interface ge-3/0/0.0
set protocols ldp interface lo0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0
set protocols ldp interface ge-3/0/0.0
set protocols ldp transport-address 5.5.5.9
set protocols ldp router-id 5.5.5.9

# IS-IS Configuration
set protocols isis level 1 disable
set protocols isis level 2 wide-metrics-only
set protocols isis traffic-engineering credibility-protocol-preference
set protocols isis interface lo0.0 passive


# Interface Configuration
set interfaces lo0 unit 0 family inet address 5.5.5.9/32
set interfaces lo0 unit 0 family iso

set interfaces ge-1/0/0 unit 0 family inet address 10.6.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 0 family iso

set interfaces ge-2/0/0 unit 0 family inet address 10.4.1.2/24
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family iso

set interfaces ge-3/0/0 unit 0 family inet address 10.5.1.2/24
set interfaces ge-3/0/0 unit 0 family mpls
set interfaces ge-3/0/0 unit 0 family iso