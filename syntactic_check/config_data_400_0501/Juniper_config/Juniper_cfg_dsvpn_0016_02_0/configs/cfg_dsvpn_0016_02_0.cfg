set system host-name Hub

# 接口配置
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.10/24
set interfaces lo0 unit 0 family inet address 192.168.0.1/32

# GRE隧道配置（需替换<destination IP address>）
set interfaces gr-0/0/0 unit 0 tunnel source 10.1.1.10
set interfaces gr-0/0/0 unit 0 tunnel destination 203.0.113.1  # 示例IP，请替换
set interfaces gr-0/0/0 unit 0 family inet address 172.16.1.1/24

# IKE配置
set security ike proposal ike-proposal1 authentication-method pre-shared-keys
set security ike proposal ike-proposal1 dh-group group14
set security ike proposal ike-proposal1 encryption-algorithm aes-256-cbc
set security ike proposal ike-proposal1 lifetime-seconds 3600

set security ike policy ike-policy1 mode main
set security ike policy ike-policy1 proposals ike-proposal1

set security ike gateway ike-gateway1 ike-policy ike-policy1
set security ike gateway ike-gateway1 external-interface ge-0/0/0.0

# IPSec配置
set security ipsec proposal ipsec-proposal1 protocol esp
set security ipsec proposal ipsec-proposal1 encryption-algorithm aes-256-cbc
set security ipsec proposal ipsec-proposal1 authentication-algorithm hmac-sha-256-128

# VPN绑定
set security ipsec vpn ipsec-vpn1 bind-interface st0.0
set security ipsec vpn ipsec-vpn1 ike gateway ike-gateway1
set security ipsec vpn ipsec-vpn1 ike ipsec-policy ipsec-policy1

# ST接口和路由
set interfaces st0 unit 0 family inet

# OSPF配置（修正router-id冲突）
set protocols ospf area 0 interface gr-0/0/0.0
set protocols ospf area 0 interface lo0.0

set protocols ospf area 1 interface ge-0/0/0.0