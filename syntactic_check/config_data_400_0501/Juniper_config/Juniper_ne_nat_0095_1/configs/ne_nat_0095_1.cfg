set system host-name NATA

# Interface Configuration
set interfaces ge-1/0/0 unit 0 family inet address 192.168.10.1/24
set interfaces ge-1/0/1 unit 0 family inet address 1.1.1.1/24

# Source NAT Pool Configuration
set security nat source pool address-group1 address 11.11.11.101/32 to 11.11.11.105/32

# Source NAT Rule Configuration
set security nat source rule-set NAT-RULES from zone trust
set security nat source rule-set NAT-RULES to zone untrust
set security nat source rule-set NAT-RULES rule NAT-RULE match source-address 192.168.10.0/24
set security nat source rule-set NAT-RULES rule NAT-RULE then source-nat pool address-group1

# Static NAT Configuration
set security nat static rule-set STATIC-NAT rule STATIC-RULE match destination-address 11.11.11.101/32
set security nat static rule-set STATIC-NAT rule STATIC-RULE then static-nat prefix 11.11.11.105/32

# Security Zones Configuration
set security zones security-zone trust interfaces ge-1/0/0.0
set security zones security-zone untrust interfaces ge-1/0/1.0