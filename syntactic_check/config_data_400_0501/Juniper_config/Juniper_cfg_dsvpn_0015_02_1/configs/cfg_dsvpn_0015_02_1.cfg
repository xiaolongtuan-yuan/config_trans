set system host-name Spoke1

# 基础接口配置
set interfaces ge-1/0/0 unit 0 family inet address 10.1.2.10/24
set interfaces lo0 unit 0 family inet address 192.168.1.1/32

# GRE隧道配置修正
set interfaces gr-0/0/0 unit 0 tunnel source 10.1.2.10  # 明确指定源地址而非接口
set interfaces gr-0/0/0 unit 0 tunnel destination 172.16.1.1
set interfaces gr-0/0/0 unit 0 family inet address 172.16.1.2/24
set interfaces gr-0/0/0 unit 0 tunnel protection ipsec-profile IPSEC_PROFILE_NAME  # 修正IPSec配置语法

# OSPF配置修正
set protocols ospf area 0.0.0.0 interface gr-0/0/0.0


# 删除重复的router-id配置（保持单一router-id）