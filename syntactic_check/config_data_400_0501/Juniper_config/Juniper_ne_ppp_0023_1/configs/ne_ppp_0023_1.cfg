set system host-name DeviceB

set interfaces ge-1/0/0 unit 0 family inet address 10.110.0.2/24
set interfaces ge-1/0/0 unit 0 encapsulation ppp

!set interfaces ge-1/0/0 unit 0 ppp-options chap
!set interfaces ge-1/0/0 unit 0 ppp-options chap local-name "rtb"
!set interfaces ge-1/0/0 unit 0 ppp-options chap default-challenge-secret "$9$j]v~7%f[#S'W>j9zzM)3,*!u"  # 加密密钥

!set interfaces ge-1/0/0 no-disable  # 标准启用方式