set system host-name Device

set vlans VLAN10 vlan-id 10

set interfaces ge-0/0/0 unit 0 family ethernet-switching interface-mode access
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members VLAN10
set ethernet-switching-options storm-control interface ge-0/0/0 level 30 pps 3000000 broadcast
set ethernet-switching-options storm-control interface ge-0/0/0 level 30 pps 3000000 multicast
set ethernet-switching-options storm-control interface ge-0/0/0 level 15 pps 1500000 broadcast
set ethernet-switching-options storm-control interface ge-0/0/0 level 15 pps 1500000 multicast
set ethernet-switching-options storm-control interface ge-0/0/0 level 30 pps 3000000 unknown-unicast
set ethernet-switching-options storm-control interface ge-0/0/0 level 15 pps 1500000 unknown-unicast

set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode access
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members VLAN10
set ethernet-switching-options storm-control interface ge-0/0/1 level 30 pps 3000000 broadcast
set ethernet-switching-options storm-control interface ge-0/0/1 level 30 pps 3000000 multicast
set ethernet-switching-options storm-control interface ge-0/0/1 level 15 pps 1500000 broadcast
set ethernet-switching-options storm-control interface ge-0/0/1 level 15 pps 1500000 multicast
set ethernet-switching-options storm-control interface ge-0/0/1 level 30 pps 3000000 unknown-unicast
set ethernet-switching-options storm-control interface ge-0/0/1 level 15 pps 1500000 unknown-unicast