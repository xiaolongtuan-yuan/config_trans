set system host-name BRAS

# 组播路由配置修正
set protocols pim rp static address 10.0.0.1
set routing-options multicast

# DHCP配置修正
set access address-assignment pool bas_local family inet network 10.0.0.0/16
set access address-assignment pool bas_local family inet range dhcp_range low 10.0.0.2 high 10.0.255.254
set access address-assignment pool bas_local family inet dhcp-attributes router 10.0.0.1
set access address-assignment pool ipv4 family inet dhcp-attributes domain-name ipv4

# 系统认证配置修正
set system services ssh authentication-order password
set system services telnet authentication-order password
set system services web-management http authentication-order password

# 接口配置保持不变
set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.1/24
set protocols pim interface ge-0/0/1.0

set interfaces ge-0/0/2 unit 0 family inet address 10.1.2.1/24
set protocols pim interface ge-0/0/2.0

set interfaces ge-0/0/0 unit 0 family inet address 10.1.0.1/24
set protocols pim interface ge-0/0/0.0
set protocols igmp interface ge-0/0/0.0
set protocols igmp static group 224.0.0.0

# 组播转发配置修正
set protocols pim rp static address 10.0.0.1
set class-of-service traffic-control-profiles bas-policy shaping-rate 30m
set class-of-service traffic-control-profiles bas-policy guaranteed-rate 20m