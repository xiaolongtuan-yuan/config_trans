set system host-name PE2

set routing-instances VPNB instance-type vrf
set routing-instances VPNB route-distinguisher 200:1
set routing-instances VPNB vrf-target target:111:1
set routing-instances VPNB interface ge-2/0/0.0

set policy-options community VPN-TARGET members target:111:1
set policy-options policy-statement EXPORT-VPNB term 1 from protocol direct
set policy-options policy-statement EXPORT-VPNB term 1 then community add VPN-TARGET
set policy-options policy-statement EXPORT-VPNB term 1 then accept

set interfaces ge-1/0/0 unit 0 family inet address 10.4.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family inet address 10.11.1.1/24
set interfaces lo0 unit 0 family inet address 5.5.5.5/32

set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0
set protocols ldp router-id 5.5.5.5

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set routing-options router-id 5.5.5.5

set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address 5.5.5.5
set protocols bgp group IBGP family inet-vpn unicast
set protocols bgp group IBGP neighbor 1.1.1.1 description "RR-1"

set routing-instances VPNB protocols bgp group EBGP-PEERS type external
set routing-instances VPNB protocols bgp group EBGP-PEERS peer-as 65420
set routing-instances VPNB protocols bgp group EBGP-PEERS neighbor 10.11.1.2 description "CE-Router"