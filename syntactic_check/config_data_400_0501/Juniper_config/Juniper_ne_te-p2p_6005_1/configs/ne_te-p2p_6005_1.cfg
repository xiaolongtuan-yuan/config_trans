set system host-name P1

# MPLS TE配置修正
set protocols mpls interface ge-3/0/1.0
set protocols mpls interface ge-4/0/1.0

# 接口配置修正
set interfaces ge-3/0/1 unit 0 family inet address 10.1.2.2/24
set interfaces ge-3/0/1 unit 0 family mpls
set interfaces ge-3/0/1 unit 0 family inet filter input ACCEPT_ALL

set interfaces ge-4/0/1 unit 0 family inet address 10.1.4.1/24
set interfaces ge-4/0/1 unit 0 family mpls
set interfaces ge-4/0/1 unit 0 family inet filter input ACCEPT_ALL

# 环回接口配置
set interfaces lo0 unit 1 family inet address 2.2.2.9/32

# OSPF配置修正
set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface ge-3/0/1.0
set protocols ospf area 0.0.0.0 interface ge-4/0/1.0
set protocols ospf traffic-engineering
