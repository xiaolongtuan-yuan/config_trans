set system host-name JUNIPER-NAT64

# 全局IPv6配置
set routing-options router-id 11.11.11.1
set routing-options autonomous-system 65001

# 接口配置
set interfaces ge-2/0/1 disable
!set interfaces ge-2/0/1 unit 0 family inet6 address 2001:db8::1:110e/126

# 防火墙过滤器（标准Juniper语法）
set firewall family inet6 filter INPUT-FILTER term TRAFFIC-POLICY-INPUT then policer P1

set firewall family inet6 filter ACL-3003 term TERM1 from source-address 2001:db8::1:1112/126
set firewall family inet6 filter ACL-3003 term TERM1 from destination-address 64:ff9b::/96
set firewall family inet6 filter ACL-3003 term TERM1 then accept

# NAT64配置（Juniper标准实现）
set services nat64 rule NAT64-RULE match-direction input
set services nat64 rule NAT64-RULE term TERM1 from source-address 2001:db8::1:1112/126
set services nat64 rule NAT64-RULE term TERM1 then translated source-pool NAT-POOL
set services nat64 pool NAT-POOL address 11.11.11.100/29

# 路由配置
!set routing-options static route 64:ff9b::/96 next-hop 2001:db8::1:110e