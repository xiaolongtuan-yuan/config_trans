set system host-name PE1

# LDP Configuration
set protocols ldp router-id 1.1.1.9
set protocols ldp interface lo0.0
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/2.0

# MPLS Configuration
set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/2.0

# Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/2 unit 0 family inet address 10.2.1.1/24
set interfaces ge-0/0/2 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 1.1.1.9/32

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0