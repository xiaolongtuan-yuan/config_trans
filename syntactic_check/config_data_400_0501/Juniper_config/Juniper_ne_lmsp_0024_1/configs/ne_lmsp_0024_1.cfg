set system host-name Device

# ISIS Protocol Configuration
set protocols isis level 1 wide-metrics-only
!set protocols isis graceful-restart
set protocols isis spf-options delay 50
!set protocols isis traffic-engineering

# ISIS Interface Configuration
set protocols isis interface ge-2/0/1.0 point-to-point
set protocols isis interface ge-2/0/2.0 point-to-point
set protocols isis interface lo0.0 passive

# Interface IP Configuration
set interfaces ge-2/0/1 unit 0 family inet address 192.168.1.1/24
set interfaces ge-2/0/2 unit 0 family inet address 192.168.2.1/24
set interfaces lo0 unit 0 family inet address 2.2.2.2/32