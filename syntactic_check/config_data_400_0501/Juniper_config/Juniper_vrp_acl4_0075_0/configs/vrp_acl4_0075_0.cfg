set system host-name PE

# VRF配置修正
set routing-instances vpna instance-type vrf
set routing-instances vpna route-distinguisher 100:1


set routing-instances vpnb instance-type vrf
set routing-instances vpnb route-distinguisher 100:2


# 路由策略修正
set policy-options policy-statement ACL2001 term 1 from instance vpna
set policy-options policy-statement ACL2001 term 1 then accept
set policy-options policy-statement ACL2001 term 2 from instance vpnb
set policy-options policy-statement ACL2001 term 2 then reject
set policy-options policy-statement ACL2001 then reject

# 接口配置修正
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24

set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/24


# 系统配置（保持不变）
set system login class default permissions all
set system login user admin authentication encrypted-password "$1c$`g=H/qo%;7$b6Za%2'[D!0blsOXF=.3QCNC-f)co,[aeE.`e`-<"
set system login user admin class default
set system services ssh
set system services ssh root-login deny  # 添加安全限制