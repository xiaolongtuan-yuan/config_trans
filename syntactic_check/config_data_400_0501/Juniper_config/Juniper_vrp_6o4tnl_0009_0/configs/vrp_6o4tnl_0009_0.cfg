set system host-name DeviceA

set interfaces ge-1/0/0 unit 0 family inet address 192.168.50.2/24

set interfaces st0 unit 10 description "Tunnel10"
set interfaces st0 unit 10 family inet
set interfaces gr-0/0/0 unit 10 encapsulation gre
set interfaces gr-0/0/0 unit 10 tunnel source 192.168.50.2
set interfaces gr-0/0/0 unit 10 tunnel destination 192.168.51.2

set routing-options static route 192.168.51.0/24 next-hop 192.168.50.1