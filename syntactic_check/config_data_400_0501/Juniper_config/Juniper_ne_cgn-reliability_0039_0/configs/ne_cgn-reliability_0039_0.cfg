set system host-name CGN1

set system license nat

set firewall family inet6 filter acl-3001 term t1 from source-address 2001:db8::1:1112/126
set firewall family inet6 filter acl-3001 term t1 from destination-address 64:FF9B::/96
set firewall family inet6 filter acl-3001 term t1 then accept

set class-of-service forwarding-classes queue 1 c1
set firewall family inet6 filter acl-3001 term t1 then forwarding-class c1

set services nat64 rule-set rs1 rule r1 match source-address 2001:db8::1:1112/126
set services nat64 rule-set rs1 rule r1 match destination-address 64:FF9B::/96
set services nat64 rule-set rs1 rule r1 then translated source-pool nat64-group1

set chassis cluster reth-count 2
set chassis cluster redundancy-group 1 node 0 priority 200
set chassis cluster redundancy-group 1 node 1 priority 100
set chassis cluster redundancy-group 1 preempt

set services service-set group1 redundancy-group 1

set services nat pool nat64-group1 address 11.1.1.1 to 11.1.1.255
set services nat64 prefix 64:FF9B::/96

set interfaces ge-1/0/1 unit 0 family inet address 10.1.1.1/24

set interfaces ge-1/0/2 unit 0 family inet6 filter input acl-3001