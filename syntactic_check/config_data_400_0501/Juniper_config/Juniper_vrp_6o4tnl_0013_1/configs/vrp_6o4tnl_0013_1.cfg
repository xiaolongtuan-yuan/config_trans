set system host-name DeviceA

# IPv4 Interface Configuration
set interfaces ge-1/0/1 unit 0 family inet address 10.1.1.1/24

# 6rd Tunnel Configuration (Standard Junos Syntax)
set interfaces st0 unit 1 tunnel source ge-1/0/1.0
set interfaces st0 unit 1 tunnel destination 2001:db8::1
set interfaces st0 unit 1 tunnel protocol ipip6
set interfaces st0 unit 1 family inet6

# Static Route for 6rd Traffic
set routing-options rib inet6.0 static route 2001:db8::/32 next-hop st0.1