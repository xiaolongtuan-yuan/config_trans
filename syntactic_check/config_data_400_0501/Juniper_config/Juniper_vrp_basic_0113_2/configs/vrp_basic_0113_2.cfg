set system host-name client002

set interfaces ge-0/0/0 unit 0 family inet address 10.1.3.3/16
set interfaces ge-0/0/0 enable

set system services ssh
set system services ssh protocol-version v2
set system login user root authentication ssh-rsa "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC..."  # 替换为实际公钥
set system services ssh ciphers aes256-ctr
set system services ssh key-exchange dh-group14-sha1
set system services ssh macs hmac-sha2-256