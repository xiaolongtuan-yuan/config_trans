set system host-name routerB

set firewall family inet filter acl-2001 term 1 from source-address 2.2.2.2/32
set firewall family inet filter acl-2001 term 1 then accept
set firewall family inet filter acl-2001 term default then discard

set firewall policer port-mirror if-exceeding bandwidth-limit 100g
set firewall policer port-mirror then port-mirror

set forwarding-options port-mirroring {

}

set interfaces ge-1/0/1 unit 0 family inet address 7.1.1.2/24
set interfaces ge-1/0/1 unit 0 family inet filter input acl-2001

set interfaces ge-1/0/2 unit 0 family inet address 8.1.1.2/24

set interfaces ge-1/0/3 unit 0 family inet