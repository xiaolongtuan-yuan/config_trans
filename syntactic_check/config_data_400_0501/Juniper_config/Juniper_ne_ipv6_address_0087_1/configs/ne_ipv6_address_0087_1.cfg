set system host-name Device

set system radius-server 10.6.55.55 secret "$9$%^%#vS%796FO7%C~pB%CR=q;j}gSCqR-X6+P!.DYI@)%^%#"
set system radius-server 10.6.55.55 accounting-port 1550
set system radius-server 10.6.55.55 authentication-port 1551

set routing-options rib inet6.0 static route ::/0 discard

set access address-assignment pool pool1 family inet6 prefix 2001:db81::/64
set access address-assignment pool pool1 family inet6 dhcp-attributes name-server 2001:db82::2:2

set routing-options rib inet6.0 static route 2001:db81::/64 next-hop ge-0/0/1.1

set access address-assignment pool pool1 family inet6 prefix-delegation pre1 preferred-lifetime infinity
set access address-assignment pool pool1 family inet6 prefix-delegation pre1 valid-lifetime infinity

set system authentication-order radius
set system accounting order radius
set system accounting events login
set system accounting events ppp
set system accounting events change-log
set access profile radius-profile authentication-order radius
set access profile radius-profile accounting order radius