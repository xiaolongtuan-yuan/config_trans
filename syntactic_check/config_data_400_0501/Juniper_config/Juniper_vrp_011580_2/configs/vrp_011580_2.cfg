set system host-name CE2

# VLAN配置
set vlans VLAN-2 vlan-id 2

# CFM标准配置（IEEE 802.1ag）
set protocols oam ethernet connectivity-fault-management
set protocols oam ethernet connectivity-fault-management maintenance-domain MD2 level 2
set protocols oam ethernet connectivity-fault-management maintenance-domain MD2 maintenance-association MA2 vlan VLAN-2
set protocols oam ethernet connectivity-fault-management maintenance-domain MD2 maintenance-association MA2 continuity-check interval 1s

# MEP配置（外向方向）
set protocols oam ethernet connectivity-fault-management maintenance-domain MD2 maintenance-association MA2 mep 4 interface ge-0/0/1.0 direction outward

# 远程MEP配置
set protocols oam ethernet connectivity-fault-management maintenance-domain MD2 maintenance-association MA2 remote-mep 3

# 丢包测量配置
set protocols oam ethernet connectivity-fault-management maintenance-domain MD2 maintenance-association MA2 loss-measurement profile LM-PROFILE test-interval 1s
set protocols oam ethernet connectivity-fault-management maintenance-domain MD2 maintenance-association MA2 mep 4 loss-measurement enable
set protocols oam ethernet connectivity-fault-management maintenance-domain MD2 maintenance-association MA2 remote-mep 3 loss-measurement enable

# 接口配置
set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members VLAN-2