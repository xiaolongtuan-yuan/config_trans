set system host-name DeviceC

# Forwarding Classes Configuration
set class-of-service forwarding-classes queue 3 best-effort
set class-of-service forwarding-classes queue 3 expedited-forwarding
set class-of-service forwarding-classes queue 3 assured-forwarding
set class-of-service forwarding-classes queue 3 network-control

# DSCP Mappings
set class-of-service classifiers dscp AF3-CLASSIFIER forwarding-class AF3 loss-priority low code-points af31
set class-of-service classifiers dscp AF3-CLASSIFIER forwarding-class AF3 loss-priority low code-points af32
set class-of-service classifiers dscp AF3-CLASSIFIER forwarding-class AF3 loss-priority low code-points af33


# Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 4.4.4.1/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 5.5.5.1/24
set interfaces ge-0/0/1 unit 0 family mpls