set system host-name HUAWEI

set system radius-server 192.168.7.249 port 1812 secret "$9$02050D480809"
set system radius-server 192.168.7.249 accounting-port 1813
set system authentication-order radius
set system accounting events start-stop

set access profile default authentication-order radius
set access profile default accounting-order radius

set system services dhcp-local-server group pool1 interface irb.1
delete access address-assignment pool pool1 family inet network 10.82.0.0/24
set access address-assignment pool pool1 family inet range range1 low 10.82.0.2 high 10.82.0.254
set access address-assignment pool pool1 family inet dhcp-attributes router 10.82.0.1
set access address-assignment pool pool1 family inet dhcp-attributes name-server 192.168.7.252

set interfaces ge-1/0/1 unit 0 family inet address 10.10.7.1/24
set interfaces ge-1/0/1 unit 0 disable

set interfaces ge-1/0/2 unit 2 vlan-id 100
set vlans bridge-1 vlan-id 100

set interfaces irb unit 1 family inet address 10.82.0.1/24
set interfaces irb unit 1 disable

set routing-options static route 10.82.0.0/24 next-hop irb.1
set protocols rstp bridge-priority 32768