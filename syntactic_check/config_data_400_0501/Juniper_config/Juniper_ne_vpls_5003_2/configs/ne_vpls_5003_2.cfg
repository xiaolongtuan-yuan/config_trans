set system host-name PE2

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface lo0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface lo0.0
set protocols ldp transport-address 3.3.3.9

set routing-instances vpls-a2 instance-type virtual-switch
set routing-instances vpls-a2 interface ge-1/0/1.10
set routing-instances vpls-a2 route-distinguisher 3.3.3.9:2
set routing-instances vpls-a2 protocols l2vpn neighbor 1.1.1.9 pw-id 2

set interfaces ge-1/0/0 unit 0 family inet address 10.2.2.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/1 unit 10 vlan-id 10
set interfaces ge-1/0/1 unit 10 family ethernet-switching

set interfaces lo0 unit 0 family inet address 3.3.3.9/32

set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-1/0/0.0