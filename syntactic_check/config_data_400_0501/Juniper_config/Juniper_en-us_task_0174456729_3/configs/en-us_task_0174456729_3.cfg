set system host-name DeviceD

set protocols ldp interface lo0.0
set protocols ldp router-id 4.4.4.9
set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0

set protocols isis interface ge-0/0/0.0 level 1 metric 100
set protocols isis interface lo0.0 level 1 metric 40

set interfaces ge-0/0/0 unit 0 family inet address 10.3.1.2/24
set interfaces ge-0/0/0 unit 0 family iso
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 10.4.1.1/24
set interfaces ge-0/0/1 unit 0 family iso
set interfaces ge-0/0/1 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 4.4.4.9/32
set interfaces lo0 unit 0 family iso