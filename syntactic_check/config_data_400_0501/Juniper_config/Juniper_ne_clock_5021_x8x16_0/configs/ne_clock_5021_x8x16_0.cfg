set system host-name PE1
set system time-zone UTC
set system ntp server 10.0.0.1

set protocols mpls interface ge-0/0/1.0
set protocols mpls interface lo0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp router-id 2.2.2.2
set protocols ldp targeted-session 3.3.3.3

set interfaces t1-1/0/1 framing esf
!set interfaces t1-1/0/1 clocking internal
!set interfaces t1-1/0/1 channelized t1
!set interfaces t1-1/0/1 channel-group 1 timeslots 1-24

set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/1 unit 0 family mpls
!set interfaces ge-0/0/1 synchronization

set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0

!set protocols ptp mode boundary
!set protocols ptp clock-mode boundary
!set protocols ptp domain 0
!set protocols ptp priority1 128
!set protocols ptp priority2 128