set system host-name SSH_Server

# IPv6 ACL配置修正
set firewall family inet6 filter 2000 term 1 from source-address 2001:DB8::/32
set firewall family inet6 filter 2000 term 1 then accept

# SSH密钥生成修正
set system services ssh hostkey-algorithm ssh-rsa
set system services ssh key-exchange dh-group14-sha1

# 用户配置保持不变
set system login user huawei123 uid 2003
set system login user huawei123 class operator
set system login user huawei123 authentication plain-text-password "$1c$+,JS+))\\2$KVNj(.3`_5x0FCKGv}H&.kUTI`Ff&H*eBqO.ua>)$"

# 接口配置修正
set interfaces ge-0/0/0 disable

# SSH服务配置修正
set system services ssh protocol-version v2
set system services ssh root-login deny
set system services ssh authentication-order password
set system services ssh client-alive-interval 300  # 替代原interface绑定

# root用户认证配置
set system login user root authentication plain-text-password