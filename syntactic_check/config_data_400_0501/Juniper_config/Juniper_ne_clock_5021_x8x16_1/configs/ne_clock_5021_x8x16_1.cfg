set system host-name PE2

# MPLS/LDP配置修正
set protocols mpls interface ge-0/0/1.0
set protocols mpls interface lo0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp interface lo0.0
set protocols ldp neighbor 2.2.2.2
set protocols ldp transport-address 3.3.3.3

# L2VPN配置修正
set protocols l2vpn interface ge-0/0/1.0

# 接口配置修正
set interfaces ge-0/0/1 unit 0 family inet address 10.2.2.2/24
set interfaces ge-0/0/1 unit 0 family mpls

# E1接口配置修正
set interfaces e1-0/0/1 framing crc4

set interfaces e1-0/0/1 disable

# SONET接口配置修正
set interfaces so-0/0/1 unit 1 family mpls
set interfaces so-0/0/1 unit 1 encapsulation mpls-ppp

# 环回接口配置
set interfaces lo0 unit 0 family inet address 3.3.3.3/32

# OSPF配置修正
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0