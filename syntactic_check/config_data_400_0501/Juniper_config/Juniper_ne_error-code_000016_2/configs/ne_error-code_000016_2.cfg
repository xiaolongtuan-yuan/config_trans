set system host-name P

set protocols bfd interface ge-0/0/0
set protocols bfd interface ge-0/0/1

set protocols mpls interface lo0.0
set protocols mpls interface ge-0/0/0
set protocols mpls interface ge-0/0/1

set protocols ldp interface ge-0/0/0
set protocols ldp interface ge-0/0/1
set protocols ldp transport-preference ipv4
!set routing-options router-id 4.4.4.4

set interfaces ge-0/0/0 unit 0 family inet address 10.1.3.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set ethernet-switching-options storm-control interface ge-0/0/0 threshold 3 4 resume-threshold 2 5 trigger-section

set interfaces ge-0/0/1 unit 0 family inet address 10.1.5.2/24
set interfaces ge-0/0/1 unit 0 family mpls
set ethernet-switching-options storm-control interface ge-0/0/1 threshold 3 4 resume-threshold 2 5 trigger-section

set interfaces lo0 unit 0 family inet address 4.4.4.4/32
set interfaces lo0 unit 0 family mpls

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0