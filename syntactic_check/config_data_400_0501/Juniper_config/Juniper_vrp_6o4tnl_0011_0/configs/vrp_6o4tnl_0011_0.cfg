set system host-name DeviceA

set interfaces ge-1/0/0 unit 0 family inet address 1.1.1.1/8

set interfaces gr-10 unit 0 tunnel source ge-1/0/0.0
set interfaces gr-10 unit 0 tunnel destination 2002:202:202::1  # 需替换为对端公网IPv6
set interfaces gr-10 unit 0 tunnel protocol gre

set routing-options rib inet6.0 static route ::/0 next-hop 2002:202:202::1
set routing-options rib inet6.0 static route 2002::/16 next-hop gr-10.0