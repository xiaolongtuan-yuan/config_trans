set system host-name DeviceB

set interfaces ge-2/0/0 unit 0 family inet address 10.10.1.2/24
set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set routing-options autonomous-system 200

set policy-options prefix-list bb 10.1.1.1/32

set policy-options community COMMUNITY-10_10 members "10:10"

set policy-options policy-statement aa term set-community from prefix-list bb
set policy-options policy-statement aa term set-community then community add COMMUNITY-10_10
set policy-options policy-statement aa term set-community then accept
set policy-options policy-statement aa term default then accept

set policy-options policy-statement bgp-export term net-2.2.2.2 from route-filter 2.2.2.2/32 exact
set policy-options policy-statement bgp-export term net-2.2.2.2 then accept
set policy-options policy-statement bgp-export term net-10.10.1.0 from route-filter 10.10.1.0/24 exact
set policy-options policy-statement bgp-export term net-10.10.1.0 then accept
set policy-options policy-statement bgp-export term default then reject

set protocols bgp group EBGP type external
set protocols bgp group EBGP local-address 2.2.2.2
set protocols bgp group EBGP peer-as 100
set protocols bgp group EBGP neighbor 1.1.1.1
set protocols bgp group EBGP family inet unicast
set protocols bgp group EBGP multihop ttl 2
set protocols bgp group EBGP export bgp-export
set protocols bgp group EBGP export aa

set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive