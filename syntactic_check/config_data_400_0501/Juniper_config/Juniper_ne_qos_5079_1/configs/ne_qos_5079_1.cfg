set system host-name PE2

set class-of-service forwarding-classes queue 1 af1
set class-of-service classifiers dscp af1-classifier import default
set class-of-service classifiers dscp af1-classifier forwarding-class af1 loss-priority low code-points af11

set class-of-service rewrite-rules dscp gina code-point af11 forwarding-class af1 loss-priority low

set vlans BD10 vlan-id 10
set bridge-domains BD10 interface ge-0/0/1.0

set interfaces ge-0/0/1 unit 0 family ethernet-switching port-mode trunk
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members BD10

set class-of-service interfaces ge-0/0/1 unit 0 classifiers dscp af1-classifier
set class-of-service interfaces ge-0/0/1 unit 0 rewrite-rules dscp gina