set system host-name PE1

set protocols mpls interface ge-0/0/1.0
set protocols mpls interface lo0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp interface lo0.0
set protocols ldp transport-address 1.1.1.1

set interfaces ge-0/0/1 vlan-tagging
set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/1 unit 1 vlan-id 2
set interfaces ge-0/0/1 unit 1 family ethernet-switching

set interfaces ge-0/0/2 disable
set interfaces ge-0/0/2 unit 0 family inet address 10.1.1.1/24

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0