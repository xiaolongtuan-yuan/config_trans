set system host-name BRAS

# 多播基础配置
set routing-options multicast

# 静态路由
set routing-options static route 10.0.0.0/16 next-hop 10.0.0.1

# 防火墙过滤
set firewall family inet filter list1 term permit1 from source-address 225.1.1.1/32
set firewall family inet filter list1 term permit1 then accept
set firewall family inet filter list1 term permit2 from source-address 227.1.1.1/32
set firewall family inet filter list1 term permit2 then accept

# 多播路由
set routing-options multicast interface all

# 认证配置
set system authentication-order radius
set system radius-server 10.0.0.1 secret "$ABC123"  # 替换为实际密钥
set system services ssh
set system login user admin class super-user authentication plain-text-password  # 设置管理用户

# 接口配置
set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.1/24
set protocols pim interface ge-0/0/1.0 mode sparse

set interfaces ge-0/0/2 unit 0 family inet address 10.1.2.1/24
set protocols pim interface ge-0/0/2.0 mode sparse

set interfaces ge-0/0/0 unit 0 family inet
set protocols pim interface ge-0/0/0.0 mode sparse
set protocols igmp interface ge-0/0/0.0 version 3

# VLAN配置
set interfaces irb unit 100 family inet address 10.0.0.1/24
set protocols pim interface irb.100 mode sparse
set protocols igmp interface irb.100 version 3