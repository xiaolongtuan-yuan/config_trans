set system host-name CGN2

set system license nat64

set firewall family inet6 filter ipv6-filter term permit from source-address 2001:db8::1:1112/126
set firewall family inet6 filter ipv6-filter term permit from destination-address 64:ff9b::/96
set firewall family inet6 filter ipv6-filter term permit then accept

set class-of-service classifiers ipv6-classifier forwarding-class best-effort

set chassis redundancy graceful-switchover
set chassis redundancy failover hold-time 60

set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.3/24 vrrp-group 1

set interfaces ge-0/0/2 unit 0 family inet6 filter input ipv6-filter

set services nat64 pool pool1 address 11.1.1.1/24
set services nat64 rule rule1 match-direction input
set services nat64 rule rule1 term t1 from source-prefix 2001:db8::1:1112/126
set services nat64 rule rule1 term t1 then translated source-pool pool1
set services nat64 rule rule1 term t1 then translated destination-prefix 64:ff9b::/96