set system host-name DeviceB

# MPLS基础配置（Batfish兼容语法）
set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0
set protocols mpls interface ge-0/0/2.0
set protocols mpls interface lo0.0
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp router-id 2.2.2.9

# ISIS配置（标准语法）
!set protocols isis interface ge-0/0/0.0 level 1 disable
set protocols isis interface ge-0/0/1.0 level 1 disable
set protocols isis interface ge-0/0/2.0 level 1 disable
set protocols isis interface lo0.0 level 1 passive
set protocols isis interface lo0.0 level 1 metric 10
!set protocols isis net 49.0001.0000.0000.0002.00
set protocols isis reference-bandwidth 100g
set protocols isis traffic-engineering credibility-protocol-preference

# Segment Routing配置
!set protocols source-packet-routing source-routing-path sr1 to 2.2.2.9
!set protocols source-packet-routing segment-list sl1 hop 1 label 16001
!set protocols mpls label-range static-label-range 16000 23999

# TI-LFA配置
!set protocols isis backup-spf-options use-post-convergence-lfa
!set protocols isis backup-spf-options use-source-packet-routing

# 接口配置
set interfaces lo0 unit 0 family inet address 2.2.2.9/32
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/1 unit 0 family inet address 10.2.1.1/24
set interfaces ge-0/0/2 unit 0 family inet address 10.5.1.1/24