set system host-name PE1

# 修正EVPN配置：使用正确的VNI和路由区分符语法
set protocols evpn encapsulation vxlan
!set routing-instances EVPN instance-type evpn
!set routing-instances EVPN vtep-source-interface lo0.0
!set routing-instances EVPN protocols evpn vni-options vni 1000 vrf-target target:1:1
set routing-instances EVPN protocols evpn default-gateway no-gateway-community

# MPLS/LDP配置（保持不变）
set protocols mpls interface ge-1/0/2.0
set protocols ldp interface ge-1/0/2.0
set protocols ldp router-id 1.1.1.1

# OSPF配置（保持不变）
set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/2.0

# 修正BGP配置：分离IPv4和EVPN地址族
set protocols bgp group EBGP type internal
set protocols bgp group EBGP local-address 1.1.1.1
set protocols bgp group EBGP peer-as 100
set protocols bgp group EBGP neighbor 2.2.2.2 family inet unicast
set protocols bgp group EBGP neighbor 2.2.2.2 family evpn signaling

# 接口配置（保持不变）
set interfaces ge-1/0/1 unit 0 family ethernet-switching
set interfaces ge-1/0/2 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/2 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

# 修正CFM配置：使用标准OAM协议路径
set protocols oam cfm maintenance-domain md1 level 5
set protocols oam cfm maintenance-domain md1 maintenance-association ma1
set protocols oam cfm maintenance-domain md1 maintenance-association ma1 mep 1 interface ge-1/0/1.0
set protocols oam cfm maintenance-domain md1 maintenance-association ma1 mep 1 direction down
set protocols oam cfm maintenance-domain md1 maintenance-association ma1 mep 1 continuity-check interval 1s

# 虚拟交换机实例（保持不变）
set routing-instances default instance-type virtual-switch