set system host-name DeviceA

set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.1/24

set interfaces ge-0/0/2 unit 0 family inet

set interfaces ip-0/0/3 unit 0 tunnel source ge-0/0/1.0
set interfaces ip-0/0/3 unit 0 tunnel destination 10.1.1.2
set interfaces ip-0/0/3 unit 0 tunnel encapsulation ipip6
set interfaces ip-0/0/3 unit 0 tunnel ipv6-prefix 2001:db8::/32
set interfaces ip-0/0/3 unit 0 tunnel ipv6-prefix-length 8

set routing-options rib inet6.0 static route 2001:db8::/32 next-hop ip-0/0/3.0