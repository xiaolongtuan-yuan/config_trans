set system host-name ASBR2
set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set interfaces ge-1/0/0 unit 0 family inet address 10.10.2.3/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family inet address 10.10.3.3/24
set interfaces ge-2/0/0 unit 0 family mpls

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0
set protocols ldp deaggregate
set routing-options autonomous-system 200

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf traffic-engineering

set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address 3.3.3.3
set protocols bgp group IBGP family l2vpn signaling
set protocols bgp group IBGP neighbor 4.4.4.4 peer-as 200

set protocols bgp group EBGP type external
set protocols bgp group EBGP local-address 10.10.2.3
set protocols bgp group EBGP peer-as 100
set protocols bgp group EBGP family l2vpn signaling
set protocols bgp group EBGP neighbor 10.10.2.2

set routing-instances vpls interface ge-1/0/0.0
set routing-instances vpls interface ge-2/0/0.0
set routing-instances vpls route-distinguisher 200:1
set routing-instances vpls vrf-target target:200:1

set policy-options policy-statement export-to-vpn term 1 then accept
set protocols bgp group IBGP export export-to-vpn
set protocols bgp group EBGP export export-to-vpn