set system host-name P2

set interfaces lo0 unit 1 family inet address 3.3.3.9/32

set interfaces ge-3/0/3 unit 0 family inet address 10.1.3.2/24
set interfaces ge-3/0/3 unit 0 family mpls
set interfaces ge-4/0/0 unit 0 family inet address 10.1.5.1/24
set interfaces ge-4/0/0 unit 0 family mpls

set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface ge-3/0/3.0
set protocols ospf area 0.0.0.0 interface ge-4/0/0.0
set protocols ospf traffic-engineering

set protocols mpls interface ge-3/0/3.0
set protocols mpls interface ge-4/0/0.0
set protocols rsvp interface ge-3/0/3.0
set protocols rsvp interface ge-4/0/0.0
