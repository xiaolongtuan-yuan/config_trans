set system host-name DeviceB

set vlans vlan10 vlan-id 10

set interfaces ge-3/0/0 unit 0 family ethernet-switching interface-mode access
set interfaces ge-3/0/0 unit 0 family ethernet-switching vlan members vlan10
set ethernet-switching-options analyzer monitor-session 1 input ingress interface ge-3/0/0
set ethernet-switching-options analyzer monitor-session 1 output interface ge-3/0/1

set interfaces ge-3/0/1 unit 0 family inet address 10.1.1.2/24

set interfaces ge-1/0/0 unit 0 family inet address 10.10.1.1/24
set ethernet-switching-options analyzer monitor-session 1 output interface ge-1/0/0
