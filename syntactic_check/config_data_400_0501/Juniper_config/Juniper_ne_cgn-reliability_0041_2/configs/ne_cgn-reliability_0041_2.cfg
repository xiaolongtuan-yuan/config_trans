set system host-name CR

set protocols mpls interface ge-0/0/3
set protocols mpls interface ge-0/0/4
set protocols ldp interface ge-0/0/3   # LDP 需独立配置
set protocols ldp interface ge-0/0/4

set interfaces ge-0/0/3 unit 0 family inet address 10.2.1.2/24
set protocols mpls interface ge-0/0/3
set interfaces ge-0/0/3 unit 0 family mpls

set interfaces ge-0/0/4 unit 0 family inet address 10.3.1.1/24
set protocols mpls interface ge-0/0/4
set interfaces ge-0/0/4 unit 0 family mpls

set protocols ospf area 0 interface ge-0/0/3
set protocols ospf area 1 interface ge-0/0/4
