set system host-name DeviceA

# DHCP Server Configuration
set access address-assignment pool pool1 family inet network 172.30.0.0/24
set access address-assignment pool pool1 family inet range 172.30.0.2 to 172.30.0.200
set access address-assignment pool pool1 family inet dhcp-attributes router 172.30.0.1
set access address-assignment pool pool1 family inet dhcp-attributes name-server 172.30.0.1
set access address-assignment pool pool1 family inet excluded-address 172.30.0.8

# User Authentication
set system login user admin class super-user
set system login user admin authentication encrypted-password "$1$passwordhash"

# Interface Configuration
set interfaces ge-0/0/2 flexible-vlan-tagging
set interfaces ge-0/0/2 unit 0 family ethernet-switching vlan members 100
set interfaces ge-0/0/2 unit 1 vlan-id 100
set interfaces ge-0/0/2 unit 1 family inet address 172.30.0.2/24

# VLAN Configuration
set interfaces vlan unit 100 family inet address 172.30.0.1/24

# Routing Configuration
set routing-options static route 0.0.0.0/0 next-hop 172.30.0.1
set routing-options static route 172.30.0.8/32 next-hop 172.30.0.2

# RADIUS Configuration
set access radius-server 172.30.0.8 port 1812
set access radius-server 172.30.0.8 secret "$9$radiussecret"
set access radius-server 172.30.0.8 accounting-port 1813

# Firewall Filter
set firewall family inet filter ACL-1 term 1 from source-address 172.30.0.8/32
set firewall family inet filter ACL-1 term 1 then accept
set firewall family inet filter ACL-1 term 2 then reject

# DHCP Services
set forwarding-options dhcp-relay server-group dhcp-servers 172.30.0.1
set forwarding-options dhcp-relay active-server-group dhcp-servers
set forwarding-options dhcp-relay group dhcp-group interface ge-0/0/2.1
