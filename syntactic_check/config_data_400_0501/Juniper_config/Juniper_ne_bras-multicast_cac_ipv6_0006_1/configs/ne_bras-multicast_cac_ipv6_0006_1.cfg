set system host-name BRAS

set routing-options multicast

set access profile poolname family inet6 prefix 2001:db8:1::/64
set access profile poolname family inet6 dhcpv6-attributes option 1 2001:db8:1::/64

set security zones security-zone trust interfaces ge-0/0/0.0
set security zones security-zone trust interfaces ge-0/0/1.1
set security zones security-zone trust host-inbound-traffic system-services all
set interfaces ge-0/0/1 unit 1 vlan-id 133

set system authentication-order tacplus local
set system tacplus-server 10.0.0.1 secret "$9$your-secret"

set protocols pim rp static address 2001:db8:1::1
set protocols pim interface ge-0/0/0.0 mode sparse
set protocols pim interface ge-0/0/1.1 mode sparse

set protocols mld interface ge-0/0/1.1 static group FF1E::1
set protocols mld interface ge-0/0/1.1 static group FF1E::2

set interfaces ge-0/0/0 unit 0 family inet6 address 2001:db8:1::1/64
set protocols pim interface ge-0/0/0.0 mode sparse

set interfaces ge-0/0/1 unit 1 family inet6 address 2001:db8:1::/64 eui-64
set protocols pim interface ge-0/0/1.1 mode sparse
set protocols mld interface ge-0/0/1.1

set routing-options rib inet6.0 static route 2001:db8:1::/64 next-hop 2001:db8:1::1

set access profile poolname family inet6 prefix 2001:db8:1::/64