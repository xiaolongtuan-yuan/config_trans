set system host-name Spoke2

set interfaces ge-1/0/0 unit 0 family inet address 10.1.3.10/24
set interfaces ge-1/0/0 unit 0 tunnel source lo0.0
set interfaces ge-1/0/0 unit 0 tunnel multipoint

set interfaces lo0 unit 0 family inet address 192.168.2.1/32

set interfaces gr-1/0/0 unit 0 family inet address 172.16.1.3/24
set interfaces gr-1/0/0 unit 0 tunnel source ge-1/0/0
set interfaces gr-1/0/0 unit 0 tunnel destination 10.1.1.10

set security ipsec vpn IPSEC_PROFILE bind-interface gr-1/0/0
set security ipsec vpn IPSEC_PROFILE ike gateway IKE_GATEWAY
set security ipsec vpn IPSEC_PROFILE ike ipsec-policy IPSEC_POLICY

set protocols ospf area 0.0.0.0 interface gr-1/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0

set protocols ospf area 0.0.0.1 interface ge-1/0/0.0

set routing-options router-id 172.16.1.3