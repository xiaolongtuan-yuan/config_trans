set system host-name Spoke2

set interfaces ge-0/0/0 unit 0 family inet address 10.1.3.10/24
set interfaces lo0 unit 0 family inet address 192.168.2.1/32

set interfaces gr-0/0/0 unit 0 family inet
set interfaces gr-0/0/0 unit 0 family inet address 172.16.1.3/24
set interfaces gr-0/0/0 unit 0 tunnel source 10.1.3.10
set interfaces gr-0/0/0 unit 0 tunnel destination 10.10.1.10
set interfaces gr-0/0/0 unit 0 tunnel protocol gre

!set routing-options dynamic-tunnels gre-tunnel source-address 10.1.3.10
!set routing-options dynamic-tunnels gre-tunnel gre
!set routing-options dynamic-tunnels gre-tunnel destination-networks 10.10.1.10/32

set protocols ospf area 0.0.0.0 interface gr-0/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf reference-bandwidth 100g
!set protocols ospf router-id 192.168.2.1

set routing-instances vpn instance-type vrf
set routing-instances vpn interface gr-0/0/0.0
set routing-instances vpn route-distinguisher 65000:1
set routing-instances vpn vrf-target target:65000:1