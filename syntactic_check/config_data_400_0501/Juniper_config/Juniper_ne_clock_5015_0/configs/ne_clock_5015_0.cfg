set system host-name DeviceA

# 网络时钟同步全局配置（保持不变）
set chassis network-services synchronization
set chassis synchronization network-clock source BITS0 priority 1
set chassis synchronization network-clock output-frequency 2mhz

# 接口时钟配置修正
!set interfaces ge-0/0/0 synchronization source BITS0 priority 2
!set interfaces ge-0/0/1 synchronization source BITS0
