set system host-name UPE

set protocols bfd

set protocols mpls interface ge-0/0/0
set protocols mpls interface ge-0/0/1

set protocols ldp interface ge-0/0/0
set protocols ldp interface ge-0/0/1

set protocols rsvp interface ge-0/0/0
set protocols rsvp interface ge-0/0/1
!set protocols mpls label-switched-path to-PE1 to 2.2.2.2
!set protocols mpls label-switched-path to-PE1 auto-bandwidth
!set protocols mpls label-switched-path to-PE1 fast-reroute
!set protocols mpls label-switched-path to-PE1 link-protection
!set protocols mpls label-switched-path to-PE1 rsvp-resv-style

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family inet address 10.1.5.1/24
set interfaces ge-0/0/1 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf traffic-engineering

set protocols mpls interface lo0.0