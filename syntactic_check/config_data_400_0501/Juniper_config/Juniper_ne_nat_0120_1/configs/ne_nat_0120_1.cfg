set system host-name CGNA

set security nat static rule-set NAT-STATIC-RULES from zone trust
set security nat static rule-set NAT-STATIC-RULES rule STATIC-RULE-1 match destination-address 192.168.10.128/25
set security nat static rule-set NAT-STATIC-RULES rule STATIC-RULE-1 then static-nat prefix 11.11.11.101/25

set security policies from-zone trust to-zone untrust policy PERMIT-ALL match source-address 192.168.10.0/24
set security policies from-zone trust to-zone untrust policy PERMIT-ALL match destination-address 11.11.11.101/25
set security policies from-zone trust to-zone untrust policy PERMIT-ALL match application any
set security policies from-zone trust to-zone untrust policy PERMIT-ALL then permit

set interfaces ge-0/0/0 unit 0 family inet address 192.168.10.1/24
set interfaces ge-0/0/0 unit 0 disable
set interfaces ge-0/0/0 unit 0 family inet filter input ACL-3001

set firewall family inet filter ACL-3001 term TERM-1 from source-address 192.168.10.0/24
set firewall family inet filter ACL-3001 term TERM-1 then accept

set firewall family inet filter TRAFFIC-CLASSIFIER term TERM-1 from source-address 192.168.10.0/24
set firewall family inet filter TRAFFIC-CLASSIFIER term TERM-1 then count TRAFFIC-COUNT
set firewall family inet filter TRAFFIC-CLASSIFIER term TERM-1 then accept

set security nat source pool NAT-POOL address 11.11.11.101/32
set security nat source rule-set NAT-SRC-RULES from zone trust
set security nat source rule-set NAT-SRC-RULES to zone untrust
set security nat source rule-set NAT-SRC-RULES rule SRC-RULE-1 match source-address 192.168.10.0/24
set security nat source rule-set NAT-SRC-RULES rule SRC-RULE-1 then source-nat pool NAT-POOL

set security zones security-zone trust interfaces ge-0/0/0.0 host-inbound-traffic system-services all
set security zones security-zone trust interfaces ge-0/0/0.0 host-inbound-traffic protocols all