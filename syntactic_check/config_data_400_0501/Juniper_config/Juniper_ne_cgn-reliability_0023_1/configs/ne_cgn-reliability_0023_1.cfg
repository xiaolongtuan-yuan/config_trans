set system host-name CGN2

# 会话限制配置（保持不变）
set security flow session-limit 6

# 防火墙过滤器修正
set firewall family inet filter acl3001 term term1 from source-address 192.168.10.0/24
set firewall family inet filter acl3001 term term1 then accept

set firewall family inet filter classifier1 term match-from from source-address 192.168.10.0/24
set firewall family inet filter classifier1 term match-from then accept

# 路由策略修正
set policy-options policy-statement policy1 term classifier1 then next-hop self

# VRRP配置修正
set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.2/24


# VRF配置（保持不变）
set routing-instances service-group1 instance-type vrf
set routing-instances service-group1 route-distinguisher 1:1
set routing-instances service-group1 vrf-target target:1:1
set routing-instances service-group1 interface ge-0/0/1.0


set security nat source rule-set nat1 from zone trust
set security nat source rule-set nat1 to zone untrust
set security nat source rule-set nat1 rule rule1 match source-address 0.0.0.0/0
set security nat source rule-set nat1 rule rule1 then source-nat pool address-group1

# 其他接口配置
set interfaces ge-0/0/1 unit 0 family inet filter input acl3001
set interfaces ge-0/0/2 unit 0 family inet address 192.168.20.1/24

# 安全区域配置（保持不变）
set security zones security-zone trust interfaces ge-0/0/1.0
set security zones security-zone trust host-inbound-traffic system-services all
set security zones security-zone trust host-inbound-traffic protocols all
set security zones security-zone untrust interfaces ge-0/0/2.0
set security zones security-zone untrust host-inbound-traffic system-services all
set security zones security-zone untrust host-inbound-traffic protocols all