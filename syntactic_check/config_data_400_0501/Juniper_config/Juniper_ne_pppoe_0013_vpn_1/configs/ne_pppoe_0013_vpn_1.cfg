set system host-name DeviceA

set access radius-server 192.168.7.249 port 1645
set access radius-server 192.168.7.249 secret "$9$clY:%[]x='-RMNJus[s/VJ:3YBq3"
set access radius-server 192.168.7.249 accounting-port 1646
!set system authentication-order [ radius password ]
set system accounting events ppp start-stop

set interfaces vt1 unit 0 encapsulation ppp
!set interfaces vt1 unit 0 ppp-options chap

set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 unit 1 vlan-id 1
set interfaces ge-0/0/1 unit 1 family bridge
!set interfaces ge-0/0/1 unit 1 family bridge interface-mode access

!set bridge-domains bd1 domain-type bridge
!set bridge-domains bd1 vlan-id none
!set bridge-domains bd1 interface ge-0/0/1.1

set routing-instances isp1 instance-type vrf
set routing-instances isp1 route-distinguisher 100:1
set routing-instances isp1 vrf-target export target:100:100
set routing-instances isp1 vrf-target import target:100:100

set interfaces ge-1/0/1 unit 0 family inet address 10.1.1.1/24

set system services dhcp-local-server group pool1 interface ge-0/0/1.1
set access address-assignment pool pool1 family inet network 10.82.0.0/24
set access address-assignment pool pool1 family inet range 10.82.0.2 to 10.82.0.200
set access address-assignment pool pool1 family inet dhcp-attributes router 10.82.0.1
set access address-assignment pool pool1 family inet dhcp-attributes name-server 192.168.7.252

set system login user admin class super-user
set system login user admin authentication encrypted-password "$1$passwordhash"

set system domain-name isp1.com