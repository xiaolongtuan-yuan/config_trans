set firewall family inet filter ACCESS-LIST-2000 term DENY-10.1.1.1 from source-address 10.1.1.1
set firewall family inet filter ACCESS-LIST-2000 term DENY-10.1.1.1 then discard

set system login class VTY_CLASS permissions all
set system login class VTY_CLASS idle-timeout 30
set system login class VTY_CLASS allow-commands ".*" # 如果需要完全访问权限

set system login user vty-user class VTY_CLASS
set system login user vty-user authentication plain-text-password "@%@%qQ5h+h1Ba#pJOx#+2[NX>3v'Ks6m@1Qg4%T>-q:D>7{](U0.BAb*OlJW&>We\\]@%@%"

set access address-assignment pool VTY_POOL family inet dhcp-attributes lease-time 1800
set system services ssh connection-limit 20
set firewall family inet filter ACCESS-LIST-2000 term DENY-10.1.1.1 then discard
set system services ssh access-profile ACCESS-LIST-2000
