set system host-name PE2

set policy-options policy-statement vpn1-import term 1 from community vpn1-import
set policy-options policy-statement vpn1-import term 1 then accept
set policy-options policy-statement vpn1-export term 1 then community add vpn1-export
set policy-options policy-statement vpn1-export term 1 then accept

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 200:1
set routing-instances vpn1 vrf-target target:111:1
!set routing-instances vpn1 vrf-import vpn1-import
!set routing-instances vpn1 vrf-export vpn1-export

set protocols mpls interface ge-1/0/1
set protocols mpls interface lo0.1
set protocols ldp interface ge-1/0/1
set protocols ldp interface lo0.1
set protocols ldp interface ge-2/0/1

set interfaces ge-1/0/1 unit 0 family inet address 10.3.1.2/32
set interfaces ge-1/0/1 unit 0 family mpls
set interfaces ge-1/0/1 unit 0 encapsulation ethernet-ccc

set interfaces ge-2/0/1 unit 0 family inet address 10.1.2.2/24
set routing-instances vpn1 interface ge-2/0/1

set interfaces lo0 unit 1 family inet address 3.3.3.9/32

set protocols bgp group IBGP type internal
set protocols bgp group IBGP neighbor 1.1.1.9 peer-as 100
set protocols bgp group IBGP neighbor 1.1.1.9 local-address 3.3.3.9
set protocols bgp group IBGP family inet unicast
set protocols bgp group IBGP family inet-vpn unicast
set protocols bgp group IBGP export vpn1-export
set protocols bgp group IBGP import vpn1-import
set protocols bgp group IBGP cluster 3.3.3.9
!set protocols bgp group IBGP neighbor 1.1.1.9 route-reflector-client

set routing-instances vpn1 protocols bgp group VPN1-PE neighbor 10.1.2.1 peer-as 65420