set system host-name PE1

# L2VPN接口配置
set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 unit 1 encapsulation vlan-ccc
set interfaces ge-0/0/1 unit 1 vlan-id 1
set interfaces ge-0/0/1 unit 1 family ccc

# IP/MPLS接口配置
set interfaces ge-0/0/2 unit 0 family inet address 192.168.1.2/24
set interfaces ge-0/0/2 unit 0 family mpls

# MPLS/LDP配置修正
set protocols ldp interface ge-0/0/2.0
set protocols ldp router-id 1.1.1.1
set protocols ldp transport-address 1.1.1.1

# OSPF配置
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0 interface-type p2p

# L2VPN配置修正
set protocols l2circuit neighbor 2.2.2.2 interface ge-0/0/1.1 virtual-circuit-id 1001
set protocols l2circuit neighbor 2.2.2.2 interface ge-0/0/1.1 encapsulation-type ethernet

# CFM配置修正
set protocols oam ethernet connectivity-fault-management
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 level 0
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 vlan 1
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 1 interface ge-0/0/1.1
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 1 direction inward
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 1 ccm-options transmit
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 remote-mep-id 2
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 loss-measurement single-ended
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 continuity-check interval 1s