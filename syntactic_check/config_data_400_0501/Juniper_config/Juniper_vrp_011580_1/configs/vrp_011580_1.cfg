set system host-name PE1

set routing-instances evpna protocols evpn encapsulation vxlan
set routing-instances evpna protocols evpn default-gateway no-gateway-community
set routing-instances evpna route-distinguisher 100:1
set routing-instances evpna vrf-target target:1:1
set routing-instances evpna vrf-table-label
set routing-instances evpna vtep-source-interface lo0.0

set interfaces ge-0/0/1 flexible-vlan-tagging
set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members 10

set protocols oam ethernet connectivity-fault-management maintenance-domain md1 level 0
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 bridge-domain bd10
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 1 interface ge-0/0/1.0 direction outward
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 1 continuity-check transmit interval 1s
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 remote-mep 2