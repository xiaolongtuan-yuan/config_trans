set system host-name DeviceB

# 接口基础配置（保持不变）
set interfaces ge-0/0/2 unit 0 family ethernet-switching vlan members 100
set interfaces ge-0/0/2 unit 0 encapsulation ppp
set interfaces ge-0/0/2 unit 0 mtu 1500


# IP地址配置（保持不变）
set interfaces ge-0/0/2 unit 0 family inet address 10.1.1.2/24

# 接口禁用配置（保持不变）
set interfaces ge-0/0/2 disable
set interfaces ge-0/0/2 unit 0 disable