set system host-name CE2

# Interface Configurations (Simplified)
set interfaces ge-1/0/0 unit 0 family inet address 192.168.0.2/24
set interfaces ge-1/0/1 unit 0 family inet address 172.16.1.1/24

# OSPF Configuration (Added .0 suffix)
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/1.0