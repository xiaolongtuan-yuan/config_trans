set system host-name PE2

set protocols rsvp

set interfaces ge-2/0/2 flexible-vlan-tagging
set interfaces ge-2/0/2 unit 1 vlan-id 10
set interfaces ge-2/0/2 unit 1 family ethernet-switching
set interfaces ge-2/0/2 unit 0 family ethernet-switching interface-mode trunk
set protocols l2circuit neighbor 1.1.1.9 interface ge-2/0/2.1 virtual-circuit-id 2

set interfaces ge-5/0/1 unit 0 family inet address 10.1.4.2/24
set interfaces ge-5/0/1 unit 0 family mpls
set protocols mpls interface ge-5/0/1
set protocols rsvp interface ge-5/0/1

set interfaces ge-5/0/0 unit 0 family inet address 10.1.5.2/24
set interfaces ge-5/0/0 unit 0 family mpls
set protocols mpls interface ge-5/0/0
set protocols rsvp interface ge-5/0/0

set interfaces lo0 unit 1 family inet address 4.4.4.9/32

set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface ge-5/0/1.0
set protocols ospf area 0.0.0.0 interface ge-5/0/0.0
set protocols ospf traffic-engineering

set protocols ldp interface ge-5/0/1
set protocols ldp interface ge-5/0/0
set protocols ldp targeted-session 1.1.1.9
set routing-options router-id 4.4.4.9