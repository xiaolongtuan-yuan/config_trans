set system host-name CE1

# VLAN配置
set vlans vlan-2 vlan-id 2

# 接口配置
set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members vlan-2

# CFM全局配置
set protocols oam ethernet connectivity-fault-management

# 维护域配置
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 level 5
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 vlan vlan-2
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 continuity-check interval 1s

# MEP配置（维护端点）
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 2 interface ge-0/0/1.0
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 2 direction outward
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 2 continuity-check

# 远程MEP配置
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 remote-mep 1