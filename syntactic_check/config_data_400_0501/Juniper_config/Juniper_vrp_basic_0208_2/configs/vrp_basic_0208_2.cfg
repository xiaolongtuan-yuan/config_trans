set system host-name client002

# Interface Configuration
set interfaces ge-0/0/0 unit 0 family inet address 10.1.3.3/16

# SSH Configuration
set system services ssh protocol-version v2
set system services ssh root-login allow
set system services ssh connection-limit 10

# Login Security
set system login user root authentication plain-text-password "$9$<encrypted-password>"
set system login user root retry-limit 3

# Service Management
set system services telnet