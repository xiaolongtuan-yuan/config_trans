set system host-name CE1

!set protocols ptp global domain 1
!set protocols ptp global clock-type boundary

set interfaces ge-2/0/0 unit 0 family inet address 172.16.0.2/24
!set interfaces ge-2/0/0 unit 0 family ptp
!set interfaces ge-2/0/0 unit 0 ptp clock-mode boundary
!set interfaces ge-2/0/0 unit 0 ptp delay-mechanism p2p
!set interfaces ge-2/0/0 unit 0 ptp log-min-pdelay-req-interval 1
!set interfaces ge-2/0/0 unit 0 ptp announce-interval 1
!set interfaces ge-2/0/0 unit 0 ptp transport ipv4
!set interfaces ge-2/0/0 unit 0 ptp source-ip 172.16.0.2
!set interfaces ge-2/0/0 unit 0 ptp destination-ip 172.16.0.1
!set interfaces ge-2/0/0 unit 0 ptp destination-mac 00:e0:fc:11:11:11

set interfaces ge-1/0/0 unit 0 family inet address 10.10.0.1/24
!set interfaces ge-1/0/0 unit 0 family ptp
!set interfaces ge-1/0/0 unit 0 ptp clock-mode boundary
!set interfaces ge-1/0/0 unit 0 ptp delay-mechanism p2p
!set interfaces ge-1/0/0 unit 0 ptp log-min-pdelay-req-interval 1
!set interfaces ge-1/0/0 unit 0 ptp announce-drop
!set interfaces ge-1/0/0 unit 0 ptp transport ipv4
!set interfaces ge-1/0/0 unit 0 ptp source-ip 10.10.0.1
!set interfaces ge-1/0/0 unit 0 ptp destination-ip 10.10.0.2
!set interfaces ge-1/0/0 unit 0 ptp destination-mac 00:e0:fc:33:11:11

set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0