set system host-name DeviceA

set protocols pim interface ge-1/0/0 mode sparse
set protocols igmp interface ge-1/0/0 join-group 239.0.0.1
set protocols igmp interface ge-1/0/0 join-group 239.0.0.2

set interfaces ge-1/0/0 unit 100 vlan-id 100
set protocols pim interface ge-1/0/0.100 mode sparse
set protocols igmp interface ge-1/0/0.100 join-group 239.0.0.1
set protocols igmp interface ge-1/0/0.100 join-group 239.0.0.2

set interfaces ge-2/0/0 unit 0 family inet address 10.0.0.3/24
set protocols pim interface ge-2/0/0 mode sparse

set firewall policer huawei-policer if-exceeding bandwidth-limit 2m
set firewall policer huawei-policer if-exceeding burst-size-limit 250k
set firewall policer huawei-policer then discard

set firewall family inet filter huawei-filter term huawei from protocol tcp
set firewall family inet filter huawei-filter term huawei then policer huawei-policer
set firewall family inet filter huawei-filter term huawei then accept

set interfaces ge-1/0/0 unit 0 family inet filter input huawei-filter

set policy-options prefix-list cctv 239.0.0.0/24
set policy-options prefix-list jstv 239.0.0.0/24

set protocols pim join-filter cctv prefix-list cctv
set protocols pim join-filter jstv prefix-list jstv