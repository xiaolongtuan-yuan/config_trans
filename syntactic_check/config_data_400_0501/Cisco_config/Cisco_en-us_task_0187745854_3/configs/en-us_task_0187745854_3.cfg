hostname ASBR2
!
! OSPF配置（移除不支持的bgp-ls）
router ospf 1
 router-id 3.3.3.3
 network 3.3.3.3 0.0.0.0 area 0
 network 10.10.2.0 0.0.0.255 area 0
 network 10.10.3.0 0.0.0.255 area 0
 capability vrf-lite  ! 可选优化
!
! 接口配置
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.10.2.3 255.255.255.0
 mpls ip
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.10.3.3 255.255.255.0
 mpls ip
!
interface Loopback1
 ip address 3.3.3.3 255.255.255.255
!
! MPLS基础配置
mpls ldp
 !router-id Loopback1 force
 !
 !address-family ipv4
 !exit-address-family
!
mpls label range 1000 1999  ! 明确标签范围
mpls traffic-eng tunnels
!
! BGP配置（标准L2VPN语法）
router bgp 200
 bgp router-id 3.3.3.3
 neighbor 4.4.4.4 remote-as 200
 neighbor 4.4.4.4 update-source Loopback1
 neighbor 10.10.2.2 remote-as 100
 !
 address-family vpnv4
  neighbor 4.4.4.4 activate
  neighbor 4.4.4.4 send-community extended
 exit-address-family
 !
 address-family l2vpn vpls
  neighbor 4.4.4.4 activate
  neighbor 4.4.4.4 send-community both
  neighbor 10.10.2.2 activate
  neighbor 10.10.2.2 route-map VPN-TARGET in  ! 使用标准route-map
 exit-address-family
!
! Route-map定义
route-map VPN-TARGET permit 10
 !match extcommunity RT_100:1  ! 需提前定义扩展团体
!
end