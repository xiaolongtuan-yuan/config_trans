hostname SSH_Server
!
ipv6 access-list SSH-ACL
 permit ipv6 2001:DB8::/32 any
!
crypto key generate rsa modulus 2048
!
aaa new-model
!
username huawei123 privilege 15 secret 0 $1c$+,JS+))\\2$KVNj(.3`_5x0FCKGv}H&.kUTI`Ff&H*eBqO.ua>)$
!
interface GigabitEthernet0/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8::1/32
!
ip ssh version 2
ip ssh source-interface GigabitEthernet0/0/0
!
line vty 0 14
 access-class SSH-ACL in
 transport input ssh
 privilege level 15
 login local
!
end