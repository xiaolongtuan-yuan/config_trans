hostname CE2
!
vlan 2
!
ethernet cfm global
!
ethernet cfm domain md3 level 4
!
ethernet cfm service ma3 vlan 2
!
interface GigabitEthernet1/0/1
 switchport mode trunk
 switchport trunk allowed vlan 2
 no shutdown
 ethernet cfm mep domain md3 service ma3 4
 ethernet cfm mep domain md3 service ma3 4 inward
 ethernet cfm mep domain md3 service ma3 4 continuity-check
!
ethernet cfm mep crosscheck
 ethernet cfm mep crosscheck start-delay 30
 ethernet cfm mep remote 3 domain md3 service ma3
!
ethernet cfm loss-measurement

!
end