hostname Hub
!
! 物理接口配置
interface GigabitEthernet1/0/0
 ip address 10.1.1.10 255.255.255.0
!
! 环回接口
interface Loopback0
 ip address 192.168.0.1 255.255.255.255
!
! GRE over IPSec隧道配置（Cisco标准语法）
interface Tunnel0
 ip address 172.16.1.1 255.255.255.0
 tunnel mode gre multipoint  ! 修正为多点GRE
 tunnel source GigabitEthernet1/0/0
 tunnel key 1000  ! 添加隧道密钥
 tunnel protection ipsec profile IPSEC_PROFILE  ! 使用已定义的IPSec profile
!
! OSPF配置（标准语法）
router ospf 1
 router-id 172.16.1.1
 network 172.16.1.0 0.0.0.255 area 0
 network 192.168.0.1 0.0.0.0 area 0  ! 精确匹配环回地址
!
router ospf 2
 router-id 10.1.1.10
 network 10.1.1.0 0.0.0.255 area 1
!
! NHRP配置（DSVPN必需）
interface Tunnel0
 ip nhrp network-id 100
 ip nhrp redirect
!
! IPSec配置（需提前定义）
crypto ikev2 profile IKEV2_PROFILE
 match identity remote address 0.0.0.0
 authentication remote pre-share
 authentication local pre-share
 keyring local PSK_KEYRING
!
crypto ipsec profile IPSEC_PROFILE
 set ikev2-profile IKEV2_PROFILE
!
end