hostname DeviceA
!
! AAA配置
aaa new-model
aaa authentication ppp default group radius
aaa accounting network default start-stop group radius
!
! RADIUS服务器配置
radius-server host 10.20.20.1 auth-port 1812 acct-port 1813 key 7 %^%#vS%796FO7%C~pB%CR=q;j}gSCqR-X6+P!.DYI@)%^%
!
! 虚拟模板配置
interface Virtual-Template1
 ppp authentication chap
!
! PPPoE子接口配置
interface GigabitEthernet2/0/0.100
 encapsulation dot1Q 100

 no shutdown
!
! 环回接口
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
! VPDN配置（L2TP标准语法）
vpdn enable
vpdn-group LAC_GROUP
 accept-dialin
  protocol l2tp
  virtual-template 1

 l2tp tunnel password 7 061A2E3B3C021F1F777D701B1B317D7C1D1A371F1C1E7C
 !source-ip 1.1.1.1
!
! 域名配置
ip domain-name isp1
!
! 物理接口配置
interface GigabitEthernet1/0/1
 no shutdown
 ip address 11.11.11.1 255.255.255.0
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 12.12.12.1 255.255.255.0
!
! 静态路由
ip route 3.3.3.3 255.255.255.255 11.11.11.2
ip route 4.4.4.4 255.255.255.255 12.12.12.2
!
end