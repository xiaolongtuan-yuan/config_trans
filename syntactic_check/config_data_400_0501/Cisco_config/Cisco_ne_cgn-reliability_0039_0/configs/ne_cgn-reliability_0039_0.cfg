hostname CGN1
!
! 启用NAT64（需要高级安全许可证）
license boot level securityk9
!
! IPv6 ACL配置
ipv6 access-list NAT64-TRAFFIC
 permit ipv6 2001:db8::1:1112/126 64:FF9B::/96
!
! NAT64地址池配置
!nat64 v4 pool NAT64-POOL 11.1.1.1 11.1.1.254 prefix-length 24
!nat64 v6v4 list NAT64-TRAFFIC pool NAT64-POOL
!nat64 prefix stateful 64:FF9B::/96
!
! VRRP配置（标准Cisco语法）
interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.1.1.1 255.255.255.0
 vrrp 1 ip 10.1.1.3
 vrrp 1 priority 200
 !vrrp 1 timers advertise 1
 vrrp 1 preempt delay minimum 15
!
! 冗余跟踪配置
track 10 interface GigabitEthernet1/0/1 line-protocol
interface GigabitEthernet1/0/1
 !vrrp 1 track 10 decrement 60
!
! 接口应用NAT64
interface GigabitEthernet1/0/2
 no shutdown
 ipv6 address 2001:db8::1:110e/126
 !nat64 enable
!
end