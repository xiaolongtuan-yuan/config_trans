hostname HUAWEI
!
ip multicast-routing
!
aaa new-model
aaa authentication ppp auth1 group radius local
aaa authorization network auth1 group radius local
aaa accounting network acct1 start-stop group radius
!
ip pim rp-address 10.0.0.2 239.0.0.1
!
radius server rd1
 address ipv4 <RADIUS_SERVER_IP>
 key 0 <RADIUS_KEY>
!
!ip local pool pool1 192.168.1.2 192.168.1.200
ip name-server 192.168.7.252
!
interface Virtual-Template1
 mtu 1492
 ip unnumbered Loopback0
 peer default ip address pool pool1
 ppp authentication pap chap
!
ip access-list extended MCAST_LIST1
 permit ip host 10.0.0.2 host 239.0.0.1
!
class-map match-any MCAST_LIST1
 match access-group name MCAST_LIST1
!
policy-map MCAST-SHAPE
 class MCAST_LIST1
  police cir 5000000 bc 10000000 conform-action transmit exceed-action drop
!
interface GigabitEthernet1/0/0
 no shutdown
 ip pim sparse-mode
 service-policy output MCAST-SHAPE
!
interface GigabitEthernet2/0/0
 no shutdown
 !pppoe enable
 !pppoe-client dial-pool-number 1
 ip igmp version 2
!
end