hostname DeviceA
!
! 组播全局配置（仅需声明一次）
ip multicast-routing distributed  ! 添加distributed参数
!
! Cisco标准QoS配置
class-map match-any VIDEO-CLASS
 match dscp af41
!
policy-map QOS-POLICY
 class VIDEO-CLASS
  police cir 2000000 bc 31250 be 31250   ! CIR 2000kbps转换为bps
   conform-action transmit
   exceed-action drop
!
! 接口配置
interface GigabitEthernet1/0/0
 no shutdown
 ip pim sparse-mode
 ip igmp static-group 239.0.0.1  ! 修正为static-group
 ip igmp static-group 239.0.0.2
 service-policy input QOS-POLICY  ! 使用修正后的策略名称
!
interface GigabitEthernet1/0/0.100
 encapsulation dot1Q 100
 ip pim sparse-mode
 ip igmp static-group 239.0.0.1
 ip igmp static-group 239.0.0.2
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.0.0.3 255.255.255.0
 ip pim sparse-mode
!
! 组播ACL定义
ip access-list standard CCTV
 permit 239.0.0.1 0.0.0.255
!
ip access-list standard JSTV
 permit 239.0.0.2 0.0.0.255
!
! 组播边界配置（Cisco标准语法）
interface GigabitEthernet1/0/0
 ip multicast boundary CCTV  ! 直接在接口下应用
 ip multicast boundary JSTV
!
! 组播优化参数
ip multicast limit per-destination 1024  ! 替代unicast-reservable-bandwidth
ip multicast threshold-list 15 15 20    ! 合并两条检测命令
!
end