hostname Device
!
! QoS配置
class-map match-any AF4-CLASS
 match dscp af41
 match dscp af42
 match dscp af43
!
policy-map QOS-POLICY
 class AF4-CLASS
  set dscp af41
  police cir 1000000 conform-action transmit exceed-action drop
!
! RADIUS配置
radius-server host 192.168.7.249 auth-port 1645 acct-port 1646 key 7 0 clY:%[]x='-RMNJus[s/VJ:3YBq3<..|.{'xgbp+%^%
!
! DHCP配置
ip dhcp pool pool1
 network 10.82.0.0 255.255.255.0
 default-router 10.82.0.1
 dns-server 192.168.7.252
!
! AAA配置
aaa new-model
aaa authentication ppp default group radius
aaa accounting network default start-stop group radius
!
! 接口配置
interface Virtual-Template1
 ppp authentication chap
!
interface GigabitEthernet0/2/0
 no shutdown
!
interface GigabitEthernet0/2/0.1
 encapsulation dot1q 1
 
!
interface Dialer1
 mtu 1492
 ip address negotiated
 encapsulation ppp
 dialer pool 1
 ppp authentication chap callin
 ppp chap hostname user@isp1
 ppp chap password 0 password
!
interface GigabitEthernet0/1/0
 no shutdown
 ip address 192.168.7.1 255.255.255.0
 service-policy output QOS-POLICY
!
end