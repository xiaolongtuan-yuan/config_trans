hostname DeviceB
!
controller E1 2/0/0
 framing crc4
 channel-group 1 timeslots 1-15
!
controller E1 2/0/1
 framing crc4
 channel-group 1 timeslots 16-31
!
interface Serial2/0/0:1
 no shutdown
 no keepalive
 ppp multilink
! multilink-group 1
!
interface Serial2/0/1:1
 no shutdown
 no keepalive
 ppp multilink
 !multilink-group 1
!
interface Multilink1
 no shutdown
 ip address 10.1.1.2 255.255.255.0
 ppp multilink
 ppp multilink group 1
!
end