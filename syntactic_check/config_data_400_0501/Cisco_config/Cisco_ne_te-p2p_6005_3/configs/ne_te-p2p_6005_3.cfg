hostname PE2

! MPLS全局配置
mpls ip
mpls traffic-eng tunnels
!mpls label protocol ldp
mpls ldp router-id Loopback1 force
mpls ldp discovery targeted-hello accept
!

! L2VPN配置
!mpls l2vpn logging pseudowire status
!
pseudowire-class P2P_VC
 encapsulation mpls
 !protocol ldp
!
l2vpn vfi context DTB2
 vpn id 100
 !neighbor 1.1.1.9 pw-class P2P_VC
!

! 接口配置
interface GigabitEthernet2/0/2.1
 encapsulation dot1Q 10
 mpls l2transport route 1.1.1.9 1
!

interface GigabitEthernet5/0/1
 no shutdown
 ip address 10.1.4.2 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 ip rsvp bandwidth 10000 10000
!

interface GigabitEthernet5/0/0
 no shutdown
 ip address 10.1.5.2 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 ip rsvp bandwidth 10000 10000
!

interface Loopback1
 ip address 4.4.4.9 255.255.255.255
!

! OSPF-TE配置
router ospf 1
 mpls traffic-eng router-id Loopback1
 mpls traffic-eng area 0
 network 4.4.4.9 0.0.0.0 area 0
 network 10.1.4.0 0.0.0.255 area 0
 network 10.1.5.0 0.0.0.255 area 0
!
end