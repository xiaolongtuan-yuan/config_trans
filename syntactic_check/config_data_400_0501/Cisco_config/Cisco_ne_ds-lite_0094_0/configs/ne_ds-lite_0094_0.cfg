hostname DS-Lite

! License commands removed as they are platform-specific
! Use actual license activation commands for your platform

ipv6 access-list ACL_DSLITE
 permit ipv6 2001:DB8:2::/64 any

!ipv6 local pool DS-Lite-POOL 2001:DB8::1/128

vrf definition DS-Lite1
 rd 100:1
 !
 address-family ipv6
  route-target export 100:1
  route-target import 100:1

interface Tunnel1
 no ip address
 !tunnel mode ipv6ip ds-lite
 tunnel source GigabitEthernet2/0/1
 !tunnel destination 2001:DB8:2::1
 !tunnel vrf DS-Lite1
 !tunnel ttl 255
 ipv6 enable
 ipv6 vrf forwarding DS-Lite1

interface GigabitEthernet2/0/1
 no shutdown
 ipv6 address 2001:DB8::1/64
 ipv6 traffic-filter ACL_DSLITE in
 service-policy input DS-Lite-Policy

class-map match-any CM_DSLITE
 match access-group name ACL_DSLITE

policy-map PM_DSLITE
 class CM_DSLITE
  police 1000000 conform-action transmit exceed-action drop

router isis
 net 49.0001.0000.0000.0000.00
 is-type level-1
 metric-style wide
 !
 address-family ipv6
  redistribute connected
  redistribute static

ipv6 route vrf DS-Lite1 2001:DB8:2::/64 Tunnel1

end