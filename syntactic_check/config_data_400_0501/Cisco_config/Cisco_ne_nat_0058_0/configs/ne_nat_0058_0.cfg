hostname NATA
!
! License配置（根据实际平台可能需要调整）
license boot level ipbase
!
! NAT全局配置
ip nat translation max-entries 6
ip nat inside source list NAT-ACL interface GigabitEthernet3/0/0 overload
ip nat inside source static 192.168.10.10 1.1.1.100
!
! ACL配置
ip access-list standard NAT-ACL
 permit 192.168.10.0 0.0.0.255
!
! 接口配置
interface GigabitEthernet2/0/0
 ip address 192.168.10.1 255.255.255.0
 ip nat inside
 no shutdown
!
interface GigabitEthernet3/0/0
 ip address 2.2.2.1 255.255.255.0
 ip nat outside
 no shutdown
!
! 路由配置
router ospf 1
 network 2.2.2.0 0.0.0.255 area 0
!
ip route 0.0.0.0 0.0.0.0 2.2.2.2
!
end