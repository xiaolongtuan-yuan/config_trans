hostname CE2

ethernet cfm global
ethernet cfm enable

interface GigabitEthernet1/0/1
 no shutdown
 switchport
 switchport trunk allowed vlan 10

ethernet cfm domain md2 level 6
ethernet cfm maintenance-association ma2 md2
service ccm
ethernet cfm cc
ethernet cfm crosscheck
ethernet cfm mep 62 ma ma2 interface GigabitEthernet1/0/1 outward
ethernet cfm cc mep 62 ma ma2 interval 10000
ethernet cfm cc mep 62 ma ma2 enable
ethernet cfm remote-mep 61 ma ma2
ethernet cfm cc remote-mep 61 ma ma2 enable
ethernet cfm ais ma ma2 enable
ethernet cfm ais ma ma2 suppress-alarm

end