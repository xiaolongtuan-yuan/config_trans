hostname PE1
!
ethernet cfm global
!
l2vpn evpn instance evpna
! rd 100:1
! route-target import 1:1
! route-target export 1:1
!
bridge-domain 10
! member evpn-instance evpna
 !
! evpn
!  vni 10010  ! 必须指定具体VNI数值
!  rd 100:1
!  route-target import 1:1
!  route-target export 1:1
!
interface GigabitEthernet1/0/1.1
 encapsulation dot1Q 2
 service instance 2 ethernet
  rewrite ingress tag pop 1 symmetric
  bridge-domain 10
!
ethernet cfm domain md1 level 7
 service ma1
 ! continuity-check
 ! mep 1 interface GigabitEthernet1/0/1.1 inward
 ! remote-mep 2 1
!
ethernet cfm mep 1 domain md1 service ma1 continuity-check
 ethernet cfm mep 2 domain md1 service ma1 continuity-check
 ethernet cfm loss-measurement
 ! mep 1 domain md1 service ma1
 ! measurement-interval 1s
!
end