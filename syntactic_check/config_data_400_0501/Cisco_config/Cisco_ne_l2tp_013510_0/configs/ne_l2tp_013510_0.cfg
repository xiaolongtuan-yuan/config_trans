! L2TP全局配置
vpdn enable  ! 替代l2tp enable

! RADIUS服务器配置
radius-server host 10.0.0.249 auth-port 1812 acct-port 1813 key 7 %^%#vS%796FO7%C~pB%CR=q;j}gSCqR-X6+P!.DYI@)%^%

! 虚拟模板配置
interface Virtual-Template1
 ppp authentication chap

! 物理接口配置
interface GigabitEthernet1/0/0
 no shutdown

! PPPoE子接口配置
interface GigabitEthernet1/0/0.100
 encapsulation dot1Q 100
 !pppoe enable
 no shutdown
 service-policy type control subscriber default-in-policy

! 出口接口配置
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.100.100.1 255.255.255.0

! VPDN组配置（替代原l2tp-class）
vpdn-group LAC1
 accept-dialin
  protocol l2tp
  virtual-template 1
 !terminate-from hostname LAC1
 l2tp tunnel password 7 061A2E3B3C021F1F777D701B1B317D7C1D1A371F1C1E7C
 !source-ip 10.100.100.1
 !initiate-to ip 1.1.1.1

! AAA配置
aaa new-model
aaa authentication ppp default group radius local
aaa authorization network default group radius local
aaa accounting network default start-stop group radius

! 静态路由
ip route 1.1.1.1 255.255.255.255 10.100.100.2
end