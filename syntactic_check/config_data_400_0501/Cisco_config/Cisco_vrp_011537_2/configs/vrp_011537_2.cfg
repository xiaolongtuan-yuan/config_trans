hostname PE2
!
mpls ip
 !
!
l2vpn vfi context ldp1
 vpn id 1
!
interface GigabitEthernet1/0/1.1
 encapsulation dot1Q 2
 xconnect 2.2.2.2 1 encapsulation mpls
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.1.2 255.255.255.0
 mpls ip
