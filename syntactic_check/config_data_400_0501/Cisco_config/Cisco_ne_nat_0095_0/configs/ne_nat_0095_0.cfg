hostname NATA
!
vrf definition VRF1
 rd 1:1
 route-target export 1:1
 route-target import 1:1
 !
 address-family ipv4
 exit-address-family
!
ip nat pool NAT_POOL1 11.11.11.101 11.11.11.105 netmask 255.255.255.0
ip access-list extended ACL1
 permit ip 192.168.10.0 0.0.0.255 any
!
ip nat inside source list ACL1 pool NAT_POOL1 vrf VRF1 overload
!
interface GigabitEthernet1/0/0
 vrf forwarding VRF1
 ip address 192.168.10.1 255.255.255.0
 ip nat inside
 no shutdown
!
interface GigabitEthernet1/0/1
 ip address 1.1.1.1 255.255.255.0
 ip nat outside
 no shutdown
!
end