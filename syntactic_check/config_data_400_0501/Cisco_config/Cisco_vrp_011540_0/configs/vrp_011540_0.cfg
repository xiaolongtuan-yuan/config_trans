hostname CE1

vlan 2
 name VLAN2
!

ethernet cfm
 !domain D3 level 3
  service S3 vlan 2
  ! continuity-check
   !mep 3
    interface GigabitEthernet1/0/1
    !direction outward
    !continuity-check
   !
   !mep 4
    interface GigabitEthernet1/0/1
    !direction inward
    !continuity-check
    !remote-mep 3
   !
  !
 !
!

interface GigabitEthernet1/0/1
 switchport mode trunk
 switchport trunk allowed vlan 2
 no shutdown
!
end