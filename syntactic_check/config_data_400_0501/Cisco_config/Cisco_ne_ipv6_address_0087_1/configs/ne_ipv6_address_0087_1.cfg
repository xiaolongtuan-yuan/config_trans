hostname Device
!
aaa new-model
!
radius server rd1
 address ipv4 10.6.55.55 auth-port 1550 acct-port 1551
 key plain Cisco123  ! 实际部署请使用真实密钥
!
ipv6 unicast-routing
!
!ipv6 local pool pre1 2001:db81::/48 64  ! 必须先定义前缀池
!
ipv6 dhcp pool pool1
 dns-server 2001:db82::2:2
 !address prefix pre1 lifetime infinite infinite
!
interface GigabitEthernet1/0/1.1
 ipv6 address autoconfig
 ipv6 enable
 ipv6 nd managed-config-flag
 ipv6 nd other-config-flag
 ipv6 dhcp server pool1
!
interface GigabitEthernet1/0/3
 ipv6 address 2001:DB82::2:1/64
 ipv6 enable
 ipv6 dhcp relay destination 2001:db82::2:2 GigabitEthernet1/0/1.1
!
ipv6 route 2001:db81::/64 GigabitEthernet1/0/1.1
!
aaa authentication login default group rd1
aaa authorization exec default group rd1
aaa accounting exec default start-stop group rd1
aaa authentication dot1x default group rd1
!
radius-server host 10.6.55.55 auth-port 1550 acct-port 1551 key Cisco123
radius-server vsa send accounting
!
end