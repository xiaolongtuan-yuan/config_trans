hostname Device
!
aaa new-model
aaa authentication ppp default group radius
aaa authorization network default group radius
aaa accounting network default start-stop group radius
!
radius-server host 10.20.20.1 auth-port 1812 acct-port 1813 key 7 vS%796FO7%C~pB%CR=q;j}gSCqR-X6+P!.DYI@
!
policy-map QoS-Pro1
 class class-default
  shape average 100000
  shape peak 200000
!
interface Virtual-Template1
 ppp authentication chap
 ppp authorization
 ppp accounting
!
interface GigabitEthernet1/0/0
 no shutdown
!
interface GigabitEthernet1/0/0.2
 encapsulation dot1Q 270

 no shutdown
!
interface Loopback0
 ip address 192.168.0.1 255.255.255.255
!
!ip local pool pool1 10.10.10.2 10.10.10.100
ip route 10.10.10.0 255.255.255.0 10.10.10.1
!
vpdn enable
vpdn-group lns1
 accept-dialin
  protocol l2tp
  virtual-template 1
 ! terminate-from hostname LNS
 l2tp tunnel password 7 EncryptedPassword
!
end