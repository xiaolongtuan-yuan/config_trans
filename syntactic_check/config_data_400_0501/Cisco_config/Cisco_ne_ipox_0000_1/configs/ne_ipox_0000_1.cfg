hostname HUAWEI
!
ip dhcp pool pool1
 network 172.30.0.0 255.255.255.0
 default-router 172.30.0.1
!
ip dhcp excluded-address 172.30.0.8
!
aaa new-model
username admin privilege 15 secret 0 %^%#oNUw%i-|"WcBgt8=fSVID7F<=K_N+.(ip[H\:a{D%^%#
!
aaa authentication login default local
aaa authorization exec default local
aaa accounting exec default start-stop group radius
!
!ip local pool pool1 172.30.0.2 172.30.0.254
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 192.168.8.1 255.255.255.0
!
interface GigabitEthernet2/0/0.1
 encapsulation dot1Q 510
 ip address dhcp
 ppp authentication chap
!
interface Vlan1
 ip address 172.30.0.8 255.255.255.0
!
!ip default-gateway 172.30.0.1
!
end