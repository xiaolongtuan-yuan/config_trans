hostname NATA

ip cef

ip nat pool address-group1 1.1.1.101 1.1.1.105 netmask 255.255.255.0

access-list 1 permit 192.168.10.0 0.0.0.255

ip nat inside source static 192.168.10.10 1.1.1.100

interface GigabitEthernet1/0/1
 no shutdown
 ip address 192.168.10.1 255.255.255.0
 ip nat inside

interface GigabitEthernet1/0/2
 no shutdown
 ip address 2.2.2.1 255.255.255.0
 ip nat outside

ip nat inside source list 1 pool address-group1 overload

router ospf 1
 network 2.2.2.0 0.0.0.255 area 0

ip route 0.0.0.0 0.0.0.0 2.2.2.2

end
