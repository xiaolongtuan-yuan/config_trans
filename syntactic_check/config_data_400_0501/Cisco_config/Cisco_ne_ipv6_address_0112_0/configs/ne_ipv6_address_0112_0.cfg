hostname Device

! AAA配置
aaa new-model
aaa authentication login auth1 group radius
aaa accounting connection acct1 start-stop group radius

radius-server host 10.6.55.55 auth-port 1550 acct-port 1551 key 7 13061E010803

! IPv6基础配置
ipv6 unicast-routing

! IPv6静态路由
ipv6 route 2001:DB8::/62 Null0

! DHCPv6配置
ipv6 dhcp pool POOL1
 !address prefix 2001:DB8::/64 lifetime infinite infinite
 dns-server 2001:DB8::2:2
!
!ipv6 local pool POOL1 2001:DB8::/64 64
!ipv6 local pool POOL2 2001:DB8::/62 63

! ND配置
interface GigabitEthernet1/0/1.1
 encapsulation dot1Q 1
 ipv6 enable
 ipv6 address autoconfig default
 ipv6 nd other-config-flag
 ipv6 dhcp client pd hint ::/64

interface GigabitEthernet1/0/2
 ipv6 enable
 ipv6 address 2001:DB8::/64 eui-64
 ipv6 address autoconfig

! PPPoE配置
!bba-group pppoe GLOBAL
 !virtual-template 1
!
interface Virtual-Template1
 ipv6 enable
 ppp authentication pap
!
interface GigabitEthernet1/0/1
 !pppoe enable group GLOBAL
!
end