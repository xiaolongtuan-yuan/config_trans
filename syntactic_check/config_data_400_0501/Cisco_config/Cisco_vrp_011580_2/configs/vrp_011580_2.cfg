hostname CE2
!
vlan 2
!
ethernet cfm global
ethernet cfm domain md1 level 4
!
ethernet cfm maintenance-association ma1 md md1
ethernet cfm mep 4 ma ma1 interface GigabitEthernet1/0/1 outward
ethernet cfm mep 4 ma ma1 ccm-enable
ethernet cfm remote-mep 3 ma ma1
ethernet cfm remote-mep 3 ma ma1 ccm-receive enable
!
interface GigabitEthernet1/0/1
 switchport mode trunk
 switchport trunk allowed vlan 2
 no shutdown
!
end