hostname CGN1
!
! 修正NAT会话限制（Cisco标准语法）
ip nat translation max-entries 6
!
! 修正ACL配置（添加目标地址）
ip access-list extended ACL-3001
 permit ip 192.168.10.0 0.0.0.255 any
!
class-map match-all CLASSIFIER1
 match access-group name ACL-3001
!
! 修正策略映射配置（使用标准NAT语法）
policy-map POLICY1
 class CLASSIFIER1
  !nat dynamic interface
!
! 修正接口配置
interface GigabitEthernet2/0/0
 no shutdown
 ip address 192.168.10.1 255.255.255.0
 ip nat inside
 service-policy input POLICY1
!
interface Loopback0
 ip address 11.11.11.100 255.255.255.255
 ip nat outside
!
! 修正默认路由（使用标准语法）
ip route 0.0.0.0 0.0.0.0 10.1.1.1
!
end