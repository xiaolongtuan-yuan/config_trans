hostname PE1
!
ethernet cfm global
ethernet cfm enable
!
l2vpn evpn instance 1 vlan-based
 !rd 100:1
 !route-target import 1:1
 !route-target export 1:1
!
mpls ip
!mpls ldp
! mpls label protocol ldp
!
mpls ldp router-id Loopback0 force
!
interface GigabitEthernet1/0/1
 no shutdown
 service instance 1 ethernet
  encapsulation dot1q 1
  rewrite ingress tag pop 1 symmetric
  bridge-domain 100
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.1.1 255.255.255.0
 mpls ip
 mpls ldp enable
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
router bgp 100
 neighbor 2.2.2.2 remote-as 100
 neighbor 2.2.2.2 update-source Loopback0
 !
 address-family ipv4 unicast
  neighbor 2.2.2.2 activate
  neighbor 2.2.2.2 next-hop-self
 !
 !address-family l2vpn evpn
  neighbor 2.2.2.2 activate
 ! advertise local-vtep-ip
 !
router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.1.1.0 0.0.0.255 area 0
!
l2vpn evpn
 !replication-type static
 !router-id Loopback0
!
ethernet cfm domain md1 level 5
ethernet cfm maintenance-association ma1 md1
 service ccm
 ethernet cfm cc
!
ethernet cfm mep 1 ma ma1 interface GigabitEthernet1/0/1 inward
ethernet cfm cc mep 1 ma ma1 enable
ethernet cfm remote-mep 2 ma ma1
ethernet cfm cc remote-mep 2 ma ma1 enable
ethernet cfm dm one-way mep 1 ma ma1 test-id 3
ethernet cfm dm receive test-id 3
!
end