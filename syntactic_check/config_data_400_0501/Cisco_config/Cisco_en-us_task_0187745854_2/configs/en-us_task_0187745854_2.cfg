hostname ASBR1
!
router ospf 1
 mpls traffic-eng area 0  ! Cisco替代BGP-LS的方案
 network 2.2.2.2 0.0.0.0 area 0
 network 10.10.1.0 0.0.0.255 area 0
 network 10.10.2.0 0.0.0.255 area 0
!
router bgp 100
 neighbor 1.1.1.1 remote-as 100
 neighbor 1.1.1.1 update-source Loopback1
 neighbor 10.10.2.3 remote-as 200
 neighbor 10.10.2.3 update-source GigabitEthernet1/0/0
 !
 address-family ipv4 unicast
  neighbor 1.1.1.1 activate
  neighbor 10.10.2.3 activate
  exit-address-family
 !
 address-family l2vpn vpls
  neighbor 1.1.1.1 activate
  neighbor 10.10.2.3 activate
  neighbor 1.1.1.1 send-community extended
  neighbor 10.10.2.3 send-community extended
  exit-address-family
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.10.2.2 255.255.255.0
 mpls ip
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.10.1.2 255.255.255.0
 mpls ip
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
!
mpls ldp
 !router-id 2.2.2.2
!
! 隧道选择策略替代方案
route-map TUNNEL-SELECT permit 10
 set mpls-label
!
end