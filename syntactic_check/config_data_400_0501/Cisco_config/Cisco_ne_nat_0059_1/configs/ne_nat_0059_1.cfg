hostname NATA

access-list 2464 permit ip 10.78.1.0 0.0.0.255 any
access-list 2465 permit ip 10.67.1.0 0.0.0.255 any

ip nat pool NAT-POOL-A 11.1.1.1 11.1.1.10 netmask 255.255.255.0
ip nat pool NAT-POOL-B 11.1.1.11 11.1.1.20 netmask 255.255.255.0

ip nat inside source static 10.78.1.2 11.11.11.2
ip nat inside source static 10.67.1.2 11.11.11.1

ip nat inside source list 2464 pool NAT-POOL-A
ip nat inside source list 2465 pool NAT-POOL-B

interface GigabitEthernet2/0/1
 no shutdown
 ip address 10.78.1.1 255.255.255.0
 ip nat inside

interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.67.1.1 255.255.255.0
 ip nat inside

end
