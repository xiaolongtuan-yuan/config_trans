hostname PE2
!
vrf definition vpn1
 rd 200:1
 route-target export 1:1
 route-target import 1:1
!
vrf definition vpn2
 rd 200:2
 route-target export 2:2
 route-target import 2:2
!
mpls ldp router-id Loopback1 force
!
interface GigabitEthernet1/0/0
 no shutdown
 vrf forwarding vpn2
 ip address 10.2.1.1 255.255.255.0
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 192.168.1.2 255.255.255.0
 mpls ip
!
interface GigabitEthernet3/0/0
 no shutdown
 vrf forwarding vpn1
 ip address 10.3.1.1 255.255.255.0
!
interface Loopback1
 ip address 2.2.2.9 255.255.255.255
!
router ospf 1
 network 2.2.2.9 0.0.0.0 area 0
 network 192.168.1.0 0.0.0.255 area 0
!
router bgp 100
 bgp router-id 2.2.2.9
 neighbor 1.1.1.9 remote-as 100
 neighbor 1.1.1.9 update-source Loopback1
 !
 address-family ipv4
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-community
 exit-address-family
 !
 address-family vpnv4
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-community extended
 exit-address-family
!
ip route vrf vpn1 0.0.0.0 0.0.0.0 10.3.1.1
ip route vrf vpn2 0.0.0.0 0.0.0.0 10.2.1.1
!
end