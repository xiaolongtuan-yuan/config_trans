hostname BRAS
!
ip multicast-routing
!
ip dhcp pool huawei_bas_local
 network 10.0.0.0 255.255.0.0
 default-router 10.0.0.1
ip dhcp excluded-address 10.0.0.1 10.0.255.255
!
aaa new-model
!
ip access-list standard list1
 permit 225.1.1.1
 permit 227.1.1.1
!
ip pim accept-register list list1
!
aaa authentication login default none
aaa accounting update newinfo
!
ip domain name example.com
!
interface Virtual-Template100
 ppp authentication chap
!
interface GigabitEthernet1/0/0
 !pppoe enable group global
 !pppoe-server bind Virtual-Template 100
 ip pim sparse-mode
 ip igmp static-group 225.1.1.1
 ip igmp static-group 227.1.1.1
!
interface GigabitEthernet1/0/1
 ip address 10.1.1.1 255.255.255.0
 ip pim sparse-mode
!
interface GigabitEthernet1/0/2
 ip address 10.1.2.1 255.255.255.0
 ip pim sparse-mode
!
end