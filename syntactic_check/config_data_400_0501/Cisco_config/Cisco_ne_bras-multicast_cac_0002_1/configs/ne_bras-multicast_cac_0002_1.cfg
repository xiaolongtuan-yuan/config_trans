hostname BRAS
!
ip multicast-routing
!
ip dhcp pool bas-local
 network 10.0.0.0 255.255.0.0
 default-router 10.0.0.1
!
aaa new-model
aaa authentication ppp default none
aaa accounting update periodic 1440
!
ip domain-name example.com
!
interface Virtual-Template100
 mtu 1492
 ppp authentication chap
!
interface GigabitEthernet1/0/0
! pppoe enable group global
! pppoe-client dial-pool-number 1
 ip pim sparse-mode
 ip igmp static-group 224.0.0.1
 service-policy output MULTICAST-POLICY
!
ip access-list extended MULTICAST-ACL
 permit ip host 1.1.1.1 host 235.1.1.1
 permit ip host 2.1.1.1 host 236.1.1.1
!
class-map match-any MULTICAST-CLASS
 match access-group name MULTICAST-ACL
!
policy-map MULTICAST-POLICY
 class MULTICAST-CLASS
  police cir 1000000 bc 1500 conform-action transmit exceed-action drop
!
interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.1.1.1 255.255.255.0
 ip pim sparse-mode
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.2.1 255.255.255.0
 ip pim sparse-mode
!
end