hostname DeviceC
!
class-map match-any AF3
 match ip dscp af31
 match ip dscp af32
 match ip dscp af33
!
policy-map MPLS-PHB
 class AF3
  set mpls experimental imposition 5
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 4.4.4.1 255.255.255.0
 mpls ip
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 5.5.5.1 255.255.255.0
 mpls ip
!
end