hostname CISCO
!
ip access-list extended ACL_3001
 permit ip host 10.11.11.1 any
 permit ip host 10.11.11.2 any
!
ip access-list extended ACL_3002
 permit ip host 10.11.11.3 any
!
class-map match-all TC1
 match access-group name ACL_3001
!
class-map match-all TC2
 match access-group name ACL_3002
!
policy-map P1
 class TC1
  police cir 0 conform-action transmit
!
policy-map P2
 class TC2
  police cir 0 conform-action transmit
!
interface GigabitEthernet1/0/1
 ip address 192.168.1.1 255.255.255.0
 service-policy input P1
 service-policy output P2
!
end