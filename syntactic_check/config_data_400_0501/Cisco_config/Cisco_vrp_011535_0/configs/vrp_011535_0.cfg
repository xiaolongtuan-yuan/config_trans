hostname PE1
!
ethernet cfm
 !domain md1 level 5
  service ma1
   !continuity-check interval 100ms
   !mep 1
    interface GigabitEthernet1/0/1.1
   ! direction outward
   ! continuity-check
   ! remote-mep 2
   !
  ! mep 2
  !  direction inward
  !  continuity-check
  !  remote-mep 1
   !
  !
 !
!
mpls ldp
 !router-id Loopback0
 !
!
l2vpn vfi context l2vpn1
 !
!
interface GigabitEthernet1/0/1.1
 encapsulation dot1q 1
 xconnect 2.2.2.2 1001 encapsulation mpls
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 192.168.1.1 255.255.255.0
 mpls ip
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 192.168.1.0 0.0.0.255 area 0
!
end