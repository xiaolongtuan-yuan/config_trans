hostname P2
!
mpls ldp router-id Loopback0 force
mpls traffic-eng tunnels
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.3.1.2 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 mpls traffic-eng bandwidth 20000
 ip rsvp bandwidth 20000
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.4.1.2 255.255.255.0
 mpls ip
 mpls label protocol ldp
!
interface Loopback1
 ip address 4.4.4.4 255.255.255.255
!
interface Tunnel1
 ip unnumbered Loopback1
 tunnel destination 2.2.2.2
 !tunnel mode mpls traffic-eng
 !tunnel mpls traffic-eng path-option 1 explicit name TE_PATH
 !tunnel mpls traffic-eng priority 1 1
 !tunnel mpls traffic-eng bandwidth 10000
!
router ospf 1
 mpls traffic-eng router-id Loopback1
 mpls traffic-eng area 0
 network 4.4.4.4 0.0.0.0 area 0
 network 10.3.1.0 0.0.0.255 area 0
 network 10.4.1.0 0.0.0.255 area 0
!
!ip explicit-path name TE_PATH enable
! next-address 10.3.1.1
!
end