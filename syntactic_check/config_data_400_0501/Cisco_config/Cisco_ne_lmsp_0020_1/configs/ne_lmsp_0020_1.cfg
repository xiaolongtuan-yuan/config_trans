hostname PE2
!
mpls ip
mpls ldp router-id Loopback0 force
!
pseudowire-class PW_3to1
 encapsulation mpls
 preferred-path interface Tunnel1
 interworking ethernet
!
!
interface POS3/0/1
 no shutdown
!
interface POS3/0/2
 no shutdown
!
interface GigabitEthernet3/0/1
 no ip address
 ppp encapsulation
 no shutdown
!
interface GigabitEthernet3/0/2
 no ip address
 ppp encapsulation
 no shutdown
!
interface Serial1/1:0
 xconnect 192.168.1.2 100 pw-class PW_3to1
 no shutdown
!
interface Serial1/2:0
 xconnect 192.168.1.2 200 pw-class PW_3to1
 no shutdown
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.2.2.2 255.255.255.0
 mpls ip
 mpls ldp
!
interface Loopback0
 ip address 192.168.1.3 255.255.255.255
!
router ospf 1
 router-id 192.168.1.3
 network 192.168.1.3 0.0.0.0 area 0
 network 10.2.2.0 0.0.0.255 area 0
!
end