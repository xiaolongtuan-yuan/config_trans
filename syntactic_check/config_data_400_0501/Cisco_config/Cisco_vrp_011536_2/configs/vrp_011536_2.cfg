hostname PE2

! MPLS基础配置
mpls ip
!mpls label protocol ldp
mpls ldp router-id Loopback0 force

! L2VPN配置
!mpls l2vpn logging pseudowire status
!
pseudowire-class LDP_PW
 encapsulation mpls
 !protocol ldp
!
l2vpn vfi context LDP1
 vpn id 1
 !neighbor 2.2.2.2 pw-class LDP_PW
!

! 接口配置
interface GigabitEthernet1/0/1.1
 encapsulation dot1Q 2
 xconnect vfi LDP1
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.1.2 255.255.255.0
 mpls ip
 mpls ldp discovery targeted-hello accept
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255

! OSPF配置
router ospf 1
 router-id 1.1.1.1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.1.1.0 0.0.0.255 area 0

! CFM配置（Cisco标准语法）
ethernet cfm
 !domain MD1 level 1
  service MA1 evc LDP1
   !continuity-check
   !mep 2 interface GigabitEthernet1/0/1.1 inward
   ! continuity-check interval 3s
   ! continuity-check loss-threshold 3
   ! continuity-check