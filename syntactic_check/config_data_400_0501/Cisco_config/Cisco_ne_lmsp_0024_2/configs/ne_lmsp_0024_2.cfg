router isis 1
 is-type level-1
 net 49.0003.0033.0033.0033.00
 lsp-gen-interval 1 1 50
 metric-style wide  ! 修正metric-style配置
 mpls traffic-eng level-1-2  ! 修正MPLS TE配置

interface GigabitEthernet2/0/2
 ip router isis 1
 isis metric 10 level-1  ! 建议添加接口metric

interface GigabitEthernet2/0/1
 ip router isis 1
 isis metric 10 level-1  ! 建议添加接口metric

interface Loopback0
 ip address 3.3.3.3 255.255.255.255
 ip router isis 1  ! 建议为Loopback接口启用IS-IS

end