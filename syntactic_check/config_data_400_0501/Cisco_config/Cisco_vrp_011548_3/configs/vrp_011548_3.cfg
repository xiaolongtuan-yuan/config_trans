hostname CE1
!
! CFM全局配置
ethernet cfm
 !domain md2 level 6
  service ma2
   !continuity-check
   !mep 61 interface GigabitEthernet1/0/1 direction down
    !continuity-check transmission interval 10ms
    !continuity-check transmission enable
    !remote-mep 62
    ! continuity-check reception enable
    !
   !
   !alarm indication signal
   !alarm indication signal suppress-alarms
  !
!
! 接口配置
interface GigabitEthernet1/0/1
 no shutdown
 switchport mode trunk
 switchport trunk allowed vlan 10
!
end