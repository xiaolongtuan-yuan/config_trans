hostname SSH_Server
!
! RSA密钥生成
crypto key generate rsa modulus 2048  ! 明确指定密钥长度
!
! SSH全局配置
ip ssh version 2
ip ssh rsa keypair-name SSHKEY  ! 标准密钥对命名
!
interface Loopback0
 ip address 10.1.1.1 255.255.255.255
!
ip scp server enable
!
ip ssh source-interface Loopback0
!
! 用户认证配置（修正语法）
username client001 secret 5 $1$mERr$hx5rVt7wPSTZxPZzB7UjX/  ! 使用加密密码
username client001 privilege 3
!
username client002 privilege 15
!
aaa new-model
!
aaa authentication login default local
aaa authorization exec default local
!
interface GigabitEthernet0/0/0
 no shutdown
 ip address 10.1.1.2 255.255.255.0  ! 修正掩码为/24
!
line vty 0 4
 transport input ssh
 login authentication default
!
end