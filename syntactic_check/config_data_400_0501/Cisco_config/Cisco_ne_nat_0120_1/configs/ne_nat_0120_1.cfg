hostname CGNA
!
ip nat translation max-entries 6
!
ip access-list extended NAT_ACL
 permit ip 192.168.10.0 0.0.0.255 any
!
ip nat pool STATIC_POOL 11.11.11.101 11.11.11.200 netmask 255.255.255.0
ip nat inside source list NAT_ACL pool STATIC_POOL overload
!
interface GigabitEthernet2/0/0
 ip address 192.168.10.1 255.255.255.0
 ip nat inside
 no shutdown
!
interface GigabitEthernet2/0/1
 ip address 11.11.11.1 255.255.255.0
 ip nat outside
 no shutdown
!
end