hostname PE2
!
! 启用CFM（标准Cisco语法）
ethernet cfm ieee
!
! MPLS基础配置
mpls ip
mpls ldp router-id Loopback0 force
!
! L2VPN配置
l2vpn vfi context ldp1
 vpn id 1
 !neighbor 2.2.2.2 encapsulation mpls
!
interface GigabitEthernet1/0/1.1
 encapsulation dot1Q 2
 xconnect vfi ldp1
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.1.1.2 255.255.255.0
 mpls ip
 mpls ldp
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
! OSPF配置
router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.1.1.0 0.0.0.255 area 0
 mpls ldp autoconfig area 0
!
! CFM高级配置
ethernet cfm domain md1 level 7
 service ma1 evc EVC-1 vlan 2
!
ethernet cfm mep 2 domain md1 service ma1
 !interface GigabitEthernet1/0/1.1 inward
 !continuity-check interval 1s
 !continuity-check
!
ethernet cfm remote-mep 1 domain md1 service ma1
 !continuity-check
!
ethernet cfm traceroute cache
ethernet cfm sla 1 mep 2 domain md1 service ma1
 !loss-measurement consecutive 10
!
end