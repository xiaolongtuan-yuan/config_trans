hostname PE1
!
ethernet cfm global
!

!
l2vpn evpn
 bridge-domain 10
!
interface GigabitEthernet1/0/1.1
 encapsulation dot1Q 2
 service instance 10 ethernet
  bridge-domain 10
 cdp enable
!
ethernet cfm domain md1 level 6
ethernet cfm ma ma1 md md1
ethernet cfm mep 1 ma ma1 interface GigabitEthernet1/0/1.1 outward
ethernet cfm mep 1 ma ma1 ccm-enable
ethernet cfm remote-mep 2 ma ma1
ethernet cfm remote-mep 2 ma ma1 ccm-receive enable
!
end