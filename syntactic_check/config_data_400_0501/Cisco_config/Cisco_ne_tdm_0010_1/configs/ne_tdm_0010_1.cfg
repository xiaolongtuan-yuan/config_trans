hostname PE2
!

!
! 接口配置
interface Ethernet2/0/0
 no shutdown
 ip address 10.2.2.2 255.255.255.0
 mpls ip
 mpls ldp ipv4
!
interface Loopback0
 ip address 192.168.3.3 255.255.255.255
!
! OSPF配置
router ospf 1
 network 192.168.3.3 0.0.0.0 area 0
 network 10.2.2.0 0.0.0.255 area 0
!
! 伪线类配置（Cisco标准语法）
pseudowire-class TDM_PW
 encapsulation mpls
 control-word
! jitter-buffer 8  ! 修正抖动缓冲参数
!
! 串行接口伪线绑定
interface Serial1/0/1/1:1
 no shutdown
 xconnect 192.168.2.2 100 pw-class TDM_PW
!
interface Serial1/0/1/2:2
 no shutdown
 xconnect 192.168.2.2 200 pw-class TDM_PW
!
! CPOS控制器配置（Cisco标准语法）
controller SONET 1/0/1
 framing sonet
 sts-1 1
  !mode ct3
  !t1 1 channel-group 1 timeslots 1-24  ! T1标准时隙
 sts-1 2
  !mode ct3
  !t1 1 channel-group 2 timeslots 1-24
!
end