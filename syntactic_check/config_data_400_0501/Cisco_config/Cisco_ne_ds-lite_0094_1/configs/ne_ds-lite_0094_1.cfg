hostname DS-Lite
!
license boot level advipservices
!
vrf definition DS-Lite
 rd 1:1
 !
 address-family ipv6
 !
!
ipv6 access-list 3500
 permit ipv6 2001:DB8:2::/64 any
!
ipv6 unicast-routing
!
interface GigabitEthernet2/0/2
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8:1::2:1/64
 service-policy input p1
!
ipv6 route 2001:DB8::1/128 GigabitEthernet2/0/2 2001:DB8:2::1
!
class-map match-all c1
 match access-group name 3500
!
policy-map p1
 class c1
  set ipv6 next-hop 2001:DB8:2::1
!
router isis 1000
 net 10.0000.0000.0002.00
 metric-style wide
 address-family ipv6
  redistribute connected
  redistribute static
 !
!
end