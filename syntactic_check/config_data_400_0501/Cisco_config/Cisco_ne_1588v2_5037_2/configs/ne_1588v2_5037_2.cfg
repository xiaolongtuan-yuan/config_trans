hostname DeviceC
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
!
ptp enable
ptp mode client
ptp source-ip 3.3.3.3
ptp server 1.1.1.1
ptp server 2.2.2.2
ptp sync-interval 4
ptp announce-interval 12
ptp delay-response-interval 6
ptp unicast-negotiate enable
!
clock source internal
clock source ptp
clock source ptp priority 1
clock source ptp ssm prc
!
end