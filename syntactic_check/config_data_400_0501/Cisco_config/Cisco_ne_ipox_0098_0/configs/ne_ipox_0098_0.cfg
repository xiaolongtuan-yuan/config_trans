hostname CISCO-ROUTER
!
radius-server host 10.6.55.55 auth-port 1645 acct-port 1646 key 7 050A051F010F
!
ipv6 unicast-routing
ipv6 cef
!
! DHCPv6配置（标准Cisco语法）
!ipv6 local pool pre1 2001:DB8:2::/48 64
ipv6 dhcp pool pool1
 dns-server 2001:DB8:1::2
!
aaa new-model
aaa authentication login default local
aaa authentication login auth6 group radius
aaa accounting exec default start-stop group radius
aaa authorization network default group radius
!
aaa group server radius rd6
 server-private 10.6.55.55 auth-port 1645 acct-port 1646 key 7 050A051F010F
!
interface GigabitEthernet1/0/1
 no shutdown
 ipv6 address 2001:DB8:3::/64 eui-64
 ipv6 enable
 ipv6 address fe80:: link-local
!
interface GigabitEthernet1/0/2
 no shutdown
 ipv6 enable
 ipv6 address fe80:: link-local
 ipv6 dhcp client pd hint ::/64
 ipv6 nd autoconfig default-route
!
end