hostname NATA
!
ip access-list extended NAT_ACL
 permit ip 192.168.10.0 0.0.0.255 any
!
ip nat pool ADDRESS_GROUP1 11.11.11.101 11.11.11.105 netmask 255.255.255.0
!
ip nat inside source list NAT_ACL pool ADDRESS_GROUP1 overload
!
interface GigabitEthernet2/0/0
 ip address 192.168.10.1 255.255.255.0
 ip nat inside
 no shutdown
!
interface GigabitEthernet1/0/0
 ip address 11.11.11.1 255.255.255.0
 ip nat outside
 no shutdown
!
end