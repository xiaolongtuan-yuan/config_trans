hostname PE2
!
ethernet cfm
!

mpls ldp router-id Loopback1
!
interface GigabitEthernet1/0/1.1
  encapsulation dot1q 1
  xconnect 1.1.1.1 1001 encapsulation mpls
!
interface GigabitEthernet1/0/2
  no shutdown
  ip address 192.168.1.1 255.255.255.0
  mpls ip
  mpls ldp
!
interface Loopback0
  ip address 2.2.2.2 255.255.255.0
!
router ospf 1
  network 2.2.2.2 0.0.0.0 area 0
  network 192.168.1.0 0.0.0.255 area 0
!
ethernet cfm domain md1 level 7
 ethernet cfm maintenance-association ma1 md1
  service ccm
  ethernet cfm mep 2 ma ma1 interface GigabitEthernet1/0/1.1 inward
  ethernet cfm cc mep 2 ma ma1 enable
  ethernet cfm remote-mep 1 ma ma1
  ethernet cfm cc remote-mep 1 ma ma1 enable
  ethernet cfm slm mep 2 ma ma1 test-id 1
  ethernet cfm slm receive test-id 1
  ethernet cfm slm mep 2 ma ma1 test-id 2 remote-mep 1
  ethernet cfm slm send continual test-id 2 interval 30000
!
end