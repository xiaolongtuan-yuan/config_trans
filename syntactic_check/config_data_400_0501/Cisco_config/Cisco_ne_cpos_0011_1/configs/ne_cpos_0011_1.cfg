hostname DeviceB
!
controller E1 5/0/0
 channel-group 1 timeslots 1-15
 channel-group 1 timeslots 16-31
 no shutdown
!
interface Multilink1
 ip address 10.1.1.2 255.255.255.0
 ppp multilink
 ppp multilink group 1
!
interface Serial5/0/0.1:1
 ppp multilink
 ppp multilink group 1
!
interface Serial5/0/0.1:2
 ppp multilink
 ppp multilink group 2
!
end