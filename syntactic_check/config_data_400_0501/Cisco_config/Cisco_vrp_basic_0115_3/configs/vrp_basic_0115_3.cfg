hostname PE2

ip vrf vpn1

!
mpls ldp router-id Loopback1 force
mpls ip

interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.3.1.2 255.255.255.255
 mpls ip
 mpls ip ldp autoconfig

interface GigabitEthernet2/0/1
 no shutdown
 ip vrf forwarding vpn1
 ip address 10.1.2.2 255.255.255.0

interface Loopback1
 ip address 3.3.3.9 255.255.255.255

router bgp 100
 neighbor 1.1.1.9 remote-as 100
 neighbor 1.1.1.9 update-source Loopback1
 !
 address-family ipv4 unicast
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-community both
  no auto-summary
  no synchronization
 !
 address-family vpnv4 unicast
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-community extended
  neighbor 1.1.1.9 route-reflector-client
 !
 address-family ipv4 vrf vpn1
  redistribute connected
  neighbor 10.1.2.1 remote-as 65420
  neighbor 10.1.2.1 activate