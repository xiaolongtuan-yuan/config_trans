hostname DeviceB
!
! 修正E1控制器配置
controller E1 2/0/0
 framing crc4
 line-termination 75-ohm
 channel-group 1 timeslots 1-31
!
controller E1 2/0/1
 framing crc4
 line-termination 75-ohm
 channel-group 2 timeslots 1-31
!
! 修正多链路接口配置（使用实际IP地址）
interface Multilink1
 ip address 192.168.1.1 255.255.255.252
 ppp multilink
!
! 修正串行接口配置
interface Serial2/0/0:1
 no ip address
 ppp multilink
!
interface Serial2/0/1:2
 no ip address
 ppp multilink
!
end