hostname PE1
!
! MPLS基础配置
mpls ip
!mpls ldp
! router-id Loopback0
 !
 !address-family ipv4
  !discovery targeted-hello accept
 !exit-address-family
!
! L2VPN伪线配置
pseudowire-class MPLS_PW
 encapsulation mpls
!
interface GigabitEthernet1/0/1.1
 encapsulation dot1Q 1
 xconnect 2.2.2.2 1001 pw-class MPLS_PW
 service instance 1001 ethernet  ! 关联服务实例
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 192.168.1.2 255.255.255.0
 mpls ip
 mpls ldp ipv4
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
! OSPF配置
router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 192.168.1.0 0.0.0.255 area 0
!
! Cisco标准CFM配置
ethernet cfm
 !domain MD1 level 5
  service MA1
  ! continuity-check
   !mep 1 interface GigabitEthernet1/0/1.1 inward
   !
   !remote-mep 2
    !continuity-check
!
! 延迟测量配置
ethernet cfm
 !domain MD1 level 5
  service MA1
  ! delay-measurement
   ! one-way destination 2.2.2.2 test-id 1
!
end