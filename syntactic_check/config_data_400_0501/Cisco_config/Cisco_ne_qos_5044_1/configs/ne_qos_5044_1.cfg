hostname QoS-Router
!
ip cef
mpls ip
!mpls label protocol ldp
!
class-map match-any COS5
 match cos 5
!
policy-map COS5-POLICY
 class COS5
  police cir 120000 bc 8000 be 8000
   conform-action transmit
   exceed-action transmit
   violate-action drop
  random-detect dscp-based
  random-detect dscp 40 50 50
!
policy-map PARENT-POLICY
 class class-default
  shape average 4000000
  service-policy COS5-POLICY
!
interface GigabitEthernet1/0/3.11
 encapsulation dot1Q 11
 ip address 10.192.167.3 255.255.255.0
 mpls ip
 trust cos
 service-policy output PARENT-POLICY
!
interface GigabitEthernet1/0/4.22
 encapsulation dot1Q 22
 ip address 10.192.169.4 255.255.255.0
 mpls ip
 trust cos
 !no service-policy output
!
end