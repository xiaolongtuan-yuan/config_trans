set system host-name PE1

set vlans vlan10 vlan-id 10
set vlans vlan100 vlan-id 100

set protocols rstp vlan 10 root-priority 0
set protocols rstp vlan 100 root-priority 0

set protocols erps ring 1 control-vlan 100
set protocols erps ring 1 protected-instance 0
set protocols erps ring 1 version v2
set protocols erps ring 1 sub-ring

set protocols mpls interface all

set protocols l2vpn

set interfaces vlan unit 10 family bridge interface-mode trunk
set interfaces vlan unit 10 family bridge vlan-id-list 10
set interfaces vlan unit 10 family bridge vlan-id-list 100

set interfaces ge-1/0/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members 10
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members 100
set protocols rstp interface ge-1/0/0 bpdu-filter
set protocols erps ring 1 interface ge-1/0/0

set interfaces ge-2/0/0 unit 0 family inet address 10.1.1.1/24
set protocols mpls interface ge-2/0/0

set interfaces ge-3/0/0 unit 0 family inet address 10.3.1.1/24
set protocols mpls interface ge-3/0/0

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-2/0/0.0
set protocols ospf area 0 interface ge-3/0/0.0
