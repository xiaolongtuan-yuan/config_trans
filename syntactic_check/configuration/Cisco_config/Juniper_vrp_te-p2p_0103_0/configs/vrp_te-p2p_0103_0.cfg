set system host-name LSR-A

set protocols ldp enable
set protocols ldp router-id lo0:1.1.1.9

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls ip
set protocols ldp traffic-eng tunnels
set protocols isis net68.0001.0000.0009.00
set protocols isis is-type level-2-only
set protocols isis metric-style wide

set interfaces lo0 unit 1 family inet address 1.1.1.9/32
set interfaces lo0 unit 1 family mpls ip

set interfaces tun0 unit 0 family inet unnumbered lo0:1.1.1.9
set protocols ldp traffic-eng tunnels tunnel-mode mpls traffic-eng
set protocols ldp traffic-eng tunnels destination 4.4.4.9
set protocols ldp traffic-eng tunnels mpls-traffic-eng-tunnel-id 1
set protocols ldp traffic-eng tunnels bandwidth 20000

