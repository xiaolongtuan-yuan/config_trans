set system host-name DeviceA

set vlans vlan100 vlan-id 100

set system services dhcp pool pool1 network 10.10.10.0/24
set system services dhcp pool pool1 default-router 10.10.10.1
set system services dhcp pool pool1 dns-server 10.10.10.100

set interfaces vlan unit 100 family inet address 10.10.10.1/24
set interfaces vlan unit 100 family inet address 10.10.10.100 vrrp-group 1 virtual-address
set interfaces vlan unit 100 family inet address 10.10.10.100 vrrp-group 1 priority 200
set interfaces vlan unit 100 family inet address 10.10.10.100 vrrp-group 1 preempt
set interfaces vlan unit 100 family inet address 10.10.10.100 vrrp-group 1 preempt-delay 600
set system services dhcp-local-server group dhcp-group interface vlan.100

set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members vlan100
set interfaces ge-1/0/1 unit 0 family ethernet-switching port-mode trunk
set interfaces ge-1/0/1 disable
