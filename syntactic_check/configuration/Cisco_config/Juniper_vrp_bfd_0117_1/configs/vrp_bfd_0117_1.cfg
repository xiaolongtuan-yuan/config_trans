set system host-name DeviceB

set interfaces ae1 unit 0 family inet address 10.1.1.2/24

set interfaces ge-3/0/0 ether-options 802.3ad ae1
set interfaces ge-3/0/1 ether-options 802.3ad ae1

set protocols bfd template btoa minimum-interval 10
set protocols bfd template btoa minimum-receive-interval 10

set protocols bfd bundle peer-ip 10.1.1.1 source-ip 10.1.1.2 interface ae1 template btoa
