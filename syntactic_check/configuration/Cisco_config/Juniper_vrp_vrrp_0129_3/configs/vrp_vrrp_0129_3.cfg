set system host-name PE2

set protocols ldp
set protocols ldp discovery transport-address 4.4.4.4

set interfaces ge-0/0/2 unit 0 family mpls ip label-switched-path
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan-membership automatic
set interfaces ge-0/0/1.1 unit 0 encapsulation dot1q 10
set interfaces ge-0/0/1.1 unit 0 family mpls ip label-switched-path vpws vfi ldp1
set interfaces ge-0/0/3 unit 0 family inet address 172.16.45.4/32
set interfaces ge-0/0/3 unit 0 family mpls ip label-switched-path
set interfaces ge-0/0/3 unit 0 family mpls ip label-switched-path vpws vfi ldp1

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set routing-options router-id 4.4.4.4
set routing-options ospf 1 router-id 4.4.4.4
set routing-options ospf 1 area 0 network 4.4.4.4/32
set routing-options ospf 1 area 0 network 172.16.34.0/24
set routing-options ospf 1 area 0 network 172.16.45.0/24

set vpf ldp1 route-distinguisher 100:1
