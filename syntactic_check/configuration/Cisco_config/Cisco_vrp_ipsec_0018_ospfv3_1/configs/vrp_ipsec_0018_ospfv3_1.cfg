hostname DeviceB

crypto isakmp policy 2
 encr aes 256
 authentication pre-share
 group 2

crypto isakmp key %#%#<}j/@XSE9JZT5]2"T#]2"T<}j/@XSE9JZT5>%#%# address <peer IP>

crypto ipsec transform-set proposal2 esp-sha256-hmac 

crypto map HUAWEI_MAP 10 ipsec-isakmp 
 set peer <peer IP>
 set transform-set proposal2 
 match address HUAWEI_ACL

interface GigabitEthernet1/0/1
 no shutdown
 ipv6 enable
 ipv6 address 2001:db8::2/64
 crypto map HUAWEI_MAP

ipv6 unicast-routing

router ospfv3 1
 router-id 2.2.2.2
 area 1 virtual-link <neighbor router-id> <neighbor router's IPv6 address>
