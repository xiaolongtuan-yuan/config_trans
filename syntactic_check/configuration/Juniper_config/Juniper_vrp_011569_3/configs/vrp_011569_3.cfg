set system host-name CE2
!
set vlans vlan10 vlan-id 10
!
set protocols cfm mep 2 interface ge-0/0/1
set protocols cfm mep 2 ccm-send
set protocols cfm remote-mep 1 mep-id 1
set protocols cfm remote-mep 1 ccm-receive
!
set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members vlan10
!
set protocols cfm md md1 level 6
set protocols cfm ma ma1
set protocols cfm ma ma1 vlan 10
