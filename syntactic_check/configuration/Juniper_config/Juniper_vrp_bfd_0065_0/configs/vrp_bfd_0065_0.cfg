set system host-name DeviceA

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 unit 0 disable

set protocols bfd template BFD-TEMPLATE minimum-interval 50
set protocols bfd template BFD-TEMPLATE minimum-receive-interval 50
set protocols bfd template BFD-TEMPLATE multiplier 3

set protocols bfd interface ge-1/0/0 local-discriminator 10
set protocols bfd interface ge-1/0/0 remote-discriminator 20

set protocols bfd interface ge-1/0/0 minimum-interval 120
set protocols bfd interface ge-1/0/0 minimum-receive-interval 50
set protocols bfd interface ge-1/0/0 multiplier 3
