set system host-name PE1
set protocols ldp
set interfaces gigabit-ethernet1/0/0 unit 1 encapsulation dot1q 10
set interfaces gigabit-ethernet1/0/0 unit 1 family ethernet-switching virtual-template 1
set routing-options router ospf 1 network 1.1.1.1/32 area 0
set routing-options router ospf 1 network 10.10.1.0/24 area 0
set interfaces lo0 unit 0 family inet address 1.1.1.1/32
set interfaces ge-1/0/0 unit 1 family ethernet-switching pw-id 2 peer-ip 2.2.2.2 target-node ge-1/0/0.1
set protocols ldp interface ge-1/0/0.1
set vlans vsi1 vfi vsi1 id 2
set vlans vsi1 l2-enabled
set interfaces ge-2/0/0 unit 0 family inet address 10.10.1.1/24
set protocols ldp interface lo0
set failover groups mgd-group protocols ldp
