set system host-name P2

set protocols mpls label-mode ldp

set protocols mpls traffic-engineering cspf
set protocols mpls traffic-engineering lsp-trigger all
set protocols mpls traffic-engineering router-id lo0.0

set protocols ldp router-id lo0.0
set protocols ldp neighbor 2.2.2.2

set interfaces ge-0/0/0 unit 0 family inet address 10.3.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls

set protocols mpls traffic-engineering interface ge-0/0/0 bandwidth 20000

set protocols rsvp interface ge-0/0/0

set interfaces ge-0/0/1 unit 0 family inet address 10.4.1.2/24
set interfaces ge-0/0/1 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set protocols mpls traffic-engineering tunnels tunnel1 source lo0.0
set protocols mpls traffic-engineering tunnels tunnel1 destination 2.2.2.2
set protocols mpls traffic-engineering tunnels tunnel1 tunnel-id 101
set protocols mpls traffic-engineering tunnels tunnel1 bandwidth 10000
set protocols mpls traffic-engineering tunnels tunnel1 shortcut
set protocols mpls traffic-engineering tunnels tunnel1 path-metric 1

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf opaque-lsa capability
set protocols ospf traffic-adjustment advertise
set protocols ospf traffic-engineering router-id lo0.0

