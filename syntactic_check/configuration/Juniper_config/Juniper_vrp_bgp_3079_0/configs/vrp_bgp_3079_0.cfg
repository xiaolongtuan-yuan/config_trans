set system host-name DeviceA

set interfaces ge-1/0/0 unit 0 family inet address 10.10.1.1/24
set interfaces ge-1/0/0 unit 0 description "GigabitEthernet1/0/0"

set interfaces ge-2/0/0 unit 0 family inet address 172.16.1.1/8
set interfaces ge-2/0/0 unit 0 description "GigabitEthernet2/0/0"

set routing-options autonomous-system 100
set routing-options router-id 1.1.1.1

set protocols bgp group EBGP_300 type external
set protocols bgp group EBGP_300 peer-as 300
set protocols bgp group EBGP_300 neighbor 10.10.1.2
set protocols bgp group EBGP_300 family inet unicast
set protocols bgp group EBGP_300 export "export-policy"

set policy-options policy-statement export-policy term 1 from protocol direct
set policy-options policy-statement export-policy term 1 from prefix-list 8.0.0.0/8
set policy-options policy-statement export-policy term 1 then accept

set policy-options prefix-list 8.0.0.0/8 8.0.0.0/8
