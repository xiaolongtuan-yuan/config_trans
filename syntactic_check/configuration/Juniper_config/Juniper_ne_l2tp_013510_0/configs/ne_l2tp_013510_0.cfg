set protocols l2tp

set system radius-server 10.0.0.249 port 1812 secret "%^%#vS%796FO7%C~pB%CR=q;j}gSCqR-X6+P!.DYI@)%^%"
set system radius-server 10.0.0.249 accounting-port 1813 secret "%^%#vS%796FO7%C~pB%CR=q;j}gSCqR-X6+P!.DYI@)%^%"

set interfaces ge-1/0/0 unit 0 family inet address 10.100.100.1/24
set interfaces ge-1/0/0 unit 100 vlan-id 100
set interfaces ge-1/0/0 unit 100 pppoe-options client
set interfaces ge-1/0/0 unit 100 pppoe-options underlying-interface ge-1/0/0
set interfaces ge-1/0/0 unit 100 pppoe-options service-policy control default-in-policy

set interfaces ge-1/0/0 unit 0 enable

set interfaces ge-1/0/0 unit 100 ppp authentication chap

set protocols l2tp lns lac1 authentication chap
set protocols l2tp lns lac1 tunnel-password "<password>"
set protocols l2tp lns lac1 tunnel-name LAC1
set protocols l2tp lns lac1 local-ip 10.100.100.1
set protocols l2tp lns lac1 remote-ip 1.1.1.1
set protocols l2tp lns lac1 tunnel-path-mtu-discovery

set system authentication-order radius
set access profile default1 authentication-order radius
set access profile default1 accounting-order radius
set access profile default1 authorization-order radius

set routing-options static route 1.1.1.1/32 next-hop 10.100.100.2
