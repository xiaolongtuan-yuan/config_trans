hostname DeviceA
ethernet cfm
bfd all-interfaces
interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.1.1.1 255.255.255.0
interface GigabitEthernet1/0/1
 vrrp 10 ip 10.1.1.111
 vrrp 10 priority 160
 vrrp 10 track GigabitEthernet1/0/1
interface GigabitEthernet1/0/1
 ethernet cfm mode on
 ethernet cfm error-threshold 5 5 5
 ethernet cfm notification enable
 ethernet cfm interval 120
interface GigabitEthernet1/0/1
 bfd interval 120 min_rx 120 multiplier 3
 bfd neighbor 10.1.1.2
router ospf 1
 network 10.1.1.0 0.0.0.255 area 0
end
