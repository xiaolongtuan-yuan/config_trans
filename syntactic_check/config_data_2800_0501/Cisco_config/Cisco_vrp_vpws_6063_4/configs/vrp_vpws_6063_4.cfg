hostname ASBR2
!
mpls ldp router-id Loopback0
!
mpls ip
!
interface GigabitEthernet1/0/0
 no shutdown
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.20.1.1 255.255.255.0
 mpls ip
!
interface Loopback0
 ip address 3.3.3.9 255.255.255.0
!
mpls l2vpn vpn1
 encapsulation mpls
 route-distinguisher 200:1
 export route-target both 1:1
 import route-target both 1:1
!
router bgp 200
 neighbor 4.4.4.9 remote-as 200
 neighbor 4.4.4.9 update-source Loopback0
 !
 address-family ipv4
  neighbor 4.4.4.9 activate
  neighbor 4.4.4.9 send-community extended
 exit-address-family
 !
 address-family l2vpn vpls
  neighbor 4.4.4.9 activate
  neighbor 4.4.4.9 signaling-protocol ldp
  neighbor 4.4.4.9 advertise l2vpn
 exit-address-family
!
router ospf 1
 network 3.3.3.9 0.0.0.0 area 0
 network 10.20.1.0 0.0.0.255 area 0
!
end