hostname U-PE2
!
mpls label protocol ldp
!
mpls l2vpn
!
l2vpn pw-class pwt
 encapsulation mpls
 control-word
!
mpls ldp
!
mpls ldp neighbor 3.3.3.9 targeted
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.4.1.2 255.255.255.0
 mpls ip
 mpls ldp autoconfig
!
interface GigabitEthernet2/0/0
 no shutdown
 xconnect 3.3.3.9 200 encapsulation mpls pw-class pwt
!
interface Loopback0
 ip address 5.5.5.9 255.255.255.255
!
router ospf 1
 network 5.5.5.9 0.0.0.0 area 0
 network 10.4.1.0 0.0.0.255 area 0
!
end