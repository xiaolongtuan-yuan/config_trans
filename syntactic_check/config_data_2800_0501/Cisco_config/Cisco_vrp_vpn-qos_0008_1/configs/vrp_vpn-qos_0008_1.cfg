hostname PE1

mpls label protocol ldp

mpls traffic-eng tunnels

interface GigabitEthernet1/0/0

no shutdown

interface GigabitEthernet1/0/0.1

encapsulation dot1Q 10

xconnect 3.3.3.9 101 encapsulation mpls

mpls l2vpn service-policy output policy1

interface GigabitEthernet2/0/0

no shutdown

ip address 10.1.1.1 255.255.255.0

mpls traffic-eng tunnels

mpls traffic-eng bandwidth max-reservable-bandwidth 5000

mpls traffic-eng bandwidth bc0 4000

interface Loopback1

ip address 1.1.1.9 255.255.255.255

interface Tunnel10

ip unnumbered Loopback1

tunnel mode mpls traffic-eng

tunnel destination 3.3.3.9

tunnel mpls traffic-eng autoroute announce

tunnel mpls traffic-eng bandwidth ct0 2000

tunnel mpls traffic-eng tunnel-id 101

router ospf 1

mpls traffic-eng router-id Loopback1

area 0

network 1.1.1.9 0.0.0.0 area 0

network 10.1.1.0 0.0.0.255 area 0

mpls traffic-eng area

tunnel-policy policy1

load-balance tunnel path-selection-sequence te

end