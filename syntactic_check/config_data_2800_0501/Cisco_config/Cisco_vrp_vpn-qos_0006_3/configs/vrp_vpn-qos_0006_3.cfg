hostname PE2

mpls label protocol ldp

mpls ip

mpls traffic-eng tunnels

interface GigabitEthernet1/0/0

no shutdown

ip address 10.2.2.1 255.255.255.0

mpls ip

mpls traffic-eng tunnels

mpls traffic-eng bandwidth 5000

mpls traffic-eng bandwidth bc0 4000

mpls traffic-eng rsvp

interface GigabitEthernet2/0/0

no shutdown

interface GigabitEthernet2/0/0.1

encapsulation dot1Q 20

xconnect 1.1.1.9 101 encapsulation mpls

service-policy output policy1

interface Loopback1

ip address 3.3.3.9 255.255.255.255

interface Tunnel10

ip unnumbered Loopback1

tunnel mode mpls traffic-eng

tunnel destination 1.1.1.9

tunnel mpls traffic-eng bandwidth 2000

tunnel mpls traffic-eng tunnel-id 101

router ospf 1

mpls traffic-eng router-id Loopback1

area 0

network 3.3.3.9 0.0.0.0 area 0

network 10.2.2.0 0.0.0.255 area 0

mpls traffic-eng area

tunnel-policy policy1

tunnel path-mtu-discovery

end