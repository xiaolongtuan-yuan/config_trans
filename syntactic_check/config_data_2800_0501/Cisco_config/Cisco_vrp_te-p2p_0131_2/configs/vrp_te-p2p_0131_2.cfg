hostname PE3
!
ip vrf vpn1
 rd 100:3
 route-target export 100:1
 route-target import 100:1
!
mpls label protocol ldp
!
mpls traffic-eng tunnels
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.1.1.2 255.255.255.252
 mpls ip
 mpls traffic-eng tunnels
!
interface Loopback1
 ip address 2.2.2.2 255.255.255.255
!
interface Tunnel1
 ip unnumbered Loopback1
 tunnel mode mpls traffic-eng
 tunnel destination 1.1.1.1
 tunnel mpls traffic-eng tunnel-id 4
 tunnel mpls traffic-eng path-option 1 explicit name tope1
!
router bgp 100
 neighbor 1.1.1.1 remote-as 100
 neighbor 1.1.1.1 update-source Loopback1
 !
 address-family ipv4 unicast
  neighbor 1.1.1.1 activate
 !
 address-family vpnv4
  neighbor 1.1.1.1 activate
 !
 address-family vpnv4 vrf vpn1
  import route direct
!
router ospf 1
 mpls traffic-eng area
 network 10.1.1.0 0.0.0.3 area 0
 network 2.2.2.2 0.0.0.0 area 0
!
ip explicit-path name tope1
 next-address strict ipv4 10.1.1.1
 next-address strict ipv4 1.1.1.1
!
mpls traffic-eng tunnel-policy
 tunnel-policy tope1
  destination 1.1.1.1
  tunnel 1
!
end