hostname PE2

mpls ldp router-id Loopback0

mpls ldp advertise-labels for 1.1.1.9 Loopback0
mpls ldp neighbor 1.1.1.9 targeted

interface GigabitEthernet1/0/0
no shutdown
ip address 10.2.2.1 255.255.255.0
mpls ip

interface GigabitEthernet2/0/0
no shutdown

interface GigabitEthernet2/0/0.1
encapsulation dot1Q 20
xconnect 1.1.1.9 101 encapsulation mpls
mpls l2vpn pw-class policy1

interface Loopback1
ip address 3.3.3.9 255.255.255.255

interface Tunnel10
ip unnumbered Loopback1
tunnel mode mpls traffic-engineering
tunnel destination 1.1.1.9
tunnel mpls traffic-eng tunnel-id 101
tunnel mpls traffic-eng bandwidth 2000

router ospf 1
mpls ldp autoconfig area 0
network 3.3.3.9 0.0.0.0 area 0
network 10.2.2.0 0.0.0.255 area 0

l2vpn xconnect context policy1
member GigabitEthernet2/0/0.1

mpls traffic-eng tunnels
mpls traffic-eng administrative-weight 0 1.1.1.9 32
mpls traffic-eng autoroute announce
mpls traffic-eng forwarding adj-type neighbor
mpls traffic-eng load-balance number 1

end