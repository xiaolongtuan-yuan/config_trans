hostname LSRA

mpls label protocol ldp
mpls ldp router-id Loopback0 force

interface GigabitEthernet1/0/0
 no shutdown
 ip address 2.1.1.1 255.255.255.0
 mpls ip

interface GigabitEthernet1/0/1
 no shutdown
 ip address 4.1.1.1 255.255.255.0
 mpls ip

interface Loopback0
 ip address 1.1.1.1 255.255.255.255

interface Tunnel10
 ip unnumbered Loopback0
 tunnel mode mpls traffic-eng
 tunnel destination 3.3.3.3
 tunnel mpls traffic-eng autoroute announce
 tunnel mpls traffic-eng priority 7 7
 tunnel mpls traffic-eng path-option 10 dynamic
 tunnel mpls traffic-eng backup-path Tunnel11
 tunnel mpls traffic-eng protection strict

interface Tunnel11
 ip unnumbered Loopback0
 tunnel mode mpls traffic-eng
 tunnel destination 3.3.3.3
 tunnel mpls traffic-eng autoroute announce
 tunnel mpls traffic-eng priority 7 7
 tunnel mpls traffic-eng path-option 11 dynamic

ip route 2.2.2.2 255.255.255.255 2.1.1.2
ip route 3.3.3.3 255.255.255.255 2.1.1.2
ip route 3.3.3.3 255.255.255.255 4.1.1.2
ip route 4.4.4.4 255.255.255.255 4.1.1.2

mpls traffic-eng meg abc
 mep domain abc
  mep id 1 mep remote-mep-id 2
  interface Tunnel10

end