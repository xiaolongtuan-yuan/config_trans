hostname LSRB
!
mpls label protocol ldp
!
mpls traffic-eng tunnels
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.2.1.1 255.255.255.0
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.3.1.1 255.255.255.0
!
interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.1.1.2 255.255.255.0
!
interface Loopback1
 ip address 2.2.2.2 255.255.255.255
!
router isis
 net 49.0000.0000.0000.0002.00
 metric-style wide
!
mpls traffic-eng router-id Loopback1
!
mpls traffic-eng area 0
!
mpls traffic-eng interface GigabitEthernet1/0/0
!
mpls traffic-eng interface GigabitEthernet1/0/2
!
mpls traffic-eng interface GigabitEthernet1/0/1
!
mpls traffic-eng auto-bw bc0
!
mpls traffic-eng auto-bw collection-interval 60
!
mpls traffic-eng administrative-weight 32768
!
mpls traffic-eng autoroute announce
!
mpls traffic-eng autoroute metric absolute
!
mpls traffic-eng auto-tunnel mesh-group 1
!
mpls rsvp-te
!
end