hostname PE3

mpls ip

mpls label protocol ldp

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.5.1.2 255.255.255.252
 mpls ip
 mpls ldp autoconfig

interface GigabitEthernet1/0/1
 no shutdown
 mpls ip
 mpls l2transport vc 200
  encapsulation mpls
  xconnect 1.1.1.1 200 encapsulation mpls
  mtu 1500

interface Loopback1
 ip address 5.5.5.5 255.255.255.255

router ospf 1
 network 5.5.5.5 0.0.0.0 area 0
 network 10.5.1.0 0.0.0.3 area 0

bfd template single-hop 3to1
 interval min-tx 50 min-rx 50 multiplier 3

interface GigabitEthernet1/0/1
 bfd interval 50 min_rx 50 multiplier 3

mpls ldp neighbor 1.1.1.1 targeted

mpls ldp discovery targeted-hello accept

mpls ldp discovery targeted-hello send

mpls ldp password option 1

mpls ldp password required

mpls ldp password key-chain 1

mpls ldp session protection

mpls ldp igp sync

mpls ldp advertise-labels

mpls ldp router-id Loopback1 force

mpls ldp session protection

commit

end