hostname Device2

ip vrf vpn1
  rd 11:11
  route-target export 11:1
  route-target import 11:1
  mpls label mode per-vrf
  vxlan vni 100

bridge-domain 10
  vxlan vni 10
  evpn

router ospfv3 1
  router-id 2.2.2.2
  area 0

interface Vbdif10
  ip vrf forwarding vpn1
  ip address 10.1.1.1 255.255.255.0
  arp proxy disable
  vxlan anycast-gateway

interface GigabitEthernet1/0/0
  no shutdown
  ipv6 enable
  ipv6 address 2001:DB8:2::1/64
  ospfv3 1 area 0

interface GigabitEthernet1/0/1.1
  encapsulation dot1q 10
  bridge-domain 10

interface Loopback0
  ipv6 enable
  ipv6 address 2001:DB8:22::2/128
  ospfv3 1 area 0

interface nve1
  source-interface Loopback0
  member vni 10 mcast-group 239.1.1.1
  headend peer ip address 2001:DB8:11::1

router bgp 100
  address-family l2vpn evpn
    neighbor 2001:DB8:11::1 activate
    neighbor 2001:DB8:11::1 send-community extended
    neighbor 2001:DB8:11::1 encap-type vxlan
    neighbor 2001:DB8:11::1 advertise-all-vni
    neighbor 2001:DB8:11::1 advertise ipv4 unicast
  address-family ipv4
    neighbor 2001:DB8:11::1 activate
    neighbor 2001:DB8:11::1 update-source Loopback0

return