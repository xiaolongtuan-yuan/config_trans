hostname CE2

vlan 10

cfm

interface Vlan10
 ip address 10.1.1.2 255.255.255.0

interface GigabitEthernet1/0/0
 switchport mode trunk
 no shutdown
 switchport trunk allowed vlan 10

interface GigabitEthernet2/0/0
 switchport mode trunk
 no shutdown
 switchport trunk allowed vlan 10

cfm md md1
 ma ma1
  mep mep-id 2 interface GigabitEthernet1/0/0 direction outward
  mep ccm-send mep-id 2 interval 1
  remote-mep mep-id 1
  remote-mep ccm-receive mep-id 1

cfm md md2
 ma ma2
  mep mep-id 4 interface GigabitEthernet2/0/0 direction outward
  mep ccm-send mep-id 4 interval 1
  remote-mep mep-id 3
  remote-mep ccm-receive mep-id 3

end