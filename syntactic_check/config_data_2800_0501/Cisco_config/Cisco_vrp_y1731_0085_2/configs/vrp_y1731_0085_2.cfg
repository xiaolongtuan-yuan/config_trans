hostname CE2

vlan 2

cfm mode on

interface GigabitEthernet1/0/1

switchport mode trunk

switchport trunk allowed vlan 2

no shutdown

cfm mep domain md1

cfm mep domain md1 mep ma1

cfm mep domain md1 mep ma1 interface GigabitEthernet1/0/1

cfm mep domain md1 mep ma1 interface GigabitEthernet1/0/1 mep id 4 outward

cfm mep domain md1 mep ma1 interface GigabitEthernet1/0/1 mep id 4 ccm-send

cfm mep domain md1 mep ma1 interface GigabitEthernet1/0/1 mep id 3 remote-mep

cfm mep domain md1 mep ma1 interface GigabitEthernet1/0/1 mep id 3 remote-mep ccm-receive

cfm mep domain md1 mep ma1 interface GigabitEthernet1/0/1 mep id 4 test-id 2

cfm mep domain md1 mep ma1 interface GigabitEthernet1/0/1 mep id 4 loss-measure dual-ended continual test-id 2

end