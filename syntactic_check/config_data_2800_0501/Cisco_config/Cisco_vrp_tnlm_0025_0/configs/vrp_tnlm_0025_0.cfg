hostname CE1
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.1.1.1 255.255.255.0
!
interface Loopback1
 ip address 5.5.5.5 255.255.255.255
!
router bgp 65001
 neighbor 10.1.1.2 remote-as 100
 !
 address-family ipv4
  no synchronization
  network 5.5.5.5 mask 255.255.255.255
  neighbor 10.1.1.2 activate
 exit-address-family
!
end