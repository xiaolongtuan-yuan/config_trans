hostname PE1
mpls label protocol ldp
mpls ldp router-id Loopback1 force
mpls ip
mpls ldp
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.1.1.1 255.255.255.0
interface GigabitEthernet2/0/0
 no shutdown
 ip address 192.168.1.1 255.255.255.0
 mpls ip
 mpls ldp discovery transport-address loopback 1
interface Loopback1
 ip address 1.1.1.9 255.255.255.255
mpls l2vpn
l2 vfi vpn1 manual
 vpn id 100
 rd 100:1
import route-target
 100:1
!
export route-target
 100:1
interface GigabitEthernet1/0/0
 xconnect vfi vpn1
router bgp 100
 neighbor 3.3.3.9 remote-as 100
 neighbor 3.3.3.9 update-source Loopback1
address-family ipv4
 neighbor 3.3.3.9 activate
 exit-address-family
address-family l2vpn vpls
 neighbor 3.3.3.9 activate
 neighbor 3.3.3.9 send-community
 exit-address-family
router ospf 1
 network 0.0.0.0 255.255.255.255 area 0
 network 1.1.1.9 0.0.0.0 area 0
 network 192.168.1.0 0.0.0.255 area 0
end
