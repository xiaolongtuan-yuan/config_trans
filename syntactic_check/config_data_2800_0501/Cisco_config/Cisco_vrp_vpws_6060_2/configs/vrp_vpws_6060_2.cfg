sysname PE1

mpls lsr-id 1.1.1.9

mpls

mpls l2vpn

interface LoopBack1

 ip address 1.1.1.9 255.255.255.255

mpls l2vpn vpn1 encapsulation ethernet

 route-distinguisher 100:1

 ce ce1 id 1 range 10 default-offset 0

  connection ce-offset 2 interface GigabitEthernet1/0/0

 ce ce2 id 2 range 10 default-offset 0

  connection ce-offset 1 interface GigabitEthernet2/0/0

return



hostname PE1

mpls label protocol ldp

mpls ldp router-id Loopback1

interface Loopback1

 ip address 1.1.1.9 255.255.255.255

mpls l2vpn

 encapsulation dot1q 100

 route-distinguisher 100:1

 vfi vpn1 manual

  vpn id 100

  autodiscovery bgp signaling bgp

  ve interface GigabitEthernet1/0/0

   ve id 1

   ve range 10

  ve interface GigabitEthernet2/0/0

   ve id 2

   ve range 10


