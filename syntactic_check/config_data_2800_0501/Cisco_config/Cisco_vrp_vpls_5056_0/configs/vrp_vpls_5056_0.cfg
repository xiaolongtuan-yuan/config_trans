hostname UPE
!
bfd
!
mpls label protocol ldp
!
mpls ldp router-id Loopback0
!
mpls l2vpn
!
pseudowire-class vsi1
 encapsulation ldp
!
vfi vsi1 manual
 vpn id 1
 neighbor 2.2.2.2 pw-class vsi1
 neighbor 3.3.3.3 pw-class vsi1
 pw-class vsi1
  redundancy master
   main-interface GigabitEthernet1/0/0
   backup-interface GigabitEthernet1/0/2
  preferred-peer neighbor 2.2.2.2
  secondary-peer neighbor 3.3.3.3
!
interface GigabitEthernet1/0/0
 no shutdown
!
interface GigabitEthernet1/0/0.10
 encapsulation dot1q 10
 xconnect vfi vsi1
!
interface GigabitEthernet1/0/1
 no shutdown
 ip address 192.168.10.1 255.255.255.0
 mpls ip
 mpls ldp
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 192.168.20.1 255.255.255.0
 mpls ip
 mpls ldp
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
!
bfd template vplspw1
 discriminator local 104
 discriminator remote 401
!
mpls ldp
!
end