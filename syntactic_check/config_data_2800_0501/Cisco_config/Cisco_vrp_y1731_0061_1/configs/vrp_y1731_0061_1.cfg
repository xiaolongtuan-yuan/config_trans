hostname PE3

interface GigabitEthernet3/0/1.1
encapsulation dot1Q 200

cfm mep domain md3
cfm mep ma ma3
cfm mep mep-id 4 interface GigabitEthernet3/0/1.1 service vlan 200 md md3 ma ma3
cfm mep mep-id 4 ccm-send enable
cfm mep mep-id 3 remote-mep
cfm mep mep-id 3 remote-mep ccm-receive enable
cfm mep mep-id 4 test 1
cfm mep mep-id 4 delay-measure two-way receive test-id 1

