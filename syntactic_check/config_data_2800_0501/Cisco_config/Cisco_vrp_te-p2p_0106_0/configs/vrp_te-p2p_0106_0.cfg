hostname LSR_A

mpls label protocol ldp
mpls ip

mpls traffic-eng tunnels
mpls traffic-eng auto-frr
mpls traffic-eng cspf
mpls traffic-eng rsvp

ip explicit-path name master
 next-address strict ipv4 unicast 2.1.1.1
 next-address strict ipv4 unicast 3.1.1.1

router ospf 1
 mpls traffic-eng area
 opaque-lsa-capable
 network 10.1.1.0 0.0.0.255 area 0.0.0.0
 network 2.1.1.0 0.0.0.255 area 0.0.0.0
 network 1.1.1.1 0.0.0.0 area 0.0.0.0

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.1.1.2 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 mpls traffic-eng rsvp

interface GigabitEthernet2/0/0
 no shutdown
 ip address 2.1.1.1 255.255.255.0
 mpls ip
 mpls traffic-eng tunnels
 mpls traffic-eng rsvp

interface Loopback1
 ip address 1.1.1.1 255.255.255.255

interface Tunnel2
 ip unnumbered Loopback1
 tunnel mode mpls traffic-eng
 tunnel destination 3.3.3.3
 tunnel mpls traffic-eng tunnel-id 200
 tunnel mpls traffic-eng record-route label
 tunnel mpls traffic-eng priority 4 3
 tunnel mpls traffic-eng bandwidth ct0 400
 tunnel mpls traffic-eng path-option 1 explicit name master
 tunnel mpls traffic-eng fast-reroute bandwidth
 tunnel mpls traffic-eng bypass-attributes bandwidth 200 priority 5 4

end