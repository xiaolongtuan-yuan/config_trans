hostname ASBR1
!
mpls label protocol ldp
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 172.16.1.1 255.255.255.0
 mpls ip
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 192.168.1.1 255.255.255.0
!
interface Loopback1
 ip address 2.2.2.9 255.255.255.255
!
interface Tunnel10
 ip unnumbered Loopback1
 tunnel mode mpls traffic-eng
 tunnel destination 1.1.1.9
 tunnel mpls traffic-eng tunnel-id 200
 tunnel mpls traffic-eng bandwidth 5000
 tunnel mpls traffic-eng autoroute announce
 tunnel mpls traffic-eng priority 7 7
 tunnel mpls traffic-eng path-option 1 explicit name BANDWIDTH
!
router ospf 1
 mpls ldp autoconfig area 0
 network 172.16.1.0 0.0.0.255 area 0
!
router bgp 100
 bgp log-neighbor-changes
 neighbor 1.1.1.9 remote-as 100
 neighbor 1.1.1.9 update-source Loopback1
 neighbor 192.168.1.2 remote-as 200
 !
 address-family ipv4
  network 172.16.1.0 mask 255.255.255.0
  neighbor 1.1.1.9 activate
  neighbor 192.168.1.2 activate
 exit-address-family
 !
 address-family vpnv4
  neighbor 1.1.1.9 activate
  neighbor 192.168.1.2 activate
 exit-address-family
!
mpls traffic-eng area 0
!
mpls traffic-eng autoroute announce
!
mpls traffic-eng attribute-flags advertise-explicit-null
!
mpls traffic-eng auto-bw
!
mpls traffic-eng backup-path tunnel select-global
!
mpls traffic-eng logging bandwidth-changes
!
mpls traffic-eng logging fast-reroute
!
mpls traffic-eng logging reoptimize-events
!
mpls traffic-eng logging signaling
!
mpls traffic-eng reoptimize-events
!
mpls traffic-eng router-id Loopback1
!
mpls traffic-eng topology bidir
!
mpls traffic-eng tunnel-path-mtu-discovery
!
mpls traffic-eng tunnels
!
mpls traffic-eng tunnels passive-interface default
!
mpls traffic-eng verify in-label
!
mpls traffic-eng verify path-option 1 dynamic
!
mpls traffic-eng verify path-option 1 explicit name BANDWIDTH
!
mpls traffic-eng verify signaling-protocol rsvp-te
!
mpls traffic-eng verify tunnel-id 200
!
mpls traffic-eng verify tunnel-name BANDWIDTH
!
!
mpls traffic-eng verify tunnel-source Loopback1
