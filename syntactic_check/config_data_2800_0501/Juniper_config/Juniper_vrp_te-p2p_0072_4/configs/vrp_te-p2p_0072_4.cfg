set system host-name PE2
set protocols ldp
set interfaces ge-0/0/0 unit 0 family mpls traffic-eng tunnels
set interfaces ge-0/0/0 unit 0 family mpls traffic-eng logging
set interfaces ge-0/0/0 unit 0 family inet address 10.4.1.2/30
set protocols mpls
set protocols mpls ip
set protocols mpls traffic-eng tunnels enable
set interfaces ge-1/0/0 unit 0 family mpls traffic-eng tunnels
set interfaces ge-1/0/0 unit 0 family mpls traffic-eng logging
set interfaces ge-1/0/0 unit 0 family inet address 10.5.1.2/30
set protocols mpls ip
set interfaces lo0 unit 0 family inet address 5.5.5.5/32
set routing-options router-id loopback0
set forwarding-options ldp router-id loopback0 force
set forwarding-options forwarding-protocol traffic-eng level-2-only
set protocols mpls traffic-eng level-2-only