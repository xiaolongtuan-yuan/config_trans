set system host-name Device3
set interfaces gigabit-ethernet1/0/1 unit 0 family inet address 192.168.2.2/24
set interfaces gigabit-ethernet1/0/2 unit 0 family inet
set interfaces gigabit-ethernet1/0/2.1 unit 0 family ethernet-switching dot1q-vlan custom-id 20
set bridge-domains test-bd vlan 20
set interfaces lo0 unit 0 family inet address 4.4.4.4/32
set interfaces ne1 unit 0 family inet source-interface lo0 member vni 5020
set interfaces ne1 unit 0 family inet head-end-permit-ipv4 3.3.3.3
set routing-options router ospf 1
set routing-options router ospf 1 network 4.4.4.4/32 area 0
set routing-options router ospf 1 network 10.2.1.0/255.255.255.0 area 0
set routing-options router ospf 1 network 192.168.2.0/255.255.255.0 area 0
