set system host-name PE1

set protocols ldp enable
set protocols ldp route-target-id loopback1
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan-access 10
set interfaces ge-0/0/0.1 unit 0 encapsulation dot1q 10
set interfaces ge-0/0/0.1 unit 0 family vpls customer-id vpslad1 transmit-circuit-id 1-1-1-9
set interfaces ge-0/0/0 unit 0 family mpls ip
set interfaces lo0 unit 0 family inet address 1.1.1.9/32

set routing-options router-id 1.1.1.9
set routing-options autonomous-system 100
set routing-options neighbor 2.2.2.9 peer-as 100
set routing-options neighbor 2.2.2.9 update-source lo0.0
set routing-options neighbor 3.3.3.9 peer-as 100
set routing-options neighbor 3.3.3.9 update-source lo0.0

set protocols bgp group external type external
set protocols bgp group external peer 2.2.2.9
set protocols bgp group internal type internal
set protocols bgp group internal peer 3.3.3.9

set routing-instances vpslad1 interface ge-0/0/0.1
set forwarding-options family mpls table vpls vpslad1
set forwarding-optionsfamily inet unicast table vrf vpslad1 route-target export target:10:10
set forwarded-packets protocols ospf area 0 network 10.10.1.0/24
set forwarded-packets protocols ospf area 0 network 10.10.2.0/24

commit
