set system host-name LSRB
set protocols ldp
set forwarding-plane traffic-eng tunnels
set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-1/0/2 unit 0 family inet address 10.3.1.1/24
set interfaces ge-1/0/1 unit 0 family inet address 10.1.1.2/24
set lo0 unit 0 family inet address 2.2.2.2/32
set routing-instances net router-id lo0.0
set routing-instances net instance-type vrf
set protocols ldp traffic-eng tunnels
set protocols mpls te tunnel-group1 interface ge-1/0/0.0
set protocols mpls te tunnel-group1 interface ge-1/0/2.0
set protocols mpls te tunnel-group1 interface ge-1/0/1.0
set protocols mpls traffic-eng bandwidth bc 0 tunnel-group1
set protocols mpls traffic-eng collection-interval 60 tunnel-group1
set routing-options autonomous-system 65000
set protocols mpls traffic-eng administrator-weight 32768
set protocols mpls traffic-eng autoroute announce
set protocols mpls traffic-eng autoroute metric absolute
set protocols mpls traffic-eng auto-tunnel mesh-group1