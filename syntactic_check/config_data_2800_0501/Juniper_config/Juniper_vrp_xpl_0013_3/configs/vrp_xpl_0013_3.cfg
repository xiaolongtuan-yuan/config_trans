set system host-name DeviceD
set interfaces ge-0/0/1 unit 0 family inet address 1.1.2.2/24
set interfaces ge-0/0/2 unit 0 family inet address 1.1.4.1/24
set protocols bgp peer-group peering-BGP-Peer
set protocols bgp peer-group peering-BGP-Peer peer-as 200
set protocols bgp peer-group peering-BGP-Peer neighbor-address 1.1.2.1
set protocols bgp peer-group peering-IBGP-Peer
set protocols bgp peer-group peering-IBGP-Peer peer-as 100
set protocols bgp peer-group peering-IBGP-Peer neighbor-address 1.1.4.2
set protocols bgp group peering-BGP-Peer type external
set protocols bgp group peering-IBGP-Peer type internal
set routing-options sync-all synchronize false
