set system host-name PE2

set interfaces ge-0/0/1 unit 1 family ethernet-switching vlan members 1

set forwarding-options ldp enable
set protocols bgp peer 1.1.1.1 as 100
set protocols bgp peer-group peer1 peer-as 100 remote-as 100 update-source lo0
set protocols ospf area 0 interface ge-0/0/2.0
set protocols ospf area 0 network 10.2.1.0/24

set evpn encapsulation vxlan
set interfaces ge-0/0/1 unit 1 family forwarding evpn vfi evpn-xp-pe1
set interfaces lo0 family inet address 2.2.2.2/32
set vlans vlanname vrf forwarding mpls-ldp

set protocols evpn peer-group evpn-xp-pe1 type ixia
set protocols evpn peer-group evpn-xp-pe1 peer-ip 1.1.1.1
set protocols evpn peer-group evpn-xp-pe1 local-as 100
set interfaces ge-0/0/2 unit 0 family evpn vni vxlan
set protocols evpn vfi default interface ge-0/0/2.0

set ethernet-cfm domain md1
set ethernet-cfm domain md1 maintenance-assocation ma1 eth-mep 1 external-id local
set ethernet-cfm domain md1 maintenance-assication ma1 eth-mep 3 ccm-send enable remote-mep 4 ccm-receive enable test-id 2 mep 3 remote-mep 4 loss-measure dual-ended-continuous
