set system host-name PE2
set protocols mpls
set protocols ldp router-id loopback1 force
set interfaces ge-0/0/0 unit 0 family inet address 10.20.1.2/24
set interfaces ge-0/0/0.1 encapsulation dot1q 10
set vlans vf1 vlan-id 10
