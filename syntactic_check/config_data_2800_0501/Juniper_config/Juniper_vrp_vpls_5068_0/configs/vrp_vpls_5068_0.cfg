set system host-name PE1

set protocols ldp discovery target-ip 2.2.2.2 pw-id 1
set protocols ldp discovery target-ip 3.3.3.3 pw-id 1

set interfaces ge-0/0/0 unit 0 family ip address 192.168.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls ip
setinterfaces ge-0/0/0 unit 0 family mpls ldp auto

set interfaces ge-0/0/1 unit 0 family ip address 192.168.2.1/24
set interfaces ge-0/0/1 unit 0 family mpls ip
setinterfaces ge-0/0/1 unit 0 family mpls ldp auto

set interfaces ge-0/0/2 unit 1 encapsulation dot1q 10
set interfaces ge-0/0/2 unit 1 family ethernet-switching port-mode trunk
set interfaces ge-0/0/2 unit 1 family ethernet-switching vlan members default

set chassis lacp none

set routing-options router ospf 1 area 0.0.0.0 interface ge-0/0/0.0
set routing-options router ospf 1 area 0.0.0.0 interface ge-0/0/1.0
set routing-options router ospf 1 area 0.0.0.0 interface lo0.0

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

commit
