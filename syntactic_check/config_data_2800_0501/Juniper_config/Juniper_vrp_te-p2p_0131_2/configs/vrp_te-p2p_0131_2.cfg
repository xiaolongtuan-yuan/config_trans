set system host-name PE3
set routing-options vrf vp1 route-target export 100:1
set routing-options vrf vp1 route-target import 100:1
set protocols ldp interface ge-1/0/0
set forwarding-options mpls traffic-eng tunnels
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/32
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/0 unit 0 family mpls traffic-eng tunnels
set interfaces lo0 unit 0 family inet address 2.2.2.2/32
set forwarding-options forwarding-table loopback-0
set interfaces tunnel1 unit 0 family inet
set interfaces tunnel1 unit 0 tunnel-mode mpls traffic-eng
set interfaces tunnel1 unit 0 tunnel-destination 1.1.1.1
set interfaces tunnel1 unit 0 tunnel-id 4
set interfaces tunnel1 unit 0 tunnel-mpls-traffic-eng path-option 1 explicit host-name tope1
set routing-options bgp 100
set routing-options neighbors 1.1.1.1 remote-as [Your AS Number]
set routing-options interfaces ge-1/0/0 unit 0 family inet unicast routing-instance vp1 activate
set routing-options interfaces lo0 unit 0 family inet unicast routing-instance vp1 activate
set routing-options vrf-table-import vp1 import route-vp1
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0
set protocols mpls traffic-eng area 0 link ge-1/0/0.0
set routing-options static route 10.1.1.1 next-hop 10.1.1.1 blackhole distance 254
set policy options tunnel-policy tope1 term any from destination-address 1.1.1.1 then tunnel-id 1
