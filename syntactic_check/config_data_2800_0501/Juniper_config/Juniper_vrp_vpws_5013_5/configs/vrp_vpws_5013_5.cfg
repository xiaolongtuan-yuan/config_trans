set system host-name PE3

set routing-options autonomous-system <AS_NUMBER>

set interfaces ge-0/0/0 unit 0 family inet address 10.5.1.2/30
set interfaces ge-0/0/0 mpls ip
set interfaces ge-0/0/0 mpls encapsulation mpls

set forwarding-options ldp protocol label
set interfaces ge-0/0/1 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 mpls l2-transport vccv 200
set interfaces ge-0/0/1 unit 0 mpls l2-transport xconnect 1.1.1.1 200 mpls
set interfaces ge-0/0/1 unit 0 mtu 1500

set interfaces lo0 unit 0 family inet address 5.5.5.5/32

set routing-options router-id lo0
set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0

set protocols bfd template single-hop interval min-transmit 50 min-receive 50 multiplier 3
set interfaces ge-0/0/1 unit 0 bfd interval 50 min-rx 50 multiplier 3

set protocols mpls ldp neighbor 1.1.1.1 target
set protocols mpls ldp discovery targeted-hello receive enable
set protocols mpls ldp discovery targeted-hello send enable
set security policies interzone <ZONE> from-zone untrust to-zone trust policy allow-anything action permit

set security l2fib frr igp-sync
set security ldp neighbor 1.1.1.1 password key-chain 1
set system ldp session-protection hold-down-time 180 hold-walk-count 16
