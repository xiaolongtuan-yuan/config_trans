set interfaces ge-0/0/0 unit 0 family ethernet-switching
setinterfaces ge-0/0/0.1 unit 0 family eos
set forwarding-options encap dot1q 10
set protocols bgp group external type internal
set routing-instances instance0 vrf target both 200:200 both
set routing-instances instance0 vrf import route-targets 200:200
set routing-instances instance0 vrf export route-targets 200:200
set interfaces ge-1/0/0 unit 0 family ethernet-switching
set interfaces ge-1/0/0.1 vlan-id 10
set interfaces ge-1/0/0 unit 0 family inet address 10.30.1.2/24
set protocols bgp peer-group external
setprotocols bgp group external local-as 200
set protocols bgp group external neighbor 3.3.3.3 as-code 200
set protocols bgp group external advertise-vpnv4
set interfaces lo0 unit 0 family inet address 4.4.4.4/32
set routing-options synchronize bgp all except-internal
set routing-instances instance0 routing-options static route 0.0.0.0/0 next-hop self
set protocols ospf area 0 network 4.4.4.4/32
set protocols ospf area 0 network 10.30.1.0/24
set interfaces ge-0/0/0 unit 0 family ethernet-switching interface-mode access
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan 10