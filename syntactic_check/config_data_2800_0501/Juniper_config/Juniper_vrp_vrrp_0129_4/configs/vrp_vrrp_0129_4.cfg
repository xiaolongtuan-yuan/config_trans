set system host-name PE3

set protocols ldp peer 3.3.3.3 pw-id 100
set protocols ldp peer 4.4.4.4 pw-id 100
set forwarding-scheme label mpls
set interfaces ge-1/0/3 unit 0 family inet address 172.16.35.5/24
set interfaces ge-1/0/3.1 encapsulation dot1q 10
set vlans ldp1 vlan-id 100
set vlans ldp1 interfaces ge-1/0/3.1

set protocols ldp router-id loopback1

set forwarding-options mpls label protocol ldp
set interfaces ge-1/0/1 unit 0 family inet address 172.16.45.5/24

set routing-instances ldp1 type vplc
set routing-instances ldp1 interface ge-1/0/3.1
set routing-instances ldp1 protocols static route 0.0.0.0/0 next-hop 172.16.35.4

set interfaces ge-1/0/2 unit 0 family inet address 172.16.45.5/24
set interfaces lo1 unit 0 family inet address 5.5.5.5/32
setprotocols ospf afi ipv4 area 0 network 5.5.5.5/32
set protocols ospf afi ipv4 area 0 network 172.16.35.0/24
set protocols ospf afi ipv4 area 0 network 172.16.45.0/24

