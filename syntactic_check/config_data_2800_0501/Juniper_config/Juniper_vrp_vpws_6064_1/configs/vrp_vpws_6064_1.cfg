set system host-name PE1
set multicast-l3-routing-enabled yes

set forwarding plane-functions label-install ldp
set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 0 family inet mpls ldp enable

set interfaces lo0 unit 0 family inet address 1.1.1.9/32
set protocols ldp interface ge-0/0/0.0 label-policy per-hop

set protocols mpls l2vpn vpn1 encapsulation mpls route-distinguisher 100:1
set protocols mpls l2vpn vpn1 import_Target 1:1
set protocols mpls l2vpn vpn1 export_Target 1:1

set interfaces ge-1/0/0 unit 0 family inet
set routing-options autonomous-system 100
set routing-options autonomous-system 200
set protocols bgp peer-group PE9-pg address-family ipv4 unicast
set protocols bgp peer-group PE9-pg peer-as 100
set interfaces lo0 unit 0 family ethernet-switching port-mode access
set protocols bgp group PE9 type internal local-as 100 neighbor 2.2.2.9 interface lo0.0
set protocols bgp group PE9-ebgp type external local-as 100 neighbor 4.4.4.9 multihop 255
set protocols bgp group PE9-ebgp interface lo0.0

set routing-instances PE9-vpn instance-type vrf
set routing-instances PE9-vpn vni 100
set routing-instances PE9-vpn interfaces ge-0/0/0.0
set protocols bgp group PE9-ebgp peer-group PE9-pg neighbor 4.4.4.9

set protocols static route 10.10.0.0/24 next-hop 10.10.1.0

set routing-options routes distribute-route-target target 1:1 from l2vpn-vpn1

commit
