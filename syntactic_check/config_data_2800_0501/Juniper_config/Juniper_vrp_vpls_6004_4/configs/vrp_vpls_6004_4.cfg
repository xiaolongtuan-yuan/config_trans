set system host-name PE2
set protocols ldp neighbor 1.1.1.9
set forwarding-plane virtual-functions vfi a2 encapsulation-dot1q 10
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/0 unit 0 family l2vpn pw-id 100
set interfaces ge-0/0/0 unit 0 family inet address 192.168.20.2/32
set interfaces ge-1/0/0 unit 1 family mpls
set interfaces ge-1/0/0 unit 1 family l2vpn
set interfaces lo0 unit 0 family inet address 3.3.3.9/32
set routing-options routers ospf 1 area 0 network 3.3.3.9.0.0.0.0
set routing-options routers ospf 1 area 0 network 192.168.20.0.0.0.255
