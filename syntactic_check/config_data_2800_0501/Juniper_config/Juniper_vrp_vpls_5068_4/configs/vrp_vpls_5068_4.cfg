set system name PE5

set protocols mpls label-distribution-protocol ldp

set protocols mpls label-switched-path vfi vsi1 encapsulation dot1q 10 peer 3.3.3.3 peer 4.4.4.4

set interfaces ge-0/0/0 unit 0 family inet address 192.168.4.1/24
set interfaces ge-0/0/1 unit 0 family inet address 192.168.6.1/24
set interfaces ge-0/0/2 unit 0

set routing-options router-id 5.5.5.5

set protocols bgp group internal type internal peer 3.3.3.3 as 100
setprotocols bgp group internal exportexport-policy
set protocols bgp group internal importimport-policy

set protocols bgp group external type external peer 4.4.4.4 as 100
set protocols bgp group external exportexport-policy
set protocols bgp group external importimport-policy

set protocols ospf area 0 network 5.5.5.5/32
set protocols ospf area 0 network 192.168.4.0/24
set protocols ospf area 0 network 192.168.6.0/24

commit
