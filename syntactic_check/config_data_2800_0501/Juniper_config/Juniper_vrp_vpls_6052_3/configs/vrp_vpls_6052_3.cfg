set system host-name ASBR2

set protocols mpls label-range 300 399
set forwarding-options mpls enable
set forwarding-options l2pnc enable

set forwarding-option vfiv fbgpad1 vport-id 100
set forwarding-option vfiv fbgpad1 target 200:1

set protocols mpls ldp

set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family inet address 10.20.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces ge-2/0/0 unit 0 family ldp

set interfaces ge-1/0/0 unit 0 family inet

set interfaces ge-1/0/0.1 unit 0 family ethernet-switching port-mode dot1q-tunnel
set interfaces ge-1/0/0.1 unit 0 encapsulation dot1q 10
set interfaces ge-1/0/0.1 unit 0 tunnel-destination 4.4.4.4
set interfaces ge-1/0/0.1 unit 0 encap dot1q-tunnel

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols bgp 200 peer-group pgroup
set protocols bgp 200 peer-group pgroup neighbor 3.3.3.3 remote-as 200
set protocols bgp 200 peer-group pgroup neighbor 4.4.4.4 remote-as 200 update-source lo0.0

set protocols bgp 200 group pgroup activate

set protocols mpls-te vfi fbgpad1 interface ge-1/0/0.1
set protocols mpls-te vfi fbgpad1 target 200:1

set routing-options router-id 3.3.3.3

set protocols ospf 1 area 0.0.0.0 interface lo0.0
set protocols ospf 1 area 0.0.0.0 interface ge-2/0/0.0 point-to-point

commit check
