set system host-name PE2
set protocols ldp enable
set interfaces ge-0/0/0 unit 1 encapsulation dot1q 10
set interfaces ge-0/0/0 unit 1 family vfi a2
set interfaces ge-0/0/0 unit 1 family ethernet-switching port-mode access
set interfaces lo0 family inet address 3.3.3.9/32
set interfaces tunnel10 mpls traffic-eng tunnel-id 100
set interfaces tunnel10 mpls traffic-eng destination 1.1.1.9
set interfaces tunnel10 mpls traffic-eng autoroute announce
set routing-instances a2 vrf-table-id 10
set routing-instances a2 interface ge-0/0/0.1
set routing-options router-id lo0.0
set protocols ospf area 0 network 3.3.3.9/32 area 0
set protocols ospf area 0 network 10.20.1.0/24 area 0
