set system host-name SPE
set protocols ldp enable
set interfaces gigabit-ethernet1/0/0 unit 0 family inet address 10.10.1.2/24
set interfaces gigabit-ethernet2/0/0 unit 0 family inet address 10.20.1.1/24
set routing-options router ospf 1 area 0 network 10.20.1.0/255.255.255.0
set routing-options router ospf 1 area 0 network 10.10.1.0/255.255.255.0
set routing-options router ospf 1 area 0 network 2.2.2.9/255.255.255.255
set protocols ldp neighbor 1.1.1.9 target
set virtual-routes vrf-definition v123 route-distinguisher 1:123
set interfaces gigabit-ethernet1/0/0 unit 0 family inet vrf-forwarding v123
set interfaces gigabit-ethernet2/0/0 unit 0 family inet vrf-forwarding v123
set protocols ldp router-id loopback1 force
set protocols mpls l2vpn vfi v123 manual vrf-vpn-id 123
set protocols mpls l2vpn vfi v123 ingress-peers 3.3.3.9 pw-id 123
set protocols mpls l2vpn vfi v123 egress-peers 3.3.3.9 pw-id 123
set protocols mpls l2vpn vfi v123 ingress-peers 1.1.1.9 pw-id 123
set protocols mpls l2vpn vfi v123 egress-peers 1.1.1.9 pw-id 123
