set system host-name PE3
set protocols ldp enable
set protocols mpls label protocol ldp
set protocols mpls label router-id loopback0 force
set forwarding-plane vfi default interface ge-0/0/0.0
set forwarding-plane vfi vrf1 interface ge-0/0/1.0
set protocols bgp group external type external as 100
setprotocols bgp group external local-address 3.3.3.3
set protocols bgp group external neighbor 4.4.4.4 update-source loopback0
set protocols bgp group external neighbor 5.5.5.5 update-source loopback0
set routing-options router-id 3.3.3.3
set protocols bgp group external peer-as 100
set protocols ospf area 0 interface ge-0/0/2.0
set protocols ospf area 0 interface ge-0/0/3.0
set protocols ospf area 0 interface ge-0/0/4.0
set protocols ospf area 0 interface ge-0/0/5.0
set protocols ospf area 0 interface ge-0/0/6.0
set interfaces lo0 unit 0 family inet address 3.3.3.3/32
set interfaces ge-0/0/0 unit 0 family inet
set forwarding-options encapsulation mpls
set forwarding-options vrf-table default
