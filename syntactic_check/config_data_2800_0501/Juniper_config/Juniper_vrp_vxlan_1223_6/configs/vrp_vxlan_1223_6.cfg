set system host-name Device1

interface ge-0/0/0
        no shutdown
        ipv4 address 192.168.50.1/24
exit

interface ge-0/0/1
        no shutdown
        ipv4 address 192.168.1.1/24
exit

interface lo0
        ipv4 address 1.1.1.1/32
exit

inet route 6.6.6.6/32 next-hop 192.168.50.2
inet route 7.7.7.7/32 next-hop 192.168.1.2
inet route 192.168.60.0/24 next-hop 192.168.1.2
