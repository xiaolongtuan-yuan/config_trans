set system host-name LSRB
set protocols ldp
set routing-options router isis net 49.0005.0000.0002.00
set protocols isis level 1-2 metric-style wide
set protocols isis traffic-engineering level-1-2
set protocols isis redistribute isis-level-2 into isis-level-1

interface ge-1/0/0
 set unit 0 family ip address 10.1.1.2/24
 set unit 0 family mpls ip
 set unit 0 family mpls traffic-eng
 set unit 0 family mpls traffic-eng tunnels network point-to-point
 set protocols rsvp-te

interface ge-2/0/0
 set unit 0 family ip address 10.2.1.1/24
 set unit 0 family mpls
 set unit 0 family mpls traffic-eng bandwidth max-reservable-bandwidth 100000
 set unit 0 family mpls traffic-eng bandwidth bc0 100000
 set unit 0 family mpls traffic-eng tunnels network point-to-point
 set protocols rsvp-te

interface lo0
 set unit 0 family ip address 2.2.2.2/32
 set protocols isis network point-to-point

