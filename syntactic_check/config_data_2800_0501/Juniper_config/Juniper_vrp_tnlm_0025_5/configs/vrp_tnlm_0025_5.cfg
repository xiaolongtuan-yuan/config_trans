set system host-name CE2

set interface ge-0/0/0 unit 0 family inet address 10.2.1.1/24
set interface lo0 unit 0 family inet address 6.6.6.6/32
        
set routing-instance default-ri routing-options autonomous-system 65002

set protocols bgp neighbor 10.2.1.2 remote-as 200
set protocols bgp neighbor 10.2.1.2 activate
set protocols bgp neighbor 10.2.1.2 address-family ipv4 unicast
set protocols bgp neighbor 10.2.1.2 sync