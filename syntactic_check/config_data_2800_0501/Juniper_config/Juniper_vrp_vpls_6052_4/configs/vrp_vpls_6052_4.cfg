set system host-name PE2

set protocols ldp peer-ip 3.3.3.3
set protocols ldp interface ge-0/0/0
set protocols mpls l2transport

set routing-options vrf-definition bgp-ad1 rd 100:1
set routing-options vrf-definition bgp-ad1 address-family ipv4
set routing-options vrf-definition bgp-ad1 route-target import 200:1
set routing-options vrf-definition bgp-ad1 route-target export 200:1

set interfaces ge-0/0/0 unit 0 family inet address 10.20.1.2/24
set protocols mpls ip
set protocols mpls ldp enable
set protocols mpls ldp autoconfig interface ge-0/0/0

set interfaces ge-0/0/0 unit 1 encapsulation dot1q 10

set vlans bgp-ad1 vlan-id 10
set interfaces ge-0/0/0 unit 1 family ethernet-switching vlan members bgp-ad1

set routing-instances bgp-ad1 instance-type vrf
set routing-instances bgp-ad1 vrf-target export target:200:1
set routing-instances bgp-ad1 vrf-target import target:200:1
set interfaces ge-0/0/0 unit 1 family vlan id 10
set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set policies divert-default default route 4.4.4.4 next-hop self
set protocols bgp peer 3.3.3.3 as 200
set protocols bgp peer 3.3.3.3 update-source lo0.0
set routing-instances bgp-ad1 routing-options autonomous-system 200

set routes static route 4.4.4.4/32 next-hop self

set protocols ospf area 0 interface ge-0/0/0.10
set protocols ospf area 0 interface lo0.0
