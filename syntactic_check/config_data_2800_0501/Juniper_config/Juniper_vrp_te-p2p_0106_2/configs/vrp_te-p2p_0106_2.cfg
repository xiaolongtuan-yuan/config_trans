set system host-name LSRC
set protocols ldp
set routing-options autonomous-system 1
set protocols ospf area 0.0.0.0 network 10.1.1.0/24
set protocols ospf area 0.0.0.0 network 3.1.1.0/24
set protocols ospf area 0.0.0.0 network 4.1.1.0/24
set protocols ospf area 0.0.0.0 network 3.3.3.3/32
set interfaces ge-1/0/0 unit 0 family ip address 10.1.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls ip
set interfaces ge-2/0/0 unit 0 family ip address 4.1.1.2/24
set interfaces ge-2/0/0 unit 0 family mpls ip
set interfaces ge-3/0/0 unit 0 family ip address 3.1.1.2/24
set interfaces ge-3/0/0 unit 0 family mpls ip
set interfaces lo0 unit 0 family inet address 3.3.3.3/32
