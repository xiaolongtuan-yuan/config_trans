set system host-name LSR-A
set protocols ldp interface gigabit-ethernet1/0/0 force-label allocation
set protocols ldp interface gigabit-ethernet1/0/1 force-label allocation
set interfaces lo0 unit 0 family inet address 1.1.1.1/32
set interfaces ge-1/0/0 unit 0 family inet address 2.1.1.1/24
set interfaces ge-1/0/1 unit 0 family inet address 4.1.1.1/24
set routing-instances test-rip instance-type vrf
set routing-instances test-rip interface ge-1/0/0.0
set routing-instances test-rip interface lo0.0
set forwarding-options label-switched-path abcd nexthop 2.1.1.2
set forwarding-options label-switched-path abcd nexthop 4.1.1.2
set protocols ldp interface ge-1/0/0 local-label allocation-force
set protocols ldp interface ge-1/0/1 local-label allocation-force
set vlans vlan0,vlan1,vlan3,arp-vlan-access rules any permit
set forwarding-options label-switched-path abcd out-label 20
set forwarding-options label-switched-path abcd out-label 40
set protocols mep domain abcd id 1 remotes peer-remote-id 2