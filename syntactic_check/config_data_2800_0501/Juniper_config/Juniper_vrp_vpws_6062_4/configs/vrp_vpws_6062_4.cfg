set system host-name PE2
set protocols ldp
set protocols ldp router-id loopback1 force
set interfaces po1.0 unit 0 family inet address 192.168.10.2/24
set interfaces ge-2/0/0 unit 0 family inet address 192.168.10.2/24
set protocols mpls
set protocols mpls ldp
set protocols mpls vprn vpni vpn1 manual vpi 100
set protocols bgp group ipv4-internal type internal
set protocols bgp group 1.1.1.9 remote-as 100
set protocols bgp group 1.1.1.9 local-address loopback1
set protocols bgp group 1.1.1.9 export external
set protocols bgp group 1.1.1.9 activate
set routing-instances vpni instance-type vprn
set routing-instances vpni vrrp-group 1 interface ge-2/0/0.0
set routes static route 3.3.3.9/32 next-hop self
set routing-options router-id loopback1
set protocols ospf area 0 interface ge-2/0/0
set protocols ospf area 0 interface lo
