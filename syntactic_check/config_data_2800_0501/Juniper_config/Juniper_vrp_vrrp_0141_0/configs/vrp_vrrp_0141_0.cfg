set system host-name DeviceA
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set failover groups failover-group-1 priority 120
set failover groups failover-group-1 standby-address 10.1.1.10
set failover groups failover-group-1 preempt-delay minimum 20
set failover groups failover-group-1 track interface ge-0/0/0 reachability
set failover groups failover-group-1 delay-down 40
set interfaces ge-0/0/1 unit 0 family inet address 10.1.2.1/24
set routing-table route 10.2.1.0/24 next-hop 10.1.1.2
set icmp-echo 10.2.1.1 interface ge-0/0/0 frequency 20 timeout 10000 threshold 2
set failover schedule default start-time now
