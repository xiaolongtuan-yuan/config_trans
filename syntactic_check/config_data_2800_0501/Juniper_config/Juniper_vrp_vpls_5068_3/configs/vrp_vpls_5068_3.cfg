set system host-name PE4
set protocols ldp
set protocols ldp router-id loopback0 force
set interfaces ge-1/0/1 unit 0 family inet address 192.168.6.2/24
set interfaces ge-1/0/3 unit 0 family inet address 192.168.5.1/24
set interfaces lo0 unit 0 family inet address 4.4.4.4/32
set protocols bgp group internal type internal local-as 100
set protocols bgp group internal peer-address 3.3.3.3 as 100 update-source loopback0
set protocols bgp group external type external local-as 100
set protocols bgp group external peer-address 5.5.5.5 as 100 update-source loopback0
set protocols bgp group internal activate
set protocols bgp group external activate
set protocols bgp group internal send-community
set protocols bgp group external send-community
set interfaces ge-1/0/1 unit 0 family mpls ip
set interfaces ge-1/0/3 unit 0 family mpls ip
set protocols ospf area 0 interface ge-1/0/1
set protocols ospf area 0 interface ge-1/0/3
set vlans v1 vlan-id 10
set vlans v1 l2-vpn instance v1
set routing-instance v1 l2-vpn addressing-mode unicast
set routing-instances v1 interfaces ge-1/0/1 unit 0 family mpls ip
set routing-instances v1 interfaces ge-1/0/3 unit 0 family mpls ip
set forwarding-options direct-forwarding routing-instances v1 enable
