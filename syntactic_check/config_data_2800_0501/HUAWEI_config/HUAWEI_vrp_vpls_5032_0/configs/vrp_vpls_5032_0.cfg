#
 sysname UPE
#
 mpls lsr-id 1.1.1.9
 mpls
#
 mpls l2vpn
#
vsi v123 
 pwsignal ldp
  vsi-id 123
  peer 2.2.2.9
#
mpls ldp
#
 mpls ldp remote-peer 2.2.2.9
 remote-ip 2.2.2.9
#
interface GigabitEthernet1/0/0.1
 undo shutdown
 vlan-type dot1q 10
 l2 binding vsi v123
#
interface GigabitEthernet2/0/0.1
 undo shutdown
 vlan-type dot1q 10
 l2 binding vsi v123
#
interface GigabitEthernet3/0/0
 undo shutdown
 ip address 10.10.1.1 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack1
 ip address 1.1.1.9 255.255.255.255
#
ospf 1
 area 0.0.0.0
  network 1.1.1.9 0.0.0.0
  network 10.10.1.0 0.0.0.255
#
return
