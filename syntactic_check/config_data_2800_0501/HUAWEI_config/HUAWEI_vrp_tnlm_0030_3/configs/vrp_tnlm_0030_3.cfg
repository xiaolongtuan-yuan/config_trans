#
sysname CE2
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.2.1.1 255.255.255.252
#
interface LoopBack1
ip address 4.4.4.4 255.255.255.255
#
bgp 65410
 peer 10.2.1.2 as-number 100
 #
 ipv4-family unicast
  undo synchronization 
  import-route direct
  peer 10.2.1.2 enable
#
return
