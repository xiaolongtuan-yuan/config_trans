#
sysname ASBR1
#
tunnel-selector bindTE permit node 10
 apply tunnel-policy bindTE
#
mpls lsr-id 2.2.2.9
#
mpls
 mpls te
 mpls rsvp-te
 mpls te cspf
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 172.16.1.1 255.255.255.0
 mpls
 mpls te
 mpls te bandwidth max-reservable-bandwidth 20000
 mpls te bandwidth bc0 15000
 mpls rsvp-te
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 192.168.1.1 255.255.255.0
#
interface LoopBack1
 ip address 2.2.2.9 255.255.255.255
#
interface Tunnel10
 ip address unnumbered interface LoopBack1
 tunnel-protocol mpls te
 destination 1.1.1.9
 mpls te tunnel-id 200
 mpls te bandwidth ct0 5000
 mpls te reserved-for-binding
#
bgp 100
 peer 1.1.1.9 as-number 100
 peer 1.1.1.9 connect-interface LoopBack1
 peer 192.168.1.2 as-number 200
 #
 ipv4-family unicast
  undo synchronization 
  peer 1.1.1.9 enable
  peer 192.168.1.2 enable
 #
 ipv4-family vpnv4
  undo policy vpn-target
  tunnel-selector bindTE
  peer 1.1.1.9 enable
  peer 192.168.1.2 enable
#
ospf 1
 opaque-capability enable
 area 0.0.0.0
  mpls-te enable
  network 2.2.2.9 0.0.0.0
  network 172.16.1.0 0.0.0.255
#
tunnel-policy bindTE
 tunnel binding destination 1.1.1.9 te Tunnel10 down-switch
#
return
