#
sysname CE4
#
interface GigabitEthernet1/0/0
undo shutdown
ip address 10.4.1.1 255.255.255.252
#
interface LoopBack1
ip address 6.6.6.6 255.255.255.255
#
bgp 65420
 peer 10.4.1.2 as-number 100
 #
 ipv4-family unicast
  undo synchronization 
  import-route direct
  peer 10.4.1.2 enable
#
return
