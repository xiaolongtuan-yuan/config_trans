#
sysname DeviceB
#
mpls
#
mpls lsr-id 10.0.0.3
#
mpls
#
mpls ldp
#
 ipv4-family
#
isis 1
 cost-style wide
 network-entity 10.0000.0000.0003.00
#
ip vpn-instance CDMA-RAN
 ipv4-family
  route-distinguisher 4134:3060
  apply-label per-instance
  arp vlink-direct-route advertise
  vpn-target 4134:306000 export-extcommunity
  vpn-target 4134:306000 import-extcommunity
#
interface loopback0
 ip address 10.0.0.3 255.255.255.255
 isis enable 1
#
interface GigabitEthernet1/0/0.31
 vlan-type dot1q 31
 mtu 9500
 ip address 3.0.0.6 255.255.255.252
 isis enable 1
 mpls
 mpls ldp
#
interface GigabitEthernet1/0/1.31
 vlan-type dot1q 1
 ip binding vpn-instance CDMA-RAN
 ip address 192.168.2.2 255.255.255.0
#
nqa twamp-light
 client
  test-session 1 sender-ip 192.168.2.2 reflector-ip 192.168.1.1 sender-port 6000 reflector-port 6000 vpn-instance CDMA-RAN
 sender
  test start-continual test-session 1 period 10
#
return
