#
sysname Device3
#
evpn vpn-instance evrf1 bd-mode
 route-distinguisher 20:1
 vpn-target 11:1 export-extcommunity
 vpn-target 11:1 import-extcommunity
#
ip vpn-instance vpn1
 ipv4-family
  route-distinguisher 22:22
  apply-label per-instance
  vpn-target 11:1 export-extcommunity evpn
  vpn-target 11:1 import-extcommunity evpn
 vxlan vni 100
#
bridge-domain 20
 vxlan vni 20 split-horizon-mode
 evpn binding vpn-instance evrf1
#
ospfv3 1
 router-id 3.3.3.3
 area 0.0.0.0
#
interface Vbdif20
 ip binding vpn-instance vpn1
 ip address 10.2.1.1 255.255.255.0
 arp collect host enable
 vxlan anycast-gateway enable
#
interface GigabitEthernet1/0/0
 undo shutdown
 ipv6 enable
 ipv6 address 2001:DB8:3::1/64
 ospfv3 1 area 0.0.0.0
#
interface GigabitEthernet1/0/1.1 mode l2
 encapsulation dot1q vid 20
 rewrite pop single
 bridge-domain 20
#
interface LoopBack0
 ipv6 enable
 ipv6 address 2001:DB8:33::3/128
 ospfv3 1 area 0.0.0.0
#
interface Nve1
 source 2001:DB8:33::3
 vni 20 head-end peer-list protocol bgp
#
bgp 100
 peer 2001:DB8:11::1 as-number 100
 peer 2001:DB8:11::1 connect-interface LoopBack0
 #
 l2vpn-family evpn
  policy vpn-target
  peer 2001:DB8:11::1 enable
  peer 2001:DB8:11::1 advertise encap-type vxlan
  peer 2001:DB8:11::1 advertise irb
#
return
