#
 sysname CE1
#
 interface GigabitEthernet3/0/1.1
 vlan-type dot1q 200
#
 cfm version standard
 cfm enable
#
 cfm md md3
  ma ma3
   mep mep-id 3 interface GigabitEthernet3/0/1.1 vlan 200 outward
   mep ccm-send mep-id 3 enable
   remote-mep mep-id 4
   remote-mep ccm-receive mep-id 4 enable
   test-id 1 mep 3 remote-mep 4
   delay-measure two-way send test-id 1 interval 1000 count 10
#
return
