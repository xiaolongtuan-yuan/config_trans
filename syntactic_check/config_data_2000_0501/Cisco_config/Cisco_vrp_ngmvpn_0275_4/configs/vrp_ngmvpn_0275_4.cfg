hostname ASBR2
mpls ldp router-id Loopback0
mpls ip

interface GigabitEthernet1/0/1
no shutdown
ip address 10.0.10.4 255.255.255.0
mpls ip
mpls ldp igp sync

interface GigabitEthernet1/0/3
no shutdown
ip address 10.0.16.2 255.255.255.0
mpls ip
mpls ldp igp sync

interface Loopback0
ip address 1.1.1.4 255.255.255.255

router isis
net 10.0000.0000.000b.00
is-type level-2-only
metric-style wide
mpls ldp sync

router bgp 65535
neighbor 10.0.16.1 remote-as 1
neighbor 1.1.1.5 remote-as 65535
neighbor 1.1.1.5 update-source Loopback0
address-family vpnv4
neighbor 10.0.16.1 activate
neighbor 1.1.1.5 activate
address-family vpnv6
neighbor 10.0.16.1 activate
neighbor 1.1.1.5 activate

ip route 1.1.1.3 255.255.255.255 10.0.16.1

end