hostname CE2
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 21.1.1.2 255.255.255.0
 mpls ip
!
interface GigabitEthernet2/0/0
 no shutdown
 ip address 20.1.1.1 255.255.255.0
 mpls ip
!
interface Loopback1
 ip address 5.5.5.9 255.255.255.255
!
router bgp 300
 neighbor 6.6.6.9 remote-as 300
 neighbor 6.6.6.9 update-source Loopback1
 neighbor 21.1.1.1 remote-as 100
 !
 address-family ipv4 unicast
  no synchronization
  network 21.1.1.0 mask 255.255.255.0
  neighbor 6.6.6.9 activate
  neighbor 21.1.1.1 activate
  neighbor 21.1.1.1 route-map IMPORT_LABEL in
 exit-address-family
 !
 address-family ipv4 labeled-unicast
  redistribute ospf 1 route-map OSPF_TO_BGP
  neighbor 6.6.6.9 activate
  neighbor 21.1.1.1 activate
 exit-address-family
!
route-map IMPORT_LABEL permit 10
 set mpls-label
!
route-map OSPF_TO_BGP permit 10
 match ip address 100
!
access-list 100 permit ip 20.1.1.0 0.0.0.255 any
!
router ospf 1
 network 5.5.5.9 0.0.0.0 area 0
 network 21.1.1.0 0.0.0.255 area 0
 network 20.1.1.0 0.0.0.255 area 0
!
end