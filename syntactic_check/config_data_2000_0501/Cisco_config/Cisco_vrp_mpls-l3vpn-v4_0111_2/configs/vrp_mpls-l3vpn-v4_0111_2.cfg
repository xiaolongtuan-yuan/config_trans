hostname ASBR1
!
vrf definition vpn1  
 rd 100:2           
 !
 address-family ipv4
  route-target export 1:1
  route-target import 1:1
 exit-address-family
!
mpls ldp router-id Loopback1 force 
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.10.1.1 255.255.255.0
 mpls ip  ! 标准MPLS接口启用
!
interface GigabitEthernet2/0/0
 no shutdown
 vrf forwarding vpn1  
 ip address 12.12.12.1 255.255.255.0
!
interface Loopback1
 ip address 2.2.2.9 255.255.255.255
!
router bgp 100
 neighbor 1.1.1.9 remote-as 100
 neighbor 1.1.1.9 update-source Loopback1
 !
 address-family ipv4
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-community
 exit-address-family
 !
 address-family vpnv4  
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-community extended 
 exit-address-family
 !
 address-family ipv4 vrf vpn1
  neighbor 12.12.12.2 remote-as 200 
  neighbor 12.12.12.2 activate
 exit-address-family
!
router ospf 1
 network 2.2.2.9 0.0.0.0 area 0
 network 10.10.1.0 0.0.0.255 area 0
 passive-interface default 
 no passive-interface GigabitEthernet1/0/0
!
end