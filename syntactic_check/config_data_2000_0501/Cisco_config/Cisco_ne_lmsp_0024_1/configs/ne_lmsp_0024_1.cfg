router isis 1
 is-type level-1
 net 49.0022.0022.0022.0022.00
 nsf ietf                   
 metric-style wide
 spf-interval 1 1 50
 mpls traffic-eng router-id Loopback0
 mpls traffic-eng level-1-2

interface GigabitEthernet2/0/1
 ip router isis 1

interface GigabitEthernet2/0/5
 ip router isis 1

interface Loopback0
 ip address 2.2.2.2 255.255.255.255

end