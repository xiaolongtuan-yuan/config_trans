version 9.3(5)
feature ospf bgp nv-overlay

hostname Device1
!
vrf context evrf1
  rd 10:1
  address-family ipv4 unicast
    route-target export 11:1
    route-target import 11:1
!
vlan 10
!
interface Ethernet1/0/0
  no shutdown
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 10
!
interface Ethernet2/0/0
  no shutdown
  no switchport
  ip address 192.168.40.2/24
!
interface loopback1
  ip address 5.5.5.5/32
!
interface nve1
  no shutdown
  source-interface loopback1
  member vni 10
    mcast-group 239.1.1.1
!
router bgp 65410
  router-id 5.5.5.5
  neighbor 4.4.4.4
    remote-as 65410
    update-source loopback1
    address-family ipv4 unicast
  neighbor 6.6.6.6
    remote-as 65420
    ebgp-multihop 255
    update-source loopback1
    address-family l2vpn evpn
      send-community extended
!
router ospf 1
  router-id 5.5.5.5
  network 5.5.5.5/32 area 0
  network 192.168.40.0/24 area 0