hostname ASBR2

vrf definition vpn1
 rd 200:2
 !
 address-family ipv4
  route-target export 2:2
  route-target import 2:2
 exit-address-family
!
mpls ldp router-id Loopback1
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.40.1.1 255.255.255.0
 mpls ip
 mpls ldp discovery transport-address interface
!
interface GigabitEthernet2/0/0
 no shutdown
 vrf forwarding vpn1
 ip address 12.12.12.2 255.255.255.0
!
interface Loopback1
 ip address 3.3.3.9 255.255.255.255
!
router bgp 200
 neighbor 4.4.4.9 remote-as 200
 neighbor 4.4.4.9 update-source Loopback1
 !
 address-family ipv4
  neighbor 4.4.4.9 activate
  no auto-summary
 exit-address-family
 !
 address-family vpnv4
  neighbor 4.4.4.9 activate
  neighbor 4.4.4.9 send-community extended
 exit-address-family
!
router ospf 1
 network 3.3.3.9 0.0.0.0 area 0
 network 10.40.1.0 0.0.0.255 area 0
!
end