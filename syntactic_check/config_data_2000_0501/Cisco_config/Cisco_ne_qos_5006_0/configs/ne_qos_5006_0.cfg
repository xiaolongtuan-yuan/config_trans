hostname DeviceA
!
controller E1 2/0/0
 pri-group timeslots 1-31
 no shutdown
!
interface Serial2/0/0:0
 no shutdown
 ip address 3.3.3.1 255.255.255.0
 service-policy output QOS_PROFILE
!
end

! 
!
policy-map QOS_PROFILE
 class PG2
  shape average 400000 40000
 class PG3
  shape average 300000 30000
 class PG4
  shape average 200000 20000
 class class-default
  shape average 60000
!
class-map PG2
class-map PG3 
class-map PG4