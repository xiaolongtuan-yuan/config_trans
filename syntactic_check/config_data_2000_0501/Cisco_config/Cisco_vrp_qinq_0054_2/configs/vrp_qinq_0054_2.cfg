hostname PE3
!
vrf definition vpn2
 rd 100:2
 !
 address-family ipv4
  route-target export 100:2
  route-target import 100:2
 exit-address-family
!
mpls ip
!
interface GigabitEthernet1/0/1.1
 vrf forwarding vpn2
 ip address 172.17.1.1 255.255.255.0
!
interface GigabitEthernet1/0/2
 no shutdown
 ip address 10.10.1.1 255.255.255.252
 mpls ip
 mpls ldp discovery targeted-hello accept
!
interface Loopback1
 ip address 3.3.3.9 255.255.255.255
!
router bgp 100
 neighbor 3.3.3.9 remote-as 100
 neighbor 3.3.3.9 update-source Loopback1
 !
 address-family ipv4 unicast
  neighbor 3.3.3.9 activate
 exit-address-family
 !
 address-family vpnv4
  neighbor 3.3.3.9 activate
  neighbor 3.3.3.9 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf vpn2
  redistribute connected
  neighbor 172.17.1.2 remote-as 65421
 exit-address-family
!
router ospf 1
 network 3.3.3.9 0.0.0.0 area 0
 network 10.10.1.0 0.0.0.3 area 0
!
end