hostname DeviceD
!

vlan 10-200
vlan 300-400
!

spanning-tree mode pvst
!

interface GigabitEthernet1/0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10-200,300-400
!
interface GigabitEthernet1/0/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10-200,300-400
!
end