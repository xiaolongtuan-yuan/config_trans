set system host-name DeviceC

set vlans vlan10 vlan-id 10

set interfaces ge-1/0/2 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members vlan10

set interfaces ge-1/0/5 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-1/0/5 unit 0 family ethernet-switching vlan members vlan10

set protocols rstp bridge-priority 0
set protocols rstp vlan vlan10
set protocols rstp interface ge-1/0/2 edge
set protocols rstp interface ge-1/0/5 edge