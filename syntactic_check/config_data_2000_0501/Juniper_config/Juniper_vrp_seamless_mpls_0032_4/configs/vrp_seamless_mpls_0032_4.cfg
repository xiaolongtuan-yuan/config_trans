set system host-name MASG

set routing-options router-id 5.5.5.5
set protocols mpls interface ge-0/0/0.0
set protocols ldp interface ge-0/0/0.0

set interfaces ge-0/0/0 unit 0 family inet address 10.4.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 5.5.5.5/32

set protocols bgp group external type external
set protocols bgp group external local-address 5.5.5.5
set protocols bgp group external peer-as 200
set protocols bgp group external neighbor 4.4.4.4
set protocols bgp group external family inet labeled-unicast
set protocols bgp group external export policy1

set policy-options policy-statement policy1 term 1 then accept
set policy-options prefix-list loopback 5.5.5.5/32
set policy-options policy-statement policy1 term 1 from prefix-list loopback
set policy-options policy-statement policy1 term 1 then accept

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0