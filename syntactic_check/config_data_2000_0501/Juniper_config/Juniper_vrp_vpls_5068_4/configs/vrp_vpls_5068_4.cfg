set system host-name PE5

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-1/0/1.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-1/0/1.0
set protocols ldp router-id 5.5.5.5

set interfaces ge-1/0/2 unit 10 encapsulation vlan
set interfaces ge-1/0/2 unit 10 vlan-id 10
set interfaces ge-1/0/2 unit 10 family bridge

set protocols bgp group internal type internal
set protocols bgp group internal local-address 5.5.5.5
set protocols bgp group internal family inet unicast
set protocols bgp group internal neighbor 3.3.3.3 peer-as 100
set protocols bgp group internal neighbor 4.4.4.4 peer-as 100

set interfaces ge-1/0/0 unit 0 family inet address 192.168.4.1/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces ge-1/0/1 unit 0 family inet address 192.168.6.1/24
set interfaces ge-1/0/1 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 5.5.5.5/32

set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-1/0/0.0
set protocols ospf area 0 interface ge-1/0/1.0