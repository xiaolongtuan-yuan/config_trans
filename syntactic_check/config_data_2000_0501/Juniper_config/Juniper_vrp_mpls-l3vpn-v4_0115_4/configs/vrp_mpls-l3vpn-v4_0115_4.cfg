set system host-name ASBR2

set interfaces ge-0/0/0 unit 0 family inet address 10.162.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 192.168.2.2/24
set interfaces ge-0/0/1 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 10.33.3.9/32
set interfaces lo0 unit 1 family inet address 10.33.3.10/32

set routing-instances mpls instance-type virtual-router
set routing-instances mpls interface ge-0/0/0.0
set routing-instances mpls interface ge-0/0/1.0
set routing-instances mpls interface lo0.0

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface lo0.0

delete set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
delete set protocols ospf area 0.0.0.0 interface lo0.1
delete set protocols ospf router-id 10.33.3.10
set protocols ospf area 0.0.0.0 interface lo0.1

set protocols bgp group neighbor-1 type external
set protocols bgp group neighbor-1 local-address 10.33.3.10
delete set protocols bgp group neighbor-1 neighbor 10.32.2.10 remote-as 100
set protocols bgp group neighbor-1 neighbor 10.32.2.10
set protocols bgp group neighbor-1 peer-as 100
delete set protocols bgp group neighbor-1 ebgp-multihop 3
set protocols bgp group neighbor-1 multihop ttl 3
set protocols bgp group neighbor-1 export export-vpnv4

set protocols bgp group neighbor-2 type external
set protocols bgp group neighbor-2 local-address 10.33.3.9
delete set protocols bgp group neighbor-2 neighbor 10.34.4.9 remote-as 200
set protocols bgp group neighbor-2 neighbor 10.34.4.9
set protocols bgp group neighbor-2 peer-as 200
delete set protocols bgp group neighbor-2 ebgp-multihop 3
set protocols bgp group neighbor-2 multihop ttl 3
set protocols bgp group neighbor-2 export export-vpnv4

set policy-options policy-statement export-vpnv4 term 1 from protocol bgp
set policy-options policy-statement export-vpnv4 term 1 then accept

delete set protocols bgp family inet unicast
delete set protocols bgp family inet vpnv4
set protocols bgp group neighbor-1 family inet unicast
set protocols bgp group neighbor-1 family inet-vpn unicast
set protocols bgp group neighbor-2 family inet unicast
set protocols bgp group neighbor-2 family inet-vpn unicast