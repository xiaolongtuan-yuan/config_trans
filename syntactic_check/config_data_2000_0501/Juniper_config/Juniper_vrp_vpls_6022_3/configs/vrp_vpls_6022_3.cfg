set system host-name ASBR2

set routing-options router-id 3.3.3.3

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0

set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0

set interfaces ge-1/0/0 unit 0 family inet address 10.20.1.2/30
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces ge-2/0/0 unit 0 family inet address 10.30.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0

set protocols bgp group iBGP type internal
set protocols bgp group iBGP local-address 3.3.3.3
set protocols bgp group iBGP neighbor 4.4.4.4 peer-as 200
set protocols bgp group iBGP family inet labeled-unicast
set protocols bgp group iBGP export policy1

set protocols bgp group eBGP type external
set protocols bgp group eBGP neighbor 10.20.1.1 peer-as 100
set protocols bgp group eBGP family inet labeled-unicast
set protocols bgp group eBGP export policy2

set policy-options policy-statement policy1 term 1 then accept
set policy-options policy-statement policy2 term 1 then accept