set system host-name PE1  

# BFD会话独立声明  
set protocols bfd session P2 neighbor 3.3.3.3  
set protocols bfd session P2 local-address 1.1.1.1  
set protocols bfd session P2 minimum-interval 100  
set protocols bfd session P2 minimum-receive-interval 100   

# 基础接口配置  
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24  
set interfaces ge-2/0/0 unit 0 family inet address 10.1.2.1/24  
set interfaces lo0 unit 0 family inet address 1.1.1.1/32  