set system host-name P

set routing-options router-id 2.2.2.9

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0

set protocols isis
set protocols isis level 1 wide-metrics-only

set interfaces ge-1/0/0 unit 0 family inet address 172.16.1.2/24
set interfaces ge-1/0/0 unit 0 family iso
set protocols isis interface ge-1/0/0.0 point-to-point
set protocols isis interface ge-1/0/0.0 level 1 metric 10

set interfaces ge-2/0/0 unit 0 family inet address 172.17.1.2/24
set interfaces ge-2/0/0 unit 0 family iso
set protocols isis interface ge-2/0/0.0 point-to-point
set protocols isis interface ge-2/0/0.0 level 1 metric 10

set interfaces lo0 unit 0 family inet address 2.2.2.9/32
set interfaces lo0 unit 0 family iso
set protocols isis interface lo0.0 passive