set system host-name PE1  

set vlans V10 vlan-id 10  
set vlans V100 vlan-id 100  
 
set protocols rstp interface ge-0/0/0 disable  
 
set protocols ldp interface ge-0/0/1.0  
set protocols ldp interface ge-0/0/2.0  

set routing-instances L2VPN_VSI instance-type l2vpn  
set routing-instances L2VPN_VSI interface ge-0/0/0.10  
set routing-instances L2VPN_VSI route-distinguisher 1.1.1.1:10  
set routing-instances L2VPN_VSI vrf-target target:100:1  
set routing-instances L2VPN_VSI protocols l2vpn encapsulation-type ethernet  
set routing-instances L2VPN_VSI protocols l2vpn peer 2.2.2.2  
set routing-instances L2VPN_VSI protocols l2vpn peer 3.3.3.3  

set interfaces ge-0/0/0 unit 0 family ethernet-switching port-mode trunk  
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members V100  

set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.1/24  
set interfaces ge-0/0/2 unit 0 family inet address 10.3.1.1/24  
set interfaces lo0 unit 1 family inet address 1.1.1.1/32  
 
set protocols ospf area 0.0.0.0 interface lo0.1 passive  
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0  
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0  