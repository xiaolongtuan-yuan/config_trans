set system host-name CE2

set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces lo0 unit 1 family inet address 10.22.22.22/32

set protocols bgp group external type external
set protocols bgp group external neighbor 10.2.1.2 peer-as 200
set protocols bgp group external family inet unicast

set policy-options policy-statement export-loopback term 1 from protocol direct
set policy-options policy-statement export-loopback term 1 from route-filter 10.22.22.22/32 exact
set policy-options policy-statement export-loopback term 1 then accept
set protocols bgp group external export export-loopback