set system host-name PE1

set protocols ldp interface ge-0/0/1.0
set protocols ldp router-id 1.1.1.9

set routing-instances bgp1 instance-type l2vpn
set routing-instances bgp1 interface ge-0/0/0.1
set routing-instances bgp1 route-distinguisher 192.168.1.1:1
set routing-instances bgp1 vrf-target target:100:1
set routing-instances bgp1 protocols l2vpn encapsulation-type ethernet
set routing-instances bgp1 protocols l2vpn site CE1 site-identifier 1

set interfaces ge-0/0/0 flexible-vlan-tagging
set interfaces ge-0/0/0 encapsulation flexible-ethernet-services
set interfaces ge-0/0/0 unit 1 encapsulation vlan-vpls
set interfaces ge-0/0/0 unit 1 vlan-id 10
set interfaces ge-0/0/0 unit 1 family bridge interface-mode trunk

set interfaces ge-0/0/1 unit 0 family inet address 192.168.1.1/24
set interfaces ge-0/0/1 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 1.1.1.9/32

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0

set protocols bgp group vpls-peers type internal
set protocols bgp group vpls-peers local-address 1.1.1.9
set protocols bgp group vpls-peers family l2vpn signaling
set protocols bgp group vpls-peers neighbor 3.3.3.9