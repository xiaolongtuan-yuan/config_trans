set system host-name PE1

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 interface ge-0/0/0.0
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-import vpn1-import
set routing-instances vpn1 vrf-export vpn1-export

set policy-options policy-statement vpn1-export term 1 from protocol direct
set policy-options policy-statement vpn1-export term 1 then community add vpn-target
set policy-options policy-statement vpn1-export then accept
set policy-options policy-statement vpn1-import term 1 from community vpn-target
set policy-options policy-statement vpn1-import then accept
set policy-options community vpn-target members target:111:1

set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp router-id 1.1.1.1

set protocols bgp group vpn-peers type internal
set protocols bgp group vpn-peers local-address 1.1.1.1
set protocols bgp group vpn-peers family inet-vpn unicast
set protocols bgp group vpn-peers family inet6-vpn unicast
set protocols bgp group vpn-peers neighbor 2.2.2.2
set protocols bgp group vpn-peers neighbor 3.3.3.3

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.1/30
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family inet address 10.20.1.1/30
set interfaces ge-0/0/1 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 1.1.1.1/32