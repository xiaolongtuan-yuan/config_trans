set system host-name CPE

set interfaces ge-0/0/1 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/2 unit 0 family inet address 10.1.2.2/24

set interfaces ge-0/0/3 unit 0 family ethernet-switching
set interfaces ge-0/0/3 unit 0 family ethernet-switching vlan members 100-200

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set routing-instances CPE instance-type virtual-router
set routing-instances CPE interface ge-0/0/1.0
set routing-instances CPE interface ge-0/0/2.0

set protocols bgp group EVPN type internal
set protocols bgp group EVPN local-address 4.4.4.4
set protocols bgp group EVPN neighbor 3.3.3.3 peer-as 1

set protocols isis interface ge-0/0/1.0
set protocols isis interface ge-0/0/2.0