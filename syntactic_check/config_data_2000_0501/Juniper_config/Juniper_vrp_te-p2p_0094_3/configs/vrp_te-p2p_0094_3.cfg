set system host-name LSRD

delete set protocols mpls label-protocol ldp
delete set protocols mpls traffic-eng tunnels
delete set protocols isis level 2-only metric-style wide net 00.0005.0000.0000.0004.00

set protocols mpls interface ge-0/0/0.0
set protocols mpls interface lo0.0

set protocols ldp
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface lo0.0
set protocols ldp router-id lo0.0

set protocols rsvp
set protocols rsvp interface ge-0/0/0.0
set protocols rsvp interface lo0.0

set protocols isis
set protocols isis level 2 wide-metrics-only
set protocols isis interface ge-0/0/0.0 point-to-point
set protocols isis interface ge-0/0/0.0 level 2 disable
set protocols isis interface ge-0/0/0.0 level 2 metric 10
set protocols isis interface lo0.0 passive

set interfaces ge-0/0/0 unit 0 family inet address 10.3.1.2/24
delete set interfaces ge-0/0/0 unit 0 family inet mpls
set interfaces ge-0/0/0 unit 0 family mpls
delete set interfaces ge-0/0/0 unit 0 isis network point-to-point
delete set interfaces ge-0/0/0 unit 0 isis circuit-type level-2-only
delete set interfaces ge-0/0/0 unit 0 mpls traffic-eng tunnels
delete set interfaces ge-0/0/0 unit 0 mpls rsvp-te

set interfaces lo0 unit 0 family inet address 4.4.4.9/32
delete set interfaces lo0 unit 0 family inet isis network point-to-point
delete set interfaces lo0 unit 0 family inet isis circuit-type level-2-only

set routing-options static route 2.2.2.2/32 next-hop 10.3.1.1