set system host-name DeviceC

set interfaces ge-1/0/0 unit 0 family inet address 192.168.1.1/24
set interfaces ge-2/0/0 unit 0 family inet address 192.168.4.1/24
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols pim interface ge-1/0/0.0 mode sparse
set protocols pim interface ge-2/0/0.0 mode sparse
set protocols pim interface lo0.0 mode sparse
set protocols pim rp static address 1.1.1.1
set protocols pim bsr-candidate interface lo0.0
set protocols pim rp-candidate interface lo0.0

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set protocols msdp peer 192.168.3.2 local-address 192.168.1.1
set protocols msdp peer 192.168.5.1 local-address 192.168.4.1
set protocols msdp source 1.1.1.1
set protocols msdp group peer-group sa-filter in list-df
set protocols msdp group peer-group sa-filter out list-df