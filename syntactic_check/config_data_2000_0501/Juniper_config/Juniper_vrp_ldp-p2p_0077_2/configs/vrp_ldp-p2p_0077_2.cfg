set system host-name LSRC

set routing-options router-id 3.3.3.9

set protocols ldp interface all

set interfaces ge-1/0/0 unit 0 family inet address 10.1.4.1/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols isis interface ge-1/0/0.0

set interfaces ge-1/0/1 unit 0 family inet address 10.1.2.2/24
set interfaces ge-1/0/1 unit 0 family mpls
set protocols isis interface ge-1/0/1.0

set interfaces ge-1/0/2 unit 0 family inet address 10.1.3.2/24
set interfaces ge-1/0/2 unit 0 family mpls
set protocols isis interface ge-1/0/2.0

set interfaces lo0 unit 0 family inet address 3.3.3.9/32
set protocols isis interface lo0.0