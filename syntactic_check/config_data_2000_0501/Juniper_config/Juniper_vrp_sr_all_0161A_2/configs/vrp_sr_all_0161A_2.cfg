set system host-name PE2

set interfaces ge-0/0/0 unit 0 family inet address 10.2.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols isis interface ge-0/0/0.0

set protocols bgp group EXTERNAL neighbor 1.1.1.1
set protocols bgp group EXTERNAL peer-as 100
set protocols bgp group EXTERNAL local-address 3.3.3.3
set protocols bgp group EXTERNAL family inet unicast
