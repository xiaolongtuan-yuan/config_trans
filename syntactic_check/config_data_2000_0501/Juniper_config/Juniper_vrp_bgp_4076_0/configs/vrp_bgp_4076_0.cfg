set system host-name DeviceA

set interfaces ge-1/0/0 unit 0 family inet address 10.216.1.1/24
set interfaces ge-2/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-3/0/0 unit 0 family inet address 10.1.2.1/24
set interfaces ge-1/0/1 unit 0 family inet address 10.1.3.1/24
set interfaces ge-1/0/2 unit 0 family inet address 10.1.4.1/24

set policy-options policy-statement NHS term 1 then next-hop self
set policy-options policy-statement NHS term 1 then accept

set protocols bgp group confederation type external
set protocols bgp group confederation export NHS
set protocols bgp group confederation neighbor 10.1.1.2 peer-as 65002
set protocols bgp group confederation neighbor 10.1.2.2 peer-as 65003

set protocols bgp group internal type internal
set protocols bgp group internal export NHS
set protocols bgp group internal neighbor 10.1.3.2 peer-as 65001
set protocols bgp group internal neighbor 10.1.4.2 peer-as 65001

set protocols bgp group external type external
set protocols bgp group external local-address 1.1.1.1
set protocols bgp group external family inet unicast
set protocols bgp group external neighbor 10.216.1.2 peer-as 100