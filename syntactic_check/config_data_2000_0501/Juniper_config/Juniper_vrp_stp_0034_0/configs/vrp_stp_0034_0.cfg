set system host-name DeviceA

set protocols rstp bridge-priority 0
set protocols rstp path-cost legacy
set protocols rstp interface ge-0/0/1 root-protection
set protocols rstp interface ge-0/0/2 root-protection

set interfaces ge-0/0/1 unit 0 family ethernet-switching
set ethernet-switching-options storm-control interface ge-0/0/1
set interfaces ge-0/0/1 disable

set interfaces ge-0/0/2 unit 0 family ethernet-switching
set ethernet-switching-options storm-control interface ge-0/0/2
set interfaces ge-0/0/2 disable