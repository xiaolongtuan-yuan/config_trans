set system host-name DeviceC

set interfaces ge-0/0/1 unit 0 family inet address 10.1.3.1/24
set interfaces ge-0/0/2 unit 0 family inet address 10.1.2.2/24

set interfaces ge-0/0/1 unit 0 family inet filter input TEST-FLOW

set class-of-service interfaces ge-0/0/1 scheduler-map TEST-POLICY

set class-of-service scheduler-maps TEST-POLICY forwarding-class best-effort scheduler TEST-POLICY
set class-of-service schedulers TEST-POLICY transmit-rate 10m

set services rpm probe NQA-TEST test TEST1 probe-type tcp-connect
set services rpm probe NQA-TEST test TEST1 target address 10.1.3.2