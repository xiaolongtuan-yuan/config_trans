set system host-name CE3

set interfaces ge-1/0/0 unit 0 family inet address 10.3.1.2/24
set interfaces lo0 unit 0 family inet address 33.33.33.33/32

set protocols bgp group external type external
set protocols bgp group external peer-as 100
set protocols bgp group external neighbor 10.3.1.1
set protocols bgp group external family inet unicast

delete set protocols bgp group external network 33.33.33.33/32
set routing-options static route 33.33.33.33/32 discard
set policy-options policy-statement ADVERTISE-LOOPBACK term 1 from protocol static
set policy-options policy-statement ADVERTISE-LOOPBACK term 1 then accept
set protocols bgp group external export ADVERTISE-LOOPBACK