set system host-name BRAS1

set protocols bfd interface ge-3/0/0.100 minimum-interval 300
set protocols bfd interface ge-3/0/0.100 multiplier 3

set interfaces ge-2/0/0 unit 0 family inet address 10.1.2.1/24

set interfaces ge-3/0/0 unit 100 family inet address 10.10.10.1/24 vrrp-group 3
set interfaces ge-3/0/0 unit 100 family inet address 10.10.10.1/24 vrrp-group 3 virtual-address 10.10.10.2
set interfaces ge-3/0/0 unit 100 family inet address 10.10.10.1/24 vrrp-group 3 priority 120
set interfaces ge-3/0/0 unit 100 family inet address 10.10.10.1/24 vrrp-group 3 preempt
set interfaces ge-3/0/0 unit 100 family inet address 10.10.10.1/24 vrrp-group 3 accept-data

set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set services rpm probe TRACKER test TRACK_TEST
set services rpm probe TRACKER test TRACK_TEST probe-type icmp-ping
set services rpm probe TRACKER test TRACK_TEST target address 10.10.10.10
set services rpm probe TRACKER test TRACK_TEST probe-count 3
set services rpm probe TRACKER test TRACK_TEST probe-interval 5

set routing-options static route 10.1.2.0/24 install

set chassis redundancy graceful-switchover
set system commit synchronize