set system host-name netconf-agent

set system login user client001 class super-user authentication plain-text-password password

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/32

set system services netconf
set system services netconf ssh

set system services ssh root-login deny
set system services ssh protocol-version v2

set system ports console log-out-on-disconnect
set system ports auxiliary disable
set system ports auxiliary insecure