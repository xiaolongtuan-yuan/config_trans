set system host-name UPE

set routing-instances vpn1 instance-type virtual-router
set routing-instances vpn1 routing-options static route 0.0.0.0/0 next-hop 10.1.1.1

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces ge-2/0/0 unit 0 family inet address 192.168.20.1/24
set interfaces ge-2/0/0 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols bgp group ipv4 type external
set protocols bgp group ipv4 local-address 1.1.1.1
set protocols bgp group ipv4 neighbor 2.2.2.2 peer-as 100
set protocols bgp group ipv4 family inet unicast

set protocols bgp group evpn type internal
set protocols bgp group evpn local-address 1.1.1.1
set protocols bgp group evpn neighbor 2.2.2.2 
set protocols bgp group evpn family l2vpn signaling

set policy-options policy-statement EXPORT-POLICY term 1 from protocol direct
set policy-options policy-statement EXPORT-POLICY term 1 then accept

set protocols ospf area 0 interface ge-1/0/0.0
set protocols ospf area 0 interface lo0.0 passive