set system host-name PE3

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target target:1:1
set routing-instances vpn1 protocols bgp group vpn1-peers family inet unicast
set routing-instances vpn1 interface ge-1/0/0.0

set interfaces ge-1/0/0 unit 0 family inet address 172.16.1.2/24

set interfaces ge-2/0/0 unit 0 family inet address 40.1.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls

set protocols ldp interface ge-2/0/0.0
set protocols ldp discovery hello-interval 5

set interfaces lo0 unit 0 family inet address 1.1.1.9/32

set protocols ospf area 0 interface lo0.0 passive
set protocols ospf area 0 interface ge-2/0/0.0

set protocols bgp group external type external
set protocols bgp group external neighbor 6.6.6.9 peer-as 300
set protocols bgp group external neighbor 6.6.6.9 local-address 1.1.1.9
set protocols bgp group external neighbor 6.6.6.9 multihop ttl 10
set protocols bgp group external family inet unicast
set protocols bgp group external family inet-vpn unicast

set routing-instances vpn1 protocols bgp group vpn1-peers neighbor 172.16.1.1 peer-as 65410