set system host-name PE1

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target target:100:1

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols mpls interface ge-1/0/0.0
set protocols rsvp interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls
set protocols mpls interface ge-2/0/0.0
set protocols ldp interface ge-2/0/0.0

set interfaces lo0 unit 1 family inet address 1.1.1.9/32

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.1 passive

set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address 1.1.1.9
set protocols bgp group IBGP family inet-vpn unicast
set protocols bgp group IBGP family inet6-vpn unicast
set protocols bgp group IBGP neighbor 3.3.3.9

set policy-options policy-statement VPN-EXPORT term 1 then accept
set protocols bgp group IBGP export VPN-EXPORT