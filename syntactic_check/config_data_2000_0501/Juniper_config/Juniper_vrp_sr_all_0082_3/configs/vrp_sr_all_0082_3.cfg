set system host-name P2

set protocols ldp
set protocols ldp router-id 4.4.4.9
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0
set protocols ldp interface ge-1/0/0.0 hello-interval 1
set protocols ldp interface ge-1/0/0.0 hold-time 5
set protocols ldp interface ge-2/0/0.0 hello-interval 1
set protocols ldp interface ge-2/0/0.0 hold-time 5
set protocols ldp targeted-session accept

set interfaces ge-1/0/0 unit 0 family inet address 10.13.1.2/24
set interfaces ge-1/0/0 unit 0 family iso
set protocols isis interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 0 family inet address 10.14.1.1/24
set interfaces ge-2/0/0 unit 0 family iso
set protocols isis interface ge-2/0/0.0

set interfaces lo0 unit 0 family inet address 4.4.4.9/32
set interfaces lo0 unit 0 family iso
set protocols isis interface lo0.0

set protocols isis level 1 wide-metrics-only
set protocols isis level 1 disable
set protocols isis level 2 disable
