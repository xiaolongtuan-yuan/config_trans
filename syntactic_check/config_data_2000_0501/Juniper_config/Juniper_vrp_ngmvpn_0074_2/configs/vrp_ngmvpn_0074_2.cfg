set system host-name ASBR1

set protocols ldp
set protocols ldp p2mp
set protocols ldp recursive-fec

set routing-options router-id 2.2.2.2

set routing-instances instance1 instance-type virtual-router
set interfaces ge-0/0/2 unit 0 family inet address 10.1.3.1/24
set routing-instances instance1 interface ge-0/0/2.0
set interfaces ge-0/0/1 unit 0 family inet address 10.1.2.2/24
set routing-instances instance1 interface ge-0/0/1.0
set interfaces lo0 unit 0 family inet address 2.2.2.2/32
set routing-instances instance1 interface lo0.0

set protocols isis level 2 wide-metrics-only
set protocols isis interface ge-0/0/1.0
set protocols isis interface lo0.0 passive

set protocols bgp group external-neighbors type external
set protocols bgp group external-neighbors local-address 2.2.2.2
set protocols bgp group external-neighbors peer-as 200
set protocols bgp group external-neighbors neighbor 10.1.3.2
set protocols bgp group external-neighbors family inet unicast
set protocols bgp group external-neighbors export policy1
set protocols bgp group external-neighbors multipath

set protocols bgp group internal-neighbors type external
set protocols bgp group internal-neighbors local-address 2.2.2.2
set protocols bgp group internal-neighbors peer-as 100
set protocols bgp group internal-neighbors neighbor 1.1.1.1
set protocols bgp group internal-neighbors family inet unicast
set protocols bgp group internal-neighbors export policy2
set protocols bgp group internal-neighbors multipath

set routing-options static route 3.3.3.3/32 next-hop 10.1.3.2

set policy-options policy-statement policy1 term 1 then accept
set policy-options policy-statement policy2 term 1 then accept