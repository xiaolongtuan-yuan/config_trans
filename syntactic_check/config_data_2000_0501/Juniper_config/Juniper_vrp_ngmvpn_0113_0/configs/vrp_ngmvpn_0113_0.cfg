set system host-name CE1

set interfaces ge-0/0/0 unit 0 family inet address 10.1.2.2/24
set interfaces ge-0/0/1 unit 0 family inet address 10.1.3.2/24
set interfaces ge-0/0/2 unit 0 family inet address 10.1.5.1/24

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0

set routing-options autonomous-system 65001
set protocols bgp group EXTERNAL type external
set protocols bgp group EXTERNAL neighbor 3.3.3.3
set protocols bgp group EXTERNAL neighbor 4.4.4.4
set protocols bgp group EXTERNAL peer-as 100