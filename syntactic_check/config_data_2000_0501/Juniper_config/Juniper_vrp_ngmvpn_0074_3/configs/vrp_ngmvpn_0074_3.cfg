set system host-name ASBR2

set protocols mpls interface ge-0/0/2.0
set protocols ldp interface ge-0/0/2.0

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:2
set routing-instances vpn1 interface ge-0/0/2.0
set routing-instances vpn1 interface ge-0/0/1.0

set interfaces ge-0/0/2 unit 0 family inet address 10.1.3.2/24
set interfaces ge-0/0/2 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 10.1.4.1/24
set interfaces ge-0/0/1 unit 0 family iso

set interfaces lo0 unit 0 family inet address 3.3.3.3/32
set interfaces lo0 unit 0 family iso

set protocols bgp group 200 type external
set protocols bgp group 200 local-address 3.3.3.3
set protocols bgp group 200 family inet labeled-unicast
set protocols bgp group 200 neighbor 10.1.3.1 peer-as 100
set protocols bgp group 200 neighbor 10.1.3.1 export policy1
set protocols bgp group 200 neighbor 4.4.4.4 peer-as 200
set protocols bgp group 200 neighbor 4.4.4.4 export policy2

set policy-options policy-statement policy1 term 1 then next-hop 3.3.3.3
set policy-options policy-statement policy1 term 1 then accept
set policy-options policy-statement policy2 term 1 from protocol direct
set policy-options policy-statement policy2 term 1 then accept

set routing-options static route 2.2.2.2/32 next-hop 10.1.3.1