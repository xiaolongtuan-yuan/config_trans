set system host-name DeviceA
set routing-options multicast

set protocols isis interface ge-1/0/0.0
set protocols isis interface ge-2/0/0.0
set protocols isis interface ge-3/0/0.0

set interfaces ge-1/0/0 unit 0 family inet address 10.4.1.1/24
set protocols pim interface ge-1/0/0 mode sparse

set interfaces ge-2/0/0 unit 0 family inet address 10.5.1.1/24
set protocols pim interface ge-2/0/0 mode sparse

set interfaces ge-3/0/0 unit 0 family inet address 10.3.1.1/24
set protocols pim interface ge-3/0/0 mode sparse