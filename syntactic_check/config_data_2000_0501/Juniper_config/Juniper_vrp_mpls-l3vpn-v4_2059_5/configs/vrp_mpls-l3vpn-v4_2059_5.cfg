set system host-name CE2

set protocols ldp  

set interfaces ge-0/0/0 unit 0 family inet address 21.1.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 20.1.1.1/24
set interfaces ge-0/0/1 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 5.5.5.9/32

set protocols bgp group CE2-BGP type external
set protocols bgp group CE2-BGP local-address 5.5.5.9
set protocols bgp group CE2-BGP neighbor 6.6.6.9 peer-as 300
set protocols bgp group CE2-BGP neighbor 21.1.1.1 peer-as 100

set protocols bgp group CE2-BGP family inet unicast
set protocols bgp group CE2-BGP family inet labeled-unicast

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive