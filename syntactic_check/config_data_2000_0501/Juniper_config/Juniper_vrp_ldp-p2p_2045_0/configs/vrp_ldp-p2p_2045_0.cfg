set system host-name PE1

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family inet address 10.1.2.1/24
set interfaces ge-0/0/1 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0 metric 2
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf traffic-engineering

set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0

set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp router-id 1.1.1.1
set protocols ldp deaggregate
set protocols ldp synchronization
set protocols ldp track-igp-metric

set protocols ldp bfd-liveness-detection minimum-interval 300
set protocols ldp bfd-liveness-detection multiplier 3

set protocols ldp loopfree-alternate
set protocols ldp link-protection
set protocols ldp node-link-deprotection