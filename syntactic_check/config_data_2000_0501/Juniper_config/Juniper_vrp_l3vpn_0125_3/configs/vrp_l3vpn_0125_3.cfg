set system host-name Server

set interfaces ge-0/0/0 unit 0 family inet address 10.2.3.2/24
set interfaces ge-0/0/0 unit 1 family inet address 10.2.1.2/24
set interfaces ge-0/0/0 unit 2 family inet address 10.2.2.2/24
set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set protocols bgp group external-peer type external
set protocols bgp group external-peer local-address 4.4.4.4
set protocols bgp group external-peer peer-as 200
set protocols bgp group external-peer family inet unicast
set protocols bgp group external-peer export bgp-export
set protocols bgp group external-peer neighbor 10.2.3.1

set protocols ospf area 0.0.0.0 interface ge-0/0/0.1
set protocols ospf area 0.0.0.0 interface ge-0/0/0.2
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set routing-options static route 33.33.33.33/32 discard

set policy-options policy-statement bgp-export term static from route-filter 33.33.33.33/32 exact
set policy-options policy-statement bgp-export term static then accept
set policy-options policy-statement bgp-export term connected from protocol direct
set policy-options policy-statement bgp-export term connected then accept