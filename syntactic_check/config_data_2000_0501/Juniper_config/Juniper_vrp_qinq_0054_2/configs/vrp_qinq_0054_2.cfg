set system host-name PE3

set routing-instances vpn2 instance-type vrf
set routing-instances vpn2 route-distinguisher 100:2
set routing-instances vpn2 vrf-target target:100:2

set protocols ldp interface ge-0/0/2.0
set routing-options router-id 3.3.3.9

set interfaces ge-0/0/1 unit 1 family inet address 172.17.1.1/24
set interfaces ge-0/0/2 unit 0 family inet address 10.10.1.1/30
set interfaces lo0 unit 0 family inet address 3.3.3.9/32

set protocols bgp group vpn-peer type external
set protocols bgp group vpn-peer peer-as 100
set protocols bgp group vpn-peer neighbor 3.3.3.9
set protocols bgp group vpn-peer family inet-vpn unicast

set protocols ospf area 0.0.0.0 interface ge-0/0/2.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set policy-options policy-statement vpn1-import term 1 from protocol direct
set policy-options policy-statement vpn1-import term 1 then accept
set protocols bgp group vpn-peer import vpn1-import