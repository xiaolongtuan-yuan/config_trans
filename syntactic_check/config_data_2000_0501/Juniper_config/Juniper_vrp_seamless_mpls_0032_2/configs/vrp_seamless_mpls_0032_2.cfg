set system host-name AGG_ASBR

set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols isis interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 0 family inet address 10.3.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls
set protocols isis interface ge-2/0/0.0

set interfaces lo0 unit 1 family inet address 3.3.3.3/32
set protocols isis interface lo0.1

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0
set protocols ldp router-id 3.3.3.3

set protocols isis level 2 wide-metrics-only

set protocols bgp group iBGP type internal
set protocols bgp group iBGP local-address 3.3.3.3
set protocols bgp group iBGP neighbor 2.2.2.2 peer-as 100
set protocols bgp group iBGP family inet unicast
set protocols bgp group iBGP family inet labeled-unicast
set protocols bgp group iBGP export policy1

set protocols bgp group eBGP type external
set protocols bgp group eBGP peer-as 200
set protocols bgp group eBGP local-address 10.3.1.1
set protocols bgp group eBGP neighbor 10.3.1.2
set protocols bgp group eBGP family inet unicast
set protocols bgp group eBGP family inet labeled-unicast
set protocols bgp group eBGP export policy1

set policy-options policy-statement policy1 term 1 then accept