set system host-name NPE

set protocols mpls interface ge-2/0/0.0
set protocols ldp interface ge-2/0/0.0
set protocols ldp router-id 3.3.3.9

set interfaces ge-2/0/0 unit 0 family inet address 10.2.2.2/24
set interfaces ge-2/0/0 unit 0 family mpls

set routing-instances VRF-1 instance-type vrf
set routing-instances VRF-1 route-distinguisher 1:1
set routing-instances VRF-1 vrf-target target:1:1

set routing-instances VRF-2 instance-type vrf
set routing-instances VRF-2 route-distinguisher 1:2
set routing-instances VRF-2 vrf-target target:1:2

set interfaces lo0 unit 0 family inet address 3.3.3.9/32

set protocols ospf area 0.0.0.0 interface ge-2/0/0.0