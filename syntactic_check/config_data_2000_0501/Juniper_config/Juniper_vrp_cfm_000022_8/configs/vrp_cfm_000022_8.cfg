set system host-name DeviceI

set vlans vlan2 vlan-id 2

set interfaces ge-1/0/0 unit 0 family ethernet-switching interface-mode access
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members vlan2

set interfaces ge-1/0/1 unit 0 family ethernet-switching interface-mode access
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members vlan2

set protocols oam ethernet connectivity-fault-management
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 level 6
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 vlan vlan2
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 continuity-check
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 mep 1 interface ge-1/0/1.0 direction inward
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 remote-mep 2
set protocols oam ethernet connectivity-fault-management maintenance-domain md1 maintenance-association ma1 remote-mep 3