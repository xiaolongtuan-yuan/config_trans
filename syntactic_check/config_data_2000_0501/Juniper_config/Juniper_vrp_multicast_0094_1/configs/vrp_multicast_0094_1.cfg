set system host-name DeviceB

set protocols isis level 1 wide-metrics-only

set protocols pim interface all mode sparse

set interfaces ge-1/0/0 unit 0 family inet address 10.4.1.2/24
set protocols isis interface ge-1/0/0.0
set protocols pim interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/24
set protocols isis interface ge-2/0/0.0
set protocols pim interface ge-2/0/0.0

set interfaces ge-3/0/0 unit 0 family inet address 10.1.1.2/24
set protocols isis interface ge-3/0/0.0
set protocols pim interface ge-3/0/0.0

set routing-options static route 10.5.1.0/24 next-hop 10.2.1.2