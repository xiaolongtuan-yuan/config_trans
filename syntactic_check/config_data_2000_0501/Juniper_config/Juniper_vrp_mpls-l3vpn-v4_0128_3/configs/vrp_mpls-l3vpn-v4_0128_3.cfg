set system host-name CE1
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces lo0 unit 1 family inet address 1.1.1.1/32
set routing-options static route 0.0.0.0/0 next-hop 10.1.1.2
set routing-options static route 0.0.0.0/0 next-hop 10.2.1.2
set forwarding-options hash-key family inet layer-3
set protocols bfd interface ge-1/0/0.0 minimum-interval 100
set protocols bfd interface ge-1/0/0.0 minimum-receive-interval 100
set protocols bfd interface ge-1/0/0.0 multiplier 3
set protocols bfd peer 10.1.1.2 interface ge-1/0/0.0 local-address 10.1.1.1
set protocols bfd interface ge-2/0/0.0 minimum-interval 100
set protocols bfd interface ge-2/0/0.0 minimum-receive-interval 100
set protocols bfd interface ge-2/0/0.0 multiplier 3
set protocols bfd peer 10.2.1.2 interface ge-2/0/0.0 local-address 10.2.1.1