set system host-name DeviceD

delete set protocols spanning-tree bridge-priority 24576
delete set protocols spanning-tree mode rapid-pvst
delete set protocols spanning-tree path-cost long

set protocols rstp bridge-priority 24576
set protocols rstp disable
set protocols vstp bridge-priority 24576
set protocols vstp interface ge-1/0/1.0 edge
set protocols vstp interface ge-1/0/2.0 edge

set interfaces ge-1/0/1 unit 0 family ethernet-switching interface-mode access
delete set interfaces ge-1/0/1 unit 0 family ethernet-switching spanning-tree portfast
set interfaces ge-1/0/1 unit 0 family ethernet-switching storm-control default

set interfaces ge-1/0/2 unit 0 family ethernet-switching interface-mode access
delete set interfaces ge-1/0/2 unit 0 family ethernet-switching spanning-tree portfast
set interfaces ge-1/0/2 unit 0 family ethernet-switching storm-control default