set system host-name MCE

set interfaces ge-0/0/0 unit 0 family inet address 192.168.8.2/24
set interfaces ge-0/0/1 unit 0 family inet address 192.168.9.2/24
set interfaces ge-0/0/2 unit 0 family inet address 192.168.3.2/24
set interfaces ge-0/0/3 unit 0 family inet address 192.168.4.2/24

set routing-instances vpna instance-type virtual-router
set routing-instances vpna interface ge-0/0/0.0
set routing-instances vpna interface ge-0/0/2.0

set routing-instances vpnb instance-type virtual-router
set routing-instances vpnb interface ge-0/0/1.0
set routing-instances vpnb interface ge-0/0/3.0