set system host-name PE3

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:3
set routing-instances vpn1 vrf-target import target:111:1
set routing-instances vpn1 vrf-target export target:111:1
set routing-instances vpn1 protocols bgp group external type external
set routing-instances vpn1 protocols bgp group external neighbor 2001:db8:3::1
set routing-instances vpn1 protocols bgp group external peer-as 65410
set routing-instances vpn1 protocols bgp group external family inet6 unicast

set routing-options router-id 3.3.3.3
set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/2.0

set interfaces ge-0/0/0 unit 0 family inet address 10.20.1.2/30
set interfaces ge-0/0/0 unit 0 family mpls

set routing-instances vpn1 interface ge-0/0/1.0

set interfaces ge-0/0/2 unit 0 family inet address 10.11.1.2/30
set interfaces ge-0/0/2 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 3.3.3.3
set protocols bgp group ibgp neighbor 1.1.1.1
set protocols bgp group ibgp neighbor 2.2.2.2
set protocols bgp group ibgp family inet unicast
set protocols bgp group ibgp family inet-vpn unicast
set protocols bgp group ibgp family inet6-vpn unicast