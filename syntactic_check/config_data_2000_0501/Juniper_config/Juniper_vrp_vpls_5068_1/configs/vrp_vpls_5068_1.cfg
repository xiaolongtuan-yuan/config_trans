set system host-name PE2

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-1/0/2.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-1/0/2.0

set protocols l2circuit peer 1.1.1.1 interface ge-1/0/0.0 virtual-circuit-id 1
set protocols l2circuit peer 3.3.3.3 interface ge-1/0/2.0 virtual-circuit-id 1

set interfaces ge-1/0/0 unit 0 family inet address 192.168.1.2/24
set interfaces ge-1/0/2 unit 0 family inet address 192.168.3.1/24
set interfaces lo0 unit 0 family inet address 2.2.2.2/32

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/2.0