set system host-name PE3

set protocols mpls interface ge-1/0/2.0
set protocols mpls interface ge-1/0/3.0

set protocols ldp interface ge-1/0/2.0
set protocols ldp interface ge-1/0/3.0
set protocols ldp router-id 3.3.3.9

set protocols l2vpn vpls PE3-VPLS vpls-id 2
set protocols l2vpn vpls PE3-VPLS interface ge-1/0/1.100
set protocols l2vpn vpls PE3-VPLS neighbor 1.1.1.9
set protocols l2vpn vpls PE3-VPLS neighbor 2.2.2.9

set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 unit 100 encapsulation vlan-bridge
set interfaces ge-1/0/1 unit 100 vlan-id 100
set interfaces ge-1/0/1 unit 100 family bridge interface-mode trunk

set interfaces ge-1/0/2 unit 0 family inet address 192.168.1.2/30
set interfaces ge-1/0/2 unit 0 family mpls

set interfaces ge-1/0/3 unit 0 family inet address 192.168.2.1/30
set interfaces ge-1/0/3 unit 0 family mpls

set interfaces lo0 unit 1 family inet address 3.3.3.9/32

set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/2.0
set protocols ospf area 0.0.0.0 interface ge-1/0/3.0