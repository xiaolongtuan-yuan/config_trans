set system host-name PE1  

set protocols ldp interface ge-0/0/0.0  
set protocols ldp router-id 1.1.1.1  

set vlans BD10 vlan-id 100  
set vlans BD10 l3-interface irb.10  
set interfaces irb unit 10 family inet address 10.1.1.1/24  
 
set interfaces et-0/0/10 flexible-vlan-tagging  
set interfaces et-0/0/10 unit 0 family ethernet-switching vlan members BD10  

set routing-instances EVPN-VRF interface irb.10  
set routing-instances EVPN-VRF route-distinguisher 1.1.1.1:100  
set routing-instances EVPN-VRF vrf-target target:100:1  
set routing-instances EVPN-VRF protocols evpn encapsulation vxlan  

set protocols bgp group evpn-family family evpn signaling  
set protocols bgp group evpn-peer type internal  
set protocols bgp group evpn-peer local-address 1.1.1.1  

