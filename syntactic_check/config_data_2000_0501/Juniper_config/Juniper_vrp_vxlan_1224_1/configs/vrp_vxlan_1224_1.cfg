set system host-name Leaf1  
 
set interfaces irb unit 10 family inet address 192.168.10.1/24  
set vlans v10 vlan-id 10  
set vlans v10 l3-interface irb.10  
 
set interfaces ge-1/0/0 unit 0 family ethernet-switching port-mode trunk  
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members v10  

set interfaces ge-2/0/0 unit 0 family ethernet-switching port-mode trunk  
set interfaces ge-2/0/0 unit 0 family ethernet-switching vlan members v10  
 
set routing-instances evpn-vrf interface ge-1/0/0.0  
set routing-instances evpn-vrf interface ge-2/0/0.0  
set routing-instances evpn-vrf route-distinguisher 10:1  
set routing-instances evpn-vrf vrf-target target:11:1  
 
set protocols bgp group evpn type internal  
set protocols bgp group evpn local-address 1.1.1.1  
set protocols bgp group evpn family evpn signaling  
set protocols bgp group evpn neighbor 2.2.2.2 peer-as 100  

set interfaces lo0 unit 1 family inet address 1.1.1.1/32  
set protocols ospf area 0.0.0.0 interface lo0.1 passive  
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0  