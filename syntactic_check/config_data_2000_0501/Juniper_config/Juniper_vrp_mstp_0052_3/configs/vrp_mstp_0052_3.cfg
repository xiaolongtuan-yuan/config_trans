set system host-name NPE2

set routing-options router-id 3.3.3.3

set protocols mpls interface ge-0/0/0.0
set protocols mpls interface ge-0/0/1.0
set protocols mpls interface ge-0/0/2.0

set protocols ldp interface ge-0/0/0.0
set protocols ldp interface ge-0/0/1.0
set protocols ldp interface ge-0/0/2.0

set routing-instances m1 instance-type virtual-switch
set routing-instances m1 bridge-domains BD1 vlan-id all
set routing-instances m1 bridge-domains BD1 interface ge-0/0/0.0
set routing-instances m1 bridge-domains BD1 interface ge-0/0/1.0
set routing-instances m1 bridge-domains BD1 interface ge-0/0/2.0

set interfaces ge-0/0/0 unit 0 family inet address 10.7.1.2/24
set interfaces ge-0/0/0 unit 0 family ethernet-switching
set interfaces ge-0/0/1 unit 0 family inet address 10.8.1.1/24
set interfaces ge-0/0/1 unit 0 family ethernet-switching
set interfaces ge-0/0/2 unit 0 family inet address 10.1.2.2/24
set interfaces ge-0/0/2 unit 0 family ethernet-switching
set interfaces lo0 unit 1 family inet address 3.3.3.3/32

set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0