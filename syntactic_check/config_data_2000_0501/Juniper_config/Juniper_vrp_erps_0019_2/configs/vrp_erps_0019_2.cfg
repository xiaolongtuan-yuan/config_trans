set system host-name DeviceC

set vlans vlan10 vlan-id 10
set vlans vlan20 vlan-id 20
set vlans vlan100 vlan-id 100
set vlans vlan101 vlan-id 101
set vlans vlan102 vlan-id 102
set vlans vlan103 vlan-id 103
set vlans vlan200 vlan-id 200
set vlans vlan300 vlan-id 300
set vlans vlan301 vlan-id 301
set vlans vlan302 vlan-id 302
set vlans vlan400 vlan-id 400

set protocols mstp configuration-name erps-domain
set protocols mstp bridge-priority 4096
set protocols mstp interface ge-1/0/1 disable
set protocols mstp interface ge-1/0/2 disable

set interfaces ge-1/0/1 flexible-vlan-tagging
set interfaces ge-1/0/1 native-vlan-id 1
set interfaces ge-1/0/1 unit 0 family ethernet-switching port-mode trunk
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members 10
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members 20
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members 100-200
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members 300-400

set interfaces ge-1/0/2 flexible-vlan-tagging
set interfaces ge-1/0/2 native-vlan-id 1
set interfaces ge-1/0/2 unit 0 family ethernet-switching port-mode trunk
set interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members 10
set interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members 20
set interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members 100-200
set interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members 300-400
