set system host-name NPE

set protocols mpls interface ge-1/0/0.0

set protocols ldp router-id 3.3.3.3
set protocols ldp interface ge-1/0/0.0

set protocols isis interface ge-1/0/0.0
set protocols isis level 2 wide-metrics-only

set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces ge-2/0/0 unit 0 family inet address 192.168.30.1/24

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 interface ge-2/0/0.0

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols bgp group 100 type internal
set protocols bgp group 100 local-address 3.3.3.3
set protocols bgp group 100 family inet-vpn unicast
set protocols bgp group 100 family evpn signaling
set protocols bgp group 100 neighbor 2.2.2.2 peer-as 100
set protocols bgp group 100 neighbor 2.2.2.2 bfd-liveness-detection minimum-interval 300

set policy-options policy-statement SPE then accept