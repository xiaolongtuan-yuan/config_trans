set system host-name Device1

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.111 vrrp-group 1 virtual-address 10.1.1.111
set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.111 vrrp-group 1 priority 120
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 10.1.3.1/24

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf export EXPORT-DIRECT

set policy-options policy-statement EXPORT-DIRECT term 1 from protocol direct
set policy-options policy-statement EXPORT-DIRECT term 1 then accept