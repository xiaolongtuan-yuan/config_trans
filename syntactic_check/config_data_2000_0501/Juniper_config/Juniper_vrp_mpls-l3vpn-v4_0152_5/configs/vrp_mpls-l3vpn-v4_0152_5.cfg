set system host-name CE2

set interfaces ge-0/0/0 unit 0 family inet address 10.2.1.1/24

set protocols bgp group EBGP type external
set protocols bgp group EBGP peer-as 200
set protocols bgp group EBGP neighbor 10.2.1.2
set protocols bgp group EBGP family inet unicast
set protocols bgp group EBGP export EXPORT_DIRECT

set routing-options autonomous-system 65002

set policy-options policy-statement EXPORT_DIRECT term 1 from protocol direct
set policy-options policy-statement EXPORT_DIRECT term 1 then accept