set system host-name CE2

set routing-options static route 22.22.22.22/32 discard

set policy-options policy-statement EXPORT-LOOPBACK term 1 from protocol static
set policy-options policy-statement EXPORT-LOOPBACK term 1 then accept

set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.2/24
set interfaces lo0 unit 0 family inet address 22.22.22.22/32

set protocols bgp group internal type internal
set protocols bgp group internal local-address 22.22.22.22
set protocols bgp group internal neighbor 10.2.1.1 peer-as 100
set protocols bgp group internal family inet unicast
set protocols bgp group internal export EXPORT-LOOPBACK