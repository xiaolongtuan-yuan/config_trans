set system host-name LSRB

set routing-options router-id 2.2.2.9
set protocols ldp interface all
set protocols ldp router-id lo0

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols isis interface ge-0/0/0.0

set interfaces ge-0/0/1 unit 0 family inet address 10.1.3.1/24
set interfaces ge-0/0/1 unit 0 family mpls
set protocols isis interface ge-0/0/1.0

set interfaces lo0 unit 0 family inet address 2.2.2.9/32
set protocols isis interface lo0.0