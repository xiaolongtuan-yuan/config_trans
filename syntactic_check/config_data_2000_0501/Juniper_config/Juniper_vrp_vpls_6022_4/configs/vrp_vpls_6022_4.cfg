set system host-name PE2

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0

set routing-instances vfi_v1 route-distinguisher 200:1
set routing-instances vfi_v1 interface ge-2/0/0.0

set interfaces ge-2/0/0 unit 0 vlan-id 10
set interfaces ge-2/0/0 unit 0 family bridge
set interfaces ge-1/0/0 unit 0 family inet address 10.30.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set interfaces lo0 unit 1 family inet address 4.4.4.4/32

set protocols bgp group external type external
set protocols bgp group external local-address 4.4.4.4
set protocols bgp group external neighbor 1.1.1.1 peer-as 100
set protocols bgp group external neighbor 1.1.1.1 multihop ttl 255
set protocols bgp group external neighbor 3.3.3.3 peer-as 200
set protocols bgp group external neighbor 3.3.3.3 local-address 4.4.4.4
set protocols bgp group external family inet unicast
set protocols bgp group external family evpn signaling

set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0