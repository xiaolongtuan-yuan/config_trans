set system host-name PE2

set protocols mpls interface ge-2/0/0.0

set protocols ldp interface ge-2/0/0.0
set protocols ldp router-id 3.3.3.9

set routing-instances vpls interface ge-1/0/0.0
set routing-instances vpn1 route-distinguisher 100:1

set interfaces ge-1/0/0 unit 0 family ethernet-switching
set interfaces ge-1/0/0 unit 0 encapsulation vlan-vpls
set interfaces ge-2/0/0 unit 0 family inet address 192.168.10.2/24
set interfaces ge-2/0/0 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 3.3.3.9/32

set protocols bgp group vpnv4 type internal
set protocols bgp group vpnv4 local-address 3.3.3.9
set protocols bgp group vpnv4 peer-as 100
set protocols bgp group vpnv4 neighbor 1.1.1.9 family inet-vpn unicast
set protocols bgp group vpnv4 neighbor 1.1.1.9 family l2vpn signaling

set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive