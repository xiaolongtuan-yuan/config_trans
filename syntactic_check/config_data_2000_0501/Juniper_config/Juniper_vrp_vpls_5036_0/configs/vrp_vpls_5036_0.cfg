set system host-name PE1
set routing-options router-id 1.1.1.1

set protocols mpls interface ge-0/0/0.0
set protocols ldp interface ge-0/0/0.0

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 10 vlan-id 10
set interfaces ge-0/0/0 unit 10 family ccc

set routing-instances PW-CONNECT interface ge-0/0/0.10

set protocols ldp mac-withdraw
set protocols ldp interface ge-0/0/0.0 mac-withdraw

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.10
set protocols ospf area 0.0.0.0 interface lo0.0