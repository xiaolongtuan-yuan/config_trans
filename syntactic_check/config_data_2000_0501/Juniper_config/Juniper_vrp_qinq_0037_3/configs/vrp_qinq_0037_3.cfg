set system host-name DeviceA  

set vlans vlan10 vlan-id 10  
set vlans vlan20 vlan-id 20  

set interfaces ge-1/0/3 unit 0 family ethernet-switching port-mode trunk  
set interfaces ge-1/0/3 unit 0 family ethernet-switching vlan members vlan10  
set interfaces ge-1/0/3 unit 0 family ethernet-switching vlan members vlan20  

set interfaces ge-1/0/1 unit 0 family ethernet-switching port-mode access  
set interfaces ge-1/0/1 unit 0 family ethernet-switching vlan members vlan10  

set interfaces ge-1/0/2 unit 0 family ethernet-switching port-mode access  
set interfaces ge-1/0/2 unit 0 family ethernet-switching vlan members vlan20  