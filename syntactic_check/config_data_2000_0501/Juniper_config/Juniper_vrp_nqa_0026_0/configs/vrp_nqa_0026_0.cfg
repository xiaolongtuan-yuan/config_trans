set system host-name DeviceA

set services rpm probe NQA-TEST test TEST1 
set services rpm probe NQA-TEST test TEST1 probe-type tcp-connect 
set services rpm probe NQA-TEST test TEST1 target address 10.1.1.1
set services rpm probe NQA-TEST test TEST1 target port 4000

set protocols isis interface ge-1/0/0.0
set protocols isis interface ge-1/0/0.0 point-to-point
set protocols isis level 1 authentication-key "$9$XXXXXX"  
set protocols isis level 1 wide-metrics-only


set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
