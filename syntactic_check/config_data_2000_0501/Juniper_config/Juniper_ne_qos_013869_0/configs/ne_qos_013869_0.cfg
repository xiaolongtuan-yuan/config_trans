set system multicast-routing

set interfaces ge-1/0/0 unit 0 family inet address 192.168.1.1/24
set interfaces ge-1/0/0 unit 0 pim sparse-mode
set interfaces ge-2/0/0 unit 0 family inet address 192.168.1.1/24
set interfaces ge-2/0/0 unit 0 pppoe-server bind Virtual-Template 1
set interfaces ge-2/0/0 unit 0 igmp join-group 239.0.0.1

set dhcp pool pool1 network 192.168.1.0/24
set dhcp pool pool1 default-router 192.168.1.1
set dhcp pool pool1 dns-server 192.168.7.252

set aaa new-model
set aaa multicast-group 239.0.0.1
set aaa multicast-source 10.0.0.2
set aaa multicast-boundary 5000 10000

set radius-server host <radius server IP> secret <shared secret>

set ip local-pool pool1 range 192.168.1.2 192.168.1.200

return