set system host-name DeviceD

set interfaces ge-0/0/0 unit 0 family inet address 192.168.4.2/24
set interfaces ge-0/0/1 unit 0 family inet address 192.168.1.2/24
set interfaces ge-0/0/2 unit 0 family inet address 10.110.5.1/24
set interfaces ge-0/0/3 unit 0 family inet address 10.110.4.1/24

set firewall family inet filter acl-2001 term 1 from source-address 232.1.1.0/24
set firewall family inet filter acl-2001 term 1 then accept

set protocols isis interface ge-0/0/0.0
set protocols isis interface ge-0/0/1.0
set protocols isis interface ge-0/0/2.0
set protocols isis interface ge-0/0/3.0

set protocols pim interface ge-0/0/0.0
set protocols pim interface ge-0/0/1.0
set protocols pim interface ge-0/0/2.0
set protocols pim interface ge-0/0/3.0