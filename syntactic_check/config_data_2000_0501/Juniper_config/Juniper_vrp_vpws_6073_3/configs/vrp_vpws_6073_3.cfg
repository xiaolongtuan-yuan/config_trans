set system host-name PE1

set routing-options router-id 1.1.1.1

set protocols mpls interface ge-1/0/0.0
set protocols ldp interface ge-1/0/0.0

set routing-instances VPLS1 interface ge-1/0/2.100
set routing-instances VPLS1 interface ge-1/0/1.100

set interfaces ge-1/0/2 unit 100 family ethernet-switching
set interfaces ge-1/0/2 unit 100 encapsulation vlan-vpls
set interfaces ge-1/0/2 unit 100 vlan-id 100
set interfaces ge-1/0/2 unit 100 family bridge interface-mode trunk

set interfaces ge-1/0/1 unit 100 family ethernet-switching
set interfaces ge-1/0/1 unit 100 encapsulation vlan-vpls
set interfaces ge-1/0/1 unit 100 vlan-id 100
set interfaces ge-1/0/1 unit 100 family bridge interface-mode trunk

set interfaces ge-1/0/0 unit 0 family inet address 192.168.1.1/24
set interfaces lo0 unit 1 family inet address 1.1.1.1/32

set protocols ospf area 0.0.0.0 interface lo0.1 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0