set system host-name PE2

set protocols ldp
set protocols ldp router-id 2.2.2.9
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0

set policy-options policy-statement ldp-export term 1 from route-filter 10.1.1.2/32 exact
set policy-options policy-statement ldp-export term 1 then accept
set policy-options policy-statement ldp-export term 2 from route-filter 2.2.2.9/32 exact
set policy-options policy-statement ldp-export term 2 then accept
set protocols ldp export ldp-export

set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-1/0/0 unit 10 encapsulation vlan-vpls
set interfaces ge-1/0/0 unit 10 vlan-id 10
set protocols l2circuit neighbor 1.1.1.9 interface ge-1/0/0.10 virtual-circuit-id 100

set interfaces ge-2/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-2/0/0 unit 0 family mpls
set protocols mpls interface ge-2/0/0.0

set protocols ospf area 0.0.0.0 interface lo0.0 passive
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0

set interfaces lo0 unit 0 family inet address 2.2.2.9/32