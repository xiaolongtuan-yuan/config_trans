set system host-name DeviceA

set protocols ospf area 0.0.0.0 interface ge-1/0/0
set protocols ospf area 0.0.0.1 interface ge-3/0/0
set protocols ospf area 0.0.0.1 interface ge-2/0/0
set protocols ospf area 0.0.0.1 nssa 
set protocols ospf area 0.0.0.1 nssa default-lsa default-metric 1
set protocols ospf area 0.0.0.1 nssa no-summaries

set interfaces ge-1/0/0 unit 0 family inet address 192.168.0.1/24
set interfaces ge-2/0/0 unit 0 family inet address 192.168.3.1/24
set interfaces ge-3/0/0 unit 0 family inet address 192.168.1.1/24

set routing-options router-id 1.1.1.1