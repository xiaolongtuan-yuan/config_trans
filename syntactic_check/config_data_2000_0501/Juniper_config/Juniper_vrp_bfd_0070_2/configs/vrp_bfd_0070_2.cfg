set system host-name PE3

set routing-instances VPNA instance-type virtual-router
set routing-instances VPNA route-distinguisher 100:3
set routing-instances VPNA vrf-target target:111:1

set protocols mpls interface ge-1/0/0.0
set protocols mpls interface ge-2/0/0.0
set protocols ldp interface ge-1/0/0.0
set protocols ldp interface ge-2/0/0.0
set protocols ldp transport-address 4.4.4.4

set interfaces ge-1/0/0 unit 0 family inet address 11.11.11.2/24
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces ge-2/0/0 unit 0 family inet address 22.22.22.2/24
set interfaces ge-2/0/0 unit 0 family mpls


set interfaces ge-3/0/0 unit 0 family inet address 10.3.1.1/24
set routing-instances VPNA interface ge-3/0/0.0

set interfaces lo0 unit 0 family inet address 4.4.4.4/32

set routing-options router-id 4.4.4.4

set protocols bgp group external type external
set protocols bgp group external local-address 4.4.4.4
set protocols bgp group external neighbor 2.2.2.2 peer-as 100
set protocols bgp group external neighbor 3.3.3.3 peer-as 100

set policy-options policy-statement vpn-import term 1 from protocol bgp
set policy-options policy-statement vpn-import term 1 then accept
set policy-options policy-statement vpn-import term 2 then reject

set protocols bgp group external family inet unicast
set protocols bgp group external family inet-vpn unicast
set routing-instances VPNA protocols bgp group external-peers type external
set routing-instances VPNA protocols bgp group external-peers neighbor 10.3.1.2 peer-as 65410
set routing-instances VPNA protocols bgp group external-peers export vpn-import
set routing-instances VPNA protocols bgp multipath

set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0