#
sysname DeviceC
#
router id 3.3.3.3
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 172.16.6.1 255.255.255.0
#
interface GigabitEthernet1/0/2
 undo shutdown
 ip address 172.16.2.1 255.255.255.0
#
interface GigabitEthernet2/0/3
 undo shutdown
 ip address 172.16.4.2 255.255.255.0
