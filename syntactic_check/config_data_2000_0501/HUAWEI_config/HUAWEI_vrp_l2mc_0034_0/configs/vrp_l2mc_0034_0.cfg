#
 sysname DeviceA
#
vlan batch 3
#
 igmp-snooping enable
#
vlan 3
 igmp-snooping enable
#
interface GigabitEthernet 1/0/0
 undo shutdown
 portswitch
 port link-type access
 port default vlan 3
 igmp-snooping static-router-port vlan 3
#
interface GigabitEthernet 1/0/1
 undo shutdown
 portswitch
 port default vlan 3
#
interface GigabitEthernet 1/0/2
 undo shutdown
 portswitch
 port default vlan 3
#
return
