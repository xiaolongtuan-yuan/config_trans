#
sysname P        
#               
segment-routing ipv6
 encapsulation source-address 2::2
 locator as1 ipv6-prefix 20:: 64 static 32
  opcode ::1 end 
#               
isis 1          
 is-level level-1
 cost-style wide
 network-entity 10.0000.0000.0002.00
 avoid-microloop frr-protected
 #              
 ipv6 enable topology ipv6
 segment-routing ipv6 locator as1 auto-sid-disable
 ipv6 avoid-microloop segment-routing                   
 ipv6 frr                                               
  loop-free-alternate level-1                           
  ti-lfa level-1  
 #
#               
interface GigabitEthernet1/0/0
 undo shutdown  
 ipv6 enable    
 ipv6 address 2001::2/96
 isis ipv6 enable 1 
# 
interface GigabitEthernet2/0/0
 undo shutdown  
 ipv6 enable    
 ipv6 address 2002::1/96
 isis ipv6 enable 1  
#               
interface GigabitEthernet3/0/0
 undo shutdown  
 ipv6 enable    
 ipv6 address 2003::1/96
 isis ipv6 enable 1 
#               
interface LoopBack1
 ipv6 enable    
 ipv6 address 2::2/128
 isis ipv6 enable 1
#               
return
