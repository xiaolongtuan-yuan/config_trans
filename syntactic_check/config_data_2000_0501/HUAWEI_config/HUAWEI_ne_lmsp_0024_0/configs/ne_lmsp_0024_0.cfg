#                                                                               
 sysname PE1                                                              
 isis 1 
  is-level level-1
  network-entity 1111.1111.1111.1111.00
  graceful-restart
  cost-style wide-compatible
  timer spf 1 1 50
  traffic-eng level-1-2

#
 interface gigabitEthernet 2/0/1
  isis enable 1

 interface gigabitEthernet 2/0/2
  isis enable 1

 interface loopBack 0
  ip address 1.1.1.1 32

#
return
