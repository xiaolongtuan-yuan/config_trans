#
sysname PE2
#
bfd
 mpls-passive
#
mpls lsr-id 4.4.4.4
#
mpls
 lsp-trigger all
 mpls bfd enable
 mpls bfd-trigger fec-list l2
 mpls bfd min-tx-interval 600 min-rx-interval 100 detect-multiplier 4
#
fec-list l2
 fec-node 1.1.1.1
#
mpls ldp
 #
 ipv4-family
  auto-frr lsp-trigger all
#               
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 10.1.5.1 255.255.255.0
 mpls
 mpls ldp
#
interface GigabitEthernet1/0/1
 undo shutdown
 ip address 10.1.4.1 255.255.255.0
 ospf cost 2
 mpls
 mpls ldp
#               
interface LoopBack1
 ip address 4.4.4.4 255.255.255.255
#
ospf 1
 frr
  loop-free-alternate
 area 0.0.0.0
  network 4.4.4.4 0.0.0.0
  network 10.1.4.0 0.0.0.255
  network 10.1.5.0 0.0.0.255
#
return
