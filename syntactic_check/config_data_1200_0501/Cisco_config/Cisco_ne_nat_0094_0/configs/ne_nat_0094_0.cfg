hostname BRAS

interface GigabitEthernet2/0/0.1
 encapsulation dot1q 1
 ip address 10.10.10.1 255.255.255.0
 ip nat inside
 ip virtual-reassembly

ip dhcp pool pool1
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
 dns-server 192.168.7.252

ip nat pool pool1 11.11.11.101 11.11.11.105 netmask 255.255.255.0
ip nat inside source list 3001 pool pool1 overload

ip access-list extended ACL-3001
 permit ip 10.10.10.0 0.0.0.255 any

ip access-list extended ACL-6001
 permit ip any object-group group1

class-map match-all CM-c1
 match access-group name ACL-6001

policy-map PM-p1
 class CM-c1
  nat
   source dynamic pool1 interface

interface GigabitEthernet2/0/0.1
 service-policy input PM-p1

aaa new-model
aaa authentication dot1x default group radius local
aaa authorization network default group radius local
aaa accounting dot1x default start-stop group radius
aaa accounting network default start-stop group radius

radius-server host 192.168.7.252 auth-port 1812 acct-port 1813 key <shared secret>

interface GigabitEthernet2/0/0.1
 aaa authentication login default group radius local
 aaa accounting dot1x default start-stop group radius
 aaa accounting network default start-stop group radius

radius-server dead-criteria time 5 tries 3

user-group group1
!
end