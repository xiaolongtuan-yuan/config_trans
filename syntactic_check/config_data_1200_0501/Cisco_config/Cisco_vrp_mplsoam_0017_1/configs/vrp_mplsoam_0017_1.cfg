hostname LSRB

mpls label protocol ldp

interface GigabitEthernet1/0/0
no shutdown
ip address 10.1.1.2 255.255.255.252
mpls ip
mpls traffic-eng

interface GigabitEthernet2/0/0
no shutdown
ip address 10.2.1.1 255.255.255.252
mpls ip
mpls traffic-eng

interface Loopback1
ip address 2.2.2.2 255.255.255.255

mpls traffic-eng path-option 10 explicit name Tunnel10
mpls traffic-eng path-option 20 explicit name Tunnel20
mpls traffic-eng autoroute announce

ip explicit-path name Tunnel10
next-address 10.2.1.2

ip explicit-path name Tunnel20
next-address 10.1.1.1

interface Tunnel10
ip unnumbered Loopback1
tunnel mode mpls traffic-eng
tunnel destination 10.2.1.2
tunnel mpls traffic-eng path-option 10

interface Tunnel20
ip unnumbered Loopback1
tunnel mode mpls traffic-eng
tunnel destination 10.1.1.1
tunnel mpls traffic-eng path-option 20