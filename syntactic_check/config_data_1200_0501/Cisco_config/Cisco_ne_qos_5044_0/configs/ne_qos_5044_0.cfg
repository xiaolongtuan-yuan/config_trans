interface GigabitEthernet3/0/0.1
 service-policy input qos1
 
interface GigabitEthernet3/0/0.1
 service-policy output qos1

class-map match-all qos1
 match cos 5

class-map match-all qos2
 match cos 5

policy-map qos
 class qos1
  priority percent 0
 class qos2
  bandwidth remaining percent 100

policy-map qos1
 class class-default
  set dscp default
  service-policy qos

policy-map qos2
 class class-default
  set dscp default
  service-policy qos

interface GigabitEthernet1/0/0.1
 encapsulation dot1Q 1
 ip address 10.192.168.1 255.255.255.0
 mls qos trust cos
 service-policy input qos1

interface GigabitEthernet2/0/0.1
 encapsulation dot1Q 2
 ip address 10.2.1.1 255.255.255.0
 mls qos trust cos
 service-policy input qos2

mpls ip
mpls ldp

interface GigabitEthernet3/0/0.1
 encapsulation dot1Q 11
 ip address 10.192.167.2 255.255.255.0
 mls qos trust cos
 mpls ip
 mpls ldp
 mls qos trust dei
