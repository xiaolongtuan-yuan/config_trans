hostname DeviceE

ip multicast-routing

access-list 2000 permit ip 10.110.5.0 0.0.0.255

access-list 2001 permit ip 192.168.2.0 0.0.0.255

access-list 3000 permit ip host 192.168.2.2 224.0.0.0 15.255.255.255

access-list 3001 permit ip 10.110.5.0 0.0.0.255 225.1.1.0 0.0.0.255

router isis

net 10.0000.0000.0005.00

interface GigabitEthernet1/0/0

no shutdown

ip address 192.168.3.2 255.255.255.0

ip pim sparse-mode

isis network point-to-point

interface GigabitEthernet2/0/0

no shutdown

ip address 192.168.2.2 255.255.255.0

ip pim sparse-mode

isis network point-to-point

interface GigabitEthernet3/0/0

no shutdown

ip address 192.168.9.2 255.255.255.0

ip pim sparse-mode

isis network point-to-point

interface GigabitEthernet1/0/1

no shutdown

ip address 192.168.4.1 255.255.255.0

ip pim sparse-mode

isis network point-to-point

ip pim bsr-border

ip pim bsr-candidate GigabitEthernet2/0/0

ip pim rp-candidate GigabitEthernet2/0/0

ip pim rp-address 192.168.2.2

end