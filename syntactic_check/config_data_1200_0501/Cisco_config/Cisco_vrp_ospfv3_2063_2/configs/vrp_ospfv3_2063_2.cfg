hostname DeviceC

interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:db8:1::2/64
 ipv6 ospf 1 area 0.0.0.0

interface GigabitEthernet2/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:db8:3::1/64
 ipv6 ospf 1 area 0.0.0.2

ipv6 router ospf 1
 router-id 3.3.3.3
 area 0.0.0.0
 area 0.0.0.2

end