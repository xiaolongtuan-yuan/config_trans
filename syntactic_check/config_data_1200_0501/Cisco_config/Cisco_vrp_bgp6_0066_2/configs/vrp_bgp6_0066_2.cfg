hostname DeviceC
#
interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:db8:102::1/96
#
interface GigabitEthernet2/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:db8:101::1/96
#
router bgp 200
 bgp router-id 3.3.3.3
 neighbor 2001:db8:101::2 remote-as 200
 neighbor 2001:db8:102::2 remote-as 200
 #
 address-family ipv6
  no synchronization 
  network 2001:db8:101::/96
  network 2001:db8:102::/96
  neighbor 2001:db8:101::2 activate
  neighbor 2001:db8:101::2 route-reflector-client
  neighbor 2001:db8:102::2 activate
  neighbor 2001:db8:102::2 route-reflector-client
 exit-address-family
#
end