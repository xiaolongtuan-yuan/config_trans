hostname NATA

vsm on-board-mode enable

ip nat pool address-groupa 11.1.1.1 11.1.1.10 netmask 255.255.255.0
ip nat inside source list 2464 pool address-groupa overload
ip nat inside source static udp 10.78.1.2 11.11.11.2

ip nat pool address-groupb 11.1.1.11 11.1.1.20 netmask 255.255.255.0
ip nat inside source list 2465 pool address-groupb overload
ip nat inside source static udp 10.67.1.2 11.11.11.1

access-list 2464 permit ip 10.78.1.0 0.0.0.255
access-list 2465 permit ip 10.67.1.0 0.0.0.255

interface GigabitEthernet1/0/1
 no shutdown
 ip address 10.78.1.1 255.255.255.0
 ip nat inside

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.67.1.1 255.255.255.0
 ip nat inside

end