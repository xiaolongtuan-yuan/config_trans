hostname PE2

ip vrf VPNB
 rd 200:1
 route-target export 111:1
 route-target import 111:1

mpls ldp router-id Loopback1

mpls ldp

mpls label protocol ldp

router isis
 net 10.0000.0000.0005.00
 is-type level-2-only
 metric-style wide

interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.4.1.1 255.255.255.0
 mpls ip
 mpls ldp discovery transport-address Loopback1

interface GigabitEthernet2/0/0
 no shutdown
 ip vrf forwarding VPNB
 ip address 10.11.1.1 255.255.255.0

interface Loopback1
 ip address 5.5.5.5 255.255.255.255

router bgp 100
 neighbor 1.1.1.1 remote-as 100
 neighbor 1.1.1.1 update-source Loopback1

 address-family ipv4
  network 10.4.1.0 mask 255.255.255.0
  neighbor 1.1.1.1 activate

 address-family vpnv4
  neighbor 1.1.1.1 activate

ip route vrf VPNB 0.0.0.0 0.0.0.0 10.11.1.2

end