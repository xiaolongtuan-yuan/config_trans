hostname PE4

ip vrf vpn1
 rd 100:2
 route-target export 1:1
 route-target import 1:1

interface GigabitEthernet1/0/0
 no shutdown
 vrf forwarding vpn1
 ipv6 enable
 ipv6 address 2001:db8:2::2/64

interface GigabitEthernet2/0/0
 no shutdown
 ip address 10.2.1.2 255.255.255.0
 mpls ip

interface Loopback1
 ip address 6.6.6.9 255.255.255.255

router bgp 300
 neighbor 5.5.5.9 remote-as 300
 neighbor 5.5.5.9 update-source Loopback1
 neighbor 1.1.1.9 remote-as 200
 neighbor 1.1.1.9 ebgp-multihop 10
 neighbor 1.1.1.9 update-source Loopback1

 address-family ipv4
  neighbor 5.5.5.9 activate
  neighbor 5.5.5.9 next-hop-self
  neighbor 1.1.1.9 activate

 address-family vpnv4
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-community extended

router ospf 1
 network 6.6.6.9 0.0.0.0 area 0
 network 10.2.1.0 0.0.0.255 area 0

router ospf 1 vrf vpn1
 redistribute connected subnets

return