hostname LSRC
!
mpls label protocol ldp
!
mpls ip
!
mpls ldp
 !
 address-family ipv4
 !
  remote-peer LSRA
   neighbor 1.1.1.9
 !
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 10.2.1.2 255.255.255.252
!
interface Loopback1
 ip address 3.3.3.9 255.255.255.255
!
router ospf 1
 network 3.3.3.9 0.0.0.0 area 0
 network 10.2.1.0 0.0.0.3 area 0
!
end