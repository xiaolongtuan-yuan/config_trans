   event manager applet collect_health
    event timer cron cron-entry "0 1 * * *"
    action 1.0 cli command "show version | redirect tftp://10.2.1.1/health.txt"
    action 1.1 cli command "show ip route | append tftp://10.2.1.1/health.txt"
    action 1.2 cli command "show lldp neighbors brief | append tftp://10.2.1.1/health.txt"
