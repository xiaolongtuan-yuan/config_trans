hostname PE2
#
mpls label protocol ldp
mpls ldp router-id Loopback1 force
#
mpls l2vpn
#
pseudowire-class bgp1
 encapsulation mpls
 ip local interface Loopback1
!
vfi bgp1
 vpn id 1
 route-distinguisher 192.168.10.2:1
 import route-target
  100:1
 export route-target
  100:1
!
mpls ldp
!
interface GigabitEthernet1/0/0
 no shutdown
 ip address 192.168.10.2 255.255.255.0
 mpls ip
 mpls ldp discovery hello holdtime 1000
 mpls ldp discovery targeted-hello holdtime 1000
 mpls ldp igp sync
!
interface GigabitEthernet2/0/0.1
 no shutdown
 encapsulation dot1q 10
 xconnect vfi bgp1
!
interface Loopback1
 ip address 3.3.3.9 255.255.255.255
!
router bgp 100
 bgp log-neighbor-changes
 neighbor 1.1.1.9 remote-as 100
 neighbor 1.1.1.9 update-source Loopback1
 !
 address-family l2vpn vpls
  neighbor 1.1.1.9 activate
  neighbor 1.1.1.9 send-community both
  advertise l2vpn evpn
  advertise l2vpn bridge-domain
 exit-address-family
!
router ospf 1
 network 3.3.3.9 0.0.0.0 area 0
 network 192.168.10.0 0.0.0.255 area 0
!
ethernet cfm domain ma1
 mep 2
  interface GigabitEthernet1/0/0.1
   ccm-interval 100
   ccm-enable
  mep 1
   remote-mep 2
   ccm-interval 100
   ccm-enable
!
end