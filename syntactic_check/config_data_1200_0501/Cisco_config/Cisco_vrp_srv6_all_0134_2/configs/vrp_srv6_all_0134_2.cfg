hostname P

ipv6 unicast-routing

interface GigabitEthernet1/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8:10::2/64
 ipv6 ospf 1 area 0

interface GigabitEthernet2/0/0
 no shutdown
 ipv6 enable
 ipv6 address 2001:DB8:20::1/64
 ipv6 ospf 1 area 0

interface Loopback1
 ipv6 enable
 ip address 2.2.2.2 255.255.255.255
 ipv6 address 2001:DB8:2::2/128
 ipv6 ospf 1 area 0

router ospf 1
 router-id 2.2.2.2
 network 2001:DB8:10::/64 area 0
 network 2001:DB8:20::/64 area 0

