set system host-name SPE

set protocols mpls interface all
set protocols ldp interface all
set protocols ldp router-id 1.1.1.1

set routing-instances vsi1 instance-type vpls
set routing-instances vsi1 interface ge-0/0/0.0
set routing-instances vsi1 VPLS vpls-id 2
set routing-instances vsi1 protocols vpls encapsulation-type mpls
set routing-instances vsi1 protocols vpls neighbor 1.1.1.1 pw-id 1
set routing-instances vsi1 protocols vpls neighbor 1.1.1.1 control-word
set routing-instances vsi1 protocols vpls neighbor 1.1.1.1 pseudowire-class bgp
set routing-instances vsi1 protocols vpls neighbor 1.1.1.1 router-id 1.1.1.1