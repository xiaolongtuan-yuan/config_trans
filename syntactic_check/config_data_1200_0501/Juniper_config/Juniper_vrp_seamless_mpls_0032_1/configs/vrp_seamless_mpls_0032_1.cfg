set system host-name AGG

set protocols ldp interface all

set protocols isis level 1
set protocols isis interface all
set protocols isis level 1 wide-metrics-only
set protocols isis ignore-attached-bit
set protocols isis level 1 authentication-key ""

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.2/24
set interfaces ge-0/0/0 unit 0 family mpls
set protocols ldp interface ge-0/0/0.0

set interfaces ge-0/0/1 unit 0 family inet address 10.2.1.1/24
set interfaces ge-0/0/1 unit 0 family iso
set interfaces ge-0/0/1 unit 0 family mpls
set protocols isis interface ge-0/0/1.0
set protocols ldp interface ge-0/0/1.0
set protocols isis interface ge-0/0/1.0 level 1 interface-type point-to-point

set interfaces lo0 unit 0 family inet address 2.2.2.2/32
set protocols isis interface lo0.0

set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 2.2.2.2
set protocols bgp group ibgp neighbor 1.1.1.1 peer-as 100
set protocols bgp group ibgp neighbor 1.1.1.1 next-hop self
set protocols bgp group ibgp neighbor 1.1.1.1 route-reflector-client
set protocols bgp group ibgp neighbor 1.1.1.1 family inet unicast
set protocols bgp group ibgp neighbor 1.1.1.1 family inet-vpn unicast
set protocols bgp group ibgp neighbor 3.3.3.3 peer-as 100
set protocols bgp group ibgp neighbor 3.3.3.3 next-hop self
set protocols bgp group ibgp neighbor 3.3.3.3 route-reflector-client
set protocols bgp group ibgp neighbor 3.3.3.3 family inet unicast
set protocols bgp group ibgp neighbor 3.3.3.3 family inet-vpn unicast

set protocols ospf area 0 interface lo0.0 passive
set protocols ospf area 0 interface ge-0/0/0.0
set protocols ospf area 0 interface ge-0/0/1.0

set policy-options policy-statement policy1 term 1 from protocol mpls
set policy-options policy-statement policy1 term 1 then accept