set system host-name ASBR2

set interfaces ge-1/0/2 unit 0 family inet address 10.1.3.2/24
set interfaces ge-1/0/2 unit 0 family mpls
set interfaces ge-1/0/2 unit 0 mpls ldp interface
set interfaces ge-1/0/2 unit 0 no-traps

set interfaces ge-1/0/1 unit 0 family inet address 10.1.4.1/24
set interfaces ge-1/0/1 unit 0 family mpls
set interfaces ge-1/0/1 unit 0 mpls ldp interface
set interfaces ge-1/0/1 unit 0 no-traps

set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols isis level 2
set protocols isis level 2 wide-metrics-only
set protocols isis level 2 interface ge-1/0/1
set protocols isis level 2 interface lo0
set protocols isis network 10.0000.0000.000d.00

set protocols ldp router-id lo0.0

set protocols bgp group external-peers type external
set protocols bgp group external-peers neighbor 10.1.3.1 peer-as 100
set protocols bgp group internal-peers type internal
set protocols bgp group internal-peers neighbor 4.4.4.4 peer-as 200
set protocols bgp group internal-peers neighbor 4.4.4.4 local-address 3.3.3.3
set protocols bgp group external-peers family inet unicast
set protocols bgp group internal-peers family inet unicast
set protocols bgp group external-peers export policy1
set protocols bgp group internal-peers export policy2

set policy-options policy-statement policy1 term 1 then next-hop self
set policy-options policy-statement policy1 then as-path-prepend 200
set policy-options policy-statement policy2 term 1 then next-hop self
set policy-options policy-statement policy2 then as-path-prepend 200

set routing-options static route 2.2.2.2/32 next-hop 10.1.3.1