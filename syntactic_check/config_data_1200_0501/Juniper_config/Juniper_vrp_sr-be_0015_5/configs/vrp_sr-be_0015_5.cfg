set system host-name CE2

set interfaces ge-1/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces lo0 unit 1 family inet address 10.22.2.2/32

set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 100
set protocols bgp group external-peers neighbor 10.2.1.2
set protocols bgp group external-peers family inet unicast
set protocols bgp group external-peers neighbor 10.2.1.2 family inet unicast

set policy-options policy-statement advertise-lo0 term 1 from route-filter 10.22.2.2/32 exact
set policy-options policy-statement advertise-lo0 term 1 then accept

set protocols bgp group external-peers export advertise-lo0