set system host-name ASBR2

set protocols mpls interface all
set protocols ldp interface all
set protocols ldp road-id 3.3.3.9

set protocols isis interface all
set protocols isis level 2
set protocols isis level 2-wide-metrics-only
set protocols isis level 2 metric 1
set protocols isis interface ge-1/0/0 level 2 point-to-point
set protocols isis interface ge-2/0/0 level 2 point-to-point
set protocols isis area-id 49.1111.1111.1111.0000.00

set interfaces ge-1/0/0 unit 0 family inet address 10.3.1.2/24
set protocols mpls interface ge-1/0/0
set protocols ldp interface ge-1/0/0

set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.2/24
set protocols mpls interface ge-2/0/0

set interfaces lo0 unit 1 family inet address 3.3.3.9/32

set protocols bgp group internal type internal
set protocols bgp group internal local-address 3.3.3.9
set protocols bgp group internal neighbor 4.4.4.9 peer-as 200

set protocols bgp group external type external
set protocols bgp group external local-address 3.3.3.9
set protocols bgp group external neighbor 10.2.1.1 peer-as 100

set protocols bgp group internal family inet unicast
set protocols bgp group internal family inet unicast network 3.3.3.9/32
set protocols bgp group internal family l2vpn evpn
set protocols bgp group external family l2vpn evpn

set routing-instances EVPN instance-type vrf
set routing-instances EVPN interface ge-1/0/0.0
set routing-instances EVPN interface ge-2/0/0.0
set routing-instances EVPN interface lo0.1