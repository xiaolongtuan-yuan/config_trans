set system host-name DeviceA

set protocols isis level 2 disable
set protocols isis level 1 disable
set protocols isis interface ge-2/0/0 point-to-point
set protocols isis level 2 wide-metrics-only
set protocols isis level 2 metric 10
set protocols isis level 2 hello-interval 10
set protocols isis level 2 hello-multiplier 3
set protocols isis lsp-lifetime 1200
set protocols isis lsp-interval 30
set protocols isis level 2 reference-bandwidth 100g

set interfaces ge-2/0/0 unit 0 family inet address 172.17.1.1/24
set interfaces ge-2/0/0 unit 0 family iso

set interfaces ge-2/0/0 unit 0 family iso address 49.0000.0000.0000.0001.00

set protocols isis level 2-only