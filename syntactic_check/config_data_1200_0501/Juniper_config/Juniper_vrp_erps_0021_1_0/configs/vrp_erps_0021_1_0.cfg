set system host-name PE1
set vlans vlan10 vlan-id 10
set vlans vlan100 vlan-id 100
set protocols rstp vlan vlan10 priority 4
set protocols rstp vlan vlan100 priority 4
set protocols erps ring 1 control-vlan vlan100
set protocols erps ring 1 version v2
set protocols erps ring 1 sub-ring
set protocols mpls interface all
set interfaces ge-x/x/x unit 10 family ethernet-switching port-mode trunk
set interfaces ge-x/x/x unit 10 family ethernet-switching vlan members vlan10
set interfaces ge-1/0/0 flexible-vlan-tagging
set interfaces ge-1/0/0 encapsulation flexible-ethernet-services
set interfaces ge-1/0/0 unit 0 family ethernet-switching port-mode trunk
set interfaces ge-1/0/0 unit 0 family ethernet-switching vlan members [vlan10 vlan100]
set protocols rstp interface ge-1/0/0 bpdu-filter on
set interfaces ge-2/0/0 unit 0 family inet address 10.1.1.1/24
set protocols mpls interface ge-2/0/0
set interfaces ge-3/0/0 unit 0 family inet address 10.3.1.1/24
set protocols mpls interface ge-3/0/0
set interfaces lo0 unit 1 family inet address 1.1.1.1/32
set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-2/0/0.0
set protocols ospf area 0 interface ge-3/0/0.0