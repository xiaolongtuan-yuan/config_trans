set system host-name LSRC

set protocols ldp ldp-id 3.3.3.3
set protocols ldp interface all
set protocols mpls
set protocols mpls interface all

set protocols mldp p2mp ipv4 lsp lsp1 root 1.1.1.1 lsp-id 1

set protocols isis level 1-2 enable
set protocols isis interface lo0.1
set protocols isis interface ge-0/0/2.0
set protocols isis net 49.0005.0000.0000.0003.00

set interfaces ge-0/0/2 unit 0 family inet address 10.3.1.2/24
set interfaces ge-0/0/2 unit 0 family iso

set interfaces lo0 unit 1 family inet address 3.3.3.3/32
set interfaces lo0 unit 1 family iso