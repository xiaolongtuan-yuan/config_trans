set system host-name Hub

# 配置接口ge-1/0/0（相当于GigabitEthernet1/0/0）
set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.10/24

# 配置接口lo0（相当于Loopback0）
set interfaces lo0 unit 0 family inet address 192.168.0.1/32

# 配置GRE隧道接口
set interfaces gr-1/0/0 unit 0 family inet address 172.16.1.1/24
set interfaces gr-1/0/0 unit 0 tunnel source 10.1.1.10
set interfaces gr-1/0/0 unit 0 tunnel destination <destination IP address>

# 配置IPSec保护，假设您需要配置IPSec隧道保护
set security ike policy <IKE-policy-name> mode main
set security ike policy <IKE-policy-name> proposal-set basic
set security ike gateway <IKE-gateway-name> address <destination IP address>
set security ike gateway <IKE-gateway-name> ike-policy <IKE-policy-name>
set security ipsec policy <IPsec-policy-name> proposal-set basic
set security ipsec vpn <IPsec-vpn-name> bind-interface gr-1/0/0.0
set security ipsec vpn <IPsec-vpn-name> ike gateway <IKE-gateway-name>
set security ipsec vpn <IPsec-vpn-name> ike ipsec-policy <IPsec-policy-name>
set security ipsec vpn <IPsec-vpn-name> establish-tunnels immediately

# 配置OSPF协议
set routing-options router-id 172.16.1.1

# OSPF 区域 0 配置（假定用于骨干区域）
set protocols ospf area 0.0.0.0 interface gr-1/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0

# OSPF 区域 1 配置
set protocols ospf area 1 interface ge-1/0/0.0
