set system host-name DeviceA

set interfaces ge-1/0/0 unit 0 family inet6 address 2001:db8:1::1/64

set interfaces ge-2/0/0 unit 0 family inet6 address 2001:db8:100::1/96

set protocols bgp group external-peers type external
set protocols bgp group external-peers local-address 1.1.1.1
set protocols bgp group external-peers family inet6 unicast
set protocols bgp group external-peers peer-as 200
set protocols bgp group external-peers neighbor 2001:db8:100::2
set protocols bgp group external-peers neighbor 2001:db8:100::2 family inet6 unicast
set protocols bgp group external-peers export ipv6-prefixes

set policy-options policy-statement ipv6-prefixes term 1 from route-filter 2001:db8:1::/64 exact
set policy-options policy-statement ipv6-prefixes then accept