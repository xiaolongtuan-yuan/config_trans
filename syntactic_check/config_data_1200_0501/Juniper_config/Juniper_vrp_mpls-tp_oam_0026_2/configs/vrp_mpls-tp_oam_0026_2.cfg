# 设置设备名称
set system host-name LSRC

# MPLS配置
set protocols mpls interface all
set protocols ldp

# 配置接口GigabitEthernet1/0/0
set interfaces ge-1/0/0 unit 0 family inet address 3.2.1.2/24
set interfaces ge-1/0/0 unit 0 mpls-signaling
set interfaces ge-1/0/0 unit 0 family mpls

# 配置Loopback接口
set interfaces lo0 unit 1 family inet address 3.3.3.3/32

# 配置MPLS TE隧道
set protocols mpls labeled-unicast ipv4 lsp lsr-id 3.3.3.3
set protocols mpls interface all
set protocols mpls label-switched-path lsp1 to 1.1.1.1
set protocols mpls label-switched-path lsp1 install 
set protocols mpls label-switched-path lsp1 record
set protocols mpls label-switched-path lsp1 link-protection

# 静态路由配置
set routing-options static route 1.1.1.1/32 next-hop 3.2.1.1
set routing-options static route 2.2.2.2/32 next-hop 3.2.1.1

# MPLS Traffic Engineering配置
set protocols mpls traffic-engineering administrative-weight 100

# MPLS T-E Automatic Bandwidth调整（假设基于描述）
set protocols mpls label-switched-path lsp1 automatic-bandwidth adjust-interval 60
set protocols mpls label-switched-path lsp1 automatic-bandwidth adjust-threshold 10