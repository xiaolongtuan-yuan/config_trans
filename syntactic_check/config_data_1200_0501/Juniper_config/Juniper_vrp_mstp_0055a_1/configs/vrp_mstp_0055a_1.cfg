set system host-name PE2

set protocols rstp interface all
set protocols rstp bpdu-block-on-edge
set protocols spanning-tree mstp configuration-name mstp
set protocols spanning-tree bpdu-block-on-edge

set bridge-domains 10 domain-type bridge
set bridge-domains 10 vxlan vlan-id 10

set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/1 unit 0 family ethernet-switching port-mode access
deactivate protocols rstp interface ge-0/0/1

set interfaces ge-0/0/2 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/2 unit 0 family ethernet-switching port-mode access
set protocols rstp interface ge-0/0/2 edge

set interfaces ge-0/0/2 unit 1 family ethernet-switching vlan members [ 1-20 ]
set bridge-domains 10 interface ge-0/0/2.1

set interfaces ge-0/0/3 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/3 unit 0 family ethernet-switching port-mode access

set interfaces ge-0/0/3 unit 1 family ethernet-switching vlan members [ 1-20 ]
set bridge-domains 10 interface ge-0/0/3.1