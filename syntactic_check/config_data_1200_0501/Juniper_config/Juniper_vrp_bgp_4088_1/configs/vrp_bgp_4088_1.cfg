set system host-name DeviceB
set interfaces ge-1/0/0 unit 0 family inet address 10.1.3.1/24
set interfaces ge-2/0/0 unit 0 family inet address 10.1.2.2/24

set routing-options autonomous-system 20
set protocols bgp group bgp-peers type external
set protocols bgp group bgp-peers local-address 2.2.2.2
set protocols bgp group bgp-peers neighbor 10.1.2.1 peer-as 10
set protocols bgp group bgp-peers neighbor 10.1.3.2 peer-as 30
set protocols bgp group bgp-peers neighbor 10.1.2.1 family inet unicast
set protocols bgp group bgp-peers neighbor 10.1.3.2 family inet unicast
set policy-options policy-statement export-route term 1 from route-filter 10.1.3.0/24 exact
set policy-options policy-statement export-route term 1 then accept
set policy-options policy-statement export-route term 2 from route-filter 10.1.2.0/24 exact
set policy-options policy-statement export-route term 2 then accept
set policy-options policy-statement export-route term 3 then reject
set protocols bgp group bgp-peers export export-route

set policy-options as-path as-path-1 "^.*_30_.*$"
set policy-options as-path as-path-2 "^.*_10_.*$"
set policy-options policy-statement filter-1 term deny-term from as-path as-path-1
set policy-options policy-statement filter-1 term deny-term then reject
set policy-options policy-statement filter-1 term permit-term then accept
set policy-options policy-statement filter-2 term deny-term from as-path as-path-2
set policy-options policy-statement filter-2 term deny-term then reject
set policy-options policy-statement filter-2 term permit-term then accept

set protocols bgp group bgp-peers neighbor 10.1.2.1 export filter-1
set protocols bgp group bgp-peers neighbor 10.1.3.2 export filter-2