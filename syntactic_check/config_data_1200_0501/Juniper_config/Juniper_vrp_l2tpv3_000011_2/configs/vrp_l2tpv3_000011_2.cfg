set system host-name PE2

set protocols isis level 2 disable
set protocols isis interface all
set protocols isis level 2 wide-metrics-only
set protocols isis level 2 l2-only

set routing-options rib inet6.0 auto-export export-rib inet.0

set interfaces lo0 unit 4 family inet6 address 2001:db08:4::1/128
set protocols isis interface lo0.4

set interfaces ge-2/0/1 unit 0 family inet6 address 2001:db08:3::1/64
set protocols isis interface ge-2/0/1.0

set interfaces gr-0/0/0 unit 0 tunnel source 2001:db08:4::1
set interfaces gr-0/0/0 unit 0 tunnel destination 2001:db08:1::1
set interfaces gr-0/0/0 unit 0 family inet6 address 2001:db08:1::1/128
set interfaces gr-0/0/0 unit 0 ipsec-profile PROFILE_NAME

set interfaces ge-1/0/1 unit 4 encapsulation flexible-vlan-tagging
set interfaces ge-1/0/1 unit 4 vlan-tags outer 2 inner 2
set interfaces ge-1/0/1 unit 4 family l2tpv3 l2tp-class PW_NAME

set protocols l2circuit l2tp-signaling l2tp-class PW_NAME
set protocols l2circuit l2tp-class PW_NAME authentication password PASSWORD
set protocols l2circuit l2tp-class PW_NAME ipsec profile PROFILE_NAME

set security ike proposal ike-prop-1 authentication-method pre-shared-keys
set security ike proposal ike-prop-1 dh-group group14
set security ike proposal ike-prop-1 encryption-algorithm aes-256-cbc
set security ike proposal ike-prop-1 lifetime-seconds 3600

set security ike policy ike-policy-1 mode main
set security ike policy ike-policy-1 proposals ike-prop-1
set security ike policy ike-policy-1 pre-shared-key ascii-text "PRE_SHARED_KEY"

set security ike gateway ike-gw-1 address 0.0.0.0/0
set security ike gateway ike-gw-1 ike-policy ike-policy-1

set security ipsec vpn vpn-p2p-vpn bind-interface gr-0/0/0.0
set security ipsec vpn vpn-p2p-vpn ike gateway ike-gw-1
set security ipsec vpn vpn-p2p-vpn ipsec-policy ipsec-policy-1
set security ipsec policy ipsec-policy-1 proposal-set esp-aes256-sha1