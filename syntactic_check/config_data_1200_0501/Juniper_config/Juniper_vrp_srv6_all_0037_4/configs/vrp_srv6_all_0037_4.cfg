set system host-name DeviceB

set interfaces ge-1/0/0 unit 0 family inet6 address 2001:DB8:22::1/64
set interfaces ge-1/0/0 unit 0 family inet6 address 2001:DB8:22::1/64 preferred
set interfaces ge-1/0/0 disable false

set protocols bgp group bgp-v6 neighbor 2001:DB8:22::2 peer-as 100
set protocols bgp group bgp-v6 type external
set protocols bgp group bgp-v6 family inet6 unicast
set protocols bgp group bgp-v6 neighbor 2001:DB8:22::2 active
set protocols bgp local-as 300
set protocols bgp routing-options router-id 5.5.5.5
set protocols bgp global-options no-synchronization