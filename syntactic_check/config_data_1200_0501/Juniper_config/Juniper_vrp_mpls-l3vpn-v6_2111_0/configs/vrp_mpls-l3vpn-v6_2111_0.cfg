set system host-name CE3
set interfaces ge-1/0/0 disable
set interfaces ge-1/0/0 family inet6 address 2001:db8:1::1/64
set routing-options rib inet6.0 static route ::/0 next-hop <next-hop-address>
set protocols bgp group external type external
set protocols bgp group external local-address 2001:db8:1::1
set protocols bgp group external family inet6 unicast
set protocols bgp group external neighbor 2001:db8:1::2 peer-as 200
set protocols bgp group external neighbor 2001:db8:1::2 family inet6 unicast
set protocols bgp group external export redistribute-connected
set policy-options policy-statement redistribute-connected from protocol direct
set policy-options policy-statement redistribute-connected then accept
set protocols bgp local-as 65410
set protocols bgp router-id 10.10.10.10