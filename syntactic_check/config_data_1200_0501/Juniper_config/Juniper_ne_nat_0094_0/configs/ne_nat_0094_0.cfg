set system host-name BRAS

set interfaces ge-2/0/0 unit 1 vlan-id 1
set interfaces ge-2/0/0 unit 1 family inet address 10.10.10.1/24
set security zones security-zone trust interfaces ge-2/0/0.1 host-inbound-traffic system-services dhcp
set forwarding-options dhcp-relay server-group pool1 192.168.7.252
set forwarding-options dhcp-relay active-server-group pool1
set forwarding-options dhcp-relay group pool1 interface ge-2/0/0.1

set security nat source pool pool1 address 11.11.11.101 to 11.11.11.105
set security nat source rule-set rs1 from zone trust
set security nat source rule-set rs1 to zone trust
set security nat source rule-set rs1 rule r1 match source-address 10.10.10.0/24
set security nat source rule-set rs1 rule r1 then source-nat pool pool1

set firewall family inet filter ACL-3001 term 1 from source-address 10.10.10.0/24
set firewall family inet filter ACL-3001 term 1 then accept

set system authentication-order [radius password]
set access profile radius-profile authentication-order radius
set access profile radius-profile radius-server 192.168.7.252 secret <shared secret>
set access profile radius-profile radius-server 192.168.7.252 port 1812
set access profile radius-profile accounting order radius

set protocols dot1x authenticator authenticator-interface ge-2/0/0.1 mac-radius
set protocols dot1x authenticator authenticator-interface ge-2/0/0.1 supplicant 