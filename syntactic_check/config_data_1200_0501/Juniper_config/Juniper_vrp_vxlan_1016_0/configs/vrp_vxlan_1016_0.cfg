set system host-name Device1

# Bridge Domain Configuration
set bridge-domains bd-10 vxlan vni 5010

# Interface Configuration
set interfaces ge-0/0/1 unit 0 family inet address 192.168.1.1/24

set interfaces ge-0/0/2 unit 0

# Subinterface Configuration
set interfaces ge-0/0/2 unit 1 encapsulation vlan-bridge
set interfaces ge-0/0/2 unit 1 vlan-id 10
set bridge-domains bd-10 interface ge-0/0/2.1

# Loopback Interface Configuration
set interfaces lo0 unit 1 family inet address 2.2.2.2/32

# NVE Interface Configuration
set interfaces lt-0/0/0 unit 1 encapsulation vxlan
set interfaces lt-0/0/0 unit 1 vxlan local-tunnel-endpoint lo0.1
set interfaces lt-0/0/0 unit 1 vxlan vni 5010 group 239.1.1.1

# OSPF Configuration
set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0