# 设置主机名
set system host-name ASBR2

# 启用MPLS并使用LDP
set protocols mpls interface all
set protocols ldp interface all

# 配置接口GigabitEthernet1/0/0
set interfaces ge-1/0/0 unit 0 family inet address 10.40.1.1/24
set protocols mpls interface ge-1/0/0

# 配置接口GigabitEthernet2/0/0
set interfaces ge-2/0/0 unit 0 family inet address 10.21.1.2/24
set protocols mpls interface ge-2/0/0

# 配置Loopback接口
set interfaces lo0 unit 1 family inet address 3.3.3.9/32

# 配置BGP
set protocols bgp group GROUP_200 type internal
set protocols bgp group GROUP_200 local-address 3.3.3.9
set protocols bgp group GROUP_200 neighbor 4.4.4.9 peer-as 200
set protocols bgp group GROUP_200 neighbor 4.4.4.9 family inet unicast
set protocols bgp group GROUP_200 neighbor 4.4.4.9 export policy2
set protocols bgp group GROUP_200 neighbor 4.4.4.9 send-label

set protocols bgp group GROUP_100 peer-as 100
set protocols bgp group GROUP_100 neighbor 10.21.1.1 family inet unicast
set protocols bgp group GROUP_100 neighbor 10.21.1.1 export policy1
set protocols bgp group GROUP_100 neighbor 10.21.1.1 send-label

set policy-options policy-statement policy1 term 1 then accept
set policy-options policy-statement policy2 term 1 then accept

# 配置OSPF
set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0

# 测试，忽略以下配置maps，因为Juniper不直接支持设置MPLS标签的策略
set policy-options policy-statement policy1 then next-hop self
set policy-options policy-statement policy2 then next-hop self