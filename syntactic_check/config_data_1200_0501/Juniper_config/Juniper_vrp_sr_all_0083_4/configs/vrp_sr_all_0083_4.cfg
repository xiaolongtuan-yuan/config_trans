set system host-name Controller

set interfaces ge-1/0/0 unit 0 family inet address 10.3.1.2/24
set interfaces ge-2/0/0 unit 0 family inet address 10.4.1.2/24

set protocols bgp group external type external
set protocols bgp group external local-address 10.3.1.2
set protocols bgp group external peer-as 100
set protocols bgp group external neighbor 10.3.1.1
set protocols bgp group external neighbor 10.4.1.1

set protocols bgp group external family inet unicast
set protocols bgp group external family inet link-state
set protocols bgp group external family inet-vpn