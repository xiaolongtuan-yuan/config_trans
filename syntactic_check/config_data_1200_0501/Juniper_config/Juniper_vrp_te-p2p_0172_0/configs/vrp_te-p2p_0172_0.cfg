set system host-name LSRA
set protocols ldp transport-address interface lo0.0
set protocols ldp session-protection
set protocols mpls interface all

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces ge-1/0/1 unit 0 family inet address 10.1.2.1/24
set interfaces ge-1/0/1 unit 0 family mpls

set interfaces lo0 unit 0 family inet address 1.1.1.1/32

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/0
set protocols ospf area 0.0.0.0 interface ge-1/0/1

set protocols mpls label-switched-path LSP1 from 10.1.1.1
set protocols mpls label-switched-path LSP1 to 6.6.6.6
set protocols mpls label-switched-path LSP1 bandwidth 1000m
set protocols mpls label-switched-path LSP1 record
set protocols mpls label-switched-path LSP1 fast-reroute

set protocols mpls label-switched-path Tunnel1 from 1.1.1.1
set protocols mpls label-switched-path Tunnel1 to 6.6.6.6
set protocols mpls label-switched-path Tunnel1 primary LSP1
set protocols mpls label-switched-path Tunnel1 bandwidth 1000m
set protocols mpls label-switched-path Tunnel1 fast-reroute