set system host-name PE1

set routing-instances vpn1 instance-type vrf
set routing-instances vpn1 route-distinguisher 100:1
set routing-instances vpn1 vrf-target target:1:1

set protocols ldp interface all

set interfaces ge-1/0/0 unit 0 family inet address 10.10.1.2/24
set interfaces ge-1/0/0 unit 0 family mpls
set protocols ldp interface ge-1/0/0.0

set interfaces ge-2/0/0 unit 0 family inet6 address 2001:db8:1::2/64
set routing-instances vpn1 interface ge-2/0/0.0

set interfaces lo0 unit 1 family inet address 1.1.1.9/32

set protocols bgp group external type external
set protocols bgp group external local-address 1.1.1.9
set protocols bgp group external neighbor 2.2.2.9 peer-as 100
set protocols bgp group external family inet unicast
set protocols bgp group external family vpnv4 unicast
set protocols bgp group external family vpnv6 unicast

set protocols bgp group vpn-family family inet-vpn unicast
set protocols bgp group vpn-family export policy-vpn1-export
set routing-instances vpn1 protocols bgp group vpn1-family family inet unicast
set routing-instances vpn1 protocols bgp group vpn1-family export policy-vpn1

set protocols ospf area 0 interface all
set protocols ospf area 0 interface ge-1/0/0.0
set protocols ospf area 0 interface lo0.1