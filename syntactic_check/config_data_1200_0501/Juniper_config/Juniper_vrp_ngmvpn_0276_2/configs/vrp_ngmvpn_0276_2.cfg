set system host-name ABR

set interfaces lo0 unit 0 family inet address 1.1.1.2/32

set protocols ldp track-igp-metric
set protocols ldp interface all

set interfaces ge-1/0/2 unit 0 family inet address 10.0.7.5/24
set interfaces ge-1/0/2 unit 0 family mpls
set protocols mpls interface ge-1/0/2
set protocols ldp interface ge-1/0/2
set protocols ldp interface ge-1/0/2 ldp-sync

set interfaces ge-1/0/3 unit 0 family inet address 10.0.11.5/24
set interfaces ge-1/0/3 unit 0 family mpls
set protocols mpls interface ge-1/0/3
set protocols ldp interface ge-1/0/3
set protocols ldp interface ge-1/0/3 ldp-sync

set protocols isis level 2 disable
set protocols isis interface all
set protocols isis metric-style wide
set protocols isis level 2 wide-metric-only
set protocols isis lo0 level 2 passive

set routing-options rib inet.0 static route 1.1.1.1/32 discard

set protocols bgp group internal type internal
set protocols bgp group internal local-address 1.1.1.2
set protocols bgp group internal family inet-vpn unicast
set protocols bgp group internal family inet label-switched-path
set protocols bgp group internal export policy1
set protocols bgp group internal peer-as 1
set protocols bgp group internal neighbor 1.1.1.1
set protocols bgp group internal neighbor 1.1.1.3

set policy-options policy-statement policy1 term 1 then set-label

set protocols ospf area 0 interface ge-1/0/3
set protocols ospf area 0 interface lo0 passive
set protocols ospf router-id 1.1.1.2