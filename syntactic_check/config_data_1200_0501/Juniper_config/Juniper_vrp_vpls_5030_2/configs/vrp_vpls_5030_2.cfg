set system host-name PE1

set protocols mpls label-switched-path egress-protection-use-lsp-target-label-protocol ldp

set protocols l2circuit pw-class ldp-vsi-class
set protocols l2circuit remote-interface-switch vpws-2 virtual-circuit-id 2 neighbor 3.3.3.9

set protocols ldp interface lo0.0 passive

set interfaces ge-1/0/0.0 unit 0 family ethernet-switching vlan 10
set interfaces ge-1/0/0.0 unit 0 encapsulation vlan-ccc
set interfaces ge-1/0/0.0 unit 0 peer-unit 1
set interfaces ge-1/0/0.0 unit 0 family ccc

set interfaces ge-2/0/0.0 unit 0 family inet address 10.10.1.1/24
set interfaces ge-2/0/0.0 unit 0 family mpls
set protocols ldp interface ge-2/0/0.0

set interfaces lo0 unit 1 family inet address 1.1.1.9/32

set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0