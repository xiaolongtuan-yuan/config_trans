set system host-name DeviceC

set interfaces ge-1/0/1 unit 0 family inet address 10.1.2.2/24
set interfaces lo0 unit 0 family inet address 3.3.3.3/32

set protocols bgp group external type external
set protocols bgp group external local-address 3.3.3.3
set protocols bgp group external family inet unicast
set protocols bgp group external peer-as 100
set protocols bgp group external neighbor 1.1.1.1
set protocols bgp group external export static

set protocols ospf area 0 interface lo0.0
set protocols ospf area 0 interface ge-1/0/1.0

set routing-options static route 10.20.1.0/24 discard