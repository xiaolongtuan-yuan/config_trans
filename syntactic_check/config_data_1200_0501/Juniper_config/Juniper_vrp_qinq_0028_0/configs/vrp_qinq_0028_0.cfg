set system host-name PE1

set interfaces ge-1/0/1 unit 0 family ethernet-switching port-mode trunk

set interfaces ge-1/0/1 unit 10 vlan-id 10
set interfaces ge-1/0/1 unit 10 family inet address 10.1.1.1/24
set interfaces ge-1/0/1 unit 10 family ethernet-switching interface-mode trunk

set interfaces ge-1/0/1 unit 1 vlan-id 10
set interfaces ge-1/0/1 unit 1 family inet address 10.1.1.1/24

set interfaces ge-1/0/2 unit 0 family ethernet-switching port-mode trunk
set interfaces ge-1/0/2 unit 0 family inet address 192.168.2.1/24

set interfaces ge-1/0/1 unit 1 family inet address 10.1.1.1/24
set interfaces ge-1/0/1 unit 1 family inet {
    address 10.1.1.111/24 vrrp-group 1 virtual-address 10.1.1.111
    address 10.1.1.111/24 vrrp-group 1 priority 120
    address 10.1.1.111/24 vrrp-group 1 preempt hold-time 20
}

set protocols ospf area 0.0.0.0 interface ge-1/0/1.10
set protocols ospf area 0.0.0.0 interface ge-1/0/2.0