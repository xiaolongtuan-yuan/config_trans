set system host-name LSRC

# MPLS LDP配置
set protocols ldp router-id 3.3.3.9

# MPLS标签分配协议配置
set protocols mpls label-protocol ldp

# 接口GigabitEthernet1/0/1配置
set interfaces ge-1/0/1 unit 0 family inet address 10.1.2.2/24
set protocols mpls interface ge-1/0/1
set interfaces ge-1/0/1 unit 0 mpls traffic-engineering

# 接口GigabitEthernet1/0/2配置
set interfaces ge-1/0/2 unit 0 family inet address 10.1.3.2/24
set protocols mpls interface ge-1/0/2
set interfaces ge-1/0/2 unit 0 mpls traffic-engineering

# 配置Loopback0接口
set interfaces lo0 unit 0 family inet address 3.3.3.9/32

# 静态路由配置
set routing-options static route 1.1.1.9/32 next-hop-interface name tnp0
set routing-options static route 2.2.2.9/32 next-hop-interface name tnp1

# Tunnel1配置
set interfaces tnp0 unit 0 tunnel source lo0.0
set interfaces tnp0 unit 0 tunnel destination 1.1.1.9
set interfaces tnp0 unit 0 family mpls traffic-engineering
set protocols mpls traffic-engineering tunnel tnp0 bandwidth 1000
set protocols mpls traffic-engineering fast-reroute

# Tunnel2配置
set interfaces tnp1 unit 0 tunnel source lo0.0
set interfaces tnp1 unit 0 tunnel destination 2.2.2.9
set interfaces tnp1 unit 0 family mpls traffic-engineering
set protocols mpls traffic-engineering tunnel tnp1 bandwidth 1000
set protocols mpls traffic-engineering fast-reroute

# MPLS Traffic Engineering配置
set protocols mpls traffic-engineering router-id lo0.0
set protocols isis traffic-engineering
set protocols isis interface ge-1/0/1
set protocols isis interface ge-1/0/2
set protocols isis level 2 wide-metrics-only

# IS-IS Router配置
set protocols isis level 2
set protocols isis level 2 traffic-engineering
set protocols isis area 49.0000.0000.0000.0003.00