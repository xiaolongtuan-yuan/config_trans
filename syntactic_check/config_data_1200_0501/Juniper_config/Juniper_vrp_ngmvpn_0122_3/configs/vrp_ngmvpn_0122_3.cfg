# 设置主机名
set system host-name CE2

# 启用路由
set routing-options static route 0.0.0.0/0 discard

# 配置VLAN 10
set vlans vlan-10 vlan-id 10

# 配置VLAN接口
set interfaces irb unit 10 family inet address 10.1.3.2/24
set vlans vlan-10 l3-interface irb.10

# 配置GigabitEthernet1/0/0接口为trunk模式并允许VLAN 10
set interfaces ge-0/0/0 unit 0 family ethernet-switching port-mode trunk
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members vlan-10
set interfaces ge-0/0/0 unit 0 disable

# 配置GigabitEthernet2/0/0接口为access模式并将VLAN 10分配到接口
set interfaces ge-0/0/1 unit 0 family ethernet-switching port-mode access
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members vlan-10
set interfaces ge-0/0/1 unit 0 disable

# 配置OSPF
set protocols ospf area 0.0.0.0 interface irb.10
set protocols ospf area 0.0.0.0 interface irb.10 passive