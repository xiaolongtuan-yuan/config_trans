set system host-name PE3

set routing-instances vpna instance-type vrf
set routing-instances vpna route-distinguisher 100:3
set routing-instances vpna vrf-target target:111:1
set routing-instances vpna vrf-target import target:111:1

set protocols ldp

set interfaces ge-0/0/0 unit 0 family inet address 172.16.3.2/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces ge-0/0/1 unit 0 family inet address 10.3.1.2/24
set routing-instances vpna interface ge-0/0/1.0

set interfaces lo0 unit 1 family inet address 3.3.3.3/32

set protocols bgp group external type external
set protocols bgp group external neighbor 1.1.1.1 peer-as 100
set protocols bgp group external neighbor 1.1.1.1 local-address 3.3.3.3
set protocols bgp group external neighbor 5.5.5.5 peer-as 100
set protocols bgp group external neighbor 5.5.5.5 local-address 3.3.3.3

set protocols bgp group external family inet unicast
set protocols bgp group external family inet-vpn unicast
set protocols bgp group external export send-community

set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-0/0/0.0