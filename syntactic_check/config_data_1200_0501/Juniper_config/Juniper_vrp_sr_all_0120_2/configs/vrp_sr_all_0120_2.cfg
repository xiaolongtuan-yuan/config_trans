set system host-name DeviceC

set protocols mpls label-switched-path <replace_with_lsp_name> to <replace_with_destination>
set protocols ldp

set protocols isis interface all
set protocols isis level 1 wide-metrics-only
set protocols isis disable level-2
set protocols isis traffic-engineering
set protocols isis segment-routing global-block 16000 23999
set protocols isis segment-routing prefix-sid index 30

set interfaces ge-0/0/0 unit 0 family inet address 10.2.1.2/24
set interfaces ge-0/0/0 unit 0 family iso
set protocols isis interface ge-0/0/0.0

set interfaces ge-0/0/1 unit 0 family inet address 10.3.1.1/24
set interfaces ge-0/0/1 unit 0 family iso
set interfaces ge-0/0/1 unit 0 family inet address 10.3.1.1/24 iso level-1 metric 100
set protocols isis interface ge-0/0/1.0

set interfaces lo0 unit 1 family inet address 3.3.3.9/32
set interfaces lo0 unit 1 family iso
set protocols isis interface lo0.1

set routing-options router-id 3.3.3.9