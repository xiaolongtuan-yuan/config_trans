# 设置主机名
set system host-name P1

# 配置MPLS LDP的Router ID
set protocols ldp router-id 172.16.1.2  # 假设Loopback0是 172.16.1.2

# 启用MPLS的流量工程（Traffic Engineering）
set protocols mpls traffic-engineering

# 设置MPLS标签协议为LDP
set protocols mpls label-switched-path lsp-to-egress path 1
set protocols ldp interface all

# 配置ISIS协议及相关的设置
set protocols isis level 2 wide-metrics-only
set protocols isis level 2 segment-routing mpls
set protocols isis interface lo0.0 passive
set protocols isis interface ge-0/0/0.0 point-to-point
set protocols isis interface ge-0/0/1.0 point-to-point
set protocols isis level 2 area-id 49.0000.0000.0000.0002

# 接口配置：GigabitEthernet1/0/0
set interfaces ge-0/0/0 unit 0 family inet address 172.16.1.2/24
set interfaces ge-0/0/0 unit 0 family iso
set interfaces ge-0/0/0 enable
set interfaces ge-0/0/0 unit 0 point-to-point

# 接口配置：GigabitEthernet2/0/0
set interfaces ge-0/0/1 unit 0 family inet address 172.17.1.1/24
set interfaces ge-0/0/1 unit 0 family iso
set interfaces ge-0/0/1 enable
set interfaces ge-0/0/1 unit 0 point-to-point

# 接口配置：Loopback1
set interfaces lo0 unit 1 family inet address 2.2.2.9/32