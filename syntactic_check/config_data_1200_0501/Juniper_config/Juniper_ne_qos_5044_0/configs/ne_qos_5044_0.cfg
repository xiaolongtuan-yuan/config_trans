set interfaces ge-0/0/3 unit 1 encapsulation vlan-ccc
set interfaces ge-0/0/3 unit 1 vlan-id 11
set interfaces ge-0/0/3 unit 1 family inet address 10.192.167.2/24
set interfaces ge-0/0/3 unit 1 input-vlan-map customer-vlan-translate
set interfaces ge-0/0/3 unit 1 output-vlan-map customer-vlan-translate

set class-of-service interfaces ge-0/0/3 unit 1 classifiers dscp dscp-default
set class-of-service interfaces ge-0/0/3 unit 1 classifiers IEEE-802.1p default
set class-of-service interfaces ge-0/0/3 unit 1 classifiers mf-classifier qos1
set class-of-service interfaces ge-0/0/3 unit 1 rewrite-rules ieee-802.1 rewrite-default

set protocols mpls interface ge-0/0/3.1
set protocols ldp interface ge-0/0/3.1

set interfaces ge-0/0/1 unit 1 encapsulation vlan-ccc
set interfaces ge-0/0/1 unit 1 vlan-id 1
set interfaces ge-0/0/1 unit 1 family inet address 10.192.168.1/24
set class-of-service interfaces ge-0/0/1 unit 1 input classifiers ieee-802.1 default trust-vlan-802.1
set class-of-service interfaces ge-0/0/1 unit 1 output scheduler-map qos1

set interfaces ge-0/0/2 unit 1 encapsulation vlan-ccc
set interfaces ge-0/0/2 unit 1 vlan-id 2
set interfaces ge-0/0/2 unit 1 family inet address 10.2.1.1/24
set class-of-service interfaces ge-0/0/2 unit 1 input classifiers ieee-802.1 default trust-vlan-802.1
set class-of-service interfaces ge-0/0/2 unit 1 output scheduler-map qos2

set class-of-service forwarding-class qos1 code-point ieee-802.1p 5
set class-of-service forwarding-class qos2 code-point ieee-802.1p 5

set policy-options policy-statement qos1-default term class-default then forwarding-class qos1
set policy-options policy-statement qos2-default term class-default then forwarding-class qos2

set class-of-service schedulers qos1 priority high transmit-rate percent 0
set class-of-service schedulers qos2 transmit-rate percent 100