set system host-name P

set protocols mpls label-switched-path <path-name> ldp

delete interfaces ge-0/0/1 disable
set interfaces ge-0/0/1 unit 0 family inet address 192.168.1.2/24
set protocols mpls interface ge-0/0/1

delete interfaces ge-0/0/2 disable
set interfaces ge-0/0/2 unit 0 family inet address 192.168.2.1/24
set protocols mpls interface ge-0/0/2

set interfaces lo0 unit 1 family inet address 2.2.2.9/32

set protocols ospf area 0 interface lo0.1
set protocols ospf area 0 interface ge-0/0/1
set protocols ospf area 0 interface ge-0/0/2