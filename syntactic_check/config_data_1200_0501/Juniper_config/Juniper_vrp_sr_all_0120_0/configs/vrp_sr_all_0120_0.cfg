set system host-name DeviceA

set protocols ldp interface all
set protocols ldp track-ipv4 loopback force

set protocols mpls
set protocols mpls interface all

set routing-options static route 160.20.0.0/32 next-hop [ 160.50.0.0 160.60.0.0 ]

set protocols isis level 1
set protocols isis interface all
set protocols isis level 1 metric 10
set protocols isis level 1 wide-metrics-only
set protocols isis level 1 traffic-engineering
set protocols isis level 1 segment-routing-mpls
set protocols isis segment-routing-global-block 16000 23999

set interfaces ge-0/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-0/0/0 unit 0 family mpls

set interfaces lo0 unit 1 family inet address 1.1.1.9/32

set interfaces sp-0/0/0 unit 0 tunnel source 1.1.1.9
set interfaces sp-0/0/0 unit 0 tunnel destination 6.6.6.9
set interfaces sp-0/0/0 unit 0 family inet
set protocols mpls interface sp-0/0/0
set protocols traffic-engineering path p1 strict-hop 160.20.0.0 strict-hop 160.50.0.0 strict-hop 160.60.0.0

set protocols mpls label-switched-path lsp-to-6.6.6.9 to 6.6.6.9
set protocols mpls label-switched-path lsp-to-6.6.6.9 primary path p1