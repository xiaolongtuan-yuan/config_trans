set system host-name PE2

set interfaces ge-0/0/0 unit 0 family inet address 10.10.3.4/24
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces lo0 unit 0 family inet address 4.4.4.4/32
set interfaces ge-0/0/0 unit 10 encapsulation vlan-ccc vlan-id 10

set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf parameters router-id 4.4.4.4

set protocols ldp transport-address 4.4.4.4
set protocols ldp interface ge-0/0/0.0

set routing-instances v1 instance-type vpls
set routing-instances v1 interface ge-0/0/0.10
set routing-instances v1 route-distinguisher 10.10.3.4:1
set routing-instances v1 vrf-target target:100:1
set routing-instances v1 vrf-target import target:100:1
set routing-instances v1 vrf-target export target:100:1
set routing-instances v1 protocols vpls site local site-identifier 1

set protocols l2circuit neighbor 3.3.3.3 interface ge-0/0/0.10 virtual-circuit-id 1

set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 4.4.4.4
set protocols bgp group ibgp neighbor 3.3.3.3
set protocols bgp group ibgp family inet-vpn unicast
set protocols bgp group ibgp family l2vpn signaling
set protocols bgp group ibgp export bgp-l3vpn-export
set policy-options policy-statement bgp-l3vpn-export term default then accept

set protocols mpls traffic-engineering interface ge-0/0/0.0
set protocols mpls traffic-engineering mpls-path path1
set protocols mpls traffic-engineering mpls-path path1 no-cspf
set protocols mpls traffic-engineering mpls-path path1 metric 1