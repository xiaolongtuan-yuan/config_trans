# 设置主机名
set system host-name LSRB

# 配置接口
set interfaces ge-1/0/1 unit 0 family inet address 10.1.2.1/24
set interfaces ge-1/0/3 unit 0 family inet address 10.1.1.2/24
set interfaces lo0 unit 0 family inet address 2.2.2.9/32

# 启用MPLS
set protocols mpls interface ge-1/0/1.0
set protocols mpls interface ge-1/0/3.0

# 配置LDP Router ID
set protocols ldp router-id 2.2.2.9

# 配置OSPF
set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-1/0/1.0
set protocols ospf area 0.0.0.0 interface ge-1/0/3.0