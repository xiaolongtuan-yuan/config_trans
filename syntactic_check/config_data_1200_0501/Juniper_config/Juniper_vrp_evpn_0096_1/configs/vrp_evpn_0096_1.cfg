set system host-name ASBR1

set protocols ldp interface all
set protocols ldp transport-address interface-address

set interfaces ge-1/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces ge-1/0/0 unit 0 family mpls

set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-2/0/0 unit 0 family mpls

set interfaces lo0 unit 1 family inet address 2.2.2.2/32

set protocols bgp group internal type internal
set protocols bgp group internal local-address 2.2.2.2
set protocols bgp group internal neighbor 1.1.1.1 peer-as 100
set protocols bgp group internal allow 0.0.0.0/0

set protocols bgp group external type external
set protocols bgp group external neighbor 10.2.1.2 peer-as 200
set protocols bgp group external allow 0.0.0.0/0

set policy-options policy-statement policy1 term 1 from route-filter 0.0.0.0/0 exact
set policy-options policy-statement policy1 term 1 then accept

set policy-options policy-statement policy2 term 1 from route-filter 0.0.0.0/0 exact
set policy-options policy-statement policy2 term 1 then accept

set protocols bgp group internal export policy2
set protocols bgp group external export policy1

set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0