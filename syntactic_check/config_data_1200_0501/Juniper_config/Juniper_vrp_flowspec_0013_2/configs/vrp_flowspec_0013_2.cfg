set system host-name FlowRR

set interfaces ge-1/0/0 unit 0 family inet address 10.3.1.1/24
set interfaces ge-2/0/0 unit 0 family inet address 10.2.1.1/24
set interfaces ge-3/0/0 unit 0 family inet address 10.1.1.1/24
set interfaces lo0 unit 1 family inet address 3.3.3.3/32

set protocols bgp group internal-peers type internal
set protocols bgp group internal-peers local-address 3.3.3.3
set protocols bgp group internal-peers neighbor 1.1.1.1 peer-as 100
set protocols bgp group internal-peers neighbor 1.1.1.1 family inet unicast
set protocols bgp group internal-peers neighbor 1.1.1.1 family inet multicast
set protocols bgp group internal-peers neighbor 1.1.1.1 route-reflector-client
set protocols bgp group internal-peers neighbor 2.2.2.2 peer-as 100
set protocols bgp group internal-peers neighbor 2.2.2.2 family inet unicast
set protocols bgp group internal-peers neighbor 2.2.2.2 family inet multicast
set protocols bgp group internal-peers neighbor 2.2.2.2 route-reflector-client
set protocols bgp group internal-peers neighbor 10.2.1.2 peer-as 100
set protocols bgp group internal-peers neighbor 10.2.1.2 family inet unicast
set protocols bgp group internal-peers neighbor 10.2.1.2 family inet multicast
set protocols bgp group internal-peers neighbor 10.2.1.2 route-reflector-client

set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf area 0.0.0.0 interface ge-1/0/0.0
set protocols ospf area 0.0.0.0 interface ge-2/0/0.0
set protocols ospf area 0.0.0.0 interface ge-3/0/0.0
set protocols ospf area 0.0.0.0 interface lo0.0 passive

set routing-options router-id 3.3.3.3