set system host-name DeviceE
set protocols pim rp local 192.168.2.2
set protocols isis interface ge-1/0/0.0 point-to-point
set protocols isis interface ge-2/0/0.0 point-to-point
set protocols isis interface ge-3/0/0.0 point-to-point
set protocols isis interface ge-1/0/1.0 point-to-point
set routing-options multicast worldwide-fast-reroute

set interfaces ge-1/0/0 unit 0 family inet address 192.168.3.2/24
set interfaces ge-1/0/0 unit 0 family inet filter input 2000
set protocols pim interface ge-1/0/0.0 mode sparse

set interfaces ge-2/0/0 unit 0 family inet address 192.168.2.2/24
set interfaces ge-2/0/0 unit 0 family inet filter input 2001
set protocols pim interface ge-2/0/0.0 mode sparse

set interfaces ge-3/0/0 unit 0 family inet address 192.168.9.2/24
set protocols pim interface ge-3/0/0.0 mode sparse

set interfaces ge-1/0/1 unit 0 family inet address 192.168.4.1/24
set protocols pim interface ge-1/0/1.0 mode sparse
set protocols pim bsr border
set protocols pim bsr candidate interface ge-2/0/0.0

set policy-options policy-statement 2000 from route-filter 10.110.5.0/24 orlonger
set policy-options policy-statement 2000 then accept

set policy-options policy-statement 2001 from route-filter 192.168.2.0/24 orlonger
set policy-options policy-statement 2001 then accept

set policy-options policy-statement 3000 from route-filter 224.0.0.0/4 prefix-length-range /4-/20
set policy-options policy-statement 3000 then accept

set policy-options policy-statement 3001 from route-filter 225.1.1.0/24 orlonger
set policy-options policy-statement 3001 then accept

set protocols pim rp candidate interface ge-2/0/0.0 address 192.168.2.2