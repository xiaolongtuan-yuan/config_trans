set system host-name CE2

set interfaces ge-1/0/0 unit 0 family inet address 10.3.1.2/30
set interfaces ge-1/0/0 disable

set interfaces ge-2/0/0 unit 0 family inet address 10.4.1.2/30
set interfaces ge-2/0/0 disable

set interfaces lo0 unit 1 family inet address 22.22.22.22/32

set protocols bgp group external-peers type external
set protocols bgp group external-peers peer-as 100
set protocols bgp group external-peers neighbor 10.3.1.1
set protocols bgp group external-peers neighbor 10.4.1.1

set protocols bgp group external-peers family inet unicast
set protocols bgp group external-peers export announce-lo0
set policy-options policy-statement announce-lo0 term 1 from protocol direct
set policy-options policy-statement announce-lo0 term 1 from interface lo0.1
set policy-options policy-statement announce-lo0 term 1 then accept

set policy-options policy-statement announce-lo0 term 2 then reject