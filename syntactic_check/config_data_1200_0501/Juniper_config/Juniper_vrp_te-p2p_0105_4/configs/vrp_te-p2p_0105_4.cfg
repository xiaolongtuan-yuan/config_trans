set system host-name LSRE

set protocols mpls label-switched-path protocol ldp

set protocols mpls traffic-engineering

set protocols isis level 2

set protocols isis level 2 wide-metrics-only

set protocols isis level 2 traffic-engineering

set interfaces ge-1/0/0 unit 0 family inet address 3.2.1.2/24
set interfaces ge-1/0/0 unit 0 disable
set protocols isis interface ge-1/0/0 point-to-point
set protocols mpls interface ge-1/0/0
set protocols mpls traffic-engineering interface ge-1/0/0

set interfaces ge-2/0/0 unit 0 family inet address 3.3.1.1/24
set interfaces ge-2/0/0 unit 0 disable
set protocols isis interface ge-2/0/0 point-to-point
set protocols mpls interface ge-2/0/0
set protocols mpls traffic-engineering interface ge-2/0/0

set interfaces lo0 unit 1 family inet address 5.5.5.5/32

set routing-options router-id 5.5.5.5

set protocols ospf area 0 interface lo0.1
set protocols ospf traffic-engineering
set protocols mpls traffic-engineering router-id lo0.1