set system host-name Device1

set routing-instances evrf1 instance-type evpn
set routing-instances evrf1 route-distinguisher 10:1
set routing-instances evrf1 vrf-target target:11:1
set routing-instances evrf1 vrf-target target:11:1 import

set bridge-domains bd10 domain-type bridge
set bridge-domains bd10 vxlan vni 10
set bridge-domains bd10 interface ae0.10

set interfaces ge-0/0/0 unit 0 family ethernet-switching port-mode trunk

set interfaces ge-0/0/0 unit 10 family ethernet-switching vlan-id 10

set interfaces ge-0/0/1 unit 0 family inet address 192.168.40.2/24

set interfaces lo0 unit 1 family inet address 5.5.5.5/32

set interfaces lt-0/0/0 unit 0 encapsulation vxlan
set interfaces lt-0/0/0 unit 0 family inet address 239.1.1.1/32

set protocols bgp group ibgp type internal
set protocols bgp group ibgp local-address 5.5.5.5
set protocols bgp group ibgp neighbor 4.4.4.4 peer-as 65410
set protocols bgp group ibgp family inet unicast
set protocols bgp group ebgp type external
set protocols bgp group ebgp peer-as 65420
set protocols bgp group ebgp local-address 5.5.5.5
set protocols bgp group ebgp neighbor 6.6.6.6 peer-as 65420
set protocols bgp group ebgp family inet unicast
set protocols bgp group ebgp family evpn signaling
set protocols bgp group ebgp export send-community
set protocols bgp group ebgp export keep-nexthop
set protocols bgp group ebgp export encapsulation vxlan

set protocols ospf area 0.0.0.0 interface lo0.1
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
