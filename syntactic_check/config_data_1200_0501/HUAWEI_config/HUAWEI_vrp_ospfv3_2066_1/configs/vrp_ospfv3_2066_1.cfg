#
sysname DeviceA
#
 bfd
#
interface GigabitEthernet1/0/0
 undo shutdown
 ipv6 enable
 ipv6 address 2001:db8:1000::2 255.255.255.0
 ospfv3 cost 5
#
interface GigabitEthernet2/0/0
 undo shutdown
 ipv6 enable
 ipv6 address 2001:db8:2000::2 255.255.255.0
 ospfv3 cost 5
#
ospfv3 1
 router-id 2.2.2.2
 bfd all-interfaces enable
 bfd all-interfaces frr-binding
 frr
  loop-free-alternate
 area 0.0.0.1
#
return
