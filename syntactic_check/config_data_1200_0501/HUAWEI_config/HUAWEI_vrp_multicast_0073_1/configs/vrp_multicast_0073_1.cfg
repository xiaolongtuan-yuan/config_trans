#
sysname DeviceC
#
multicast routing-enable
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 192.168.2.2 255.255.255.0
 pim bsr-boundary
 pim sm
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 192.168.3.1 255.255.255.0
 pim sm
#
interface GigabitEthernet3/0/0
 undo shutdown
 ip address 192.168.4.1 255.255.255.0
 pim bsr-boundary
 pim sm
#
interface LoopBack0
 ip address 2.2.2.2 255.255.255.255
 pim sm
#
pim
 c-bsr LoopBack0
 c-rp LoopBack0
#
ospf 1
 import-route BGP
 area 0.0.0.0
  network 192.168.3.0 0.0.0.255
  network 192.168.4.0 0.0.0.255
  network 2.2.2.2 0.0.0.0
#
bgp 200
 router-id 2.2.2.2
 peer 192.168.2.1 as-number 100
 peer 192.168.2.1 ebgp-max-hop 255
 #
 ipv4-family unicast
  import-route ospf 1
  peer 192.168.2.1 enable
  peer 192.168.2.1 route-update-interval 0
#
msdp
 peer 192.168.2.1 connect-interface GigabitEthernet1/0/0
 peer 192.168.2.1 mesh-group group1
 peer 192.168.4.2 connect-interface GigabitEthernet3/0/0
 peer 192.168.4.2 mesh-group group1
#
return
