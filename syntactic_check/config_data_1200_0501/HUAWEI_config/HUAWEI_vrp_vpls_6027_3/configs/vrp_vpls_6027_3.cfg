#
sysname ASBR2
#
mpls lsr-id 3.3.3.3
mpls
#
mpls l2vpn
#
vsi v1
 pwsignal ldp
  vsi-id 2
  peer 4.4.4.4
#
mpls ldp
#
interface GigabitEthernet1/0/0
 undo shutdown
#
interface GigabitEthernet1/0/0.1
 undo shutdown
 vlan-type dot1q 10
 l2 binding vsi v1
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 10.20.1.1 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack1
 ip address 3.3.3.3 255.255.255.255
#
ospf 1
 area 0.0.0.0
  network 3.3.3.3 0.0.0.0
  network 10.20.1.0 0.0.0.255
#
return
