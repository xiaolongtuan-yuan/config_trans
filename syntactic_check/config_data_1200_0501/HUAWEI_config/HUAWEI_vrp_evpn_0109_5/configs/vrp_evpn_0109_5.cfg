#
sysname CE2
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip address 192.168.2.2 255.255.255.0
#
interface LoopBack1
 ip address 10.20.20.20 255.255.255.255
#
bgp 65420
 peer 192.168.2.1 as-number 200
 #
 ipv4-family unicast
  undo synchronization
  import-route direct
  peer 192.168.2.1 enable
#
return
