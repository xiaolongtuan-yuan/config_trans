#
 sysname PE4
#
ip vpn-instance vpn1
 ipv6-family
  route-distinguisher 100:2
  apply-label per-route
  vpn-target 1:1 export-extcommunity
  vpn-target 1:1 import-extcommunity
#
 ipv6
#
 mpls lsr-id 6.6.6.9
 mpls
#
mpls ldp
#
interface GigabitEthernet1/0/0
 undo shutdown
 ip binding vpn-instance vpn1
 ipv6 enable
 ipv6 address 2001:db8:2::2/64
#
interface GigabitEthernet2/0/0
 undo shutdown
 ip address 10.2.1.2 255.255.255.0
 mpls
 mpls ldp
#
interface LoopBack1
 ip address 6.6.6.9 255.255.255.255
#
bgp 300
 peer 5.5.5.9 as-number 300
 peer 5.5.5.9 connect-interface LoopBack1
 peer 1.1.1.9 as-number 200
 peer 1.1.1.9 ebgp-max-hop 10
 peer 1.1.1.9 connect-interface LoopBack1
 #
 ipv4-family unicast
  undo synchronization
  peer 5.5.5.9 enable
  peer 5.5.5.9 label-route-capability
  peer 1.1.1.9 enable
 #
 ipv6-family vpnv6
  policy vpn-target
  peer 1.1.1.9 enable
#
ospf 1
 area 0.0.0.0
  network 6.6.6.9 0.0.0.0
  network 10.2.1.0 0.0.0.255
 #
 ipv6-family vpn-instance vpn1
  peer 2001:db8:2::1 as-number 65420
  import-route direct
#
return
